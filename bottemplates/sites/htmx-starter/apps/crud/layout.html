<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title} - General Bots</title>
    <script src="/_assets/htmx.min.js"></script>
    <link rel="stylesheet" href="/_assets/styles.css">
    <link rel="stylesheet" href="crud.css">
    <link rel="stylesheet" href="crud-modals.css">
</head>
<body>
    <div class="container">
        <!-- Page Header -->
        <header class="page-header">
            <div></div>
                <h1 class="page-title">${title}</h1>
                <p class="page-subtitle">${subtitle}</p>
            </div>
            <button class="btn btn-primary" onclick="openModal('add-modal')">
                ➕ Add New
            </button>
        </header>

        <!-- Toolbar -->
        <div class="toolbar">
            <input type="search"
                   class="search-input"
                   name="q"
                   placeholder="Search..."
                   hx-get="/api/data/${table}"
                   hx-trigger="keyup changed delay:300ms"
                   hx-target="#data-list"
                   hx-include="[name='status-filter']">

            <select name="status-filter"
                    class="filter-select"
                    hx-get="/api/data/${table}"
                    hx-trigger="change"
                    hx-target="#data-list"
                    hx-include="[name='q']">
                <option value="">All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>

            <button class="btn btn-secondary"
                    hx-get="/api/data/${table}"
                    hx-target="#data-list">
                🔄 Refresh
                <span class="htmx-indicator spinner"></span>
            </button>
        </div>

        <!-- Data Table -->
        <div class="card">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th></th></th>
                    </tr>
                </thead>
                <tbody id="data-list"
                       hx-get="/api/data/${table}"
                       hx-trigger="load"
                       hx-swap="innerHTML">
                    <tr>
                        <td colspan="5" class="empty-state">
                            <span class="spinner"></span> Loading...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="add-modal" class="modal">
        <div class="modal-backdrop" onclick="closeModal('add-modal')"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Add New Item</h3>
                <button class="modal-close" onclick="closeModal('add-modal')">×</button>
            </div>
            <form hx-post="/api/data/${table}"
                  hx-target="#data-list"
                  hx-swap="afterbegin"
                  hx-on::after-request="closeModal('add-modal'); showToast('Item created successfully')">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-input">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('add-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        Save
                        <span class="htmx-indicator spinner"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- data-table carries the server-side ${table} value the extracted JS builds URLs from -->
    <script src="crud.js" data-table="${table}"></script>
</body>
</html>
