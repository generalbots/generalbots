# --- cost model and regression policy (#2115) ------------------------------
pricing:
  currency: USD
  models:
    mock:
      input: 0.0
      output: 0.0
    gpt-4o-mini:
      input: 0.15
      output: 0.60
    claude-sonnet:
      input: 3.0
      output: 15.0

cost_budgets:
  conversation_usd: 0.01
  tenant_day_usd: 10.0
  alert_at_pct: 80

baseline_policy:
  regression_max_pct: 20
