# ops/slo.yaml — SLO targets, error budgets and burn-rate alert policy.
#
# Single source of truth for the operational view of the Analytics app
# (#2116) and for the alerts described in
# botbook/src/10-configuration-deployment/operations/README.md.
#
# Shape: a flat key/value YAML map (the parser in
# botserver/crates/botanalytics/src/ops_slo.rs reads this subset without a YAML
# dependency). Issue #2115 owns this directory; until it lands, the same values
# are compiled in as the fallback in `SloConfig::defaults()` and the dashboard
# prints which source it used.
#
# objective.<id>.metric       latency_histogram | error_rate | llm_first_token
#                             | llm_answer | ws_handshake
# objective.<id>.target       required good ratio in (0,1); budget = 1 - target
# objective.<id>.threshold_ms latency objectives only; latency_histogram
#                             thresholds must sit on a histogram boundary
#                             (50, 100, 250, 500, 1000, 2500, 5000 ms)
# objective.<id>.source       snapshot metric that measures the objective
#                             (`turn.error_pct`, `rest.api_ms`, …). The id is
#                             the dashboard name and stays stable; the source is
#                             the name the load adapter and the baselines use.
#                             Defaults to the id when absent.
# objective.<id>.runbook      path inside botbook, linked from the panel
# objective.<id>.panel        dashboard anchor that explains the objective
#
# Two consumers read this file. `botanalytics::ops_slo` builds the dashboard
# from `metric`/`target`/`threshold_ms` and ignores `source`. The CI gate
# (`scripts/check_slo.py` via `scripts/slo_common.py`) expands each objective
# into a budget: latency objectives compare the p95 in milliseconds against
# `threshold_ms`, rate objectives compare a bad-event percentage against
# `(1 - target) * 100`.
#
# Burn windows: 1 h, 6 h, 3 d. Alert when a window crosses its threshold:
# fast >= 14.4x (page), medium >= 6x (page), slow >= 1x (ticket). The same
# rules are documented in the on-call section of the operations README.

version: 1
window_days: 30
owner: platform-oncall

objective.api_p95.metric: latency_histogram
objective.api_p95.source: rest.api_ms
objective.api_p95.threshold_ms: 500
objective.api_p95.target: 0.95
objective.api_p95.runbook: botbook/src/10-configuration-deployment/operations/runbook-disk-and-queue.md
objective.api_p95.panel: ops-endpoints

objective.error_rate.metric: error_rate
objective.error_rate.source: turn.error_pct
objective.error_rate.target: 0.99
objective.error_rate.runbook: botbook/src/10-configuration-deployment/operations/runbook-deploy-rollback.md
objective.error_rate.panel: ops-endpoints

objective.first_token_p95.metric: llm_first_token
objective.first_token_p95.source: chat.first_token_ms
objective.first_token_p95.threshold_ms: 2000
objective.first_token_p95.target: 0.95
objective.first_token_p95.runbook: botbook/src/10-configuration-deployment/operations/runbook-llm-outage.md
objective.first_token_p95.panel: ops-cost

objective.answer_p95.metric: llm_answer
objective.answer_p95.source: chat.complete_ms
objective.answer_p95.threshold_ms: 15000
objective.answer_p95.target: 0.95
objective.answer_p95.runbook: botbook/src/10-configuration-deployment/operations/runbook-llm-outage.md
objective.answer_p95.panel: ops-cost

objective.ws_handshake.metric: ws_handshake
objective.ws_handshake.source: ws.unexpected_disconnect_pct
objective.ws_handshake.target: 0.99
objective.ws_handshake.runbook: botbook/src/10-configuration-deployment/operations/runbook-disable-tenant.md
objective.ws_handshake.panel: ops-traffic

alert.fast_burn: 14.4
alert.medium_burn: 6
alert.slow_burn: 1

