# Supply-chain policy for the General Bots workspace (cargo-deny).
#
# This file is the single source of truth for the `advisories`, `bans`,
# `licenses` and `sources` gates that run in `.github/workflows/security.yml`.
# It is validated locally with:
#
#   cargo deny --all-features check advisories bans licenses sources
#
# The project itself is MIT (see LICENSE). Third-party binaries we *bundle*
# (MinIO, Stalwart, Forgejo, Garage, Skytable) keep their own AGPL notices in
# LICENSES-desktop.md / 3rdparty.toml — they are not Rust dependencies and are
# therefore out of scope for this file.
#
# The two office-document crates (`docx-rs`, `umya-spreadsheet`) are vendored
# under `3rdparty/` as path dependencies with only their `zip` requirement
# raised to 9.x, so no pre-9 zip remains in the graph. They are local path
# dependencies, not git sources; see the header of each vendored Cargo.toml for
# the removal condition.

[graph]
all-features = true

[advisories]
version = 2
# Vulnerabilities and yanked crates always fail. Unmaintained / unsound
# advisories are checked for the whole graph and, once triaged, pinned in
# `ignore` with a date and a reason so a *new* one still fails CI (#1726).
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Accepted risk entries. Each one carries a date and a reason, and must be
# re-validated at least once per year (see SECURITY.md -> Residual risk).
# Entries are ID-only and dated. If a dependency upgrade fixes the advisory it
# disappears from the report, so the entry becomes visibly stale at the next
# review instead of silently inheriting the exception.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained (proc-macro, build time only). Accepted 2026-11-06, tracked in #2553." },
    { id = "RUSTSEC-2024-0429", reason = "Unsound Iterator/DoubleEndedIterator impls in glib 0.18 (transitive via the Tauri GTK desktop stack on Linux). Fixed by the GTK4 stack upgrade on the desktop track; no runtime exposure on the server. Accepted 2026-11-06, tracked in #2553." },
    { id = "RUSTSEC-2026-0249", reason = "smartstring is unmaintained and still required by rhai 1.27 (transitive only — no code in this repo names it). Accepted 2026-11-06, direct uses removed under #2552; the ignore retires when rhai drops it." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained (D-Bus wire format, transitive via zbus 5 -> tauri-plugin-notification on the Linux desktop). No safe upgrade until Tauri ships zbus 6; no server runtime exposure. Accepted 2026-11-19, tracked in #2553." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained (same zbus 5 -> tauri-plugin-notification chain on the Linux desktop). No safe upgrade until Tauri ships zbus 6. Accepted 2026-11-19, tracked in #2553." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained (its derive macros moved into zbus 6; transitive via zbus 5 -> tauri-plugin-notification on the Linux desktop). Accepted 2026-11-19, tracked in #2553." },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained and used across the workspace for date arithmetic. Unmaintained only — no vulnerability, so no exploit path; migration to jiff/time is a separate project. Accepted 2026-11-19, tracked in #2553." },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained (IANA timezone data for botsettings, paired with chrono). Migration is part of the chrono replacement. Accepted 2026-11-19, tracked in #2553." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]
# Permissive licenses that are not on the default allow list above. They are
# scoped to the exact crate that needs them instead of being globally allowed.
exceptions = [
    { allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys" },
    { allow = ["0BSD"], crate = "mailparse" },
    { allow = ["0BSD"], crate = "quoted_printable" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # rustls-platform-verifier 0.7 pulls the Mozilla root store as
    # `webpki-root-certs` (a different crate from `webpki-roots`); CDLA
    # Permissive 2.0 is a permissive data license, no code linking.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
    { allow = ["WTFPL"], crate = "ole" },
]

[bans]
# 90 duplicate transitive versions exist today; they are tracked, not blocking.
multiple-versions = "warn"
# Internal workspace crates are declared as path-only dependencies
# (`botagent = { path = "botserver/crates/botagent" }`), which cargo-deny
# reports as wildcards. They cannot resolve outside this repository, so this
# stays a warning instead of a hard failure.
wildcards = "warn"
# cargo-deny 0.20.2 bug #908: with `allow-wildcard-paths = false`, every path
# dep inherited via `workspace = true` also emits a spurious
# `bug[unresolved-workspace-dependency]` diagnostic because the span lookup uses
# the depending crate's id. Path deps can only resolve inside this repo, so
# allowing them is correct and silences the false positives.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
