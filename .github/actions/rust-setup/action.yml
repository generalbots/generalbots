name: Rust setup
description: Install the Linux build dependencies, the stable Rust toolchain and the shared Cargo cache.

inputs:
  cache-scope:
    description: Job/scope used for the target cache key (for example unit-tests).
    required: true
  packages:
    description: Linux packages installed before the Rust build. Ignored on Windows.
    required: false
    default: clang mold libpq-dev libssl-dev liblzma-dev pkg-config
  cache:
    description: Set to "false" to skip the Cargo cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y ${{ inputs.packages }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ inputs.cache-scope }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ inputs.cache-scope }}-
          ${{ runner.os }}-cargo-
