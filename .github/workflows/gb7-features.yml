name: GB7 feature contract

# #1704/#1795 — the GB7 comparison and test-script pages are published from
# the external site, not generated here. The guard fixtures are the blocking
# contract: the legacy page must be rejected and the updated page accepted.
# The live page at https://sites.pragmatismo.com.br/gb7features/ is still
# stale (#1795), so the live check reports drift without blocking CI until
# that external page is updated.
on:
  push:
    paths:
      - "scripts/gb7_features_check.py"
      - "scripts/fixtures/**"
      - ".github/workflows/gb7-features.yml"
  pull_request:
    paths:
      - "scripts/gb7_features_check.py"
      - "scripts/fixtures/**"
      - ".github/workflows/gb7-features.yml"
  schedule:
    # Daily: the site can change without a repository commit.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-contract:
    name: Verify the GB7 fixture contract
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run the guard self-test (blocking)
        run: |
          set -euo pipefail
          python3 --version
          python3 scripts/gb7_features_check.py --self-test

  live-page:
    name: Report live GB7 page drift (non-blocking)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the published page (non-blocking while #1795 is open)
        id: live
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 --version
          python3 scripts/gb7_features_check.py
      - name: Warn that the external page must be updated (#1795)
        if: steps.live.outcome == 'failure'
        run: |
          echo "::warning title=GB7 external page is stale::The published page at https://sites.pragmatismo.com.br/gb7features/ is stale and must be updated for https://github.com/generalbots/generalbots/issues/1795. This live check is non-blocking until that page is fixed."
          {
            echo "## GB7 external page drift (#1795)"
            echo
            echo "The published page at https://sites.pragmatismo.com.br/gb7features/ still drifts from the shipped contract."
            echo "Update the external site before closing [#1795](https://github.com/generalbots/generalbots/issues/1795)."
            echo "The fixture self-test remains the blocking gate; this live check is intentionally non-blocking while the site is stale."
          } >> "$GITHUB_STEP_SUMMARY"
