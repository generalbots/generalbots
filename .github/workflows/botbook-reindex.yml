name: BotBook reindex

# #1796 — botbook/book/ is generated and git-ignored. This job rebuilds the
# book from botbook/src on a clean runner, fails when the build produces no
# search index, and fails when SUMMARY.md points at a page that does not exist.
# It is the reindex gate for a docs change.
on:
  # Reusable from `.github/workflows/ci.yml`; existing triggers are preserved.
  workflow_call:
  push:
    paths:
      - "botbook/src/**"
      - "botbook/book.toml"
      - "scripts/botbook_reindex.sh"
      - ".github/workflows/botbook-reindex.yml"
  pull_request:
    paths:
      - "botbook/src/**"
      - "botbook/book.toml"
      - "scripts/botbook_reindex.sh"
      - ".github/workflows/botbook-reindex.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reindex:
    name: Verify the committed BotBook
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mdBook
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            -o /tmp/mdbook.tar.gz \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/mdbook.tar.gz -C /tmp
          install -m 0755 /tmp/mdbook /usr/local/bin/mdbook
          mdbook --version
      - name: Rebuild and compare
        run: |
          set -euo pipefail
          chmod +x scripts/botbook_reindex.sh
          ./scripts/botbook_reindex.sh
