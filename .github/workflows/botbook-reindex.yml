name: BotBook reindex

# #1796 — botbook/book/ is tracked so it can be served without a build step.
# A source edit that is not followed by `mdbook build` leaves the committed
# search index and pages stale. This job rebuilds the book on a clean runner
# and fails when the result differs from the committed tree.
on:
  push:
    paths:
      - "botbook/src/**"
      - "botbook/book.toml"
      - "scripts/botbook_reindex.sh"
      - ".github/workflows/botbook-reindex.yml"
  pull_request:
    paths:
      - "botbook/src/**"
      - "botbook/book.toml"
      - "scripts/botbook_reindex.sh"
      - ".github/workflows/botbook-reindex.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reindex:
    name: Verify the committed BotBook
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install mdBook
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            -o /tmp/mdbook.tar.gz \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/mdbook.tar.gz -C /tmp
          install -m 0755 /tmp/mdbook /usr/local/bin/mdbook
          mdbook --version
      - name: Rebuild and compare
        run: |
          set -euo pipefail
          chmod +x scripts/botbook_reindex.sh
          ./scripts/botbook_reindex.sh
