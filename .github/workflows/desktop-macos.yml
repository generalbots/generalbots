name: Desktop macOS

# Builds the macOS desktop bundle (.app + .dmg) on a GitHub-hosted arm64
# runner. Tauri cannot cross-compile macOS bundles, and macOS runners are free
# for public repositories, so this is the only practical build path.
#
# Trigger: manual dispatch, or every v* tag alongside `desktop-binaries.yml`.
# The job is best effort: the Linux installer is the supported artifact, so a
# macOS toolchain gap, a missing darwin component or an immutable release must
# never fail the whole release.
#
# Signing / notarization (optional, paid Apple Developer account):
#   Configure these repository secrets:
#     APPLE_CERTIFICATE             base64-encoded Developer ID .p12
#     APPLE_CERTIFICATE_PASSWORD    password for the .p12
#     APPLE_SIGNING_IDENTITY        "Developer ID Application: ..." (optional)
#     APPLE_ID                      Apple account used for notarization
#     APPLE_TEAM_ID                 Apple team identifier
#     APPLE_APP_SPECIFIC_PASSWORD   app-specific password for notarization
#   To enable signing, export them from the packaging step. tauri-cli reads
#   APPLE_PASSWORD (map APPLE_APP_SPECIFIC_PASSWORD to it), APPLE_ID and
#   APPLE_TEAM_ID, plus APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD.
#   Do not export empty values: tauri-cli treats an empty APPLE_CERTIFICATE as
#   a certificate to import. Without configured secrets the .dmg is unsigned;
#   Gatekeeper blocks the first launch and users bypass it once with:
#     xattr -dr com.apple.quarantine "/Applications/General Bots.app"
#   (or right-click the app -> Open). See desktop/macos/README.md.
#
# macOS runtime caveats (the wizard must report these as unavailable instead of
# failing provisioning; see desktop/macos/README.md):
#   - PostgreSQL, Valkey, MinIO/mc, Qdrant, Vault, Zitadel and llama.cpp have
#     no native darwin builds. Run the Linux service stack in a Linux VM or on
#     a remote Incus host (`incus remote add`).
#   - The BotModels darwin pythonbox is not published yet, so media tools are
#     unavailable.
#   - Agent VMs need a remote Incus endpoint; Incus cannot run containers
#     natively on macOS.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v6.7.0)."
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  macos:
    name: macOS app and dmg (arm64)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: macos-14
    timeout-minutes: 120
    # Best effort on purpose: macOS is an additive artifact and must not hide
    # the Linux installer from a release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable
          rustup target add aarch64-apple-darwin

      - name: Install libpq and OpenSSL
        run: |
          brew install libpq openssl@3 pkg-config
          {
            echo "PQ_LIB_DIR=$(brew --prefix libpq)/lib"
            echo "OPENSSL_DIR=$(brew --prefix openssl@3)"
            echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          } >> "$GITHUB_ENV"
          echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-

      - name: Build botserver (desktop-local)
        run: cargo build -p botserver --release --no-default-features --features desktop-local

      - name: Build botui
        run: cargo build -p botui --release

      - name: Build desktop shell
        run: cargo build -p botapp --release --features desktop-local,custom-protocol

      - name: Stage the botserver sidecar
        run: |
          set -euo pipefail
          # bundle.externalBin resolves with the target-triple suffix.
          mkdir -p botapp/binaries botserver/botserver-installers
          cp target/release/botserver botapp/binaries/botserver-aarch64-apple-darwin
          chmod +x botapp/binaries/botserver-aarch64-apple-darwin
          ls -lh botapp/binaries/botserver-aarch64-apple-darwin

      - name: Install Tauri bundler
        run: cargo install tauri-cli --version "^2" --locked

      - name: Package .app and .dmg
        run: |
          set -euo pipefail
          cd botapp
          cargo tauri build \
            --features desktop-local,custom-protocol \
            --config tauri.desktop-local.conf.json \
            --bundles dmg,app

      - name: Collect macOS artifacts
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg botapp/target/release/bundle/dmg/*.dmg)
          apps=(target/release/bundle/macos/*.app botapp/target/release/bundle/macos/*.app)
          if [ "${#dmgs[@]}" -eq 0 ]; then
            echo "::error::the bundler produced no .dmg"
            exit 1
          fi
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "::error::the bundler produced no .app"
            exit 1
          fi
          cp "${dmgs[0]}" "dist/generalbots-${TAG}-macos-arm64.dmg"
          # GitHub release assets are files, so the raw .app is zipped.
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" \
            "dist/generalbots-${TAG}-macos-arm64.app.zip"
          (cd dist && shasum -a 256 ./* > SHA256SUMS-macos)
          ls -lh dist

      - name: Upload macOS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-installer
          path: dist/*
          if-no-files-found: error

  release-macos:
    name: Attach macOS artifacts to the release
    needs: [macos]
    runs-on: ubuntu-latest
    # Best effort: a failed/absent macOS build, or an immutable release, must
    # not turn a green release red.
    continue-on-error: true
    if: ${{ always() && github.server_url == 'https://github.com' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Download macOS installer
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-installer
          path: dist

      - name: Publish macOS assets
        if: ${{ hashFiles('dist/*.dmg') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Never rewrite the release notes: `gh release upload` attaches files
          # only. Releases with immutability enabled reject the upload, which is
          # tolerated by the job-level continue-on-error.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # The Linux release job may create the same release concurrently.
            # Fall back to an upload when create loses that race.
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes "macOS arm64 desktop bundle (unsigned): $TAG" \
              --latest=false ||
              gh release upload "$TAG" dist/* --clobber
          fi
