name: Product profile contract

# #1811 — the build compiles every app; the `.product` files are the only
# always/preview/hidden split. This gate fails when a profile references an
# unknown app, classifies an app twice or not at all, or asks for an app whose
# Cargo feature is not part of the default/desktop build.
on:
  # Reusable from `.github/workflows/ci.yml`; direct triggers are preserved.
  workflow_call:
  push:
    paths:
      - "botserver/.product"
      - "botserver/.product.desktop-local"
      - "botserver/Cargo.toml"
      - "botserver/src/apps/registry/**"
      - "scripts/product_profile_check.py"
      - ".github/workflows/product-profile.yml"
  pull_request:
    paths:
      - "botserver/.product"
      - "botserver/.product.desktop-local"
      - "botserver/Cargo.toml"
      - "botserver/src/apps/registry/**"
      - "scripts/product_profile_check.py"
      - ".github/workflows/product-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify product profiles
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check always/preview/hidden classification and features
        run: |
          set -euo pipefail
          python3 --version
          python3 scripts/product_profile_check.py
