name: gblite release

# Dedicated Windows MSI for the Lite edition, built from the gblite pipeline:
# same features (chat, drive, settings, llm, vectordb, consent, agent-vm,
# web-search, embed-ui + custom-protocol), same Tauri config and product name
# "General Bots Lite" (botapp/tauri.gblite.conf.json), same bundle identifier.
#
# Any tag matching `gblite-v<major>.<minor>.<patch>` (for example
# `gblite-v1.0.0`, `gblite-v1.0.1`, `gblite-v2.3.4`) builds and publishes a
# stable release. Manual dispatch computes the next version from the existing
# `gblite-v*` tags using the requested `bump`; it builds and tests the same
# files, keeps them as artifacts and never creates a release.
#
# Every release carries a stable download alias:
# https://github.com/generalbots/generalbots/releases/latest/download/generalbots-gblite-windows-x64.msi

on:
  push:
    tags: ["gblite-v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for a manual build (none, patch, minor, major)"
        required: true
        default: patch
        type: choice
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: gblite-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GBLITE_FEATURES: gblite
  TARGET_TRIPLE: x86_64-pc-windows-msvc
  # GBLITE_TAG / GBLITE_VERSION are resolved from the tag (or the bump input)
  # by the "Resolve the edition version" step below.

jobs:
  build:
    name: Release build, offline payload, smoke, MSI
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      # `secrets` cannot be read in a step condition; this flag can.
      # SignPath approval is still pending: gblite builds are unsigned until a
      # repository variable GBLITE_SIGN=true is set explicitly.
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT != '' && vars.GBLITE_SIGN == 'true' }}
    steps:
      # Full history + tags are needed on manual dispatch to compute the next
      # version from the existing gblite-v* releases.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the edition version
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^gblite-v\d+\.\d+\.\d+$') {
              throw "tag '$tag' does not match ^gblite-v\d+\.\d+\.\d+$"
            }
            $version = $tag.Substring('gblite-v'.Length)
            $label = $tag
          } else {
            # Short inline semver bump: the highest existing gblite-v* tag is
            # the base, then none/patch/minor/major is applied to it.
            $bumpCode = @'
          import re, subprocess, sys
          pattern = re.compile(r"^gblite-v(\d+)\.(\d+)\.(\d+)$")
          tags = subprocess.run(
              ["git", "tag", "--list", "gblite-v*"],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()
          versions = []
          for tag in tags:
              match = pattern.match(tag.strip())
              if match:
                  versions.append(tuple(int(part) for part in match.groups()))
          major, minor, patch = max(versions) if versions else (0, 0, 0)
          bump = (sys.argv[1] if len(sys.argv) > 1 else "") or "patch"
          if bump not in ("none", "patch", "minor", "major"):
              raise SystemExit("unknown bump: " + bump)
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1
          print(f"{major}.{minor}.{patch}")
          '@
            $version = python -c $bumpCode $env:BUMP
            if ($LASTEXITCODE -ne 0) { throw "could not compute the next Lite version" }
            $tag = "gblite-v$version"
            $label = "gblite-build-$((git rev-parse --short HEAD).Trim())"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "version '$version' is not major.minor.patch"
          }
          $commit = (git rev-parse --short HEAD).Trim()
          $built = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          "GBLITE_VERSION=$version" >> $env:GITHUB_ENV
          "GBLITE_TAG=$tag" >> $env:GITHUB_ENV
          "GBLITE_LABEL=$label" >> $env:GITHUB_ENV
          "BOTSERVER_BUILD_VERSION=$version" >> $env:GITHUB_ENV
          "BOTSERVER_COMMIT=$commit" >> $env:GITHUB_ENV
          "BOTSERVER_BUILD_DATE=$built" >> $env:GITHUB_ENV
          $versionConf = Join-Path $env:RUNNER_TEMP 'gblite-version.conf.json'
          @{ version = $version } | ConvertTo-Json | Set-Content $versionConf -Encoding utf8
          "GBLITE_VERSION_CONF=$versionConf" >> $env:GITHUB_ENV
          Write-Host "edition version $version ($tag, $label, $commit)"

      # Same pinned client build as gblite (botserver/3rdparty.toml libpq_win):
      # the server links libpq and the sidecar stages these DLLs at first run.
      # The EDB archive below also provides a database server for the smoke test.
      - name: PostgreSQL client libraries (pinned) and a server for the smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'pgsql-17.4-binaries.zip'
          Invoke-WebRequest -Uri 'https://get.enterprisedb.com/postgresql/postgresql-17.4-1-windows-x64-binaries.zip' -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '80bb49e80df0100dd52e7b3c647896f8d8cfde760b6473e5180819c8df4b23c4') { throw "PostgreSQL client archive digest mismatch: $hash" }
          $client = Join-Path $env:RUNNER_TEMP 'pgclient'
          Expand-Archive $zip -DestinationPath $client -Force
          $pgsql = Join-Path $client 'pgsql'
          $payload = 'botserver\botserver-installers'
          New-Item -ItemType Directory -Force $payload | Out-Null
          $runtimeDlls = @(
            'libpq.dll', 'libcrypto-3-x64.dll', 'libssl-3-x64.dll',
            'libiconv-2.dll', 'libintl-9.dll', 'libwinpthread-1.dll',
            'liblz4.dll', 'libzstd.dll', 'zlib1.dll'
          )
          foreach ($name in $runtimeDlls) {
            $dll = Join-Path "$pgsql\bin" $name
            if (-not (Test-Path $dll)) { throw "PostgreSQL runtime DLL is missing: $name" }
            Copy-Item $dll $payload -Force
          }
          choco install postgresql16 --no-progress -y --params '/Password:postgres'
          $server = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory | Sort-Object Name | Select-Object -Last 1
          if (-not $server) { throw "PostgreSQL server install directory not found" }
          "PQ_LIB_DIR=$pgsql\lib" >> $env:GITHUB_ENV
          # Later entries win: the pinned client DLLs come before the server's.
          "$($server.FullName)\bin" >> $env:GITHUB_PATH
          "$pgsql\bin" >> $env:GITHUB_PATH

      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: gblite-release

      - name: Build botserver (release, Chat + Drive profile)
        run: cargo build --release -p botserver --no-default-features --features ${{ env.GBLITE_FEATURES }}

      - name: Prepare the smoke database
        shell: pwsh
        env:
          PGPASSWORD: postgres
        run: |
          $svc = Get-Service -Name "postgresql*" | Select-Object -First 1
          if ($svc.Status -ne 'Running') { Start-Service $svc.Name; Start-Sleep -Seconds 5 }
          psql -U postgres -h 127.0.0.1 -v ON_ERROR_STOP=1 -c "CREATE ROLE gb LOGIN PASSWORD 'gb'"
          psql -U postgres -h 127.0.0.1 -v ON_ERROR_STOP=1 -c "CREATE DATABASE botserver OWNER gb"

      # Proves the release server starts with the gblite feature set and serves
      # the Chat + Drive product profile, with no network egress in the smoke.
      - name: Smoke test the release server (isolated stack, local mock model)
        shell: pwsh
        env:
          BOTSERVER_STACK_PATH: ${{ runner.temp }}\gblite-stack
          DATABASE_URL: postgres://gb:gb@127.0.0.1:5432/botserver
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/gblite-smoke.ps1 -Binary target\release\botserver.exe
          $logs = Get-ChildItem 'botserver-smoke.log*' -ErrorAction SilentlyContinue
          $panics = $logs | Select-String -Pattern 'panicked at' -SimpleMatch
          if ($panics) {
            $panics | Select-Object -First 5 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            throw "the release server panicked during the smoke test"
          }

      - name: Build the desktop shell (release)
        run: cargo build --release -p botapp --features ${{ env.GBLITE_FEATURES }},custom-protocol

      # Downloads every in-scope Windows asset from botserver/3rdparty.toml,
      # verifies its SHA-256 pin and records SHA256SUMS-windows-installers.
      # Unpinned upstream assets are warned about and recorded, never invented.
      - name: Stage the full offline payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/stage_windows_installers.py
          if ($LASTEXITCODE -ne 0) { throw "offline payload staging failed with exit code $LASTEXITCODE" }

      # First boot must work with downloads disabled: the installer's only
      # opt-in is GB_DESKTOP_ALLOW_DOWNLOAD=1 and this job must never set it.
      - name: Assert offline-first boot and payload coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $optIn = $env:GB_DESKTOP_ALLOW_DOWNLOAD
          if ($optIn -and $optIn -in @('1', 'true', 'TRUE', 'yes')) {
            throw "GB_DESKTOP_ALLOW_DOWNLOAD is enabled ($optIn); the Lite MSI must be offline by default"
          }
          $workflow = Get-Content '.github/workflows/gblite-release.yml' -Raw
          if ($workflow -match 'GB_DESKTOP_ALLOW_DOWNLOAD\s*:\s*(1|true|yes)') {
            throw 'this workflow enables GB_DESKTOP_ALLOW_DOWNLOAD'
          }
          $guard = Get-Content 'botserver/crates/botcore/src/package_manager/facade/mod.rs' -Raw
          if ($guard -notmatch 'fn desktop_download_allowed' -or
              $guard -notmatch 'GB_DESKTOP_ALLOW_DOWNLOAD' -or
              $guard -notmatch 'Ok\("1"\)') {
            throw 'the opt-in-only download guard is missing from the installer'
          }
          $conf = Get-Content 'botapp/tauri.gblite.conf.json' -Raw | ConvertFrom-Json
          if ($conf.productName -ne 'General Bots Lite') { throw "productName is '$($conf.productName)'" }
          if ($conf.identifier -ne 'org.generalbots.desktop') { throw "identifier is '$($conf.identifier)'" }
          $resources = $conf.bundle.resources.PSObject.Properties
          if (-not ($resources.Name -contains '../botserver/botserver-installers/*')) {
            throw 'tauri config does not embed the installer cache as installers/'
          }
          python scripts/stage_windows_installers.py --check
          if ($LASTEXITCODE -ne 0) { throw "offline payload check failed with exit code $LASTEXITCODE" }

      # First run of a brand-new install, without the desktop shell: the
      # release server provisions an EMPTY stack from the payload staged above,
      # asked the way the first-run wizard asks, with downloads forbidden, and
      # then starts once on it (scripts/gblite-first-run.ps1). The smoke test
      # above never runs the provisioner, so only this step sees a payload or a
      # product file that a new install cannot use.
      #
      # NOT BLOCKING YET: the check has never run on a runner, and a wrong
      # assumption in it must not stop a release build. Remove
      # `continue-on-error` from this step once it has passed twice here.
      #
      # The runner's own PostgreSQL (the smoke database) holds port 5432, the
      # port of the stack's database: it is stopped for the check and started
      # again afterwards.
      - name: First run on an empty stack, offline (not blocking yet)
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $services = @(Get-Service -Name 'postgresql*' | Where-Object { $_.Status -eq 'Running' })
          $services | Stop-Service -Force
          try {
            ./scripts/gblite-first-run.ps1 -Binary target\release\botserver.exe `
              -Payload botserver\botserver-installers `
              -Stack (Join-Path $env:RUNNER_TEMP 'gblite-first-run-stack')
            $code = $LASTEXITCODE
          } finally {
            $services | Start-Service
          }
          exit $code

      # The installers install for the whole machine (`installMode` in
      # botapp/tauri.gblite.conf.json), so the person who runs the app cannot
      # write to, or move files out of, the app folder. The same check with
      # that folder locked. Not blocking, for the same reason as above; make it
      # blocking once it has passed twice.
      - name: First run on an empty stack, app folder read-only (not blocking yet)
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $services = @(Get-Service -Name 'postgresql*' | Where-Object { $_.Status -eq 'Running' })
          $services | Stop-Service -Force
          try {
            ./scripts/gblite-first-run.ps1 -Binary target\release\botserver.exe `
              -Payload botserver\botserver-installers -ReadOnlyApp `
              -Stack (Join-Path $env:RUNNER_TEMP 'gblite-first-run-locked-stack') `
              -Evidence first-run-artifacts-read-only
            $code = $LASTEXITCODE
          } finally {
            $services | Start-Service
          }
          exit $code

      # The agent workspace on Windows runs Incus inside WSL through the
      # `incus.exe` wrapper (desktop/windows/incus-wsl). The binary ships as
      # installers/incus.exe so the shell can find it at runtime
      # (botapp/src/desktop/sidecar/agent_env.rs).
      - name: Build and test the WSL Incus wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --manifest-path desktop\windows\incus-wsl\Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "incus-wsl build failed with exit code $LASTEXITCODE" }
          cargo test --release --manifest-path desktop\windows\incus-wsl\Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "incus-wsl tests failed with exit code $LASTEXITCODE" }
          $exe = Get-Item 'desktop\windows\incus-wsl\target\release\incus.exe' -ErrorAction Stop
          Copy-Item $exe.FullName 'botserver\botserver-installers\incus.exe' -Force
          Write-Host "incus.exe staged ($([math]::Round($exe.Length / 1KB, 1)) KB)"

      # Sign incus.exe separately: it is not part of the Tauri bundle so the
      # bundler's signing configuration does not reach it.
      - name: Sign incus.exe (when the certificate is present)
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $incus = 'botserver\botserver-installers\incus.exe'
          if (-not (Test-Path $incus)) { throw 'incus.exe was not staged' }
          $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
          if (-not $cert) { throw 'no code-signing certificate in the store' }
          Set-AuthenticodeSignature -FilePath $incus -Certificate $cert `
            -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
          $status = (Get-AuthenticodeSignature $incus).Status
          if ($status -ne 'Valid') { throw "incus.exe signature status: $status" }
          Write-Host "incus.exe signed ($status)"

      - name: Verify incus.exe is inside the bundle payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $incus = 'botserver\botserver-installers\incus.exe'
          if (-not (Test-Path $incus)) { throw 'incus.exe is missing from the installers folder' }
          $conf = Get-Content 'botapp/tauri.gblite.conf.json' -Raw | ConvertFrom-Json
          $resources = $conf.bundle.resources.PSObject.Properties
          if (-not ($resources.Name -contains '../botserver/botserver-installers/*')) {
            throw 'tauri config does not glob botserver-installers/*; incus.exe would not be bundled'
          }
          Write-Host "incus.exe is covered by the installers/* resource glob"

      - name: Stage the server sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force botapp\binaries | Out-Null
          Copy-Item target\release\botserver.exe "botapp\binaries\botserver-$env:TARGET_TRIPLE.exe" -Force

      # With the certificate secrets the bundler signs the application, the
      # sidecar and the MSI with the existing private Windows certificate.
      - name: Prepare code signing
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_CERT }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT))
          $password = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          $signConf = Join-Path $env:RUNNER_TEMP 'gblite-sign.conf.json'
          @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 5 | Set-Content $signConf -Encoding utf8
          "GBLITE_SIGN_CONF=$signConf" >> $env:GITHUB_ENV

      - name: Install the Tauri bundler
        run: cargo install tauri-cli --version "^2" --locked

      # The base config already declares productName "General Bots Lite", the
      # unchanged identifier and the installers/ resource glob. --bundles msi
      # overrides its nsis+msi targets: this edition ships one MSI only.
      - name: Package the MSI installer
        shell: pwsh
        working-directory: botapp
        run: |
          $ErrorActionPreference = 'Stop'
          $configs = @('--config', 'tauri.gblite.conf.json', '--config', $env:GBLITE_VERSION_CONF)
          if ($env:GBLITE_SIGN_CONF) { $configs += @('--config', $env:GBLITE_SIGN_CONF) }
          cargo tauri build --features "$env:GBLITE_FEATURES,custom-protocol" @configs --bundles msi
          if ($LASTEXITCODE -ne 0) { throw "cargo tauri build failed with exit code $LASTEXITCODE" }

      # Gate: the built MSI must carry the licence files, the NOTICE and the
      # source offer. The MSI is extracted to a temp directory via an
      # administrative install and the contents are checked.
      - name: Verify licence files in the MSI bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundles = @('target\release\bundle', 'botapp\target\release\bundle')
          $msi = Get-ChildItem ($bundles | ForEach-Object { "$_\msi\*.msi" }) -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { throw 'no MSI installer found' }
          $extractDir = Join-Path $env:RUNNER_TEMP 'msi-extract'
          New-Item -ItemType Directory -Force $extractDir | Out-Null
          $proc = Start-Process -FilePath 'msiexec.exe' `
            -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$extractDir`"") `
            -Wait -PassThru -WindowStyle Hidden
          if ($proc.ExitCode -ne 0) { throw "msiexec /a failed with exit code $($proc.ExitCode)" }
          $listing = Get-ChildItem $extractDir -Recurse -File | ForEach-Object {
            $_.FullName.Substring($extractDir.Length + 1)
          }
          # The interface carries its own copies under ui\suite\about\licenses;
          # they do not count. The bundle's licenses folder is what is checked.
          $shipped = @($listing | Where-Object { $_ -notmatch '(^|\\)ui\\' })
          $required = @(
            'licenses\LICENSES-desktop.md',
            'licenses\NOTICE',
            'licenses\SOURCE-OFFER.md',
            'licenses\LICENSE-General-Bots.txt'
          )
          $missing = @()
          foreach ($name in $required) {
            if (-not ($shipped | Where-Object { $_.EndsWith($name, [System.StringComparison]::OrdinalIgnoreCase) })) {
              $missing += $name
            }
          }
          if (-not ($shipped | Where-Object { $_ -match '(^|\\)licenses\\[^\\]+-(LICENSE|COPYRIGHT|COPYING)\.txt$' })) {
            $missing += 'licenses\<upstream-text>.txt (no licence text files found)'
          }
          if ($missing.Count -gt 0) {
            foreach ($m in $missing) { Write-Host "::error::missing in MSI bundle: $m" }
            throw "the MSI is missing $($missing.Count) licence file(s)"
          }
          Write-Host "licence files verified in the MSI bundle"

      - name: Collect the release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:GBLITE_VERSION
          New-Item -ItemType Directory -Force dist | Out-Null
          $bundles = @('target\release\bundle', 'botapp\target\release\bundle')
          $msi = Get-ChildItem ($bundles | ForEach-Object { "$_\msi\*.msi" }) -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { throw 'the bundler produced no MSI' }
          $versioned = "generalbots-gblite-$v-windows-x64.msi"
          $alias = 'generalbots-gblite-windows-x64.msi'
          Copy-Item $msi.FullName "dist\$versioned" -Force
          Copy-Item "dist\$versioned" "dist\$alias" -Force
          # The alias is the stable /releases/latest/download/ URL; both files
          # must be real installers, not empty placeholders.
          foreach ($name in @($versioned, $alias)) {
            $out = Get-Item "dist\$name"
            if ($out.Length -lt 1MB) { throw "$($out.Name) is suspiciously small ($($out.Length) bytes)" }
            Write-Host "MSI: $($out.Name) ($([math]::Round($out.Length / 1MB, 1)) MB)"
          }
          # incus.exe is not part of the Tauri bundle signing: check it here.
          $incus = Get-Item 'botserver\botserver-installers\incus.exe' -ErrorAction SilentlyContinue
          if ($incus) {
            $status = (Get-AuthenticodeSignature $incus.FullName).Status
            Write-Host "signature incus.exe: $status"
            if ($env:HAS_WINDOWS_CERT -eq 'true' -and $status -ne 'Valid') {
              throw 'incus.exe is not signed but a signing certificate is configured'
            }
          }

      - name: Software bill of materials (CycloneDX)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo install cargo-cyclonedx --version "^0.5" --locked
          if ($LASTEXITCODE -ne 0) { throw 'could not install cargo-cyclonedx' }
          $builds = @(
            @{ Crate = 'botserver'; Args = @('--no-default-features', '--features', $env:GBLITE_FEATURES) },
            @{ Crate = 'botapp'; Args = @('--features', "$env:GBLITE_FEATURES,custom-protocol") }
          )
          foreach ($b in $builds) {
            cargo cyclonedx --manifest-path "$($b.Crate)\Cargo.toml" --format json --target $env:TARGET_TRIPLE @($b.Args)
            if ($LASTEXITCODE -ne 0) { throw "cargo cyclonedx failed for $($b.Crate)" }
            $sbom = Get-ChildItem $b.Crate -Filter '*.cdx.json' -File | Select-Object -First 1
            if (-not $sbom) { throw "no SBOM was written for $($b.Crate)" }
            Copy-Item $sbom.FullName "dist\$($b.Crate)-gblite-$env:GBLITE_VERSION.cdx.json" -Force
          }

      - name: SHA-256 sums
        shell: pwsh
        run: |
          $sums = "SHA256SUMS-gblite-$env:GBLITE_VERSION-windows.txt"
          Get-ChildItem dist -File | Where-Object { $_.Name -ne $sums } | Sort-Object Name |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content (Join-Path dist $sums) -Encoding ascii
          Get-Content (Join-Path dist $sums)

      - name: Upload the release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gblite-release-${{ env.GBLITE_LABEL }}
          path: dist/*
          if-no-files-found: error

      - name: Upload smoke evidence and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gblite-release-smoke-${{ github.sha }}
          path: |
            botserver-smoke.log
            botserver-smoke.log.err
            mock-llm.log
            mock-llm.log.err
            smoke-artifacts/**
            first-run-artifacts/**
            first-run-artifacts-read-only/**
          if-no-files-found: warn

  publish:
    name: Publish the stable release
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'gblite-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require the exact edition tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ] || ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^gblite-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::publishing needs a gblite-v<major>.<minor>.<patch> tag; this run is on $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Download the release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gblite-release-${{ github.ref_name }}
          path: dist

      - name: Create the GitHub release with the stable download alias
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GBLITE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist
          version="${GBLITE_TAG#gblite-v}"
          versioned="dist/generalbots-gblite-$version-windows-x64.msi"
          alias="dist/generalbots-gblite-windows-x64.msi"
          sums="dist/SHA256SUMS-gblite-$version-windows.txt"
          assets=("$versioned" "$alias" "$sums")
          while IFS= read -r sbom; do
            assets+=("$sbom")
          done < <(find dist -maxdepth 1 -name "*-gblite-$version.cdx.json" -print | sort)
          for file in "${assets[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::missing or empty release asset: $file"
              exit 1
            fi
          done
          if gh release view "$GBLITE_TAG" >/dev/null 2>&1; then
            gh release upload "$GBLITE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$GBLITE_TAG" "${assets[@]}" \
              --title "General Bots Lite $version" \
              --generate-notes \
              --verify-tag \
              --latest
          fi
