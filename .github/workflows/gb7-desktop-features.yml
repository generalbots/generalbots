name: GB7 desktop feature contract

# #1649 — the published feature page is generated from a machine-readable
# record. This job fails the build when the page is edited by hand, when a
# `shipped` status has no end-to-end evidence, or when a removed feature
# (GB7-22 / GB7-24) reappears.
on:
  # Reusable from `.github/workflows/ci.yml`; existing triggers are preserved.
  workflow_call:
  push:
    paths:
      - "desktop/gb7/**"
      - "scripts/gb7_desktop_features_check.py"
      - ".github/workflows/gb7-desktop-features.yml"
  pull_request:
    paths:
      - "desktop/gb7/**"
      - "scripts/gb7_desktop_features_check.py"
      - ".github/workflows/gb7-desktop-features.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify the feature record
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify record, evidence and generated page
        run: |
          set -euo pipefail
          python3 --version
          python3 scripts/gb7_desktop_features_check.py
