name: ALM release binaries

# Publishes the binaries the ALM (Forgejo) CI deploys.
#
# The ALM runner no longer compiles anything: it downloads these assets and
# runs the same deploy steps it always ran. GitHub-hosted runners do the
# compilation, so there is exactly one build per commit and both CI systems
# agree on what was built.
#
# Where the assets live: the rolling tag `alm-latest` (never "latest", so the
# desktop release link stays untouched). Every push to main replaces the
# assets and the MANIFEST records the commit and the build time — ALM deploys
# the newest build and refuses anything older than a few hours, which is what
# a missing or red build looks like from the other side.
#
# Stable URLs (public repository, no token needed by ALM):
#   https://github.com/generalbots/generalbots/releases/download/alm-latest/MANIFEST.json
#   https://github.com/generalbots/generalbots/releases/download/alm-latest/botserver-linux-x86_64
#   https://github.com/generalbots/generalbots/releases/download/alm-latest/botui-linux-x86_64
#
# Build profile matches what ALM used to compile on the runner:
#   botserver: debug, default features   (the production feature set)
#   botui:     debug, default features
# Release tarballs for end users stay in `.github/workflows/desktop-binaries.yml`.

on:
  push:
    branches: ["main"]
    paths:
      - "botserver/**"
      - "botlib/**"
      - "botui/**"
      - "botschema/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/alm-release.yml"
  workflow_dispatch:

permissions:
  contents: write

# Newer pushes supersede older builds: only the newest main commit matters,
# and its ALM run is the one that deploys.
concurrency:
  group: alm-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  ALM_RELEASE_TAG: alm-latest

jobs:
  build:
    name: Build deployable binaries
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang pkg-config \
            libpq-dev libssl-dev liblzma-dev

      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-alm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-alm-

      - name: Build botserver (debug, default features)
        run: cargo build -p botserver

      - name: Build botui (debug, default features)
        run: cargo build -p botui

      - name: Package assets and manifest
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m 0755 target/debug/botserver dist/botserver-linux-x86_64
          install -m 0755 target/debug/botui     dist/botui-linux-x86_64

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess

          dist = "dist"
          assets = {}
          for name in sorted(os.listdir(dist)):
              if name == "MANIFEST.json":
                  continue
              path = os.path.join(dist, name)
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              assets[name] = {
                  "sha256": digest.hexdigest(),
                  "size": os.path.getsize(path),
              }

          manifest = {
              "schema": 1,
              "commit": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "built_at": subprocess.check_output(
                  ["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"], text=True
              ).strip(),
              "target": "x86_64-unknown-linux-gnu",
              "profile": "debug",
              "features": "default",
              "build_arch": platform.machine(),
              "assets": assets,
          }
          with open(os.path.join(dist, "MANIFEST.json"), "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(manifest, indent=2))
          PY

          (cd dist && ls -lh)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: alm-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to the rolling alm-latest release
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alm-binaries
          path: dist
          merge-multiple: true

      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${ALM_RELEASE_TAG}"
          REPO="${GITHUB_REPOSITORY}"

          # The rolling release may not exist yet, and a parallel run (for
          # example the botmodels bundle) may be creating it right now.
          for attempt in $(seq 1 5); do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              break
            fi
            gh release create "$TAG" --repo "$REPO" --latest=false \
              --title "ALM deploy binaries (rolling)" \
              --notes "Binaries consumed by the ALM (Forgejo) CI. Rebuilt on every push to main; the commit sha lives in MANIFEST.json." \
              && break || sleep 5
          done
          gh release view "$TAG" --repo "$REPO" >/dev/null

          # Replace, never accumulate: the manifest always describes exactly
          # the files that are attached.
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber

          gh release edit "$TAG" --repo "$REPO" --latest=false \
            --notes "Binaries consumed by the ALM (Forgejo) CI.

          commit: ${GITHUB_SHA}
          built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)
          run:    ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ALM downloads these files and runs the deploy it always ran; it does
          not compile anything. \`MANIFEST.json\` lists each asset with its
          sha256 and the time it was built."
