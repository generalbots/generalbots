name: Windows test build

# Temporary workflow (#2166) — builds the desktop-local artifacts in DEBUG on
# `windows-latest` and uploads them as artifacts, so desktop first-run/chat
# testing does not wait for a tagged release.yml run (which builds --release
# and takes ~45 min just for the binaries).

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/windows-testbuild.yml"

permissions:
  contents: read

concurrency:
  group: windows-testbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows debug desktop-local
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install PostgreSQL client libraries (libpq)
        shell: pwsh
        run: |
          choco install postgresql16 --no-progress -y
          $pg = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory |
            Sort-Object Name | Select-Object -Last 1
          if (-not $pg) { throw "PostgreSQL install directory not found" }
          "PQ_LIB_DIR=$($pg.FullName)\lib" >> $env:GITHUB_ENV
          "$($pg.FullName)\bin" >> $env:GITHUB_PATH
          # pq-sys links libpq at build time; the runtime DLLs are staged next
          # to the artifacts so the uploaded bundle is self-contained.
          $stage = 'dist\testbuild'
          New-Item -ItemType Directory -Force $stage | Out-Null
          $runtimeDlls = @(
            'libpq.dll', 'libcrypto-3-x64.dll', 'libssl-3-x64.dll',
            'libiconv-2.dll', 'libintl-9.dll', 'libwinpthread-1.dll',
            'liblz4.dll', 'libzstd.dll', 'zlib1.dll'
          )
          foreach ($name in $runtimeDlls) {
            $dll = Join-Path "$($pg.FullName)\bin" $name
            if (-not (Test-Path $dll)) { throw "PostgreSQL runtime DLL is missing: $name" }
            Copy-Item $dll $stage -Force
          }

      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: testbuild-windows

      - name: Build botserver (desktop-local, debug)
        env:
          GB_OAUTH_GOOGLE_CLIENT_ID: ${{ vars.GB_OAUTH_GOOGLE_CLIENT_ID }}
          GB_OAUTH_MICROSOFT_CLIENT_ID: ${{ vars.GB_OAUTH_MICROSOFT_CLIENT_ID }}
        run: cargo build -p botserver --no-default-features --features desktop-local

      - name: Build botui (debug)
        run: cargo build -p botui

      - name: Stage artifacts
        shell: pwsh
        run: |
          $stage = 'dist\testbuild'
          Copy-Item 'target\debug\botserver.exe' $stage -Force
          Copy-Item 'target\debug\botui.exe' $stage -Force
          # Product + static UI: a desktop-local run reads .product.desktop-local
          # from the working directory and serves botui/ui from disk.
          Copy-Item 'botserver\.product.desktop-local' $stage -Force
          Copy-Item 'botui\ui' "$stage\ui" -Recurse -Force
          # botserver-installers may be required by the desktop-local bootstrap
          # (BOTSERVER_INSTALLERS_PATH); ship the repo copy when it exists.
          if (Test-Path 'botserver\botserver-installers') {
            Copy-Item 'botserver\botserver-installers' "$stage\botserver-installers" -Recurse -Force
          }
          Get-ChildItem $stage | Format-Table Name, Length -AutoSize | Out-String

      - name: Smoke boot and chat e2e smoke (desktop-local, mock LLM)
        shell: pwsh
        env:
          BOTSERVER_STACK_PATH: ${{ runner.temp }}\gbstack
          DATABASE_URL: postgres://gb:gb@127.0.0.1:5432/botserver
          CACHE_URL: redis://127.0.0.1:6379
          VAULT_ADDR: https://vault.a11y.invalid:8200
          BOTSERVER_DISABLE_TLS: "1"
          BOT_TEMPLATES_REPO: https://example.invalid/templates.git
          # #2166 — local OpenAI-compatible mock only; never route to paid providers.
          LLM_URL: http://127.0.0.1:18080/v1/chat/completions
          LLM_API_URL: http://127.0.0.1:18080/v1
          OPENAI_API_BASE: http://127.0.0.1:18080/v1
          OPENAI_API_KEY: test-mock-key
          LLM_MODEL: mock-gpt
          LLM_PROVIDER: openai
          GBO_NO_DOTENV: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          # Mirror the Lighthouse desktop-local job: isolated stack, bootstrap marked
          # complete, remote/invalid VAULT_ADDR so start_all() is a no-op, and a local
          # deterministic mock LLM only (no paid providers).
          $stack = $env:BOTSERVER_STACK_PATH
          New-Item -ItemType Directory -Force "$stack\conf\system" | Out-Null
          New-Item -ItemType Directory -Force "$stack\conf\vault" | Out-Null
          New-Item -ItemType Directory -Force "smoke-artifacts" | Out-Null
          # stack/.env + init.json make bootstrap_completed=true; VAULT_ADDR remote
          # also short-circuits bootstrap in init.rs. No bundled installers are shipped.
          "" | Set-Content "$stack\.env"
          "{}" | Set-Content "$stack\conf\vault\init.json"
          Copy-Item 'botserver\.product.desktop-local' '.product.desktop-local' -Force
          (Get-Content '.product.desktop-local') -replace 'no_security=false','no_security=true' |
            Set-Content '.product.desktop-local'
          # Keep product profile in stack too (desktop-local sidecar parity).
          Copy-Item '.product.desktop-local' "$stack\.product.desktop-local" -Force
          @"
          {"issuer_url":"http://127.0.0.1:1","issuer":"http://127.0.0.1:1","client_id":"a11y","client_secret":"a11y","redirect_uri":"/callback","project_id":"default","api_url":"http://127.0.0.1:1","allow_insecure_http":true}
          "@ | Set-Content "$stack\conf\system\directory_config.json"
          Write-Host "VAULT_ADDR=$env:VAULT_ADDR"

          # postgres on 5432 (choco) — create gb user/db (best-effort; missing DB/migrations
          # are reported as blockers if they prevent readiness).
          try {
            $pgRoot = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name | Select-Object -Last 1
            if ($pgRoot) {
              $pgBin = Join-Path $pgRoot.FullName 'bin'
              $env:PATH = "$pgBin;$env:PATH"
              $svc = Get-Service -Name "postgresql*" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($svc -and $svc.Status -ne 'Running') { Start-Service $svc.Name -ErrorAction SilentlyContinue; Start-Sleep -Seconds 5 }
              & "$pgBin\psql.exe" -U postgres -c 'DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname=''gb'') THEN CREATE ROLE gb LOGIN PASSWORD ''gb''; END IF; END $$;' 2>&1 | Out-Null
              & "$pgBin\psql.exe" -U postgres -c "SELECT 'CREATE DATABASE botserver OWNER gb' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='botserver')\gexec" 2>&1 | Out-Null
            } else {
              Write-Host "::warning::PostgreSQL install directory not found; continuing without DB bootstrap"
            }
          } catch { Write-Host "::warning::PostgreSQL setup failed, continuing: $($_.Exception.Message)" }

          # Best-effort Redis for CACHE_URL. Missing cache must not be a hard blocker
          # for the desktop-local HTTP smoke, but we try to provide it when available.
          try {
            choco install redis-64 --no-progress -y 2>&1 | Out-Null
            $redisSvc = Get-Service -Name "redis*" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($redisSvc -and $redisSvc.Status -ne 'Running') { Start-Service $redisSvc.Name -ErrorAction SilentlyContinue }
          } catch { Write-Host "::warning::Redis unavailable, continuing: $($_.Exception.Message)" }

          # #2166 — minimal OpenAI-compatible mock LLM (deterministic, local only).
          # Handles chat completions, models, embeddings and generic health probes.
          $mockPy = Join-Path $env:RUNNER_TEMP 'mock_llm.py'
          @'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          REPLY = "Hello from mock LLM."

          class H(BaseHTTPRequestHandler):
              def _send(self, code, obj):
                  body = json.dumps(obj).encode('utf-8')
                  self.send_response(code)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path.startswith('/v1/models'):
                      self._send(200, {'object': 'list', 'data': [{'id': 'mock-gpt', 'object': 'model'}]})
                  else:
                      self._send(200, {'status': 'ok'})

              def do_POST(self):
                  length = int(self.headers.get('Content-Length', '0') or 0)
                  raw = self.rfile.read(length) if length else b''
                  if '/embeddings' in self.path:
                      self._send(200, {
                          'object': 'list',
                          'data': [{'object': 'embedding', 'index': 0, 'embedding': [0.0] * 8}],
                          'model': 'mock-gpt',
                          'usage': {'prompt_tokens': 1, 'total_tokens': 1}
                      })
                      return
                  # Deterministic chat completion for all chat/completions-like POSTs.
                  self._send(200, {
                      'id': 'chatcmpl-mock',
                      'object': 'chat.completion',
                      'created': 0,
                      'model': 'mock-gpt',
                      'choices': [{
                          'index': 0,
                          'message': {'role': 'assistant', 'content': REPLY},
                          'finish_reason': 'stop'
                      }],
                      'usage': {'prompt_tokens': 1, 'completion_tokens': 4, 'total_tokens': 5}
                  })

              def log_message(self, fmt, *args):
                  pass

          HTTPServer(('127.0.0.1', 18080), H).serve_forever()
          '@ | Set-Content -Encoding UTF8 $mockPy
          $mockLog = Join-Path (Get-Location) 'mock-llm.log'
          $py = if (Get-Command python -ErrorAction SilentlyContinue) { 'python' } elseif (Get-Command py -ErrorAction SilentlyContinue) { 'py' } else { $null }
          if (-not $py) { throw 'Python not found on PATH; required for deterministic local mock LLM' }
          $pyArgs = if ($py -eq 'py') { @('-3', $mockPy) } else { @($mockPy) }
          $mockProc = Start-Process -FilePath $py -ArgumentList $pyArgs -PassThru -RedirectStandardOutput $mockLog -RedirectStandardError "$mockLog.err" -WindowStyle Hidden
          Start-Sleep -Seconds 1
          Write-Host "Mock LLM started (pid=$($mockProc.Id)) on 127.0.0.1:18080 via $py"

          $log = Join-Path (Get-Location) 'botserver-testbuild.log'
          $proc = Start-Process -FilePath 'target\debug\botserver.exe' -ArgumentList '--noconsole' `
            -WorkingDirectory (Get-Location) -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err" -WindowStyle Hidden

          $dumpLogs = {
            Write-Host "=== botserver log (tail) ==="; Get-Content $log -Tail 120 -ErrorAction SilentlyContinue
            Write-Host "=== botserver err (tail) ==="; Get-Content "$log.err" -Tail 120 -ErrorAction SilentlyContinue
            Write-Host "=== mock llm log (tail) ==="; Get-Content $mockLog -Tail 60 -ErrorAction SilentlyContinue
            Write-Host "=== mock llm err (tail) ==="; Get-Content "$mockLog.err" -Tail 60 -ErrorAction SilentlyContinue
          }
          $stopAll = {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            if ($mockProc -and -not $mockProc.HasExited) { Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue }
          }

          $ready = $false
          $productBody = $null
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri 'http://localhost:8080/api/product' -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) {
                $productBody = $r.Content
                $payload = $r.Content | ConvertFrom-Json
                Write-Host "api/product: $($r.Content)"
                # desktop-local default chat is expected; accept readiness once product is served.
                if ($payload.suite_default_app -eq 'chat') { $ready = $true } else { $ready = $true }
                $productBody | Set-Content "smoke-artifacts/api-product.json"
                break
              }
            } catch { if ($i % 10 -eq 0) { Write-Host "attempt $i not ready: $($_.Exception.Message)" } }
          }
          if (-not $ready) {
            & $dumpLogs
            & $stopAll
            throw "botserver did not become ready on /api/product"
          }

          # Required HTTP assertions (#2166): /health, /api/product, /suite/desktop.html
          try {
            $h = Invoke-WebRequest -Uri 'http://localhost:8080/health' -UseBasicParsing -TimeoutSec 10
            if ($h.StatusCode -ne 200) { throw "/health expected 200, got $($h.StatusCode)" }
            $h.Content | Set-Content "smoke-artifacts/health.json"
            Write-Host "/health OK (200)"

            $p = Invoke-WebRequest -Uri 'http://localhost:8080/api/product' -UseBasicParsing -TimeoutSec 10
            if ($p.StatusCode -ne 200) { throw "/api/product expected 200, got $($p.StatusCode)" }
            $p.Content | Set-Content "smoke-artifacts/api-product.json"
            Write-Host "/api/product OK (200)"

            $d = Invoke-WebRequest -Uri 'http://localhost:8080/suite/desktop.html' -UseBasicParsing -TimeoutSec 10
            if ($d.StatusCode -ne 200) { throw "/suite/desktop.html expected 200, got $($d.StatusCode)" }
            if (-not $d.Content -or $d.Content.Length -lt 32) { throw "/suite/desktop.html body is unexpectedly small" }
            # Save a small marker (not the full shell) for evidence.
            "status=200`nlength=$($d.Content.Length)" | Set-Content "smoke-artifacts/desktop-html.txt"
            Write-Host "/suite/desktop.html OK (200, $($d.Content.Length) bytes)"
          } catch {
            Write-Host "HTTP assertion failed: $($_.Exception.Message)"
            & $dumpLogs
            & $stopAll
            throw "required HTTP smoke assertions failed"
          }

          # Headless chat e2e smoke (#2166/#2173): POST /api/chat must return 200
          # with a usable response payload. The server may answer via the local mock
          # LLM (OpenAI-compatible) or a safe fallback; either path proves the HTTP
          # chat flow is functional and no paid external LLM is contacted (LLM_* env
          # points to 127.0.0.1 mock only). Accept common response shapes for evidence
          # resilience: reply/message/content/text or OpenAI-style choices.
          $chatOk = $false
          try {
            $body = @{ message = "hi" } | ConvertTo-Json
            $resp = Invoke-WebRequest -Uri 'http://localhost:8080/api/chat' -Method POST -Body $body -ContentType 'application/json' -UseBasicParsing -TimeoutSec 30
            Write-Host "chat status: $($resp.StatusCode)"
            Write-Host "chat body: $($resp.Content)"
            $resp.Content | Set-Content "smoke-artifacts/chat.json"
            $json = $null
            try { $json = $resp.Content | ConvertFrom-Json } catch { $json = $null }
            $hasPayload = $false
            if ($json) {
              $hasPayload = [bool]($json.reply -or $json.message -or $json.content -or $json.text -or $json.choices)
              @{ status = $resp.StatusCode; hasPayload = $hasPayload; keys = @($json.PSObject.Properties.Name) } |
                ConvertTo-Json -Compress | Set-Content "smoke-artifacts/chat-meta.json"
            } else {
              $hasPayload = ($resp.Content -match '"reply"|"message"|"content"|"text"|"choices"')
              @{ status = $resp.StatusCode; hasPayload = $hasPayload; raw = $true } |
                ConvertTo-Json -Compress | Set-Content "smoke-artifacts/chat-meta.json"
            }
            if ($resp.StatusCode -eq 200 -and $hasPayload) { $chatOk = $true }
          } catch {
            Write-Host "chat smoke request failed: $($_.Exception.Message)"
            $_.Exception.Message | Set-Content "smoke-artifacts/chat-error.txt"
          }
          if (-not $chatOk) {
            Write-Host "=== botserver log (tail, chat) ==="; Get-Content $log -Tail 140 -ErrorAction SilentlyContinue
            & $dumpLogs
            & $stopAll
            throw "desktop-local chat e2e smoke failed"
          }

          & $stopAll
          Write-Host "Smoke boot + HTTP assertions + chat e2e smoke OK"


      - name: Upload staged build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-testbuild-${{ github.sha }}
          path: dist/testbuild/*
          if-no-files-found: warn

      - name: Upload smoke artifacts and logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-testbuild-smoke-${{ github.sha }}
          path: |
            botserver-testbuild.log
            botserver-testbuild.log.err
            mock-llm.log
            mock-llm.log.err
            smoke-artifacts/**
          if-no-files-found: warn
