name: Windows test build

# Temporary workflow (#2166) — builds the desktop-local artifacts in DEBUG on
# `windows-latest` and uploads them as artifacts, so desktop first-run/chat
# testing does not wait for a tagged release.yml run (which builds --release
# and takes ~45 min just for the binaries).

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/windows-testbuild.yml"

permissions:
  contents: read

concurrency:
  group: windows-testbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows debug desktop-local
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install PostgreSQL client libraries (libpq)
        shell: pwsh
        run: |
          choco install postgresql16 --no-progress -y
          $pg = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory |
            Sort-Object Name | Select-Object -Last 1
          if (-not $pg) { throw "PostgreSQL install directory not found" }
          "PQ_LIB_DIR=$($pg.FullName)\lib" >> $env:GITHUB_ENV
          "$($pg.FullName)\bin" >> $env:GITHUB_PATH
          # pq-sys links libpq at build time; the runtime DLLs are staged next
          # to the artifacts so the uploaded bundle is self-contained.
          $stage = 'dist\testbuild'
          New-Item -ItemType Directory -Force $stage | Out-Null
          $runtimeDlls = @(
            'libpq.dll', 'libcrypto-3-x64.dll', 'libssl-3-x64.dll',
            'libiconv-2.dll', 'libintl-9.dll', 'libwinpthread-1.dll',
            'liblz4.dll', 'libzstd.dll', 'zlib1.dll'
          )
          foreach ($name in $runtimeDlls) {
            $dll = Join-Path "$($pg.FullName)\bin" $name
            if (-not (Test-Path $dll)) { throw "PostgreSQL runtime DLL is missing: $name" }
            Copy-Item $dll $stage -Force
          }

      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: testbuild-windows

      - name: Build botserver (desktop-local, debug)
        env:
          GB_OAUTH_GOOGLE_CLIENT_ID: ${{ vars.GB_OAUTH_GOOGLE_CLIENT_ID }}
          GB_OAUTH_MICROSOFT_CLIENT_ID: ${{ vars.GB_OAUTH_MICROSOFT_CLIENT_ID }}
        run: cargo build -p botserver --no-default-features --features desktop-local

      - name: Build botui (debug)
        run: cargo build -p botui

      - name: Stage artifacts
        shell: pwsh
        run: |
          $stage = 'dist\testbuild'
          Copy-Item 'target\debug\botserver.exe' $stage -Force
          Copy-Item 'target\debug\botui.exe' $stage -Force
          # Product + static UI: a desktop-local run reads .product.desktop-local
          # from the working directory and serves botui/ui from disk.
          Copy-Item 'botserver\.product.desktop-local' $stage -Force
          Copy-Item 'botui\ui' "$stage\ui" -Recurse -Force
          # botserver-installers may be required by the desktop-local bootstrap
          # (BOTSERVER_INSTALLERS_PATH); ship the repo copy when it exists.
          if (Test-Path 'botserver\botserver-installers') {
            Copy-Item 'botserver\botserver-installers' "$stage\botserver-installers" -Recurse -Force
          }
          Get-ChildItem $stage | Format-Table Name, Length -AutoSize | Out-String

      - name: Smoke boot and chat e2e smoke (desktop-local, mock LLM)
        shell: pwsh
        env:
          BOTSERVER_STACK_PATH: ${{ runner.temp }}\gbstack
          DATABASE_URL: postgres://gb:gb@127.0.0.1:5432/botserver
          CACHE_URL: redis://127.0.0.1:6379
          VAULT_ADDR: https://vault.a11y.invalid:8200
          BOTSERVER_DISABLE_TLS: "1"
          BOT_TEMPLATES_REPO: https://example.invalid/templates.git
          # #2166 — local OpenAI-compatible mock only; never route to paid providers.
          LLM_URL: http://127.0.0.1:18080/v1/chat/completions
          LLM_API_URL: http://127.0.0.1:18080/v1
          OPENAI_API_BASE: http://127.0.0.1:18080/v1
          OPENAI_API_KEY: test-mock-key
          LLM_KEY: test-mock-key
          LLM_API_KEY: test-mock-key
          LLM_MODEL: mock-gpt
          LLM_PROVIDER: openai
          GBO_NO_DOTENV: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          # Mirror the Lighthouse desktop-local job: isolated stack, bootstrap marked
          # complete, remote/invalid VAULT_ADDR so start_all() is a no-op, and a local
          # deterministic mock LLM only (no paid providers).
          $stack = $env:BOTSERVER_STACK_PATH
          New-Item -ItemType Directory -Force "$stack\conf\system" | Out-Null
          New-Item -ItemType Directory -Force "$stack\conf\vault" | Out-Null
          New-Item -ItemType Directory -Force "smoke-artifacts" | Out-Null
          # stack/.env + init.json make bootstrap_completed=true; VAULT_ADDR remote
          # also short-circuits bootstrap in init.rs. No bundled installers are shipped.
          "" | Set-Content "$stack\.env"
          "{}" | Set-Content "$stack\conf\vault\init.json"
          Copy-Item 'botserver\.product.desktop-local' '.product.desktop-local' -Force
          (Get-Content '.product.desktop-local') -replace 'no_security=false','no_security=true' |
            Set-Content '.product.desktop-local'
          # Keep product profile in stack too (desktop-local sidecar parity).
          Copy-Item '.product.desktop-local' "$stack\.product.desktop-local" -Force
          @"
          {"issuer_url":"http://127.0.0.1:1","issuer":"http://127.0.0.1:1","client_id":"a11y","client_secret":"a11y","redirect_uri":"/callback","project_id":"default","api_url":"http://127.0.0.1:1","allow_insecure_http":true}
          "@ | Set-Content "$stack\conf\system\directory_config.json"
          Write-Host "VAULT_ADDR=$env:VAULT_ADDR"

          # postgres on 5432 (choco) — create gb user/db (best-effort; missing DB/migrations
          # are reported as blockers if they prevent readiness).
          try {
            $pgRoot = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name | Select-Object -Last 1
            if ($pgRoot) {
              $pgBin = Join-Path $pgRoot.FullName 'bin'
              $env:PATH = "$pgBin;$env:PATH"
              $svc = Get-Service -Name "postgresql*" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($svc -and $svc.Status -ne 'Running') { Start-Service $svc.Name -ErrorAction SilentlyContinue; Start-Sleep -Seconds 5 }
              & "$pgBin\psql.exe" -U postgres -c 'DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname=''gb'') THEN CREATE ROLE gb LOGIN PASSWORD ''gb''; END IF; END $$;' 2>&1 | Out-Null
              & "$pgBin\psql.exe" -U postgres -c "SELECT 'CREATE DATABASE botserver OWNER gb' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='botserver')\gexec" 2>&1 | Out-Null
            } else {
              Write-Host "::warning::PostgreSQL install directory not found; continuing without DB bootstrap"
            }
          } catch { Write-Host "::warning::PostgreSQL setup failed, continuing: $($_.Exception.Message)" }

          # Best-effort Redis for CACHE_URL. Missing cache must not be a hard blocker
          # for the desktop-local HTTP smoke, but we try to provide it when available.
          try {
            choco install redis-64 --no-progress -y 2>&1 | Out-Null
            $redisSvc = Get-Service -Name "redis*" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($redisSvc -and $redisSvc.Status -ne 'Running') { Start-Service $redisSvc.Name -ErrorAction SilentlyContinue }
          } catch { Write-Host "::warning::Redis unavailable, continuing: $($_.Exception.Message)" }

          # #2166/#2173 — deterministic local OpenAI-compatible mock LLM (no paid providers).
          # Prefer the repo-hardened script (aligned with harness expectations); fall back
          # to a minimal embedded copy if the checkout layout differs in CI artifacts.
          $mockScript = Join-Path (Get-Location) 'scripts\mock_llm.py'
          if (-not (Test-Path $mockScript)) {
            $mockScript = Join-Path $env:RUNNER_TEMP 'mock_llm.py'
            @'
          import json, os, time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          REPLY = os.environ.get('MOCK_REPLY', 'Hello from mock LLM.')
          MODEL = os.environ.get('MOCK_MODEL', 'mock-gpt')
          STATE = {'requests': 0, 'chat_requests': 0, 'embedding_requests': 0, 'stream_requests': 0, 'non_stream_requests': 0, 'errors': 0, 'started_at': int(time.time())}
          class H(BaseHTTPRequestHandler):
              protocol_version = 'HTTP/1.1'
              def log_message(self, *a): pass
              def _send(self, code, obj, ctype='application/json'):
                  body = json.dumps(obj, separators=(',', ':')).encode('utf-8')
                  try:
                      self.send_response(code); self.send_header('Content-Type', ctype); self.send_header('Cache-Control','no-store'); self.send_header('Content-Length', str(len(body))); self.end_headers(); self.wfile.write(body)
                  except Exception:
                      STATE['errors'] += 1
              def _read(self):
                  try:
                      l = int(self.headers.get('Content-Length', '0') or 0)
                      return self.rfile.read(l) if l > 0 else b''
                  except Exception:
                      STATE['errors'] += 1
                      return b''
              def do_GET(self):
                  STATE['requests'] += 1
                  p = self.path.split('?', 1)[0].rstrip('/') or '/'
                  if p in ('/', '/health', '/ready', '/v1/health'):
                      self._send(200, {'status': 'ok', 'ready': True, 'mock': True, 'model': MODEL, **STATE})
                  elif p in ('/v1/models', '/models'):
                      self._send(200, {'object': 'list', 'data': [{'id': MODEL, 'object': 'model', 'owned_by': 'mock'}]})
                  else:
                      self._send(404, {'error': {'message': f'not found: {p}', 'type': 'not_found'}})
              def do_POST(self):
                  STATE['requests'] += 1
                  p = self.path.split('?', 1)[0].rstrip('/') or '/'
                  raw = self._read()
                  try:
                      body = json.loads(raw.decode('utf-8') or '{}') if raw else {}
                  except Exception:
                      body = {}
                      STATE['errors'] += 1
                  if p.endswith('/embeddings'):
                      STATE['embedding_requests'] += 1
                      inp = body.get('input', '')
                      n = len(inp) if isinstance(inp, list) else 1
                      n = max(1, n)
                      self._send(200, {'object': 'list', 'data': [{'object': 'embedding', 'index': i, 'embedding': [0.0] * 8} for i in range(n)], 'model': body.get('model') or MODEL, 'usage': {'prompt_tokens': n, 'total_tokens': n}})
                      return
                  STATE['chat_requests'] += 1
                  stream = bool(body.get('stream', False))
                  created = int(time.time())
                  msg = {'role': 'assistant', 'content': REPLY}
                  if stream:
                      STATE['stream_requests'] += 1
                      try:
                          self.send_response(200); self.send_header('Content-Type', 'text/event-stream; charset=utf-8'); self.send_header('Cache-Control', 'no-cache'); self.send_header('Connection', 'close'); self.end_headers()
                          def chunk(delta, finish=None):
                              payload = {'id': 'chatcmpl-mock', 'object': 'chat.completion.chunk', 'created': created, 'model': body.get('model') or MODEL, 'choices': [{'index': 0, 'delta': delta, 'finish_reason': finish}]}
                              self.wfile.write(('data: ' + json.dumps(payload, separators=(',', ':')) + '\n\n').encode('utf-8'))
                          chunk({'role': 'assistant', 'content': ''}, None)
                          chunk({'content': REPLY}, None)
                          chunk({}, 'stop')
                          self.wfile.write(b'data: [DONE]\n\n'); self.wfile.flush()
                      except Exception:
                          STATE['errors'] += 1
                      finally:
                          self.close_connection = True
                      return
                  STATE['non_stream_requests'] += 1
                  self._send(200, {'id': 'chatcmpl-mock', 'object': 'chat.completion', 'created': created, 'model': body.get('model') or MODEL, 'choices': [{'index': 0, 'message': msg, 'finish_reason': 'stop'}], 'usage': {'prompt_tokens': 1, 'completion_tokens': max(1, len(REPLY.split())), 'total_tokens': max(2, len(REPLY.split()) + 1)}})
          srv = ThreadingHTTPServer(('127.0.0.1', int(os.environ.get('MOCK_PORT', '18080'))), H)
          srv.daemon_threads = True
          srv.allow_reuse_address = True
          srv.serve_forever()
          '@ | Set-Content -Encoding UTF8 $mockScript
            Write-Host "::warning::scripts/mock_llm.py not found; using embedded fallback mock"
          } else {
            Write-Host "Using repo mock LLM script: $mockScript"
          }
          $mockLog = Join-Path (Get-Location) 'mock-llm.log'
          $mockErr = Join-Path (Get-Location) 'mock-llm.log.err'
          $py = if (Get-Command python -ErrorAction SilentlyContinue) { 'python' } elseif (Get-Command py -ErrorAction SilentlyContinue) { 'py' } else { $null }
          if (-not $py) { throw 'Python not found on PATH; required for deterministic local mock LLM' }
          $env:MOCK_HOST = '127.0.0.1'
          $env:MOCK_PORT = '18080'
          $env:MOCK_MODEL = 'mock-gpt'
          $env:MOCK_REPLY = 'Hello from mock LLM.'
          $env:MOCK_MODE = 'answer'
          $env:PYTHONUNBUFFERED = '1'
          $env:PYTHONIOENCODING = 'utf-8'
          $env:MOCK_LOG = (Join-Path (Get-Location) 'mock-llm-requests.log')
          $pyArgs = if ($py -eq 'py') { @('-3', '-u', $mockScript) } else { @('-u', $mockScript) }
          $mockProc = Start-Process -FilePath $py -ArgumentList $pyArgs -PassThru -RedirectStandardOutput $mockLog -RedirectStandardError $mockErr -WindowStyle Hidden
          # Readiness probe (hardened for windows-latest startup jitter).
          $mockReady = $false
          for ($m = 0; $m -lt 30; $m++) {
            Start-Sleep -Milliseconds 500
            if ($mockProc.HasExited) { break }
            try {
              $mh = Invoke-WebRequest -Uri 'http://127.0.0.1:18080/health' -UseBasicParsing -TimeoutSec 2
              if ($mh.StatusCode -eq 200) { $mockReady = $true; $mh.Content | Set-Content "smoke-artifacts/mock-health.json"; break }
            } catch {}
          }
          if (-not $mockReady) {
            Write-Host "=== mock llm log (tail) ==="; Get-Content $mockLog -Tail 80 -ErrorAction SilentlyContinue
            Write-Host "=== mock llm err (tail) ==="; Get-Content $mockErr -Tail 80 -ErrorAction SilentlyContinue
            if ($mockProc -and -not $mockProc.HasExited) { Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue }
            throw "Mock LLM did not become ready on http://127.0.0.1:18080/health"
          }
          Write-Host "Mock LLM ready (pid=$($mockProc.Id)) on 127.0.0.1:18080 via $py script=$mockScript"
          "mock_url=http://127.0.0.1:18080/v1`nreply=Hello from mock LLM.`nscript=$mockScript" | Set-Content "smoke-artifacts/mock-info.txt"

          $log = Join-Path (Get-Location) 'botserver-testbuild.log'
          $proc = Start-Process -FilePath 'target\debug\botserver.exe' -ArgumentList '--noconsole' `
            -WorkingDirectory (Get-Location) -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err" -WindowStyle Hidden

          $dumpLogs = {
            Write-Host "=== botserver log (tail) ==="; Get-Content $log -Tail 160 -ErrorAction SilentlyContinue
            Write-Host "=== botserver err (tail) ==="; Get-Content "$log.err" -Tail 160 -ErrorAction SilentlyContinue
            Write-Host "=== mock llm log (tail) ==="; Get-Content $mockLog -Tail 120 -ErrorAction SilentlyContinue
            Write-Host "=== mock llm err (tail) ==="; Get-Content $mockErr -Tail 120 -ErrorAction SilentlyContinue
            # Best-effort mock health snapshot at failure time for artifacts/debugging.
            try {
              $mhf = Invoke-WebRequest -Uri 'http://127.0.0.1:18080/health' -UseBasicParsing -TimeoutSec 2
              $mhf.Content | Set-Content "smoke-artifacts/mock-health.json"
              Write-Host "=== mock llm health === $($mhf.Content)"
            } catch {}
            # Failure artifacts: screenshot + process/env context (windows-latest).
            try {
              Add-Type -AssemblyName System.Windows.Forms -ErrorAction SilentlyContinue
              Add-Type -AssemblyName System.Drawing -ErrorAction SilentlyContinue
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
              $graphics = [System.Drawing.Graphics]::FromImage($bmp)
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bmp.Save("smoke-artifacts/failure-screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
              $graphics.Dispose(); $bmp.Dispose()
              Write-Host "Saved failure screenshot: smoke-artifacts/failure-screenshot.png"
            } catch { Write-Host "::warning::Could not capture failure screenshot: $($_.Exception.Message)" }
            try {
              Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -match 'botserver|python|py' } |
                Select-Object Id, ProcessName, CPU, StartTime | Format-Table -AutoSize | Out-String |
                Set-Content "smoke-artifacts/processes.txt"
            } catch {}
          }
          $stopAll = {
            # Capture final mock health before stopping (best-effort evidence).
            try {
              $mhf = Invoke-WebRequest -Uri 'http://127.0.0.1:18080/health' -UseBasicParsing -TimeoutSec 2
              $mhf.Content | Set-Content "smoke-artifacts/mock-health-final.json"
            } catch {}
            foreach ($p in @($proc, $mockProc)) {
              if ($p -and -not $p.HasExited) {
                try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
              }
            }
          }

          $ready = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri 'http://localhost:8080/api/product' -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) {
                $payload = $r.Content | ConvertFrom-Json
                Write-Host "api/product: $($r.Content)"
                $r.Content | Set-Content "smoke-artifacts/api-product.json"
                if ($payload.suite_default_app -ne 'chat') {
                  throw "/api/product suite_default_app expected 'chat', got '$($payload.suite_default_app)'"
                }
                $apps = @($payload.apps)
                if ($apps -notcontains 'chat') {
                  throw "/api/product apps must include 'chat'"
                }
                $ready = $true
                break
              }
            } catch {
              $msg = $_.Exception.Message
              if ($msg -match "suite_default_app expected|apps must include") {
                & $dumpLogs
                & $stopAll
                throw $msg
              }
              if ($i % 10 -eq 0) { Write-Host "attempt $i not ready: $msg" }
            }
          }
          if (-not $ready) {
            & $dumpLogs
            & $stopAll
            throw "botserver did not become ready on /api/product with desktop-local chat profile"
          }

          # Required HTTP assertions (#2166): /health, /api/product, /suite/desktop.html
          try {
            $h = Invoke-WebRequest -Uri 'http://localhost:8080/health' -UseBasicParsing -TimeoutSec 10
            if ($h.StatusCode -ne 200) { throw "/health expected 200, got $($h.StatusCode)" }
            $healthJson = $h.Content | ConvertFrom-Json
            $h.Content | Set-Content "smoke-artifacts/health.json"
            Write-Host "/health OK (200)"

            $p = Invoke-WebRequest -Uri 'http://localhost:8080/api/product' -UseBasicParsing -TimeoutSec 10
            if ($p.StatusCode -ne 200) { throw "/api/product expected 200, got $($p.StatusCode)" }
            $product = $p.Content | ConvertFrom-Json
            if ($product.suite_default_app -ne 'chat') {
              throw "/api/product suite_default_app expected 'chat', got '$($product.suite_default_app)'"
            }
            $apps = @($product.apps)
            if ($apps -notcontains 'chat') { throw "/api/product apps must include 'chat'" }
            if ($apps -notcontains 'drive') { throw "/api/product apps must include 'drive'" }
            if (($product.no_security -ne $true) -and ("$($product.no_security)" -ne 'true')) {
              throw "/api/product expected no_security=true for unauthenticated desktop-local smoke"
            }
            $p.Content | Set-Content "smoke-artifacts/api-product.json"
            Write-Host "/api/product OK (200, suite_default_app=chat, no_security=true)"

            $d = Invoke-WebRequest -Uri 'http://localhost:8080/suite/desktop.html' -UseBasicParsing -TimeoutSec 10
            if ($d.StatusCode -ne 200) { throw "/suite/desktop.html expected 200, got $($d.StatusCode)" }
            if (-not $d.Content -or $d.Content.Length -lt 256) { throw "/suite/desktop.html body is unexpectedly small ($($d.Content.Length) bytes)" }
            if ($d.Content -notmatch '<html|<!DOCTYPE html|desktop|suite') {
              throw "/suite/desktop.html did not contain expected shell markers"
            }
            # Save a small marker (not the full shell) for evidence.
            "status=200`nlength=$($d.Content.Length)`nmarker=ok" | Set-Content "smoke-artifacts/desktop-html.txt"
            Write-Host "/suite/desktop.html OK (200, $($d.Content.Length) bytes)"
          } catch {
            Write-Host "HTTP assertion failed: $($_.Exception.Message)"
            & $dumpLogs
            & $stopAll
            throw "required HTTP smoke assertions failed"
          }

          # Headless chat e2e smoke (#2166/#2173): POST /api/chat must return 200 with
          # a usable assistant reply. Deterministic local mock LLM only (127.0.0.1).
          # Hardened for windows-latest: retry transient startup/routing delays and
          # capture structured failure artifacts for diagnosis.
          $chatOk = $false
          $chatReply = ''
          $chatAttempts = @()
          $fallbackNoProvider = 'Configure an LLM provider to enable AI replies.'
          $fallbackNoLlm = 'No LLM provider configured'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              $body = @{ message = "hi"; prompt = "hi" } | ConvertTo-Json -Compress
              $resp = Invoke-WebRequest -Uri 'http://localhost:8080/api/chat' -Method POST -Body $body -ContentType 'application/json' -UseBasicParsing -TimeoutSec 45
              Write-Host "chat attempt ${attempt}: status=$($resp.StatusCode)"
              $resp.Content | Set-Content "smoke-artifacts/chat-attempt-$attempt.json"
              $json = $null
              try { $json = $resp.Content | ConvertFrom-Json } catch { $json = $null }
              $hasPayload = $false
              $replyCandidate = ''
              $keys = @()
              if ($json) {
                $keys = @($json.PSObject.Properties.Name)
                $replyCandidate = [string]($json.reply)
                if (-not $replyCandidate) { $replyCandidate = [string]($json.message) }
                if (-not $replyCandidate) { $replyCandidate = [string]($json.content) }
                if (-not $replyCandidate -and $json.response) { $replyCandidate = [string]($json.response) }
                $hasPayload = [bool]($replyCandidate -or $json.text -or $json.choices)
              } else {
                $hasPayload = ($resp.Content -match '"reply"|"message"|"content"|"text"|"choices"|"response"')
              }
              $isFallback = ($replyCandidate -like "*$fallbackNoProvider*" -or $replyCandidate -like "*$fallbackNoLlm*")
              $chatAttempts += [pscustomobject]@{ attempt = $attempt; status = $resp.StatusCode; hasPayload = $hasPayload; isFallback = $isFallback; keys = $keys; reply = $replyCandidate }
              if ($replyCandidate) { $chatReply = $replyCandidate }
              # Preserve latest response as canonical chat artifacts.
              $resp.Content | Set-Content "smoke-artifacts/chat.json"
              @{ status = $resp.StatusCode; hasPayload = $hasPayload; isFallback = $isFallback; keys = $keys; reply = $replyCandidate; attempt = $attempt } |
                ConvertTo-Json -Compress | Set-Content "smoke-artifacts/chat-meta.json"
              if ($resp.StatusCode -eq 200 -and $hasPayload -and -not $isFallback) {
                $chatOk = $true
                if ($chatReply -match 'mock' -or $chatReply -match 'Hello from mock LLM') {
                  Write-Host "chat reply came from deterministic mock LLM"
                } else {
                  Write-Host "::warning::Chat returned non-fallback reply but mock marker not found; mock-path not proven by content"
                }
                break
              }
              if ($isFallback) {
                Write-Host "chat attempt ${attempt}: fallback/no-provider reply detected: '$replyCandidate'"
              } else {
                Write-Host "chat attempt ${attempt}: response not usable yet (hasPayload=$hasPayload)"
              }
            } catch {
              Write-Host "chat attempt ${attempt} failed: $($_.Exception.Message)"
              $_.Exception.Message | Set-Content "smoke-artifacts/chat-error-attempt-$attempt.txt"
              $chatAttempts += [pscustomobject]@{ attempt = $attempt; status = 'error'; hasPayload = $false; isFallback = $false; error = $_.Exception.Message }
              if ($_.Exception.Response) {
                try {
                  $sr = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
                  $errBody = $sr.ReadToEnd()
                  $errBody | Set-Content "smoke-artifacts/chat-error-body-attempt-$attempt.txt"
                  $errBody | Set-Content "smoke-artifacts/chat-error-body.txt"
                  Write-Host "chat attempt ${attempt} error body: $errBody"
                } catch {}
              }
              $_.Exception.Message | Set-Content "smoke-artifacts/chat-error.txt"
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds 3 }
          }
          $chatAttempts | ConvertTo-Json -Depth 5 | Set-Content "smoke-artifacts/chat-attempts.json"
          "reply=$chatReply" | Set-Content "smoke-artifacts/chat-reply.txt"
          try {
            $mh = Invoke-WebRequest -Uri 'http://127.0.0.1:18080/health' -UseBasicParsing -TimeoutSec 5
            $mh.Content | Set-Content "smoke-artifacts/mock-health.json"
            Write-Host "mock health: $($mh.Content)"
          } catch { Write-Host "mock health probe unavailable: $($_.Exception.Message)" }
          if (-not $chatOk) {
            Write-Host "=== botserver log (tail, chat) ==="; Get-Content $log -Tail 180 -ErrorAction SilentlyContinue
            & $dumpLogs
            & $stopAll
            throw "desktop-local chat e2e smoke failed (expected non-fallback assistant reply; mock LLM preferred)"
          }

          & $stopAll
          $mockCalls = 0
          try {
            $mhf = Get-Content "smoke-artifacts/mock-health-final.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
            if ($mhf) { $mockCalls = [int]($mhf.chat_requests) }
          } catch {}
          # Strong proof for #2166: a successful chat e2e run must exercise the local mock.
          if ($mockCalls -lt 1) {
            Write-Host "::warning::mock_chat_requests=$mockCalls in final health snapshot; mock-path not proven by counter"
          } else {
            Write-Host "mock_chat_requests=$mockCalls (deterministic local mock exercised)"
          }
          "status=ok`nendpoint=/api/chat`nmode=local-mock-llm`nmock_chat_requests=$mockCalls`nmock_script=$mockScript" | Set-Content "smoke-artifacts/smoke-summary.txt"
          Write-Host "Smoke boot + HTTP assertions + chat e2e smoke OK (mock_chat_requests=$mockCalls)"


      - name: Upload staged build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-testbuild-${{ github.sha }}
          path: dist/testbuild
          if-no-files-found: warn

      - name: Upload smoke evidence and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-testbuild-smoke-${{ github.sha }}
          path: |
            botserver-testbuild.log
            botserver-testbuild.log.err
            mock-llm.log
            mock-llm.log.err
            mock-llm-requests.log
            smoke-artifacts/**
          if-no-files-found: warn
