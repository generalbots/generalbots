name: Vendored drive binaries v4

# OtterIO and OC publish real release binaries with checksums. The release
# workflow therefore vendors the pinned upstream assets into the internal
# `drive-bin-v4` release instead of building a server from source. Re-run it
# only to rebuild that internal release; it refuses to replace an existing one.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.8"

      - name: Fetch the pinned OtterIO server binaries
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/dist/drive-bin-v4"
          mkdir -p "$OUT"
          BASE="https://github.com/soulteary/otterio/releases/download/RELEASE.2026-11-25T20-30-00Z"
          curl -fsSL --retry 3 -o "$OUT/otterio" "$BASE/otterio-linux-amd64"
          echo "cd8cfcc59f31829665adba12abe70ec79308245a3f7b2bb46376917f617b3aa7  $OUT/otterio" | sha256sum -c -
          curl -fsSL --retry 3 -o "$OUT/otterio.exe" "$BASE/otterio-windows-amd64.exe"
          echo "25049f76f49ac6e988eb8481c6a94f8632a8494e5554b68dc98c1aa2163e6a01  $OUT/otterio.exe" | sha256sum -c -

      - name: Fetch the pinned OC client archives
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/dist/drive-bin-v4"
          BASE="https://github.com/soulteary/oc/releases/download/RELEASE.2026-11-25T20-30-01Z"
          curl -fsSL --retry 3 -o "$OUT/oc-RELEASE.2026-11-25T20-30-01Z-linux-amd64.tar.gz" \
            "$BASE/oc-RELEASE.2026-11-25T20-30-01Z-linux-amd64.tar.gz"
          echo "b410af77b1473da1c14cf5cecf3684087162da150d50f0c59034c25b4a25794c  $OUT/oc-RELEASE.2026-11-25T20-30-01Z-linux-amd64.tar.gz" | sha256sum -c -
          curl -fsSL --retry 3 -o "$OUT/oc-RELEASE.2026-11-25T20-30-01Z-windows-amd64.zip" \
            "$BASE/oc-RELEASE.2026-11-25T20-30-01Z-windows-amd64.zip"
          echo "3630178855befd300f4baf3933652af03f156d577cfc5f654a3d619516f77881  $OUT/oc-RELEASE.2026-11-25T20-30-01Z-windows-amd64.zip" | sha256sum -c -

      - name: Create the checksum manifest
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist/drive-bin-v4"
          sha256sum otterio \
            oc-RELEASE.2026-11-25T20-30-01Z-linux-amd64.tar.gz \
            otterio.exe \
            oc-RELEASE.2026-11-25T20-30-01Z-windows-amd64.zip > SHA256SUMS-drive-bin
          cat SHA256SUMS-drive-bin

      - name: Publish the internal drive-bin-v4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view drive-bin-v4 >/dev/null 2>&1; then
            echo "::error::drive-bin-v4 already exists; refusing to replace it"
            exit 1
          fi
          gh release create drive-bin-v4 \
            dist/drive-bin-v4/otterio \
            dist/drive-bin-v4/oc-RELEASE.2026-11-25T20-30-01Z-linux-amd64.tar.gz \
            dist/drive-bin-v4/otterio.exe \
            dist/drive-bin-v4/oc-RELEASE.2026-11-25T20-30-01Z-windows-amd64.zip \
            dist/drive-bin-v4/SHA256SUMS-drive-bin \
            --prerelease \
            --title "Vendored drive binaries v4 (OtterIO + OC)" \
            --notes "Pinned upstream OtterIO and OC release assets, verified by their published SHA-256 digests. Internal asset for the General Bots release workflow."
