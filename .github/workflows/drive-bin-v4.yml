name: Vendored drive binaries v4

# #2612 — RELEASE.2025-10-15T17-29-55Z fixes CVE-2025-62506 but publishes no
# binary assets (dl.min.io is 410). The release workflow therefore fetches
# source-built binaries from the internal `drive-bin-v4` release. This workflow
# produces that release from the immutable, checksum-pinned source tag recorded
# in botserver/3rdparty.toml. Re-run it only to rebuild the internal release;
# it refuses to replace an existing one.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.8"

      - name: Build the CVE-fixed MinIO for Linux and Windows
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/dist/drive-bin-v4"
          mkdir -p "$OUT"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          TAG="RELEASE.2025-10-15T17-29-55Z"
          SHA="9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a"
          SOURCE_SHA="be6d0bd3696c3a13a35f02d3a0280b64319c67918b4501c5c3d87f96d000085c"
          curl -fsSL --retry 3 --max-time 180 -o "$WORK/minio.tar.gz" \
            "https://github.com/minio/minio/archive/refs/tags/${TAG}.tar.gz"
          echo "${SOURCE_SHA}  ${WORK}/minio.tar.gz" | sha256sum -c -
          tar xzf "$WORK/minio.tar.gz" -C "$WORK"
          cd "${WORK}/minio-${TAG}"
          LDFLAGS="-X github.com/minio/minio/cmd.Version=${TAG}"
          LDFLAGS+=" -X github.com/minio/minio/cmd.ReleaseTag=${TAG}"
          LDFLAGS+=" -X github.com/minio/minio/cmd.CommitID=${SHA}"
          LDFLAGS+=" -X github.com/minio/minio/cmd.ShortCommitID=${SHA:0:12}"
          CGO_ENABLED=0 go build -tags kqueue -trimpath --ldflags "$LDFLAGS" -o "$OUT/minio" .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath --ldflags "$LDFLAGS" -o "$OUT/minio.exe" .
          "$OUT/minio" --version 2>&1 | head -2

      - name: Fetch the pinned MinIO Client binaries
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/dist/drive-bin-v4"
          BASE="https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z"
          curl -fsSL --retry 3 -o "$OUT/mc" \
            "$BASE/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z"
          curl -fsSL --retry 3 -o "$OUT/mc.exe" \
            "$BASE/mc.windows-amd64.RELEASE.2025-08-13T08-35-41Z.exe"
          echo "01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891  $OUT/mc" | sha256sum -c -
          echo "c8db13ebeda31497f354c0e950809db0ae9b2a2a69b8afee68c128c37300c157  $OUT/mc.exe" | sha256sum -c -

      - name: Create the checksum manifest
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist/drive-bin-v4"
          sha256sum minio mc minio.exe > SHA256SUMS-drive-bin
          cat SHA256SUMS-drive-bin

      - name: Publish the internal drive-bin-v4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view drive-bin-v4 >/dev/null 2>&1; then
            echo "::error::drive-bin-v4 already exists; refusing to replace it"
            exit 1
          fi
          gh release create drive-bin-v4 \
            dist/drive-bin-v4/minio \
            dist/drive-bin-v4/mc \
            dist/drive-bin-v4/minio.exe \
            dist/drive-bin-v4/SHA256SUMS-drive-bin \
            --prerelease \
            --title "Vendored drive binaries v4 (CVE-2025-62506 fixed MinIO)" \
            --notes "Source-built MinIO RELEASE.2025-10-15T17-29-55Z from the pinned archive in botserver/3rdparty.toml; mc from the pinned upstream release. Internal asset for the General Bots release workflow."
