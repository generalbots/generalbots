name: Mobile artifacts (manual)

# #2586 Phase A — on-demand mobile builds only. This workflow is never run by
# push, tag or the release publish gate; a human dispatches it with an explicit
# HTTPS botserver origin. Android uses the Gradle debug keystore. iOS uses
# ad-hoc/debugging signing, which still requires an Apple Development Team ID.
#
# Where to get the "Apple key" (a 10-character TEAM ID, not a password):
#   * Free personal team (enough for an ad-hoc/debug IPA): on a Mac open
#     Xcode -> Settings -> Accounts -> your Apple ID -> Team ID. Sign in with
#     the same Apple ID on the runner's xcodebuild; Xcode creates the free
#     provisioning profile automatically. No paid account or .p12 needed.
#   * Paid team: Apple Developer -> Membership -> Team ID (also shown in
#     App Store Connect -> Users and Access).
#   * A distribution certificate is only needed for App Store/ad-hoc release
#     export. Set APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD
#     and APPLE_SIGNING_IDENTITY as repo secrets if that is ever required.
#
# Supply the Team ID either as the `apple_team_id` dispatch input (masked in
# logs) or, preferably, as a repo secret named APPLE_DEVELOPMENT_TEAM (the
# legacy name) or APPLE_TEAM_ID. Resolution order:
#   secrets.APPLE_DEVELOPMENT_TEAM > secrets.APPLE_TEAM_ID > inputs.apple_team_id
# Never commit a real Team ID to this file.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which mobile platform to build"
        required: true
        type: choice
        default: android
        options:
          - android
          - ios
          - both
      botserver_url:
        description: "Bare HTTPS origin of the botserver (no public default)"
        required: true
        type: string
      tag:
        description: "Artifact name suffix ([A-Za-z0-9][A-Za-z0-9._-]{0,63})"
        required: true
        type: string
        default: manual
      apple_team_id:
        description: "Apple Development Team ID for the ad-hoc IPA (or set the APPLE_TEAM_ID / APPLE_DEVELOPMENT_TEAM repo secret). Masked in logs."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: mobile-artifacts-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate manual inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate origin, tag and platform
        env:
          BOTSERVER_URL: ${{ inputs.botserver_url }}
          ARTIFACT_TAG: ${{ inputs.tag }}
          PLATFORM: ${{ inputs.platform }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM || secrets.APPLE_TEAM_ID || inputs.apple_team_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress
          import os
          import re
          import sys
          from urllib.parse import urlparse

          url = os.environ["BOTSERVER_URL"].strip()
          parsed = urlparse(url)
          if (
              parsed.scheme != "https"
              or not parsed.netloc
              or parsed.username
              or parsed.password
              or parsed.path not in ("", "/")
              or parsed.query
              or parsed.fragment
          ):
              print("::error::botserver_url must be a bare HTTPS origin: https://<host>[:port]")
              sys.exit(1)
          host = parsed.hostname or ""
          if not host or host == "localhost" or host.endswith(".local"):
              print("::error::botserver_url must be a DNS host, not a loopback/local name")
              sys.exit(1)
          try:
              ipaddress.ip_address(host)
          except ValueError:
              pass
          else:
              print("::error::botserver_url must be a DNS name, not an IP address")
              sys.exit(1)
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,63}", os.environ["ARTIFACT_TAG"].strip()):
              print("::error::tag must match [A-Za-z0-9][A-Za-z0-9._-]{0,63}")
              sys.exit(1)
          if os.environ["PLATFORM"] not in {"android", "ios", "both"}:
              print("::error::platform must be android, ios or both")
              sys.exit(1)
          team = os.environ.get("APPLE_TEAM_ID", "").strip()
          if team:
              print("::add-mask::" + team)
          if os.environ["PLATFORM"] in {"ios", "both"}:
              if not team:
                  print("::error::iOS needs an Apple Development Team ID. Set the "
                        "APPLE_TEAM_ID (or APPLE_DEVELOPMENT_TEAM) repo secret, or pass "
                        "apple_team_id at dispatch. Xcode -> Settings -> Accounts -> "
                        "Team ID (free personal team works for ad-hoc debugging).")
                  sys.exit(1)
              if not re.fullmatch(r"[A-Z0-9]{10}", team):
                  print("::error::Apple Team ID must be the 10-character identifier "
                        "shown in Xcode / Apple Developer (letters and digits only)")
                  sys.exit(1)
              print("apple team: resolved and masked (10 characters)")
          print("inputs valid; botserver origin = https://<host> (hostname redacted)")
          PY

  android:
    name: Android debug APK + AAB
    needs: [validate]
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BOTSERVER_URL: ${{ inputs.botserver_url }}
      ARTIFACT_TAG: ${{ inputs.tag }}
      # Resolved from setup-android's exported ANDROID_HOME below.
      NDK_VERSION: "26.3.11579264"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Print redacted botserver origin
        env:
          BOTSERVER_URL: ${{ inputs.botserver_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          origin = os.environ["BOTSERVER_URL"].strip()
          host = urlparse(origin).hostname or ""
          print(f"::add-mask::{host}")
          print(f"::add-mask::{origin}")
          print("Resolved botserver origin: https://<host> (hostname redacted in public logs)")
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install NDK and export SDK paths
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}"
          : "${JAVA_HOME:?setup-java did not export JAVA_HOME}"
          : "${ANDROID_HOME:?setup-android did not export ANDROID_HOME}"
          TOOLCHAIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android34-clang"
          {
            echo "JAVA_HOME=$JAVA_HOME"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
            echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android34-clang"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$TOOLCHAIN/x86_64-linux-android34-clang"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: mobile-artifacts-android
          packages: build-essential clang mold pkg-config zstd libpq-dev libssl-dev liblzma-dev zlib1g-dev
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Generate mobile Tauri config override
        env:
          BOTSERVER_URL: ${{ inputs.botserver_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          origin = os.environ["BOTSERVER_URL"].strip().rstrip("/")
          with open("botapp/tauri.mobile.conf.json", encoding="utf-8") as handle:
              conf = json.load(handle)
          csp = conf["app"]["security"]["csp"]
          marker = "connect-src "
          if marker not in csp:
              raise SystemExit("connect-src directive missing from tauri.conf.json CSP")
          csp = csp.replace(marker, f"{marker}{origin} ", 1)
          out = os.path.join(os.environ["RUNNER_TEMP"], "tauri.mobile.json")
          with open(out, "w", encoding="utf-8") as handle:
              json.dump({"app": {"security": {"csp": csp}}}, handle)
          print(f"mobile Tauri config override written to {out}")
          PY
      - name: Build debug-signed APK and AAB
        working-directory: botapp
        env:
          GB_MOBILE_SERVER_URL: ${{ inputs.botserver_url }}
        run: |
          set -euo pipefail
          cargo tauri android init --ci -c tauri.mobile.conf.json
          cargo tauri android build --ci --debug --apk --aab \
            -f mobile thin-client custom-protocol \
            -c tauri.mobile.conf.json -c "$RUNNER_TEMP/tauri.mobile.json"
      - name: Upload Android artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-android-${{ inputs.tag }}
          path: |
            botapp/gen/android/app/build/outputs/apk/**/*.apk
            botapp/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS ad-hoc IPA
    needs: [validate]
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      BOTSERVER_URL: ${{ inputs.botserver_url }}
      ARTIFACT_TAG: ${{ inputs.tag }}
      # Resolution order documented at the top of this file. Never echo these.
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || secrets.APPLE_TEAM_ID || inputs.apple_team_id }}
      # Distribution secrets are optional; ad-hoc/debug builds do not need them.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Print redacted botserver origin
        env:
          BOTSERVER_URL: ${{ inputs.botserver_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          origin = os.environ["BOTSERVER_URL"].strip()
          host = urlparse(origin).hostname or ""
          print(f"::add-mask::{host}")
          print(f"::add-mask::{origin}")
          print("Resolved botserver origin: https://<host> (hostname redacted in public logs)")
          PY
      - name: Select Xcode and install CocoaPods
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          sudo gem install cocoapods --no-document
          pod --version
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: mobile-artifacts-ios
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Generate mobile Tauri config override
        env:
          BOTSERVER_URL: ${{ inputs.botserver_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          origin = os.environ["BOTSERVER_URL"].strip().rstrip("/")
          with open("botapp/tauri.mobile.conf.json", encoding="utf-8") as handle:
              conf = json.load(handle)
          csp = conf["app"]["security"]["csp"]
          marker = "connect-src "
          if marker not in csp:
              raise SystemExit("connect-src directive missing from tauri.conf.json CSP")
          csp = csp.replace(marker, f"{marker}{origin} ", 1)
          out = os.path.join(os.environ["RUNNER_TEMP"], "tauri.mobile.json")
          with open(out, "w", encoding="utf-8") as handle:
              team = os.environ.get("APPLE_DEVELOPMENT_TEAM", "").strip()
              if not team:
                  raise SystemExit("APPLE_DEVELOPMENT_TEAM is empty: set the APPLE_TEAM_ID secret or pass apple_team_id")
              print("::add-mask::" + team)
              # tauri-cli reads app.apple.developmentTeam from the merged config;
              # the env var alone is not enough for iOS init.
              json.dump({"app": {
                  "security": {"csp": csp},
                  "apple": {"developmentTeam": team}
              }}, handle)
          print("mobile Tauri config override written with a masked Apple team")
          PY
      - name: Build ad-hoc IPA
        working-directory: botapp
        env:
          GB_MOBILE_SERVER_URL: ${{ inputs.botserver_url }}
          # Ad-hoc/debugging export: Xcode creates a free provisioning profile
          # from APPLE_DEVELOPMENT_TEAM resolved at job level; no paid account
          # or .p12 is needed unless APPLE_CERTIFICATE is configured above.
          CODE_SIGN_IDENTITY: "-"
        run: |
          set -euo pipefail
          cargo tauri ios init --ci -c tauri.mobile.conf.json
          cargo tauri ios build --ci --debug --target aarch64 \
            --export-method debugging \
            -f mobile thin-client custom-protocol \
            -c tauri.mobile.conf.json -c "$RUNNER_TEMP/tauri.mobile.json"
      - name: Upload iOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-ios-${{ inputs.tag }}
          path: botapp/gen/apple/build/arm64/*.ipa
          if-no-files-found: error
          retention-days: 14
