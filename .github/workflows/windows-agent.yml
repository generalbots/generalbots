name: Windows agent VM adapter

on:
  # Reusable from `.github/workflows/ci.yml`; existing triggers are preserved.
  workflow_call:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the Windows agent/VM adapters
        run: cargo check --lib -p botagent -p botvibe
