name: Windows agent VM adapter

on:
  # Reusable from `.github/workflows/ci.yml`; existing triggers are preserved.
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the Windows agent/VM adapters
        run: cargo check --lib -p botagent -p botvibe
