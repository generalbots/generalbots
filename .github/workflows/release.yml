name: Release

# #1851 — one all-inclusive binary release.
#
# Triggered by a version tag (`vMAJOR.MINOR.PATCH`) or a manual dispatch that
# names an existing tag. It builds and publishes exactly one normal release at
# that tag:
#
#   linux       tarball, self-extracting `generalbots`, deb/rpm/AppImage, raw
#               `generalbots`/`botserver`/`botui` binaries
#   windows     generalbots.exe, MSI, NSIS setup, raw exes (including botui)
#   pythonbox   BotModels Linux/Windows self-contained bundles
#
# Everything lands on one release with one `MANIFEST.json` and one combined
# `SHA256SUMS`. The Linux tarball keeps its tag-free alias, so
# /releases/latest/download/generalbots-linux-x86_64.tar.gz resolves to this
# release.
#
# NOTE: a push to `main` does not publish a release — releases are cut on
# purpose by pushing a `v*.*.*` tag or dispatching this workflow with an
# existing tag.
#
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing product tag (for example v7.0.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Resolve the product tag
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and verify the release tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-$REF_NAME}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must look like vMAJOR.MINOR.PATCH (got '$VERSION')"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/${VERSION}^{commit}" >/dev/null; then
            echo "::error::tag ${VERSION} does not exist"
            exit 1
          fi
          TAG_SHA="$(git rev-parse "refs/tags/${VERSION}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::checked-out commit does not match tag ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if ! python3 scripts/whats_new.py --file whatsnew.md render --version "$VERSION" >> "$GITHUB_STEP_SUMMARY"; then
            echo "::warning::whatsnew.md has no section for ${VERSION}; continuing without release notes"
          fi
          {
            echo "### Product release ${VERSION}"
            echo
            echo "- tag: ${VERSION} at $(git rev-parse --short HEAD)"
            echo "- build ref: the tag commit"
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux binaries
    needs: [release]
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: release-linux
          packages: build-essential clang mold pkg-config zstd libpq-dev libssl-dev liblzma-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build botserver (desktop-local)
        # #1868 — a packaged desktop must connect Gmail/Drive/Outlook with no
        # user registration. The ids are public identifiers (not secrets), so
        # they travel as repository variables and land in the binary through
        # `option_env!` in botlib/src/managed_oauth.rs. Empty variables are
        # fine: the build then behaves exactly as before and the wizard still
        # offers the per-installation app configuration.
        env:
          GB_OAUTH_GOOGLE_CLIENT_ID: ${{ vars.GB_OAUTH_GOOGLE_CLIENT_ID }}
          GB_OAUTH_MICROSOFT_CLIENT_ID: ${{ vars.GB_OAUTH_MICROSOFT_CLIENT_ID }}
        run: cargo build -p botserver --release --no-default-features --features desktop-local

      - name: Build botui
        run: cargo build -p botui --release

      - name: Build desktop shell
        run: cargo build -p botapp --release --features desktop-local,custom-protocol

      - name: Fetch vendored drive binaries
        run: |
          set -euo pipefail
          # MinIO archived the OSS server/client and removed the binaries from
          # dl.min.io (HTTP 410). The last working Linux build is vendored in a
          # release and pinned by checksum, so a first run always has a drive.
          # Replace with a maintained S3 server when the drive component moves.
          mkdir -p dist/installers
          BASE="https://github.com/generalbots/generalbots/releases/download/drive-bin-v3"
          for f in minio mc SHA256SUMS-drive-bin; do
            for attempt in 1 2 3 4 5; do
              if curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "dist/installers/$f" "$BASE/$f"; then
                break
              fi
              echo "fetch $f attempt $attempt failed; sleeping $((attempt*5))s"
              sleep $((attempt*5))
            done
            test -s "dist/installers/$f"
          done
          (cd dist/installers && sha256sum -c SHA256SUMS-drive-bin)
          chmod +x dist/installers/minio dist/installers/mc

      - name: Fetch the BotModels pythonbox
        run: |
          set -euo pipefail
          # BotModels ships as a self-contained pythonbox (relocatable CPython +
          # service sources). Carrying it in installers/ means the desktop
          # edition provisions the AI media service without a network round
          # trip; its virtual environment still resolves on first use.
          TAG=$(git ls-remote --tags --refs https://github.com/generalbots/generalbots.git 'pythonbox-*' \
            | awk '{print $2}' | sed 's#refs/tags/##' | sort | tail -n 1)
          if [ -z "$TAG" ]; then
            echo "::warning::no pythonbox release found; the installer ships without BotModels"
            exit 0
          fi
          mkdir -p dist/installers
          curl -fsSL -o dist/installers/botmodels-pythonbox-linux-x86_64.tar.gz \
            "https://github.com/generalbots/generalbots/releases/download/${TAG}/botmodels-pythonbox-linux-x86_64.tar.gz"
          # Fail-closed: every pythonbox-* release must ship SHA256SUMS-pythonbox
          # next to the tarball (#2002). A missing sums asset aborts the build
          # rather than bundling an unverified binary.
          curl -fsSL -o dist/installers/SHA256SUMS-pythonbox \
            "https://github.com/generalbots/generalbots/releases/download/${TAG}/SHA256SUMS-pythonbox"
          (cd dist/installers && grep 'botmodels-pythonbox-linux-x86_64.tar.gz' SHA256SUMS-pythonbox | sha256sum -c -)
          echo "bundled ${TAG} ($(du -h dist/installers/botmodels-pythonbox-linux-x86_64.tar.gz | cut -f1))"

      - name: Assemble Linux installer
        run: |
          set -euo pipefail
          chmod +x desktop/linux/package.sh
          TAG="${{ needs.release.outputs.version }}"
          ./desktop/linux/package.sh "$TAG" target/release dist dist/installers
          # package.sh writes both the versioned tarball and the tag-free copy
          # used by .../releases/latest/download/generalbots-linux-x86_64.tar.gz.
          # Raw binaries stay attached so a single component can be inspected
          # without unpacking the suite.
          cp target/release/botapp    dist/generalbots-linux-x86_64
          cp target/release/botserver dist/botserver-linux-x86_64
          cp target/release/botui     dist/botui-linux-x86_64
          chmod +x dist/generalbots-linux-x86_64 dist/botserver-linux-x86_64 dist/botui-linux-x86_64
          (cd dist && sha256sum generalbots-linux-x86_64 botserver-linux-x86_64 botui-linux-x86_64 >> SHA256SUMS-linux)
          ls -lh dist

      # #1633 — one self-extracting executable: the app with the stack
      # appended as [payload.tar.zst][magic+offset+length+sha256].
      - name: Build self-extracting binary
        run: |
          set -euo pipefail
          rm -rf dist/payload
          mkdir -p dist/payload/bin dist/payload/ui
          cp target/release/botserver dist/payload/botserver
          cp target/release/botui    dist/payload/botui
          test -x dist/payload/botui
          cp -a botui/ui/suite  dist/payload/ui/suite
          cp -a botui/ui/themes dist/payload/ui/themes
          cp botserver/.product.desktop-local dist/payload/
          if [ -d dist/installers ]; then
            cp -a dist/installers/. dist/payload/installers/
          fi
          python3 scripts/build-self-extractor.py \
            --app target/release/botapp \
            --payload dist/payload \
            --out dist/generalbots
          chmod +x dist/generalbots
          (cd dist && sha256sum generalbots >> SHA256SUMS-linux)
          # Offline inspection works without a display:
          ./dist/generalbots --version
          ./dist/generalbots --verify

      # Distro installers: .deb, .rpm and .AppImage from the same binaries.
      # Best effort on purpose — a bundler regression must never hide the
      # tarball and the single-file executable from the release.
      - name: Install Tauri bundler
        run: cargo install tauri-cli --version "^2" --locked

      - name: Package deb, rpm and AppImage
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends rpm libfuse2
          # bundle.externalBin resolves with the target-triple suffix, and
          # bundle.resources globs are relative to botapp/.
          mkdir -p botapp/binaries botserver/botserver-installers
          cp target/release/botserver \
            botapp/binaries/botserver-x86_64-unknown-linux-gnu
          cp -a dist/installers/. botserver/botserver-installers/
          cd botapp
          cargo tauri build \
            --features desktop-local,custom-protocol \
            --config tauri.desktop-local.conf.json \
            --bundles deb,rpm,appimage

      # #1787 — prove the generated Depends actually resolves on the two
      # current Debian-family releases. Docker is preinstalled on ubuntu-latest,
      # so this is the authoritative container check; the script falls back to
      # dpkg/apt simulation when no daemon is reachable.
      - name: Verify the .deb installs on Debian 13 and Ubuntu 24.04
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb botapp/target/release/bundle/deb/*.deb)
          if [ "${#debs[@]}" -eq 0 ]; then
            echo "::warning::the bundler produced no .deb; skipping the install test"
            exit 0
          fi
          chmod +x desktop/linux/test-deb-install.sh
          desktop/linux/test-deb-install.sh "${debs[0]}"

      - name: Collect Linux packages
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-$PWD}"
          mkdir -p dist
          TAG="${{ needs.release.outputs.version }}"
          VERSION="${TAG#v}"
          shopt -s nullglob
          collect() {
            local glob="$1" versioned="$2"
            for f in $glob; do
              cp "$f" "dist/$versioned"
              return 0
            done
            echo "::warning::no package matched $glob — $versioned will not be published"
            return 0
          }
          collect "target/release/bundle/deb/*.deb botapp/target/release/bundle/deb/*.deb" \
            "generalbots-${VERSION}-linux-x86_64.deb"
          collect "target/release/bundle/rpm/*.rpm botapp/target/release/bundle/rpm/*.rpm" \
            "generalbots-${VERSION}-linux-x86_64.rpm"
          collect "target/release/bundle/appimage/*.AppImage botapp/target/release/bundle/appimage/*.AppImage" \
            "generalbots-${VERSION}-linux-x86_64.AppImage"
          cd dist
          for f in generalbots-linux-x86_64.deb "generalbots-${VERSION}-linux-x86_64.deb" \
                   generalbots-linux-x86_64.rpm "generalbots-${VERSION}-linux-x86_64.rpm" \
                   generalbots-linux-x86_64.AppImage "generalbots-${VERSION}-linux-x86_64.AppImage"; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> SHA256SUMS-linux
            fi
          done
          # Inside dist/ (after the cd above) — listing `dist` again looks for
          # dist/dist and aborts the job, which is why the Linux installer was
          # never attached to a release (.35–.38 shipped Windows-only).
          ls -lh

      # A published installer is only as good as its first run. This unpacks the
      # tarball built above on a clean runner, installs it, provisions the stack
      # over the network and waits for the suite — the same sequence a user runs,
      # with the optional 1 GB local model replaced by an external provider.
      - name: First-run smoke test of the installer
        timeout-minutes: 30
        run: |
          set -euo pipefail
          TAG="${{ needs.release.outputs.version }}"
          VERSION="${TAG#v}"
          PKG="generalbots-${VERSION}-linux-x86_64"
          WORK="$RUNNER_TEMP/first-run"
          rm -rf "$WORK"
          mkdir -p "$WORK/home"
          tar -xzf "dist/${PKG}.tar.gz" -C "$WORK"

          export HOME="$WORK/home"
          # No model override: "local" is the wizard default, so the smoke must
          # exercise exactly that path (1 GB model + llama.cpp startup).

          cd "$WORK/$PKG"
          # Same entry point a user runs, but without a display.
          ./start.sh --provision | tee "$WORK/provision.log"
          grep -q '"id":"components".*"state":"ready"' "$WORK/provision.log" \
            || { echo "provisioning did not reach the ready state"; exit 1; }
          if grep -q '"state":"failed"' "$WORK/provision.log"; then
            echo "a component failed"; exit 1
          fi
          # The default wizard choice is the local model; it must be running,
          # not silently skipped.
          grep -q '"id":"llm".*"state":"ready"' "$WORK/provision.log" \
            || { echo "the local model runtime did not become ready"; exit 1; }
          if grep -q '"id":"llm".*Skipped' "$WORK/provision.log"; then
            echo "the local model runtime was skipped"; exit 1
          fi
          curl -fsS -o /dev/null http://127.0.0.1:8081/health \
            || { echo "llama.cpp is not answering on 8081"; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:8082/health \
            || { echo "the embedding server is not answering on 8082"; exit 1; }

          # What the wizard's finish step writes once the user is done.
          STACK="$HOME/.local/share/generalbots/stack"
          printf '{"completed_at":"ci","desktop_local":true}\n' > "$STACK/.initialized"

          # The suite window cannot be driven headless, so start the sidecar it
          # would start and assert the API and the page it serves.
          BOTSERVER_STACK_PATH="$STACK" \
          BOTSERVER_INSTALLERS_PATH="$HOME/.local/share/generalbots/installers" \
          BOTUI_PATH="$PWD/ui/suite" \
            nohup "$PWD/botserver" --noconsole > "$WORK/botserver.log" 2>&1 &
          BOTSERVER_PID=$!
          for _ in $(seq 1 180); do
            if curl -fs -o /dev/null http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/api/product | tee "$WORK/product.json"
          grep -q '"chat"' "$WORK/product.json" || { echo "chat is not advertised"; exit 1; }
          grep -q '"drive"' "$WORK/product.json" || { echo "drive is not advertised"; exit 1; }
          test "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/suite/desktop.html)" = "200"
          grep -q "Successfully uploaded to S3" "$WORK/botserver.log" \
            || { echo "the drive never accepted an upload"; exit 1; }

          kill "$BOTSERVER_PID" 2>/dev/null || true
          echo "first run is green"

      - name: Upload first-run logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: first-run-logs
          path: |
            ${{ runner.temp }}/first-run/provision.log
            ${{ runner.temp }}/first-run/botserver.log
            ${{ runner.temp }}/first-run/home/.local/share/generalbots/stack/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Drop build-only payloads before upload
        # The self-extractor payload and the pythonbox staging directory are
        # build intermediates (~1.5 GB). The publish job fetches the pythonbox
        # from its own artifact, so shipping them inside linux-installer only
        # bloated the artifact (it reached ~9.2 GB).
        run: |
          set -euo pipefail
          rm -rf dist/payload dist/installers
          du -sh dist

      - name: Upload Linux installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-installer
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows binaries
    needs: [release, linux]
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    timeout-minutes: 150
    # Kept non-blocking while the Windows toolchain image is validated: a
    # Windows runner failure must not hide the Linux binaries from the release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Build the exact tag commit resolved above.
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Install PostgreSQL client libraries (libpq)
        shell: pwsh
        run: |
          choco install postgresql16 --no-progress -y
          $pg = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory |
            Sort-Object Name | Select-Object -Last 1
          if (-not $pg) { throw "PostgreSQL install directory not found" }
          "PQ_LIB_DIR=$($pg.FullName)\lib" >> $env:GITHUB_ENV
          "$($pg.FullName)\bin" >> $env:GITHUB_PATH
          $stage = 'dist\installers'
          $resources = 'botserver\botserver-installers'
          New-Item -ItemType Directory -Force $stage, $resources | Out-Null
          $runtimeDlls = @(
            'libpq.dll', 'libcrypto-3-x64.dll', 'libssl-3-x64.dll',
            'libiconv-2.dll', 'libintl-9.dll', 'libwinpthread-1.dll',
            'liblz4.dll', 'libzstd.dll', 'zlib1.dll'
          )
          foreach ($name in $runtimeDlls) {
            $dll = Join-Path "$($pg.FullName)\bin" $name
            if (-not (Test-Path $dll)) { throw "PostgreSQL runtime DLL is missing: $name" }
            Copy-Item $dll $stage -Force
            Copy-Item $dll $resources -Force
          }

      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: release-windows

      - name: Build botserver (desktop-local)
        # #1868 — a packaged desktop must connect Gmail/Drive/Outlook with no
        # user registration. The ids are public identifiers (not secrets), so
        # they travel as repository variables and land in the binary through
        # `option_env!` in botlib/src/managed_oauth.rs. Empty variables are
        # fine: the build then behaves exactly as before and the wizard still
        # offers the per-installation app configuration.
        env:
          GB_OAUTH_GOOGLE_CLIENT_ID: ${{ vars.GB_OAUTH_GOOGLE_CLIENT_ID }}
          GB_OAUTH_MICROSOFT_CLIENT_ID: ${{ vars.GB_OAUTH_MICROSOFT_CLIENT_ID }}
        run: cargo build -p botserver --release --no-default-features --features desktop-local

      - name: Build botui
        run: cargo build -p botui --release

      - name: Build desktop shell
        run: cargo build -p botapp --release --features desktop-local,custom-protocol

      # #1793 — the payload must carry the services that have a Windows build,
      # not just the executables. `drive-bin-v3` only publishes the Linux MinIO
      # binaries, so the Windows pair comes from the same pinned upstream
      # MinIO/mc releases listed in botserver/3rdparty.toml (url_win) and is
      # verified against their published .sha256sum files. Zitadel publishes
      # checksums.txt and Caddy's checksums.txt is SHA-512. Redis and Qdrant
      # publish no checksum asset; their digests were recorded from the pinned
      # release downloads (size-verified against the GitHub asset metadata)
      # and are enforced below like any other pin.
      - name: Stage Windows offline components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'dist\installers'
          $resources = 'botserver\botserver-installers'
          New-Item -ItemType Directory -Force $stage, $resources | Out-Null

          $downloads = @(
            @{ Name = 'minio.exe'; Url = 'https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.windows-amd64.RELEASE.2025-09-07T16-13-09Z.exe'; Algo = 'SHA256'; Hash = 'af709e6ba68488404e85acdd22a3030d0f5e56a108d4b27d744f18ceb50861b4' },
            @{ Name = 'mc.exe'; Url = 'https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.windows-amd64.RELEASE.2025-08-13T08-35-41Z.exe'; Algo = 'SHA256'; Hash = 'c8db13ebeda31497f354c0e950809db0ae9b2a2a69b8afee68c128c37300c157' },
            @{ Name = 'Redis-x64-3.0.504.zip'; Url = 'https://github.com/microsoftarchive/redis/releases/download/win-3.0.504/Redis-x64-3.0.504.zip'; Algo = 'SHA256'; Hash = '5f761367601ca31f6c8969e427cacc0da4f428712954a66aab303f83e390566e' },
            @{ Name = 'qdrant-x86_64-pc-windows-msvc.zip'; Url = 'https://github.com/qdrant/qdrant/releases/download/v1.20.0/qdrant-x86_64-pc-windows-msvc.zip'; Algo = 'SHA256'; Hash = '6d13553584fd0411f00637519e293331ff0aa1fb79bd9e30db45839bb75de2be' },
            @{ Name = 'zitadel-windows-amd64.tar.gz'; Url = 'https://github.com/zitadel/zitadel/releases/download/v4.20.1/zitadel-windows-amd64.tar.gz'; Algo = 'SHA256'; Hash = 'dd38db24626a3f24f9e22244163f4ba50527378a4237cd19f0f6578b61c39405' },
            @{ Name = 'caddy_2.11.9_windows_amd64.zip'; Url = 'https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_windows_amd64.zip'; Algo = 'SHA512'; Hash = '98753d5d42650383d00619ac70917a217141f9e92314185bf6c1b8b439cfcfdf8393da0ebb4675c8cb3b23d29a19aabe99dc5aca64fa1bfc3a1ba22509b06871' }
          )

          foreach ($item in $downloads) {
            $out = Join-Path $stage $item.Name
            if (-not (Test-Path $out)) {
              Invoke-WebRequest -Uri $item.Url -OutFile $out -UseBasicParsing
            }
            if ($item.Hash) {
              $actual = (Get-FileHash $out -Algorithm $item.Algo).Hash.ToLowerInvariant()
              if ($actual -ne $item.Hash.ToLowerInvariant()) {
                throw "checksum mismatch for $($item.Name): expected $($item.Hash), got $actual"
              }
              Write-Host "verified $($item.Name) ($($item.Algo))"
            } else {
              Write-Host "::warning::no upstream checksum for $($item.Name); recording the downloaded digest"
            }
          }

          Get-ChildItem $stage -File |
            Where-Object { $_.Name -ne 'SHA256SUMS-windows-installers' } |
            ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
            } | Set-Content (Join-Path $stage 'SHA256SUMS-windows-installers') -Encoding ascii

          Copy-Item (Join-Path $stage '*') $resources -Force
          Get-ChildItem $stage -File | Sort-Object Name |
            ForEach-Object { Write-Host ("bundled {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)) }

      # #1793 — the Windows box is built by the `bundle-windows` job. Resolve the
      # newest published release that actually carries the asset (older
      # pythonbox releases predate the Windows build) instead of assuming the
      # newest tag has it.
      - name: Fetch the BotModels pythonbox (Windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assetName = 'botmodels-pythonbox-windows-x86_64.zip'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            'User-Agent'  = 'general-bots-desktop'
          }
          $releases = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/generalbots/generalbots/releases?per_page=50' `
            -Headers $headers
          $release = $releases |
            Where-Object {
              # Component releases are published as pre-releases (#1804), so
              # only drafts are excluded here.
              -not $_.draft -and
              ($_.assets.name -contains $assetName)
            } |
            Select-Object -First 1
          if (-not $release) {
            Write-Warning "no published release carries $assetName; the Windows payload ships without BotModels"
            exit 0
          }
          $out = Join-Path 'dist\installers' $assetName
          $url = "https://github.com/generalbots/generalbots/releases/download/$($release.tag_name)/$assetName"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          if ((Get-Item $out).Length -eq 0) {
            throw "$assetName downloaded empty from $($release.tag_name)"
          }
          # Fail-closed: every pythonbox-* release must ship SHA256SUMS-pythonbox-windows
          # next to the zip (#2002). A missing or mismatching sums aborts the build
          # rather than bundling an unverified binary.
          $sumsOut = Join-Path 'dist\installers' 'SHA256SUMS-pythonbox-windows'
          Invoke-WebRequest -Uri "https://github.com/generalbots/generalbots/releases/download/$($release.tag_name)/SHA256SUMS-pythonbox-windows" -OutFile $sumsOut -UseBasicParsing
          $expected = ((Get-Content $sumsOut | Where-Object { $_ -like "*$assetName*" }) -split '\s+') | Select-Object -First 1
          if (-not $expected) {
            throw "SHA256SUMS-pythonbox-windows on $($release.tag_name) has no entry for $assetName"
          }
          $actual = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected.ToLowerInvariant()) {
            throw "checksum mismatch for $assetName from $($release.tag_name): expected $expected, got $actual"
          }
          Write-Host "verified $assetName against SHA256SUMS-pythonbox-windows ($($release.tag_name))"
          Copy-Item $out 'botserver\botserver-installers' -Force
          # Keep the component checksum list truthful: the staging step wrote it
          # before BotModels was fetched.
          $sums = 'dist\installers\SHA256SUMS-windows-installers'
          $line = "$((Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant())  $assetName"
          if (Test-Path $sums) {
            if (-not (Select-String -Path $sums -SimpleMatch $assetName -Quiet)) {
              Add-Content -Path $sums -Value $line -Encoding ascii
            }
          } else {
            Set-Content -Path $sums -Value $line -Encoding ascii
          }
          Copy-Item $sums 'botserver\botserver-installers' -Force
          Write-Host "bundled BotModels $($release.tag_name) ($('{0:N1}' -f ((Get-Item $out).Length / 1MB)) MB)"

      - name: Report bundled vs downloadable components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundled = @(
            @{ Id = 'drive'; Files = @('minio.exe', 'mc.exe') },
            @{ Id = 'cache'; Files = @('Redis-x64-3.0.504.zip') },
            @{ Id = 'vector_db'; Files = @('qdrant-x86_64-pc-windows-msvc.zip') },
            @{ Id = 'directory'; Files = @('zitadel-windows-amd64.tar.gz') },
            @{ Id = 'proxy'; Files = @('caddy_2.11.9_windows_amd64.zip') }
          )
          foreach ($component in $bundled) {
            foreach ($file in $component.Files) {
              if (-not (Test-Path (Join-Path 'dist\installers' $file))) {
                throw "component $($component.Id) is missing bundled file $file"
              }
            }
            Write-Host "bundled offline: $($component.Id)"
          }
          if (Test-Path 'dist\installers\botmodels-pythonbox-windows-x86_64.zip') {
            Write-Host 'bundled offline: botmodels (Windows pythonbox + offline wheelhouse)'
          } else {
            Write-Warning 'botmodels is not bundled: vision/STT/TTS need a first-run download'
          }
          Write-Host 'download once on first run: vault, tables (PostgreSQL), llm (llama.cpp), models'

      # MSI/NSIS from the same binaries. Best effort, same reasoning as Linux:
      # a bundler problem must not hide the exe binaries from the release.
      - name: Install Tauri bundler
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked

      - name: Package MSI and NSIS installers
        shell: pwsh
        continue-on-error: true
        run: |
          $triple = "x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force botapp\binaries | Out-Null
          Copy-Item target\release\botserver.exe "botapp\binaries\botserver-$triple.exe"
          New-Item -ItemType Directory -Force botserver\botserver-installers | Out-Null
          Push-Location botapp
          cargo tauri build --features desktop-local,custom-protocol --config tauri.desktop-local.conf.json --bundles msi,nsis
          Pop-Location

      - name: Collect Windows installers
        shell: pwsh
        run: |
          $tag = "${{ needs.release.outputs.version }}"
          $version = $tag -replace '^v', ''
          $msi = Get-ChildItem -Path "target\release\bundle\msi\*.msi","botapp\target\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "dist\generalbots-x64.msi"
            Copy-Item $msi.FullName "dist\generalbots-$version-windows-x64.msi"
          } else {
            Write-Warning "no MSI was produced by the bundler"
          }
          $setup = Get-ChildItem -Path "target\release\bundle\nsis\*.exe","botapp\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "*setup*" } | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName "dist\generalbots-x64-setup.exe"
            Copy-Item $setup.FullName "dist\generalbots-$version-windows-x64-setup.exe"
          } else {
            Write-Warning "no NSIS installer was produced by the bundler"
          }

      # #1793 — both installers are release artifacts, not best effort. The
      # packaging step is continue-on-error so a partial failure still lets the
      # collection run; this gate makes a missing MSI/NSIS fail the job instead
      # of silently publishing only the raw executables.
      - name: Verify the MSI and NSIS installers exist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = @()
          foreach ($name in 'generalbots-x64.msi', 'generalbots-x64-setup.exe') {
            $path = Join-Path 'dist' $name
            if (-not (Test-Path $path)) {
              $missing += $name
            } elseif ((Get-Item $path).Length -lt 1MB) {
              $missing += "$name (suspiciously small)"
            }
          }
          if ($missing.Count -gt 0) {
            throw "the Windows bundler did not produce: $($missing -join ', ')"
          }
          Get-ChildItem 'dist\generalbots-x64.msi', 'dist\generalbots-x64-setup.exe' |
            ForEach-Object { Write-Host ("installer ready: {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)) }

      - name: Assemble release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/botapp.exe    dist/generalbots-x64.exe
          Copy-Item target/release/botserver.exe dist/botserver-x64.exe
          Copy-Item target/release/botui.exe     dist/botui-x64.exe
          Get-FileHash dist/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } |
            Out-File dist/SHA256SUMS-windows.txt -Encoding ascii

      - name: Record installer checksums
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem -Path "dist\*.msi","dist\*-setup.exe" -ErrorAction SilentlyContinue) {
            "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash)  $($f.Name)" |
              Out-File dist\SHA256SUMS-windows.txt -Encoding ascii -Append
          }

      # #1633 — same trailer format on Windows. The zstd CLI is installed
      # here because the payload builder shells out to it.
      - name: Build self-extracting Windows binary
        shell: pwsh
        run: |
          choco install zstd --no-progress -y
          New-Item -ItemType Directory -Force dist/payload | Out-Null
          New-Item -ItemType Directory -Force dist/payload/bin | Out-Null
          New-Item -ItemType Directory -Force dist/payload/ui | Out-Null
          Copy-Item target/release/botserver.exe dist/payload/botserver.exe
          Copy-Item target/release/botui.exe dist/payload/botui.exe
          Copy-Item dist/installers/*.dll dist/payload/ -Force
          Copy-Item -Recurse botui/ui/suite  dist/payload/ui/suite
          Copy-Item -Recurse botui/ui/themes dist/payload/ui/themes
          Copy-Item botserver/.product.desktop-local dist/payload/
          # #1793 — mirror the Linux `cp -a dist/installers/. dist/payload/installers/`.
          # The extracted payload lands in the per-user stack, where the sidecar
          # looks for installers/ before downloading anything.
          if (Test-Path dist/installers) {
            Copy-Item -Path dist/installers -Destination dist/payload -Recurse -Force
          }
          python scripts/build-self-extractor.py `
            --app target/release/botapp.exe `
            --payload dist/payload `
            --out dist/generalbots.exe
          # The Tauri binary is a Windows GUI-subsystem app: PowerShell's `&`
          # does not wait for it, so the inspection flags were racing the
          # process (the payload check ran before extraction finished and the
          # Windows assets never reached the release). Start-Process -Wait
          # blocks until the child really exits.
          $verify = Start-Process -FilePath .\dist\generalbots.exe -ArgumentList '--verify' -Wait -PassThru -NoNewWindow
          if ($verify.ExitCode -ne 0) { throw 'the self-extracting binary failed --verify' }

          # #1793 — prove the payload carries the offline services instead of
          # only the executables. Unpack into a scratch stack and assert every
          # component (including the BotModels pythonbox) is present.
          $check = Join-Path $env:RUNNER_TEMP 'windows-payload'
          Remove-Item -Recurse -Force $check -ErrorAction SilentlyContinue
          $previousStack = $env:BOTSERVER_STACK_PATH
          $env:BOTSERVER_STACK_PATH = $check
          try {
            $extract = Start-Process -FilePath .\dist\generalbots.exe -ArgumentList '--extract-only' -Wait -PassThru -NoNewWindow
            if ($extract.ExitCode -ne 0) { throw 'the payload could not be extracted' }
            # Belt and braces: even after a waited exit, give the filesystem a
            # moment to surface the extracted tree.
            $deadline = (Get-Date).AddSeconds(60)
            while (-not (Test-Path (Join-Path $check 'botserver.exe')) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
            }
            # The runner has PostgreSQL on PATH; a release must also load on
            # a machine without that developer installation.
            $serverExe = Join-Path $check 'botserver.exe'
            if (-not (Test-Path $serverExe)) {
              $found = Get-ChildItem -Path $check -Filter 'botserver.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $serverExe = $found.FullName }
            }
            $savedRuntimePath = $env:PATH
            try {
              $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
              & $serverExe --help | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'the packaged server is missing a runtime DLL' }
            } finally {
              $env:PATH = $savedRuntimePath
            }
          } finally {
            $env:BOTSERVER_STACK_PATH = $previousStack
          }
          $payloadFiles = @(
            'botserver.exe',
            'botui.exe',
            'ui\suite\desktop.html',
            '.product.desktop-local',
            'installers\minio.exe',
            'installers\mc.exe',
            'installers\Redis-x64-3.0.504.zip',
            'installers\qdrant-x86_64-pc-windows-msvc.zip',
            'installers\zitadel-windows-amd64.tar.gz',
            'installers\caddy_2.11.9_windows_amd64.zip'
          )
          foreach ($rel in $payloadFiles) {
            if (-not (Test-Path (Join-Path $check $rel))) {
              throw "the Windows payload is missing $rel"
            }
          }
          $botmodels = Join-Path $check 'installers\botmodels-pythonbox-windows-x86_64.zip'
          if (Test-Path $botmodels) {
            Write-Host ("payload carries BotModels ({0:N1} MB)" -f ((Get-Item $botmodels).Length / 1MB))
          } else {
            Write-Warning 'the Windows payload does not carry the BotModels pythonbox'
          }
          Write-Host 'payload contents verified'

          Get-FileHash dist/generalbots.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  generalbots.exe" } |
            Out-File dist/SHA256SUMS-windows.txt -Encoding ascii -Append

      - name: Drop build-only payloads before upload
        # Same trim as the Linux job: the self-extractor payload and the
        # staging installers directory are not release assets and do not need
        # to travel through windows-binaries.
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist/payload, dist/installers -ErrorAction SilentlyContinue
          $mb = (Get-ChildItem dist -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("windows-binaries payload: {0:N0} MB" -f $mb)

      - name: Upload Windows binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-binaries
          path: dist/*
          if-no-files-found: error

  bundle:
    name: Bundle pythonbox (linux x86_64)
    # GitHub-only: ALM has no ubuntu-* runner and must not build on the host.
    needs: [release]
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Fetch relocatable CPython
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # python-build-standalone publishes install_only trees that carry
          # their own shared libraries; no system Python is required. Take the
          # newest release and the newest patch of the requested minor.
          api="repos/astral-sh/python-build-standalone/releases/latest"
          # Asset URLs encode the build date's separator as %2B (a literal '+').
          url=$(gh api "$api" --jq '.assets[].browser_download_url' \
            | grep -E "/cpython-${PYTHON_VERSION}\.[0-9]+(%2B|\+)[0-9]+-x86_64-unknown-linux-gnu-install_only\.tar\.gz$" \
            | sort -V | tail -n 1)
          if [ -z "$url" ]; then
            echo "::error::no python-build-standalone asset for CPython ${PYTHON_VERSION} (x86_64 linux)"
            exit 1
          fi
          echo "bundling $url"
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/python.tar.gz "$url"
          # #2001 self-review — fail closed on the interpreter too. The
          # "latest release" is resolved by design (a patch bump is not a
          # supply-chain event), but the bytes must match the release's own
          # SHA256SUMS: an unverified interpreter would end up inside every
          # desktop bundle. Asset URLs encode '+' as %2B, the sums file does
          # not, so decode the name before the lookup.
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/python.SHA256SUMS "${url%/*}/SHA256SUMS"
          asset=$(basename "$url" | sed 's/%2B/+/g')
          want=$(awk -v n="$asset" '$2 == n { print $1 }' /tmp/python.SHA256SUMS)
          if [ -z "$want" ]; then
            echo "::error::SHA256SUMS has no entry for $asset; refusing to bundle an unverified interpreter"
            exit 1
          fi
          echo "$want  /tmp/python.tar.gz" | sha256sum -c -

      - name: Build the offline wheelhouse (CPU tier)
        run: |
          set -euo pipefail
          # Keep the wheelhouse out of dist/: only the tarball, manifest and
          # checksums may be uploaded as release assets.
          python3 -m pip install --quiet --disable-pip-version-check --upgrade pip
          python3 botmodels/scripts/wheelhouse.py build \
            --output "$RUNNER_TEMP/botmodels-wheelhouse" \
            --python-version "$PYTHON_VERSION"
          python3 botmodels/scripts/wheelhouse.py inspect "$RUNNER_TEMP/botmodels-wheelhouse"

      - name: Check relative imports
        run: python3 botmodels/scripts/check_imports.py

      - name: Assemble the pythonbox
        run: |
          set -euo pipefail
          ROOT="dist/botmodels-pythonbox"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          tar -xzf /tmp/python.tar.gz -C "$ROOT"
          # install_only archives unpack as `python/`.
          test -x "$ROOT/python/bin/python3"

          cp -r botmodels/src "$ROOT/src"
          cp botmodels/requirements.txt botmodels/requirements-barcode.txt "$ROOT/"
          cp botmodels/.env.example "$ROOT/.env.example" 2>/dev/null || true
          # The CPU-tier wheelhouse makes `./install.sh` offline by default.
          cp -r "$RUNNER_TEMP/botmodels-wheelhouse" "$ROOT/wheelhouse"
          test -f "$ROOT/wheelhouse/wheelhouse-manifest.json"
          mkdir -p "$ROOT/scripts"
          cp botmodels/scripts/wheelhouse.py "$ROOT/scripts/wheelhouse.py"

          # Optional extras: services a desktop user may want on top of the
          # BotModels runtime (JupyterLab is the reference case). The name must
          # match `--with jupyter` (requirements-NAME.txt).
          cat > "$ROOT/requirements-jupyter.txt" <<'EOF'
          # Installed by `./install.sh --with jupyter`
          jupyterlab>=4.2
          notebook>=7.2
          ipykernel>=6.29
          EOF

          cat > "$ROOT/install.sh" <<'EOF'
          #!/usr/bin/env bash
          # Materialise the virtual environment for this pythonbox.
          #
          # Usage: ./install.sh [--with NAME] [--offline-wheels DIR] [--online]
          #                     [--yes] [--python PATH] [--site DIR]
          #                     [-r EXTRA_REQ] [--help]
          #
          # Offline by default: this bundle ships ./wheelhouse, so pip runs with
          # --no-index --find-links ./wheelhouse. --online opts into PyPI and
          # requires --yes (or BOTMODELS_INSTALL_YES=1) because a full resolve
          # can download several gigabytes.
          #
          # Disk preflight: at least 6 GiB free is required. The wheelhouse
          # estimate is wheel size x3 + 1 GiB; an online resolve uses 12 GiB.
          # BOTMODELS_MIN_FREE_GIB raises or lowers the floor and
          # BOTMODELS_SKIP_DISK_CHECK=1 bypasses the check (not recommended).
          #
          # --python  interpreter used to create the venv (default: the bundled one)
          # --site    extra package tree to reuse (for example /opt/gbo/pylibs on
          #           a server, so torch and transformers are not downloaded twice)
          set -euo pipefail
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          VENV="$ROOT/.venv"
          PYTHON="$ROOT/python/bin/python3"
          EXTRAS=""
          PIP_ARGS=()
          HASH_FILES=("$ROOT/requirements.txt")
          SITE=""
          ONLINE=0
          ASSUME_YES="${BOTMODELS_INSTALL_YES:-0}"
          MIN_FREE_GIB="${BOTMODELS_MIN_FREE_GIB:-6}"
          ONLINE_MIN_FREE_GIB=12
          ONLINE_DOWNLOAD_HINT="about 4 GiB"
          WHEELHOUSE="$ROOT/wheelhouse"
          WHEELHOUSE_EXPLICIT=0
          WITH_BARCODE=0

          usage() {
            cat <<'USAGE'
          Usage: ./install.sh [--with NAME] [--offline-wheels DIR] [--online]
                              [--yes] [--python PATH] [--site DIR] [-r EXTRA_REQ]

            --with NAME          install requirements-NAME.txt (for example jupyter)
            --offline-wheels DIR install from DIR instead of ./wheelhouse
            --online             resolve from PyPI instead of the offline wheelhouse
            --yes                confirm the online download (or BOTMODELS_INSTALL_YES=1)
            --python PATH        interpreter used to create the venv
            --site DIR           extra package tree to reuse
            --help               show this help
          USAGE
          }

          while [ $# -gt 0 ]; do
            case "$1" in
              --with)
                [ $# -ge 2 ] || { echo "error: --with needs a value" >&2; exit 2; }
                extra="$ROOT/requirements-$2.txt"
                if [ ! -f "$extra" ]; then
                  echo "error: unknown extra '$2' (expected $extra)" >&2
                  exit 2
                fi
                EXTRAS="${EXTRAS} -r $extra"
                HASH_FILES+=("$extra")
                [ "$2" = "barcode" ] && WITH_BARCODE=1
                shift 2
                ;;
              --offline-wheels)
                [ $# -ge 2 ] || { echo "error: --offline-wheels needs a directory" >&2; exit 2; }
                WHEELHOUSE="$2"
                WHEELHOUSE_EXPLICIT=1
                shift 2
                ;;
              --online) ONLINE=1; shift ;;
              --yes|-y) ASSUME_YES=1; shift ;;
              --python)
                [ $# -ge 2 ] || { echo "error: --python needs a path" >&2; exit 2; }
                PYTHON="$2"; shift 2
                ;;
              --site)
                [ $# -ge 2 ] || { echo "error: --site needs a directory" >&2; exit 2; }
                SITE="$2"; shift 2
                ;;
              -r)
                [ $# -ge 2 ] || { echo "error: -r needs a file" >&2; exit 2; }
                EXTRAS="${EXTRAS} -r $2"
                HASH_FILES+=("$2")
                shift 2
                ;;
              --help|-h) usage; exit 0 ;;
              *) echo "unknown option: $1" >&2; usage >&2; exit 2 ;;
            esac
          done

          if [ "$ONLINE" = 1 ] && [ "$WHEELHOUSE_EXPLICIT" = 1 ]; then
            echo "error: choose either --online or --offline-wheels DIR, not both" >&2
            exit 2
          fi

          if [ "$ONLINE" = 1 ]; then
            echo "Online install: pip will resolve requirements from PyPI."
            echo "  approximate download: ${ONLINE_DOWNLOAD_HINT}"
            echo "  required free space:  ${ONLINE_MIN_FREE_GIB} GiB"
            if [ "$ASSUME_YES" != "1" ]; then
              echo "Refusing to download without confirmation." >&2
              echo "Re-run with --yes or set BOTMODELS_INSTALL_YES=1." >&2
              exit 2
            fi
          else
            if [ -d "$WHEELHOUSE" ]; then
              PIP_ARGS+=(--no-index --find-links "$WHEELHOUSE")
            elif [ "$WHEELHOUSE_EXPLICIT" = 1 ]; then
              echo "error: offline wheelhouse not found: $WHEELHOUSE" >&2
              exit 2
            else
              cat >&2 <<MESSAGE
          error: no offline wheelhouse at $WHEELHOUSE.
            This bundle is meant to install without network access. Re-download
            the pythonbox, pass --offline-wheels DIR, or opt into PyPI with:
              ./install.sh --online --yes    # ${ONLINE_DOWNLOAD_HINT} download
          MESSAGE
              exit 2
            fi
          fi

          # libzbar is a system library, not a wheel. Install pyzbar only when it
          # can actually load; --with barcode forces it (the service still
          # degrades cleanly because the import is lazy).
          if [ "$WITH_BARCODE" = 0 ] && [ -f "$ROOT/requirements-barcode.txt" ]; then
            # grep without -q: -q closes the pipe early and pipefail would turn
            # the resulting SIGPIPE into a false "libzbar missing" result.
            if command -v ldconfig >/dev/null 2>&1 && ldconfig -p 2>/dev/null | grep 'libzbar' >/dev/null; then
              EXTRAS="${EXTRAS} -r $ROOT/requirements-barcode.txt"
              HASH_FILES+=("$ROOT/requirements-barcode.txt")
            else
              echo "notice: libzbar0 not found; barcode/QR decoding will be unavailable." >&2
              echo "        BotModels still starts; install libzbar0 and rerun with --with barcode to enable it." >&2
            fi
          fi

          wanted="$(cat "${HASH_FILES[@]}" | sha256sum | cut -d' ' -f1)"
          if [ -x "$VENV/bin/python" ] && [ -f "$ROOT/.installed" ] \
            && [ "$(cat "$ROOT/.installed")" = "$wanted" ]; then
            echo "pythonbox already installed (requirements $wanted)"
            exit 0
          fi

          free_kib=$(df -Pk "$ROOT" | awk 'NR==2 {print $4}')
          free_bytes=$((free_kib * 1024))
          if [ -d "$WHEELHOUSE" ] && [ "$ONLINE" = 0 ]; then
            wheel_kib=$(du -sk "$WHEELHOUSE" | awk '{print $1}')
            wheel_bytes=$((wheel_kib * 1024))
            required_bytes=$((wheel_bytes * 3 + 1073741824))
            source="wheelhouse ($(awk -v b="$wheel_bytes" 'BEGIN {printf "%.1f", b/1073741824}') GiB)"
          else
            required_bytes=$((ONLINE_MIN_FREE_GIB * 1073741824))
            source="online resolve (${ONLINE_DOWNLOAD_HINT})"
          fi
          min_bytes=$((MIN_FREE_GIB * 1073741824))
          if [ "$required_bytes" -lt "$min_bytes" ]; then required_bytes=$min_bytes; fi
          if [ "${BOTMODELS_SKIP_DISK_CHECK:-0}" != "1" ] && [ "$free_bytes" -lt "$required_bytes" ]; then
            cat >&2 <<MESSAGE
          error: not enough free disk space for the BotModels environment.
            required:  $(awk -v b="$required_bytes" 'BEGIN {printf "%.1f", b/1073741824}') GiB ($source)
            available: $(awk -v b="$free_bytes" 'BEGIN {printf "%.1f", b/1073741824}') GiB on $ROOT
          Free at least the difference and rerun. The floor is BOTMODELS_MIN_FREE_GIB
          (currently ${MIN_FREE_GIB}); BOTMODELS_SKIP_DISK_CHECK=1 bypasses this check.
          MESSAGE
            exit 1
          fi

          if [ ! -x "$VENV/bin/python" ]; then
            "$PYTHON" -m venv --system-site-packages "$VENV"
          fi

          if [ -n "$SITE" ]; then
            site_dir="$("$VENV/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
            printf '%s\n' "$SITE" > "$site_dir/zzz-pythonbox-site.pth"
          fi

          if [ "$ONLINE" = 1 ]; then
            "$VENV/bin/python" -m pip install --upgrade pip --no-cache-dir
          fi
          # shellcheck disable=SC2086
          "$VENV/bin/python" -m pip install --no-cache-dir "${PIP_ARGS[@]}" -r "$ROOT/requirements.txt" $EXTRAS
          "$VENV/bin/python" -c 'import fastapi, uvicorn; print("pythonbox ready")'
          printf '%s\n' "$wanted" > "$ROOT/.installed"
          EOF

          cat > "$ROOT/run.sh" <<'EOF'
          #!/usr/bin/env bash
          # Start BotModels. Installs the virtual environment on first run.
          set -euo pipefail
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$ROOT"
          if [ ! -x "$ROOT/.venv/bin/python" ]; then
            "$ROOT/install.sh" "$@"
            set --
          fi
          exec "$ROOT/.venv/bin/python" -m uvicorn src.main:app \
            --host "${BOTMODELS_HOST:-0.0.0.0}" \
            --port "${BOTMODELS_PORT:-8085}"
          EOF

          chmod +x "$ROOT/install.sh" "$ROOT/run.sh"

          cat > "$ROOT/README.txt" <<'EOF'
          BotModels pythonbox
          ===================

          Self-contained Python service bundle: the interpreter is included, the
          dependencies are installed once into ./.venv.

            ./install.sh                     # offline: install from ./wheelhouse
            ./install.sh --online --yes      # explicit PyPI download (~4 GiB)
            ./install.sh --offline-wheels D  # install from another wheelhouse
            ./install.sh --with jupyter      # add JupyterLab/Notebook
            ./install.sh --with barcode      # add pyzbar even without libzbar
            ./run.sh                         # serve on :8085 (BOTMODELS_PORT)

          Health: GET http://127.0.0.1:8085/api/health

          The first run requires at least 6 GiB free on the target filesystem
          (12 GiB for an online install). Override the floor with
          BOTMODELS_MIN_FREE_GIB; BOTMODELS_SKIP_DISK_CHECK=1 bypasses it.

          System libraries (not installable with pip):
            libzbar0   optional: barcode/QR decoding. install.sh adds pyzbar
                       automatically when libzbar is present. Without it the
                       service still starts and /api/health reports
                       media_capabilities.barcode.available=false.
            tesseract  optional OCR backend; RapidOCR is the pip fallback.

          The box is relocatable: move the directory, the interpreter keeps
          working. Delete ./.venv to start from scratch.
          EOF

          printf 'version=%s\ncommit=%s\npython=%s\nbuilt=%s\n' \
            "2.1.0" "${GITHUB_SHA}" "${PYTHON_VERSION}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$ROOT/VERSION"

          tar -czf dist/botmodels-pythonbox-linux-x86_64.tar.gz -C dist botmodels-pythonbox
          rm -rf dist/botmodels-pythonbox

          # GitHub release assets are capped at 2 GB; fail here instead of in
          # the publish job after the archive has already been built.
          archive_bytes=$(stat -c %s dist/botmodels-pythonbox-linux-x86_64.tar.gz)
          echo "pythonbox archive: ${archive_bytes} bytes"
          if [ "$archive_bytes" -ge 2000000000 ]; then
            echo "::error::pythonbox archive exceeds GitHub's 2 GB release asset limit"
            exit 1
          fi

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess

          archive = "dist/botmodels-pythonbox-linux-x86_64.tar.gz"
          digest = hashlib.sha256()
          with open(archive, "rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
          manifest = {
              "schema": 1,
              "component": "botmodels-pythonbox",
              "commit": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "built_at": subprocess.check_output(
                  ["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"], text=True
              ).strip(),
              "python": os.environ["PYTHON_VERSION"],
              "target": "x86_64-unknown-linux-gnu",
              "assets": {
                  os.path.basename(archive): {
                      "sha256": digest.hexdigest(),
                      "size": os.path.getsize(archive),
                  }
              },
          }
          with open("dist/pythonbox-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(manifest, indent=2))
          PY

          (cd dist && sha256sum botmodels-pythonbox-linux-x86_64.tar.gz > SHA256SUMS-pythonbox && ls -lh)

      - name: Smoke test the box
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/pythonbox-smoke"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          tar -xzf dist/botmodels-pythonbox-linux-x86_64.tar.gz -C "$WORK"
          cd "$WORK/botmodels-pythonbox"
          # The interpreter must work without any system Python on PATH.
          env -u PYTHONHOME -u PYTHONPATH ./python/bin/python3 -c \
            'import sys, ssl, sqlite3, venv; print(sys.version)'
          bash -n install.sh
          bash -n run.sh
          ./install.sh --help > /dev/null
          ./python/bin/python3 scripts/wheelhouse.py inspect wheelhouse > /dev/null
          ./python/bin/python3 - <<'PY'
          import ast
          import pathlib

          for required in (
              "install.sh",
              "run.sh",
              "requirements.txt",
              "requirements-barcode.txt",
              "requirements-jupyter.txt",
              "wheelhouse/wheelhouse-manifest.json",
              "scripts/wheelhouse.py",
              "src/main.py",
              "README.txt",
          ):
              assert pathlib.Path(required).exists(), required
          ast.parse(pathlib.Path("src/main.py").read_text())
          print("pythonbox layout ok")
          PY
          echo "smoke test passed"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: botmodels-pythonbox
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  bundle-windows:
    name: Bundle pythonbox (windows x86_64)
    # GitHub-only, same reasoning as the Linux job.
    needs: [release]
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Set up Python for the wheelhouse planner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch relocatable CPython
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            'User-Agent'  = 'general-bots-pythonbox'
          }
          $release = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest' `
            -Headers $headers
          $pattern = "cpython-$env:PYTHON_VERSION\.[0-9]+(%2B|\+)[0-9]+-x86_64-pc-windows-msvc-install_only\.tar\.gz$"
          $asset = $release.assets |
            Where-Object { $_.browser_download_url -match $pattern } |
            Sort-Object name | Select-Object -Last 1
          if (-not $asset) {
            throw "no python-build-standalone asset for CPython $env:PYTHON_VERSION (x86_64 windows)"
          }
          Write-Host "bundling $($asset.browser_download_url)"
          Invoke-WebRequest -Uri $asset.browser_download_url `
            -OutFile "$env:RUNNER_TEMP\python.tar.gz" -UseBasicParsing

      - name: Build the offline wheelhouse (CPU tier, win_amd64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --quiet --disable-pip-version-check --upgrade pip
          python botmodels/scripts/wheelhouse.py build `
            --target windows `
            --output "$env:RUNNER_TEMP\botmodels-wheelhouse" `
            --python-version "$env:PYTHON_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'wheelhouse build failed' }
          python botmodels/scripts/wheelhouse.py inspect "$env:RUNNER_TEMP\botmodels-wheelhouse"
          if ($LASTEXITCODE -ne 0) { throw 'wheelhouse inspect failed' }

      - name: Check relative imports
        shell: pwsh
        run: |
          python botmodels/scripts/check_imports.py
          if ($LASTEXITCODE -ne 0) { throw 'relative import check failed' }

      - name: Assemble the pythonbox
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'dist\botmodels-pythonbox'
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $root | Out-Null

          # install_only archives unpack as `python\`.
          tar -xzf "$env:RUNNER_TEMP\python.tar.gz" -C $root
          if ($LASTEXITCODE -ne 0) { throw 'could not unpack the relocatable CPython' }
          $python = Join-Path $root 'python\python.exe'
          if (-not (Test-Path $python)) { throw "bundled interpreter missing at $python" }

          Copy-Item -Recurse botmodels\src (Join-Path $root 'src')
          Copy-Item botmodels\requirements.txt, botmodels\requirements-barcode.txt $root
          if (Test-Path botmodels\.env.example) {
            Copy-Item botmodels\.env.example (Join-Path $root '.env.example')
          }
          Copy-Item -Recurse "$env:RUNNER_TEMP\botmodels-wheelhouse" (Join-Path $root 'wheelhouse')
          if (-not (Test-Path (Join-Path $root 'wheelhouse\wheelhouse-manifest.json'))) {
            throw 'wheelhouse-manifest.json was not copied'
          }
          New-Item -ItemType Directory -Force (Join-Path $root 'scripts') | Out-Null
          Copy-Item botmodels\scripts\wheelhouse.py (Join-Path $root 'scripts\wheelhouse.py')

          # Windows entry points: the Linux box ships install.sh/run.sh.
          Copy-Item botmodels\packaging\windows\install.ps1 (Join-Path $root 'install.ps1')
          Copy-Item botmodels\packaging\windows\run.ps1 (Join-Path $root 'run.ps1')

          @(
            '# Installed by .\install.ps1 -With jupyter'
            'jupyterlab>=4.2'
            'notebook>=7.2'
            'ipykernel>=6.29'
          ) | Set-Content (Join-Path $root 'requirements-jupyter.txt') -Encoding ascii

          @(
            'BotModels pythonbox (Windows x86_64)'
            '===================================='
            ''
            'Self-contained Python service bundle: the interpreter is included, the'
            'dependencies are installed once into .\.venv.'
            ''
            '  .\install.ps1                     # offline: install from .\wheelhouse'
            '  .\install.ps1 -Online -Yes        # explicit PyPI download (about 4 GiB)'
            '  .\install.ps1 -OfflineWheels DIR  # install from another wheelhouse'
            '  .\install.ps1 -With jupyter       # add JupyterLab/Notebook'
            '  .\run.ps1                         # serve on :8085 (BOTMODELS_PORT)'
            ''
            'Health: GET http://127.0.0.1:8085/api/health'
            ''
            'The first run requires at least 6 GiB free on the target filesystem'
            '(12 GiB for an online install). Override the floor with'
            'BOTMODELS_MIN_FREE_GIB; BOTMODELS_SKIP_DISK_CHECK=1 bypasses it.'
            ''
            'Optional system tools: tesseract for OCR (RapidOCR is the pip fallback),'
            'and a zbar DLL for barcode/QR decoding. Without them the service still'
            'starts and /api/health reports media_capabilities.barcode.available=false.'
            ''
            'The box is relocatable: move the directory, the interpreter keeps'
            'working. Delete .\.venv to start from scratch.'
          ) | Set-Content (Join-Path $root 'README.txt') -Encoding utf8

          $version = "version=2.1.0`ncommit=$env:GITHUB_SHA`npython=$env:PYTHON_VERSION`nbuilt=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))`n"
          Set-Content (Join-Path $root 'VERSION') -Value $version -Encoding ascii

          $archive = 'dist\botmodels-pythonbox-windows-x86_64.zip'
          Remove-Item -Force $archive -ErrorAction SilentlyContinue
          tar -a -c -f $archive -C dist botmodels-pythonbox
          if ($LASTEXITCODE -ne 0) { throw 'could not create the pythonbox zip' }
          Remove-Item -Recurse -Force $root

          # GitHub release assets are capped at 2 GB; fail here instead of in
          # the publish job after the archive has already been built.
          $archiveBytes = (Get-Item $archive).Length
          Write-Host "pythonbox archive: $archiveBytes bytes"
          if ($archiveBytes -ge 2000000000) {
            throw "pythonbox archive exceeds GitHub's 2 GB release asset limit"
          }

          $archiveName = Split-Path -Leaf $archive
          $manifest = [ordered]@{
            schema    = 1
            component = 'botmodels-pythonbox'
            commit    = $env:GITHUB_SHA
            ref       = $env:GITHUB_REF
            run_id    = $env:GITHUB_RUN_ID
            built_at  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            python    = $env:PYTHON_VERSION
            target    = 'x86_64-pc-windows-msvc'
            assets    = [ordered]@{
              "$archiveName" = [ordered]@{
                sha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
                size   = $archiveBytes
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content 'dist\pythonbox-manifest-windows.json' -Encoding utf8

          "$((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant())  $archiveName" |
            Set-Content 'dist\SHA256SUMS-pythonbox-windows' -Encoding ascii
          Get-ChildItem dist | Format-Table Name, Length

      - name: Smoke test the box
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'pythonbox-smoke'
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $work | Out-Null
          tar -xf 'dist\botmodels-pythonbox-windows-x86_64.zip' -C $work
          if ($LASTEXITCODE -ne 0) { throw 'could not extract the pythonbox zip' }
          $root = Join-Path $work 'botmodels-pythonbox'

          Push-Location $root
          try {
            # The interpreter must work without any system Python on PATH.
            & '.\python\python.exe' -c 'import sys, ssl, sqlite3, venv; print(sys.version)'
            if ($LASTEXITCODE -ne 0) { throw 'the bundled interpreter cannot import the stdlib' }

            foreach ($script in 'install.ps1', 'run.ps1') {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                (Join-Path $root $script), [ref]$tokens, [ref]$parseErrors
              ) | Out-Null
              if ($parseErrors.Count -gt 0) {
                throw "$script has syntax errors: $($parseErrors[0].Message)"
              }
            }
            & '.\python\python.exe' 'scripts\wheelhouse.py' inspect wheelhouse | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'wheelhouse inspect failed in the extracted box' }
            & '.\python\python.exe' -c "import ast,pathlib; ast.parse(pathlib.Path(r'src/main.py').read_text(encoding='utf-8')); print('pythonbox layout ok')"
            if ($LASTEXITCODE -ne 0) { throw 'src/main.py is not valid Python' }

            foreach ($required in 'install.ps1', 'run.ps1', 'requirements.txt',
                                 'requirements-barcode.txt', 'requirements-jupyter.txt',
                                 'wheelhouse\wheelhouse-manifest.json',
                                 'scripts\wheelhouse.py', 'src\main.py', 'README.txt') {
              if (-not (Test-Path $required)) { throw "missing $required" }
            }
          } finally {
            Pop-Location
          }
          Write-Host 'smoke test passed'

      - name: Upload bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: botmodels-pythonbox-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14


  macos:
    name: macOS dmg
    needs: [release]
    # macOS is a native-runner extra, not a gate: a red macOS job must not cost
    # the Linux/Windows assets. It contributes `macos-installer` to `dist`, and
    # `publish` downloads it with continue-on-error.
    if: ${{ github.server_url == 'https://github.com' }}
    uses: ./.github/workflows/desktop-macos.yml
    with:
      tag: ${{ needs.release.outputs.version }}
      # false = do not open a separate `-macos` pre-release; the .dmg belongs to
      # this release, next to the Linux and Windows assets.
      publish: false

  iso:
    name: Bootable ISO image
    needs: [release, linux]
    # Built from the same tarball that ships in this release.
    if: ${{ github.server_url == 'https://github.com' && needs.linux.result == 'success' }}
    uses: ./.github/workflows/desktop-os-iso.yml
    with:
      artifact: linux-installer

  publish:
    name: Publish the all-inclusive release
    needs: [release, linux, windows, bundle, bundle-windows, macos, iso]
    if: ${{ always() && !cancelled() && github.server_url == 'https://github.com' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.version }}
          fetch-depth: 1

      - name: Download Linux installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-installer
          path: dist
          merge-multiple: true

      - name: Download Windows binaries
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-binaries
          path: dist
          merge-multiple: true

      - name: Download BotModels pythonbox
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: botmodels-pythonbox
          path: dist
          merge-multiple: true

      - name: Download BotModels pythonbox (Windows)
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: botmodels-pythonbox-windows
          path: dist
          merge-multiple: true

      - name: Download macOS dmg
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-installer
          path: dist
          merge-multiple: true

      - name: Download the bootable ISO
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generalbots-os-image
          path: dist
          merge-multiple: true

      - name: Create the stable download aliases
        # The Linux job now ships only versioned package names so the CI
        # artifact does not carry a duplicate ~800 MB copy of every format.
        # /releases/latest/download/<stable> still needs the version-less names,
        # so they are copied here, next to the published checksums.
        env:
          RELEASE_TAG: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          cd dist
          # Only the tarball needs a version-less alias: it is the documented
          # stable link (/releases/latest/download/generalbots-linux-x86_64.tar.gz).
          # Aliasing deb/rpm/AppImage too doubled ~2.5 GB of every release with
          # byte-identical copies nobody links to.
          for ext in tar.gz; do
            src="generalbots-${VERSION}-linux-x86_64.${ext}"
            [ -f "$src" ] || continue
            cp "$src" "generalbots-linux-x86_64.${ext}"
            sha256sum "generalbots-linux-x86_64.${ext}" >> SHA256SUMS-linux
          done

      - name: Assemble assets, manifest and checksums
        env:
          RELEASE_TAG: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          export COMMIT

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import platform

          dist = "dist"

          assets = {}
          for name in sorted(os.listdir(dist)):
              path = os.path.join(dist, name)
              if not os.path.isfile(path):
                  continue
              if name in {"MANIFEST.json", "SHA256SUMS"}:
                  continue
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              assets[name] = {"sha256": digest.hexdigest(), "size": os.path.getsize(path)}

          manifest = {
              "schema": 1,
              "release": os.environ["RELEASE_TAG"],
              "commit": os.environ["COMMIT"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "target": "x86_64-unknown-linux-gnu",
              "profile": "release",
              "build_arch": platform.machine(),
              "assets": assets,
          }
          with open(os.path.join(dist, "MANIFEST.json"), "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(f"manifest lists {len(assets)} assets")
          PY

          # One checksum file for the whole release. The per-platform files
          # from the builders stay attached for users who prefer them.
          (
            cd dist
            find . -maxdepth 1 -type f \
              ! -name 'MANIFEST.json' ! -name 'SHA256SUMS' -printf '%f\n' \
              | sort \
              | while IFS= read -r asset; do sha256sum "$asset"; done \
              > SHA256SUMS
          )
          ls -lh dist

      # #1634: /releases/latest/download/<name> only resolves an asset whose
      # name matches exactly. Fail before publishing rather than after.
      - name: Verify the stable download aliases
        env:
          RELEASE_TAG: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          test -f dist/generalbots-linux-x86_64.tar.gz
          test -f "dist/generalbots-${VERSION}-linux-x86_64.tar.gz"
          grep -qE "  generalbots-linux-x86_64\.tar\.gz$" dist/SHA256SUMS-linux
          grep -qE "  generalbots-${VERSION}-linux-x86_64\.tar\.gz$" dist/SHA256SUMS-linux
          (cd dist && sha256sum -c SHA256SUMS-linux --ignore-missing)

      - name: Publish the product release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.release.outputs.version }}
          name: ${{ needs.release.outputs.version }}
          # The product release owns /releases/latest; every component and
          # platform-only release stays a pre-release.
          draft: false
          prerelease: false
          make_latest: true
          body: |
            All-inclusive desktop release for ${{ needs.release.outputs.version }}.

            One download holds the whole product line:

            - Linux x86_64 desktop: `generalbots-linux-x86_64.tar.gz` (stable
              alias), the versioned tarball, the self-extracting `generalbots`
              executable, deb/rpm/AppImage when the bundler produced them,
              and the raw `generalbots`/`botserver`/`botui` binaries.
              `botui` is embedded in the desktop payload and also shipped as a
              standalone binary for frontend/server use.
            - Windows x86_64: `generalbots.exe` (self-extracting), MSI, NSIS
              setup, and the raw `generalbots`/`botserver`/`botui` exes.
            - macOS arm64: `*.dmg` and `*.app` (unsigned).
            - Bootable ISO: `generalbots-*.iso` (x86_64 live image built from the
              same tarball).
            - BotModels: Linux and Windows pythonbox bundles.

            `MANIFEST.json` lists every asset with its SHA-256 and size;
            `SHA256SUMS` verifies the whole release in one command. The
            per-platform `SHA256SUMS-*` files are kept as well.

            Stable link (always the newest release):

                https://github.com/generalbots/generalbots/releases/latest/download/generalbots-linux-x86_64.tar.gz

            The Linux tarball is the supported first-run path; it bundles the
            drive binaries and the BotModels pythonbox when a release exists.
