name: Product release

# #1804 — one product release line: vMAJOR.MINOR.PATCH, created on every merge
# to main. It bumps the patch, commits the new version into the version files,
# tags that commit and dispatches the all-inclusive release from the tag
# (#1851: `.github/workflows/release-all.yml`).
#
# /releases/latest always resolves to this product release because every other
# release is a pre-release:
#   component:  alm-*, pythonbox-*, drive-bin-*   (pre-release)
#   platform:   vMAJOR.MINOR.PATCH-windows/-macos (pre-release)
#
# The version bump commit is pushed with GITHUB_TOKEN, so it does not trigger
# another workflow run. `scripts/verify-latest-release.sh` asserts the result.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "botbook/**"
      - "issues/**"
      - "work/**"
      - "target/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Explicit version (e.g. 6.7.2); overrides bump"
        required: false
        type: string

permissions:
  contents: write
  actions: write
  issues: read

# Serialize releases so two queued merges cannot compute the same version.
concurrency:
  group: product-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag and dispatch the product build
    if: ${{ github.server_url == 'https://github.com' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message || '', 'chore(release):')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump the patch, commit and tag
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Always release the newest main, not a snapshot that a queued run
          # picked up earlier.
          git fetch --force --tags origin main
          git reset --hard FETCH_HEAD

          if [ -n "${REQUESTED_VERSION:-}" ]; then
            VERSION="v${REQUESTED_VERSION#v}"
            if git show-ref --tags --verify --quiet "refs/tags/${VERSION}"; then
              echo "::error::tag ${VERSION} already exists"
              exit 1
            fi
            python3 scripts/release_version.py sync "$VERSION"
          else
            VERSION="$(python3 scripts/release_version.py next --bump "$BUMP")"
            if git show-ref --tags --verify --quiet "refs/tags/${VERSION}"; then
              echo "::error::tag ${VERSION} already exists"
              exit 1
            fi
            python3 scripts/release_version.py sync "$VERSION"
          fi

          # What's New: the sections accumulate on tags, because main is
          # protected and cannot receive the bump commit. Start from the newest
          # tagged copy, then add or replace the section for this version.
          PREV_TAG="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -n "$PREV_TAG" ] && git cat-file -e "${PREV_TAG}:whatsnew.md" 2>/dev/null; then
            git show "${PREV_TAG}:whatsnew.md" > whatsnew.md
          fi
          python3 scripts/whats_new.py --file whatsnew.md generate --version "$VERSION" --write
          python3 scripts/whats_new.py --file whatsnew.md render --version "$VERSION" >> "$GITHUB_STEP_SUMMARY"

          git add Cargo.toml Cargo.lock botapp/tauri.conf.json README.md whatsnew.md

          if git diff --cached --quiet; then
            echo "version files already at ${VERSION}; tagging current main"
          else
            git commit -m "chore(release): ${VERSION} [skip ci]"
          fi

          # #1804: main is a protected branch, so the bot cannot push the
          # version-bump commit. The bump lives on the signed tag instead; the
          # next run derives the following version from the latest tag.
          git tag -a "$VERSION" -m "General Bots ${VERSION}"
          git push origin "$VERSION"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "### Product release ${VERSION}"
            echo
            echo "- version files: \`Cargo.toml\`, \`Cargo.lock\`, \`botapp/tauri.conf.json\`, README badge"
            echo "- tag: \`${VERSION}\` at \`$(git rev-parse --short HEAD)\`"
            echo "- the all-inclusive release is dispatched from this tag"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch the all-inclusive release from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # #1851: one entry point builds and publishes the whole product
          # line (server + Linux/Windows/macOS/arm64 desktops + pythonbox +
          # appliance image) into a single release with one MANIFEST.json.
          for attempt in 1 2 3; do
            if gh workflow run release-all.yml \
                 --repo "$GITHUB_REPOSITORY" \
                 --ref "$VERSION" \
                 -f tag="$VERSION"; then
              echo "dispatched release-all.yml at ${VERSION}"
              exit 0
            fi
            echo "dispatch failed (${attempt}/3); retrying"
            sleep 5
          done
          echo "::error::could not dispatch release-all.yml at ${VERSION}"
          exit 1
