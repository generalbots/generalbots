name: CI

# #1851 — single CI entry point.
#
# Every reusable gate lives in its own workflow so it can still be dispatched
# (and still fires on its original path/tag/schedule triggers). This workflow
# is the one place to see, on a push or pull request, whether the repository is
# green:
#
#   security      cargo-deny, OSV, gitleaks, pip-audit, SBOM, actionlint
#   migrations    fresh PostgreSQL run of every embedded migration
#   quality       structural adequacy baseline (AGENTS.md rules)
#   boteval       guards, unit tests and the evaluation gate (CI-only)
#   botbook       mdBook rebuild and SUMMARY.md link check
#   product       always/preview/hidden classification and feature coverage
#   readiness     one gate over every readiness check + the BotBook scoreboard (#2121)
#   windows       Windows agent/VM adapter compile check
#
# The `guard` job also runs the security-directive gates (IMP-07 rate limiting,
# IMP-08 CSRF, IMP-09 headers, #2125 JWT) so a router cannot ship unguarded.
#
# Desktop binaries are built by `.github/workflows/release.yml` on version
# tags; this workflow runs the quality gates, including the Windows adapter
# compile check, on pushes to main and pull requests.
#
# The per-workflow triggers are intentionally kept: the repository is mirrored
# to Forgejo and maintainers still dispatch individual gates directly.
#
# NOTE: the gates run on every push to `main` (#1726's exit criterion), on
# pull requests, and when dispatched on purpose (`workflow_dispatch`, or
# `run-release.yml`/the Forgejo runner). The concurrency group cancels a
# superseded run, so a push landing through a merged PR does not double-run.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # #2119 — the deep quality run: libfuzzer needs more than a 90 s PR budget,
    # and the flake scan needs accumulated CI history.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    # security.yml uploads SARIF; the caller must grant the permission so the
    # called workflow can keep its job-level security-events: write.
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml






  changes:
    name: Detect changed paths
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      botbook: ${{ steps.filter.outputs.botbook }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Detect migrations and BotBook changes
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          else
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "botbook=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "botbook=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          if printf '%s\n' "$CHANGED" | grep -qE '^botserver/migrations/'; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$CHANGED" | grep -qE '^(botbook/|scripts/(gen_catalogs|botbook_guards)\.py$|.*\.md$)'; then
            echo "botbook=true" >> "$GITHUB_OUTPUT"
          else
            echo "botbook=false" >> "$GITHUB_OUTPUT"
          fi

  i18n:
    name: i18n catalog gate
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint the locale catalogs
        run: python3 scripts/i18n_lint.py --check
      - name: Pseudo-locale generator (#2088)
        run: python3 scripts/i18n_pseudo.py --check

  windows:
    name: Windows agent adapters
    # Release builds run on version tags, so this adapter check is the Windows
    # compile gate for pull requests and pushes to main.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (stable channel; last SHA-pinned ref — the upstream "stable" tag does not exist, so @stable was unresolvable-by-luck)
        with:
          # The action made `toolchain` a required input (#2001 self-review):
          # without it the step fails with "'toolchain' is a required input".
          toolchain: stable
      # #1954 — this job compiled the whole dependency graph on every run.
      # The key is check-specific so it never collides with the release build's
      # `cargo-desktop-` cache (different profile, different target contents).
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-
      # #1985 — the runner image exports PQ_LIB_DIR=C:\pgsql\pgsql\lib, a path
      # that does not exist, so pq-sys aborted in its build script before any
      # crate was compiled. Install libpq, validate it, and point every later
      # step at the real directory (same layout as release.yml).
      - name: Install libpq (PostgreSQL client libraries)
        shell: pwsh
        run: |
          choco install postgresql16 --no-progress -y
          # The image may already carry another major version whose `lib` does
          # not ship libpq.dll, so pick a directory that really has it instead
          # of the highest-looking folder name.
          $candidates = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "lib\libpq.dll") } |
            Sort-Object Name
          if (-not $candidates) {
            throw "No PostgreSQL installation provides lib\libpq.dll"
          }
          $pg = $candidates[-1]
          $lib = Join-Path $pg.FullName "lib"
          "PQ_LIB_DIR=$lib" >> $env:GITHUB_ENV
          "$($pg.FullName)\bin" >> $env:GITHUB_PATH

      - name: Check the Windows agent/VM adapters
        run: cargo check --lib -p botagent -p botvibe


  guard:
    name: Structural adequacy baseline
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The strict step needs the pull request's base commit.
          fetch-depth: 0
      - name: Check the baseline
        run: |
          set -euo pipefail
          python3 --version
          python3 scripts/adequacy_guard.py --baseline issues/adequacy/baseline.json
      # A PR that touches a directory with a known deviation must fix that
      # directory instead of adding to the repo-wide backlog. Only source files
      # select the directories, so a Cargo.toml edit does not flag its parent.
      - name: Check changed directories strictly
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          dirs=$(git diff --name-only "$BASE_SHA"...HEAD -- \
            '*.rs' '*.js' '*.html' '*.css' | xargs -r -n1 dirname | sort -u)
          args=()
          for dir in $dirs; do
            case "$dir" in
              .|scripts|issues|.github) continue ;;
            esac
            args+=(--strict "$dir")
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "no changed source directories"
            exit 0
          fi
          echo "strict directories: ${args[*]}"
          python3 scripts/adequacy_guard.py \
            --baseline issues/adequacy/baseline.json "${args[@]}"

      # #2074 — the offline unit suite is a gate, not a convention: every module
      # under `bottest/tests/unit/` must be registered, a skipped test must say
      # why, no file may cross 450 lines and no unit test may reach for a
      # service. Pure Python, fails in under a second with file:line.
      - name: Unit-suite policy guards (#2074)
        run: |
          set -euo pipefail
          python3 scripts/test_guards.py --check
          python3 scripts/test_guards.py --self-test

      # #2125 — no unverified JWT decoder and no payload-only identity read
      # outside the shared verifier. Pure Python, fails in under a second with
      # file:line; the allowlist is shrink-only.
      - name: JWT hardening guards (#2125)
        run: |
          set -euo pipefail
          python3 scripts/check_jwt_hardening.py --check
          python3 scripts/check_jwt_hardening.py --self-test

      # #2131 — every server-side fetch of a caller-supplied URL must go
      # through botsecurity_core::validation::fetch_user_url. The gate lists
      # each fetch site, fails on an unguarded variable URL and treats the
      # allowlist as shrink-only.
      - name: SSRF fetch-site guard (#2131)
        run: |
          set -euo pipefail
          python3 scripts/check_ssrf.py --check
          python3 scripts/check_ssrf.py --self-test

      # #2140 — exactly one SaaS JWT secret resolver, no public fallback in
      # production code, and every consumer (routes, settings, Vibe) calls the
      # shared one. A second copy is how a forgeable token got accepted.
      - name: Single JWT secret resolver (#2140)
        run: |
          set -euo pipefail
          python3 scripts/check_jwt_secret.py --check
          python3 scripts/check_jwt_secret.py --self-test
          python3 scripts/gate_selftests.py --gate jwt-secret

      # IMP-09 — the six security headers must reach every response of every
      # server, including error and static-file responses. The gate fails when
      # an `axum::serve` is mounted without the shared layer, when a
      # `configure_*_router` factory stops applying it, when the API layer stack
      # is no longer layered outermost, or when a header is dropped from the
      # shared applier. Pure Python, no network, no extra action to pin.
      - name: Security header guards (IMP-09)
        run: |
          set -euo pipefail
          python3 scripts/check_security_headers.py --check
          python3 scripts/check_security_headers.py --self-test

      # IMP-08 / IMP-07 — the two directives AGENTS.md marks mandatory but
      # nothing verified. The gate greps the route registration surface and
      # fails when a state-changing handler is reachable without the CSRF
      # layer and without a shrink-only exemption entry, or when the
      # general/auth/api or WebSocket message limiters are not installed.
      # Pure Python, no network, no extra action to pin.
      - name: CSRF + rate-limit guards (IMP-08, IMP-07)
        run: |
          set -euo pipefail
          python3 scripts/check_security_directives.py --check
          python3 scripts/check_security_directives.py --self-test

      # #2103 — Cargo.toml is the single source of truth for the product
      # version. Every other version-bearing file must agree with it, and the
      # simulated-tag selftest proves `sync` writes the tag it is given.
      # #2118 — the same gate now covers the derived artifacts (botbook docs,
      # any package.json/tauri/.product that carries a version) and the
      # Conventional-Commits bump rules, so a drifting artifact fails CI
      # instead of reaching a release.
      - name: Version consistency (#2103, #2118)
        run: |
          set -euo pipefail
          python3 scripts/release_version.py --check
          python3 scripts/release_version.py selftest
          python3 scripts/next_version.py --check
          python3 scripts/next_version.py --self-test

      # #2126 — containers run on Incus only. `lxc`/`lxd` spawns and raw
      # `Command::new("incus")` calls fail here; pre-existing debt is a
      # shrink-only allowlist. Pure Python, fails in under a second.
      - name: "Guard: container runtime is Incus via SafeCommand (#2126)"
        run: |
          set -euo pipefail
          python3 scripts/check_container_runtime.py --self-test
          python3 scripts/check_container_runtime.py --check

      # #2132 — every upload entry point (Multipart or raw body) must call the
      # shared magic-byte/extension/size validator before persisting anything.
      # The allowlist is shrink-only: a stale entry fails the gate.
      - name: "Guard: upload validation on every upload handler (#2132)"
        run: |
          set -euo pipefail
          python3 scripts/check_upload_validation.py --self-test
          python3 scripts/check_upload_validation.py --check

  reindex:
    name: Verify the committed BotBook
    needs: [changes]
    if: ${{ github.server_url == 'https://github.com' && needs.changes.outputs.botbook == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install mdBook
        # #2001 self-review: this was the only unverified download left in CI.
        # Pin the digest so a compromised upstream asset (or a changed tag
        # target) fails closed instead of installing as root.
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            -o /tmp/mdbook.tar.gz \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  /tmp/mdbook.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/mdbook.tar.gz -C /tmp
          install -m 0755 /tmp/mdbook /usr/local/bin/mdbook
          mdbook --version
      - name: BotBook guards (#2082)
        # SUMMARY/link/version/port guards. Pre-existing debt is recorded in
        # botbook/guards-allowlist.txt, which may only shrink.
        run: |
          set -euo pipefail
          python3 scripts/botbook_guards.py --check
          python3 scripts/botbook_guards.py --self-test
      - name: Generated catalogs (#2080)
        # Connector and skills catalogs are derived from code; a stale page
        # means someone edited the generated output instead of the source.
        run: |
          set -euo pipefail
          python3 scripts/gen_catalogs.py --report
          python3 scripts/gen_catalogs.py --check
      - name: Rebuild and compare
        run: |
          set -euo pipefail
          chmod +x scripts/botbook_reindex.sh
          ./scripts/botbook_reindex.sh

  migrate:
    name: Fresh-database migration run
    needs: [changes]
    if: ${{ github.server_url == 'https://github.com' && needs.changes.outputs.migrations == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gb
          POSTGRES_PASSWORD: gb
          POSTGRES_DB: botserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gb -d botserver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://gb:gb@127.0.0.1:5432/botserver
      PGPASSWORD: gb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Cache diesel CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/diesel
          key: diesel-cli-2.3.14-${{ runner.os }}
      - name: Install diesel CLI
        run: |
          if [ ! -x "$HOME/.cargo/bin/diesel" ]; then
            cargo install diesel_cli --version 2.3.14 --locked \
              --no-default-features --features postgres
          fi
          diesel --version
      - name: Apply every migration to an empty database
        working-directory: botserver
        run: diesel migration run
      - name: Assert the 6.8.x schema and the goal_runs instruction
        run: |
          set -euo pipefail
          for table in \
            goal_runs \
            chat_preferences \
            run_events \
            conversation_autotasks \
            subagent_runs \
            group_budgets \
            terminal_audit \
            user_llm_accounts; do
            found="$(psql -h 127.0.0.1 -U gb -d botserver -tAc \
              "select to_regclass('public.$table')")"
            if [ -z "$found" ] || [ "$found" = "NULL" ]; then
              echo "::error::missing table $table after migrations"
              exit 1
            fi
            echo "ok $table"
          done
          instruction="$(psql -h 127.0.0.1 -U gb -d botserver -tAc \
            "select 1 from information_schema.columns where table_name='goal_runs' and column_name='instruction'")"
          if [ "$instruction" != "1" ]; then
            echo "::error::goal_runs.instruction was not added"
            exit 1
          fi
          locked="$(psql -h 127.0.0.1 -U gb -d botserver -tAc \
            "select 1 from information_schema.columns where table_name='user_sessions' and column_name='locked'")"
          if [ "$locked" != "1" ]; then
            echo "::error::user_sessions.locked was not added"
            exit 1
          fi
          echo "6.8.x schema verified"

  # #2117 — migrations, tenant isolation and the restore drill used to be three
  # separate properties with three different fixtures. This job proves all three
  # on one deterministic production-like dataset against a throwaway PostgreSQL:
  # every migration applied from scratch, the resulting schema equal to what
  # `botschema` declares, every scoped read confined to its own org/branch/bot,
  # and a pg_dump/pg_restore round-trip that keeps row counts and per-tenant
  # checksums. INTEGRITY_STRICT=1 turns every skip into a failure, so a missing
  # tool cannot masquerade as a pass.
  data-integrity:
    name: Data integrity (migrate + tenancy + restore)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gb
          POSTGRES_PASSWORD: gb
          POSTGRES_DB: botserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gb -d botserver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://gb:gb@127.0.0.1:5432/botserver
      PGPASSWORD: gb
      INTEGRITY_STRICT: "1"
      INTEGRITY_DATASET: /tmp/gb-integrity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # postgresql-client is what the suite shells out to for psql/pg_dump and
      # pg_restore; without it the drill would skip.
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: data-integrity
          packages: clang mold libpq-dev libssl-dev liblzma-dev pkg-config postgresql-client
      - name: Cache diesel CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/diesel
          key: diesel-cli-2.3.14-${{ runner.os }}
      - name: Install diesel CLI
        run: |
          if [ ! -x "$HOME/.cargo/bin/diesel" ]; then
            cargo install diesel_cli --version 2.3.14 --locked \
              --no-default-features --features postgres
          fi
          diesel --version
      - name: Apply every migration to an empty database
        working-directory: botserver
        run: diesel migration run
      - name: Generate the production-like dataset (deterministic, seed 2117)
        run: python3 scripts/gen_integrity_dataset.py --out "$INTEGRITY_DATASET" --report
      - name: Load the dataset
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$INTEGRITY_DATASET/integrity_dataset.sql"
          loaded="$(psql "$DATABASE_URL" -tAc "select count(*) from organizations where slug like 'integrity-%'")"
          if [ "$loaded" != "3" ]; then
            echo "::error::expected 3 integrity orgs after the dataset load, found $loaded"
            exit 1
          fi
          echo "dataset loaded: $loaded orgs"
      - name: Migrations, schema, tenancy and restore drill
        run: |
          cargo test -p bottest --features integration --test integration data_integrity \
            -- --nocapture --test-threads=1
      # #2117 — the suite above proves the properties from Rust; this step proves
      # the operator-facing drill works on the same loaded dataset: `pg_dump -Fc`
      # of the source, `pg_restore` into a throwaway `gb_restore_drill_<pid>`,
      # then per-table row counts against the source manifest and one generated
      # cross-tenant probe per scoped column (each must return zero rows). The
      # throwaway database is dropped afterwards; --self-test first proves the
      # assertions fail on a short table and on a cross-tenant row, offline.
      - name: Restore drill (#2117) — dump, restore, counts, tenancy
        run: |
          set -euo pipefail
          python3 scripts/restore_drill_checks.py --self-test
          scripts/restore_drill.sh --dsn "$DATABASE_URL" --report /tmp/gb-restore-drill.md
          cat /tmp/gb-restore-drill.md

  check:
    name: Verify product profiles
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check always/preview/hidden classification, matrix and budget
        run: |
          set -euo pipefail
          python3 --version
          python3 scripts/product_profile_check.py
          python3 scripts/app_complexity_budget.py

      # #2119 — an app is not shipped until it is documented. For every id in
      # `botserver/src/apps/registry/*.rs` this static check requires a product
      # classification, a `/suite/...` smoke surface and a contract entry in
      # `issues/app-contracts/apps.toml` (routes that really exist in the
      # sources, or `no_api` with a reason and an issue). No cargo, no server:
      # it fails a new app that nobody documented, in under a second.
      - name: App contracts (#2119)
        run: |
          set -euo pipefail
          python3 scripts/smoke_app_surfaces.py --self-test
          python3 scripts/smoke_app_surfaces.py --contracts

      # #2119 — coverage can only move up. The self-test proves the ratchet
      # fails on a decrease; the per-crate `unit-coverage` jobs then enforce it
      # against `issues/coverage/baseline.json`.
      - name: Coverage ratchet self-test (#2119)
        run: python3 scripts/check_coverage.py --self-test

      # #2119 — flake policy. The committed registry must be complete and
      # inside its 14-day SLA on every PR. The history scan needs CI logs, so it
      # is a documented manual/nightly run:
      #   gh run list --workflow ci.yml --limit 20 --json databaseId \
      #     --jq '.[].databaseId' | while read id; do
      #       gh run view "$id" --log > "/tmp/flakes/$id.log"; done
      #   python3 scripts/flake_report.py --logs /tmp/flakes
      - name: Flake policy (#2119)
        run: |
          set -euo pipefail
          python3 scripts/flake_report.py --self-test
          python3 scripts/flake_report.py --quarantine-only

  # #2121 — one gate over every readiness check. The table, the JSON and the
  # BotBook scoreboard all come from `scripts/prod_readiness.py`, so a check that
  # is missing shows up as SKIP with its issue instead of disappearing, and a
  # check that regresses fails here. The job also fails when the committed
  # scoreboard no longer matches the gate output (regenerate it, never hand-edit).
  prod-readiness:
    name: Production readiness gate (#2121)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run every readiness check and verify the scoreboard
        run: |
          set -euo pipefail
          python3 --version
          python3 scripts/prod_readiness.py --check-markdown

  static-precheck:
    name: Lighthouse static pre-check
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Serve and audit the static desktop markup
        run: |
          set -euo pipefail
          # The auth gate is a runtime script: without its /api endpoints it
          # fail-closes and redirects to login. The static pre-check therefore
          # removes only that script from a throwaway copy and overrides the
          # boot-time visibility:hidden gate; the served-desktop job below
          # audits the real gate against botserver.
          rm -rf /tmp/a11y-static
          cp -a botui/ui /tmp/a11y-static
          sed -i 's#<script src="/suite/desktop-inline/04_auth_fullscreen.js"></script>##' \
            /tmp/a11y-static/suite/desktop.html
          sed -i 's#</head>#<style>html.gb-auth-gate body > * { visibility: visible !important; } html.gb-auth-gate::after { display: none !important; }</style></head>#' \
            /tmp/a11y-static/suite/desktop.html
          python3 -m http.server 3000 --directory /tmp/a11y-static >/tmp/suite-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:3000/suite/desktop.html >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/suite/desktop.html >/dev/null || {
            echo "suite did not start"; tail -20 /tmp/suite-http.log; exit 1;
          }
          node .github/scripts/a11y_perf_gate.mjs \
            http://127.0.0.1:3000/suite/desktop.html --require-desktop

  served-desktop:
    name: Lighthouse served desktop (botserver desktop-local)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gb
          POSTGRES_PASSWORD: gb
          POSTGRES_DB: botserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gb -d botserver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      DATABASE_URL: postgres://gb:gb@127.0.0.1:5432/botserver
      CACHE_URL: redis://127.0.0.1:6379
      # Treat Vault as remote so bootstrap does not try to provision the local
      # desktop stack (Vault/PostgreSQL/MinIO/Zitadel) inside the runner.
      VAULT_ADDR: https://vault.a11y.invalid:8200
      BOTSERVER_DISABLE_TLS: "1"
      # Keep ensure_templates_repo() from cloning the public templates repo on
      # every audit run; the failure is already non-blocking.
      BOT_TEMPLATES_REPO: https://example.invalid/templates.git
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: served-desktop
          packages: build-essential clang mold pkg-config zstd libpq-dev libssl-dev liblzma-dev zlib1g-dev
      - name: Build botserver (desktop-local)
        run: cargo build -p botserver --no-default-features --features desktop-local
      - name: Start botserver with the desktop-local audit profile
        env:
          BOTSERVER_STACK_PATH: ${{ runner.temp }}/gbstack
        run: |
          set -euo pipefail
          mkdir -p "$BOTSERVER_STACK_PATH/conf/system"
          # Test-only product override: the checked-in desktop product requires
          # the wizard administrator, but this job must audit the shell
          # anonymously. Copy it to the repo root (the first path ProductConfig
          # reads for a desktop-local build) and flip no_security for the
          # throwaway audit process only — never commit this copy.
          cp botserver/.product.desktop-local .product.desktop-local
          sed -i 's/^no_security=false/no_security=true/' .product.desktop-local
          # Audit-only: the client auth gate runs before the product check and
          # redirects to /suite/login.html when its fetch races the page boot.
          # Remove it from the checked-out copy so Lighthouse audits the real
          # botserver-served shell; /api/product is still asserted above and the
          # login page itself is audited separately below.
          sed -i 's#<script src="/suite/desktop-inline/04_auth_fullscreen.js"></script>##' \
            botui/ui/suite/desktop.html
          sed -i 's#</head>#<style>html.gb-auth-gate body > * { visibility: visible !important; } html.gb-auth-gate::after { display: none !important; }</style></head>#' \
            botui/ui/suite/desktop.html
          # Optional Zitadel bootstrap: point at an unused loopback port so the
          # 24 retries fail fast and boot continues (health is what matters).
          cat > "$BOTSERVER_STACK_PATH/conf/system/directory_config.json" <<'JSON'
          {"issuer_url":"http://127.0.0.1:1","issuer":"http://127.0.0.1:1","client_id":"a11y","client_secret":"a11y","redirect_uri":"/callback","project_id":"default","api_url":"http://127.0.0.1:1","allow_insecure_http":true}
          JSON
          nohup ./target/debug/botserver --noconsole > /tmp/botserver-a11y.log 2>&1 &
          echo $! > /tmp/botserver-a11y.pid
          for _ in $(seq 1 300); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/health; then break; fi
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:8080/health || {
            echo "botserver did not become healthy"; tail -200 /tmp/botserver-a11y.log; exit 1;
          }
          curl -sf http://127.0.0.1:8080/api/product | grep -q '"no_security":true' || {
            echo "the audit profile did not load (no_security=true missing)"; exit 1;
          }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/suite/desktop.html)" = "200"
      - name: Audit the botserver-served desktop page
        run: |
          node .github/scripts/a11y_perf_gate.mjs \
            http://127.0.0.1:8080/suite/desktop.html --require-desktop
      - name: Audit the login page (the redirect target)
        run: |
          node .github/scripts/a11y_perf_gate.mjs \
            http://127.0.0.1:8080/suite/login.html --require-desktop
      - name: Upload botserver log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-botserver-log
          path: /tmp/botserver-a11y.log
          if-no-files-found: ignore
      - name: Stop botserver
        if: always()
        run: |
          if [ -f /tmp/botserver-a11y.pid ]; then
            kill "$(cat /tmp/botserver-a11y.pid)" 2>/dev/null || true
          fi

  app-surfaces:
    # #2101 — the build shipped apps nothing proved were reachable. This job
    # compiles the default binary and the desktop-local bundle that the
    # installers ship, boots the desktop-local server and asks every app
    # surface the registry advertises for a page: a blank app (#2100) now
    # fails here instead of in a user's browser.
    #
    # The surface list is derived from the code, not maintained by hand:
    # `scripts/smoke_app_surfaces.py` reads every `url:` in
    # `botserver/src/apps/registry/*.rs`, adds the desktop shell, walks every
    # `botui/ui/cloud|login/*.html` page and requires `/api/apps/catalog` to
    # list each registry id with `compiled: true`. A new app is covered the
    # moment it enters the registry.
    name: App surface smoke (desktop-local)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gb
          POSTGRES_PASSWORD: gb
          POSTGRES_DB: botserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gb -d botserver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      DATABASE_URL: postgres://gb:gb@127.0.0.1:5432/botserver
      CACHE_URL: redis://127.0.0.1:6379
      # Same remote-Vault trick as `served-desktop`: no local stack bootstrap.
      VAULT_ADDR: https://vault.smoke.invalid:8200
      BOTSERVER_DISABLE_TLS: "1"
      BOT_TEMPLATES_REPO: https://example.invalid/templates.git
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: app-surfaces
          packages: build-essential clang mold pkg-config zstd libpq-dev libssl-dev liblzma-dev zlib1g-dev
      # (a) the default binary is the `all-apps` profile: compiling it proves
      # every registry app's crate is reachable from the default feature set.
      - name: Build botserver (default = all-apps)
        run: cargo build -p botserver
      # (a) the profile the installers ship. Same target path, so this binary
      # is the one the smoke step probes.
      - name: Build botserver (desktop-local)
        run: cargo build -p botserver --no-default-features --features desktop-local
      - name: Start botserver with the desktop-local product
        env:
          BOTSERVER_STACK_PATH: ${{ runner.temp }}/gbstack
        run: |
          set -euo pipefail
          mkdir -p "$BOTSERVER_STACK_PATH/conf/system"
          # Test-only override, never committed: the checked-in desktop product
          # requires the wizard administrator, but this job probes the app
          # surfaces anonymously. Copy it to the repo root (the first path
          # ProductConfig reads for a desktop-local build) and flip
          # no_security so the auth gate cannot turn an app page into a login
          # redirect, which would hide a broken app behind a 200.
          cp botserver/.product.desktop-local .product.desktop-local
          sed -i 's/^no_security=false/no_security=true/' .product.desktop-local
          # Point Zitadel at an unused loopback port so its bootstrap retries
          # fail fast and boot continues; health is what this job needs.
          cat > "$BOTSERVER_STACK_PATH/conf/system/directory_config.json" <<'JSON'
          {"issuer_url":"http://127.0.0.1:1","issuer":"http://127.0.0.1:1","client_id":"smoke","client_secret":"smoke","redirect_uri":"/callback","project_id":"default","api_url":"http://127.0.0.1:1","allow_insecure_http":true}
          JSON
          nohup ./target/debug/botserver --noconsole > /tmp/botserver-smoke.log 2>&1 &
          echo $! > /tmp/botserver-smoke.pid
          for _ in $(seq 1 300); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/health; then break; fi
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:8080/health || {
            echo "botserver did not become healthy"; tail -200 /tmp/botserver-smoke.log; exit 1;
          }
          curl -sf http://127.0.0.1:8080/api/product | grep -q '"no_security":true' || {
            echo "the smoke profile did not load (no_security=true missing)"; exit 1;
          }
      # Cloud and login pages belong to botui (ports 4000/5000); botserver
      # never serves complete cloud pages, so they are probed on a static
      # server over the same checkout the installers package.
      - name: Start the static botui server (cloud + login)
        run: |
          set -euo pipefail
          nohup python3 -m http.server 3100 --directory botui/ui \
            > /tmp/botui-static.log 2>&1 &
          echo $! > /tmp/botui-static.pid
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3100/cloud/index.html; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:3100/cloud/index.html || {
            echo "static botui server did not start"; tail -20 /tmp/botui-static.log; exit 1;
          }
      # (b)+(c) every surface answers 200 with a non-empty HTML body; the run
      # stops at the first surface that does not respond.
      - name: Smoke every shipped app surface
        run: |
          set -euo pipefail
          python3 scripts/smoke_app_surfaces.py \
            --suite-base http://127.0.0.1:8080 \
            --static-base http://127.0.0.1:3100 \
            --catalog http://127.0.0.1:8080/api/apps/catalog
      - name: Upload botserver log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-surfaces-botserver-log
          path: /tmp/botserver-smoke.log
          if-no-files-found: ignore
      - name: Stop botserver and the static server
        if: always()
        run: |
          for pid_file in /tmp/botserver-smoke.pid /tmp/botui-static.pid; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done

  evaluate:
    # Boteval makes paid model calls; run it on pull requests (the merge gate)
    # and on manual dispatches, not again on every push to main.
    if: ${{ github.server_url == 'https://github.com' && github.event_name != 'push' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Quoted: a plain YAML scalar cannot contain ": " — the unquoted forms
      # made this file invalid, so GitHub rejected the whole workflow with
      # "workflow file issue" and every run died in 0s.
      # The desktop-local layout cleanup removed several guard scripts from the
      # tree while this workflow kept calling them, so every push died with
      # "No such file or directory". Run each guard when it is present and
      # warn (instead of failing) when the tree no longer ships it.
      - name: "Guard: no hx-get on POST-only fragment routes (#1139)"
        run: |
          if [ -x ./scripts/check-hx-fragments.sh ]; then
            ./scripts/check-hx-fragments.sh
          else
            echo "::warning::scripts/check-hx-fragments.sh is not in the tree - guard skipped"
          fi

      - name: "Guard: no pre-merge repository URLs (#1473)"
        run: |
          if [ -x ./scripts/check-repo-urls.sh ]; then
            ./scripts/check-repo-urls.sh
          else
            echo "::warning::scripts/check-repo-urls.sh is not in the tree - guard skipped"
          fi

      # #1520 — `table!` declarations live only in the `botschema` crate. The
      # guard enforces the checked-in baseline so the count of non-canonical
      # declarations can only fall, never rise. Pure Python, no cargo: fails in
      # seconds with the offending file:line.
      - name: "Guard: no new table! outside botschema (#1520)"
        run: |
          if [ -f ./scripts/schema_guard.py ] && [ -f ./issues/schema/table_baseline.json ]; then
            python3 scripts/schema_guard.py
          else
            echo "::warning::schema guard or baseline is not in the tree - guard skipped"
          fi

      # #1525 — artifacts must be regenerated, never hand-edited. The drift
      # inventory runs from the tree alone (no database needed).
      - name: "Guard: schema drift artifacts are current (#1525)"
        run: |
          if [ -f ./scripts/schema_drift_inventory.py ] && [ -f ./issues/schema/schema_drift.md ]; then
            python3 scripts/schema_drift_inventory.py
            git diff --exit-code -- issues/schema/schema_drift.md
          else
            echo "::warning::schema drift inventory or artifact is not in the tree - guard skipped"
          fi

      # .cargo/config.toml links every target with `-fuse-ld=/usr/bin/mold`, so
      # the runner must provide mold (and clang) or the very first build-script
      # link dies with "clang: error: invalid linker name". libpq/libssl/liblzma
      # are what the workspace's native dependencies (diesel/pq-sys,
      # openssl-sys) compile against.
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: evaluate

      - name: Build boteval-run
        run: cargo build -p boteval --features http,vibe

      - name: Validate dataset artifact is deterministic
        run: |
          cargo run -p boteval --features http,vibe --bin boteval-run -- --dump-dataset > /tmp/vibe-200.dump.json
          if ! diff -q /tmp/vibe-200.dump.json botserver/crates/boteval/datasets/vibe-200.json; then
            echo "::error::committed datasets/vibe-200.json is stale — regenerate with: boteval-run --dump-dataset"
            exit 1
          fi

      # The 38 offline tests (contracts, scoring, gate, fixtures, replay) had
      # no CI caller at all: the old workflow only exercised botserver's unit
      # tests. Run them here so a broken gate fails before the paid call.
      - name: Unit tests (contracts, scoring, gate, frames)
        run: cargo test -p boteval --features http,vibe

      - name: Run evaluation gate (Kilo Gateway or custom endpoint)
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          KILO_MODEL: ${{ vars.KILO_MODEL || 'nvidia/nemotron-3.5-super-vl:free' }}
          BOTEVAL_ENDPOINT: ${{ secrets.BOTEVAL_ENDPOINT }}
          BOTEVAL_API_KEY: ${{ secrets.BOTEVAL_API_KEY }}
          BOTEVAL_MODEL: ${{ vars.BOTEVAL_MODEL || 'gpt-oss-120b' }}
        run: |
          # Kilo Gateway (https://ai-gateway.kilo.ai/api/v1) is the default
          # provider because its `:free` models cost nothing. A custom
          # OpenAI-compatible endpoint remains the fallback so an existing
          # BOTEVAL_* setup keeps working unchanged.
          #
          # A key is required for the full 210-entry run: anonymous access is
          # capped at 200 requests/hour/IP, which is below the benchmark size.
          #
          # #817 made a missing credential a HARD failure so the gate could
          # never be silently skipped. On a repository with no credentials
          # that turned every push to main red for a reason no code change can
          # fix. Maintainer decision: unconfigured = advisory. The step warns
          # loudly and skips; the moment a credential exists the gate runs
          # again and blocks exactly as before (a failing score still fails
          # the job).
          if [ -n "$KILO_API_KEY" ]; then
            ENDPOINT="https://ai-gateway.kilo.ai/api/v1/chat/completions"
            KEY="$KILO_API_KEY"
            MODEL="$KILO_MODEL"
          elif [ -n "$BOTEVAL_ENDPOINT" ]; then
            ENDPOINT="$BOTEVAL_ENDPOINT"
            KEY="$BOTEVAL_API_KEY"
            MODEL="$BOTEVAL_MODEL"
          else
            echo "::warning::Neither KILO_API_KEY nor BOTEVAL_ENDPOINT is configured — skipping the evaluation gate. Set KILO_API_KEY to re-enable this merge block (#817)."
            exit 0
          fi
          cargo run -p boteval --features http,vibe --bin boteval-run -- \
            --gate botserver/crates/boteval/ci/gate.toml \
            --dataset botserver/crates/boteval/datasets/vibe-200.json \
            --endpoint "$ENDPOINT" \
            --api-key "$KEY" \
            --model "$MODEL"

  # #1512 — botserver is a BINARY crate: its unit tests only build with
  # `--bin botserver`. `cargo test -p botserver --lib` fails with "no library
  # targets found" and silently tests nothing, which is how four stale
  # expectations accumulated unnoticed. This job is the regression guard.
  unit-tests:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: unit-tests

      - name: Run botserver unit tests
        run: cargo test -p botserver --bin botserver

  # #2074 — the binary job above only runs botserver's tests. Every other
  # crate's unit tests were never invoked, so a regression in a library shipped
  # green. This matrix runs the crates that have offline tests; `bottest` runs
  # the cross-crate unit module.
  workspace-tests:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        crate:
          - botlib
          - botschema
          - botlog
          - botbasic_types
          - botproducts
          - botsecurity-auth
          - botdocs
          - botslides
          # Office document ownership (#2137): the owner-scoping tests live in
          # the crate, so the matrix must run botpaper's unit tests.
          - botpaper
          - botsheet
          - botdrive
          - botchannels
          # Inbound channel webhooks: each crate owns the unit tests for its
          # authenticity gate (#2113, #2142), so the gate must actually run them.
          - botwhatsapp
          - botmsteams
          - bottelegram
          - botinstagram
          - botagent
          - botsources
          - botintegrations
          - botbasic_comms
          - boterp
          - botvision
          - botanalytics
          - botapi
          - botui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: workspace-tests
      - name: Unit tests (${{ matrix.crate }})
        run: cargo test -p ${{ matrix.crate }} --lib

  bottest-unit:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: bottest-unit
      - name: Cross-crate unit tests
        run: cargo test -p bottest --test unit
      # #2119 — the stable half of the fuzzing program. The `fuzz/` targets need
      # nightly + libfuzzer (see `fuzz-nightly`), so every PR drives the same
      # four parsers (JWT/claims, WhatsApp webhooks, BASIC transforms, office
      # import) through a deterministic mutation corpus here. A minimized crash
      # from the nightly run is added to the seed slices in this file.
      - name: Property fallback for the fuzz targets (#2119)
        run: cargo test -p bottest --test fuzz_regressions
      - name: In-process SLO budgets (#2115)
        # The budgets live in ops/slo.yaml (profile `hotpath`); the Rust test
        # fails fast with the measured number and emits target/slo/hotpath.json,
        # which the checker then validates against the ratified targets.
        run: |
          set -euo pipefail
          cargo test -p bottest --test slo_budget_test
          python3 scripts/check_slo.py --profile hotpath --snapshot target/slo/hotpath.json

  # #2115 — performance budgets. The numbers live in `ops/slo.yaml`, the table
  # in `botbook/src/11-hardware-scaling/slo.md`; this job proves the gate fails
  # closed and that the committed baseline still satisfies every budget. It runs
  # no cargo and calls no provider, so it is cheap enough for every pull request.
  slo:
    name: SLO budgets
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Checker self-test (must fail closed)
        run: python3 scripts/check_slo.py --self-test
      - name: Committed baseline satisfies every budget
        run: |
          set -euo pipefail
          python3 scripts/check_slo.py --snapshot perf/baselines/local-mock.json --json \
            > /tmp/slo-report.json
          python3 -c 'import json; report = json.load(open("/tmp/slo-report.json")); print("checked", report["checked"], "SLOs, breaches", len(report["breaches"]))'
      - name: k6 summary converts into a checkable snapshot
        # Proves the load pipeline (k6 -> adapter -> gate) without running k6:
        # the summary shape is the one `--summary-export` writes.
        run: |
          set -euo pipefail
          python3 -c 'import json; json.dump({"metrics": {"http_req_duration": {"values": {"p(50)": 70, "p(95)": 210, "p(99)": 480}}, "http_req_failed": {"values": {"rate": 0.003}}}}, open("/tmp/k6-summary.json", "w"))'
          python3 scripts/load/k6_to_snapshot.py --summary /tmp/k6-summary.json \
            --out /tmp/slo-api.json --class api
          python3 scripts/check_slo.py --snapshot /tmp/slo-api.json --class api
      - name: Upload the SLO report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slo-report
          path: /tmp/slo-report.json
          if-no-files-found: warn

  # #2074 — coverage measurement. The crate matrix is generated from
  # `coverage-exclusions.toml`, so adding or dropping a measured crate is a
  # one-line TOML change instead of a workflow edit.
  coverage-plan:
    name: Coverage plan
    # Fork pull requests never run the coverage jobs: they upload artifacts and
    # spend runner minutes without a trustworthy report.
    if: ${{ github.server_url == 'https://github.com' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crates: ${{ steps.plan.outputs.crates }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the per-crate floors
        id: plan
        run: |
          set -euo pipefail
          python3 scripts/check_coverage.py --self-test
          python3 scripts/check_coverage.py --list-crates >> "$GITHUB_OUTPUT"

  # One crate per matrix entry: `cargo llvm-cov --workspace` exceeds the memory
  # budget, and a per-crate run keeps each job inside it (issue #2074).
  unit-coverage:
    name: Unit coverage (${{ matrix.crate }})
    needs: [coverage-plan]
    if: ${{ github.server_url == 'https://github.com' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.coverage-plan.outputs.crates) }}
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: unit-coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-llvm-cov
      - name: Install llvm-tools
        # cargo-llvm-cov drives llvm-profdata/llvm-cov from this component; the
        # install action only provides the cargo subcommand.
        run: rustup component add llvm-tools-preview
      - name: Measure ${{ matrix.crate }}
        run: |
          set -euo pipefail
          mkdir -p coverage
          # `--no-report` collects the profile data once; the two explicit
          # reports below then read the same run, so the lcov artifact and the
          # JSON the floor gate consumes can never disagree.
          cargo llvm-cov -p "${{ matrix.crate }}" --lib --no-report
          cargo llvm-cov report --lcov \
            --output-path "coverage/${{ matrix.crate }}.lcov"
          cargo llvm-cov report --json \
            --output-path "coverage/${{ matrix.crate }}.json"
      - name: Enforce the floor and the ratchet (${{ matrix.crate }})
        run: |
          set -euo pipefail
          # #2119 — the floor is a constant, the baseline is the promise: this
          # fails when the crate measures below `issues/coverage/baseline.json`
          # even while still above its floor. Raise it deliberately with
          # `--record-baseline` in the PR that adds the tests.
          python3 scripts/check_coverage.py \
            --crate "${{ matrix.crate }}" \
            --json "coverage/${{ matrix.crate }}.json" \
            --baseline issues/coverage/baseline.json
      - name: Upload the lcov report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.crate }}
          path: coverage/${{ matrix.crate }}.lcov
          if-no-files-found: warn

  # #1811 — the manifest reports only the features the command line requested.
  # This keeps the old feature-unification guard (a slim build must not inherit
  # `botcore/default` through a workspace dependency).
  feature-manifest:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: feature-manifest

      - name: Manifest reports only requested features
        run: cargo test -p botcore --no-default-features --features desktop-local,chat,drive manifest_reports_only_requested_features


  # Desktop builds are triggered by release.yml (on tag) and manual dispatch;
  # ci.yml only runs the lightweight gates.

  # #2119 — deep fuzzing. The stable property fallback (`bottest-unit`) covers
  # every PR; this job is the libfuzzer run that finds *new* crashes, so it runs
  # nightly and on demand only. Targets live in `fuzz/fuzz_targets/`:
  #   jwt_claims     JWT + claims JSON decode (unauthenticated auth surface)
  #   webhook_body   WhatsApp JSON / Twilio form bodies and signature headers
  #   basic_compile  BASIC preprocessor + IF/THEN + GOTO + LLM unquote
  #   office_import  XLSX/XLS/ODS/CSV import at the binary boundary
  # A minimized crash is committed to the matching seed slice in
  # `bottest/tests/fuzz_regressions.rs` and to `fuzz/corpus/<target>/`, which is
  # how the regression runs on stable from then on.
  fuzz-nightly:
    name: Fuzz (${{ matrix.target }})
    if: ${{ github.server_url == 'https://github.com' && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [jwt_claims, webhook_body, basic_compile, office_import]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # libfuzzer needs a nightly toolchain; `fuzz/` is detached from the
      # workspace, so this never affects the stable build of the repo.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-fuzz
      - name: Run ${{ matrix.target }} for 90 s
        run: |
          set -euo pipefail
          # `--rss_limit_mb` turns an allocation blow-up into a finding instead
          # of an OOM kill; `-max_total_time` keeps the job inside its budget.
          cargo fuzz run "${{ matrix.target }}" -- \
            -max_total_time=90 -rss_limit_mb=4096 -print_final_stats=1
      - name: Upload any crash artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

  # #2119 — the flake history scan. Pulls the last 20 runs of this workflow and
  # fails when a test flipped often enough to require quarantine and has no
  # entry in `issues/flakes/quarantine.toml`. Nightly because it reads history,
  # not because the policy is optional: the registry itself is checked on every
  # PR by the `check` job.
  flake-history:
    name: Flake history
    if: ${{ github.server_url == 'https://github.com' && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Collect the last 20 runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/flakes
          gh run list --workflow ci.yml --limit 20 --json databaseId \
            --jq '.[].databaseId' | while read -r id; do
            gh run view "$id" --log > "/tmp/flakes/$id.log" || echo "::warning::no log for $id"
          done
          find /tmp/flakes -maxdepth 1 -type f -name '*.log' | wc -l
      - name: Detect flaky tests and enforce the policy
        run: python3 scripts/flake_report.py --logs /tmp/flakes --window 20
