name: CI

# #1851 — single CI entry point.
#
# Every reusable gate lives in its own workflow so it can still be dispatched
# (and still fires on its original path/tag/schedule triggers). This workflow
# is the one place to see, on a push or pull request, whether the repository is
# green:
#
#   security      cargo-deny, OSV, gitleaks, pip-audit, SBOM, actionlint
#   migrations    fresh PostgreSQL run of every embedded migration
#   quality       structural adequacy baseline (AGENTS.md rules)
#   boteval       guards, unit tests and the evaluation gate (CI-only)
#   botbook       mdBook rebuild and SUMMARY.md link check
#   product       always/preview/hidden classification and feature coverage
#   readiness     one gate over every readiness check + the BotBook scoreboard (#2121)
#   windows       Windows agent/VM adapter compile check
#
# The `guard` job also runs the security-directive gates (IMP-07 rate limiting,
# IMP-08 CSRF, IMP-09 headers, #2125 JWT) so a router cannot ship unguarded.
#
# Desktop binaries are built by `.github/workflows/release.yml` on version
# tags; this workflow runs the quality gates, including the Windows adapter
# compile check, on pushes to main and pull requests.
#
# The per-workflow triggers are intentionally kept: the repository is mirrored
# to Forgejo and maintainers still dispatch individual gates directly.
#
# NOTE: the gates run on every push to `main` (#1726's exit criterion), on
# pull requests, and when dispatched on purpose (`workflow_dispatch`, or
# `run-release.yml`/the Forgejo runner). The concurrency group cancels a
# superseded run, so a push landing through a merged PR does not double-run.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      force_nightly:
        description: Run the schedule-only fuzz and flake-history jobs on demand
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"
  schedule:
    # #2119 — the deep quality run: libfuzzer needs more than a 90 s PR budget,
    # and the flake scan needs accumulated CI history.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    # security.yml uploads SARIF; the caller must grant the permission so the
    # called workflow can keep its job-level security-events: write.
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml






  changes:
    name: Detect changed paths
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      botbook: ${{ steps.filter.outputs.botbook }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Detect migrations and BotBook changes
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          else
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "botbook=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "botbook=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          if printf '%s\n' "$CHANGED" | grep -qE '^botserver/migrations/'; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$CHANGED" | grep -qE '^(botbook/|scripts/(gen_catalogs|botbook_guards)\.py$|.*\.md$)'; then
            echo "botbook=true" >> "$GITHUB_OUTPUT"
          else
            echo "botbook=false" >> "$GITHUB_OUTPUT"
          fi

  i18n:
    name: i18n catalog gate
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Locale catalogue gate (#2088, #2542)
        run: bash scripts/check-i18n.sh

  windows:
    name: Windows agent adapters
    # Release builds run on version tags, so this adapter check is the Windows
    # compile gate for pull requests and pushes to main.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (stable channel; last SHA-pinned ref — the upstream "stable" tag does not exist, so @stable was unresolvable-by-luck)
        with:
          # The action made `toolchain` a required input (#2001 self-review):
          # without it the step fails with "'toolchain' is a required input".
          toolchain: stable
      # #1954 — this job compiled the whole dependency graph on every run.
      # The key is check-specific so it never collides with the release build's
      # `cargo-desktop-` cache (different profile, different target contents).
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-
      # #1985 — the runner image exports PQ_LIB_DIR=C:\pgsql\pgsql\lib, a path
      # that does not exist, so pq-sys aborted in its build script before any
      # crate was compiled. Install libpq, validate it, and point every later
      # step at the real directory (same layout as release.yml).
      - name: Install libpq (PostgreSQL client libraries)
        shell: pwsh
        run: |
          # The default Chocolatey V2 feed is intermittently unreachable on
          # windows-latest ("Unable to find package 'postgresql16'"), and a
          # transient failure used to abort the whole check. Try each known
          # feed explicitly (one per attempt, then both combined in a single
          # semicolon-separated --source) before treating this as fatal.
          $sourceSets = @(
            'https://community.chocolatey.org/api/v2/',
            'https://www.myget.org/F/chocolatey/api/v2/',
            'https://community.chocolatey.org/api/v2/;https://www.myget.org/F/chocolatey/api/v2/'
          )
          $installed = $false
          for ($attempt = 1; $attempt -le $sourceSets.Count; $attempt++) {
            $chocoArgs = @(
              'install', 'postgresql16',
              '--no-progress', '--limit-output', '-y',
              '--source', $sourceSets[$attempt - 1]
            )
            Write-Host "Installing postgresql16 (attempt $attempt of $($sourceSets.Count))"
            & choco @chocoArgs
            if ($LASTEXITCODE -eq 0) {
              $installed = $true
              break
            }
            Write-Host "::warning::postgresql16 install attempt $attempt failed with exit $LASTEXITCODE"
            if ($attempt -lt $sourceSets.Count) { Start-Sleep -Seconds 10 }
          }
          if (-not $installed) {
            throw "Chocolatey could not install postgresql16 after $($sourceSets.Count) attempts (feeds unreachable?)"
          }
          # The image may already carry another major version whose `lib` does
          # not ship libpq.dll, so pick a directory that really has the DLL
          # (older packages put it in lib\, newer ones in bin\) instead of the
          # highest-looking folder name.
          $candidates = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory |
            Where-Object {
              (Test-Path (Join-Path $_.FullName "lib\libpq.dll")) -or
              (Test-Path (Join-Path $_.FullName "bin\libpq.dll"))
            } |
            Sort-Object Name
          if (-not $candidates) {
            throw "No PostgreSQL installation provides libpq.dll (checked lib\ and bin\)"
          }
          $pg = $candidates[-1]
          "PQ_LIB_DIR=$(Join-Path $pg.FullName 'lib')" >> $env:GITHUB_ENV
          "$($pg.FullName)\bin" >> $env:GITHUB_PATH

      - name: Check the Windows agent/VM adapters
        run: cargo check --lib -p botagent -p botvibe

  # #2586 Phase A — make both mobile platforms visible on every pull request.
  # The two compile jobs are non-blocking only while `mobile`/`thin-client` are
  # empty stubs. `mobile-feature-guard` is the blocking reminder that flips them
  # to real features (Phase B removes the continue-on-error lines).
  mobile-feature-guard:
    name: Mobile feature flags are implemented (#2586)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Feature-stub guard (#2586)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import sys

          try:
              import tomllib
          except ImportError:  # Python < 3.11 fallback for mirrored runners.
              tomllib = None

          NAMES = ("mobile", "thin-client")
          MANIFEST = pathlib.Path("botapp/Cargo.toml")


          def empty(values):
              return sorted(name for name in NAMES if not values.get(name))


          def parse_without_tomllib(raw):
              """Read the [features] table, ignoring # comments (no cargo needed)."""
              features, section, pending, buffer = {}, None, None, ""
              for line in raw.splitlines():
                  code = line.split("#", 1)[0].strip()
                  if not code:
                      continue
                  if code.startswith("[") and code.endswith("]"):
                      section = code[1:-1].strip()
                      continue
                  if section != "features":
                      continue
                  if pending:
                      buffer += " " + code
                      if buffer.count("[") <= buffer.count("]"):
                          body = buffer[buffer.find("[") + 1:buffer.rfind("]")]
                          features[pending] = body.replace(",", " ").split()
                          pending = buffer = ""
                      continue
                  name, sep, value = code.partition("=")
                  name = name.strip()
                  if not sep or name not in NAMES:
                      continue
                  if "[" in value and "]" not in value:
                      pending, buffer = name, value
                  else:
                      features[name] = value.strip().strip("[]").replace(",", " ").split()
              return features


          # Self-test: an empty stub pair must fail, an implemented pair must pass.
          if empty({"mobile": [], "thin-client": []}) != list(NAMES):
              print("::error::guard self-test did not detect empty stubs")
              sys.exit(1)
          if empty({"mobile": ["tauri"], "thin-client": ["mobile"]}):
              print("::error::guard self-test rejected implemented features")
              sys.exit(1)

          raw = MANIFEST.read_text(encoding="utf-8")
          if tomllib is not None:
              parsed = tomllib.loads(raw).get("features", {})
              values = {name: parsed.get(name) for name in NAMES}
          else:
              values = parse_without_tomllib(raw)

          missing = empty(values)
          if missing:
              print(
                  f"::error::{MANIFEST} still declares empty mobile feature stubs: "
                  f"{', '.join(missing)} - implement them before Phase B"
              )
              sys.exit(1)
          print(f"{MANIFEST}: mobile and thin-client are real features")
          PY

  mobile-android-check:
    name: Android compile check (#2586, non-blocking Phase A)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    env:
      # Derived from setup-android's exported ANDROID_HOME, not a machine path.
      NDK_VERSION: "26.3.11579264"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install NDK and export SDK paths
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}"
          : "${JAVA_HOME:?setup-java did not export JAVA_HOME}"
          : "${ANDROID_HOME:?setup-android did not export ANDROID_HOME}"
          TOOLCHAIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android34-clang"
          {
            echo "JAVA_HOME=$JAVA_HOME"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
            echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android34-clang"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$TOOLCHAIN/x86_64-linux-android34-clang"
            echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android34-clang"
            echo "CC_x86_64_linux_android=$TOOLCHAIN/x86_64-linux-android34-clang"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
            echo "AR_x86_64_linux_android=$TOOLCHAIN/llvm-ar"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: mobile-android
          packages: build-essential clang mold pkg-config zstd libpq-dev libssl-dev liblzma-dev zlib1g-dev
      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
      # AGENTS.md: background check, log under /tmp, wait, tail, fail on non-zero.
      - name: cargo check (aarch64-linux-android)
        run: |
          set -uo pipefail
          LOG=/tmp/botapp_android_aarch64-linux-android_check.log
          CARGO_BUILD_JOBS=1 nohup cargo check -p botapp \
            --no-default-features --features mobile,thin-client,custom-protocol \
            --target aarch64-linux-android > "$LOG" 2>&1 &
          PID=$!
          set +e
          wait "$PID"
          STATUS=$?
          set -e
          tail -n 80 "$LOG"
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::Android aarch64 check failed (exit $STATUS); Phase A is non-blocking"
            exit "$STATUS"
          fi
      - name: cargo check (x86_64-linux-android)
        run: |
          set -uo pipefail
          LOG=/tmp/botapp_android_x86_64-linux-android_check.log
          CARGO_BUILD_JOBS=1 nohup cargo check -p botapp \
            --no-default-features --features mobile,thin-client,custom-protocol \
            --target x86_64-linux-android > "$LOG" 2>&1 &
          PID=$!
          set +e
          wait "$PID"
          STATUS=$?
          set -e
          tail -n 80 "$LOG"
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::Android x86_64 check failed (exit $STATUS); Phase A is non-blocking"
            exit "$STATUS"
          fi

  mobile-ios-check:
    name: iOS/iPhone compile check (#2586, non-blocking Phase A)
    runs-on: macos-15
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify the runner's Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: mobile-ios
      - name: Add iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Install CocoaPods
        run: |
          set -euo pipefail
          sudo gem install cocoapods --no-document
          pod --version
      - name: cargo check (aarch64-apple-ios)
        run: |
          set -uo pipefail
          LOG=/tmp/botapp_ios_aarch64-apple-ios_check.log
          CARGO_BUILD_JOBS=1 nohup cargo check -p botapp \
            --no-default-features --features mobile,thin-client,custom-protocol \
            --target aarch64-apple-ios > "$LOG" 2>&1 &
          PID=$!
          set +e
          wait "$PID"
          STATUS=$?
          set -e
          tail -n 80 "$LOG"
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::iOS device check failed (exit $STATUS); Phase A is non-blocking"
            exit "$STATUS"
          fi
      - name: cargo check (aarch64-apple-ios-sim)
        run: |
          set -uo pipefail
          LOG=/tmp/botapp_ios_aarch64-apple-ios-sim_check.log
          CARGO_BUILD_JOBS=1 nohup cargo check -p botapp \
            --no-default-features --features mobile,thin-client,custom-protocol \
            --target aarch64-apple-ios-sim > "$LOG" 2>&1 &
          PID=$!
          set +e
          wait "$PID"
          STATUS=$?
          set -e
          tail -n 80 "$LOG"
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::iOS simulator check failed (exit $STATUS); Phase A is non-blocking"
            exit "$STATUS"
          fi

  guard:
    name: Structural adequacy baseline
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The strict step needs the pull request's base commit.
          fetch-depth: 0
      - name: Check the baseline
        run: |
          set -euo pipefail
          python3 --version
          python3 scripts/adequacy_guard.py --baseline issues/adequacy/baseline.json
      # A PR that touches a directory with a known deviation must fix that
      # directory instead of adding to the repo-wide backlog. Only source files
      # select the directories, so a Cargo.toml edit does not flag its parent.
      - name: Check changed directories strictly
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          dirs=$(git diff --name-only "$BASE_SHA"...HEAD -- \
            '*.rs' '*.js' '*.html' '*.css' | xargs -r -n1 dirname | sort -u)
          args=()
          for dir in $dirs; do
            case "$dir" in
              .|scripts|issues|.github) continue ;;
            esac
            args+=(--strict "$dir")
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "no changed source directories"
            exit 0
          fi
          echo "strict directories: ${args[*]}"
          python3 scripts/adequacy_guard.py \
            --baseline issues/adequacy/baseline.json "${args[@]}"

      # #2074 — the offline unit suite is a gate, not a convention: every module
      # under `bottest/tests/unit/` must be registered, a skipped test must say
      # why, no file may cross 450 lines and no unit test may reach for a
      # service. Pure Python, fails in under a second with file:line.
      - name: Unit-suite policy guards (#2074)
        run: |
          set -euo pipefail
          python3 scripts/test_guards.py --check
          python3 scripts/test_guards.py --self-test

      # #2125 — no unverified JWT decoder and no payload-only identity read
      # outside the shared verifier. Pure Python, fails in under a second with
      # file:line; the allowlist is shrink-only.
      - name: JWT hardening guards (#2125)
        run: |
          set -euo pipefail
          python3 scripts/check_jwt_hardening.py --check
          python3 scripts/check_jwt_hardening.py --self-test

      # #2759 — no build may accept the hardcoded admin@localhost / "dev"
      # credential via BOTSERVER_DEV_MODE. Admin credential resolution must
      # verify a salted digest from admin-credentials.json only.
      - name: Dev-login backdoor guard (#2759)
        run: |
          set -euo pipefail
          python3 scripts/check_dev_login_backdoor.py --check
          python3 scripts/check_dev_login_backdoor.py --self-test

      # #2131 — every server-side fetch of a caller-supplied URL must go
      # through botsecurity_core::validation::fetch_user_url. The gate lists
      # each fetch site, fails on an unguarded variable URL and treats the
      # allowlist as shrink-only.
      - name: SSRF fetch-site guard (#2131)
        run: |
          set -euo pipefail
          python3 scripts/check_ssrf.py --check
          python3 scripts/check_ssrf.py --self-test

      # #2140 — exactly one SaaS JWT secret resolver, no public fallback in
      # production code, and every consumer (routes, settings, Vibe) calls the
      # shared one. A second copy is how a forgeable token got accepted.
      - name: Single JWT secret resolver (#2140)
        run: |
          set -euo pipefail
          python3 scripts/check_jwt_secret.py --check
          python3 scripts/check_jwt_secret.py --self-test
          python3 scripts/gate_selftests.py --gate jwt-secret

      # IMP-09 — the six security headers must reach every response of every
      # server, including error and static-file responses. The gate fails when
      # an `axum::serve` is mounted without the shared layer, when a
      # `configure_*_router` factory stops applying it, when the API layer stack
      # is no longer layered outermost, or when a header is dropped from the
      # shared applier. Pure Python, no network, no extra action to pin.
      - name: Security header guards (IMP-09)
        run: |
          set -euo pipefail
          python3 scripts/check_security_headers.py --check
          python3 scripts/check_security_headers.py --self-test

      # #2327 — a target="_blank" anchor without rel="noopener noreferrer"
      # hands the destination a live window.opener handle back to the suite
      # (reverse tabnabbing) and leaks the suite URL in Referer. The gate scans
      # static HTML and JS template strings alike, vendor excluded.
      - name: Reverse-tabnabbing guard (#2327)
        run: |
          set -euo pipefail
          python3 scripts/check_target_blank.py --self-test
          python3 scripts/check_target_blank.py --check

      # #2295 — native alert()/confirm()/prompt() are blocked in the desktop
      # webview and bypass the themed, accessible GBModal contract. The guard
      # keeps first-party UI on GBModal; the GB dialog systems themselves are
      # exempt. Self-test proves a synthetic native call is caught.
      - name: Native dialog guard (#2295)
        run: |
          set -euo pipefail
          python3 scripts/check_native_dialogs.py --self-test
          python3 scripts/check_native_dialogs.py --check

      # #2546 — the LLM/api catalog must not advertise endpoints that are not
      # mounted, param-style drift must fail, and NOT_IMPLEMENTED handlers are
      # excluded from the manifest with an owner. The guard self-test proves
      # each rule fires; the check fails on new drift (baseline is allow-listed).
      - name: Route contract guard (#2546)
        run: |
          set -euo pipefail
          python3 scripts/check_route_contract.py --self-test
          python3 scripts/check_route_contract.py

      # #2540 — /api/sales/* is tombstoned in favour of /api/crm/*. The guard
      # proves no first-party UI calls the retired prefix, every retired path
      # maps to a mounted CRM successor, and the tombstone surface only shrinks.
      - name: Sales route contract guard (#2540)
        run: |
          set -euo pipefail
          python3 scripts/check_sales_route_contract.py --self-test
          python3 scripts/check_sales_route_contract.py --check

      # #2935 — the ten /suite/settings/partials/*.html files must ship in the
      # tree, be requested by the Settings boot document without a query string,
      # and be reachable through the botui proxy -> botserver ServeDir chain in
      # the release packaging. A stale BOTUI_PATH is the documented root cause
      # of a source-vs-host 404; this offline source-chain guard makes that
      # contract blocking without a server, browser or cargo. The live half runs
      # in `static-precheck` below.
      - name: Settings partials route guard (#2935)
        run: python3 scripts/check_settings_partials_route.py

      # #2543 — error-handling ratchet: unwrap/expect/panic and swallowed
      # Results only move down. The self-test proves a raised count fails;
      # the check enforces the committed baseline over production Rust.
      # The integrity half compares the committed ceilings to the pre-change
      # revision: --update refuses raises only relative to the file it reads,
      # so hand-raising a number in that file used to pass silently.
      - name: Rust error-handling ratchet (#2543)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 scripts/check_rust_error_ratchet.py --self-test
          python3 scripts/check_rust_error_ratchet.py
          if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            python3 scripts/check_rust_error_ratchet.py --check-baseline-diff --base "$BASE_SHA"
          else
            echo "no usable base commit; skipping baseline history check"
          fi

      # #2333 — empty promise `.catch(...) {}` handlers discard rejections
      # with no log, UI feedback or recovery (the promise-shaped half of the
      # silent-failure epidemic). Best-effort suppressions must carry a comment
      # and debug log; mutating operations must report failure.
      - name: Empty promise catch guard (#2333)
        run: |
          set -euo pipefail
          python3 scripts/check_empty_promise_catches.py --self-test
          python3 scripts/check_empty_promise_catches.py --check

      # #2321 — the suite had 120 distinct z-index values from -10 to 2147483647,
      # so "the modal above its window, the toast above the modal" held by luck.
      # Every suite-wide layer must name a --z-* token from the one scale;
      # integers 1-99 stay legal for sibling order inside a single component.
      - name: Z-index scale guard (#2321)
        run: |
          set -euo pipefail
          python3 scripts/check_z_index_scale.py --self-test
          python3 scripts/check_z_index_scale.py --check

      # #2322 — the suite authored 2 821 px font-size literals (671 below 12px),
      # so type neither scaled with the user's zoom nor kept a rhythm. Every
      # suite font-size must name a rem-based --text-* token from the scale in
      # css/base/01_root.css; compact density may drop below the floor only
      # inside an explicit [data-density="compact"] block.
      - name: Type scale guard (#2322)
        run: |
          set -euo pipefail
          python3 scripts/check_type_scale.py --self-test
          python3 scripts/check_type_scale.py --check

      # #2323/#2324 — the design-system sweeps removed 99 !important rules and
      # ~1 280 raw hex literals from component CSS. The shrink-only budget
      # keeps that debt from creeping back: a new literal or a higher count in
      # any component file fails the gate; token-definition files are exempt.
      - name: CSS hygiene guard (#2323, #2324)
        run: |
          set -euo pipefail
          python3 scripts/check_css_hygiene.py --self-test
          python3 scripts/check_css_hygiene.py --check

      # #2310 — one corrupt localStorage key used to throw inside the desktop
      # boot chain and leave the user with no way to clear it. Every JSON read
      # must go through gbStoreGet(), which self-heals and logs the dropped key.
      - name: Tauri IPC hygiene guard (#2497)
        run: python3 scripts/check-tauri-ipc-hygiene.py

      - name: LocalStorage read guard (#2310)
        run: |
          set -euo pipefail
          python3 scripts/check_storage_reads.py --self-test
          python3 scripts/check_storage_reads.py --check

      # #2340 — deprecated web APIs. `document.write` and `String#substr` are
      # gone from the UI, and editing commands go through gbFormat() so the move
      # off execCommand is one implementation change. settings/index.html is
      # still exempt: its double bootstrap is #2332's subject.
      - name: Deprecated web API guard (#2340)
        run: |
          set -euo pipefail
          python3 scripts/check_deprecated_web_apis.py --self-test
          python3 scripts/check_deprecated_web_apis.py --check

      # IMP-08 / IMP-07 — the two directives AGENTS.md marks mandatory but
      # nothing verified. The gate greps the route registration surface and
      # fails when a state-changing handler is reachable without the CSRF
      # layer and without a shrink-only exemption entry, or when the
      # general/auth/api or WebSocket message limiters are not installed.
      # Pure Python, no network, no extra action to pin.
      - name: CSRF + rate-limit guards (IMP-08, IMP-07)
        run: |
          set -euo pipefail
          python3 scripts/check_security_directives.py --check
          python3 scripts/check_security_directives.py --self-test

      # #2673 / IMP-10 — crypto/security deps must use exact '=' versions;
      # Cargo.lock alone is not a substitute. Self-test proves the gate fails
      # on an unpinned security crate.
      - name: Dependency exact-pin guard (IMP-10)
        run: |
          set -euo pipefail
          python3 scripts/check_dependency_pins.py
          python3 scripts/check_dependency_pins.py --self-test

      # #2545 — the three app manifests must agree: every APPS_REGISTRY id is
      # classified in .product (apps/preview/hidden or core), every listed id
      # has a launcher tile, and every hxGet target exists. Prevents silent
      # drift between the window-manager registry and the shipped product.
      - name: App manifest consistency (#2545)
        run: |
          set -euo pipefail
          node scripts/check-app-manifest.mjs

      # #2103 — Cargo.toml is the single source of truth for the product
      # version. Every other version-bearing file must agree with it, and the
      # simulated-tag selftest proves `sync` writes the tag it is given.
      # #2118 — the same gate now covers the derived artifacts (botbook docs,
      # any package.json/tauri/.product that carries a version) and the
      # Conventional-Commits bump rules, so a drifting artifact fails CI
      # instead of reaching a release.
      - name: Version consistency (#2103, #2118)
        run: |
          set -euo pipefail
          python3 scripts/release_version.py --check
          python3 scripts/release_version.py selftest
          python3 scripts/next_version.py --check
          python3 scripts/next_version.py --self-test

      # #2126 — containers run on Incus only. `lxc`/`lxd` spawns and raw
      # `Command::new("incus")` calls fail here; pre-existing debt is a
      # shrink-only allowlist. Pure Python, fails in under a second.
      - name: "Guard: container runtime is Incus via SafeCommand (#2126)"
        run: |
          set -euo pipefail
          python3 scripts/check_container_runtime.py --self-test
          python3 scripts/check_container_runtime.py --check

      # #2132 — every upload entry point (Multipart or raw body) must call the
      # shared magic-byte/extension/size validator before persisting anything.
      # The allowlist is shrink-only: a stale entry fails the gate.
      - name: "Guard: upload validation on every upload handler (#2132)"
        run: |
          set -euo pipefail
          python3 scripts/check_upload_validation.py --self-test
          python3 scripts/check_upload_validation.py --check

      # #2674 — documentation must not commit real production IP literals.
      # The self-test proves the gate fails on an added literal (and accepts
      # the documented placeholder ranges); the scan then covers every tracked
      # *.md, including INFRA.md. Pure Python, no network, no extra action.
      - name: "Guard: no real IP literals in documentation (#2674)"
        run: |
          set -euo pipefail
          python3 scripts/check_doc_ips.py --self-test
          python3 scripts/check_doc_ips.py

      # #2459 — the four office metric hooks were once exported but never
      # called, so /metrics silently showed no samples. This gate fails when a
      # hook loses its definition or its last production call site, when the
      # canonical scrape router stops being merged, or when either read-only
      # RBAC GET permission disappears. Pure Python, no network.
      - name: "Guard: office metric wiring and scrape route (#2459)"
        run: |
          set -euo pipefail
          if [ ! -f scripts/check_metrics_wiring.py ]; then
            echo "scripts/check_metrics_wiring.py is missing" >&2
            exit 1
          fi
          python3 scripts/check_metrics_wiring.py

      # #2448 criterion 6 — parity guard: every office toolbar data-verb /
      # dotted data-action must map to a cmd() verb in the chat catalog. The
      # self-test proves rename/removal/vacuity cases fail closed. The live
      # scan currently finds NO data-verb mapping: the 16 data-action values
      # in docs/modules/31_lang_panels_*.js are unqualified UI actions, so the
      # guard exits 1 with that exact GAP list. Non-blocking until the toolbars
      # are annotated with catalog verbs; remove continue-on-error once green.
      - name: "Guard: office toolbar action -> catalog verb parity (#2448)"
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/check_office_toolbar_parity.py --self-test
          python3 scripts/check_office_toolbar_parity.py

      # #2459 — real, PR-blocking budget gate for the office performance
      # budgets. The boot-graph half is the strict check_boot_budget.py ratchet
      # already wired in the `check` job (kept there to avoid a duplicate scan);
      # this step closes the other half. check_office_memory.py --check is the
      # strict declaration gate. The inline wrapper invokes the checker's own
      # validate_config()/evaluate_snapshot() functions: it fails the PR if a
      # declared RSS ceiling is loosened (shrink-only ratchet) or if the checker
      # ever stops rejecting an over-ceiling snapshot. No RSS number is
      # fabricated as PASS: the 4 GB soak stays UNVERIFIED until a measured
      # snapshot is supplied by the hardware job (#2530/#2531).
      - name: "Guard: office budget gate — memory ceilings (#2459/#2530)"
        run: |
          set -euo pipefail
          python3 scripts/check_office_memory.py --check
          python3 -c '
          import sys
          sys.path.insert(0, "scripts")
          import check_office_memory as m
          config = m.load_config()
          problems = m.validate_config(config)
          if problems:
              print("invalid office memory declaration:", file=sys.stderr)
              for problem in problems:
                  print(f"  {problem}", file=sys.stderr)
              sys.exit(1)
          RATCHET = {"docs-large": 900, "sheets-large": 1200, "slides-large": 1100}
          raised = []
          for case, ceiling in config["rss_ceilings_mb"].items():
              expected = RATCHET.get(case)
              if expected is None or float(ceiling) > float(expected):
                  raised.append(f"{case}: {expected} -> {ceiling} MB")
          if raised:
              print("office memory ceiling(s) loosened:", file=sys.stderr)
              for item in raised:
                  print(f"  {item}", file=sys.stderr)
              sys.exit(1)
          over = {"cases": {case: {
              "peak_rss_mb": float(ceiling) + 1,
              "baseline_rss_mb": 600.0,
              "return_rss_mb": 620.0,
              "cycles": int(config["soak"]["cycles"]),
              "session_cache_growth_mb": 0.0,
              "events_with_content": 0,
          } for case, ceiling in config["rss_ceilings_mb"].items()}}
          if m.evaluate_snapshot(config, over)["ok"]:
              print("evaluate_snapshot accepted an over-ceiling snapshot", file=sys.stderr)
              sys.exit(1)
          n = len(config["rss_ceilings_mb"])
          print(f"office memory: {n} ceilings ratcheted; over-ceiling detection OK")
          '

      # #2459/#2463 — machine-readable Office performance budgets and the
      # interop conversion-report validator. Self-tests prove both gates fail
      # closed on a regression (non-vacuous), and the budget config is schema
      # checked on every PR. A CI perf report is evaluated when one is uploaded
      # to bottest/tools/perf/reports/latest.json; until the hardware job
      # produces it, only config/self-tests run and no measurement is claimed.
      - name: "Guard: office perf budgets and interop report (#2459/#2463)"
        run: |
          set -euo pipefail
          python3 bottest/tools/perf/check_perf_budgets.py --validate-config
          python3 bottest/tools/perf/check_perf_budgets.py --self-test
          python3 bottest/tools/interop/interop.py --self-test
          if [ -f bottest/tools/perf/reports/latest.json ]; then
            python3 bottest/tools/perf/check_perf_budgets.py \
              --report bottest/tools/perf/reports/latest.json
          else
            echo "no perf report uploaded; config + self-tests only (no measurement claimed)"
          fi

      # Office static audits (enterprise surface, interop paths, large-file
      # readiness) are read-only and non-vacuous. Running them together makes
      # the source-level half of the Office acceptance criteria continuously
      # observable in the PR check. They explicitly claim no browser/hardware
      # PASS; the measured halves stay attached to #2435/#2459/#2531.
      - name: "Guard: office static evidence audits (#2476/#2463/#2534)"
        run: |
          set -euo pipefail
          python3 scripts/check_office_enterprise_audit.py
          python3 scripts/check_office_interop_audit.py
          python3 scripts/check_office_scale_audit.py

      # #2481 — the OS image must keep Mesa/VA-API packages and the software
      # (swrast/GBM) fallback for WebKit. The guard's self-test covers its own
      # parsing; this step runs it against the shipped image recipe.
      - name: "Guard: graphics driver recipe and software fallback (#2481)"
        run: |
          set -euo pipefail
          python3 scripts/check_graphics_support.py --self-test
          python3 scripts/check_graphics_support.py --check

  # #2543 — the three error-handling lints stay `warn` in Cargo.toml because
  # workspace lints cannot express a per-file baseline exclusion. This is the
  # equivalent blocking gate: clippy emits JSON diagnostics, the script keeps
  # only non-test files under botserver/src and botserver/crates, and fails when
  # a count grows against botserver/clippy-baseline.toml [clippy]. botapp and
  # botdevice are excluded (they need Tauri/webkit system libs and are out of
  # the ratchet scope); plain clippy targets are lib + bin, so #[cfg(test)]
  # modules are not compiled and cannot trip the gate.
  clippy-baseline:
    name: Clippy error-handling baseline (#2543)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: clippy-baseline
      # The lints are advisory (`warn`) in [workspace.lints.clippy], so clippy
      # exits 0 and the script — not rustc — decides pass/fail by comparing
      # counts to the baseline. A genuine compile error still fails the step.
      - name: Enforce the clippy diagnostic baseline
        run: |
          set -euo pipefail
          cargo clippy --workspace --exclude botapp --exclude botdevice \
            --message-format=json > /tmp/clippy-baseline.json 2>/tmp/clippy-baseline.err
          python3 scripts/check_clippy_baseline.py /tmp/clippy-baseline.json

  reindex:
    name: Verify the committed BotBook
    needs: [changes]
    if: ${{ github.server_url == 'https://github.com' && needs.changes.outputs.botbook == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install mdBook
        # #2001 self-review: this was the only unverified download left in CI.
        # Pin the digest so a compromised upstream asset (or a changed tag
        # target) fails closed instead of installing as root.
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            -o /tmp/mdbook.tar.gz \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  /tmp/mdbook.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/mdbook.tar.gz -C /tmp
          install -m 0755 /tmp/mdbook /usr/local/bin/mdbook
          mdbook --version
      - name: BotBook guards (#2082)
        # SUMMARY/link/version/port guards. Pre-existing debt is recorded in
        # botbook/guards-allowlist.txt, which may only shrink.
        run: |
          set -euo pipefail
          python3 scripts/botbook_guards.py --check
          python3 scripts/botbook_guards.py --self-test
      - name: Generated catalogs (#2080)
        # Connector and skills catalogs are derived from code; a stale page
        # means someone edited the generated output instead of the source.
        run: |
          set -euo pipefail
          python3 scripts/gen_catalogs.py --report
          python3 scripts/gen_catalogs.py --check
      - name: Rebuild and compare
        run: |
          set -euo pipefail
          chmod +x scripts/botbook_reindex.sh
          ./scripts/botbook_reindex.sh

  migrate:
    name: Fresh-database migration run
    needs: [changes]
    if: ${{ github.server_url == 'https://github.com' && needs.changes.outputs.migrations == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gb
          POSTGRES_PASSWORD: gb
          POSTGRES_DB: botserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gb -d botserver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://gb:gb@127.0.0.1:5432/botserver
      PGPASSWORD: gb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Cache diesel CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/diesel
          key: diesel-cli-2.3.14-${{ runner.os }}
      - name: Install diesel CLI
        run: |
          if [ ! -x "$HOME/.cargo/bin/diesel" ]; then
            cargo install diesel_cli --version 2.3.14 --locked \
              --no-default-features --features postgres
          fi
          diesel --version
      - name: Apply every migration to an empty database
        working-directory: botserver
        run: diesel migration run
      - name: Assert the 6.8.x schema and the goal_runs instruction
        run: |
          set -euo pipefail
          for table in \
            goal_runs \
            chat_preferences \
            run_events \
            conversation_autotasks \
            subagent_runs \
            group_budgets \
            terminal_audit \
            user_llm_accounts; do
            found="$(psql -h 127.0.0.1 -U gb -d botserver -tAc \
              "select to_regclass('public.$table')")"
            if [ -z "$found" ] || [ "$found" = "NULL" ]; then
              echo "::error::missing table $table after migrations"
              exit 1
            fi
            echo "ok $table"
          done
          instruction="$(psql -h 127.0.0.1 -U gb -d botserver -tAc \
            "select 1 from information_schema.columns where table_name='goal_runs' and column_name='instruction'")"
          if [ "$instruction" != "1" ]; then
            echo "::error::goal_runs.instruction was not added"
            exit 1
          fi
          locked="$(psql -h 127.0.0.1 -U gb -d botserver -tAc \
            "select 1 from information_schema.columns where table_name='user_sessions' and column_name='locked'")"
          if [ "$locked" != "1" ]; then
            echo "::error::user_sessions.locked was not added"
            exit 1
          fi
          echo "6.8.x schema verified"

  # #2117 — migrations, tenant isolation and the restore drill used to be three
  # separate properties with three different fixtures. This job proves all three
  # on one deterministic production-like dataset against a throwaway PostgreSQL:
  # every migration applied from scratch, the resulting schema equal to what
  # `botschema` declares, every scoped read confined to its own org/branch/bot,
  # and a pg_dump/pg_restore round-trip that keeps row counts and per-tenant
  # checksums. INTEGRITY_STRICT=1 turns every skip into a failure, so a missing
  # tool cannot masquerade as a pass.
  data-integrity:
    name: Data integrity (migrate + tenancy + restore)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gb
          POSTGRES_PASSWORD: gb
          POSTGRES_DB: botserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gb -d botserver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://gb:gb@127.0.0.1:5432/botserver
      PGPASSWORD: gb
      INTEGRITY_STRICT: "1"
      INTEGRITY_DATASET: /tmp/gb-integrity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # postgresql-client is what the suite shells out to for psql/pg_dump and
      # pg_restore; without it the drill would skip.
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: data-integrity
          packages: clang mold libpq-dev libssl-dev liblzma-dev pkg-config postgresql-client
      - name: Cache diesel CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/diesel
          key: diesel-cli-2.3.14-${{ runner.os }}
      - name: Install diesel CLI
        run: |
          if [ ! -x "$HOME/.cargo/bin/diesel" ]; then
            cargo install diesel_cli --version 2.3.14 --locked \
              --no-default-features --features postgres
          fi
          diesel --version
      - name: Apply every migration to an empty database
        working-directory: botserver
        run: diesel migration run
      - name: Generate the production-like dataset (deterministic, seed 2117)
        run: python3 scripts/gen_integrity_dataset.py --out "$INTEGRITY_DATASET" --report
      - name: Load the dataset
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$INTEGRITY_DATASET/integrity_dataset.sql"
          loaded="$(psql "$DATABASE_URL" -tAc "select count(*) from organizations where slug like 'integrity-%'")"
          if [ "$loaded" != "3" ]; then
            echo "::error::expected 3 integrity orgs after the dataset load, found $loaded"
            exit 1
          fi
          echo "dataset loaded: $loaded orgs"
      - name: Migrations, schema, tenancy and restore drill
        run: |
          cargo test -p bottest --features integration --test integration data_integrity \
            -- --nocapture --test-threads=1
      # #2117 — the suite above proves the properties from Rust; this step proves
      # the operator-facing drill works on the same loaded dataset: `pg_dump -Fc`
      # of the source, `pg_restore` into a throwaway `gb_restore_drill_<pid>`,
      # then per-table row counts against the source manifest and one generated
      # cross-tenant probe per scoped column (each must return zero rows). The
      # throwaway database is dropped afterwards; --self-test first proves the
      # assertions fail on a short table and on a cross-tenant row, offline.
      - name: Restore drill (#2117) — dump, restore, counts, tenancy
        run: |
          set -euo pipefail
          python3 scripts/restore_drill_checks.py --self-test
          scripts/restore_drill.sh --self-test
          scripts/restore_drill.sh --dsn "$DATABASE_URL" --report /tmp/gb-restore-drill.md
          cat /tmp/gb-restore-drill.md

  check:
    name: Verify product profiles
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check always/preview/hidden classification, matrix and budget
        run: |
          set -euo pipefail
          python3 --version
          python3 scripts/product_profile_check.py
          python3 scripts/app_complexity_budget.py

      # #2119 — an app is not shipped until it is documented. For every id in
      # `botserver/src/apps/registry/*.rs` this static check requires a product
      # classification, a `/suite/...` smoke surface and a contract entry in
      # `issues/app-contracts/apps.toml` (routes that really exist in the
      # sources, or `no_api` with a reason and an issue). No cargo, no server:
      # it fails a new app that nobody documented, in under a second.
      - name: App contracts (#2119)
        run: |
          set -euo pipefail
          python3 scripts/smoke_app_surfaces.py --self-test
          python3 scripts/smoke_app_surfaces.py --contracts

      # #2119 — coverage can only move up. The self-test proves the ratchet
      # fails on a decrease; the per-crate `unit-coverage` jobs then enforce it
      # against `issues/coverage/baseline.json`.
      - name: Coverage ratchet self-test (#2119)
        run: python3 scripts/check_coverage.py --self-test

      # #2421 — the viewport matrix is a browser gate, but its argument parsing
      # and compact JSON shape must stay checkable offline. No CDP, no browser.
      - name: Viewport checker self-test (#2421)
        run: python3 scripts/check_viewports.py --self-test

      # #2421 — the mobile-budget ratchet is shrink-only; prove that a raised
      # count fails and that its baseline file parses, without a browser.
      - name: Mobile budget ratchet self-test (#2421)
        run: |
          python3 scripts/check_mobile_budget.py --self-test
          python3 scripts/check_mobile_budget.py --check

      # #2495 — the boot graph has no stated, enforced budget. This count-only
      # ratchet measures blocking scripts/stylesheets/bytes per suite surface
      # and only lets the ceilings fall; Lighthouse timing stays a browser gate.
      - name: Boot budget ratchet (#2495)
        run: |
          python3 scripts/check_boot_budget.py --self-test
          python3 scripts/check_boot_budget.py

      # #2335 — the suite UI characterization guards are blocking, not
      # advisory: a new hardcoded literal, i18n/aria regression or route
      # explosion fails this job on any PR touching the suite.
      - name: Suite UI standards guards (#2335)
        run: |
          set -euo pipefail
          python3 scripts/check_app_transport.py --self-test
          python3 scripts/check_app_transport.py
          python3 botui/ui/suite/audit/app-404-smoke.py --self-test
          python3 scripts/check_suite_js_size.py
          node botui/ui/suite/tests/webtest-ui-bootbudget.js
          node botui/ui/suite/tests/webtest-sanitize-xss.js
          node botui/ui/suite/tests/webtest-ui-aria.js
          node botui/ui/suite/tests/webtest-route-contract.js
          node botui/ui/suite/tests/webtest-ui-mobile-office.js

      # #2457 — Office fidelity gate. The harness scores the docx/pptx/xlsx
      # corpus and prints a per-app fidelity matrix on every PR. It exits
      # non-zero on any FAIL (a regression in a previously passing corpus file)
      # but tolerates deliberately documented DEGRADED results. No server,
      # browser or cargo: the shipped export/preview IIFEs run in a Node vm.
      - name: "Guard: Office fidelity score and corpus regression (#2457)"
        run: |
          set -euo pipefail
          node botui/ui/suite/tests/webtest-office-fidelity.js

      # #2457 — Office search (#2505) and office translation (#2511) offline
      # harnesses currently run only ad-hoc. Wire both into every PR: they
      # execute the shipped suite modules in a Node vm with stubbed browser
      # globals — no server, browser or cargo — and fail on any regression.
      - name: "Guard: Office search and translation static harnesses (#2457)"
        run: |
          set -euo pipefail
          node botui/ui/suite/tests/webtest-office-search.js
          node botui/ui/suite/tests/webtest-office-translate.js

      # #2531 — large-document degradation harnesses were only run ad-hoc.
      # Both are offline Node suites over the shipped suite modules, so a
      # regression in the docs/office GAP matrix fails the PR.
      - name: "Guard: large-document degradation suites (#2531)"
        run: |
          set -euo pipefail
          node botui/ui/suite/tests/webtest-docs-large.js
          node botui/ui/suite/tests/webtest-office-large.js

      # #2470 — data-protection safety guards (pre-restore snapshot + path
      # validation) must not regress silently. Static source audit + bash -n;
      # no destructive commands run in CI.
      - name: "Guard: Data-protection restore safety (#2470)"
        run: |
          set -euo pipefail
          node botui/ui/suite/tests/webtest-data-protection.js
          node botui/ui/suite/tests/webtest-os-data-protection-ui.js

      # #2441 — the offline payload manifest must stay consistent with
      # 3rdparty.toml (filenames + checksums) and carry no network URL/secret.
      - name: "Guard: Offline payload manifest (#2441)"
        run: |
          set -euo pipefail
          node botui/ui/suite/tests/webtest-offline-payload.js

      # #2440/#2441/#2470/#2471/#2478 — the OS-shell static audits were only
      # run ad-hoc. Each one asserts its hard guarantees with file:line evidence
      # and prints honest GAP lines for hardware/runtime work it cannot prove.
      # They fail the PR when a guarantee regresses, but never fabricate a
      # real-image, firmware or laptop PASS. No browser, VM or cargo here.
      - name: "Guard: OS appliance static audits (#2440/#2441/#2470/#2471/#2478)"
        run: |
          set -euo pipefail
          python3 scripts/check_os_verifier_audit.py
          python3 scripts/check_offline_first_boot_audit.py
          python3 scripts/check_data_protection_audit.py
          python3 scripts/check_laptop_gate_audit.py
          python3 scripts/check_secure_boot_audit.py

      # #2119 — flake policy. The committed registry must be complete and
      # inside its 14-day SLA on every PR. The history scan needs CI logs, so it
      # is a documented manual/nightly run:
      #   gh run list --workflow ci.yml --limit 20 --json databaseId \
      #     --jq '.[].databaseId' | while read id; do
      #       gh run view "$id" --log > "/tmp/flakes/$id.log"; done
      #   python3 scripts/flake_report.py --logs /tmp/flakes
      - name: Flake policy (#2119)
        run: |
          set -euo pipefail
          python3 scripts/flake_report.py --self-test
          python3 scripts/flake_report.py --quarantine-only

  # #2121 — one gate over every readiness check. The table, the JSON and the
  # BotBook scoreboard all come from `scripts/prod_readiness.py`, so a check that
  # is missing shows up as SKIP with its issue instead of disappearing, and a
  # check that regresses fails here. The job also fails when the committed
  # scoreboard no longer matches the gate output (regenerate it, never hand-edit).
  prod-readiness:
    name: Production readiness gate (#2121)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run every readiness check and verify the scoreboard
        run: |
          set -euo pipefail
          python3 --version
          python3 scripts/prod_readiness.py --check-markdown

  static-precheck:
    name: Lighthouse static pre-check
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Serve the static desktop markup
        run: |
          set -euo pipefail
          # The auth gate is a runtime script: without its /api endpoints it
          # fail-closes and redirects to login. The static pre-check therefore
          # removes only that script from a throwaway copy and overrides the
          # boot-time visibility:hidden gate; the served-desktop job below
          # audits the real gate against botserver.
          rm -rf /tmp/a11y-static
          cp -a botui/ui /tmp/a11y-static
          # The auth gate was split into 04_auth_fullscreen_a.js + _b.js
          # (#2305); match both halves (and the old single name) or the removal
          # silently no-ops and the audit redirects to login.
          sed -i -E 's#<script src="/suite/desktop-inline/04_auth_fullscreen(_a|_b)?\.js"></script> *##g' \
            /tmp/a11y-static/suite/desktop.html
          sed -i 's#</head>#<style>html.gb-auth-gate body > * { visibility: visible !important; } html.gb-auth-gate::after { display: none !important; }</style></head>#' \
            /tmp/a11y-static/suite/desktop.html
          # Keep the server alive across the steps below: record its PID so the
          # final step can stop it even when an audit fails. No new server is
          # started here — this is the same static suite origin as before.
          nohup python3 -m http.server 3000 --directory /tmp/a11y-static >/tmp/suite-http.log 2>&1 &
          echo $! > /tmp/suite-http.pid
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:3000/suite/desktop.html >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/suite/desktop.html >/dev/null || {
            echo "suite did not start"; tail -20 /tmp/suite-http.log; exit 1;
          }
      - name: Audit the static desktop markup
        run: |
          node .github/scripts/a11y_perf_gate.mjs \
            http://127.0.0.1:3000/suite/desktop.html --require-desktop
      # #2935 — with the suite already served at port 3000, assert all ten
      # Settings partial URLs return 200 text/html (not 404) through the real
      # static suite tree. This is the live half of the offline source-chain
      # guard wired into `guard` above.
      - name: "Guard: Settings partials are served live (#2935)"
        run: python3 scripts/check_settings_partials_route.py --base-url http://127.0.0.1:3000
      - name: Stop the static server
        if: always()
        run: |
          if [ -f /tmp/suite-http.pid ]; then
            kill "$(cat /tmp/suite-http.pid)" 2>/dev/null || true
          fi

  served-desktop:
    name: Lighthouse served desktop (botserver desktop-local)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gb
          POSTGRES_PASSWORD: gb
          POSTGRES_DB: botserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gb -d botserver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      DATABASE_URL: postgres://gb:gb@127.0.0.1:5432/botserver
      CACHE_URL: redis://127.0.0.1:6379
      # Treat Vault as remote so bootstrap does not try to provision the local
      # desktop stack (Vault/PostgreSQL/MinIO/Zitadel) inside the runner.
      VAULT_ADDR: https://vault.a11y.invalid:8200
      BOTSERVER_DISABLE_TLS: "1"
      # Smoke jobs have no Vault/CSRF secret: use the dev posture so the
      # fail-closed production CSRF gate does not block boot (#2141).
      BOTSERVER_ENV: development
      # Keep ensure_templates_repo() from cloning the public templates repo on
      # every audit run; the failure is already non-blocking.
      BOT_TEMPLATES_REPO: https://example.invalid/templates.git
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: served-desktop
          packages: build-essential clang mold pkg-config zstd libpq-dev libssl-dev liblzma-dev zlib1g-dev
      - name: Build botserver (desktop-local)
        run: cargo build -p botserver --no-default-features --features desktop-local
      - name: Start botserver with the desktop-local audit profile
        env:
          BOTSERVER_STACK_PATH: ${{ runner.temp }}/gbstack
        run: |
          set -euo pipefail
          mkdir -p "$BOTSERVER_STACK_PATH/conf/system"
          # Test-only product override: the checked-in desktop product requires
          # the wizard administrator, but this job must audit the shell
          # anonymously. Copy it to the repo root (the first path ProductConfig
          # reads for a desktop-local build) and flip no_security for the
          # throwaway audit process only — never commit this copy.
          cp botserver/.product.desktop-local .product.desktop-local
          sed -i 's/^no_security=false/no_security=true/' .product.desktop-local
          # Audit-only: the client auth gate runs before the product check and
          # redirects to /suite/login.html when its fetch races the page boot.
          # Remove it from the checked-out copy so Lighthouse audits the real
          # botserver-served shell; /api/product is still asserted above and the
          # login page itself is audited separately below. The gate was split
          # into 04_auth_fullscreen_a.js + _b.js (#2305), so match both halves
          # (and the old single name) or the removal silently no-ops.
          sed -i -E 's#<script src="/suite/desktop-inline/04_auth_fullscreen(_a|_b)?\.js"></script> *##g' \
            botui/ui/suite/desktop.html
          sed -i 's#</head>#<style>html.gb-auth-gate body > * { visibility: visible !important; } html.gb-auth-gate::after { display: none !important; }</style></head>#' \
            botui/ui/suite/desktop.html
          # Optional Zitadel bootstrap: point at an unused loopback port so the
          # 24 retries fail fast and boot continues (health is what matters).
          cat > "$BOTSERVER_STACK_PATH/conf/system/directory_config.json" <<'JSON'
          {"issuer_url":"http://127.0.0.1:1","issuer":"http://127.0.0.1:1","client_id":"a11y","client_secret":"a11y","redirect_uri":"/callback","project_id":"default","api_url":"http://127.0.0.1:1","allow_insecure_http":true}
          JSON
          nohup ./target/debug/botserver --noconsole > /tmp/botserver-a11y.log 2>&1 &
          echo $! > /tmp/botserver-a11y.pid
          for _ in $(seq 1 300); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/health; then break; fi
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:8080/health || {
            echo "botserver did not become healthy"; tail -200 /tmp/botserver-a11y.log; exit 1;
          }
          curl -sf http://127.0.0.1:8080/api/product | grep -q '"no_security":true' || {
            echo "the audit profile did not load (no_security=true missing)"; exit 1;
          }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/suite/desktop.html)" = "200"
      - name: Audit the botserver-served desktop page
        run: |
          node .github/scripts/a11y_perf_gate.mjs \
            http://127.0.0.1:8080/suite/desktop.html --require-desktop
      - name: Audit the login page (the redirect target)
        run: |
          node .github/scripts/a11y_perf_gate.mjs \
            http://127.0.0.1:8080/suite/login.html --require-desktop
      - name: Upload botserver log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-botserver-log
          path: /tmp/botserver-a11y.log
          if-no-files-found: ignore
      - name: Stop botserver
        if: always()
        run: |
          if [ -f /tmp/botserver-a11y.pid ]; then
            kill "$(cat /tmp/botserver-a11y.pid)" 2>/dev/null || true
          fi

  app-surfaces:
    # #2101 — the build shipped apps nothing proved were reachable. This job
    # compiles the default binary and the desktop-local bundle that the
    # installers ship, boots the desktop-local server and asks every app
    # surface the registry advertises for a page: a blank app (#2100) now
    # fails here instead of in a user's browser.
    #
    # The surface list is derived from the code, not maintained by hand:
    # `scripts/smoke_app_surfaces.py` reads every `url:` in
    # `botserver/src/apps/registry/*.rs`, adds the desktop shell, walks every
    # `botui/ui/cloud|login/*.html` page and requires `/api/apps/catalog` to
    # list each registry id with `compiled: true`. A new app is covered the
    # moment it enters the registry.
    name: App surface smoke (desktop-local)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gb
          POSTGRES_PASSWORD: gb
          POSTGRES_DB: botserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gb -d botserver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      DATABASE_URL: postgres://gb:gb@127.0.0.1:5432/botserver
      CACHE_URL: redis://127.0.0.1:6379
      # Same remote-Vault trick as `served-desktop`: no local stack bootstrap.
      VAULT_ADDR: https://vault.smoke.invalid:8200
      BOTSERVER_DISABLE_TLS: "1"
      # Smoke jobs have no Vault/CSRF secret: use the dev posture so the
      # fail-closed production CSRF gate does not block boot (#2141).
      BOTSERVER_ENV: development
      BOT_TEMPLATES_REPO: https://example.invalid/templates.git
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: app-surfaces
          packages: build-essential clang mold pkg-config zstd libpq-dev libssl-dev liblzma-dev zlib1g-dev
      # (a) the default binary is the `all-apps` profile: compiling it proves
      # every registry app's crate is reachable from the default feature set.
      - name: Build botserver (default = all-apps)
        run: cargo build -p botserver
      # (a) the profile the installers ship. Same target path, so this binary
      # is the one the smoke step probes.
      - name: Build botserver (desktop-local)
        run: cargo build -p botserver --no-default-features --features desktop-local
      - name: Start botserver with the desktop-local product
        env:
          BOTSERVER_STACK_PATH: ${{ runner.temp }}/gbstack
        run: |
          set -euo pipefail
          mkdir -p "$BOTSERVER_STACK_PATH/conf/system"
          # Test-only override, never committed: the checked-in desktop product
          # requires the wizard administrator, but this job probes the app
          # surfaces anonymously. Copy it to the repo root (the first path
          # ProductConfig reads for a desktop-local build) and flip
          # no_security so the auth gate cannot turn an app page into a login
          # redirect, which would hide a broken app behind a 200.
          cp botserver/.product.desktop-local .product.desktop-local
          sed -i 's/^no_security=false/no_security=true/' .product.desktop-local
          # Point Zitadel at an unused loopback port so its bootstrap retries
          # fail fast and boot continues; health is what this job needs.
          cat > "$BOTSERVER_STACK_PATH/conf/system/directory_config.json" <<'JSON'
          {"issuer_url":"http://127.0.0.1:1","issuer":"http://127.0.0.1:1","client_id":"smoke","client_secret":"smoke","redirect_uri":"/callback","project_id":"default","api_url":"http://127.0.0.1:1","allow_insecure_http":true}
          JSON
          nohup ./target/debug/botserver --noconsole > /tmp/botserver-smoke.log 2>&1 &
          echo $! > /tmp/botserver-smoke.pid
          for _ in $(seq 1 300); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/health; then break; fi
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:8080/health || {
            echo "botserver did not become healthy"; tail -200 /tmp/botserver-smoke.log; exit 1;
          }
          curl -sf http://127.0.0.1:8080/api/product | grep -q '"no_security":true' || {
            echo "the smoke profile did not load (no_security=true missing)"; exit 1;
          }
      # Cloud and login pages belong to botui (ports 4000/5000); botserver
      # never serves complete cloud pages, so they are probed on a static
      # server over the same checkout the installers package.
      - name: Start the static botui server (cloud + login)
        run: |
          set -euo pipefail
          nohup python3 -m http.server 3100 --directory botui/ui \
            > /tmp/botui-static.log 2>&1 &
          echo $! > /tmp/botui-static.pid
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3100/cloud/index.html; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:3100/cloud/index.html || {
            echo "static botui server did not start"; tail -20 /tmp/botui-static.log; exit 1;
          }
      # (b)+(c) every surface answers 200 with a non-empty HTML body; the run
      # stops at the first surface that does not respond.
      - name: Smoke every shipped app surface
        run: |
          set -euo pipefail
          python3 scripts/smoke_app_surfaces.py \
            --suite-base http://127.0.0.1:8080 \
            --static-base http://127.0.0.1:3100 \
            --catalog http://127.0.0.1:8080/api/apps/catalog
      - name: Upload botserver log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-surfaces-botserver-log
          path: /tmp/botserver-smoke.log
          if-no-files-found: ignore
      - name: Stop botserver and the static server
        if: always()
        run: |
          for pid_file in /tmp/botserver-smoke.pid /tmp/botui-static.pid; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done

  suite-app-console-smoke:
    # Creates a throwaway cloud account through the real signup API, signs the
    # Suite desktop in with its JWT, opens every available app in a real
    # browser and FAILS on the first console error/warning or 404. The account
    # and every row it created are destroyed in the cleanup step, even when
    # the smoke fails. No shared test account and no CI secret are involved.
    name: Suite app console smoke (throwaway CI account)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gb
          POSTGRES_PASSWORD: gb
          POSTGRES_DB: botserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gb -d botserver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      DATABASE_URL: postgres://gb:gb@127.0.0.1:5432/botserver
      CACHE_URL: redis://127.0.0.1:6379
      VAULT_ADDR: https://vault.smoke.invalid:8200
      BOTSERVER_DISABLE_TLS: "1"
      BOTSERVER_ENV: development
      SAAS_DISABLE_CAPACITY_CHECK: "1"
      BOT_TEMPLATES_REPO: https://example.invalid/templates.git
      GB_API_BASE: http://127.0.0.1:8080
      GB_MOCK_ZITADEL_URL: http://127.0.0.1:8099
      GB_ACCOUNT_FILE: /tmp/gb-smoke-account.json
      # Blocking chat computer-use UAT: real terminal consent flow against a
      # CI-only Incus test double (GitHub-hosted runners have no Incus daemon).
      GB_CI_INCUS_ROOT: ${{ runner.temp }}/gb-ci-incus-root
      GB_VM_PROFILE: base
      # Free Kilo endpoint, no key. state_builder only falls back to a local
      # LLM for z.ai/openai.com/anthropic.com URLs without a key, so this URL
      # is used as-is; the terminal proposal itself bypasses the LLM.
      LLM_URL: https://api.kilo.ai/api/gateway/chat/completions
      LLM_MODEL: dots-studio/dots-3-note-preview:free
      LLM_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: suite-console-smoke
          packages: build-essential clang mold pkg-config zstd libpq-dev libssl-dev liblzma-dev zlib1g-dev
      - name: Set up Playwright client
        run: |
          python3 -m venv /tmp/gbvenv
          /tmp/gbvenv/bin/pip install --quiet playwright
      - name: Build botserver and botui
        run: |
          cargo build -p botserver
          cargo build -p botui
      # CI-ONLY TEST DOUBLE. The runner has no Incus; `botagent` shells out to
      # `incus`, so a tiny shim is installed on PATH before botserver starts.
      # It is never copied into an artifact, image or package.
      - name: Install the CI-only Incus test double on PATH
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/incus-stub-bin"
          cp scripts/ci-incus-stub.sh "$RUNNER_TEMP/incus-stub-bin/incus"
          chmod +x "$RUNNER_TEMP/incus-stub-bin/incus"
          echo "$RUNNER_TEMP/incus-stub-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/incus-stub-bin:$PATH"
          bash -n scripts/ci-incus-stub.sh
          "$RUNNER_TEMP/incus-stub-bin/incus" self-test
          command -v incus
          mkdir -p "$GB_CI_INCUS_ROOT/opt/vibe/app/data" \
            "$GB_CI_INCUS_ROOT/opt/vibe/app/output"
      - name: Start the mock identity provider
        run: |
          nohup python3 scripts/ci-mock-zitadel.py > /tmp/mock-zitadel.log 2>&1 &
          echo $! > /tmp/mock-zitadel.pid
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8099/health; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8099/health
      - name: Start botserver with the CI directory profile
        env:
          BOTSERVER_STACK_PATH: ${{ runner.temp }}/gbstack
        run: |
          set -euo pipefail
          mkdir -p "$BOTSERVER_STACK_PATH/conf/system" "$BOTSERVER_STACK_PATH/conf/directory"
          cat > "$BOTSERVER_STACK_PATH/conf/system/directory_config.json" <<'JSON'
          {"base_url":"http://127.0.0.1:8099","saas_base_url":"http://127.0.0.1:8080","service_token":"ci-smoke-token","allow_insecure_http":true,"mc_path":"/tmp/mc"}
          JSON
          printf '%s' 'ci-smoke-token' > "$BOTSERVER_STACK_PATH/conf/directory/admin-pat.txt"
          nohup ./target/debug/botserver --noconsole > /tmp/botserver-smoke.log 2>&1 &
          echo $! > /tmp/botserver-smoke.pid
          for _ in $(seq 1 300); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/health; then break; fi
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:8080/health
      - name: Start botui (suite on port 3000)
        run: |
          nohup ./target/debug/botui > /tmp/botui-smoke.log 2>&1 &
          echo $! > /tmp/botui-smoke.pid
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:3000/
      - name: Start headless Chrome with CDP
        run: |
          nohup google-chrome --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9222 --remote-allow-origins='*' \
            --user-data-dir="$RUNNER_TEMP/chrome-smoke" about:blank \
            > /tmp/chrome-smoke.log 2>&1 &
          echo $! > /tmp/chrome-smoke.pid
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:9222/json/version; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:9222/json/version
      - name: Create the throwaway account
        run: python3 scripts/ci-suite-account.py create
      - name: Smoke every app; fail on the first console error or warning
        run: |
          set -euo pipefail
          BOT=$(/tmp/gbvenv/bin/python -c 'import json;print(json.load(open("/tmp/gb-smoke-account.json"))["bot_name"])')
          GB_TEST_TOKEN=$(/tmp/gbvenv/bin/python -c 'import json;print(json.load(open("/tmp/gb-smoke-account.json"))["token"])')
          export GB_TEST_TOKEN
          /tmp/gbvenv/bin/python botui/ui/suite/audit/app-404-smoke.py \
            --cdp http://127.0.0.1:9222 --base http://localhost:3000 --bot "$BOT" \
            --wait 1 --report /tmp/opencode/app-404-smoke-report.json
      # BLOCKING: one chat turn uploads the PDF and proposes a terminal action,
      # the consent card is approved, and the harness asserts the document was
      # really created from the uploaded bytes. Any FAIL exits non-zero.
      - name: Chat VM PDF UAT (blocking, Incus test double)
        run: |
          set -euo pipefail
          BOT=$(/tmp/gbvenv/bin/python -c 'import json;print(json.load(open("/tmp/gb-smoke-account.json"))["bot_name"])')
          GB_TEST_TOKEN=$(/tmp/gbvenv/bin/python -c 'import json;print(json.load(open("/tmp/gb-smoke-account.json"))["token"])')
          export GB_TEST_TOKEN
          /tmp/gbvenv/bin/python botui/ui/suite/tests/chat-vm-pdf-uat.py --self-test
          /tmp/gbvenv/bin/python botui/ui/suite/tests/chat-vm-pdf-uat.py \
            --cdp http://127.0.0.1:9222 --base http://localhost:3000 --bot "$BOT" \
            --pdf botui/ui/suite/tests/fixtures/sample-upload.pdf \
            --report /tmp/opencode/chat-vm-pdf-uat-report.json
      - name: Destroy the throwaway account
        if: always()
        run: python3 scripts/ci-suite-account.py cleanup
      - name: Upload smoke report and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: suite-app-console-smoke
          path: |
            /tmp/opencode/app-404-smoke-report.json
            /tmp/opencode/chat-vm-pdf-uat-report.json
            /tmp/opencode/uat-vm-pdf-*.png
            /tmp/botserver-smoke.log
            /tmp/botui-smoke.log
            /tmp/chrome-smoke.log
            /tmp/mock-zitadel.log
          if-no-files-found: ignore
      - name: Stop CI processes
        if: always()
        run: |
          for pid_file in /tmp/mock-zitadel.pid /tmp/botserver-smoke.pid /tmp/botui-smoke.pid /tmp/chrome-smoke.pid; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done

  evaluate:
    # Boteval makes paid model calls; run it on pull requests (the merge gate)
    # and on manual dispatches, not again on every push to main.
    if: ${{ github.server_url == 'https://github.com' && github.event_name != 'push' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Quoted: a plain YAML scalar cannot contain ": " — the unquoted forms
      # made this file invalid, so GitHub rejected the whole workflow with
      # "workflow file issue" and every run died in 0s.
      # The desktop-local layout cleanup removed several guard scripts from the
      # tree while this workflow kept calling them, so every push died with
      # "No such file or directory". Run each guard when it is present and
      # warn (instead of failing) when the tree no longer ships it.
      - name: "Guard: no hx-get on POST-only fragment routes (#1139)"
        run: |
          if [ -x ./scripts/check-hx-fragments.sh ]; then
            ./scripts/check-hx-fragments.sh
          else
            echo "::warning::scripts/check-hx-fragments.sh is not in the tree - guard skipped"
          fi

      - name: "Guard: no pre-merge repository URLs (#1473)"
        run: |
          if [ -x ./scripts/check-repo-urls.sh ]; then
            ./scripts/check-repo-urls.sh
          else
            echo "::warning::scripts/check-repo-urls.sh is not in the tree - guard skipped"
          fi

      # #1520 — `table!` declarations live only in the `botschema` crate. The
      # guard enforces the checked-in baseline so the count of non-canonical
      # declarations can only fall, never rise. Pure Python, no cargo: fails in
      # seconds with the offending file:line.
      - name: "Guard: no new table! outside botschema (#1520)"
        run: |
          if [ -f ./scripts/schema_guard.py ] && [ -f ./issues/schema/table_baseline.json ]; then
            python3 scripts/schema_guard.py
          else
            echo "::warning::schema guard or baseline is not in the tree - guard skipped"
          fi

      # #1525 — artifacts must be regenerated, never hand-edited. The drift
      # inventory runs from the tree alone (no database needed).
      - name: "Guard: schema drift artifacts are current (#1525)"
        run: |
          if [ -f ./scripts/schema_drift_inventory.py ] && [ -f ./issues/schema/schema_drift.md ]; then
            python3 scripts/schema_drift_inventory.py
            git diff --exit-code -- issues/schema/schema_drift.md
          else
            echo "::warning::schema drift inventory or artifact is not in the tree - guard skipped"
          fi

      # .cargo/config.toml links every target with `-fuse-ld=/usr/bin/mold`, so
      # the runner must provide mold (and clang) or the very first build-script
      # link dies with "clang: error: invalid linker name". libpq/libssl/liblzma
      # are what the workspace's native dependencies (diesel/pq-sys,
      # openssl-sys) compile against.
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: evaluate

      - name: Build boteval-run
        run: cargo build -p boteval --features http,vibe

      - name: Validate dataset artifact is deterministic
        run: |
          cargo run -p boteval --features http,vibe --bin boteval-run -- --dump-dataset > /tmp/vibe-200.dump.json
          if ! diff -q /tmp/vibe-200.dump.json botserver/crates/boteval/datasets/vibe-200.json; then
            echo "::error::committed datasets/vibe-200.json is stale — regenerate with: boteval-run --dump-dataset"
            exit 1
          fi

      # The 38 offline tests (contracts, scoring, gate, fixtures, replay) had
      # no CI caller at all: the old workflow only exercised botserver's unit
      # tests. Run them here so a broken gate fails before the paid call.
      - name: Unit tests (contracts, scoring, gate, frames)
        run: cargo test -p boteval --features http,vibe

      - name: Run evaluation gate (Kilo Gateway or custom endpoint)
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          KILO_MODEL: ${{ vars.KILO_MODEL || 'nvidia/nemotron-3.5-super-vl:free' }}
          BOTEVAL_ENDPOINT: ${{ secrets.BOTEVAL_ENDPOINT }}
          BOTEVAL_API_KEY: ${{ secrets.BOTEVAL_API_KEY }}
          BOTEVAL_MODEL: ${{ vars.BOTEVAL_MODEL || 'gpt-oss-120b' }}
        run: |
          # Kilo Gateway (https://ai-gateway.kilo.ai/api/v1) is the default
          # provider because its `:free` models cost nothing. A custom
          # OpenAI-compatible endpoint remains the fallback so an existing
          # BOTEVAL_* setup keeps working unchanged.
          #
          # A key is required for the full 210-entry run: anonymous access is
          # capped at 200 requests/hour/IP, which is below the benchmark size.
          #
          # #817 made a missing credential a HARD failure so the gate could
          # never be silently skipped. On a repository with no credentials
          # that turned every push to main red for a reason no code change can
          # fix. Maintainer decision: unconfigured = advisory. The step warns
          # loudly and skips; the moment a credential exists the gate runs
          # again and blocks exactly as before (a failing score still fails
          # the job).
          if [ -n "$KILO_API_KEY" ]; then
            ENDPOINT="https://ai-gateway.kilo.ai/api/v1/chat/completions"
            KEY="$KILO_API_KEY"
            MODEL="$KILO_MODEL"
          elif [ -n "$BOTEVAL_ENDPOINT" ]; then
            ENDPOINT="$BOTEVAL_ENDPOINT"
            KEY="$BOTEVAL_API_KEY"
            MODEL="$BOTEVAL_MODEL"
          else
            echo "::warning::Neither KILO_API_KEY nor BOTEVAL_ENDPOINT is configured — skipping the evaluation gate. Set KILO_API_KEY to re-enable this merge block (#817)."
            exit 0
          fi
          cargo run -p boteval --features http,vibe --bin boteval-run -- \
            --gate botserver/crates/boteval/ci/gate.toml \
            --dataset botserver/crates/boteval/datasets/vibe-200.json \
            --endpoint "$ENDPOINT" \
            --api-key "$KEY" \
            --model "$MODEL"

  # #1512 — botserver is a BINARY crate: its unit tests only build with
  # `--bin botserver`. `cargo test -p botserver --lib` fails with "no library
  # targets found" and silently tests nothing, which is how four stale
  # expectations accumulated unnoticed. This job is the regression guard.
  unit-tests:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: unit-tests

      - name: Run botserver route contract tests (#2546)
        run: cargo test -p botserver --bin botserver route_contract

      - name: Run botserver unit tests
        run: cargo test -p botserver --bin botserver

  # #2074 — the binary job above only runs botserver's tests. Every other
  # crate's unit tests were never invoked, so a regression in a library shipped
  # green. This matrix runs the crates that have offline tests; `bottest` runs
  # the cross-crate unit module.
  workspace-tests:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        crate:
          - botlib
          - botschema
          - botlog
          - botbasic_types
          - botproducts
          # #2540 — the retired /api/sales shims live in botcontacts/botsales;
          # their unit tests must run in CI, not just compile.
          - botcontacts
          - botsales
          # #2389 — IANA/DST timezone helpers and their transition tests live
          # in botsettings; the matrix must actually run them.
          - botsettings
          - botsecurity-auth
          - botdocs
          - botslides
          # Office document ownership (#2137): the owner-scoping tests live in
          # the crate, so the matrix must run botpaper's unit tests.
          - botpaper
          - botsheet
          - botdrive
          - botchannels
          # Inbound channel webhooks: each crate owns the unit tests for its
          # authenticity gate (#2113, #2142), so the gate must actually run them.
          - botwhatsapp
          - botmsteams
          - bottelegram
          - botinstagram
          - botagent
          - botsources
          - botintegrations
          - botbasic_comms
          - boterp
          - botvision
          - botanalytics
          - botapi
          - botui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: workspace-tests
      - name: Unit tests (${{ matrix.crate }})
        run: cargo test -p ${{ matrix.crate }} --lib

  # #2497 — the desktop shell's file commands and IPC origin ACL are a security
  # boundary. The integration tests need Tauri's Linux system libraries, which
  # the plain workspace-tests runner does not install; run them in a dedicated
  # job so a regression in canonicalisation/CSP/remote origins fails the build.
  botapp-security:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: botapp-security
          packages: build-essential clang mold pkg-config zstd libpq-dev libssl-dev liblzma-dev zlib1g-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Desktop shell security regression tests (#2497)
        run: cargo test -p botapp --test desktop_ipc_security

  bottest-unit:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: bottest-unit
      - name: Cross-crate unit tests
        run: cargo test -p bottest --test unit
      # #2119 — the stable half of the fuzzing program. The `fuzz/` targets need
      # nightly + libfuzzer (see `fuzz-nightly`), so every PR drives the same
      # four parsers (JWT/claims, WhatsApp webhooks, BASIC transforms, office
      # import) through a deterministic mutation corpus here. A minimized crash
      # from the nightly run is added to the seed slices in this file.
      - name: Property fallback for the fuzz targets (#2119)
        run: cargo test -p bottest --test fuzz_regressions
      # #2522 — the hostile-file corpus is built in memory and every case must
      # be refused by the shared gate; the Docs/Sheets boundaries must also
      # reject the same malicious payloads (macro packages are stripped with a
      # notice instead of admitted untouched). No case may reach a parser.
      - name: Malicious-file corpus fails closed (#2522)
        run: |
          set -euo pipefail
          cargo test -p botdocs --lib hostile_
          cargo test -p botsheet --lib hostile_
      - name: In-process SLO budgets (#2115)
        # The budgets live in ops/slo.yaml (profile `hotpath`); the Rust test
        # fails fast with the measured number and emits target/slo/hotpath.json,
        # which the checker then validates against the ratified targets.
        run: |
          set -euo pipefail
          cargo test -p bottest --test slo_budget_test
          python3 scripts/check_slo.py --profile hotpath --snapshot target/slo/hotpath.json

  # #2602 — a real ClamAV scan on a hostile-file upload. Deliberately has NO
  # `github.server_url` guard: this gate must run on every host that executes
  # this workflow (GitHub Actions or the Forgejo/ALM mirror). No boteval calls.
  malware-clamav:
    name: Real ClamAV upload gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: malware-clamav
      - name: Install ClamAV and signatures
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --version
      - name: Prove clamscan detects EICAR (all artifacts under /tmp only)
        run: |
          set -euo pipefail
          printf '%s' "$(cat <<'EICAR'
          X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*
          EICAR
          )" > /tmp/gb-eicar.txt
          set +e
          clamscan --no-summary --infected /tmp/gb-eicar.txt | tee /tmp/gb-clamscan-eicar.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          grep -q 'Eicar-Test-Signature FOUND' /tmp/gb-clamscan-eicar.log
          rm -f /tmp/gb-eicar.txt /tmp/gb-clamscan-eicar.log
      - name: ClamAV upload gate (real handler, typed MalwareDetected verdict)
        run: |
          set -euo pipefail
          cargo test -p botsecurity-core --lib -- --ignored clamav_upload_gate_detects_eicar_and_accepts_clean_file --nocapture
          cargo test -p botsecurity-core --lib antivirus::byte_scan
      - name: Hostile-file corpus for Docs, Sheets and Slides
        run: |
          set -euo pipefail
          cargo test -p botdocs --lib hostile_corpus
          cargo test -p botsheet --lib hostile_import_tests
          cargo test -p botslides --lib hostile_corpus
      - name: Both CI hosts carry the identical, ungated malware gate
        run: python3 scripts/check_malware_clamav_gates.py

  # #2115 — performance budgets. The numbers live in `ops/slo.yaml`, the table
  # in `botbook/src/11-hardware-scaling/slo.md`; this job proves the gate fails
  # closed and that the committed baseline still satisfies every budget. It runs
  # no cargo and calls no provider, so it is cheap enough for every pull request.
  slo:
    name: SLO budgets
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Checker self-test (must fail closed)
        run: python3 scripts/check_slo.py --self-test
      # #2530 — the Office large-file corpus is synthetic-only and byte-for-byte
      # deterministic; the gate validates it plus the declared RSS ceilings.
      # The 4 GB cgroup soak needs a measured --snapshot, so runtime criteria are
      # reported UNVERIFIED here rather than fabricated as PASS.
      - name: "Guard: Office large-file corpus and memory ceilings (#2530)"
        run: |
          set -euo pipefail
          python3 scripts/office_largefile_corpus.py --self-test
          python3 scripts/check_office_memory.py --self-test
          python3 scripts/check_office_memory.py --check
      # #2531 — the load-stress harness validates its own logic offline and emits
      # an explicit SKIP here (a shared runner has no server or writable cgroup).
      # On a hardware job a measured report is supplied to --gate, which then
      # fails closed on ceilings, cgroup limits, soak drift and 10% regressions.
      - name: "Guard: Office large-file load-stress harness (#2531)"
        run: |
          set -euo pipefail
          python3 bottest/tools/officestress/os_measure.py --self-test
          python3 bottest/tools/officestress/os_measure.py --run \
            --report /tmp/opencode/officestress-measure/report.json
          python3 bottest/tools/officestress/os_measure.py --gate \
            --report /tmp/opencode/officestress-measure/report.json
      - name: Committed baseline satisfies every budget
        run: |
          set -euo pipefail
          python3 scripts/check_slo.py --snapshot perf/baselines/local-mock.json --json \
            > /tmp/slo-report.json
          python3 -c 'import json; report = json.load(open("/tmp/slo-report.json")); print("checked", report["checked"], "SLOs, breaches", len(report["breaches"]))'
      - name: k6 summary converts into a checkable snapshot
        # Proves the load pipeline (k6 -> adapter -> gate) without running k6:
        # the summary shape is the one `--summary-export` writes.
        run: |
          set -euo pipefail
          python3 -c 'import json; json.dump({"metrics": {"http_req_duration": {"values": {"p(50)": 70, "p(95)": 210, "p(99)": 480}}, "http_req_failed": {"values": {"rate": 0.003}}}}, open("/tmp/k6-summary.json", "w"))'
          python3 scripts/load/k6_to_snapshot.py --summary /tmp/k6-summary.json \
            --out /tmp/slo-api.json --class api
          python3 scripts/check_slo.py --snapshot /tmp/slo-api.json --class api
      - name: Upload the SLO report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slo-report
          path: /tmp/slo-report.json
          if-no-files-found: warn

  # #2074 — coverage measurement. The crate matrix is generated from
  # `coverage-exclusions.toml`, so adding or dropping a measured crate is a
  # one-line TOML change instead of a workflow edit.
  coverage-plan:
    name: Coverage plan
    # Fork pull requests never run the coverage jobs: they upload artifacts and
    # spend runner minutes without a trustworthy report.
    if: ${{ github.server_url == 'https://github.com' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crates: ${{ steps.plan.outputs.crates }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the per-crate floors
        id: plan
        run: |
          set -euo pipefail
          python3 scripts/check_coverage.py --self-test
          python3 scripts/check_coverage.py --list-crates >> "$GITHUB_OUTPUT"

  # One crate per matrix entry: `cargo llvm-cov --workspace` exceeds the memory
  # budget, and a per-crate run keeps each job inside it (issue #2074).
  unit-coverage:
    name: Unit coverage (${{ matrix.crate }})
    needs: [coverage-plan]
    if: ${{ github.server_url == 'https://github.com' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.coverage-plan.outputs.crates) }}
    env:
      # Memory-budget exception (#2074): one crate per matrix entry already
      # keeps each job small, but the coverage graph still needs 1 job to stay
      # inside the runner. The project default is 6 (.cargo/config.toml).
      CARGO_BUILD_JOBS: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: unit-coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-llvm-cov
      - name: Install llvm-tools
        # cargo-llvm-cov drives llvm-profdata/llvm-cov from this component; the
        # install action only provides the cargo subcommand.
        run: rustup component add llvm-tools-preview
      - name: Measure ${{ matrix.crate }}
        run: |
          set -euo pipefail
          mkdir -p coverage
          # `--no-report` collects the profile data once; the two explicit
          # reports below then read the same run, so the lcov artifact and the
          # JSON the floor gate consumes can never disagree.
          cargo llvm-cov -p "${{ matrix.crate }}" --lib --no-report
          cargo llvm-cov report --lcov \
            --output-path "coverage/${{ matrix.crate }}.lcov"
          cargo llvm-cov report --json \
            --output-path "coverage/${{ matrix.crate }}.json"
      - name: Enforce the floor and the ratchet (${{ matrix.crate }})
        run: |
          set -euo pipefail
          # #2119 — the floor is a constant, the baseline is the promise: this
          # fails when the crate measures below `issues/coverage/baseline.json`
          # even while still above its floor. Raise it deliberately with
          # `--record-baseline` in the PR that adds the tests.
          python3 scripts/check_coverage.py \
            --crate "${{ matrix.crate }}" \
            --json "coverage/${{ matrix.crate }}.json" \
            --baseline issues/coverage/baseline.json
      - name: Upload the lcov report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.crate }}
          path: coverage/${{ matrix.crate }}.lcov
          if-no-files-found: warn

  # #1811 — the manifest reports only the features the command line requested.
  # This keeps the old feature-unification guard (a slim build must not inherit
  # `botcore/default` through a workspace dependency).
  feature-manifest:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: feature-manifest

      - name: Manifest reports only requested features
        run: cargo test -p botcore --no-default-features --features desktop-local,chat,drive manifest_reports_only_requested_features


  # Desktop builds are triggered by release.yml (on tag) and manual dispatch;
  # ci.yml only runs the lightweight gates.

  # #2119 — deep fuzzing. The stable property fallback (`bottest-unit`) covers
  # every PR; this job is the libfuzzer run that finds *new* crashes, so it runs
  # nightly and on demand only. Targets live in `fuzz/fuzz_targets/`:
  #   jwt_claims     JWT + claims JSON decode (unauthenticated auth surface)
  #   webhook_body   WhatsApp JSON / Twilio form bodies and signature headers
  #   basic_compile  BASIC preprocessor + IF/THEN + GOTO + LLM unquote
  #   office_import  XLSX/XLS/ODS/CSV import at the binary boundary
  # A minimized crash is committed to the matching seed slice in
  # `bottest/tests/fuzz_regressions.rs` and to `fuzz/corpus/<target>/`, which is
  # how the regression runs on stable from then on.
  fuzz-nightly:
    name: Fuzz (${{ matrix.target }})
    if: ${{ github.server_url == 'https://github.com' && (github.event_name == 'schedule' || github.event.inputs.force_nightly == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [jwt_claims, webhook_body, basic_compile, office_import]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # libfuzzer needs a nightly toolchain; `fuzz/` is detached from the
      # workspace, so this never affects the stable build of the repo.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-fuzz
      - name: Run ${{ matrix.target }} for 90 s
        run: |
          set -euo pipefail
          # taiki-e/install-action ships a musl-linked cargo-fuzz, whose
          # default target is x86_64-unknown-linux-musl. ASan is incompatible
          # with statically linked libc there and musl std is not installed by
          # dtolnay/rust-toolchain. Pin the host GNU target explicitly.
          # `--rss_limit_mb` turns an allocation blow-up into a finding instead
          # of an OOM kill; `-max_total_time` keeps the job inside its budget.
          cargo fuzz run --target x86_64-unknown-linux-gnu "${{ matrix.target }}" -- \
            -max_total_time=90 -rss_limit_mb=4096 -print_final_stats=1
      - name: Upload any crash artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

  # #2119 — the flake history scan. Pulls the last 20 runs of this workflow and
  # fails when a test flipped often enough to require quarantine and has no
  # entry in `issues/flakes/quarantine.toml`. Nightly because it reads history,
  # not because the policy is optional: the registry itself is checked on every
  # PR by the `check` job.
  flake-history:
    name: Flake history
    if: ${{ github.server_url == 'https://github.com' && (github.event_name == 'schedule' || github.event.inputs.force_nightly == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Collect the last 20 completed main-branch runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          # `gh run view --log` downloads every job's log and GitHub refuses the
          # request on 69-job nightly runs ("too many API requests"). Read the
          # job/step conclusions from the Actions API instead: one request per
          # run, no log archives. Exclude cancelled runs: cancelling marks
          # in-flight steps as failures and manufactures fake flakes. This run
          # is still in progress so it is filtered out automatically.
          gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&per_page=100" \
            --jq '[.workflow_runs[]
                   | select(.status == "completed"
                            and (.conclusion == "success" or .conclusion == "failure"))
                   | .id][0:20] | .[]' | while read -r id; do
            gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
              --jq '{id: .jobs[0].run_id,
                     jobs: [.jobs[] | {name,
                       steps: [.steps[] | {name, conclusion}]}]}' \
              > "$tmpdir/$id.json"
          done
          count=$(find "$tmpdir" -type f -name '*.json' | wc -l)
          echo "collected $count completed main-branch runs"
          if [ "$count" -eq 0 ]; then
            echo "::error::no completed main-branch runs to analyze"
            exit 1
          fi
          jq -s '{workflow_runs: .}' "$tmpdir"/*.json > /tmp/flakes_runs.json
      - name: Detect flaky steps and enforce the policy
        run: python3 scripts/flake_report.py --runs /tmp/flakes_runs.json --window 20
