name: Desktop binaries

# Builds the desktop edition on GitHub-hosted runners and attaches it to a
# GitHub Release ("release folder"). Manual runs need a tag; pushing a v* tag
# runs it automatically. Public repository: runner minutes are free.
#
# Release assets:
#   linux:   generalbots-<tag>-linux-x86_64.tar.gz  (installer: binaries,
#            suite, launcher, per-user install.sh) + SHA256SUMS-linux
#   windows: generalbots-x64.exe (best effort)
#
# The Linux tarball is what a user downloads and runs (#1633). It ships no
# service archives: the first-run wizard fetches them, so the download stays
# small. An offline bundle (app + installers/) is built locally with the same
# layout by dropping the component archives into installers/ before the run.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v6.7.0). Created if missing."
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux binaries
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang mold pkg-config zstd \
            libpq-dev libssl-dev liblzma-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-

      - name: Build botserver (desktop-local)
        run: cargo build -p botserver --release --no-default-features --features desktop-local

      - name: Build botui
        run: cargo build -p botui --release

      - name: Build desktop shell
        run: cargo build -p botapp --release --features desktop-local,custom-protocol

      - name: Fetch vendored drive binaries
        run: |
          set -euo pipefail
          # MinIO archived the OSS server/client and removed the binaries from
          # dl.min.io (HTTP 410). The last working Linux build is vendored in a
          # release and pinned by checksum, so a first run always has a drive.
          # Replace with a maintained S3 server when the drive component moves.
          mkdir -p dist/installers
          BASE="https://github.com/generalbots/generalbots/releases/download/drive-bin-v2"
          curl -fsSL -o dist/installers/minio "$BASE/minio"
          curl -fsSL -o dist/installers/mc "$BASE/mc"
          curl -fsSL -o dist/installers/SHA256SUMS-drive-bin "$BASE/SHA256SUMS-drive-bin"
          (cd dist/installers && sha256sum -c SHA256SUMS-drive-bin)
          chmod +x dist/installers/minio dist/installers/mc

      - name: Fetch the BotModels pythonbox
        run: |
          set -euo pipefail
          # BotModels ships as a self-contained pythonbox (relocatable CPython +
          # service sources). Carrying it in installers/ means the desktop
          # edition provisions the AI media service without a network round
          # trip; its virtual environment still resolves on first use.
          TAG=$(git ls-remote --tags --refs https://github.com/generalbots/generalbots.git 'pythonbox-*' \
            | awk '{print $2}' | sed 's#refs/tags/##' | sort | tail -n 1)
          if [ -z "$TAG" ]; then
            echo "::warning::no pythonbox release found; the installer ships without BotModels"
            exit 0
          fi
          mkdir -p dist/installers
          curl -fsSL -o dist/installers/botmodels-pythonbox-linux-x86_64.tar.gz \
            "https://github.com/generalbots/generalbots/releases/download/${TAG}/botmodels-pythonbox-linux-x86_64.tar.gz"
          echo "bundled ${TAG} ($(du -h dist/installers/botmodels-pythonbox-linux-x86_64.tar.gz | cut -f1))"

      - name: Assemble Linux installer
        run: |
          set -euo pipefail
          chmod +x desktop/linux/package.sh
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ./desktop/linux/package.sh "$TAG" target/release dist dist/installers
          # package.sh writes both the versioned tarball and the tag-free copy
          # used by .../releases/latest/download/generalbots-linux-x86_64.tar.gz.
          # Raw binaries stay attached so a single component can be inspected
          # without unpacking the suite.
          cp target/release/botapp    dist/generalbots-linux-x86_64
          cp target/release/botserver dist/botserver-linux-x86_64
          chmod +x dist/generalbots-linux-x86_64 dist/botserver-linux-x86_64
          (cd dist && sha256sum generalbots-linux-x86_64 botserver-linux-x86_64 >> SHA256SUMS-linux)
          ls -lh dist

      # #1633 — one self-extracting executable: the app with the stack
      # appended as [payload.tar.zst][magic+offset+length+sha256].
      - name: Build self-extracting binary
        run: |
          set -euo pipefail
          rm -rf dist/payload
          mkdir -p dist/payload/bin dist/payload/ui
          cp target/release/botserver dist/payload/botserver
          cp -a botui/ui/suite  dist/payload/ui/suite
          cp -a botui/ui/themes dist/payload/ui/themes
          cp botserver/.product.desktop-local dist/payload/
          if [ -d dist/installers ]; then
            cp -a dist/installers/. dist/payload/installers/
          fi
          python3 scripts/build-self-extractor.py \
            --app target/release/botapp \
            --payload dist/payload \
            --out dist/generalbots
          chmod +x dist/generalbots
          (cd dist && sha256sum generalbots >> SHA256SUMS-linux)
          # Offline inspection works without a display:
          ./dist/generalbots --version
          ./dist/generalbots --verify

      # A published installer is only as good as its first run. This unpacks the
      # tarball built above on a clean runner, installs it, provisions the stack
      # over the network and waits for the suite — the same sequence a user runs,
      # with the optional 1 GB local model replaced by an external provider.
      - name: First-run smoke test of the installer
        timeout-minutes: 30
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="generalbots-${TAG}-linux-x86_64"
          WORK="$RUNNER_TEMP/first-run"
          rm -rf "$WORK"
          mkdir -p "$WORK/home"
          tar -xzf "dist/${PKG}.tar.gz" -C "$WORK"

          export HOME="$WORK/home"
          # No model override: "local" is the wizard default, so the smoke must
          # exercise exactly that path (1 GB model + llama.cpp startup).

          cd "$WORK/$PKG"
          # Same entry point a user runs, but without a display.
          ./start.sh --provision | tee "$WORK/provision.log"
          grep -q '"id":"components".*"state":"ready"' "$WORK/provision.log" \
            || { echo "provisioning did not reach the ready state"; exit 1; }
          if grep -q '"state":"failed"' "$WORK/provision.log"; then
            echo "a component failed"; exit 1
          fi
          # The default wizard choice is the local model; it must be running,
          # not silently skipped.
          grep -q '"id":"llm".*"state":"ready"' "$WORK/provision.log" \
            || { echo "the local model runtime did not become ready"; exit 1; }
          if grep -q '"id":"llm".*Skipped' "$WORK/provision.log"; then
            echo "the local model runtime was skipped"; exit 1
          fi
          curl -fsS -o /dev/null http://127.0.0.1:8081/health \
            || { echo "llama.cpp is not answering on 8081"; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:8082/health \
            || { echo "the embedding server is not answering on 8082"; exit 1; }

          # What the wizard's finish step writes once the user is done.
          STACK="$HOME/.local/share/generalbots/stack"
          printf '{"completed_at":"ci","desktop_local":true}\n' > "$STACK/.initialized"

          # The suite window cannot be driven headless, so start the sidecar it
          # would start and assert the API and the page it serves.
          BOTSERVER_STACK_PATH="$STACK" \
          BOTSERVER_INSTALLERS_PATH="$HOME/.local/share/generalbots/installers" \
          BOTUI_PATH="$PWD/ui/suite" \
            nohup "$PWD/botserver" --noconsole > "$WORK/botserver.log" 2>&1 &
          BOTSERVER_PID=$!
          for _ in $(seq 1 180); do
            if curl -fs -o /dev/null http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/api/product | tee "$WORK/product.json"
          grep -q '"chat"' "$WORK/product.json" || { echo "chat is not advertised"; exit 1; }
          grep -q '"drive"' "$WORK/product.json" || { echo "drive is not advertised"; exit 1; }
          test "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/suite/desktop.html)" = "200"
          grep -q "Successfully uploaded to S3" "$WORK/botserver.log" \
            || { echo "the drive never accepted an upload"; exit 1; }

          kill "$BOTSERVER_PID" 2>/dev/null || true
          echo "first run is green"

      - name: Upload first-run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-run-logs
          path: |
            ${{ runner.temp }}/first-run/provision.log
            ${{ runner.temp }}/first-run/botserver.log
            ${{ runner.temp }}/first-run/home/.local/share/generalbots/stack/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows binaries
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    timeout-minutes: 150
    # Kept non-blocking while the Windows toolchain image is validated: a
    # Windows runner failure must not hide the Linux binaries from the release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client libraries (libpq)
        shell: pwsh
        run: |
          choco install postgresql16 --no-progress -y
          $pg = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory |
            Sort-Object Name | Select-Object -Last 1
          if (-not $pg) { throw "PostgreSQL install directory not found" }
          "PQ_LIB_DIR=$($pg.FullName)\lib" >> $env:GITHUB_ENV
          "$($pg.FullName)\bin" >> $env:GITHUB_PATH

      - name: Install Rust
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-

      - name: Build botserver (desktop-local)
        run: cargo build -p botserver --release --no-default-features --features desktop-local

      - name: Build botui
        run: cargo build -p botui --release

      - name: Build desktop shell
        run: cargo build -p botapp --release --features desktop-local,custom-protocol

      - name: Assemble release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/botapp.exe    dist/generalbots-x64.exe
          Copy-Item target/release/botserver.exe dist/botserver-x64.exe
          Copy-Item target/release/botui.exe     dist/botui-x64.exe
          Get-FileHash dist/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } |
            Out-File dist/SHA256SUMS-windows.txt -Encoding ascii

      # #1633 — same trailer format on Windows. The zstd CLI is installed
      # here because the payload builder shells out to it.
      - name: Build self-extracting Windows binary
        shell: pwsh
        run: |
          choco install zstd --no-progress -y
          New-Item -ItemType Directory -Force dist/payload | Out-Null
          New-Item -ItemType Directory -Force dist/payload/bin | Out-Null
          New-Item -ItemType Directory -Force dist/payload/ui | Out-Null
          Copy-Item target/release/botserver.exe dist/payload/botserver.exe
          Copy-Item -Recurse botui/ui/suite  dist/payload/ui/suite
          Copy-Item -Recurse botui/ui/themes dist/payload/ui/themes
          Copy-Item botserver/.product.desktop-local dist/payload/
          python scripts/build-self-extractor.py `
            --app target/release/botapp.exe `
            --payload dist/payload `
            --out dist/generalbots.exe
          .\dist\generalbots.exe --verify
          Get-FileHash dist/generalbots.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  generalbots.exe" } |
            Out-File dist/SHA256SUMS-windows.txt -Encoding ascii -Append

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/*
          if-no-files-found: error

  release:
    name: Attach the Linux installer to the release
    needs: [linux]
    runs-on: ubuntu-latest
    # Linux is the supported first-run artifact; it must not wait for the
    # best-effort Windows job. Windows assets are attached by `release-windows`
    # when (and only when) that job is green.
    if: ${{ github.server_url == 'https://github.com' && needs.linux.result == 'success' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: linux-installer
          path: dist
          merge-multiple: true

      # #1634 — /releases/latest/download/<name> only resolves an asset whose
      # name matches exactly, so a missing tag-free copy silently turns every
      # stable link into a 404. Fail before publishing rather than after.
      - name: Verify the stable download aliases
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          test -f "dist/generalbots-linux-x86_64.tar.gz"
          test -f "dist/generalbots-${TAG}-linux-x86_64.tar.gz"
          grep -qE "  generalbots-linux-x86_64\.tar\.gz$" dist/SHA256SUMS-linux
          grep -qE "  generalbots-${TAG}-linux-x86_64\.tar\.gz$" dist/SHA256SUMS-linux
          (cd dist && sha256sum -c SHA256SUMS-linux --ignore-missing)
          echo "stable alias and both checksums are present"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          # #1634 — the Linux artifact must be the newest *normal* release;
          # drafts and pre-releases never back /releases/latest.
          draft: false
          prerelease: false
          make_latest: true
          body: |
            Desktop edition for ${{ github.event.inputs.tag || github.ref_name }}.

            Stable link (always the newest release):

                https://github.com/generalbots/generalbots/releases/latest/download/generalbots-linux-x86_64.tar.gz

            Linux (x86_64) — download, verify, unpack, run:

                curl -fL -o generalbots-linux-x86_64.tar.gz \
                  https://github.com/generalbots/generalbots/releases/latest/download/generalbots-linux-x86_64.tar.gz
                curl -fL -o SHA256SUMS-linux \
                  https://github.com/generalbots/generalbots/releases/latest/download/SHA256SUMS-linux
                sha256sum -c <(grep ' generalbots-linux-x86_64.tar.gz' SHA256SUMS-linux)
                tar -xzf generalbots-linux-x86_64.tar.gz
                cd generalbots-*-linux-x86_64
                ./install.sh        # per-user install, no root required
                general-bots        # first run opens the setup wizard

            Do not interrupt the download: a truncated archive extracts a partial
            tree. start.sh and install.sh detect that and print the recovery
            command instead of failing with "No such file or directory".

            The wizard provisions the service stack (PostgreSQL, Valkey, Qdrant,
            Vault, Zitadel, llama.cpp) into ~/.local/share/generalbots and then
            opens the suite with Chat and Drive. `start.sh` runs the same thing
            straight from the unpacked directory; `./start.sh --provision` does
            it headless. Components still missing after the first run are
            fetched once and cached under ~/.local/share/generalbots/installers.

            The tarball bundles MinIO (object store) because upstream archived
            it and removed the binaries from dl.min.io. MinIO is AGPL-3.0:
            https://github.com/minio/minio and https://github.com/minio/mc.

            Also attached: the self-extracting `generalbots` executable
            (the app with the stack appended: verify with `--verify`, unpack
            with `--extract-only`), `SHA256SUMS-linux`, and the raw
            `generalbots`/`botserver` binaries for debugging.
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS-linux
            dist/generalbots
            dist/generalbots-linux-x86_64
            dist/botserver-linux-x86_64
          fail_on_unmatched_files: false

  release-windows:
    name: Attach the Windows binaries to the release
    needs: [windows]
    runs-on: ubuntu-latest
    # Best effort: only runs when the Windows build itself went green, and never
    # fails the workflow. Releases are immutable, so assets cannot be appended
    # to the Linux tag after publication — the Windows build gets its own tag.
    continue-on-error: true
    if: ${{ github.server_url == 'https://github.com' && needs.windows.result == 'success' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist
          merge-multiple: true

      - name: Publish Windows assets
        uses: softprops/action-gh-release@v2
        with:
          # Never let the Windows release take "latest": the stable Linux link
          # /releases/latest/download/generalbots-linux-x86_64.tar.gz must keep
          # resolving to the release that actually carries that asset.
          make_latest: false
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}-windows
          name: ${{ github.event.inputs.tag || github.ref_name }} (Windows)
          body: |
            Windows binaries for ${{ github.event.inputs.tag || github.ref_name }}.
            Best effort: the Linux installer is the supported artifact and lives
            on the `${{ github.event.inputs.tag || github.ref_name }}` tag.
          files: |
            dist/generalbots.exe
            dist/generalbots-x64.exe
            dist/botserver-x64.exe
            dist/botui-x64.exe
            dist/SHA256SUMS-windows.txt
          fail_on_unmatched_files: false
