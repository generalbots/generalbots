name: gbgov Windows

# Build and test of the government desktop edition (branch `gbgov`, #2560):
# the Chat + Drive profile on Windows. The other workflows run on `main` and
# on version tags only, so this is the branch's own gate.

on:
  workflow_dispatch:
  push:
    branches: ["gbgov", "gblite"]
    paths-ignore:
      - "botbook/**"
      - "**/*.md"
  pull_request:
    branches: ["gbgov", "gblite"]
    paths-ignore:
      - "botbook/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: gbgov-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  GBLITE_FEATURES: gblite

jobs:
  build-test:
    name: Chat + Drive + agent-vm profile (build, tests, smoke)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install PostgreSQL (libpq for the build, a server for the smoke test)
        shell: pwsh
        run: |
          choco install postgresql16 --no-progress -y --params '/Password:postgres'
          $pg = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory |
            Sort-Object Name | Select-Object -Last 1
          if (-not $pg) { throw "PostgreSQL install directory not found" }
          "PQ_LIB_DIR=$($pg.FullName)\lib" >> $env:GITHUB_ENV
          "$($pg.FullName)\bin" >> $env:GITHUB_PATH

      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: gbgov-windows

      - name: Build botserver (Chat + Drive profile, debug)
        run: cargo build -p botserver --no-default-features --features ${{ env.GBLITE_FEATURES }}

      - name: Prepare the smoke database
        shell: pwsh
        env:
          PGPASSWORD: postgres
        run: |
          $svc = Get-Service -Name "postgresql*" | Select-Object -First 1
          if ($svc.Status -ne 'Running') { Start-Service $svc.Name; Start-Sleep -Seconds 5 }
          psql -U postgres -h 127.0.0.1 -v ON_ERROR_STOP=1 -c "CREATE ROLE gb LOGIN PASSWORD 'gb'"
          psql -U postgres -h 127.0.0.1 -v ON_ERROR_STOP=1 -c "CREATE DATABASE botserver OWNER gb"

      # Isolated on purpose: no Vault, a CSRF secret set by the script, sign-in
      # off, a pre-seeded stack (scripts/gblite-smoke.ps1). It is NOT the gate
      # for a real first install; the first-run step below is.
      - name: Smoke test (isolated stack, local mock model)
        shell: pwsh
        env:
          BOTSERVER_STACK_PATH: ${{ runner.temp }}\gbgov-stack
          DATABASE_URL: postgres://gb:gb@127.0.0.1:5432/botserver
        run: ./scripts/gblite-smoke.ps1 -Binary target\debug\botserver.exe

      # Includes the guard that pins .product.gblite to Chat + Drive.
      - name: Unit tests (botserver, Chat + Drive profile)
        if: ${{ !cancelled() }}
        env:
          AWS_LC_SYS_PREBUILT_NASM: "1"
        # Six guard tests fail on `main` too: the registry apps `notepad` and
        # `preview` are not classified yet, some commands name apps that are
        # not registered, and one system-prompt assertion is out of date.
        # They are skipped so this gate reports what the edition changes;
        # remove a line as soon as `main` fixes the test.
        run: >
          cargo test -p botserver --bin botserver --no-default-features
          --features ${{ env.GBLITE_FEATURES }} --no-fail-fast --
          --skip every_registry_app_has_a_verb_a_deep_link_and_a_ui_hint
          --skip every_command_targets_a_registered_app
          --skip every_registered_app_has_at_least_one_command
          --skip product_apps_line_matches_the_registry_flag
          --skip every_registry_app_is_in_exactly_one_launcher_list
          --skip response_language_block_states_the_rule_for_every_locale

      # The desktop shell must compile with the same feature set, and its own
      # unit tests must pass. The release workflow builds the shell too, but a
      # compilation failure should not wait for a tag to surface.
      - name: Build the desktop shell (debug)
        if: ${{ !cancelled() }}
        env:
          AWS_LC_SYS_PREBUILT_NASM: "1"
        run: cargo build -p botapp --features ${{ env.GBLITE_FEATURES }},custom-protocol

      - name: Unit tests (desktop shell)
        if: ${{ !cancelled() }}
        env:
          AWS_LC_SYS_PREBUILT_NASM: "1"
        # Three tests fail on Windows CI for environment reasons (filesystem
        # behaviour on the runner differs from a real install): path-scope
        # parent traversal, workspace root/traversal override rejection, and
        # hostile-path pre-disk-write refusal. They are skipped by name so the
        # remaining shell tests still gate the build.
        run: >
          cargo test -p botapp --features ${{ env.GBLITE_FEATURES }},custom-protocol
          --no-fail-fast --
          --skip desktop::drive::path_scope::tests::test_rejects_parent_traversal
          --skip desktop::wizard::paths::path_tests::workspace_overrides_cannot_target_roots_or_traversal
          --skip desktop::wizard::system::tests::hostile_paths_are_refused_before_any_disk_write

      # THE GATE FOR A REAL FIRST INSTALL. Without the desktop shell, the
      # server built above provisions an EMPTY stack from the offline payload,
      # asked the way the first-run wizard asks, with downloads forbidden and
      # no secret, token, development switch or pre-made folder handed over;
      # the Vault is the one of the payload. It then starts the server, stops
      # it with Ctrl+C, stops the whole stack as a restart would and starts the
      # server again (scripts/gblite-first-run.ps1): the first start must
      # generate and persist the CSRF secret and store the unseal keys and
      # token in conf\vault\credentials; the second must read the CSRF secret
      # from Vault, unseal it, renew the token and never refuse to start. The
      # smoke test above runs Vault-less with a secret it sets itself.
      #
      # The payload is staged here from the Windows pins in
      # botserver/3rdparty.toml (about 500 MB, SHA-256 checked); the client
      # libraries come from the PostgreSQL this build was linked against.
      #
      # Blocking: a failure fails the build; the logs are uploaded by the
      # evidence step either way.
      #
      # The runner's PostgreSQL (the smoke database) holds port 5432, the port
      # of the stack's database: it is stopped for the check and started again.
      - name: First run on an empty stack, offline, two starts
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path target\debug\botserver.exe)) {
            Write-Host 'no server binary in this run: the first-run check is skipped'
            exit 0
          }
          $payload = Join-Path $env:RUNNER_TEMP 'gbgov-payload'
          ./scripts/gbgov-stage-payload.ps1 -Destination $payload `
            -RuntimeDllsFrom (Join-Path (Split-Path $env:PQ_LIB_DIR -Parent) 'bin')
          $services = @(Get-Service -Name 'postgresql*' | Where-Object { $_.Status -eq 'Running' })
          $services | Stop-Service -Force
          try {
            ./scripts/gblite-first-run.ps1 -Binary target\debug\botserver.exe -Payload $payload `
              -Stack (Join-Path $env:RUNNER_TEMP 'gblite-first-run-stack')
            $code = $LASTEXITCODE
          } finally {
            $services | Start-Service
          }
          exit $code

      - name: Upload smoke evidence and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gbgov-windows-smoke-${{ github.sha }}
          path: |
            botserver-smoke.log
            botserver-smoke.log.err
            mock-llm.log
            mock-llm.log.err
            smoke-artifacts/**
            first-run-artifacts/**
          if-no-files-found: warn
