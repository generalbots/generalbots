name: gbgov release

# Release build and Windows installers of the government desktop edition
# (branch `gbgov`). It runs only on the edition's own tags (`gbgov-v1.2.3`) and
# by hand; the platform's `v*.*.*` tags and release workflow are not involved.
#
# A tag builds and publishes a pre-release named for the tag, and only when
# every installer carries a valid code signature. A manual run
# builds the same files and keeps them as workflow artifacts; it publishes only
# with `publish=true` and only when it runs on a `gbgov-v*` tag.
#
# Versions: the tag carries the edition version (`gbgov-v1.2.3` -> 1.2.3). The
# Windows installer (MSI) accepts only `major.minor.patch` with an optional
# numeric pre-release (`1.2.3-4`), so other tags fail before the build starts.

on:
  push:
    tags: ["gbgov-v*"]
    # Build-only trial runs: a push to this branch builds and tests everything
    # and keeps the files as artifacts; it never publishes (manual runs need
    # the workflow on the default branch, which this edition does not touch).
    branches: ["gbgov-release-dryrun"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a pre-release (only when run on a gbgov-v* tag)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gbgov-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GBGOV_FEATURES: gbgov
  TARGET_TRIPLE: x86_64-pc-windows-msvc

jobs:
  build:
    name: Release build, installers, smoke
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      # `secrets` cannot be read in a step condition; this flag can.
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT != '' }}
      # Public name of the edition: release files carry it, never `gbgov`.
      PRODUCT_FILE: GeneralBotsLite
    outputs:
      signed: ${{ steps.collect.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve the edition version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notlike 'gbgov-v*') {
              throw "tag $($env:GITHUB_REF_NAME) is not an edition tag (gbgov-v*)"
            }
            $version = $env:GITHUB_REF_NAME.Substring('gbgov-v'.Length)
            $label = $env:GITHUB_REF_NAME
          } else {
            $version = (Get-Content botapp/tauri.conf.json -Raw | ConvertFrom-Json).version
            $label = "gbgov-build-$((git rev-parse --short HEAD).Trim())"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-\d+)?$') {
            throw "version '$version' is not major.minor.patch with an optional numeric pre-release"
          }
          $commit = (git rev-parse --short HEAD).Trim()
          $built = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          "GBGOV_VERSION=$version" >> $env:GITHUB_ENV
          "GBGOV_LABEL=$label" >> $env:GITHUB_ENV
          "BOTSERVER_BUILD_VERSION=$version" >> $env:GITHUB_ENV
          "BOTSERVER_COMMIT=$commit" >> $env:GITHUB_ENV
          "BOTSERVER_BUILD_DATE=$built" >> $env:GITHUB_ENV
          $versionConf = Join-Path $env:RUNNER_TEMP 'gbgov-version.conf.json'
          @{ version = $version } | ConvertTo-Json | Set-Content $versionConf -Encoding utf8
          "GBGOV_VERSION_CONF=$versionConf" >> $env:GITHUB_ENV
          Write-Host "edition version $version ($label, $commit)"

      # The server links libpq and the desktop shell stages its runtime DLLs
      # beside the server at first run (botapp/src/desktop/sidecar.rs). They
      # come from the same pinned client build used on developer machines
      # (botserver/3rdparty.toml `libpq_win.url_win`); the EDB 16 installer
      # below only provides a database server for the smoke test.
      - name: PostgreSQL client libraries (pinned) and a server for the smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'pgsql-17.4-binaries.zip'
          Invoke-WebRequest -Uri 'https://get.enterprisedb.com/postgresql/postgresql-17.4-1-windows-x64-binaries.zip' -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '80bb49e80df0100dd52e7b3c647896f8d8cfde760b6473e5180819c8df4b23c4') { throw "PostgreSQL client archive digest mismatch: $hash" }
          $client = Join-Path $env:RUNNER_TEMP 'pgclient'
          Expand-Archive $zip -DestinationPath $client -Force
          $pgsql = Join-Path $client 'pgsql'
          $payload = 'botserver\botserver-installers'
          New-Item -ItemType Directory -Force $payload | Out-Null
          $runtimeDlls = @(
            'libpq.dll', 'libcrypto-3-x64.dll', 'libssl-3-x64.dll',
            'libiconv-2.dll', 'libintl-9.dll', 'libwinpthread-1.dll',
            'liblz4.dll', 'libzstd.dll', 'zlib1.dll'
          )
          foreach ($name in $runtimeDlls) {
            $dll = Join-Path "$pgsql\bin" $name
            if (-not (Test-Path $dll)) { throw "PostgreSQL runtime DLL is missing: $name" }
            Copy-Item $dll $payload -Force
          }
          choco install postgresql16 --no-progress -y --params '/Password:postgres'
          $server = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory | Sort-Object Name | Select-Object -Last 1
          if (-not $server) { throw "PostgreSQL server install directory not found" }
          "PQ_LIB_DIR=$pgsql\lib" >> $env:GITHUB_ENV
          # Later entries win: the pinned client DLLs come before the server's.
          "$($server.FullName)\bin" >> $env:GITHUB_PATH
          "$pgsql\bin" >> $env:GITHUB_PATH

      - uses: ./.github/actions/rust-setup
        with:
          cache-scope: gbgov-release

      - name: Build botserver (release, Chat + Drive profile)
        run: cargo build --release -p botserver --no-default-features --features ${{ env.GBGOV_FEATURES }}

      - name: Prepare the smoke database
        shell: pwsh
        env:
          PGPASSWORD: postgres
        run: |
          $svc = Get-Service -Name "postgresql*" | Select-Object -First 1
          if ($svc.Status -ne 'Running') { Start-Service $svc.Name; Start-Sleep -Seconds 5 }
          psql -U postgres -h 127.0.0.1 -v ON_ERROR_STOP=1 -c "CREATE ROLE gb LOGIN PASSWORD 'gb'"
          psql -U postgres -h 127.0.0.1 -v ON_ERROR_STOP=1 -c "CREATE DATABASE botserver OWNER gb"

      - name: Smoke test the release server (isolated stack, local mock model)
        shell: pwsh
        env:
          BOTSERVER_STACK_PATH: ${{ runner.temp }}\gbgov-stack
          DATABASE_URL: postgres://gb:gb@127.0.0.1:5432/botserver
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/gbgov-smoke.ps1 -Binary target\release\botserver.exe
          $logs = Get-ChildItem 'botserver-smoke.log*' -ErrorAction SilentlyContinue
          $panics = $logs | Select-String -Pattern 'panicked at' -SimpleMatch
          if ($panics) {
            $panics | Select-Object -First 5 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            throw "the release server panicked during the smoke test"
          }

      - name: Build the desktop shell (release)
        run: cargo build --release -p botapp --features ${{ env.GBGOV_FEATURES }},custom-protocol

      # Same pinned components and digests as the platform's Windows release
      # (botserver/3rdparty.toml). Every required service must be listed so a
      # first run finds it locally and never downloads. minio.exe is MinIO
      # RELEASE.2025-10-15T17-29-55Z (fixes CVE-2025-62506) built from source
      # by .github/workflows/drive-bin-v4.yml on main; upstream publishes no
      # binary for that release.
      - name: Stage the offline payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = 'botserver\botserver-installers'
          New-Item -ItemType Directory -Force $payload | Out-Null
          $downloads = @(
            @{ Name = 'openbao_2.7.3_windows_amd64.zip'; Url = 'https://github.com/openbao/openbao/releases/download/v2.7.3/openbao_2.7.3_windows_amd64.zip'; Algo = 'SHA256'; Hash = '969e4872b21eeee7c9b4cd312e77027e624528ca7bc9dc2361311b97e34e6e90' },
            # PostgreSQL server: the `tables` component unpacks and runs initdb
            # from this archive on first run. Without it the provisioner would
            # download ~350 MB at runtime.
            @{ Name = 'postgresql-18.6-1-windows-x64-binaries.zip'; Url = 'https://get.enterprisedb.com/postgresql/postgresql-18.6-1-windows-x64-binaries.zip'; Algo = 'SHA256'; Hash = 'fbe23da234ee31547bf8a36d29dfd81e82b849df2d2b78d2eecb43d360252f8c' },
            @{ Name = 'minio.exe'; Url = 'https://github.com/generalbots/generalbots/releases/download/drive-bin-v4/minio.exe'; Algo = 'SHA256'; Hash = 'e63f9c4ac8b8697ca679d4864497688c3486aa9ac9370c3569203420c25e5799' },
            @{ Name = 'mc.exe'; Url = 'https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.windows-amd64.RELEASE.2025-08-13T08-35-41Z.exe'; Algo = 'SHA256'; Hash = 'c8db13ebeda31497f354c0e950809db0ae9b2a2a69b8afee68c128c37300c157' }
            # Redis removed: Windows uses the built-in RESP cache (no external service).
            # Qdrant, Zitadel and Caddy are not bundled: the product file switches
            # those services off; one that is switched back on is downloaded then.
          )
          foreach ($item in $downloads) {
            $out = Join-Path $payload $item.Name
            Invoke-WebRequest -Uri $item.Url -OutFile $out -UseBasicParsing
            $actual = (Get-FileHash $out -Algorithm $item.Algo).Hash.ToLowerInvariant()
            if ($actual -ne $item.Hash) {
              throw "checksum mismatch for $($item.Name): expected $($item.Hash), got $actual"
            }
            Write-Host "verified $($item.Name) ($($item.Algo))"
          }

      # First run of a brand-new install, without the desktop shell: the
      # release server provisions an EMPTY stack from the payload staged above,
      # asked the way the first-run wizard asks, with downloads forbidden, and
      # then starts once on it (scripts/gbgov-first-run.ps1). The smoke test
      # above never runs the provisioner, so only this step sees a payload or a
      # product file that a new install cannot use.
      #
      # NOT BLOCKING YET: the check has never run on a runner, and a wrong
      # assumption in it must not stop a release build. Remove
      # `continue-on-error` from this step once it has passed twice here.
      #
      # The runner's own PostgreSQL (the smoke database) holds port 5432, the
      # port of the stack's database: it is stopped for the check and started
      # again afterwards.
      - name: First run on an empty stack, offline (not blocking yet)
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $services = @(Get-Service -Name 'postgresql*' | Where-Object { $_.Status -eq 'Running' })
          $services | Stop-Service -Force
          try {
            ./scripts/gbgov-first-run.ps1 -Binary target\release\botserver.exe `
              -Payload botserver\botserver-installers `
              -Stack (Join-Path $env:RUNNER_TEMP 'gbgov-first-run-stack')
            $code = $LASTEXITCODE
          } finally {
            $services | Start-Service
          }
          exit $code

      # The installers install for the whole machine (`installMode` in
      # botapp/tauri.gbgov.conf.json), so the person who runs the app cannot
      # write to, or move files out of, the app folder. The same check with
      # that folder locked. Not blocking, for the same reason as above; make it
      # blocking once it has passed twice.
      - name: First run on an empty stack, app folder read-only (not blocking yet)
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $services = @(Get-Service -Name 'postgresql*' | Where-Object { $_.Status -eq 'Running' })
          $services | Stop-Service -Force
          try {
            ./scripts/gbgov-first-run.ps1 -Binary target\release\botserver.exe `
              -Payload botserver\botserver-installers -ReadOnlyApp `
              -Stack (Join-Path $env:RUNNER_TEMP 'gbgov-first-run-locked-stack') `
              -Evidence first-run-artifacts-read-only
            $code = $LASTEXITCODE
          } finally {
            $services | Start-Service
          }
          exit $code

      # The agent workspace on Windows runs Incus inside WSL through the
      # `incus.exe` wrapper (desktop/windows/incus-wsl). The binary ships as
      # installers/incus.exe so the shell can find it at runtime.
      - name: Build and test the WSL Incus wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --manifest-path desktop\windows\incus-wsl\Cargo.toml
          cargo test --release --manifest-path desktop\windows\incus-wsl\Cargo.toml
          $exe = Get-ChildItem 'desktop\windows\incus-wsl\target\release\incus.exe' -ErrorAction Stop
          Copy-Item $exe.FullName 'botserver\botserver-installers\incus.exe' -Force

      # Sign incus.exe separately: it is not part of the Tauri bundle so the
      # bundler's signing configuration does not reach it.
      - name: Sign incus.exe (when the certificate is present)
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $incus = 'botserver\botserver-installers\incus.exe'
          if (-not (Test-Path $incus)) { throw 'incus.exe was not staged' }
          $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
          if (-not $cert) { throw 'no code-signing certificate in the store' }
          Set-AuthenticodeSignature -FilePath $incus -Certificate $cert `
            -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
          $status = (Get-AuthenticodeSignature $incus).Status
          if ($status -ne 'Valid') { throw "incus.exe signature status: $status" }
          Write-Host "incus.exe signed ($status)"

      - name: Record the payload checksums
        shell: pwsh
        run: |
          $payload = 'botserver\botserver-installers'
          $sums = Join-Path $payload 'SHA256SUMS-windows-installers'
          Get-ChildItem $payload -File |
            Where-Object { $_.Name -ne 'SHA256SUMS-windows-installers' } |
            Sort-Object Name |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content $sums -Encoding ascii
          Get-ChildItem $payload -File | Sort-Object Name |
            ForEach-Object { Write-Host ("payload {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)) }

      - name: Stage the server sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force botapp\binaries | Out-Null
          Copy-Item target\release\botserver.exe "botapp\binaries\botserver-$env:TARGET_TRIPLE.exe" -Force

      # Code signing waits for the certificate. With the secrets in place the
      # certificate goes into the runner's user store and the bundler signs the
      # application, the sidecar and both installers with it.
      - name: Prepare code signing
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_CERT }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT))
          $password = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          $signConf = Join-Path $env:RUNNER_TEMP 'gbgov-sign.conf.json'
          @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 5 | Set-Content $signConf -Encoding utf8
          "GBGOV_SIGN_CONF=$signConf" >> $env:GITHUB_ENV

      - name: Install the Tauri bundler
        run: cargo install tauri-cli --version "^2" --locked

      - name: Package the NSIS and MSI installers
        shell: pwsh
        working-directory: botapp
        run: |
          $ErrorActionPreference = 'Stop'
          $configs = @('--config', 'tauri.gbgov.conf.json', '--config', $env:GBGOV_VERSION_CONF)
          if ($env:GBGOV_SIGN_CONF) { $configs += @('--config', $env:GBGOV_SIGN_CONF) }
          cargo tauri build --features "$env:GBGOV_FEATURES,custom-protocol" @configs --bundles nsis,msi
          if ($LASTEXITCODE -ne 0) { throw "cargo tauri build failed with exit code $LASTEXITCODE" }

      # Gate: the built installer must carry the licence files, the NOTICE
      # and the source offer. The smoke test extracts the NSIS installer to a
      # temp directory; we check that the resources map put them there.
      - name: Verify licence files in the bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundles = @('target\release\bundle', 'botapp\target\release\bundle')
          $nsis = Get-ChildItem ($bundles | ForEach-Object { "$_\nsis\*-setup.exe" }) -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { throw 'no NSIS installer found' }
          # The NSIS installer is a self-extracting archive; use 7z to list its
          # contents (available on windows-latest) and grep for the licence paths.
          $listing = & 7z l $nsis.FullName 2>&1 | Out-String
          $required = @(
            'licenses\LICENSES-desktop.md',
            'licenses\NOTICE',
            'licenses\SOURCE-OFFER.md'
          )
          $missing = @()
          foreach ($path in $required) {
            if ($listing -notmatch [regex]::Escape($path)) {
              $missing += $path
            }
          }
          # Also check that at least one upstream licence text is present.
          if ($listing -notmatch 'licenses\\[a-z]') {
            $missing += 'licenses\<upstream-text>.txt (no licence text files found)'
          }
          if ($missing.Count -gt 0) {
            foreach ($m in $missing) { Write-Host "::error::missing in bundle: $m" }
            throw "the installer is missing $($missing.Count) licence file(s)"
          }
          Write-Host "licence files verified in the NSIS bundle"

      - name: Collect the release files
        id: collect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:GBGOV_VERSION
          $p = $env:PRODUCT_FILE
          New-Item -ItemType Directory -Force dist | Out-Null
          $bundles = @('target\release\bundle', 'botapp\target\release\bundle')
          $msi = Get-ChildItem ($bundles | ForEach-Object { "$_\msi\*.msi" }) -ErrorAction SilentlyContinue | Select-Object -First 1
          $setup = Get-ChildItem ($bundles | ForEach-Object { "$_\nsis\*-setup.exe" }) -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { throw 'the bundler produced no MSI' }
          if (-not $setup) { throw 'the bundler produced no NSIS installer' }
          Copy-Item $msi.FullName "dist\$p-$v-windows-x64.msi"
          Copy-Item $setup.FullName "dist\$p-$v-windows-x64-setup.exe"
          Copy-Item target\release\botapp.exe "dist\$p-$v-windows-x64.exe"
          Copy-Item target\release\botserver.exe "dist\$p-botserver-$v-windows-x64.exe"
          foreach ($f in Get-ChildItem dist -File) {
            if ($f.Name -match '(msi|setup\.exe)$' -and $f.Length -lt 1MB) {
              throw "$($f.Name) is suspiciously small ($($f.Length) bytes)"
            }
          }
          # Publishing needs every executable validly signed (Authenticode);
          # an unsigned build is kept as a workflow artifact only.
          $signed = $true
          $checkFiles = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(exe|msi)$' })
          $incus = Get-Item 'botserver\botserver-installers\incus.exe' -ErrorAction SilentlyContinue
          if ($incus) { $checkFiles += $incus }
          foreach ($f in $checkFiles) {
            $status = (Get-AuthenticodeSignature $f.FullName).Status
            Write-Host "signature $($f.Name): $status"
            if ($status -ne 'Valid') { $signed = $false }
          }
          if ($env:HAS_WINDOWS_CERT -eq 'true' -and -not $signed) {
            throw 'a signing certificate is configured but not every file is validly signed'
          }
          "signed=$($signed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Software bill of materials (CycloneDX)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo install cargo-cyclonedx --version "^0.5" --locked
          if ($LASTEXITCODE -ne 0) { throw 'could not install cargo-cyclonedx' }
          $builds = @(
            @{ Crate = 'botserver'; Args = @('--no-default-features', '--features', $env:GBGOV_FEATURES) },
            @{ Crate = 'botapp'; Args = @('--features', "$env:GBGOV_FEATURES,custom-protocol") }
          )
          foreach ($b in $builds) {
            cargo cyclonedx --manifest-path "$($b.Crate)\Cargo.toml" --format json --target $env:TARGET_TRIPLE @($b.Args)
            if ($LASTEXITCODE -ne 0) { throw "cargo cyclonedx failed for $($b.Crate)" }
            $sbom = Get-ChildItem $b.Crate -Filter '*.cdx.json' -File | Select-Object -First 1
            if (-not $sbom) { throw "no SBOM was written for $($b.Crate)" }
            Copy-Item $sbom.FullName "dist\$env:PRODUCT_FILE-$($b.Crate)-$env:GBGOV_VERSION.cdx.json" -Force
          }

      - name: SHA-256 sums
        shell: pwsh
        run: |
          $sums = "SHA256SUMS-$env:PRODUCT_FILE-$env:GBGOV_VERSION-windows.txt"
          Get-ChildItem dist -File | Where-Object { $_.Name -ne $sums } | Sort-Object Name |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content (Join-Path dist $sums) -Encoding ascii
          Get-Content (Join-Path dist $sums)

      - name: Upload the release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gbgov-release-${{ env.GBGOV_LABEL }}
          path: dist/*
          if-no-files-found: error

      - name: Upload smoke evidence and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gbgov-release-smoke-${{ github.sha }}
          path: |
            botserver-smoke.log
            botserver-smoke.log.err
            mock-llm.log
            mock-llm.log.err
            smoke-artifacts/**
            first-run-artifacts/**
            first-run-artifacts-read-only/**
          if-no-files-found: warn

  publish:
    name: Publish the pre-release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/gbgov-v') && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A final version (gbgov-v1.2.3) is published only when the installers
      # are signed. A numbered preview (gbgov-v1.2.3-4) may go out unsigned:
      # it is published as a pre-release, never as the latest release, with
      # the title and the notes saying so.
      - name: Require a signed build, or a numbered preview
        env:
          SIGNED: ${{ needs.build.outputs.signed }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            echo "installers are signed"
          elif [[ "$TAG" =~ ^gbgov-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::notice::unsigned preview $TAG: published as a pre-release with a warning in its title and notes"
          else
            echo "::error::the installers are not signed; a final release waits for the code-signing certificate (secrets WINDOWS_CERT and WINDOWS_CERT_PASSWORD). An unsigned preview needs a tag like gbgov-v1.0.0-1"
            exit 1
          fi

      - name: Require an edition tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [[ "$GITHUB_REF_NAME" != gbgov-v* ]]; then
            echo "::error::publishing needs a gbgov-v* tag; this run is on $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Download the release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gbgov-release-${{ github.ref_name }}
          path: dist

      - name: Create or update the GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          ls -l dist
          version="${TAG#gbgov-v}"
          title="General Bots Lite $version"
          {
            echo "General Bots Lite $version: Windows installers (Chat + Drive)."
            echo
            echo "Verify the downloads with the SHA256SUMS file attached to this release."
          } > notes.md
          if [ "$SIGNED" != "true" ]; then
            title="General Bots Lite $version (prévia, sem assinatura digital)"
            {
              echo '## Prévia sem assinatura digital'
              echo
              echo 'Esta é uma versão prévia para testes. Os instaladores ainda não têm assinatura digital, então o Windows mostra o aviso "O Windows protegeu o computador". Para instalar, clique em **Mais informações** e depois em **Executar assim mesmo**.'
              echo
              echo 'Antes de instalar, confira o arquivo baixado com o SHA256SUMS anexado a esta página. No PowerShell: `Get-FileHash <arquivo> -Algorithm SHA256`, e compare com a linha do arquivo.'
              echo
              echo 'Não use esta prévia em computadores de órgãos públicos: a versão assinada vem depois.'
              echo
              echo '## Unsigned preview'
              echo
              echo 'This is a preview build for testing. The installers are not code-signed yet, so Windows shows "Windows protected your PC". To install, choose **More info**, then **Run anyway**.'
              echo
              echo 'Check the downloaded file against the attached SHA256SUMS first (PowerShell: `Get-FileHash <file> -Algorithm SHA256`).'
            } > notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$title" \
              --prerelease \
              --latest=false \
              --verify-tag \
              --notes-file notes.md
          fi
