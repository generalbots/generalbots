name: BotEval CI Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Guard: no hx-get on POST-only fragment routes (#1139)
        run: ./scripts/check-hx-fragments.sh

      # #1213 — zero-cost regression gates: locale parity must stay full
      # (any PR adding keys to one locale without the others fails fast).
      - name: Guard: full locale key parity
        run: python3 scripts/check_locales.py

      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-boteval-${{ hashFiles('**/Cargo.lock') }}

      - name: Build boteval-run
        run: cargo build -p boteval --features http

      - name: Validate dataset artifact is deterministic
        run: |
          cargo run -p boteval --features http --bin boteval-run -- --dump-dataset > /tmp/vibe-200.dump.json
          if ! diff -q /tmp/vibe-200.dump.json botserver/crates/boteval/datasets/vibe-200.json; then
            echo "::error::committed datasets/vibe-200.json is stale — regenerate with: boteval-run --dump-dataset"
            exit 1
          fi

      - name: Run evaluation gate
        env:
          BOTEVAL_ENDPOINT: ${{ secrets.BOTEVAL_ENDPOINT }}
          BOTEVAL_API_KEY: ${{ secrets.BOTEVAL_API_KEY }}
          BOTEVAL_MODEL: ${{ vars.BOTEVAL_MODEL || 'gpt-oss-120b' }}
        run: |
          # #817 — the gate is a MERGE BLOCK. A missing secret must fail the
          # build, not silently skip the evaluation (previous behavior let
          # every run pass by exiting 0 when BOTEVAL_ENDPOINT was unset).
          if [ -z "$BOTEVAL_ENDPOINT" ]; then
            echo "::error::BOTEVAL_ENDPOINT secret not configured — the evaluation gate cannot run. Configure the secret to run the gate (this is mandatory for main)."
            exit 1
          fi
          cargo run -p boteval --features http --bin boteval-run -- \
            --gate botserver/crates/boteval/ci/gate.toml \
            --dataset botserver/crates/boteval/datasets/vibe-200.json \
            --endpoint "$BOTEVAL_ENDPOINT" \
            --api-key "$BOTEVAL_API_KEY" \
            --model "$BOTEVAL_MODEL"
