name: BotEval CI Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-boteval-${{ hashFiles('**/Cargo.lock') }}

      - name: Build boteval-run
        run: cargo build -p boteval --features http

      - name: Run evaluation gate
        run: |
          cargo run -p boteval --features http --bin boteval-run -- \
            --gate botserver/crates/boteval/ci/gate.toml \
            --dataset botserver/crates/boteval/datasets/
