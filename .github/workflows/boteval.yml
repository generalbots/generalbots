name: boteval-ci
on:
  push:
    paths:
      - "botserver/crates/boteval/**"
      - "botserver/crates/botbasic_ai/**"
      - "botserver/crates/botbasic_comms/**"
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run boteval suite
        env:
          BOT_EVAL_URL: ${{ secrets.BOT_EVAL_URL }}
          BOT_EVAL_KEY: ${{ secrets.BOT_EVAL_KEY }}
        run: |
          cargo test -p boteval --features http
          cargo run -p boteval --features http --bin boteval-run -- \
            --dataset botserver/crates/boteval/datasets/sample.json \
            --endpoint "$BOT_EVAL_URL" \
            --api-key "$BOT_EVAL_KEY" \
            --gate botserver/crates/boteval/ci/gate.toml
