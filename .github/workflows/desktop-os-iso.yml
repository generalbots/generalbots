name: General Bots OS (kiosk appliance image)

# Builds the "General Bots OS" appliance: a Debian 13 (trixie) image where
# the General Bots desktop shell IS the OS — Wayland kiosk (cage), no
# display manager, no user shell. Recipe: desktop/os/README.md.
#
# Per project rules there is NO source build here: the workflow downloads
# the desktop edition .deb from the GitHub release channel (tag or latest)
# and mkosi bakes it into the appliance image. The mkosi build always runs
# inside a privileged debian:trixie container so the recipe is pinned to
# mkosi 27 same-tree semantics (the host runner's mkosi is not used).
#
# Artifacts (workflow-level):
#   generalbots-os.iso — hybrid ISO (El Torito), when the build env's
#                        systemd-repart is ≥ 261 (mkosi.torito gates on the
#                        running systemd version for us)
#   generalbots-os.img — GPT disk image, UEFI-bootable (dd), produced when
#                        the ISO gate does not match
#   SHA256SUMS-os, vm-smoke.log
#
# Release attachment is deliberately OFF until the ISO path and the boot
# smoke are validated on the first set of builds; the artifact above is the
# staging ground.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release to take the .deb from ('latest' or e.g. v6.7.0)"
        required: false
        default: "latest"
        type: string
  push:
    branches: [main]
    paths:
      - "desktop/os/**"
      - ".github/workflows/desktop-os-iso.yml"

permissions:
  contents: read

jobs:
  image:
    name: Build the appliance image (mkosi on Debian trixie)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch the release .deb into the mkosi package directory
        run: |
          set -euo pipefail
          REL="${{ github.event.inputs.release }}"
          if [ -z "$REL" ] || [ "$REL" = "latest" ]; then
            SRC="releases/latest/download"
          else
            SRC="releases/download/${REL}"
          fi
          mkdir -p desktop/os/deb
          curl -fL -o desktop/os/deb/generalbots-linux-x86_64.deb \
            "https://github.com/generalbots/generalbots/${SRC}/generalbots-linux-x86_64.deb"
          file desktop/os/deb/generalbots-linux-x86_64.deb | grep -q "Debian binary package"
          sha256sum desktop/os/deb/generalbots-linux-x86_64.deb

      - name: Build the image and boot-test it (mkosi inside Debian trixie)
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --privileged --rm \
            -v "$PWD/desktop/os:/work" \
            -v "$PWD/dist:/out" \
            -w /work \
            debian:trixie bash -c '
              set -uxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              # mkosi sandbox uses unprivileged user namespaces; the Ubuntu
              # host restricts them via AppArmor. A privileged container is
              # allowed to lift the restriction for the build.
              sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
              apt-get update
              apt-get install -y --no-install-recommends mkosi
              mkosi --version
              # Same gate as mkosi.conf.d/10-eltorito.conf: name the artifact
              # for what it will contain. The [Match] rule keys on the same
              # host systemd-repart version (>= 261 = El Torito support).
              SYSTEMDVER=$(systemctl --version | awk "NR==1{print \$2}")
              if awk "BEGIN{exit !($SYSTEMDVER >= 261)}"; then
                DEST=generalbots-os.iso
              else
                DEST=generalbots-os.img
              fi
              echo "systemd $SYSTEMDVER -> $DEST"
              mkosi --output-dir /out build
              RAW=$(ls /out/generalbots-os*.raw 2>/dev/null | head -n1)
              test -n "$RAW" || { echo "mkosi produced no .raw output" >&2; exit 1; }
              mv "$RAW" "/out/$DEST"
              # Boot smoke (best effort): the plain vm verb boots with a text
              # console — kernel, systemd journal and (if everything works)
              # the kiosk shell start line land in the log.
              if timeout 300 mkosi --output-dir /out vm > /out/vm-smoke.log 2>&1; then
                echo "boot smoke: green"
                grep -a -m1 "Started General Bots kiosk shell" /out/vm-smoke.log || true
              else
                echo "::warning::boot smoke did not finish/confirm — inspect /out/vm-smoke.log"
              fi
            '

      - name: Checksums
        run: |
          set -euo pipefail
          test -f dist/generalbots-os.iso || test -f dist/generalbots-os.img
          (cd dist && sha256sum generalbots-os* > SHA256SUMS-os)
          ls -lh dist

      - name: Upload image artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generalbots-os-image
          path: |
            dist/generalbots-os.iso
            dist/generalbots-os.img
            dist/SHA256SUMS-os
            dist/vm-smoke.log
          if-no-files-found: warn
          retention-days: 7
