name: General Bots OS (kiosk appliance image)

# Builds the "General Bots OS" appliance: a Debian 13 (trixie) image where
# the General Bots desktop shell IS the OS — Wayland kiosk (cage), no
# display manager, no user shell. Recipe: desktop/os/README.md.
#
# Per project rules there is NO source build here: the workflow downloads
# the desktop edition release tarball (generalbots-linux-x86_64.tar.gz — the
# always-present artifact; the .deb/rpm/AppImage bundler step is best-effort
# and has historically produced nothing), unpacks it into
# desktop/os/mkosi.extra/opt/general-bots/ and lets mkosi bake the image
# inside a privileged debian:trixie container (mkosi 27, same tree as the
# target; the host runner's mkosi is not used).
#
# Artifacts (workflow-level):
#   generalbots-os.iso — hybrid ISO (El Torito, UEFI bootable)
#   SHA256SUMS-os, vm-smoke.log
#
# The recipe pins mkosi 27.1 by building inside a Debian sid toolchain
# container and a Debian sid build-time tools tree, because El Torito output
# needs systemd-repart ≥ 261 (trixie ships 257). The produced system is still
# pure Debian 13 (trixie).
#
# Release attachment is deliberately OFF until the ISO path and the boot
# smoke are validated on the first set of builds; the artifact above is the
# staging ground.

on:
  # Reusable from `.github/workflows/release-all.yml`; existing triggers stay.
  workflow_call:
    inputs:
      release:
        description: "Release to take the tarball from ('latest' or e.g. v7.0.0)"
        required: false
        type: string
      artifact:
        description: "Download linux-installer from the current run instead of a release"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      release:
        description: "Release to take the tarball from ('latest' or e.g. v7.0.0)"
        required: false
        default: "latest"
        type: string
  push:
    branches: [main]
    paths:
      - "desktop/os/**"
      - ".github/workflows/desktop-os-iso.yml"

permissions:
  contents: read

jobs:
  image:
    name: Build the appliance image (mkosi on Debian trixie)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the desktop artifact from the caller run
        if: ${{ inputs.artifact != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact }}
          path: /tmp/general-bots-artifact

      - name: Fetch and unpack the release tarball into the image payload
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          mkdir -p desktop/os/mkosi.extra/opt/general-bots
          if [ -n "${ARTIFACT:-}" ]; then
            # release-all.yml passes the linux-installer artifact produced in
            # the same run, so the image never waits for the release publish.
            TARBALL="/tmp/general-bots-artifact/generalbots-linux-x86_64.tar.gz"
            test -f "$TARBALL" || {
              echo "artifact ${ARTIFACT} carries no generalbots-linux-x86_64.tar.gz" >&2
              exit 1
            }
            echo "using artifact ${ARTIFACT} from the current run"
          else
            # "latest" means "the newest release whose assets actually carry
            # the desktop tarball" — a plain latest/download URL 404s on the
            # ALM tags (botserver/botui assets only).
            REL="${{ inputs.release || github.event.inputs.release }}"
            if [ -z "$REL" ] || [ "$REL" = "latest" ]; then
              REL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                | python3 -c 'import json,sys; print(next((r["tag_name"] for r in json.load(sys.stdin) if any(a["name"] == "generalbots-linux-x86_64.tar.gz" for a in r["assets"])), ""))')
              test -n "$REL" || { echo 'no release carries generalbots-linux-x86_64.tar.gz' >&2; exit 1; }
              echo "using release $REL"
            fi
            TARBALL=/tmp/general-bots.tar.gz
            curl -fL -o "$TARBALL" \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${REL}/generalbots-linux-x86_64.tar.gz"
          fi
          tar -xzf "$TARBALL" \
            -C desktop/os/mkosi.extra/opt/general-bots --strip-components=1
          test -x desktop/os/mkosi.extra/opt/general-bots/start.sh
          test -x desktop/os/mkosi.extra/opt/general-bots/generalbots
          test -d desktop/os/mkosi.extra/opt/general-bots/ui/suite
          du -sh desktop/os/mkosi.extra/opt/general-bots

      - name: Build the image and boot-test it (mkosi inside Debian trixie)
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --privileged --rm \
            -v "$PWD/desktop/os:/work" \
            -v "$PWD/dist:/out" \
            -w /work \
            debian:sid bash -c '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              # mkosi sandbox uses unprivileged user namespaces; the Ubuntu
              # host restricts them via AppArmor. A privileged container is
              # allowed to lift the restriction for the build.
              sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
              apt-get update
              # Toolchain container is sid only because trixie ships mkosi
              # 25.3 (no El Torito) and its dependency systemd-tpm is not
              # installable there; the image built below stays Debian 13.
              apt-get install -y --no-install-recommends mkosi
              mkosi --version
              mkosi --output-dir /out build
              RAW=$(ls /out/generalbots-os*.raw 2>/dev/null | head -n1)
              test -n "$RAW" || { echo "mkosi produced no .raw output" >&2; exit 1; }
              # Boot smoke (best effort) on the ORIGINAL output name — mkosi
              # vm resolves the image from the config output, so the rename
              # to .iso must happen afterwards. The plain vm verb boots with
              # a text console: kernel, systemd journal and (if everything
              # works) the kiosk shell start line land in the log. timeout
              # always fires (the VM keeps running), so the marker decides.
              timeout 480 mkosi --output-dir /out vm > /out/vm-smoke.log 2>&1 || true
              if grep -aq "Started General Bots kiosk shell" /out/vm-smoke.log; then
                echo "boot smoke: green (kiosk shell started)"
              else
                echo "::warning::boot smoke did not confirm the kiosk shell — last log lines follow"
                tail -80 /out/vm-smoke.log || true
              fi
              # El Torito is always on (mkosi.conf): the raw file is a hybrid
              # ISO image; give it the name people expect.
              mv "$RAW" /out/generalbots-os.iso
              rm -f /out/generalbots-os
            '

      - name: Checksums
        run: |
          set -euo pipefail
          test -f dist/generalbots-os.iso
          (cd dist && sha256sum generalbots-os.iso > SHA256SUMS-os)
          ls -lh dist

      - name: Upload image artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generalbots-os-image
          path: |
            dist/generalbots-os.iso
            dist/SHA256SUMS-os
            dist/vm-smoke.log
          if-no-files-found: warn
          retention-days: 7
