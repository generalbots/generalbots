# Advisory suppression / waiver register (#2725).
#
# The scheduled dependency scan drafts an advisory issue for every NEW finding.
# An entry here suppresses that draft, but only with:
#   id       - the advisory ID (RUSTSEC / GHSA / PYSEC / CVE)
#   reason   - a written reachability or acceptance argument
#   approver - who accepted the risk (team alias, NOT a credential)
#   expires  - ISO date; on/after this date the waiver stops suppressing and
#              the finding is drafted again (visible in the report as expired)
#
# Every skip is audited in the report: waived entries show approver + expiry,
# expired entries are listed under "Expired waivers" and re-drafted.
# The blocking CI gates in .github/workflows/security.yml keep their own
# dated allowlists (scripts/osv_allowlist*.txt, deny.toml, --ignore-vuln);
# this file carries the SAME accepted IDs so the drafter does not re-open a
# triage issue for a risk the team has already accepted.
#
# Re-validate every entry at the annual SECURITY.md residual-risk review and
# on any new bulletin naming a pinned component.

[[waiver]]
id = "RUSTSEC-2024-0370"
package = "proc-macro-error"
reason = "Unmaintained, build-time only; not in the shipping runtime graph."
approver = "@security-team"
expires = "2027-11-19"

