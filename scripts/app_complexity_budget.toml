# ─── Complexity ceiling relock — 2026-11-26 (OS slice + pulled suite fixes) ──
# Re-baselined with `python3 scripts/app_complexity_budget.py --update`.
# Ceilings that ROSE, each justified by the commit that grew the surface:
#   settings: 13450 -> 13492 (+42) — #2470 data-protection safety in
#     settings-os-appliance.js (replace-on-status token/scope, sanitized errors,
#     fail-closed export/snapshot/reset, role=status + aria-live from JS). The
#     regression harness lives under suite/tests, not the UI surface.
#   chat: 30928 -> 30954 (+26) — 1a096a20c (#2933 reflow/theme perf, +22) and
#     a0cd2ee23 (#2945–#2953 app poller/route fixes, +4). No route added.
#   automations: 1144 -> 1163 (+19) — a0cd2ee23 app-scoped poller gate.
#   mail: js_modules 6 -> 8 (+2), loc 4395 -> 4823 (+428) — a0cd2ee23 ships
#     00_mail_sanitize.js and its test module; the only strings matching the
#     CDN guard are hostile-input fixtures, split in source to keep the guard
#     strict for shipped assets (adequacy_guard stays at baseline 0).
#   slides: 21752 -> 21774 (+22) — a0cd2ee23 caption/route-contract work.
# Ceilings TIGHTENED because the surface shrank: calendar -1, crm -23, docs -9.
# No route ceiling changed. Future changes may only hold or lower these numbers;
# a rise needs an owner note in the same PR or a code split/delete.
