# General Bots Lite agent runtime (WSL2 distro GeneralBotsLite).
# Managed by the General Bots Lite desktop app; local edits may be replaced
# when the runtime is updated.

[boot]
systemd=true

[user]
default=root

[interop]
# The runtime runs Incus only; Windows programs stay out of its PATH.
appendWindowsPath=false

[automount]
# The desktop app imports the workspace image from a Windows path (/mnt/c/...).
enabled=true
