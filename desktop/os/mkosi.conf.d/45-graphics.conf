# Runtime GPU / VA-API profile detection (#2481) — offline slice.
#
# The base mkosi.conf already pins the UNION of graphics/Mesa/VA-API packages
# (Intel, AMD, virt GPU and their firmware) so the image is usable on every
# supported laptop out of the box. This drop-in ships the runtime half: a
# sysfs-only detector that picks the matching per-architecture driver profile
# from a documented data file, installs ONLY that set when apt is available
# and packages are missing, writes the WebKitGTK/GBM environment drop-in, and
# logs an explicit software (llvmpipe/swrast) fallback when no GPU is present.
#
# Assets (script, profile data, oneshot unit and preset) live in
#   desktop/os/graphics/extra/
# and are merged into the image tree via ExtraTrees. They are owned by a
# dedicated directory so this drop-in does not modify any existing fragment,
# the finalize hook or the base package audit.
#
# Modes: --audit (sysfs-only report), --dry-run / DRY_RUN=1 (no changes),
# GB_GRAPHICS_SKIP=1 (immediate no-op for CI/non-GPU hosts). See
# desktop/os/graphics/README.md. Hardware verification (vainfo profile,
# CPU/battery thresholds, WebKit compositing path, diagnostics strings) is
# CI/hardware-gated follow-up and is NOT claimed by this static slice.
[Content]
ExtraTrees=graphics/extra:/
