# Real hybrid ISO (El Torito boot catalog) instead of a plain GPT disk
# image. Requires systemd-repart ≥ 261 in the build environment's tools
# tree (El Torito support landed with mkosi 27's systemd); on older systemd
# this file is skipped cleanly and the GPT disk image (.raw) is the shipped
# artifact — same content, bootable via UEFI, write with dd (see README.md).
#
# Parsing nit: the "=" in ">=" would split the key/value at the wrong place,
# so the operator goes on the value side ("= >= 261").
[Match]
SystemdVersion = >= 261

[Output]
ElTorito=yes
