# User-data protection for the General Bots OS appliance (issue #2470).
#
# Ships the LUKS2 provisioning / snapshot / restore / export / reset scripts,
# their systemd units, the root-owned settings file and tmpfiles declarations.
# All keys and passphrases are generated at RUNTIME into 0600 files under
# /etc/generalbots/credentials — none is present in this repository or image.
#
# NOTE ON HONESTY: the existing 20-secure-boot.conf documents that the base
# image has no LUKS/TPM flow. This drop-in ADDS the flow (loopback LUKS2 by
# default, optional TPM2 PCR-7 sealing) plus encrypted btrfs snapshots with
# retention and a rescue-preserving "Reset this PC". First-boot provisioning,
# recovery-key export, wrong-passphrase/no-TPM and destructive restore tests
# still require a VM / hardware to verify; see the driver's report.
#
# ExtraTrees is a collection, so this appends to the default mkosi.extra/ tree
# without modifying it. Config drop-ins are parsed before profiles, so a
# release/secure-boot profile can still override signing settings.
[Content]
ExtraTrees=data-protection/extra:/
Packages=
    cryptsetup-bin
    btrfs-progs
    rsync
    gnupg
