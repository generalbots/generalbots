# Secure Boot / TPM / A-B hardening (issue #1846, signing work #2478).
#
# DEVELOPMENT DEFAULT — unsigned, bootable without any key material:
#   SecureBoot=no             -> mkosi does not sign anything and never aborts
#                                for a missing key (the old failure mode that
#                                left the image with no bootable kernel).
#   UnifiedKernelImages=unsigned -> a UKI is still BUILT, just not signed.
# This is the image `mkosi vm` boots with Secure Boot off. It is also what the
# release workflow publishes today; see README.md ("Secure Boot boot failure
# fallback") for the documented firmware fallback on stock laptops.
#
# RELEASE / SIGNED BUILD — policy lives in
#   desktop/os/mkosi.profiles/secure-boot-release.conf
# and is activated by:
#   desktop/os/build-image.sh --mode release \
#       --key /secure/path/db.key --cert /secure/path/db.crt
# The wrapper refuses to build if signing keys are missing or malformed, then
# passes --profile=secure-boot-release plus the key/cert paths to mkosi.
# Profiles are parsed AFTER mkosi.conf.d/, so the release values win.
# Keys are generated at build time (generate-secure-boot-keys.sh) or injected
# from an offline production store — NEVER checked into this repository.
#
# To exercise the signed path on OVMF with Secure Boot enabled and Microsoft
# keys enrolled (the CI gate): build-image.sh --mode release --smoke. The
# generated MOK certificate is enrolled with `mokutil --import db.cer` on real
# hardware. See desktop/os/README.md for the full enrolment runbook.
[Content]
UnifiedKernelImages=unsigned

[Validation]
# mkosi 27 reads signing settings from [Validation]; the release signing
# profile (parsed after this drop-in) overrides it with SecureBoot=yes.
SecureBoot=no

# DATA AT REST (#2470): this image does NOT currently provision LUKS or seal a
# disk key with TPM 2.0. systemd-cryptenroll is not wired into the installer or
# provisioning wizard, and there is no LUKS mapping in the image recipe. Any
# future claim about encryption, TPM sealing, recovery keys, backup/snapshot or
# reset must land with the implementation and verification evidence.

# SECURE BOOT BOOT FAILURE (#2478, current image is unsigned): on machines with
# Secure Boot enabled the firmware may refuse to boot this image. The supported
# fallback today is to disable Secure Boot in firmware/BIOS setup and boot
# again. See desktop/os/README.md ("Secure Boot boot failure fallback") for
# common firmware key/menu names. Signed UKI/bootloader policy, MOK enrolment,
# release-build key enforcement, OVMF CI tests and recovery-screen integration
# are follow-up work.
