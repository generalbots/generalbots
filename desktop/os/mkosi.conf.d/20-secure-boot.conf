# Secure Boot / TPM / A-B hardening (issue #1846).
#
# Enabled by default on the appliance image: mkosi signs the UKI with an
# auto-generated development key pair (stored alongside the image) so the
# image boots on Secure Boot-enabled firmware. Replace these with a real
# key pair (SecureBootKey=/SecureBootCertificate=) for production signing.
[Content]
SecureBoot=yes
UnifiedKernelImages=signed
# TPM 2.0 sealing of the root volume is performed at first boot by the
# provisioning wizard (systemd-cryptenroll) when a TPM is present.