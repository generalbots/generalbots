# Secure Boot / TPM / A-B hardening (issue #1846).
#
# Off until a signing key pair exists in the tree. mkosi aborts the build with
# "SecureBoot= is enabled but no secure boot key is configured" when the flag is
# on and no key is present, which is why the appliance image never produced a
# .raw. Re-enable together with SecureBootKey=/SecureBootCertificate= (a real
# production pair) and `mkosi genkey` for development images.
[Content]
SecureBoot=no
UnifiedKernelImages=signed
# TPM 2.0 sealing of the root volume is performed at first boot by the
# provisioning wizard (systemd-cryptenroll) when a TPM is present.