# General Bots OS — user-data protection settings (#2470).
# Root-owned, 0644. Contains NO secrets: every key/passphrase is generated at
# RUNTIME by provision.sh from /dev/urandom into a 0600 file under KEY_DIR.
#
# DEVICE: block device to encrypt. Leave empty to use a LUKS loopback file
#   (works on the stock image without repartitioning). For a real dedicated
#   data partition, set e.g. /dev/disk/by-partlabel/gbdata -- systemd-repart
#   must create it first (build-image/repart wiring is a VM-gated follow-up).
DEVICE=""

# Loopback backing file (used only when DEVICE is empty).
DATA_FILE="/var/lib/gbdesk-private/data.img"
DATA_FILE_SIZE_MB="8192"

# dm-crypt mapping and btrfs layout for the encrypted user-data volume.
MAPPER_NAME="gbdata"
MOUNT_POINT="/var/lib/gbdesk"
STAGE_MOUNT="/mnt/gbdata-stage"
SUBVOLUME="@data"
SNAPSHOT_SUBDIR=".gb-snapshots"

# Private, root-owned paths. Nothing here is ever committed to the repository.
KEY_DIR="/etc/generalbots/credentials"
MAIN_KEY_FILE="$KEY_DIR/luks-main.bin"
RECOVERY_KEY_FILE="$KEY_DIR/luks-recovery.txt"
ARCHIVE_KEY_FILE="$KEY_DIR/snapshot-archive.bin"
EXPORT_KEY_FILE="$KEY_DIR/export-passphrase.txt"
INIT_FLAG="/etc/generalbots/data-protection.initialized"
PRIVATE_DIR="/var/lib/gbdesk-private"
ARCHIVE_DIR="$PRIVATE_DIR/snapshots"
EXPORT_DIR="$PRIVATE_DIR/exports"

# Retention: keep the newest 7 daily snapshots plus one per week for 4 weeks.
SNAPSHOT_KEEP_DAILY="7"
SNAPSHOT_KEEP_WEEKLY="4"
SNAPSHOT_PREFIX="gbdesk"
SNAPSHOT_ENCRYPT_ARCHIVE="1"

# Reset/restore must never touch these. They carry the masked-appliance rescue
# path (see mkosi.finalize.chroot: rescue/emergency shells are masked).
PROTECTED_DEVICES="/dev/disk/by-partlabel/gbrescue /dev/disk/by-partlabel/gb-rescue /dev/disk/by-partlabel/EFI /dev/disk/by-partlabel/root"
