# Private, root-owned state for the encrypted user-data volume (#2470).
# No secrets are shipped in the image; these directories are created empty.
d /var/lib/gbdesk-private        0700 root root -
d /var/lib/gbdesk-private/snapshots 0700 root root -
d /var/lib/gbdesk-private/exports 0700 root root -
d /run/gb-data-protection        0755 root root -
