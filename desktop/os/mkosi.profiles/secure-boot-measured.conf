# Optional measured boot (#2478). Enable together with the release profile:
#   desktop/os/build-image.sh --mode release -- --profile=secure-boot-measured
#
# mkosi measures the UKI components with systemd-measure and embeds the signed
# PCR values in the UKI. `pcrs` also writes a JSON file next to the output that
# can be attached to the diagnostics bundle (#2468). Requires systemd-measure
# in the build tools tree (present in the Debian sid tools tree used by CI).

[Validation]
SignExpectedPcr=yes

[Output]
SplitArtifacts=pcrs
