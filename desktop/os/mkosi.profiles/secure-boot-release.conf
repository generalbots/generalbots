# Release-only UEFI Secure Boot signing policy (#2478).
#
# Activated by desktop/os/build-image.sh --mode release, which ALSO passes
# --secure-boot-key= / --secure-boot-certificate= on the mkosi command line.
# Profiles are parsed after mkosi.conf.d/, so this overrides the development
# defaults in 20-secure-boot.conf (SecureBoot=no, UnifiedKernelImages=unsigned).
#
# Trust chain (stock laptop with Microsoft keys in db):
#   firmware -> distro-signed shim (shim-signed) -> our MOK certificate
#   -> signed systemd-boot -> signed UKI
# The MOK certificate is the DER file produced by
# desktop/os/generate-secure-boot-keys.sh (`mokutil --import db.cer`).

[Content]
UnifiedKernelImages=signed
# Install the distribution's Microsoft-signed shim; mkosi does not re-sign it.
# shim then trusts our key from MokList (enrolled by mokutil or the OVMF test
# firmware variables). Keeping shim in the image is what lets a stock laptop
# boot a locally signed kernel without disabling Secure Boot.
ShimBootloader=signed
Packages=shim-signed

[Validation]
SecureBoot=yes
# Bare metal: the operator imports the MOK certificate explicitly (or enrolls
# the key in firmware). For the CI/OVMF test the build wrapper overrides the
# firmware variables with `microsoft-mok`, which pre-enrols the same cert.
SecureBootAutoEnroll=no
# Key and certificate paths are intentionally NOT set here — they are injected
# at build time by build-image.sh from GB_SB_KEY / GB_SB_CERT. Never commit a
# private key to this repository.
