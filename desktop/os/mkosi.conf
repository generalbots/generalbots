# General Bots OS — the desktop edition as the whole operating system.
#
# A Debian 13 (trixie) appliance where the General Bots desktop shell
# (botapp + botserver sidecar) is the ONLY user interface. This is kiosk
# option B from the shell-replacement discussion — the more secure one:
#   * no display manager, no greeter, no X11: cage (Wayland compositor) is
#     the "shell", and the only graphical client it may ever run is the
#     General Bots launcher at /opt/general-bots/start.sh;
#   * the kiosk user is a system account with /usr/sbin/nologin and home
#     /var/lib/gbdesk — there is no user shell to reach, no ssh server and
#     no terminal emulator in the image; rescue/emergency shells are masked
#     (mkosi.finalize.chroot), recovery = reprovision from a fresh image;
#   * tty1 belongs exclusively to generalbots-shell.service, which respawns
#     on crash exactly like a display manager respawns a session;
#   * built with mkosi — the same tooling IncusOS is built with — so the
#     Secure Boot / TPM 2.0 / A-B-update hardening can be layered on later
#     without changing build system.
#
# The General Bots payload itself is NOT a distro package: CI downloads the
# release tarball (generalbots-linux-x86_64.tar.gz — the artifact that is
# guaranteed to exist; the .deb/rpm/AppImage bundler step is best-effort and
# has historically produced nothing) and unpacks it into
# mkosi.extra/opt/general-bots/ before mkosi runs. start.sh + ui/ + botserver
# stay read-only there; all mutable state lives in /var/lib/gbdesk.
#
# Overrides:
#   desktop/os/mkosi.conf.d/10-eltorito.conf — emits a real hybrid ISO
#   (El Torito) automatically once the build environment's systemd-repart
#   is ≥ 261; otherwise the output is the equivalent GPT disk image (.raw),
#   bootable via UEFI, written with dd (see README.md).
#
# CI: .github/workflows/desktop-os-iso.yml

[Distribution]
Distribution=debian
Release=trixie
# mkosi 27 enums spell this "x86-64" (underscores are normalized to dashes).
Architecture=x86-64

[Output]
Format=disk
Output=generalbots-os
# Room for the first-boot provisioning (service stack + local model) done by
# the setup wizard into the kiosk user's home. mkosi/systemd-repart only
# allocates what the filesystem actually needs and lets the root partition
# grow on first boot, so the artifact stays small despite the 16G cap.
OutputSize=16G

[Content]
Bootable=yes
Packages=
    linux-image-amd64
    dracut
    cage
    dbus
    systemd-resolved
    fonts-dejavu-core
    ca-certificates
    libpq5
    libwebkit2gtk-4.1-0
    libssl3
    bash

[Build]
ToolsTree=default
