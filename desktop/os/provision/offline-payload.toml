group = "local_model"
source = "3rdparty.toml:[components.llm_linux_vulkan] (selected on Vulkan hosts)"

[[payload]]
id = "deepseek_small"
key = "deepseek_small"
section = "models"
filename = "DeepSeek-R1-Distill-Qwen-1.5B-Q3_K_M.gguf"
sha256 = "b1094879ee7e222cba5be013e6de2d0658c64f91aef5d3c9bff0db5cefbfa020"
group = "local_model"
source = "installer_regs/register_drive.rs:210 (llm data_download_list)"

[[payload]]
id = "bge_embedding"
key = "bge_embedding"
section = "models"
filename = "bge-small-en-v1.5-f32.gguf"
sha256 = "bf40c42ad7d89382e9ba7376d5c4b73f6b556cb541fab37aaa1da9c320149b65"
group = "local_model"
source = "installer_regs/register_drive.rs:211 (llm data_download_list)"

[[payload]]
