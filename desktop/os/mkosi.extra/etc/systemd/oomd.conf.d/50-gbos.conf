# #2464 — early memory-pressure intervention. Kills are decided by ManagedOOM*
# properties on slices/services (see drop-ins): the shell/compositor must outlive
# recoverable workloads so a memory spike degrades the sidecar, not the UI.
[OOM]
SwapUsedLimit=90%
DefaultMemoryPressureLimit=60%
DefaultMemoryPressureDurationSec=20s
