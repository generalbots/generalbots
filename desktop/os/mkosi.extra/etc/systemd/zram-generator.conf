# #2464 — compressed swap in RAM so 4–8 GB laptops survive chat + model + drive
# uploads without the OOM killer taking the shell. Sized to half of RAM but
# capped to keep pressure predictable; zstd keeps CPU cost low on small devices.
# Runtime/soak verification (4 GB VM, 1 h) is CI/hardware-gated follow-up.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
