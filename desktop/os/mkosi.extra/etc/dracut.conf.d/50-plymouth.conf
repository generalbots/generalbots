# Pull the Plymouth graphical boot module into the initrd so the
# General Bots theme (configured in /etc/plymouth/plymouthd.conf) is
# visible from the very first frame of boot — not only after the root
# filesystem is mounted and the full Plymouth daemon starts.
#
# Without this entry dracut skips the plymouth module even though the
# package is installed, so the initrd plays a blank screen until the
# root pivot, losing the first ~10 s of the branded boot sequence.
add_dracutmodules+=" plymouth "
