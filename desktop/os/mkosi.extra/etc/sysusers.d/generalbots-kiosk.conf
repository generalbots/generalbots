# Kiosk user: a system account, no login shell, no home dotfiles. The video
# and render memberships give libseat/compositor access to the DRM devices
# and the GPU accelerator node (systemd-sysusers runs during the build).
u gbdesk - "General Bots kiosk shell" /var/lib/gbdesk /usr/sbin/nologin
m gbdesk video
m gbdesk render

# #2498 — the botserver/Vault sidecar runs as its own account. The credential
# directory is root:gbsvc 0750, so the kiosk webview (gbdesk) is outside the
# secret-store permission boundary even though it shares the machine.
u gbsvc - "General Bots services (secret store owner)" /nonexistent /usr/sbin/nologin
