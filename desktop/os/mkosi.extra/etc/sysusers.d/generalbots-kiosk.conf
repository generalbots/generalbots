# Kiosk user: a system account, no login shell, no home dotfiles. The video
# and render memberships give libseat/compositor access to the DRM devices
# and the GPU accelerator node (systemd-sysusers runs during the build).
u gbdesk - "General Bots kiosk shell" /var/lib/gbdesk /usr/sbin/nologin
m gbdesk video
m gbdesk render
