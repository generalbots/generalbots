<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg { fill: #1a1a2e; }
        .panel-bg { fill: #16213e; }
        .card-bg { fill: #0f3460; }
        .main-text { fill: #e0e0e0; }
        .secondary-text { fill: #b0b0b0; }
        .muted-text { fill: #808080; }
        .white-text { fill: #ffffff; }
        .accent-text { fill: #3b82f6; }
        .border { stroke: #2a2a4a; stroke-width: 1; fill: none; }
        .card-border { stroke: #2a2a4a; stroke-width: 1; fill: #0f3460; }
        .tab-active { fill: #3b82f6; }
        .tab-inactive { fill: #2a2a4a; }
        .upload-zone { fill: #0f3460; stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 8 4; }
        .result-bg { fill: #0f3460; }
        .history-item { fill: #16213e; }
        .badge-ocr { fill: #22c55e; }
        .badge-obj { fill: #8b5cf6; }
        .badge-damage { fill: #f59e0b; }
        .btn-primary { fill: #3b82f6; }
      }
      @media (prefers-color-scheme: light) {
        .bg { fill: #f5f5f5; }
        .panel-bg { fill: #ffffff; }
        .card-bg { fill: #f8fafc; }
        .main-text { fill: #1e293b; }
        .secondary-text { fill: #475569; }
        .muted-text { fill: #94a3b8; }
        .white-text { fill: #ffffff; }
        .accent-text { fill: #2563eb; }
        .border { stroke: #e2e8f0; stroke-width: 1; fill: none; }
        .card-border { stroke: #e2e8f0; stroke-width: 1; fill: #f8fafc; }
        .tab-active { fill: #2563eb; }
        .tab-inactive { fill: #e2e8f0; }
        .upload-zone { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 8 4; }
        .result-bg { fill: #f8fafc; }
        .history-item { fill: #f1f5f9; }
        .badge-ocr { fill: #16a34a; }
        .badge-obj { fill: #7c3aed; }
        .badge-damage { fill: #d97706; }
        .btn-primary { fill: #2563eb; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="900" height="600" rx="0"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" class="main-text">Reconhecimento de Imagens</text>

  <!-- Main Panel -->
  <rect class="panel-bg" x="20" y="60" width="860" height="520" rx="8" stroke-width="1"/>
  <rect class="border" x="20" y="60" width="860" height="520" rx="8"/>

  <!-- Tab Bar -->
  <rect class="tab-active" x="40" y="75" width="80" height="28" rx="6"/>
  <text x="80" y="94" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" class="white-text">OCR</text>
  <rect class="tab-inactive" x="130" y="75" width="140" height="28" rx="6"/>
  <text x="200" y="94" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="secondary-text">Deteccao de Objetos</text>
  <rect class="tab-inactive" x="280" y="75" width="130" height="28" rx="6"/>
  <text x="345" y="94" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="secondary-text">Analise de Danos</text>
  <rect class="tab-inactive" x="420" y="75" width="160" height="28" rx="6"/>
  <text x="500" y="94" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="secondary-text">Reconhecimento de Placas</text>

  <!-- Upload Area -->
  <rect class="upload-zone" x="40" y="115" width="400" height="220" rx="8"/>
  <!-- Image Icon -->
  <rect x="210" y="170" width="60" height="50" rx="4" fill="none" stroke-width="2"/>
  <circle cx="225" cy="182" r="5" fill="none" stroke-width="2"/>
  <polyline points="210,210 230,190 250,205 260,195 280,210" fill="none" stroke-width="2"/>
  <text x="240" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" class="main-text">Drag &amp; drop image here</text>
  <text x="240" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" class="muted-text">or click to browse</text>
  <rect class="btn-primary" x="190" y="280" width="100" height="32" rx="6"/>
  <text x="240" y="301" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" class="white-text">Upload</text>

  <!-- Results Panel -->
  <rect x="460" y="115" width="400" height="220" rx="8" class="card-border"/>
  <rect x="461" y="116" width="398" height="218" rx="7" class="result-bg"/>
  <text x="480" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" class="main-text">Results</text>
  <rect class="border" x="480" y="150" width="360" height="1" rx="0"/>
  <!-- Placeholder content -->
  <text x="660" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" class="muted-text">Upload an image to see</text>
  <text x="660" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" class="muted-text">recognition results here</text>
  <text x="660" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" class="muted-text">&#x1F4F7;</text>

  <!-- History Panel -->
  <text x="40" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" class="main-text">Recent Analyses</text>

  <!-- History Item 1 -->
  <rect class="card-border" x="40" y="375" width="820" height="45" rx="6"/>
  <rect class="card-bg" x="41" y="376" width="818" height="43" rx="5"/>
  <rect class="badge-ocr" x="55" y="388" width="40" height="18" rx="9"/>
  <text x="75" y="401" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" class="white-text">OCR</text>
  <text x="110" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" class="main-text">invoice_001.pdf</text>
  <text x="300" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="muted-text">Extracted: R$ 4.520,00 - Acme Corp</text>
  <text x="830" y="402" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" class="muted-text">2 min ago</text>

  <!-- History Item 2 -->
  <rect class="card-border" x="40" y="425" width="820" height="45" rx="6"/>
  <rect class="card-bg" x="41" y="426" width="818" height="43" rx="5"/>
  <rect class="badge-obj" x="55" y="438" width="28" height="18" rx="9"/>
  <text x="69" y="451" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" class="white-text">OBJ</text>
  <text x="100" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" class="main-text">warehouse_photo.jpg</text>
  <text x="300" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="muted-text">Detected: 12 objects, 3 zones</text>
  <text x="830" y="452" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" class="muted-text">15 min ago</text>

  <!-- History Item 3 -->
  <rect class="card-border" x="40" y="475" width="820" height="45" rx="6"/>
  <rect class="card-bg" x="41" y="476" width="818" height="43" rx="5"/>
  <rect class="badge-damage" x="55" y="488" width="60" height="18" rx="9"/>
  <text x="85" y="501" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" class="white-text">DAMAGE</text>
  <text x="130" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" class="main-text">vehicle_front.png</text>
  <text x="300" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="muted-text">Damage score: 72% - bumper, headlight</text>
  <text x="830" y="502" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" class="muted-text">1 hour ago</text>

  <!-- Status Bar -->
  <text x="450" y="550" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" class="muted-text">OCR Engine: Ready | GPU: Available | Model: v2.4.1</text>
</svg>