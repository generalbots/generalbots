<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .panel-bg { fill: #f8fafc; }
    .main-text { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
    .secondary-text { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; }
    .muted-text { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
    .white-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .accent-text { fill: #ef4444; font-family: system-ui, -apple-system, sans-serif; }
    .green-text { fill: #22c55e; font-family: system-ui, -apple-system, sans-serif; }
    .red-text { fill: #ef4444; font-family: system-ui, -apple-system, sans-serif; }
    .border { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .icon-btn { fill: #f1f5f9; }
    .card-bg { fill: #f8fafc; }
    .tab-active { fill: #fef2f2; }
    .tab-inactive { fill: transparent; }
    .score-ring { stroke: #22c55e; stroke-width: 8; fill: none; stroke-linecap: round; }
    .score-bg { stroke: #e2e8f0; stroke-width: 8; fill: none; }
    .row-alt { fill: #f8fafc; }
    .status-high { fill: #fee2e2; }
    .status-medium { fill: #fef3c7; }
    .status-low { fill: #dcfce7; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .panel-bg { fill: #1e293b; }
      .main-text { fill: #e2e8f0; }
      .secondary-text { fill: #94a3b8; }
      .muted-text { fill: #64748b; }
      .accent-text { fill: #f87171; }
      .green-text { fill: #4ade80; }
      .red-text { fill: #f87171; }
      .border { stroke: #334155; }
      .icon-btn { fill: #334155; }
      .card-bg { fill: #1e293b; }
      .tab-active { fill: #450a0a; }
      .score-bg { stroke: #334155; }
      .row-alt { fill: #1e293b; }
      .status-high { fill: #450a0a; }
      .status-medium { fill: #451a03; }
      .status-low { fill: #14532d; }
    }
  </style>

  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="600" class="main-text">Security</text>

  <rect x="30" y="40" width="840" height="530" rx="8" class="bg"/>
  <rect x="30" y="40" width="840" height="530" rx="8" class="border"/>

  <!-- Tab Bar -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="840" height="42" class="panel-bg"/>
    <line x1="0" y1="42" x2="840" y2="42" class="border"/>
    <g transform="translate(20, 0)">
      <rect x="0" y="2" width="80" height="38" rx="6" class="tab-active"/>
      <text x="40" y="26" text-anchor="middle" font-size="13" font-weight="500" class="accent-text">Overview</text>
    </g>
    <g transform="translate(115, 0)">
      <text x="40" y="26" text-anchor="middle" font-size="13" class="secondary-text">Rules</text>
    </g>
    <g transform="translate(200, 0)">
      <text x="40" y="26" text-anchor="middle" font-size="13" class="secondary-text">Audit</text>
    </g>
    <g transform="translate(290, 0)">
      <text x="40" y="26" text-anchor="middle" font-size="13" class="secondary-text">Firewall</text>
    </g>
    <g transform="translate(395, 0)">
      <text x="55" y="26" text-anchor="middle" font-size="13" class="secondary-text">Encryption</text>
    </g>
  </g>

  <!-- Security Score Card -->
  <g transform="translate(55, 100)">
    <rect x="0" y="0" width="200" height="200" rx="12" class="card-bg"/>
    <rect x="0" y="0" width="200" height="200" rx="12" class="border"/>
    <text x="100" y="30" text-anchor="middle" font-size="13" font-weight="600" class="main-text">Security Score</text>

    <!-- Score Ring Background -->
    <circle cx="100" cy="110" r="60" class="score-bg"/>
    <!-- Score Ring Progress (92%) -->
    <circle cx="100" cy="110" r="60" class="score-ring" stroke-dasharray="345 377" transform="rotate(-90, 100, 110)"/>

    <!-- Score Number -->
    <text x="100" y="105" text-anchor="middle" font-size="36" font-weight="700" class="green-text">92</text>
    <text x="100" y="125" text-anchor="middle" font-size="14" class="muted-text">/100</text>

    <text x="100" y="185" text-anchor="middle" font-size="11" class="green-text">Excellent</text>
  </g>

  <!-- Quick Stats -->
  <g transform="translate(280, 100)">
    <rect x="0" y="0" width="570" height="60" rx="10" class="card-bg"/>
    <rect x="0" y="0" width="570" height="60" rx="10" class="border"/>

    <g transform="translate(20, 10)">
      <text x="0" y="15" font-size="11" class="muted-text">Critical</text>
      <text x="0" y="40" font-size="22" font-weight="700" class="red-text">2</text>
    </g>
    <line x1="110" y1="10" x2="110" y2="50" class="border"/>

    <g transform="translate(130, 10)">
      <text x="0" y="15" font-size="11" class="muted-text">Warnings</text>
      <text x="0" y="40" font-size="22" font-weight="700" class="accent-text">8</text>
    </g>
    <line x1="240" y1="10" x2="240" y2="50" class="border"/>

    <g transform="translate(260, 10)">
      <text x="0" y="15" font-size="11" class="muted-text">Passed</text>
      <text x="0" y="40" font-size="22" font-weight="700" class="green-text">147</text>
    </g>
    <line x1="370" y1="10" x2="370" y2="50" class="border"/>

    <g transform="translate(390, 10)">
      <text x="0" y="15" font-size="11" class="muted-text">Last Scan</text>
      <text x="0" y="40" font-size="14" font-weight="500" class="main-text">3m ago</text>
    </g>

    <g transform="translate(490, 12)">
      <rect x="0" y="0" width="60" height="36" rx="6" fill="url(#accentGrad)"/>
      <text x="30" y="23" text-anchor="middle" font-size="11" class="white-text">Scan</text>
    </g>
  </g>

  <!-- Recent Security Events Table -->
  <g transform="translate(280, 180)">
    <rect x="0" y="0" width="570" height="300" rx="10" class="card-bg"/>
    <rect x="0" y="0" width="570" height="300" rx="10" class="border"/>
    <text x="20" y="28" font-size="14" font-weight="600" class="main-text">Recent Security Events</text>
    <text x="490" y="28" font-size="11" class="accent-text">View all →</text>

    <!-- Table Header -->
    <line x1="10" y1="42" x2="560" y2="42" class="border"/>
    <text x="20" y="58" font-size="11" font-weight="600" class="muted-text">TIME</text>
    <text x="130" y="58" font-size="11" font-weight="600" class="muted-text">EVENT</text>
    <text x="370" y="58" font-size="11" font-weight="600" class="muted-text">SOURCE</text>
    <text x="490" y="58" font-size="11" font-weight="600" class="muted-text">SEVERITY</text>

    <!-- Row 1 -->
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="570" height="42" class="row-alt"/>
      <text x="20" y="27" font-size="12" class="main-text">14:32:08</text>
      <text x="130" y="27" font-size="12" class="main-text">Failed login attempt (3x)</text>
      <text x="370" y="27" font-size="12" class="secondary-text">203.0.113.42</text>
      <rect x="490" y="8" width="60" height="22" rx="4" class="status-high"/>
      <text x="520" y="24" text-anchor="middle" font-size="10" class="red-text">Critical</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 107)">
      <text x="20" y="27" font-size="12" class="main-text">14:28:15</text>
      <text x="130" y="27" font-size="12" class="main-text">Firewall rule updated</text>
      <text x="370" y="27" font-size="12" class="secondary-text">admin@system</text>
      <rect x="490" y="8" width="60" height="22" rx="4" class="status-low"/>
      <text x="520" y="24" text-anchor="middle" font-size="10" class="green-text">Low</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 149)">
      <rect x="0" y="0" width="570" height="42" class="row-alt"/>
      <text x="20" y="27" font-size="12" class="main-text">14:15:42</text>
      <text x="130" y="27" font-size="12" class="main-text">SSL certificate renewed</text>
      <text x="370" y="27" font-size="12" class="secondary-text">auto-renewal</text>
      <rect x="490" y="8" width="60" height="22" rx="4" class="status-low"/>
      <text x="520" y="24" text-anchor="middle" font-size="10" class="green-text">Info</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 191)">
      <text x="20" y="27" font-size="12" class="main-text">13:58:03</text>
      <text x="130" y="27" font-size="12" class="main-text">Unauthorized API access</text>
      <text x="370" y="27" font-size="12" class="secondary-text">198.51.100.7</text>
      <rect x="490" y="8" width="60" height="22" rx="4" class="status-high"/>
      <text x="520" y="24" text-anchor="middle" font-size="10" class="red-text">Critical</text>
    </g>

    <!-- Row 5 -->
    <g transform="translate(0, 233)">
      <rect x="0" y="0" width="570" height="42" class="row-alt"/>
      <text x="20" y="27" font-size="12" class="main-text">13:45:19</text>
      <text x="130" y="27" font-size="12" class="main-text">Vulnerability scan completed</text>
      <text x="370" y="27" font-size="12" class="secondary-text">scanner@local</text>
      <rect x="490" y="8" width="60" height="22" rx="4" class="status-medium"/>
      <text x="520" y="24" text-anchor="middle" font-size="10" class="accent-text">Medium</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(55, 560)">
    <text x="0" y="0" font-size="10" class="muted-text">S = Run scan | R = Refresh | E = Export report | F = Filter events</text>
  </g>
</svg>