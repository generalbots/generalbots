<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel-bg { fill: #ffffff; }
      .main-text { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
      .secondary-text { fill: #475569; font-family: system-ui, -apple-system, sans-serif; }
      .muted-text { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
      .white-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
      .accent-text { fill: #22c55e; font-family: system-ui, -apple-system, sans-serif; }
      .border { stroke: #e2e8f0; stroke-width: 1; fill: none; }
      .icon-btn { fill: #f1f5f9; rx: 6; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0f172a; }
        .panel-bg { fill: #1e293b; }
        .main-text { fill: #f1f5f9; }
        .secondary-text { fill: #cbd5e1; }
        .muted-text { fill: #64748b; }
        .white-text { fill: #f1f5f9; }
        .accent-text { fill: #4ade80; }
        .border { stroke: #334155; }
        .icon-btn { fill: #334155; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" class="bg" rx="0"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" class="main-text" font-size="18" font-weight="600">Enterprise ERP</text>

  <!-- Main Card -->
  <rect x="16" y="52" width="868" height="536" rx="8" class="panel-bg"/>
  <rect x="16" y="52" width="868" height="536" rx="8" class="border"/>

  <!-- Tab Bar -->
  <rect x="16" y="52" width="140" height="36" rx="6" fill="#22c55e" opacity="0.1"/>
  <text x="42" y="75" class="accent-text" font-size="12" font-weight="500">Financial</text>
  <text x="184" y="75" class="secondary-text" font-size="12">Inventory</text>
  <text x="300" y="75" class="secondary-text" font-size="12">Procurement</text>
  <text x="430" y="75" class="secondary-text" font-size="12">Multi-Branch</text>

  <!-- Stats Row -->
  <!-- Revenue -->
  <rect x="28" y="104" width="200" height="72" rx="8" class="panel-bg"/>
  <rect x="28" y="104" width="200" height="72" rx="8" class="border"/>
  <text x="44" y="128" class="muted-text" font-size="11">Revenue</text>
  <text x="44" y="154" class="main-text" font-size="22" font-weight="700">$124K</text>

  <!-- Expenses -->
  <rect x="240" y="104" width="200" height="72" rx="8" class="panel-bg"/>
  <rect x="240" y="104" width="200" height="72" rx="8" class="border"/>
  <text x="256" y="128" class="muted-text" font-size="11">Expenses</text>
  <text x="256" y="154" class="main-text" font-size="22" font-weight="700">$89K</text>

  <!-- Net Profit -->
  <rect x="452" y="104" width="200" height="72" rx="8" class="panel-bg"/>
  <rect x="452" y="104" width="200" height="72" rx="8" class="border"/>
  <text x="468" y="128" class="muted-text" font-size="11">Net Profit</text>
  <text x="468" y="154" class="accent-text" font-size="22" font-weight="700">$35K</text>

  <!-- Margin -->
  <rect x="664" y="104" width="200" height="72" rx="8" class="panel-bg"/>
  <rect x="664" y="104" width="200" height="72" rx="8" class="border"/>
  <text x="680" y="128" class="muted-text" font-size="11">Margin</text>
  <text x="680" y="154" class="accent-text" font-size="22" font-weight="700">28%</text>

  <!-- Accounts Receivable Label -->
  <text x="28" y="210" class="secondary-text" font-size="13" font-weight="600">Accounts Receivable</text>

  <!-- Table Header -->
  <rect x="28" y="222" width="840" height="32" rx="6" fill="#f1f5f9"/>
  <text x="44" y="242" class="secondary-text" font-size="12" font-weight="600">Invoice</text>
  <text x="140" y="242" class="secondary-text" font-size="12" font-weight="600">Client</text>
  <text x="360" y="242" class="secondary-text" font-size="12" font-weight="600">Amount</text>
  <text x="480" y="242" class="secondary-text" font-size="12" font-weight="600">Due Date</text>
  <text x="620" y="242" class="secondary-text" font-size="12" font-weight="600">Status</text>

  <!-- Row 1 -->
  <line x1="28" y1="262" x2="868" y2="262" class="border"/>
  <text x="44" y="280" class="secondary-text" font-size="12" font-family="monospace">INV-0042</text>
  <text x="140" y="280" class="secondary-text" font-size="12">Acme Corp</text>
  <text x="360" y="280" class="secondary-text" font-size="12" font-weight="500">$12,400</text>
  <text x="480" y="280" class="muted-text" font-size="12">2024-06-15</text>
  <rect x="620" y="266" width="64" height="20" rx="4" fill="#22c55e" opacity="0.15"/>
  <text x="630" y="280" fill="#22c55e" font-size="11" font-family="system-ui, -apple-system, sans-serif">Paid</text>

  <!-- Row 2 -->
  <line x1="28" y1="296" x2="868" y2="296" class="border"/>
  <text x="44" y="314" class="secondary-text" font-size="12" font-family="monospace">INV-0043</text>
  <text x="140" y="314" class="secondary-text" font-size="12">Beta Inc</text>
  <text x="360" y="314" class="secondary-text" font-size="12" font-weight="500">$8,750</text>
  <text x="480" y="314" class="muted-text" font-size="12">2024-06-22</text>
  <rect x="620" y="300" width="78" height="20" rx="4" fill="#f59e0b" opacity="0.15"/>
  <text x="628" y="314" fill="#f59e0b" font-size="11" font-family="system-ui, -apple-system, sans-serif">Pending</text>

  <!-- Row 3 -->
  <line x1="28" y1="330" x2="868" y2="330" class="border"/>
  <text x="44" y="348" class="secondary-text" font-size="12" font-family="monospace">INV-0044</text>
  <text x="140" y="348" class="secondary-text" font-size="12">Gamma LLC</text>
  <text x="360" y="348" class="secondary-text" font-size="12" font-weight="500">$5,200</text>
  <text x="480" y="348" class="muted-text" font-size="12">2024-07-01</text>
  <rect x="620" y="334" width="78" height="20" rx="4" fill="#3b82f6" opacity="0.15"/>
  <text x="628" y="348" fill="#3b82f6" font-size="11" font-family="system-ui, -apple-system, sans-serif">Sent</text>

  <line x1="28" y1="364" x2="868" y2="364" class="border"/>
</svg>
