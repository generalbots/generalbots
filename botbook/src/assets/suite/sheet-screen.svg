      <rect x="0" y="0" width="100" height="27" class="grid-border"/>
      <text x="10" y="18" font-size="12" font-weight="600" class="accent-text">Product</text>

      <rect x="100" y="0" width="100" height="27" fill="#f0fdf4"/>
