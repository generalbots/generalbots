    <rect x="0" y="0" width="100" height="22" class="col-header"/>
    <rect x="0" y="0" width="100" height="22" class="grid-border"/>
    <text x="50" y="16" text-anchor="middle" font-size="11" font-weight="500" class="secondary-text">A</text>

    <rect x="100" y="0" width="100" height="22" class="col-header"/>
    <rect x="100" y="0" width="100" height="22" class="grid-border"/>
    <text x="150" y="16" text-anchor="middle" font-size="11" font-weight="500" class="secondary-text">B</text>

    <rect x="200" y="0" width="100" height="22" class="col-header"/>
    <rect x="200" y="0" width="100" height="22" class="grid-border"/>
    <text x="250" y="16" text-anchor="middle" font-size="11" font-weight="500" class="secondary-text">C</text>

    <rect x="300" y="0" width="100" height="22" class="col-header"/>
    <rect x="300" y="0" width="100" height="22" class="grid-border"/>
    <text x="350" y="16" text-anchor="middle" font-size="11" font-weight="500" class="secondary-text">D</text>

    <rect x="400" y="0" width="100" height="22" class="col-header"/>
    <rect x="400" y="0" width="100" height="22" class="grid-border"/>
    <text x="450" y="16" text-anchor="middle" font-size="11" font-weight="500" class="secondary-text">E</text>

    <rect x="500" y="0" width="100" height="22" class="col-header"/>
    <rect x="500" y="0" width="100" height="22" class="grid-border"/>
    <text x="550" y="16" text-anchor="middle" font-size="11" font-weight="500" class="secondary-text">F</text>

    <rect x="600" y="0" width="100" height="22" class="col-header"/>
    <rect x="600" y="0" width="100" height="22" class="grid-border"/>
    <text x="650" y="16" text-anchor="middle" font-size="11" font-weight="500" class="secondary-text">G</text>

    <rect x="700" y="0" width="100" height="22" class="col-header"/>
    <rect x="700" y="0" width="100" height="22" class="grid-border"/>
