<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .panel-bg { fill: #f8fafc; }
    .main-text { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
    .secondary-text { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; }
    .muted-text { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
    .white-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .accent-text { fill: #22c55e; font-family: system-ui, -apple-system, sans-serif; }
    .border { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .icon-btn { fill: #f1f5f9; }
    .toolbar-active { fill: #f0fdf4; }
    .input-bg { fill: #f8fafc; }
    .grid-border { stroke: #e2e8f0; stroke-width: 0.5; fill: none; }
    .col-header { fill: #f8fafc; }
    .row-header { fill: #f8fafc; }
    .selected-cell { stroke: #22c55e; stroke-width: 2; fill: none; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .panel-bg { fill: #1e293b; }
      .main-text { fill: #e2e8f0; }
      .secondary-text { fill: #94a3b8; }
      .muted-text { fill: #64748b; }
      .accent-text { fill: #4ade80; }
      .border { stroke: #334155; }
      .icon-btn { fill: #334155; }
      .toolbar-active { fill: #14532d; }
      .input-bg { fill: #1e293b; }
      .grid-border { stroke: #334155; stroke-width: 0.5; }
      .col-header { fill: #1e293b; }
      .row-header { fill: #1e293b; }
    }
  </style>

  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="600" class="main-text">Untitled Spreadsheet</text>

  <rect x="30" y="40" width="840" height="530" rx="8" class="bg"/>
  <rect x="30" y="40" width="840" height="530" rx="8" class="border"/>

  <!-- Toolbar -->
  <rect x="30" y="40" width="840" height="44" class="panel-bg"/>
  <line x1="30" y1="84" x2="870" y2="84" class="border"/>

  <g transform="translate(45, 55)">
    <rect x="0" y="0" width="100" height="28" rx="4" class="icon-btn"/>
    <rect x="0" y="0" width="100" height="28" rx="4" class="border"/>
    <text x="10" y="19" font-size="12" class="main-text">Arial</text>

    <rect x="110" y="0" width="45" height="28" rx="4" class="icon-btn"/>
    <rect x="110" y="0" width="45" height="28" rx="4" class="border"/>
    <text x="120" y="19" font-size="12" class="main-text">11</text>

    <line x1="175" y1="2" x2="175" y2="26" class="border"/>

    <rect x="185" y="0" width="28" height="28" rx="4" class="toolbar-active"/>
    <text x="199" y="20" text-anchor="middle" font-size="13" font-weight="700" class="accent-text">B</text>

    <rect x="221" y="0" width="28" height="28" rx="4" class="icon-btn"/>
    <text x="235" y="20" text-anchor="middle" font-size="13" font-style="italic" class="main-text">I</text>

    <rect x="257" y="0" width="28" height="28" rx="4" class="icon-btn"/>
    <text x="271" y="20" text-anchor="middle" font-size="13" class="main-text">U</text>

    <line x1="300" y1="2" x2="300" y2="26" class="border"/>

    <rect x="310" y="0" width="28" height="28" rx="4" class="icon-btn"/>
    <text x="324" y="20" text-anchor="middle" font-size="12">#</text>

    <rect x="346" y="0" width="28" height="28" rx="4" class="icon-btn"/>
    <rect x="350" y="6" width="20" height="16" rx="2" fill="#f59e0b"/>
    <text x="360" y="18" text-anchor="middle" font-size="10" class="white-text">%</text>

    <line x1="390" y1="2" x2="390" y2="26" class="border"/>

    <rect x="400" y="0" width="28" height="28" rx="4" class="icon-btn"/>
    <text x="414" y="20" text-anchor="middle" font-size="12">+</text>

    <rect x="436" y="0" width="28" height="28" rx="4" class="icon-btn"/>
    <text x="450" y="20" text-anchor="middle" font-size="12">-</text>
