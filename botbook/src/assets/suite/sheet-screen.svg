    <rect x="100" y="0" width="740" height="26" class="input-bg"/>
    <rect x="100" y="0" width="740" height="26" class="border"/>
    <text x="115" y="17" font-size="12" class="main-text">=SUM(B2:B10)</text>
  </g>

  <line x1="30" y1="111" x2="870" y2="111" class="border"/>

