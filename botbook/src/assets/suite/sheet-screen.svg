      <rect x="0" y="162" width="30" height="27" class="grid-border"/>
      <text x="15" y="180" text-anchor="middle" font-size="11" class="secondary-text">7</text>

      <rect x="0" y="189" width="30" height="27" class="row-header"/>
      <rect x="0" y="189" width="30" height="27" class="grid-border"/>
      <text x="15" y="207" text-anchor="middle" font-size="11" class="secondary-text">8</text>

      <rect x="0" y="216" width="30" height="27" class="row-header"/>
      <rect x="0" y="216" width="30" height="27" class="grid-border"/>
      <text x="15" y="234" text-anchor="middle" font-size="11" class="secondary-text">9</text>

      <rect x="0" y="243" width="30" height="27" class="row-header"/>
      <rect x="0" y="243" width="30" height="27" class="grid-border"/>
      <text x="15" y="261" text-anchor="middle" font-size="11" class="secondary-text">10</text>

      <rect x="0" y="270" width="30" height="27" class="row-header"/>
      <rect x="0" y="270" width="30" height="27" class="grid-border"/>
      <text x="15" y="288" text-anchor="middle" font-size="11" class="secondary-text">11</text>

      <rect x="0" y="297" width="30" height="27" class="row-header"/>
      <rect x="0" y="297" width="30" height="27" class="grid-border"/>
      <text x="15" y="315" text-anchor="middle" font-size="11" class="secondary-text">12</text>

      <rect x="0" y="324" width="30" height="27" class="row-header"/>
      <rect x="0" y="324" width="30" height="27" class="grid-border"/>
      <text x="15" y="342" text-anchor="middle" font-size="11" class="secondary-text">13</text>

      <rect x="0" y="351" width="30" height="27" class="row-header"/>
      <rect x="0" y="351" width="30" height="27" class="grid-border"/>
      <text x="15" y="369" text-anchor="middle" font-size="11" class="secondary-text">14</text>

      <rect x="0" y="378" width="30" height="27" class="row-header"/>
      <rect x="0" y="378" width="30" height="27" class="grid-border"/>
      <text x="15" y="396" text-anchor="middle" font-size="11" class="secondary-text">15</text>
