      <rect x="0" y="81" width="30" height="27" class="row-header"/>
      <rect x="0" y="81" width="30" height="27" class="grid-border"/>
      <text x="15" y="99" text-anchor="middle" font-size="11" class="secondary-text">4</text>

      <rect x="0" y="108" width="30" height="27" class="row-header"/>
      <rect x="0" y="108" width="30" height="27" class="grid-border"/>
      <text x="15" y="126" text-anchor="middle" font-size="11" class="secondary-text">5</text>

      <rect x="0" y="135" width="30" height="27" class="row-header"/>
      <rect x="0" y="135" width="30" height="27" class="grid-border"/>
