      <rect x="0" y="81" width="100" height="27" class="grid-border"/>
      <text x="10" y="99" font-size="12" class="main-text">Widget C</text>

      <rect x="100" y="81" width="100" height="27"/>
      <rect x="100" y="81" width="100" height="27" class="grid-border"/>
      <text x="190" y="99" text-anchor="end" font-size="12" class="main-text">$6,200</text>

      <rect x="200" y="81" width="100" height="27"/>
      <rect x="200" y="81" width="100" height="27" class="grid-border"/>
      <text x="290" y="99" text-anchor="end" font-size="12" class="main-text">$7,800</text>

      <rect x="300" y="81" width="100" height="27"/>
      <rect x="300" y="81" width="100" height="27" class="grid-border"/>
      <text x="390" y="99" text-anchor="end" font-size="12" font-weight="500" class="main-text">$14,000</text>

      <!-- Empty rows 5-15 -->
