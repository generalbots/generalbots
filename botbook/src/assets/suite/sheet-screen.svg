      <rect x="0" y="27" width="100" height="27" class="grid-border"/>
      <text x="10" y="45" font-size="12" class="main-text">Widget A</text>

      <rect x="100" y="27" width="100" height="27"/>
      <rect x="100" y="27" width="100" height="27" class="grid-border"/>
      <text x="190" y="45" text-anchor="end" font-size="12" class="main-text">$12,450</text>

      <rect x="200" y="27" width="100" height="27"/>
      <rect x="200" y="27" width="100" height="27" class="grid-border"/>
      <text x="290" y="45" text-anchor="end" font-size="12" class="main-text">$15,230</text>

      <rect x="300" y="27" width="100" height="27"/>
      <rect x="300" y="27" width="100" height="27" class="grid-border"/>
      <text x="390" y="45" text-anchor="end" font-size="12" font-weight="500" class="main-text">$27,680</text>

