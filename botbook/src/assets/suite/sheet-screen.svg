        <line x1="0" y1="108" x2="800" y2="108" class="grid-border"/>
        <line x1="0" y1="135" x2="800" y2="135" class="grid-border"/>
        <line x1="0" y1="162" x2="800" y2="162" class="grid-border"/>
        <line x1="0" y1="189" x2="800" y2="189" class="grid-border"/>
        <line x1="0" y1="216" x2="800" y2="216" class="grid-border"/>
        <line x1="0" y1="243" x2="800" y2="243" class="grid-border"/>
        <line x1="0" y1="270" x2="800" y2="270" class="grid-border"/>
        <line x1="0" y1="297" x2="800" y2="297" class="grid-border"/>
        <line x1="0" y1="324" x2="800" y2="324" class="grid-border"/>
        <line x1="0" y1="351" x2="800" y2="351" class="grid-border"/>
        <line x1="0" y1="378" x2="800" y2="378" class="grid-border"/>
