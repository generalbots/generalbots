<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .panel-bg { fill: #f8fafc; }
    .main-text { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
    .secondary-text { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; }
    .muted-text { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
    .white-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .accent-text { fill: #22c55e; font-family: system-ui, -apple-system, sans-serif; }
    .border { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .icon-btn { fill: #f1f5f9; }
    .row-hover { fill: #f1f5f9; }
    .row-selected { fill: #f0fdf4; }
    .unread-bg { fill: #eff6ff; }
    .unread-dot { fill: #22c55e; }
    .nav-active { fill: #f0fdf4; }
    .green-dot { fill: #22c55e; }
    .bubble-user { fill: #3b82f6; }
    .bubble-bot { fill: #f1f5f9; }
    .input-bg { fill: #f8fafc; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .panel-bg { fill: #1e293b; }
      .main-text { fill: #e2e8f0; }
      .secondary-text { fill: #94a3b8; }
      .muted-text { fill: #64748b; }
      .accent-text { fill: #4ade80; }
      .border { stroke: #334155; }
      .icon-btn { fill: #334155; }
      .row-hover { fill: #1e293b; }
      .row-selected { fill: #14532d; }
      .nav-active { fill: #14532d; }
      .bubble-bot { fill: #334155; }
      .input-bg { fill: #1e293b; }
    }
  </style>

  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="600" class="main-text">Attendant Console</text>

  <rect x="30" y="40" width="840" height="530" rx="8" class="bg"/>
  <rect x="30" y="40" width="840" height="530" rx="8" class="border"/>

  <!-- Queue Sidebar (Column 1) -->
  <rect x="30" y="40" width="190" height="530" class="panel-bg"/>
  <line x1="220" y1="40" x2="220" y2="570" class="border"/>

  <!-- Queue Header -->
  <g transform="translate(45, 55)">
    <text x="0" y="12" font-size="14" font-weight="600" class="main-text">Queue</text>
    <rect x="110" y="-5" width="30" height="22" rx="11" fill="url(#accentGrad)"/>
    <text x="125" y="12" text-anchor="middle" font-size="11" font-weight="600" class="white-text">4</text>
  </g>

  <line x1="30" y1="80" x2="220" y2="80" class="border"/>

  <!-- Queue Items -->
  <g transform="translate(40, 90)">
    <!-- Active conversation -->
    <rect x="0" y="0" width="170" height="65" rx="6" class="row-selected"/>
    <circle cx="22" cy="20" r="14" fill="#3b82f6"/>
    <text x="22" y="25" text-anchor="middle" font-size="11" font-weight="600" class="white-text">MR</text>
    <text x="44" y="18" font-size="13" font-weight="500" class="main-text">Maria R.</text>
    <text x="44" y="35" font-size="11" class="muted-text">2m ago</text>
    <rect x="130" y="40" width="32" height="18" rx="9" fill="url(#accentGrad)"/>
    <text x="146" y="53" text-anchor="middle" font-size="10" font-weight="500" class="white-text">VIP</text>

    <!-- Waiting conversation -->
    <rect x="0" y="75" width="170" height="65" rx="6" class="icon-btn"/>
    <circle cx="22" cy="95" r="14" fill="#f59e0b"/>
    <text x="22" y="100" text-anchor="middle" font-size="11" font-weight="600" class="white-text">JL</text>
    <text x="44" y="93" font-size="13" font-weight="500" class="main-text">Joao L.</text>
    <text x="44" y="110" font-size="11" class="muted-text">5m ago</text>

    <!-- Waiting conversation -->
    <rect x="0" y="150" width="170" height="65" rx="6" class="icon-btn"/>
    <circle cx="22" cy="170" r="14" fill="#8b5cf6"/>
    <text x="22" y="175" text-anchor="middle" font-size="11" font-weight="600" class="white-text">PS</text>
    <text x="44" y="168" font-size="13" font-weight="500" class="main-text">Pedro S.</text>
    <text x="44" y="185" font-size="11" class="muted-text">8m ago</text>

    <!-- Waiting conversation -->
    <rect x="0" y="225" width="170" height="65" rx="6" class="icon-btn"/>
    <circle cx="22" cy="245" r="14" fill="#ec4899"/>
    <text x="22" y="250" text-anchor="middle" font-size="11" font-weight="600" class="white-text">CF</text>
    <text x="44" y="243" font-size="13" font-weight="500" class="main-text">Camila F.</text>
    <text x="44" y="260" font-size="11" class="muted-text">12m ago</text>
  </g>

  <!-- Chat Area (Column 2) -->
  <rect x="220" y="40" width="400" height="530" class="bg"/>

  <!-- Chat Header -->
  <g transform="translate(235, 55)">
    <circle cx="18" cy="0" r="18" fill="#3b82f6"/>
    <text x="18" y="5" text-anchor="middle" font-size="12" font-weight="600" class="white-text">MR</text>
    <text x="45" y="3" font-size="14" font-weight="600" class="main-text">Maria Rodriguez</text>
    <text x="45" y="22" font-size="12" class="accent-text">Online</text>
    <circle cx="77" cy="20" r="4" class="green-dot"/>

    <!-- Action Buttons -->
    <g transform="translate(320, -5)">
      <rect x="0" y="0" width="28" height="28" rx="6" class="icon-btn"/>
      <text x="14" y="19" text-anchor="middle" font-size="12">📞</text>
      <rect x="35" y="0" width="28" height="28" rx="6" class="icon-btn"/>
      <text x="49" y="19" text-anchor="middle" font-size="12">📹</text>
      <rect x="70" y="0" width="28" height="28" rx="6" class="icon-btn"/>
      <text x="84" y="19" text-anchor="middle" font-size="12">⋯</text>
    </g>
  </g>

  <line x1="220" y1="95" x2="620" y2="95" class="border"/>

  <!-- Chat Messages -->
  <g transform="translate(240, 115)">
    <!-- Bot message -->
    <rect x="0" y="0" width="240" height="45" rx="8" class="bubble-bot"/>
    <text x="15" y="20" font-size="13" class="main-text">Hello! How can I assist</text>
    <text x="15" y="38" font-size="13" class="main-text">you today?</text>
    <text x="260" y="40" font-size="10" class="muted-text">10:30</text>

    <!-- User message -->
    <g transform="translate(130, 65)">
      <rect x="0" y="0" width="250" height="45" rx="8" class="bubble-user"/>
      <text x="15" y="20" font-size="13" class="white-text">Hi! I need help with my</text>
      <text x="15" y="38" font-size="13" class="white-text">account billing issue</text>
    </g>
    <text x="130" y="120" font-size="10" class="muted-text" text-anchor="end">10:31</text>

    <!-- Bot message -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="250" height="65" rx="8" class="bubble-bot"/>
      <text x="15" y="20" font-size="13" class="main-text">I understand you have a</text>
      <text x="15" y="38" font-size="13" class="main-text">billing concern. Let me</text>
      <text x="15" y="56" font-size="13" class="main-text">look into that for you.</text>
    </g>
    <text x="260" y="200" font-size="10" class="muted-text">10:32</text>

    <!-- Typing indicator -->
    <g transform="translate(160, 210)">
      <rect x="0" y="0" width="120" height="35" rx="8" class="bubble-user"/>
      <circle cx="30" cy="18" r="4" fill="#ffffff" opacity="0.7"/>
      <circle cx="50" cy="18" r="4" fill="#ffffff" opacity="0.5"/>
      <circle cx="70" cy="18" r="4" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>

  <line x1="220" y1="490" x2="620" y2="490" class="border"/>

  <!-- Message Input -->
  <g transform="translate(230, 500)">
    <rect x="0" y="0" width="340" height="36" rx="8" class="input-bg"/>
    <rect x="0" y="0" width="340" height="36" rx="8" class="border"/>
    <text x="15" y="23" font-size="13" class="muted-text">Type a message...</text>

    <rect x="350" y="0" width="36" height="36" rx="8" fill="url(#accentGrad)"/>
    <text x="368" y="24" text-anchor="middle" font-size="14" class="white-text">➤</text>
  </g>

  <!-- Info Panel (Column 3) -->
  <rect x="620" y="40" width="250" height="530" class="panel-bg"/>

  <line x1="620" y1="40" x2="620" y2="570" class="border"/>

  <!-- User Info -->
  <g transform="translate(635, 60)">
    <text x="0" y="10" font-size="14" font-weight="600" class="main-text">Contact Info</text>
  </g>

  <g transform="translate(635, 85)">
    <circle cx="30" cy="0" r="22" fill="#3b82f6"/>
    <text x="30" y="5" text-anchor="middle" font-size="14" font-weight="600" class="white-text">MR</text>

    <text x="62" y="-5" font-size="13" font-weight="500" class="main-text">Maria Rodriguez</text>
    <text x="62" y="12" font-size="12" class="muted-text">maria@email.com</text>
    <text x="62" y="30" font-size="12" class="muted-text">+55 11 98765-4321</text>
  </g>

  <line x1="635" y1="140" x2="850" y2="140" class="border"/>

  <!-- Details -->
  <g transform="translate(635, 160)">
    <text x="0" y="10" font-size="12" class="muted-text">CONVERSATION</text>
    <text x="0" y="30" font-size="12" class="secondary-text">Started: 10:30 AM</text>
    <text x="0" y="50" font-size="12" class="secondary-text">Duration: 8 min</text>
    <text x="0" y="70" font-size="12" class="secondary-text">Category: Billing</text>
    <text x="0" y="90" font-size="12" class="secondary-text">Priority: High</text>
  </g>

  <line x1="635" y1="270" x2="850" y2="270" class="border"/>

  <!-- Tags -->
  <g transform="translate(635, 290)">
    <text x="0" y="10" font-size="12" class="muted-text">TAGS</text>
    <rect x="0" y="22" width="55" height="22" rx="11" fill="#eff6ff"/>
    <text x="27" y="37" text-anchor="middle" font-size="11" fill="#3b82f6">Billing</text>
    <rect x="65" y="22" width="45" height="22" rx="11" fill="#f0fdf4"/>
    <text x="87" y="37" text-anchor="middle" font-size="11" fill="#22c55e">VIP</text>
    <rect x="120" y="22" width="60" height="22" rx="11" fill="#fef3c7"/>
    <text x="150" y="37" text-anchor="middle" font-size="11" fill="#f59e0b">Urgent</text>
  </g>

  <line x1="635" y1="340" x2="850" y2="340" class="border"/>

  <!-- Quick Actions -->
  <g transform="translate(635, 360)">
    <text x="0" y="10" font-size="12" class="muted-text">QUICK ACTIONS</text>
    <rect x="0" y="22" width="90" height="30" rx="6" class="icon-btn"/>
    <text x="45" y="42" text-anchor="middle" font-size="12" class="secondary-text">Transfer</text>
    <rect x="100" y="22" width="80" height="30" rx="6" class="icon-btn"/>
    <text x="140" y="42" text-anchor="middle" font-size="12" class="secondary-text">Close</text>
  </g>

  <!-- Footer -->
  <g transform="translate(35, 555)">
    <text x="0" y="12" font-size="10" class="muted-text">4 conversations in queue | 1 active | Avg wait: 3m 24s</text>
  </g>
</svg>
