<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="greenGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.1"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .panel-bg { fill: #f8fafc; }
    .main-text { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
    .secondary-text { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; }
    .muted-text { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
    .white-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .accent-text { fill: #22c55e; font-family: system-ui, -apple-system, sans-serif; }
    .border { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .icon-btn { fill: #f1f5f9; }
    .card-bg { fill: #f8fafc; }
    .sidebar-item { fill: #f8fafc; }
    .sidebar-active { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
    .progress-bg { fill: #e2e8f0; }
    .progress-fill { fill: #22c55e; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .panel-bg { fill: #1e293b; }
      .main-text { fill: #e2e8f0; }
      .secondary-text { fill: #94a3b8; }
      .muted-text { fill: #64748b; }
      .accent-text { fill: #4ade80; }
      .border { stroke: #334155; }
      .icon-btn { fill: #334155; }
      .card-bg { fill: #1e293b; }
      .sidebar-item { fill: #1e293b; }
      .sidebar-active { fill: #14532d; stroke: #22c55e; }
      .progress-bg { fill: #334155; }
      .progress-fill { fill: #22c55e; }
    }
  </style>

  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="600" class="main-text">Goals (OKR)</text>

  <!-- Main Frame -->
  <rect x="30" y="40" width="840" height="530" rx="8" class="bg"/>
  <rect x="30" y="40" width="840" height="530" rx="8" class="border"/>

  <!-- Left Sidebar -->
  <rect x="30" y="40" width="220" height="530" rx="8" class="panel-bg"/>
  <rect x="30" y="40" width="220" height="530" rx="8" class="border"/>

  <!-- Period Selector -->
  <g transform="translate(42, 55)">
    <rect x="0" y="0" width="196" height="36" rx="8" class="icon-btn"/>
    <rect x="0" y="0" width="196" height="36" rx="8" class="border"/>
    <text x="15" y="23" font-size="12" class="secondary-text">📅</text>
    <text x="38" y="23" font-size="13" font-weight="500" class="main-text">Q1 2026</text>
    <text x="175" y="23" font-size="11" class="muted-text">▾</text>
  </g>

  <!-- Objectives List -->
  <g transform="translate(42, 105)">
    <text x="0" y="0" font-size="10" font-weight="600" class="muted-text" text-transform="uppercase">OBJECTIVES</text>

    <!-- Objective 1 (active) -->
    <g transform="translate(0, 14)">
      <rect x="0" y="0" width="196" height="52" rx="8" class="sidebar-active"/>
      <text x="12" y="20" font-size="13" font-weight="500" class="main-text">Increase Revenue</text>
      <text x="12" y="38" font-size="11" class="accent-text">72% complete</text>
    </g>

    <!-- Objective 2 -->
    <g transform="translate(0, 76)">
      <rect x="0" y="0" width="196" height="52" rx="8" class="sidebar-item"/>
      <rect x="0" y="0" width="196" height="52" rx="8" class="border"/>
      <text x="12" y="20" font-size="13" font-weight="500" class="main-text">Improve UX</text>
      <text x="12" y="38" font-size="11" class="secondary-text">58% complete</text>
    </g>

    <!-- Objective 3 -->
    <g transform="translate(0, 138)">
      <rect x="0" y="0" width="196" height="52" rx="8" class="sidebar-item"/>
      <rect x="0" y="0" width="196" height="52" rx="8" class="border"/>
      <text x="12" y="20" font-size="13" font-weight="500" class="main-text">Scale Infrastructure</text>
      <text x="12" y="38" font-size="11" class="secondary-text">41% complete</text>
    </g>
  </g>

  <!-- New Objective Button -->
  <g transform="translate(42, 340)">
    <rect x="0" y="0" width="196" height="34" rx="8" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="98" y="22" text-anchor="middle" font-size="12" class="accent-text">+ New Objective</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(270, 55)">
    <!-- Objective Header -->
    <text x="0" y="0" font-size="20" font-weight="600" class="main-text">Increase Revenue</text>
    <text x="0" y="22" font-size="13" class="secondary-text">Q1 2026 • 3 Key Results • 72% Overall</text>

    <!-- Overall Progress -->
    <g transform="translate(0, 35)">
      <rect x="0" y="0" width="580" height="12" rx="6" class="progress-bg"/>
      <rect x="0" y="0" width="418" height="12" rx="6" fill="url(#greenGradLight)"/>
    </g>

    <!-- Key Result 1: 75% -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="580" height="100" rx="10" class="card-bg"/>
      <rect x="0" y="0" width="580" height="100" rx="10" class="border"/>
      <text x="20" y="28" font-size="14" font-weight="600" class="main-text">KR1: Reach $2M ARR</text>
      <text x="20" y="48" font-size="12" class="secondary-text">Owner: Finance Team • Due: Mar 31</text>
      <text x="480" y="28" font-size="20" font-weight="700" class="accent-text">75%</text>
      <g transform="translate(20, 60)">
        <rect x="0" y="0" width="540" height="10" rx="5" class="progress-bg"/>
        <rect x="0" y="0" width="405" height="10" rx="5" class="progress-fill"/>
      </g>
      <text x="20" y="88" font-size="11" class="muted-text">$1.5M / $2.0M</text>
    </g>

    <!-- Key Result 2: 50% -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="580" height="100" rx="10" class="card-bg"/>
      <rect x="0" y="0" width="580" height="100" rx="10" class="border"/>
      <text x="20" y="28" font-size="14" font-weight="600" class="main-text">KR2: Close 50 New Deals</text>
      <text x="20" y="48" font-size="12" class="secondary-text">Owner: Sales Team • Due: Mar 31</text>
      <text x="480" y="28" font-size="20" font-weight="700" class="accent-text">50%</text>
      <g transform="translate(20, 60)">
        <rect x="0" y="0" width="540" height="10" rx="5" class="progress-bg"/>
        <rect x="0" y="0" width="270" height="10" rx="5" fill="#f97316"/>
      </g>
      <text x="20" y="88" font-size="11" class="muted-text">25 / 50 deals</text>
    </g>

    <!-- Key Result 3: 90% -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="580" height="100" rx="10" class="card-bg"/>
      <rect x="0" y="0" width="580" height="100" rx="10" class="border"/>
      <text x="20" y="28" font-size="14" font-weight="600" class="main-text">KR3: Reduce Churn to &lt;5%</text>
      <text x="20" y="48" font-size="12" class="secondary-text">Owner: CS Team • Due: Mar 31</text>
      <text x="480" y="28" font-size="20" font-weight="700" class="accent-text">90%</text>
      <g transform="translate(20, 60)">
        <rect x="0" y="0" width="540" height="10" rx="5" class="progress-bg"/>
        <rect x="0" y="0" width="486" height="10" rx="5" class="progress-fill"/>
      </g>
      <text x="20" y="88" font-size="11" class="muted-text">4.2% / 5.0% churn rate</text>
    </g>

    <!-- Add Key Result -->
    <g transform="translate(0, 415)">
      <rect x="0" y="0" width="580" height="36" rx="8" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,4"/>
      <text x="290" y="23" text-anchor="middle" font-size="12" class="accent-text">+ Add Key Result</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(50, 548)">
    <text x="0" y="0" font-size="10" class="muted-text">N = New Objective | K = Add Key Result | P = Period | R = Report</text>
  </g>
</svg>