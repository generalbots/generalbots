  <text x="450" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="muted-text">Showing 5 of 47 invoices</text>
  <rect class="tab-inactive" x="370" y="510" width="60" height="24" rx="4"/>
  <text x="400" y="527" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="secondary-text">Prev</text>
  <rect class="tab-active" x="440" y="510" width="60" height="24" rx="4"/>
  <text x="470" y="527" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="white-text">Next</text>
