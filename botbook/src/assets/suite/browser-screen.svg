<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.1"/>
    </filter>
    <filter id="shadowSm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .panel-bg { fill: #f8fafc; }
    .main-text { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
    .secondary-text { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; }
    .muted-text { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
    .white-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .accent-text { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; }
    .border { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .icon-btn { fill: #f1f5f9; }
    .url-bar { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1; }
    .web-content { fill: #ffffff; }
    .tab-active { fill: #ffffff; }
    .tab-inactive { fill: #f1f5f9; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .panel-bg { fill: #1e293b; }
      .main-text { fill: #e2e8f0; }
      .secondary-text { fill: #94a3b8; }
      .muted-text { fill: #64748b; }
      .accent-text { fill: #94a3b8; }
      .border { stroke: #334155; }
      .icon-btn { fill: #334155; }
      .url-bar { fill: #1e293b; stroke: #334155; }
      .web-content { fill: #1e293b; }
      .tab-active { fill: #1e293b; }
      .tab-inactive { fill: #0f172a; }
    }
  </style>

  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="600" class="main-text">GB Browser</text>

  <!-- Main Container -->
  <rect x="30" y="40" width="840" height="530" rx="8" class="bg"/>
  <rect x="30" y="40" width="840" height="530" rx="8" class="border"/>

  <!-- Tab Bar -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="840" height="36" rx="8" class="panel-bg"/>
    <!-- Active Tab -->
    <rect x="10" y="4" width="180" height="28" rx="6" class="tab-active"/>
    <rect x="10" y="4" width="180" height="28" rx="6" class="border"/>
    <circle cx="28" cy="18" r="6" fill="#3b82f6"/>
    <text x="28" y="22" text-anchor="middle" font-size="8" class="white-text">G</text>
    <text x="42" y="22" font-size="11" class="main-text">GeneralBots Docs</text>
    <text x="175" y="22" font-size="12" class="muted-text">✕</text>
    <!-- New Tab Button -->
    <text x="205" y="22" font-size="16" class="muted-text">+</text>
  </g>

  <!-- Navigation Bar -->
  <g transform="translate(30, 76)">
    <rect x="0" y="0" width="840" height="40" class="panel-bg"/>
    <line x1="0" y1="40" x2="840" y2="40" class="border"/>

    <!-- Nav Buttons -->
    <g transform="translate(15, 8)">
      <!-- Back -->
      <rect x="0" y="0" width="28" height="24" rx="4" class="icon-btn"/>
      <text x="14" y="17" text-anchor="middle" font-size="14" class="secondary-text">←</text>
      <!-- Forward -->
      <rect x="34" y="0" width="28" height="24" rx="4" class="icon-btn"/>
      <text x="48" y="17" text-anchor="middle" font-size="14" class="secondary-text">→</text>
      <!-- Refresh -->
      <rect x="68" y="0" width="28" height="24" rx="4" class="icon-btn"/>
      <text x="82" y="17" text-anchor="middle" font-size="14" class="secondary-text">↻</text>
      <!-- Home -->
      <rect x="102" y="0" width="28" height="24" rx="4" class="icon-btn"/>
      <text x="116" y="17" text-anchor="middle" font-size="14" class="secondary-text">⌂</text>
    </g>

    <!-- URL Bar -->
    <rect x="155" y="8" width="540" height="24" rx="12" class="url-bar"/>
    <text x="175" y="24" font-size="12" class="secondary-text">🔒</text>
    <text x="195" y="24" font-size="12" class="main-text">https://docs.generalbots.ai</text>

    <!-- Bookmark & Menu -->
    <g transform="translate(710, 8)">
      <rect x="0" y="0" width="28" height="24" rx="4" class="icon-btn"/>
      <text x="14" y="17" text-anchor="middle" font-size="14" class="secondary-text">☆</text>
      <rect x="34" y="0" width="28" height="24" rx="4" class="icon-btn"/>
      <text x="48" y="17" text-anchor="middle" font-size="14" class="secondary-text">⋮</text>
    </g>
  </g>

  <!-- Web Content Area -->
  <rect x="30" y="116" width="840" height="454" class="web-content"/>

  <!-- Page Header -->
  <g transform="translate(180, 150)">
    <!-- Logo -->
    <rect x="0" y="0" width="60" height="60" rx="12" fill="url(#accentGrad)"/>
    <text x="30" y="40" text-anchor="middle" font-size="22" font-weight="700" class="white-text">GB</text>

    <!-- Title -->
    <text x="80" y="20" font-size="24" font-weight="700" class="main-text">GeneralBots</text>
    <text x="80" y="42" font-size="14" class="secondary-text">Documentation &amp; Knowledge Base</text>
  </g>

  <!-- Search Box -->
  <g transform="translate(230, 240)">
    <rect x="0" y="0" width="440" height="44" rx="8" class="url-bar"/>
    <text x="20" y="28" font-size="14" class="muted-text">🔍 Search documentation...</text>
  </g>

  <!-- Quick Links -->
  <g transform="translate(180, 310)">
    <text x="0" y="0" font-size="16" font-weight="600" class="main-text">Quick Links</text>

    <!-- Link Cards -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="150" height="70" rx="8" class="url-bar"/>
      <text x="16" y="28" font-size="20">📚</text>
      <text x="16" y="50" font-size="12" font-weight="500" class="main-text">Getting Started</text>
      <text x="16" y="64" font-size="10" class="muted-text">Quick setup guide</text>

      <rect x="165" y="0" width="150" height="70" rx="8" class="url-bar"/>
      <text x="181" y="28" font-size="20">🔧</text>
      <text x="181" y="50" font-size="12" font-weight="500" class="main-text">API Reference</text>
      <text x="181" y="64" font-size="10" class="muted-text">REST &amp; WebSocket</text>

      <rect x="330" y="0" width="150" height="70" rx="8" class="url-bar"/>
      <text x="346" y="28" font-size="20">🤖</text>
      <text x="346" y="50" font-size="12" font-weight="500" class="main-text">Bot Development</text>
      <text x="346" y="64" font-size="10" class="muted-text">Build your first bot</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(180, 430)">
    <text x="0" y="0" font-size="11" class="muted-text">© 2026 GeneralBots | Privacy Policy | Terms of Service</text>
  </g>
</svg>