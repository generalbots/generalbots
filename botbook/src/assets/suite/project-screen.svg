<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="blueGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.1"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .panel-bg { fill: #f8fafc; }
    .main-text { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
    .secondary-text { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; }
    .muted-text { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
    .white-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .accent-text { fill: #3b82f6; font-family: system-ui, -apple-system, sans-serif; }
    .border { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .icon-btn { fill: #f1f5f9; }
    .card-bg { fill: #f8fafc; }
    .sidebar-active { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
    .sidebar-item { fill: #f8fafc; }
    .gantt-bg { fill: #f8fafc; }
    .gantt-line { stroke: #e2e8f0; stroke-width: 1; }
    .gantt-bar-blue { fill: #3b82f6; }
    .gantt-bar-green { fill: #22c55e; }
    .gantt-bar-orange { fill: #f97316; }
    .gantt-bar-purple { fill: #8b5cf6; }
    .status-green { fill: #22c55e; }
    .status-yellow { fill: #f97316; }
    .status-red { fill: #ef4444; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .panel-bg { fill: #1e293b; }
      .main-text { fill: #e2e8f0; }
      .secondary-text { fill: #94a3b8; }
      .muted-text { fill: #64748b; }
      .accent-text { fill: #60a5fa; }
      .border { stroke: #334155; }
      .icon-btn { fill: #334155; }
      .card-bg { fill: #1e293b; }
      .sidebar-active { fill: #1e3a5f; stroke: #3b82f6; }
      .sidebar-item { fill: #1e293b; }
      .gantt-bg { fill: #1e293b; }
      .gantt-line { stroke: #334155; }
    }
  </style>

  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="600" class="main-text">Projects</text>

  <!-- Main Frame -->
  <rect x="30" y="40" width="840" height="530" rx="8" class="bg"/>
  <rect x="30" y="40" width="840" height="530" rx="8" class="border"/>

  <!-- Left Sidebar -->
  <rect x="30" y="40" width="220" height="530" rx="8" class="panel-bg"/>
  <rect x="30" y="40" width="220" height="530" rx="8" class="border"/>

  <!-- Search Box -->
  <g transform="translate(42, 55)">
    <rect x="0" y="0" width="196" height="34" rx="8" class="icon-btn"/>
    <rect x="0" y="0" width="196" height="34" rx="8" class="border"/>
    <text x="12" y="22" font-size="13" class="muted-text">🔍</text>
    <text x="32" y="22" font-size="12" class="muted-text">Search projects...</text>
  </g>

  <!-- Project List -->
  <g transform="translate(42, 105)">
    <text x="0" y="0" font-size="10" font-weight="600" class="muted-text">PROJECTS</text>

    <!-- Project 1 (active) -->
    <g transform="translate(0, 14)">
      <rect x="0" y="0" width="196" height="52" rx="8" class="sidebar-active"/>
      <circle cx="14" cy="16" r="5" class="status-green"/>
      <text x="26" y="20" font-size="13" font-weight="500" class="main-text">Website Redesign</text>
      <text x="26" y="38" font-size="11" class="secondary-text">8 tasks • 3 members</text>
    </g>

    <!-- Project 2 -->
    <g transform="translate(0, 76)">
      <rect x="0" y="0" width="196" height="52" rx="8" class="sidebar-item"/>
      <rect x="0" y="0" width="196" height="52" rx="8" class="border"/>
      <circle cx="14" cy="16" r="5" class="status-yellow"/>
      <text x="26" y="20" font-size="13" font-weight="500" class="main-text">Mobile App v2</text>
      <text x="26" y="38" font-size="11" class="secondary-text">12 tasks • 5 members</text>
    </g>

    <!-- Project 3 -->
    <g transform="translate(0, 138)">
      <rect x="0" y="0" width="196" height="52" rx="8" class="sidebar-item"/>
      <rect x="0" y="0" width="196" height="52" rx="8" class="border"/>
      <circle cx="14" cy="16" r="5" class="status-red"/>
      <text x="26" y="20" font-size="13" font-weight="500" class="main-text">API Migration</text>
      <text x="26" y="38" font-size="11" class="secondary-text">6 tasks • 2 members</text>
    </g>
  </g>

  <!-- New Project Button -->
  <g transform="translate(42, 340)">
    <rect x="0" y="0" width="196" height="34" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="98" y="22" text-anchor="middle" font-size="12" class="accent-text">+ New Project</text>
  </g>

  <!-- Main Content: Gantt Chart -->
  <g transform="translate(270, 55)">
    <!-- Header -->
    <text x="0" y="0" font-size="18" font-weight="600" class="main-text">Website Redesign</text>
    <text x="0" y="20" font-size="13" class="secondary-text">Gantt View • Jun 2026</text>

    <!-- Timeline Header -->
    <g transform="translate(0, 40)">
      <rect x="0" y="0" width="580" height="32" rx="6" class="panel-bg"/>
      <rect x="0" y="0" width="580" height="32" rx="6" class="border"/>
      <text x="50" y="21" text-anchor="middle" font-size="10" class="muted-text">Jun 1</text>
      <text x="145" y="21" text-anchor="middle" font-size="10" class="muted-text">Jun 8</text>
      <text x="240" y="21" text-anchor="middle" font-size="10" class="muted-text">Jun 15</text>
      <text x="335" y="21" text-anchor="middle" font-size="10" class="muted-text">Jun 22</text>
      <text x="430" y="21" text-anchor="middle" font-size="10" class="muted-text">Jun 29</text>
      <text x="530" y="21" text-anchor="middle" font-size="10" class="muted-text">Jul 6</text>
    </g>

    <!-- Grid Lines -->
    <line x1="50" y1="72" x2="50" y2="380" class="gantt-line"/>
    <line x1="145" y1="72" x2="145" y2="380" class="gantt-line"/>
    <line x1="240" y1="72" x2="240" y2="380" class="gantt-line"/>
    <line x1="335" y1="72" x2="335" y2="380" class="gantt-line"/>
    <line x1="430" y1="72" x2="430" y2="380" class="gantt-line"/>
    <line x1="530" y1="72" x2="530" y2="380" class="gantt-line"/>

    <!-- Task 1: Design Phase (blue) -->
    <g transform="translate(0, 85)">
      <text x="-10" y="14" text-anchor="end" font-size="12" class="main-text">Design</text>
      <rect x="20" y="0" width="180" height="24" rx="6" class="gantt-bar-blue" opacity="0.9"/>
      <text x="110" y="16" text-anchor="middle" font-size="10" class="white-text">Design Phase</text>
      <text x="210" y="16" font-size="10" class="accent-text">✓</text>
    </g>

    <!-- Task 2: Frontend Dev (green) -->
    <g transform="translate(0, 130)">
      <text x="-10" y="14" text-anchor="end" font-size="12" class="main-text">Frontend</text>
      <rect x="110" y="0" width="220" height="24" rx="6" class="gantt-bar-green" opacity="0.9"/>
      <text x="220" y="16" text-anchor="middle" font-size="10" class="white-text">Frontend Development</text>
    </g>

    <!-- Task 3: Backend API (orange) -->
    <g transform="translate(0, 175)">
      <text x="-10" y="14" text-anchor="end" font-size="12" class="main-text">Backend</text>
      <rect x="160" y="0" width="200" height="24" rx="6" class="gantt-bar-orange" opacity="0.9"/>
      <text x="260" y="16" text-anchor="middle" font-size="10" class="white-text">Backend API</text>
    </g>

    <!-- Task 4: Testing & QA (purple) -->
    <g transform="translate(0, 220)">
      <text x="-10" y="14" text-anchor="end" font-size="12" class="main-text">Testing</text>
      <rect x="340" y="0" width="160" height="24" rx="6" class="gantt-bar-purple" opacity="0.9"/>
      <text x="420" y="16" text-anchor="middle" font-size="10" class="white-text">Testing &amp; QA</text>
    </g>

    <!-- Today Marker -->
    <line x1="200" y1="72" x2="200" y2="260" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="200" y="275" text-anchor="middle" font-size="10" fill="#ef4444">Today</text>

    <!-- Task List -->
    <g transform="translate(0, 300)">
      <text x="0" y="0" font-size="13" font-weight="600" class="main-text">Tasks</text>

      <text x="0" y="25" font-size="12" class="main-text">✓ Design mockups</text>
      <text x="0" y="45" font-size="12" class="main-text">✓ Set up project repo</text>
      <text x="0" y="65" font-size="12" class="secondary-text">  Implement homepage</text>
      <text x="0" y="85" font-size="12" class="secondary-text">  API endpoints</text>
      <text x="300" y="25" font-size="12" class="secondary-text">  Write tests</text>
      <text x="300" y="45" font-size="12" class="muted-text">  Deploy to staging</text>
      <text x="300" y="65" font-size="12" class="muted-text">  QA review</text>
      <text x="300" y="85" font-size="12" class="muted-text">  Launch</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(50, 548)">
    <text x="0" y="0" font-size="10" class="muted-text">N = New Project | T = Add Task | G = Gantt View | L = List View</text>
  </g>
</svg>