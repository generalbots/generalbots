<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .bg { fill: #0f172a; }
    .card-bg { fill: #1e293b; }
    .main-text { fill: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .secondary-text { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
    .muted-text { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; }
    .white-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .accent-text { fill: #60a5fa; font-family: system-ui, -apple-system, sans-serif; }
    .border { stroke: #334155; stroke-width: 1; fill: none; }
    .input-bg { fill: #0f172a; }
    .input-border { stroke: #334155; stroke-width: 1; fill: none; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f8fafc; }
      .card-bg { fill: #ffffff; }
      .main-text { fill: #1e293b; }
      .secondary-text { fill: #64748b; }
      .muted-text { fill: #94a3b8; }
      .accent-text { fill: #3b82f6; }
      .border { stroke: #e2e8f0; }
      .input-bg { fill: #f8fafc; }
      .input-border { stroke: #e2e8f0; }
    }
  </style>

  <!-- Dark Background -->
  <rect x="0" y="0" width="900" height="600" class="bg"/>

  <!-- Radial Gradient Glows -->
  <rect x="0" y="0" width="900" height="600" fill="url(#glow1)"/>
  <rect x="0" y="0" width="900" height="600" fill="url(#glow2)"/>

  <!-- Login Card -->
  <g transform="translate(450, 300)">
    <rect x="-210" y="-200" width="420" height="400" rx="16" class="card-bg"/>
    <rect x="-210" y="-200" width="420" height="400" rx="16" class="border"/>

    <!-- Logo -->
    <rect x="-30" y="-170" width="60" height="60" rx="14" fill="url(#accentGrad)"/>
    <text x="0" y="-130" text-anchor="middle" font-size="28" class="white-text">G</text>

    <!-- Welcome Text -->
    <text x="0" y="-95" text-anchor="middle" font-size="20" font-weight="600" class="main-text">Welcome back</text>
    <text x="0" y="-72" text-anchor="middle" font-size="13" class="secondary-text">Sign in to your account</text>

    <!-- Email Field -->
    <text x="-170" y="-38" font-size="12" class="secondary-text">Email</text>
    <rect x="-170" y="-28" width="340" height="44" rx="8" class="input-bg"/>
    <rect x="-170" y="-28" width="340" height="44" rx="8" class="input-border"/>
    <text x="-155" y="0" font-size="14" class="muted-text">you@company.com</text>

    <!-- Password Field -->
    <text x="-170" y="32" font-size="12" class="secondary-text">Password</text>
    <rect x="-170" y="42" width="340" height="44" rx="8" class="input-bg"/>
    <rect x="-170" y="42" width="340" height="44" rx="8" class="input-border"/>
    <text x="-155" y="70" font-size="14" class="muted-text">••••••••</text>
    <text x="155" y="70" text-anchor="end" font-size="14" class="muted-text">👁</text>

    <!-- Sign In Button -->
    <rect x="-170" y="110" width="340" height="46" rx="10" fill="url(#accentGrad)"/>
    <text x="0" y="139" text-anchor="middle" font-size="15" font-weight="600" class="white-text">Sign in</text>

    <!-- Forgot Password -->
    <text x="0" y="180" text-anchor="middle" font-size="13" class="accent-text">Forgot password?</text>

    <!-- Divider -->
    <line x1="-170" y1="200" x2="170" y2="200" class="border"/>

    <!-- Sign up link -->
    <text x="0" y="225" text-anchor="middle" font-size="12" class="secondary-text">Don't have an account? <tspan class="accent-text">Sign up</tspan></text>
  </g>

  <!-- Footer -->
  <g transform="translate(450, 570)">
    <text x="0" y="0" text-anchor="middle" font-size="11" class="muted-text">Secured with 256-bit encryption</text>
  </g>
</svg>