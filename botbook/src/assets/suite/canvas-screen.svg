<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.1"/>
    </filter>
    <filter id="shadowSm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .panel-bg { fill: #f8fafc; }
    .main-text { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
    .secondary-text { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; }
    .muted-text { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
    .white-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .accent-text { fill: #ec4899; font-family: system-ui, -apple-system, sans-serif; }
    .border { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .icon-btn { fill: #f1f5f9; }
    .canvas-area { fill: #ffffff; }
    .toolbar-bg { fill: #f8fafc; }
    .active-tool { fill: #fdf2f8; stroke: #ec4899; stroke-width: 1.5; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .panel-bg { fill: #1e293b; }
      .main-text { fill: #e2e8f0; }
      .secondary-text { fill: #94a3b8; }
      .muted-text { fill: #64748b; }
      .accent-text { fill: #f472b6; }
      .border { stroke: #334155; }
      .icon-btn { fill: #334155; }
      .canvas-area { fill: #1e293b; }
      .toolbar-bg { fill: #1e293b; }
      .active-tool { fill: #3b1e3b; stroke: #ec4899; }
    }
  </style>

  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="600" class="main-text">Canvas - Whiteboard</text>

  <!-- Main Frame -->
  <rect x="30" y="40" width="840" height="530" rx="8" class="bg"/>
  <rect x="30" y="40" width="840" height="530" rx="8" class="border"/>

  <!-- Left Toolbar -->
  <rect x="30" y="40" width="56" height="530" rx="8" class="toolbar-bg"/>
  <rect x="30" y="40" width="56" height="530" rx="8" class="border"/>

  <!-- Tool Icons -->
  <g transform="translate(38, 56)">
    <!-- Select (active) -->
    <rect x="0" y="0" width="40" height="36" rx="6" class="active-tool"/>
    <text x="20" y="24" text-anchor="middle" font-size="16">↖</text>
  </g>
  <g transform="translate(38, 100)">
    <rect x="0" y="0" width="40" height="36" rx="6" class="icon-btn"/>
    <rect x="0" y="0" width="40" height="36" rx="6" class="border"/>
    <text x="20" y="24" text-anchor="middle" font-size="16">✋</text>
  </g>
  <g transform="translate(38, 144)">
    <rect x="0" y="0" width="40" height="36" rx="6" class="icon-btn"/>
    <rect x="0" y="0" width="40" height="36" rx="6" class="border"/>
    <text x="20" y="24" text-anchor="middle" font-size="16">✏️</text>
  </g>
  <g transform="translate(38, 188)">
    <rect x="0" y="0" width="40" height="36" rx="6" class="icon-btn"/>
    <rect x="0" y="0" width="40" height="36" rx="6" class="border"/>
    <text x="20" y="24" text-anchor="middle" font-size="14">▭</text>
  </g>
  <g transform="translate(38, 232)">
    <rect x="0" y="0" width="40" height="36" rx="6" class="icon-btn"/>
    <rect x="0" y="0" width="40" height="36" rx="6" class="border"/>
    <text x="20" y="24" text-anchor="middle" font-size="14">◯</text>
  </g>
  <g transform="translate(38, 276)">
    <rect x="0" y="0" width="40" height="36" rx="6" class="icon-btn"/>
    <rect x="0" y="0" width="40" height="36" rx="6" class="border"/>
    <text x="20" y="24" text-anchor="middle" font-size="14">T</text>
  </g>
  <g transform="translate(38, 320)">
    <rect x="0" y="0" width="40" height="36" rx="6" class="icon-btn"/>
    <rect x="0" y="0" width="40" height="36" rx="6" class="border"/>
    <text x="20" y="24" text-anchor="middle" font-size="16">🧹</text>
  </g>

  <!-- Color Picker at bottom of toolbar -->
  <g transform="translate(38, 480)">
    <text x="20" y="0" text-anchor="middle" font-size="9" class="muted-text">Color</text>
    <circle cx="10" cy="14" r="7" fill="#ec4899"/>
    <circle cx="30" cy="14" r="7" fill="#3b82f6"/>
    <circle cx="10" cy="32" r="7" fill="#22c55e"/>
    <circle cx="30" cy="32" r="7" fill="#1e293b"/>
    <circle cx="10" cy="50" r="7" fill="#f97316"/>
    <circle cx="30" cy="50" r="7" fill="#8b5cf6"/>
    <rect x="2" y="62" width="36" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="2" y="62" width="24" height="6" rx="3" fill="#ec4899"/>
  </g>

  <!-- Canvas Area -->
  <rect x="96" y="48" width="764" height="430" rx="4" class="canvas-area"/>
  <rect x="96" y="48" width="764" height="430" rx="4" class="border"/>

  <!-- Sample Drawing: Rectangle -->
  <rect x="180" y="120" width="160" height="100" rx="4" fill="none" stroke="#3b82f6" stroke-width="2"/>

  <!-- Sample Drawing: Circle -->
  <circle cx="500" cy="200" r="60" fill="none" stroke="#ec4899" stroke-width="2"/>

  <!-- Sample Drawing: Lines -->
  <line x1="140" y1="300" x2="380" y2="260" stroke="#22c55e" stroke-width="2"/>
  <line x1="380" y1="260" x2="600" y2="320" stroke="#22c55e" stroke-width="2"/>
  <line x1="600" y1="320" x2="700" y2="280" stroke="#22c55e" stroke-width="2"/>

  <!-- Sample Drawing: Text -->
  <text x="160" y="370" font-size="18" font-weight="600" fill="#1e293b">Sample Text</text>

  <!-- Sample Drawing: Small filled shapes -->
  <rect x="550" y="350" width="80" height="50" rx="6" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="565" y="380" font-size="11" fill="#ec4899">Note</text>

  <!-- Zoom Controls -->
  <g transform="translate(770, 440)">
    <rect x="0" y="0" width="32" height="28" rx="6" class="icon-btn"/>
    <rect x="0" y="0" width="32" height="28" rx="6" class="border"/>
    <text x="16" y="19" text-anchor="middle" font-size="14" class="secondary-text">+</text>
    <rect x="36" y="0" width="32" height="28" rx="6" class="icon-btn"/>
    <rect x="36" y="0" width="32" height="28" rx="6" class="border"/>
    <text x="52" y="19" text-anchor="middle" font-size="14" class="secondary-text">−</text>
    <rect x="72" y="0" width="48" height="28" rx="6" class="icon-btn"/>
    <rect x="72" y="0" width="48" height="28" rx="6" class="border"/>
    <text x="96" y="19" text-anchor="middle" font-size="11" class="secondary-text">100%</text>
  </g>

  <!-- Bottom Status Bar -->
  <g transform="translate(96, 490)">
    <rect x="0" y="0" width="764" height="30" rx="0" class="panel-bg"/>
    <rect x="0" y="0" width="764" height="30" rx="0" class="border"/>
    <text x="15" y="20" font-size="11" class="muted-text">Select • 3 objects on canvas</text>
    <text x="500" y="20" font-size="11" class="muted-text">X: 420 Y: 280</text>
    <text x="700" y="20" font-size="11" class="muted-text">1920 × 1080</text>
  </g>

  <!-- Footer shortcuts -->
  <g transform="translate(96, 540)">
    <text x="0" y="0" font-size="10" class="muted-text">V = Select | H = Pan | P = Pencil | R = Rect | C = Circle | T = Text | E = Eraser</text>
  </g>
</svg>