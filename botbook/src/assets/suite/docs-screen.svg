<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .panel-bg { fill: #f8fafc; }
    .main-text { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
    .secondary-text { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; }
    .muted-text { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
    .white-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .accent-text { fill: #3b82f6; font-family: system-ui, -apple-system, sans-serif; }
    .border { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .icon-btn { fill: #f1f5f9; }
    .toolbar-active { fill: #eff6ff; }
    .input-bg { fill: #f8fafc; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .panel-bg { fill: #1e293b; }
      .main-text { fill: #e2e8f0; }
      .secondary-text { fill: #94a3b8; }
      .muted-text { fill: #64748b; }
      .accent-text { fill: #60a5fa; }
      .border { stroke: #334155; }
      .icon-btn { fill: #334155; }
      .toolbar-active { fill: #1e3a5f; }
      .input-bg { fill: #1e293b; }
    }
  </style>

  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="600" class="main-text">Untitled Document</text>

  <rect x="30" y="40" width="840" height="530" rx="8" class="bg"/>
  <rect x="30" y="40" width="840" height="530" rx="8" class="border"/>

  <!-- Toolbar -->
  <rect x="30" y="40" width="840" height="44" class="panel-bg"/>
  <line x1="30" y1="84" x2="870" y2="84" class="border"/>

  <g transform="translate(45, 55)">
    <rect x="0" y="0" width="120" height="28" rx="4" class="icon-btn"/>
    <rect x="0" y="0" width="120" height="28" rx="4" class="border"/>
    <text x="10" y="19" font-size="12" class="main-text">Arial</text>
    <text x="108" y="19" font-size="10" class="muted-text">v</text>

    <rect x="130" y="0" width="50" height="28" rx="4" class="icon-btn"/>
    <rect x="130" y="0" width="50" height="28" rx="4" class="border"/>
    <text x="142" y="19" font-size="12" class="main-text">12</text>

    <line x1="200" y1="2" x2="200" y2="26" class="border"/>

    <rect x="210" y="0" width="30" height="28" rx="4" class="toolbar-active"/>
    <text x="225" y="20" text-anchor="middle" font-size="14" font-weight="700" class="accent-text">B</text>

    <rect x="248" y="0" width="30" height="28" rx="4" class="icon-btn"/>
    <text x="263" y="20" text-anchor="middle" font-size="14" font-style="italic" class="main-text">I</text>

    <rect x="286" y="0" width="30" height="28" rx="4" class="icon-btn"/>
    <text x="301" y="20" text-anchor="middle" font-size="14" class="main-text">U</text>

    <line x1="335" y1="2" x2="335" y2="26" class="border"/>

    <rect x="345" y="0" width="30" height="28" rx="4" class="toolbar-active"/>
    <text x="360" y="20" text-anchor="middle" font-size="12" class="accent-text">L</text>

    <rect x="383" y="0" width="30" height="28" rx="4" class="icon-btn"/>
    <text x="398" y="20" text-anchor="middle" font-size="12" class="main-text">C</text>

    <rect x="421" y="0" width="30" height="28" rx="4" class="icon-btn"/>
    <text x="436" y="20" text-anchor="middle" font-size="12" class="main-text">R</text>

    <line x1="470" y1="2" x2="470" y2="26" class="border"/>

    <rect x="480" y="0" width="30" height="28" rx="4" class="icon-btn"/>
    <text x="495" y="20" text-anchor="middle" font-size="12">u</text>

    <rect x="518" y="0" width="30" height="28" rx="4" class="icon-btn"/>
    <text x="533" y="20" text-anchor="middle" font-size="12">r</text>
  </g>

  <!-- Document Content -->
  <rect x="120" y="95" width="660" height="455" class="bg"/>

  <g transform="translate(160, 125)">
    <text x="0" y="0" font-size="26" font-weight="700" class="main-text">Quarterly Business Report</text>
  </g>

  <line x1="160" y1="145" x2="740" y2="145" class="border"/>

  <g transform="translate(160, 170)">
    <text x="0" y="0" font-size="16" font-weight="600" class="main-text">1. Executive Summary</text>
    <text x="0" y="28" font-size="14" class="main-text">This report provides an overview of the company's performance</text>
    <text x="0" y="48" font-size="14" class="main-text">during Q1 2025. Key metrics show significant growth across</text>
    <text x="0" y="68" font-size="14" class="main-text">all major segments, with revenue increasing by 15%.</text>

    <text x="0" y="108" font-size="16" font-weight="600" class="main-text">2. Revenue Analysis</text>
    <text x="0" y="136" font-size="14" class="main-text">Total revenue reached $4.2M, surpassing the quarterly target</text>
    <text x="0" y="156" font-size="14" class="main-text">by 8%. Growth was driven by:</text>

    <text x="20" y="186" font-size="14" class="main-text">- Enterprise segment: +22% YoY</text>
    <text x="20" y="210" font-size="14" class="main-text">- SMB segment: +18% YoY</text>
    <text x="20" y="234" font-size="14" class="main-text">- New product launches: 12% of revenue</text>

    <text x="0" y="274" font-size="16" font-weight="600" class="main-text">3. Key Achievements</text>
    <text x="20" y="304" font-size="14" class="main-text">- Launched 3 new product features</text>
    <text x="20" y="328" font-size="14" class="main-text">- Expanded to 2 new markets</text>
    <text x="20" y="352" font-size="14" class="main-text">- Customer satisfaction score: 92%</text>
  </g>

  <!-- Footer -->
  <g transform="translate(35, 560)">
    <text x="0" y="0" font-size="10" class="muted-text">Auto-saved | Words: 1,247 | Last edit: 2 minutes ago</text>
  </g>
</svg>
