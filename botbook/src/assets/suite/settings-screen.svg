<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .panel-bg { fill: #f8fafc; }
    .main-text { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
    .secondary-text { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; }
    .muted-text { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
    .white-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .accent-text { fill: #8b5cf6; font-family: system-ui, -apple-system, sans-serif; }
    .border { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .icon-btn { fill: #f1f5f9; }
    .row-hover { fill: #f1f5f9; }
    .row-selected { fill: #f5f3ff; }
    .unread-bg { fill: #eff6ff; }
    .unread-dot { fill: #8b5cf6; }
    .nav-active { fill: #f5f3ff; }
    .input-bg { fill: #f8fafc; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .panel-bg { fill: #1e293b; }
      .main-text { fill: #e2e8f0; }
      .secondary-text { fill: #94a3b8; }
      .muted-text { fill: #64748b; }
      .accent-text { fill: #a78bfa; }
      .border { stroke: #334155; }
      .icon-btn { fill: #334155; }
      .row-hover { fill: #1e293b; }
      .row-selected { fill: #2e1065; }
      .nav-active { fill: #2e1065; }
      .input-bg { fill: #1e293b; }
    }
  </style>

  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="600" class="main-text">Settings</text>

  <rect x="30" y="40" width="840" height="530" rx="8" class="bg"/>
  <rect x="30" y="40" width="840" height="530" rx="8" class="border"/>

  <!-- Sidebar Panel -->
  <rect x="30" y="40" width="160" height="530" class="panel-bg"/>
  <line x1="190" y1="40" x2="190" y2="570" class="border"/>

  <!-- Sidebar Header -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" font-size="14" font-weight="600" class="muted-text">ACCOUNT</text>
  </g>

  <!-- Sidebar Navigation -->
  <g transform="translate(45, 85)">
    <rect x="-10" y="-8" width="150" height="36" rx="6" class="nav-active"/>
    <text x="0" y="14" font-size="14">👤</text>
    <text x="25" y="14" font-size="14" class="accent-text">Profile</text>

    <text x="0" y="54" font-size="14">🔒</text>
    <text x="25" y="54" font-size="14" class="secondary-text">Security</text>

    <text x="0" y="94" font-size="14">🎨</text>
    <text x="25" y="94" font-size="14" class="secondary-text">Appearance</text>

    <text x="0" y="134" font-size="14">🌐</text>
    <text x="25" y="134" font-size="14" class="secondary-text">Language</text>

    <text x="0" y="174" font-size="14">🔔</text>
    <text x="25" y="174" font-size="14" class="secondary-text">Notifications</text>
  </g>

  <!-- Main Content Panel -->
  <rect x="190" y="40" width="680" height="530" class="bg"/>

  <!-- Profile Header -->
  <g transform="translate(220, 65)">
    <text x="0" y="0" font-size="18" font-weight="600" class="main-text">Profile</text>
    <text x="0" y="22" font-size="13" class="secondary-text">Manage your personal information</text>
  </g>

  <line x1="220" y1="105" x2="840" y2="105" class="border"/>

  <!-- Avatar Section -->
  <g transform="translate(220, 130)">
    <text x="0" y="10" font-size="14" font-weight="500" class="secondary-text">Photo</text>

    <circle cx="60" cy="75" r="40" fill="url(#accentGrad)"/>
    <text x="60" y="82" text-anchor="middle" font-size="24" font-weight="600" class="white-text">AJ</text>

    <g transform="translate(120, 45)">
      <rect x="0" y="0" width="120" height="34" rx="6" fill="url(#accentGrad)"/>
      <text x="60" y="22" text-anchor="middle" font-size="13" font-weight="500" class="white-text">Change Photo</text>
    </g>
    <text x="120" y="65" font-size="12" class="muted-text">JPG, PNG. Max 2MB</text>
  </g>

  <line x1="220" y1="245" x2="840" y2="245" class="border"/>

  <!-- Name Fields -->
  <g transform="translate(220, 270)">
    <text x="0" y="10" font-size="14" font-weight="500" class="secondary-text">Full Name</text>
    <rect x="0" y="20" width="280" height="40" rx="6" class="input-bg"/>
    <rect x="0" y="20" width="280" height="40" rx="6" class="border"/>
    <text x="15" y="46" font-size="14" class="main-text">Ana Johnson</text>

    <text x="310" y="10" font-size="14" font-weight="500" class="secondary-text">Username</text>
    <rect x="310" y="20" width="280" height="40" rx="6" class="input-bg"/>
    <rect x="310" y="20" width="280" height="40" rx="6" class="border"/>
    <text x="325" y="46" font-size="14" class="main-text">ana.johnson</text>
  </g>

  <!-- Email & Phone Fields -->
  <g transform="translate(220, 340)">
    <text x="0" y="10" font-size="14" font-weight="500" class="secondary-text">Email Address</text>
    <rect x="0" y="20" width="280" height="40" rx="6" class="input-bg"/>
    <rect x="0" y="20" width="280" height="40" rx="6" class="border"/>
    <text x="15" y="46" font-size="14" class="main-text">ana.johnson@company.com</text>

    <text x="310" y="10" font-size="14" font-weight="500" class="secondary-text">Phone Number</text>
    <rect x="310" y="20" width="280" height="40" rx="6" class="input-bg"/>
    <rect x="310" y="20" width="280" height="40" rx="6" class="border"/>
    <text x="325" y="46" font-size="14" class="main-text">+1 (555) 234-5678</text>
  </g>

  <!-- Bio Field -->
  <g transform="translate(220, 410)">
    <text x="0" y="10" font-size="14" font-weight="500" class="secondary-text">Bio</text>
    <rect x="0" y="20" width="590" height="60" rx="6" class="input-bg"/>
    <rect x="0" y="20" width="590" height="60" rx="6" class="border"/>
    <text x="15" y="46" font-size="14" class="main-text">Product designer and researcher</text>
  </g>

  <!-- Save / Cancel Buttons -->
  <g transform="translate(220, 510)">
    <rect x="370" y="0" width="100" height="36" rx="6" class="icon-btn"/>
    <text x="420" y="23" text-anchor="middle" font-size="13" class="secondary-text">Cancel</text>

    <rect x="480" y="0" width="120" height="36" rx="6" fill="url(#accentGrad)"/>
    <text x="540" y="23" text-anchor="middle" font-size="13" font-weight="500" class="white-text">Save Changes</text>
  </g>

  <!-- Footer -->
  <g transform="translate(220, 555)">
    <text x="0" y="0" font-size="10" class="muted-text">Last updated: March 20, 2025</text>
  </g>
</svg>
