<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .panel-bg { fill: #f8fafc; }
    .main-text { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
    .secondary-text { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; }
    .muted-text { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
    .white-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .accent-text { fill: #3b82f6; font-family: system-ui, -apple-system, sans-serif; }
    .green-text { fill: #22c55e; font-family: system-ui, -apple-system, sans-serif; }
    .border { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .icon-btn { fill: #f1f5f9; }
    .card-bg { fill: #f8fafc; }
    .badge-static { fill: #dbeafe; }
    .badge-dynamic { fill: #dcfce7; }
    .tab-active { fill: #eff6ff; }
    .input-bg { fill: #f1f5f9; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .panel-bg { fill: #1e293b; }
      .main-text { fill: #e2e8f0; }
      .secondary-text { fill: #94a3b8; }
      .muted-text { fill: #64748b; }
      .accent-text { fill: #60a5fa; }
      .green-text { fill: #4ade80; }
      .border { stroke: #334155; }
      .icon-btn { fill: #334155; }
      .card-bg { fill: #1e293b; }
      .badge-static { fill: #1e3a5f; }
      .badge-dynamic { fill: #14532d; }
      .tab-active { fill: #1e3a5f; }
      .input-bg { fill: #334155; }
    }
  </style>

  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="600" class="main-text">Marketing Lists</text>

  <rect x="30" y="40" width="840" height="530" rx="8" class="bg"/>
  <rect x="30" y="40" width="840" height="530" rx="8" class="border"/>

  <!-- Tab Bar -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="840" height="42" class="panel-bg"/>
    <line x1="0" y1="42" x2="840" y2="42" class="border"/>
    <g transform="translate(20, 0)">
      <rect x="0" y="2" width="80" height="38" rx="6" class="tab-active"/>
      <text x="40" y="26" text-anchor="middle" font-size="13" font-weight="500" class="accent-text">All Lists</text>
    </g>
    <g transform="translate(115, 0)">
      <text x="40" y="26" text-anchor="middle" font-size="13" class="secondary-text">Static</text>
    </g>
    <g transform="translate(200, 0)">
      <text x="40" y="26" text-anchor="middle" font-size="13" class="secondary-text">Dynamic</text>
    </g>
  </g>

  <!-- Toolbar -->
  <g transform="translate(50, 98)">
    <!-- Search -->
    <rect x="0" y="0" width="280" height="36" rx="8" class="input-bg"/>
    <rect x="0" y="0" width="280" height="36" rx="8" class="border"/>
    <text x="12" y="23" font-size="13" class="muted-text">🔍</text>
    <text x="32" y="23" font-size="13" class="muted-text">Search lists...</text>

    <!-- New List Button -->
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="100" height="36" rx="8" fill="url(#accentGrad)"/>
      <text x="50" y="23" text-anchor="middle" font-size="13" font-weight="500" class="white-text">+ New List</text>
    </g>

    <!-- Import CSV -->
    <g transform="translate(420, 0)">
      <rect x="0" y="0" width="90" height="36" rx="8" class="icon-btn"/>
      <rect x="0" y="0" width="90" height="36" rx="8" class="border"/>
      <text x="45" y="23" text-anchor="middle" font-size="12" class="secondary-text">Import CSV</text>
    </g>

    <!-- Export CSV -->
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="90" height="36" rx="8" class="icon-btn"/>
      <rect x="0" y="0" width="90" height="36" rx="8" class="border"/>
      <text x="45" y="23" text-anchor="middle" font-size="12" class="secondary-text">Export CSV</text>
    </g>
  </g>

  <!-- List Cards Grid -->
  <g transform="translate(50, 155)">
    <!-- Card 1: Newsletter Subscribers -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="190" height="170" rx="10" class="card-bg"/>
      <rect x="0" y="0" width="190" height="170" rx="10" class="border"/>
      <rect x="15" y="15" width="36" height="36" rx="8" fill="url(#accentGrad)"/>
      <text x="33" y="39" text-anchor="middle" font-size="16" class="white-text">📧</text>
      <text x="60" y="30" font-size="13" font-weight="600" class="main-text">Newsletter</text>
      <text x="60" y="46" font-size="11" class="secondary-text">Subscribers</text>
      <rect x="15" y="65" width="50" height="18" rx="9" class="badge-static"/>
      <text x="40" y="78" text-anchor="middle" font-size="10" class="accent-text">Static</text>
      <line x1="15" y1="95" x2="175" y2="95" class="border"/>
      <text x="15" y="115" font-size="24" font-weight="700" class="main-text">8,432</text>
      <text x="15" y="135" font-size="11" class="secondary-text">contacts</text>
      <text x="15" y="155" font-size="10" class="muted-text">Updated 2h ago</text>
    </g>

    <!-- Card 2: Active Users -->
    <g transform="translate(210, 0)">
      <rect x="0" y="0" width="190" height="170" rx="10" class="card-bg"/>
      <rect x="0" y="0" width="190" height="170" rx="10" class="border"/>
      <rect x="15" y="15" width="36" height="36" rx="8" fill="url(#greenGrad)"/>
      <text x="33" y="39" text-anchor="middle" font-size="16" class="white-text">👥</text>
      <text x="60" y="30" font-size="13" font-weight="600" class="main-text">Active Users</text>
      <text x="60" y="46" font-size="11" class="secondary-text">Last 30 days</text>
      <rect x="15" y="65" width="56" height="18" rx="9" class="badge-dynamic"/>
      <text x="43" y="78" text-anchor="middle" font-size="10" class="green-text">Dynamic</text>
      <line x1="15" y1="95" x2="175" y2="95" class="border"/>
      <text x="15" y="115" font-size="24" font-weight="700" class="main-text">3,291</text>
      <text x="15" y="135" font-size="11" class="secondary-text">contacts</text>
      <text x="15" y="155" font-size="10" class="muted-text">Updated 5m ago</text>
    </g>

    <!-- Card 3: VIP Customers -->
    <g transform="translate(420, 0)">
      <rect x="0" y="0" width="190" height="170" rx="10" class="card-bg"/>
      <rect x="0" y="0" width="190" height="170" rx="10" class="border"/>
      <rect x="15" y="15" width="36" height="36" rx="8" fill="#f59e0b"/>
      <text x="33" y="39" text-anchor="middle" font-size="16" class="white-text">⭐</text>
      <text x="60" y="30" font-size="13" font-weight="600" class="main-text">VIP Customers</text>
      <text x="60" y="46" font-size="11" class="secondary-text">High value</text>
      <rect x="15" y="65" width="50" height="18" rx="9" class="badge-static"/>
      <text x="40" y="78" text-anchor="middle" font-size="10" class="accent-text">Static</text>
      <line x1="15" y1="95" x2="175" y2="95" class="border"/>
      <text x="15" y="115" font-size="24" font-weight="700" class="main-text">512</text>
      <text x="15" y="135" font-size="11" class="secondary-text">contacts</text>
      <text x="15" y="155" font-size="10" class="muted-text">Updated 1d ago</text>
    </g>

    <!-- Card 4: Churn Risk -->
    <g transform="translate(630, 0)">
      <rect x="0" y="0" width="190" height="170" rx="10" class="card-bg"/>
      <rect x="0" y="0" width="190" height="170" rx="10" class="border"/>
      <rect x="15" y="15" width="36" height="36" rx="8" fill="#ef4444"/>
      <text x="33" y="39" text-anchor="middle" font-size="16" class="white-text">⚠️</text>
      <text x="60" y="30" font-size="13" font-weight="600" class="main-text">Churn Risk</text>
      <text x="60" y="46" font-size="11" class="secondary-text">Inactivity 60d+</text>
      <rect x="15" y="65" width="56" height="18" rx="9" class="badge-dynamic"/>
      <text x="43" y="78" text-anchor="middle" font-size="10" class="green-text">Dynamic</text>
      <line x1="15" y1="95" x2="175" y2="95" class="border"/>
      <text x="15" y="115" font-size="24" font-weight="700" class="main-text">187</text>
      <text x="15" y="135" font-size="11" class="secondary-text">contacts</text>
      <text x="15" y="155" font-size="10" class="muted-text">Updated 1h ago</text>
    </g>
  </g>

  <!-- Summary Row -->
  <g transform="translate(50, 345)">
    <rect x="0" y="0" width="810" height="55" rx="8" class="card-bg"/>
    <rect x="0" y="0" width="810" height="55" rx="8" class="border"/>
    <text x="20" y="22" font-size="12" font-weight="600" class="main-text">Total Contacts</text>
    <text x="20" y="42" font-size="18" font-weight="700" class="accent-text">12,422</text>
    <line x1="140" y1="10" x2="140" y2="45" class="border"/>
    <text x="160" y="22" font-size="12" font-weight="600" class="main-text">Lists</text>
    <text x="160" y="42" font-size="18" font-weight="700" class="main-text">4</text>
    <line x1="230" y1="10" x2="230" y2="45" class="border"/>
    <text x="250" y="22" font-size="12" font-weight="600" class="main-text">Static</text>
    <text x="250" y="42" font-size="18" font-weight="700" class="main-text">2</text>
    <line x1="310" y1="10" x2="310" y2="45" class="border"/>
    <text x="330" y="22" font-size="12" font-weight="600" class="main-text">Dynamic</text>
    <text x="330" y="42" font-size="18" font-weight="700" class="main-text">2</text>
    <line x1="400" y1="10" x2="400" y2="45" class="border"/>
    <text x="420" y="22" font-size="12" font-weight="600" class="main-text">Avg. Open Rate</text>
    <text x="420" y="42" font-size="18" font-weight="700" class="green-text">24.7%</text>
  </g>

  <!-- Recent Activity -->
  <g transform="translate(50, 420)">
    <text x="0" y="0" font-size="14" font-weight="600" class="main-text">Recent Activity</text>

    <g transform="translate(0, 15)">
      <circle cx="6" cy="6" r="4" fill="#3b82f6"/>
      <text x="18" y="10" font-size="12" class="main-text">Newsletter Subscribers imported 1,200 new contacts</text>
      <text x="680" y="10" font-size="11" class="muted-text">2h ago</text>
    </g>

    <g transform="translate(0, 40)">
      <circle cx="6" cy="6" r="4" fill="#22c55e"/>
      <text x="18" y="10" font-size="12" class="main-text">Active Users list refreshed automatically</text>
      <text x="680" y="10" font-size="11" class="muted-text">5m ago</text>
    </g>

    <g transform="translate(0, 65)">
      <circle cx="6" cy="6" r="4" fill="#f59e0b"/>
      <text x="18" y="10" font-size="12" class="main-text">VIP Customers exported to CSV</text>
      <text x="680" y="10" font-size="11" class="muted-text">1d ago</text>
    </g>

    <g transform="translate(0, 90)">
      <circle cx="6" cy="6" r="4" fill="#ef4444"/>
      <text x="18" y="10" font-size="12" class="main-text">Churn Risk list flagged 12 new contacts</text>
      <text x="680" y="10" font-size="11" class="muted-text">1h ago</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(50, 560)">
    <text x="0" y="0" font-size="10" class="muted-text">N = New list | I = Import CSV | E = Export | S = Search</text>
  </g>
</svg>