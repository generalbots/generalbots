<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.1"/>
    </filter>
    <filter id="shadowSm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .panel-bg { fill: #f8fafc; }
    .main-text { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
    .secondary-text { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; }
    .muted-text { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
    .white-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .accent-text { fill: #3b82f6; font-family: system-ui, -apple-system, sans-serif; }
    .border { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .icon-btn { fill: #f1f5f9; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    .nav-active { fill: #eff6ff; }
    .post-card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    .like-btn { fill: #fef2f2; }
    .comment-btn { fill: #f0f9ff; }
    .trending-badge { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .panel-bg { fill: #1e293b; }
      .main-text { fill: #e2e8f0; }
      .secondary-text { fill: #94a3b8; }
      .muted-text { fill: #64748b; }
      .accent-text { fill: #60a5fa; }
      .border { stroke: #334155; }
      .icon-btn { fill: #334155; }
      .card { fill: #1e293b; stroke: #334155; }
      .nav-active { fill: #1e3a5f; }
      .post-card { fill: #1e293b; stroke: #334155; }
      .like-btn { fill: #3b1a1a; }
      .comment-btn { fill: #1a2e3b; }
      .trending-badge { fill: #1e3a5f; stroke: #3b82f6; }
    }
  </style>

  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="600" class="main-text">Social</text>

  <!-- Main Container -->
  <rect x="30" y="40" width="840" height="530" rx="8" class="bg"/>
  <rect x="30" y="40" width="840" height="530" rx="8" class="border"/>

  <!-- Tab Bar -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="840" height="44" rx="8" class="panel-bg"/>
    <line x1="0" y1="44" x2="840" y2="44" class="border"/>
    <rect x="20" y="8" width="80" height="28" rx="6" fill="url(#accentGrad)"/>
    <text x="60" y="27" text-anchor="middle" font-size="12" font-weight="500" class="white-text">Feed</text>
    <text x="170" y="27" text-anchor="middle" font-size="13" class="secondary-text">Communities</text>
    <text x="310" y="27" text-anchor="middle" font-size="13" class="secondary-text">Announcements</text>
  </g>

  <!-- Main Feed Area -->
  <rect x="30" y="84" width="620" height="486" class="bg"/>

  <!-- Post Card 1 -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="580" height="130" rx="8" class="post-card" filter="url(#shadowSm)"/>
    <!-- Avatar -->
    <circle cx="24" cy="24" r="18" fill="#8b5cf6"/>
    <text x="24" y="29" text-anchor="middle" font-size="10" font-weight="600" class="white-text">SC</text>
    <!-- User Info -->
    <text x="52" y="20" font-size="13" font-weight="600" class="main-text">Sarah Chen</text>
    <text x="52" y="35" font-size="11" class="muted-text">2h ago</text>
    <!-- Post Content -->
    <text x="16" y="65" font-size="13" class="main-text">Excited to announce our new AI-powered analytics dashboard! Real-time insights</text>
    <text x="16" y="82" font-size="13" class="main-text">powered by GeneralBots. #AI #Analytics #GeneralBots</text>
    <!-- Action Buttons -->
    <g transform="translate(16, 100)">
      <rect x="0" y="0" width="70" height="24" rx="12" class="like-btn"/>
      <text x="12" y="16" font-size="11" class="secondary-text">❤ 42</text>
      <rect x="80" y="0" width="80" height="24" rx="12" class="comment-btn"/>
      <text x="92" y="16" font-size="11" class="secondary-text">💬 12</text>
    </g>
  </g>

  <!-- Post Card 2 -->
  <g transform="translate(50, 245)">
    <rect x="0" y="0" width="580" height="120" rx="8" class="post-card" filter="url(#shadowSm)"/>
    <!-- Avatar -->
    <circle cx="24" cy="24" r="18" fill="#22c55e"/>
    <text x="24" y="29" text-anchor="middle" font-size="10" font-weight="600" class="white-text">MR</text>
    <!-- User Info -->
    <text x="52" y="20" font-size="13" font-weight="600" class="main-text">Marcus Rivera</text>
    <text x="52" y="35" font-size="11" class="muted-text">5h ago</text>
    <!-- Post Content -->
    <text x="16" y="60" font-size="13" class="main-text">Just deployed the new compliance bot for our organization. Automated GDPR</text>
    <text x="16" y="77" font-size="13" class="main-text">compliance checks are saving us hours every week.</text>
    <!-- Action Buttons -->
    <g transform="translate(16, 95)">
      <rect x="0" y="0" width="70" height="24" rx="12" class="like-btn"/>
      <text x="12" y="16" font-size="11" class="secondary-text">❤ 28</text>
      <rect x="80" y="0" width="80" height="24" rx="12" class="comment-btn"/>
      <text x="92" y="16" font-size="11" class="secondary-text">💬 8</text>
    </g>
  </g>

  <!-- Post Card 3 -->
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="580" height="110" rx="8" class="post-card" filter="url(#shadowSm)"/>
    <!-- Avatar -->
    <circle cx="24" cy="24" r="18" fill="#f59e0b"/>
    <text x="24" y="29" text-anchor="middle" font-size="10" font-weight="600" class="white-text">LP</text>
    <!-- User Info -->
    <text x="52" y="20" font-size="13" font-weight="600" class="main-text">Lisa Park</text>
    <text x="52" y="35" font-size="11" class="muted-text">1d ago</text>
    <!-- Post Content -->
    <text x="16" y="60" font-size="13" class="main-text">Best practices for building enterprise chatbots. Tip #3: Always start with</text>
    <text x="16" y="77" font-size="13" class="main-text">your knowledge base before fine-tuning the LLM.</text>
    <!-- Action Buttons -->
    <g transform="translate(16, 90)">
      <rect x="0" y="0" width="70" height="24" rx="12" class="like-btn"/>
      <text x="12" y="16" font-size="11" class="secondary-text">❤ 56</text>
      <rect x="80" y="0" width="80" height="24" rx="12" class="comment-btn"/>
      <text x="92" y="16" font-size="11" class="secondary-text">💬 19</text>
    </g>
  </g>

  <!-- Right Sidebar: Trending -->
  <rect x="650" y="84" width="220" height="486" class="panel-bg"/>
  <line x1="650" y1="84" x2="650" y2="570" class="border"/>

  <!-- Trending Header -->
  <g transform="translate(670, 105)">
    <text x="0" y="0" font-size="15" font-weight="600" class="main-text">Trending Topics</text>
    <line x1="0" y1="10" x2="180" y2="10" class="border"/>

    <!-- Trending Item 1 -->
    <g transform="translate(0, 25)">
      <text x="0" y="0" font-size="13" font-weight="600" class="accent-text">#GeneralBotsAI</text>
      <text x="0" y="18" font-size="11" class="muted-text">2.4K posts</text>
    </g>

    <!-- Trending Item 2 -->
    <g transform="translate(0, 65)">
      <text x="0" y="0" font-size="13" font-weight="600" class="accent-text">#EnterpriseChat</text>
      <text x="0" y="18" font-size="11" class="muted-text">1.8K posts</text>
    </g>

    <!-- Trending Item 3 -->
    <g transform="translate(0, 105)">
      <text x="0" y="0" font-size="13" font-weight="600" class="accent-text">#Automation</text>
      <text x="0" y="18" font-size="11" class="muted-text">1.2K posts</text>
    </g>

    <!-- Trending Item 4 -->
    <g transform="translate(0, 145)">
      <text x="0" y="0" font-size="13" font-weight="600" class="accent-text">#GDPR</text>
      <text x="0" y="18" font-size="11" class="muted-text">980 posts</text>
    </g>

    <!-- Trending Item 5 -->
    <g transform="translate(0, 185)">
      <text x="0" y="0" font-size="13" font-weight="600" class="accent-text">#KnowledgeBase</text>
      <text x="0" y="18" font-size="11" class="muted-text">756 posts</text>
    </g>

    <!-- Suggested Connections -->
    <text x="0" y="240" font-size="14" font-weight="600" class="main-text">Suggested</text>
    <line x1="0" y1="250" x2="180" y2="250" class="border"/>

    <!-- Suggestion 1 -->
    <g transform="translate(0, 265)">
      <circle cx="12" cy="12" r="12" fill="#3b82f6"/>
      <text x="12" y="16" text-anchor="middle" font-size="8" font-weight="600" class="white-text">JD</text>
      <text x="32" y="10" font-size="12" font-weight="500" class="main-text">John Doe</text>
      <text x="32" y="24" font-size="10" class="muted-text">AI Engineer</text>
      <rect x="110" y="2" width="60" height="22" rx="11" fill="url(#accentGrad)"/>
      <text x="140" y="17" text-anchor="middle" font-size="10" font-weight="500" class="white-text">Follow</text>
    </g>

    <!-- Suggestion 2 -->
    <g transform="translate(0, 305)">
      <circle cx="12" cy="12" r="12" fill="#22c55e"/>
      <text x="12" y="16" text-anchor="middle" font-size="8" font-weight="600" class="white-text">AK</text>
      <text x="32" y="10" font-size="12" font-weight="500" class="main-text">Anna Kim</text>
      <text x="32" y="24" font-size="10" class="muted-text">Product Manager</text>
      <rect x="110" y="2" width="60" height="22" rx="11" fill="url(#accentGrad)"/>
      <text x="140" y="17" text-anchor="middle" font-size="10" font-weight="500" class="white-text">Follow</text>
    </g>
  </g>
</svg>