<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .panel-bg { fill: #f8fafc; }
    .main-text { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
    .secondary-text { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; }
    .muted-text { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
    .white-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .accent-text { fill: #3b82f6; font-family: system-ui, -apple-system, sans-serif; }
    .green-text { fill: #22c55e; font-family: system-ui, -apple-system, sans-serif; }
    .red-text { fill: #ef4444; font-family: system-ui, -apple-system, sans-serif; }
    .yellow-text { fill: #f59e0b; font-family: system-ui, -apple-system, sans-serif; }
    .border { stroke: #e2e8f0; stroke-width: 1; fill: none; }
    .icon-btn { fill: #f1f5f9; }
    .card-bg { fill: #f8fafc; }
    .tab-active { fill: #eff6ff; }
    .status-pass { fill: #dcfce7; }
    .status-fail { fill: #fee2e2; }
    .status-warn { fill: #fef3c7; }
    .progress-bg { fill: #e2e8f0; }
    .row-alt { fill: #f8fafc; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .panel-bg { fill: #1e293b; }
      .main-text { fill: #e2e8f0; }
      .secondary-text { fill: #94a3b8; }
      .muted-text { fill: #64748b; }
      .accent-text { fill: #60a5fa; }
      .green-text { fill: #4ade80; }
      .red-text { fill: #f87171; }
      .yellow-text { fill: #fbbf24; }
      .border { stroke: #334155; }
      .icon-btn { fill: #334155; }
      .card-bg { fill: #1e293b; }
      .tab-active { fill: #1e3a5f; }
      .status-pass { fill: #14532d; }
      .status-fail { fill: #450a0a; }
      .status-warn { fill: #451a03; }
      .progress-bg { fill: #334155; }
      .row-alt { fill: #1e293b; }
    }
  </style>

  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="600" class="main-text">ISO 27001 Compliance</text>

  <rect x="30" y="40" width="840" height="530" rx="8" class="bg"/>
  <rect x="30" y="40" width="840" height="530" rx="8" class="border"/>

  <!-- Stats Row -->
  <g transform="translate(50, 55)">
    <!-- Total Checks -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="140" height="72" rx="10" class="card-bg"/>
      <rect x="0" y="0" width="140" height="72" rx="10" class="border"/>
      <text x="15" y="20" font-size="11" class="secondary-text">Total Checks</text>
      <text x="15" y="50" font-size="28" font-weight="700" class="main-text">156</text>
    </g>

    <!-- Passed -->
    <g transform="translate(155, 0)">
      <rect x="0" y="0" width="140" height="72" rx="10" class="card-bg"/>
      <rect x="0" y="0" width="140" height="72" rx="10" class="border"/>
      <text x="15" y="20" font-size="11" class="secondary-text">Passed</text>
      <text x="15" y="50" font-size="28" font-weight="700" class="green-text">132</text>
      <rect x="100" y="8" width="32" height="18" rx="9" class="status-pass"/>
      <text x="116" y="21" text-anchor="middle" font-size="9" class="green-text">85%</text>
    </g>

    <!-- Failed -->
    <g transform="translate(310, 0)">
      <rect x="0" y="0" width="140" height="72" rx="10" class="card-bg"/>
      <rect x="0" y="0" width="140" height="72" rx="10" class="border"/>
      <text x="15" y="20" font-size="11" class="secondary-text">Failed</text>
      <text x="15" y="50" font-size="28" font-weight="700" class="red-text">8</text>
      <rect x="100" y="8" width="32" height="18" rx="9" class="status-fail"/>
      <text x="116" y="21" text-anchor="middle" font-size="9" class="red-text">5%</text>
    </g>

    <!-- Warnings -->
    <g transform="translate(465, 0)">
      <rect x="0" y="0" width="140" height="72" rx="10" class="card-bg"/>
      <rect x="0" y="0" width="140" height="72" rx="10" class="border"/>
      <text x="15" y="20" font-size="11" class="secondary-text">Warnings</text>
      <text x="15" y="50" font-size="28" font-weight="700" class="yellow-text">16</text>
      <rect x="100" y="8" width="32" height="18" rx="9" class="status-warn"/>
      <text x="116" y="21" text-anchor="middle" font-size="9" class="yellow-text">10%</text>
    </g>

    <!-- Score -->
    <g transform="translate(620, 0)">
      <rect x="0" y="0" width="140" height="72" rx="10" fill="url(#accentGrad)"/>
      <text x="15" y="22" font-size="11" class="white-text">Score</text>
      <text x="15" y="52" font-size="28" font-weight="700" class="white-text">87%</text>
      <text x="100" y="52" font-size="12" class="white-text">/100</text>
    </g>
  </g>

  <!-- Tab Bar -->
  <g transform="translate(30, 135)">
    <rect x="0" y="0" width="840" height="42" class="panel-bg"/>
    <line x1="0" y1="42" x2="840" y2="42" class="border"/>
    <g transform="translate(20, 0)">
      <rect x="0" y="2" width="90" height="38" rx="6" class="tab-active"/>
      <text x="45" y="26" text-anchor="middle" font-size="13" font-weight="500" class="accent-text">Dashboard</text>
    </g>
    <g transform="translate(125, 0)">
      <text x="40" y="26" text-anchor="middle" font-size="13" class="secondary-text">Checks</text>
    </g>
    <g transform="translate(220, 0)">
      <text x="40" y="26" text-anchor="middle" font-size="13" class="secondary-text">Issues</text>
    </g>
    <g transform="translate(315, 0)">
      <text x="55" y="26" text-anchor="middle" font-size="13" class="secondary-text">Audit Log</text>
    </g>
    <g transform="translate(440, 0)">
      <text x="65" y="26" text-anchor="middle" font-size="13" class="secondary-text">Risk Matrix</text>
    </g>
    <g transform="translate(575, 0)">
      <text x="55" y="26" text-anchor="middle" font-size="13" class="secondary-text">Training</text>
    </g>
  </g>

  <!-- Dashboard Grid -->
  <g transform="translate(50, 195)">
    <!-- Compliance Progress -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="380" height="170" rx="10" class="card-bg"/>
      <rect x="0" y="0" width="380" height="170" rx="10" class="border"/>
      <text x="20" y="28" font-size="14" font-weight="600" class="main-text">Compliance Progress</text>

      <!-- Control A -->
      <g transform="translate(20, 45)">
        <text x="0" y="12" font-size="12" class="main-text">A.5 Organizational</text>
        <rect x="200" y="3" width="150" height="10" rx="5" class="progress-bg"/>
        <rect x="200" y="3" width="140" height="10" rx="5" fill="#22c55e"/>
        <text x="360" y="13" font-size="11" class="green-text">93%</text>
      </g>

      <!-- Control B -->
      <g transform="translate(20, 70)">
        <text x="0" y="12" font-size="12" class="main-text">B.6 People Security</text>
        <rect x="200" y="3" width="150" height="10" rx="5" class="progress-bg"/>
        <rect x="200" y="3" width="130" height="10" rx="5" fill="#22c55e"/>
        <text x="360" y="13" font-size="11" class="green-text">87%</text>
      </g>

      <!-- Control C -->
      <g transform="translate(20, 95)">
        <text x="0" y="12" font-size="12" class="main-text">C.8 Asset Management</text>
        <rect x="200" y="3" width="150" height="10" rx="5" class="progress-bg"/>
        <rect x="200" y="3" width="120" height="10" rx="5" fill="#f59e0b"/>
        <text x="360" y="13" font-size="11" class="yellow-text">80%</text>
      </g>

      <!-- Control D -->
      <g transform="translate(20, 120)">
        <text x="0" y="12" font-size="12" class="main-text">D.14 Cryptography</text>
        <rect x="200" y="3" width="150" height="10" rx="5" class="progress-bg"/>
        <rect x="200" y="3" width="143" height="10" rx="5" fill="#22c55e"/>
        <text x="360" y="13" font-size="11" class="green-text">95%</text>
      </g>

      <!-- Control E -->
      <g transform="translate(20, 145)">
        <text x="0" y="12" font-size="12" class="main-text">E.16 Operations</text>
        <rect x="200" y="3" width="150" height="10" rx="5" class="progress-bg"/>
        <rect x="200" y="3" width="115" height="10" rx="5" fill="#ef4444"/>
        <text x="360" y="13" font-size="11" class="red-text">77%</text>
      </g>
    </g>

    <!-- Recent Activity -->
    <g transform="translate(400, 0)">
      <rect x="0" y="0" width="370" height="170" rx="10" class="card-bg"/>
      <rect x="0" y="0" width="370" height="170" rx="10" class="border"/>
      <text x="20" y="28" font-size="14" font-weight="600" class="main-text">Recent Activity</text>

      <g transform="translate(20, 42)">
        <rect x="0" y="0" width="8" height="8" rx="4" fill="#22c55e"/>
        <text x="18" y="8" font-size="12" class="main-text">Access control check passed</text>
        <text x="300" y="8" font-size="10" class="muted-text">2h ago</text>
      </g>

      <g transform="translate(20, 67)">
        <rect x="0" y="0" width="8" height="8" rx="4" fill="#ef4444"/>
        <text x="18" y="8" font-size="12" class="main-text">Encryption key rotation overdue</text>
        <text x="300" y="8" font-size="10" class="muted-text">5h ago</text>
      </g>

      <g transform="translate(20, 92)">
        <rect x="0" y="0" width="8" height="8" rx="4" fill="#f59e0b"/>
        <text x="18" y="8" font-size="12" class="main-text">Backup verification pending</text>
        <text x="300" y="8" font-size="10" class="muted-text">1d ago</text>
      </g>

      <g transform="translate(20, 117)">
        <rect x="0" y="0" width="8" height="8" rx="4" fill="#22c55e"/>
        <text x="18" y="8" font-size="12" class="main-text">Firewall rules updated</text>
        <text x="300" y="8" font-size="10" class="muted-text">2d ago</text>
      </g>

      <g transform="translate(20, 142)">
        <rect x="0" y="0" width="8" height="8" rx="4" fill="#22c55e"/>
        <text x="18" y="8" font-size="12" class="main-text">Incident response drill completed</text>
        <text x="300" y="8" font-size="10" class="muted-text">3d ago</text>
      </g>
    </g>
  </g>

  <!-- Risk Summary -->
  <g transform="translate(50, 385)">
    <rect x="0" y="0" width="750" height="70" rx="10" class="card-bg"/>
    <rect x="0" y="0" width="750" height="70" rx="10" class="border"/>
    <text x="20" y="22" font-size="14" font-weight="600" class="main-text">Risk Summary</text>

    <g transform="translate(20, 35)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#ef4444"/>
      <text x="18" y="10" font-size="12" class="main-text">High: 2</text>
    </g>
    <g transform="translate(120, 35)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#f59e0b"/>
      <text x="18" y="10" font-size="12" class="main-text">Medium: 6</text>
    </g>
    <g transform="translate(240, 35)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#22c55e"/>
      <text x="18" y="10" font-size="12" class="main-text">Low: 8</text>
    </g>
    <g transform="translate(350, 35)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#3b82f6"/>
      <text x="18" y="10" font-size="12" class="main-text">Accepted: 140</text>
    </g>
    <g transform="translate(520, 35)">
      <text x="0" y="10" font-size="12" class="secondary-text">Next audit: 2026-07-01</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(50, 560)">
    <text x="0" y="0" font-size="10" class="muted-text">R = Refresh | E = Export report | A = Run audit | S = Search checks</text>
  </g>
</svg>