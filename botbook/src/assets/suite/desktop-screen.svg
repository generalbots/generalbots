<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel-bg { fill: #ffffff; }
      .main-text { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
      .secondary-text { fill: #475569; font-family: system-ui, -apple-system, sans-serif; }
      .muted-text { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
      .white-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
      .accent-text { fill: #8b5cf6; font-family: system-ui, -apple-system, sans-serif; }
      .border { stroke: #e2e8f0; stroke-width: 1; fill: none; }
      .icon-btn { fill: #f1f5f9; rx: 6; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0f172a; }
        .panel-bg { fill: #1e293b; }
        .main-text { fill: #f1f5f9; }
        .secondary-text { fill: #cbd5e1; }
        .muted-text { fill: #64748b; }
        .white-text { fill: #f1f5f9; }
        .accent-text { fill: #a78bfa; }
        .border { stroke: #334155; }
        .icon-btn { fill: #334155; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" class="bg" rx="0"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" class="main-text" font-size="18" font-weight="600">Desktop VDI</text>

  <!-- Main Card -->
  <rect x="16" y="52" width="868" height="536" rx="8" class="panel-bg"/>
  <rect x="16" y="52" width="868" height="536" rx="8" class="border"/>

  <!-- Header Bar -->
  <rect x="16" y="52" width="868" height="44" rx="8" class="panel-bg"/>
  <text x="32" y="80" class="main-text" font-size="15" font-weight="600">Connections</text>

  <!-- New Connection Button -->
  <rect x="756" y="60" width="116" height="28" rx="6" fill="#8b5cf6"/>
  <text x="778" y="79" class="white-text" font-size="12" font-weight="500">+ New Connection</text>

  <!-- Quick Connect Bar -->
  <rect x="28" y="112" width="460" height="36" rx="8" fill="#f1f5f9"/>
  <text x="44" y="134" class="muted-text" font-size="13">host:port</text>

  <rect x="500" y="112" width="96" height="36" rx="8" fill="#8b5cf6"/>
  <text x="524" y="134" class="white-text" font-size="13" font-weight="500">Connect</text>

  <!-- Quick Connect Label -->
  <text x="28" y="100" class="secondary-text" font-size="11" font-weight="600" letter-spacing="0.5">QUICK CONNECT</text>

  <!-- Saved Connections Label -->
  <text x="28" y="176" class="secondary-text" font-size="11" font-weight="600" letter-spacing="0.5">SAVED CONNECTIONS</text>

  <!-- Connection Card 1 -->
  <rect x="28" y="188" width="416" height="72" rx="8" class="panel-bg"/>
  <rect x="28" y="188" width="416" height="72" rx="8" class="border"/>
  <circle cx="64" cy="224" r="16" fill="#8b5cf6" opacity="0.15"/>
  <text x="57" y="229" class="accent-text" font-size="14">PC</text>
  <text x="92" y="216" class="main-text" font-size="13" font-weight="500">Workstation Alpha</text>
  <text x="92" y="236" class="muted-text" font-size="12">10.0.1.50:5900</text>
  <rect x="400" y="208" width="32" height="22" rx="4" fill="#22c55e" opacity="0.15"/>
  <text x="408" y="223" fill="#22c55e" font-size="10" font-family="system-ui, -apple-system, sans-serif">ON</text>

  <!-- Connection Card 2 -->
  <rect x="464" y="188" width="416" height="72" rx="8" class="panel-bg"/>
  <rect x="464" y="188" width="416" height="72" rx="8" class="border"/>
  <circle cx="500" cy="224" r="16" fill="#8b5cf6" opacity="0.15"/>
  <text x="493" y="229" class="accent-text" font-size="14">PC</text>
  <text x="528" y="216" class="main-text" font-size="13" font-weight="500">Server Beta</text>
  <text x="528" y="236" class="muted-text" font-size="12">10.0.1.51:5901</text>
  <rect x="836" y="208" width="32" height="22" rx="4" fill="#f59e0b" opacity="0.15"/>
  <text x="838" y="223" fill="#f59e0b" font-size="10" font-family="system-ui, -apple-system, sans-serif">OFF</text>

  <!-- VNC Session Area Label -->
  <text x="28" y="292" class="secondary-text" font-size="11" font-weight="600" letter-spacing="0.5">ACTIVE SESSION</text>

  <!-- VNC Session Area (dark rectangle) -->
  <rect x="28" y="304" width="850" height="272" rx="8" fill="#1e293b"/>
  <rect x="28" y="304" width="850" height="272" rx="8" stroke="#334155" stroke-width="1" fill="none"/>

  <!-- VNC Desktop Elements -->
  <rect x="40" y="316" width="826" height="24" rx="4" fill="#0f172a"/>
  <text x="52" y="332" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, sans-serif">Workstation Alpha — VNC</text>
  <circle cx="860" cy="328" r="4" fill="#22c55e"/>

  <!-- Fake Desktop Icons -->
  <rect x="60" y="360" width="48" height="48" rx="6" fill="#334155"/>
  <text x="70" y="389" fill="#94a3b8" font-size="9" font-family="system-ui, -apple-system, sans-serif">Files</text>
  <rect x="120" y="360" width="48" height="48" rx="6" fill="#334155"/>
  <text x="130" y="389" fill="#94a3b8" font-size="9" font-family="system-ui, -apple-system, sans-serif">Term</text>
  <rect x="180" y="360" width="48" height="48" rx="6" fill="#334155"/>
  <text x="188" y="389" fill="#94a3b8" font-size="9" font-family="system-ui, -apple-system, sans-serif">Edit</text>

  <!-- Fake Window -->
  <rect x="260" y="350" width="500" height="200" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="260" y="350" width="500" height="24" rx="6" fill="#1e293b"/>
  <text x="276" y="366" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">terminal</text>
  <text x="276" y="400" fill="#60a5fa" font-size="11" font-family="monospace">$ _</text>

  <!-- Taskbar -->
  <rect x="40" y="548" width="826" height="20" rx="4" fill="#334155"/>
</svg>
