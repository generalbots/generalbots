# Coverage exclusions and per-crate floors (#2074, program #2075).
#
# `cargo-llvm-cov` measures one crate at a time (the full workspace graph
# exceeds the CI memory budget), and `scripts/check_coverage.py` compares the
# result with the floors below after dropping the excluded paths.
#
# Rules enforced by the script:
#   * every [[exclusion]] needs `path`, `reason` and `issue`;
#   * `path` must point inside a crate's `src/` tree (a whole crate cannot be
#     excluded), may use `*`/`**` and a trailing `/` for a module directory;
#   * a floored crate must keep at least one measured file.
#
# Floors are percentages. `enforce = false` means "report the number, do not
# fail the job yet": the remaining floors flip to `true` as each domain issue
# (#2064-#2073) lands and its baseline is measured in CI. A crate with no
# [floors.*] entry is not measured at all.

[meta]
issue = 2074
program = 2075
tool = "cargo-llvm-cov"
note = """`botschema` is generated by `diesel print-schema` (macro declarations with no
executable logic) and is therefore not floored; `botapp` is a Tauri shell that
only compiles inside the desktop bundler, so it is not floored either — its
pure decision modules are still unit-tested by `cargo test -p botapp --lib`
(#2075) and only the webview/process-owning modules are excluded by path."""

# --- generated code -------------------------------------------------------
# `diesel print-schema` output: `table!` macro invocations, no statements to
# execute, so a coverage number would measure the macro expander, not our code.
[[exclusion]]
path = "botschema/src/core.rs"
reason = "generated by `diesel print-schema`; `table!` declarations with no executable logic"
issue = 2074

[[exclusion]]
path = "botschema/src/core/"
reason = "generated by `diesel print-schema`; `table!` declarations with no executable logic"
issue = 2074

[[exclusion]]
path = "botschema/src/billing.rs"
reason = "generated by `diesel print-schema`; `table!` declarations with no executable logic"
issue = 2074

[[exclusion]]
path = "botschema/src/people.rs"
reason = "generated by `diesel print-schema`; `table!` declarations with no executable logic"
issue = 2074

# --- vendored third-party ------------------------------------------------
# These crates are excluded from the workspace (root Cargo.toml `exclude`), so
# they never appear in a report; the entries record the decision so nobody
# "fixes" the missing coverage by adding them to the workspace.
[[exclusion]]
path = "3rdparty/docx-rs/src/lib.rs"
reason = "vendored third-party office crate (MIT, zip-9 patch); not a workspace member, not our code"
issue = 2074

[[exclusion]]
path = "3rdparty/umya-spreadsheet/src/lib.rs"
reason = "vendored third-party spreadsheet crate (MIT, zip-9 patch); not a workspace member, not our code"
issue = 2074

# --- Tauri desktop shell -------------------------------------------------
# The shell needs a webview and the bundler, so `botapp` is not floored and the
# crate is exercised end to end by the packaging smoke test in release.yml.
# The pure decision logic is NOT excluded: `cargo test -p botapp --lib` covers
# sidecar start/probe/path resolution, boot-log parsing, version comparison,
# wizard state and paths, upload/destination guards, tray labels and device
# probes (#2075). Only the webview/process-owning modules are excluded.
[[exclusion]]
path = "botapp/src/main.rs"
reason = "Tauri entry point: builds windows, plugins and the invoke handler; needs a webview"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/splash.rs"
reason = "creates and drives the splash webview window; needs a webview"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/sidecar.rs"
reason = "spawns, watches and kills the botserver child process; integration/desktop test only"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/download.rs"
reason = "native Save dialog plus HTTP fetch and file write; needs a GUI session"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/sync.rs"
reason = "spawns and monitors the rclone child process; integration/desktop test only"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/drive.rs"
reason = "Tauri commands over the filesystem (list/upload/create/delete) plus window events"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/legacy_data.rs"
reason = "renames/copies the legacy WebKit profile on disk before any webview opens"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/tray/"
reason = "builds the native tray icon and menu; needs a GUI session"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/wizard/window.rs"
reason = "creates the wizard/suite webview windows and navigates them"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/wizard/commands.rs"
reason = "Tauri command surface: forwards to the modules below; needs a webview runtime"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/wizard/hostcheck/"
reason = "executes PROD-DEPENDENCIES.sh/.ps1 on the host; the parsers are unit-tested, the runner is not"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/wizard/media.rs"
reason = "probes the running BotModels service and the host library tree; `normalize` is unit-tested"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/wizard/provision/"
reason = "spawns and supervises `botserver --provision-stack`; integration/desktop test only"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/wizard/session.rs"
reason = "mints the desktop session over HTTP against the local API; integration/desktop test only"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/wizard/system.rs"
reason = "opens folders/URLs and probes the host filesystem and model providers"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/wizard/handoff.rs"
reason = "writes credentials/marker files and hands the window to the suite"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/payload.rs"
reason = "reads the appended payload from the running executable and extracts it"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/update.rs"
reason = "fetches releases/latest from GitHub; `update_available` and asset selection are unit-tested"
issue = 2075

[[exclusion]]
path = "botapp/src/desktop/activity.rs"
reason = "reads the sidecar heartbeat file; `parse_active_turns` is unit-tested"
issue = 2075

# --- e2e-only modules ----------------------------------------------------
# Driving a real browser or a desktop window is an e2e concern (needs Chrome on
# :9222 or a GUI session); the offline unit suite must never import them.
[[exclusion]]
path = "bottest/src/web/"
reason = "CDP browser automation: needs a live Chrome on :9222, e2e suite only"
issue = 2074

[[exclusion]]
path = "bottest/src/desktop/"
reason = "desktop app driver: needs a GUI session, e2e suite only"
issue = 2074

[[exclusion]]
path = "bottest/src/main.rs"
reason = "test-runner binary entry point: spawns services and the e2e suites, no unit-testable logic"
issue = 2074

# --- floors --------------------------------------------------------------
# Baseline floors. They start low on purpose: the point of the first CI run is
# to measure, then raise the number as the domain issues land.
[floors.botlib]
lines = 10.0
functions = 10.0
branches = 5.0
enforce = true

[floors.botlog]
lines = 50.0
functions = 50.0
branches = 40.0
enforce = false

[floors.botbasic_types]
