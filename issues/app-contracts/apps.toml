# App contracts (#2119).
#
# One entry per id in `botserver/src/apps/registry/*.rs`. An entry documents the
# app's server surface in one of two ways:
#
#   [app.<id>]
#   routes = ["/api/<prefix>", ...]      # representative routes, not the full
#                                        # inventory (that is `endpoint_inventory`)
#
#   [app.<id>]
#   no_api = true                        # no server route at all
#   reason = "why the app needs no API"  # >= 20 characters
#   issue  = 2119                        # who owns the decision
#
# `python3 scripts/smoke_app_surfaces.py --contracts` verifies every listed
# route exists as a `"/api/..."` literal in the botserver sources, so a contract
# cannot invent a route the server does not serve. The same run also requires a
# product classification and a `/suite/...` smoke surface for every app.

[meta]
issue = 2119
note = "Representative routes per app; full inventories come from endpoint_inventory."

[app.about]
no_api = true
reason = "static About page: version, credits and licenses come from the bundled product file"
issue = 2119

