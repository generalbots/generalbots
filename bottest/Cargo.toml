[package]
name = "bottest"
version.workspace = true
edition = "2021"
description = "Comprehensive test suite for General Bots - Unit, Integration, and E2E testing"
license = "MIT"
repository = "https://github.com/generalbots/generalbots"
readme = "README.md"
keywords = ["testing", "bot", "integration-testing", "e2e", "general-bots"]
categories = ["development-tools::testing"]

[dependencies]
botlib = { workspace = true, features = ["database"] }
# Async runtime
tokio = { workspace = true, features = ["full", "test-util", "macros"] }
async-trait = { workspace = true }
futures = { workspace = true }

# Database
diesel = { workspace = true, features = ["postgres", "uuid", "chrono", "serde_json", "r2d2"] }

# Crates under test
botbilling = { workspace = true }
botsecurity-core = { workspace = true }

# HTTP mocking and testing
wiremock = { workspace = true }
cookie = { workspace = true }
reqwest = { workspace = true, features = ["json", "cookies", "blocking", "rustls-tls"] }

# Web/E2E testing - using Chrome DevTools Protocol directly (no chromedriver)
chromiumoxide = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Utilities
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
chrono = { workspace = true, features = ["serde"] }
which = { workspace = true }
regex = { workspace = true }

# Archive extraction
zip = { workspace = true }

# Logging and tracing
log = { workspace = true }
env_logger = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

# Error handling
anyhow = { workspace = true }

# Test framework enhancements
# Rhai for BASIC function testing
rhai = { workspace = true, features = ["sync"] }

[dev-dependencies]
insta = { workspace = true }
botschema = { workspace = true, features = ["full"] }
botbasic_types = { workspace = true }
# #2119 — the stable-CI property fallback for the cargo-fuzz targets drives the
# real parsers (JWT, channel webhooks, BASIC transforms), so their crates must
# be reachable from `tests/fuzz_regressions.rs`.
botbasic_compiler = { workspace = true }
botsecurity-auth = { workspace = true }
botwhatsapp = { workspace = true }
# #2113 — the Teams inbound gate (HMAC / Bot Framework) so the offline suite can
# prove an unauthenticated POST cannot create a bot turn.
botmsteams = { workspace = true }
# `HeaderMap` is the argument type of both inbound gates (#2112, #2113); axum
# re-exports this same `http` type, so the tests build headers directly.
http = { workspace = true }
# The office editors, so the cross-format fidelity contract (#2044) can drive
# their public import/patch/export APIs instead of re-implementing them.
botdocs = { workspace = true }
botslides = { workspace = true }
botsheet = { workspace = true }
botsheet-core = { workspace = true }

[features]
default = ["full"]
integration = []
e2e = []
full = ["integration", "e2e"]

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
required-features = ["integration"]

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
required-features = ["e2e"]

# Offline contract test for the media-filing chain (#1357). Declared explicitly
# because a `[[test]]` table disables test-target auto-discovery, and this one
# must run with `cargo test -p bottest media_filing` in CI without a database,
# MinIO or an LLM.
[[test]]
name = "media_filing"
path = "tests/media_filing_test.rs"

# Offline cross-format fidelity contract for the office editors (#2044).
# Declared explicitly for the same reason as `media_filing`: a `[[test]]` table
# disables target auto-discovery, and this one must run with no database, no
# MinIO and no LLM.
[[test]]
name = "office_fidelity"
path = "tests/office_fidelity.rs"

# #2119 — deterministic property fallback for the `fuzz/` targets: JWT/claims
# decode, WhatsApp webhook bodies, BASIC source transforms and office import.
# Runs on stable with no services, so every PR exercises malformed input.
[[test]]
name = "fuzz_regressions"
path = "tests/fuzz_regressions.rs"

[[bin]]
name = "bottest"
path = "src/main.rs"

# Process management for services (Unix only)
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[lints]
workspace = true
