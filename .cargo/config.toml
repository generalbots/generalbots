[build]
# Compile as wide as the host allows: `jobs = 8` saturates the 4-vCPU dev box
# (link and codegen overlap, which is where most wall time goes) and matches
# the CI runners. Override per invocation with CARGO_BUILD_JOBS when the box is
# shared — e.g. CARGO_BUILD_JOBS=2 while another job needs the cores.
jobs = 6

[target.x86_64-unknown-linux-gnu]
# mold links the ~280 MB dev binary in a fraction of the time GNU ld needs.
# `clang` is required because rustc on Debian passes `-fuse-ld=lld` and a bare
# `gcc` driver then fails to find `ld`; clang resolves mold through `ld.mold`
# on PATH (Ubuntu/Debian `mold` package, or `ln -s /usr/bin/mold ~/.local/bin/ld.mold`).
# CI installs both from `.github/actions/rust-setup` (default packages).
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/LIBPATH:C:\\pgsql\\pgsql\\lib"]

# PQ_LIB_DIR is deliberately NOT set here. Cargo's `[env]` table is global — it
# also applied on Linux (and macOS), so `pq-sys` aborted every non-Windows build
# with `Folder "PQ_LIB_DIR" doesn't exist ... C:\pgsql\pgsql\lib` (#1985).
#
# Only Windows needs it: both the Windows CI job and release.yml export the
# real path via GITHUB_ENV after installing libpq, and a Windows developer sets
# it to their own PostgreSQL lib directory (e.g.
# `$env:PQ_LIB_DIR = "C:\Program Files\PostgreSQL\16\lib"`) before building.
