<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — General Bots Cloud</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Oxygen,sans-serif;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

    :root{--bg:#ffffff;--fg:#0a0a0e;--muted:#64646e;--card-bg:#ffffff;--card-border:#e4e4ea;
      --input-bg:#fafafa;--input-border:#d4d4da;--bar-bg:#040404;--bar-fg:rgba(245,245,249,.5);
      --bar-link:rgba(245,245,249,.55);--toggle-bg:rgba(0,0,0,.6);--placeholder:#8e8e96;
      --label:#3a3a42;--plan-bg:#fafafa;--plan-border:#d4d4da;
      --plan-selected-bg:#f0f0f4;--plan-selected-border:#0a0a0e}
    [data-theme="dark"]{--bg:#0d0d12;--fg:#e8e8ee;--muted:#8a8a96;--card-bg:#16161e;
      --card-border:#2a2a34;--input-bg:#1a1a24;--input-border:#2a2a34;--bar-bg:#f0f0f4;
      --bar-fg:rgba(10,10,14,.5);--bar-link:rgba(10,10,14,.55);--toggle-bg:rgba(255,255,255,.15);
      --placeholder:#6a6a76;--label:#b0b0ba;
      --plan-bg:#1a1a24;--plan-border:#2a2a34;--plan-selected-bg:#22222e;--plan-selected-border:#e8e8ee}

    body{display:flex;flex-direction:column;min-height:100vh;background:var(--bg);color:var(--fg);transition:background .3s,color .3s}
    .bar{background:var(--bar-bg);height:4px;flex-shrink:0;transition:background .3s}

    .middle{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 24px}
    .card{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}

    .product-logo{margin-bottom:4px;display:flex;align-items:center;justify-content:center}
    .product-logo img{width:80px;height:80px}
    .product-logo a{display:flex}

    .card h1{font-size:1.2rem;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
    .card > p{font-size:.78rem;color:var(--muted);margin-bottom:14px}

    .form-row{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    .form-group{display:flex;flex-direction:column;gap:4px}
    .form-label{font-size:.7rem;font-weight:600;color:var(--label);text-transform:uppercase;letter-spacing:.04em}
    .form-input{width:100%;padding:10px 12px;font-size:.85rem;font-family:inherit;
      border:1.5px solid var(--input-border);border-radius:7px;background:var(--input-bg);
      color:var(--fg);transition:border-color .15s,box-shadow .15s;outline:none}
    .form-input:focus{border-color:#0077b6;box-shadow:0 0 0 3px rgba(0,119,182,.15)}
    .form-input::placeholder{color:var(--placeholder)}
    .form-help{font-size:.62rem;color:var(--muted);margin-top:1px}

    .btn{width:100%;padding:10px 14px;font-size:.85rem;font-weight:700;font-family:inherit;
      border:none;border-radius:7px;cursor:pointer;transition:opacity .15s,transform .1s;
      background:#0a0a0e;color:#fff;margin-top:4px}
    [data-theme="dark"] .btn{background:#0a0a0e;color:#fff}
    .btn:active{transform:scale(.98)}
    .btn:disabled{opacity:.5;cursor:not-allowed}

    .error-box{width:100%;display:none;background:rgba(217,48,62,.08);
      border:1px solid rgba(217,48,62,.25);border-radius:7px;
      padding:7px 11px;font-size:.75rem;color:#b91c1c;margin-bottom:8px}

    .alt{width:100%;text-align:center;font-size:.75rem;color:var(--muted);margin-top:12px}
    .alt a{color:var(--fg);font-weight:600;text-decoration:none}
    .alt a:hover{text-decoration:underline}

    .plan-chooser{width:100%;display:flex;gap:8px;margin-bottom:8px}
    .plan-option{flex:1;display:flex;flex-direction:column;gap:1px;padding:7px 8px;
      border:1.5px solid var(--plan-border);border-radius:8px;cursor:pointer;
      transition:border-color .15s,background .15s;background:var(--plan-bg);
      position:relative}
    .plan-option input{position:absolute;opacity:0;pointer-events:none}
    .plan-option.selected{border-color:var(--plan-selected-border);background:var(--plan-selected-bg)}
    .plan-option:hover{border-color:var(--muted)}
    .plan-option-name{font-weight:700;font-size:.72rem;color:var(--fg)}
    .plan-option-price{font-weight:800;font-size:.8rem;color:var(--fg)}
    .plan-option-desc{font-size:.58rem;color:var(--muted);line-height:1.2}
    .plan-option-private{border-style:dashed}
    .plan-option-private.selected{border-style:solid;border-color:#7c3aed;background:rgba(124,58,237,.06)}
    .plan-option-private .plan-option-price{color:#7c3aed;font-size:.7rem}

    .info-box{width:100%;background:rgba(0,119,182,.06);border:1px solid rgba(0,119,182,.2);
      border-radius:7px;padding:7px 11px;font-size:.72rem;color:var(--muted);margin-bottom:6px}

    .bottom-links{display:flex;align-items:center;justify-content:space-between;padding:6px 24px}
    .bottom-links a{font-size:.65rem;color:var(--bar-link);text-decoration:none;letter-spacing:.02em}
    .bottom-links a:hover{color:var(--fg)}
    .bottom-links nav{display:flex;gap:12px}
    .bottombar{height:4px;flex-shrink:0}

    .theme-btn{position:fixed;top:8px;right:12px;z-index:100;width:30px;height:30px;
      border-radius:99px;border:none;cursor:pointer;font-size:.9rem;display:flex;
      align-items:center;justify-content:center;background:var(--toggle-bg);
      color:#fff;transition:background .2s,transform .2s}
    .theme-btn:hover{transform:scale(1.1)}
    .theme-btn:active{transform:scale(.95)}
  </style>
</head>
<body>

<div class="bar"></div>
<button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">☀️</button>

<main class="middle">
  <div class="card">
    <div class="product-logo"><a href="https://generalbots.org" target="_blank"><img src="/cloud/images/logo.svg" alt="General Bots"></a></div>
    <h1>Create Account</h1>
    <p>Start managing your General Bots Cloud</p>

    <div id="signup-error" class="error-box"></div>

    <form id="signup-form" onsubmit="return doSignup(event)" style="width:100%">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="signup-name">Name</label>
          <input id="signup-name" class="form-input" type="text" name="name" placeholder="Full name">
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-botname">Bot Name</label>
          <input id="signup-botname" class="form-input" type="text" name="bot_name" required placeholder="e.g. MyAssistant">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="signup-email">Email</label>
          <input id="signup-email" class="form-input" type="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-password">Password</label>
          <input id="signup-password" class="form-input" type="password" name="password" required minlength="8" placeholder="At least 8 chars">
        </div>
      </div>

      <div class="plan-chooser" id="plan-chooser">
        <label class="plan-option selected" data-plan="free">
          <input type="radio" name="plan" value="free" checked>
          <span class="plan-option-name">Free</span>
          <span class="plan-option-price">$0/mo</span>
          <span class="plan-option-desc">1 bot, 20MB</span>
        </label>
        <label class="plan-option" data-plan="shared">
          <input type="radio" name="plan" value="shared">
          <span class="plan-option-name">Shared</span>
          <span class="plan-option-price">$3.99/mo</span>
          <span class="plan-option-desc">5 bots, 50GB, 14-day <strong>TRIAL</strong></span>
        </label>
        <label class="plan-option plan-option-private" data-plan="private-cloud">
          <input type="radio" name="plan" value="private-cloud">
          <span class="plan-option-name">Private Server</span>
          <span class="plan-option-price">from $9.99</span>
          <span class="plan-option-desc">Isolated tenant</span>
        </label>
      </div>

      <button type="submit" id="signup-btn" class="btn">Create Free Account</button>
      <div id="private-server-info" class="info-box" style="display:none">
        You are signing up for a <strong>Private Server</strong> environment.
        After creating your account, you will be redirected to configure and purchase a VPS.
      </div>
    </form>

    <div class="alt">Already have an account? <a href="/">Sign in</a></div>
  </div>
</main>

<div class="bottom-links">
  <a href="https://generalbots.org">generalbots.org</a>
  <nav>
    <a href="https://docs.pragmatismo.com.br">Docs</a>
    <a href="https://github.com/GeneralBots/BotServer">GitHub</a>
  </nav>
</div>
<div class="bottombar"></div>

<script src="/cloud/js/cloud-auth.js"></script>
<script>
(function(){var k='gb-login-theme',r=document.documentElement,b=document.getElementById('theme-btn');
function apply(t){if(t==='dark'){r.setAttribute('data-theme','dark');b.textContent='🌙'}else{r.removeAttribute('data-theme');b.textContent='☀️'}
localStorage.setItem(k,t)}
var s=localStorage.getItem(k);if(s)apply(s);
window.toggleTheme=function(){var n=r.getAttribute('data-theme')==='dark'?'light':'dark';apply(n)};})();

(function(){
var chooser=document.getElementById('plan-chooser');
var btn=document.getElementById('signup-btn');
var info=document.getElementById('private-server-info');
var labels=chooser.querySelectorAll('.plan-option');

labels.forEach(function(l){
  l.addEventListener('click',function(){
    labels.forEach(function(x){x.classList.remove('selected')});
    l.classList.add('selected');
    l.querySelector('input[type=radio]').checked=true;

    var plan=l.getAttribute('data-plan');
    if(plan==='free'){btn.textContent='Create Free Account';info.style.display='none'}
    else if(plan==='shared'){btn.textContent='Start 14-Day Trial';info.style.display='none'}
    else if(plan==='private-cloud'){btn.textContent='Get a Quote';info.style.display='block'}
  });
});
})();
</script>
</body>
</html>
