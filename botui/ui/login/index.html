<!DOCTYPE html>
<html lang="en" data-i18n-document-title="login-document-title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — General Bots</title>
  <link rel="stylesheet" href="/suite/css/identity-tokens.css" />
  <link rel="stylesheet" href="/suite/identity/fonts.css" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:var(--id-font-sans);
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

    /* Auth-page aliases to the mandatory identity tokens (DESIGN-SYSTEM.md). */
    :root{
      --bg:var(--id-paper);--fg:var(--id-ink);--muted:var(--id-muted);
      --card-bg:var(--id-surface-solid);--card-border:var(--id-line);
      --input-bg:var(--id-surface-solid);--input-border:var(--id-line);
      --bar-bg:var(--id-ink);--bar-fg:var(--id-muted);--bar-link:var(--id-muted);
      --toggle-bg:var(--id-ink);--toggle-fg:var(--id-surface-solid);
      --placeholder:var(--id-gray-400);--label:var(--id-text)}
    /* Dark surfaces reuse the fixed identity neutrals — no bespoke palette. */
    :root[data-theme="dark"]{
      --bg:var(--id-ink);--fg:var(--id-gray-100);--muted:var(--id-gray-300);
      --card-bg:var(--id-ink);--card-border:var(--id-gray-500);
      --input-bg:var(--id-ink);--input-border:var(--id-gray-500);
      --bar-bg:var(--id-gray-100);--bar-fg:var(--id-gray-300);--bar-link:var(--id-gray-200);
      --toggle-bg:var(--id-gray-200);--toggle-fg:var(--id-ink);
      --placeholder:var(--id-gray-400);--label:var(--id-gray-200)}

    body{display:flex;flex-direction:column;min-height:100vh;background:var(--bg);color:var(--fg);transition:background var(--id-dur-normal),color var(--id-dur-normal)}
    .bar{background:var(--bar-bg);height:4px;flex-shrink:0;transition:background var(--id-dur-normal)}
    .gb-preview-banner{background:var(--id-warn-bg);color:var(--id-warn-text);text-align:center;padding:3px 12px;font-size:0.7rem;font-weight:500;line-height:1.3}
    .gb-preview-banner a{color:var(--id-warn-text);font-weight:600}
    .gb-preview-banner a:hover{opacity:.8}

    .middle{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 24px}
    .card{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}

    .product-logo{margin-bottom:16px;display:flex;align-items:center;justify-content:center}
    .product-logo img{width:240px;height:auto}
    .product-logo a{display:flex}

    .card h1{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
    .card > p{font-size:.85rem;color:var(--muted);margin-bottom:24px}

    .form-row{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    @media (max-width: 560px){.form-row{grid-template-columns:1fr;gap:12px}}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-label{font-size:.75rem;font-weight:600;color:var(--label);text-transform:uppercase;letter-spacing:.04em}
    /* 16px minimum stops iOS Safari auto-zooming the viewport on input focus. */
    .form-input{width:100%;min-height:44px;padding:12px 14px;font-size:16px;font-family:inherit;
      border:1.5px solid var(--input-border);border-radius:var(--id-radius-sm);background:var(--input-bg);
      color:var(--fg);transition:border-color var(--id-dur-fast),box-shadow var(--id-dur-fast);outline:none}
    .form-input:focus{border-color:var(--id-accent);box-shadow:var(--id-focus)}
    .form-input::placeholder{color:var(--placeholder)}

    .btn{width:100%;min-height:44px;padding:10px 14px;font-size:.85rem;font-weight:700;font-family:inherit;
      border:none;border-radius:var(--id-radius-sm);cursor:pointer;transition:opacity var(--id-dur-fast),transform var(--id-dur-fast);
      background:var(--id-accent);color:var(--id-on-accent);margin-top:4px}
    .btn:active{transform:scale(.98)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
    /* #2595 — progress spinner. A pseudo-element survives label textContent
       swaps, so the animation stays visible for the whole request. */
    .btn.is-busy::before{content:"";display:inline-block;width:13px;height:13px;
      margin-right:8px;vertical-align:-2px;border-radius:50%;
      border:2px solid currentColor;border-top-color:transparent;
      animation:gb-spin .7s linear infinite}
    @keyframes gb-spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){.btn.is-busy::before{display:none}}

    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
      overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    .error-box{width:100%;display:none;background:var(--id-danger-soft);
      border:1px solid var(--id-danger-line);border-radius:var(--id-radius-sm);
      padding:8px 12px;font-size:.78rem;color:var(--id-danger-text);margin-bottom:10px}

    .alt{width:100%;text-align:center;font-size:.78rem;color:var(--muted);margin-top:14px}
    .alt a{color:var(--fg);font-weight:600;text-decoration:none}
    .alt a:hover{text-decoration:underline}

    .bottom-links{display:flex;align-items:center;justify-content:space-between;padding:6px 24px}
    .bottom-links a{font-size:.65rem;color:var(--bar-link);text-decoration:none;letter-spacing:.02em}
    .bottom-links a:hover{color:var(--fg)}
    .bottom-links nav{display:flex;gap:12px}
    .bottombar{height:4px;flex-shrink:0}

    .theme-btn{position:fixed;top:8px;right:12px;z-index:100;width:30px;height:30px;
      border-radius:var(--id-radius-pill);border:none;cursor:pointer;font-size:.9rem;display:flex;
      align-items:center;justify-content:center;background:var(--toggle-bg);
      color:var(--toggle-fg);transition:background var(--id-dur-normal),transform var(--id-dur-normal)}
    .theme-btn:hover{transform:scale(1.1)}
    .theme-btn:active{transform:scale(.95)}
    .theme-btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
  </style>
  <link rel="stylesheet" href="/suite/css/palette-tokens.css" />
<link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/suite/assets/icons/apple-touch-icon.png">
  <script>
  /* #2594 — resolve the theme synchronously in <head>, before the body paints.
   * A persisted login choice wins; otherwise the OS preference decides. The
   * value is mirrored to `gb-theme` (the key the suite reads) so it carries
   * into the app, and a suite-written `gb-theme` is honoured here when no
   * explicit login choice exists yet. */
  (function () {
    var KEY = 'gb-login-theme', SUITE_KEY = 'gb-theme', root = document.documentElement;
    function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function suiteStored() {
      try { var v = localStorage.getItem(SUITE_KEY); return (v === 'light' || v === 'dark') ? v : null; }
      catch (e) { return null; }
    }
    function osDark() { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
    function resolve() {
      var v = stored() || suiteStored();
      return (v === 'dark' || v === 'light') ? v : (osDark() ? 'dark' : 'light');
    }
    function apply(theme, persist) {
      if (theme === 'dark') root.setAttribute('data-theme', 'dark');
      else root.removeAttribute('data-theme');
      if (persist) {
        try { localStorage.setItem(KEY, theme); localStorage.setItem(SUITE_KEY, theme); }
        catch (e) { /* storage unavailable */ }
      }
      var b = document.getElementById('theme-btn');
      if (b) {
        b.textContent = theme === 'dark' ? '🌙' : '☀️';
        b.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
      }
    }
    apply(resolve(), false);
    window.toggleTheme = function () {
      apply(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
    };
    document.addEventListener('DOMContentLoaded', function () { apply(resolve(), false); });
  })();
  </script>
</head>
<body>

<div class="gb-preview-banner" data-i18n-html="login-preview-banner">⚡ <strong>General Bots 6</strong> is currently in <strong>Preview</strong> — features are evolving rapidly. <a href="https://generalbots.org/terms/" target="_blank" rel="noopener noreferrer">Review terms</a> before production use.</div>

<div class="bar"></div>
<button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme" data-i18n-title="login-theme-toggle" aria-label="Toggle theme" data-i18n-aria-label="login-theme-toggle" aria-pressed="false">☀️</button>

<main class="middle">
  <div class="card">
    <div class="product-logo"><a href="https://generalbots.org" target="_blank" rel="noopener noreferrer"><img src="/images/logo.svg" alt="General Bots"></a></div>
    <h1 data-i18n="login-welcome-title">Welcome back</h1>
    <p data-i18n="login-welcome-subtitle">Sign in to your management account</p>

    <div id="login-error" class="error-box" role="status" aria-live="polite"></div>
    <div id="login-live" class="sr-only" role="status" aria-live="polite"></div>

    <form id="login-form" onsubmit="onLoginSubmit(event)" style="width:100%">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="login-email" data-i18n="login-label-email">Email</label>
          <input id="login-email" class="form-input" type="email" placeholder="you@company.com" data-i18n-placeholder="login-placeholder-email" required autocomplete="email" inputmode="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password" data-i18n="login-label-password">Password</label>
          <input id="login-password" class="form-input" type="password" placeholder="Password" data-i18n-placeholder="login-placeholder-password" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn" id="login-btn" data-i18n="login-submit">Sign In</button>
    </form>

    <div class="alt"><span data-i18n="login-no-account">Don't have an account?</span> <a href="/signup" data-i18n="login-create-account-link">Create a free account</a></div>
  </div>
</main>

<div class="bottom-links">
  <a href="https://generalbots.org">generalbots.org</a>
  <nav>
    <span data-i18n-switcher></span>
    <a href="https://docs.generalbots.org" data-i18n="login-link-docs">Docs</a>
    <a href="https://github.com/generalbots/generalbots" data-i18n="login-link-github">GitHub</a>
  </nav>
</div>
<div class="bottombar"></div>

<script>
window.CLOUD_CONFIG = {
  baseUrl: window.GB_CLOUD_URL || window.location.origin.replace(/:(\d+)$/, function(_, p) { return p === '5000' ? ':4000' : ':' + p }),
  contactUrl: 'https://pragmatismo.com.br/contact',
  docsUrl: 'https://docs.generalbots.org',
  salesEmail: 'sales@pragmatismo.com.br',
};
</script>
<script src="/js/i18n-lite.js"></script>
<script src="/js/i18n-switcher.js"></script>
<script src="/js/sso-handoff.js"></script>
<script src="/js/cloud-auth.js"></script>
<script>
(async function(){if(location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')return;
if(sessionStorage.getItem('gb-signed-out')==='true')return;
var e=localStorage.getItem('management_email'),t=localStorage.getItem('management_token');
if(t){try{var r=await fetch('/api/cloud/auth/login',{method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({email:e||'admin@localhost',password:'dev'})});
if(r.ok){var h=GB_SSO_HANDOFF.create({_host:location.hostname,_secure:location.protocol==='https:'});
var d=new URL('/dashboard',(window.GB_CLOUD_URL||'http://localhost:4000'));
window.location.href=GB_SSO_HANDOFF.destination(d,{token:t,email:e||'admin@localhost',name:''},h,location.origin)}}catch(_){}}else if(e){document.getElementById('login-email').value=e}})();
function onLoginSubmit(e){sessionStorage.removeItem('gb-signed-out');handleLogin(e)}
</script>
</body>
</html>
