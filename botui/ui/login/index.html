<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — General Bots</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Oxygen,sans-serif;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

    :root{--bg:#ffffff;--fg:#0a0a0e;--muted:#64646e;--card-bg:#ffffff;--card-border:#e4e4ea;
      --input-bg:#fafafa;--input-border:#d4d4da;--bar-bg:#040404;--bar-fg:rgba(245,245,249,.5);
      --bar-link:rgba(245,245,249,.55);--toggle-bg:rgba(0,0,0,.6);--placeholder:#8e8e96;
      --label:#3a3a42}
    [data-theme="dark"]{--bg:#0d0d12;--fg:#e8e8ee;--muted:#8a8a96;--card-bg:#16161e;
      --card-border:#2a2a34;--input-bg:#1a1a24;--input-border:#2a2a34;--bar-bg:#f0f0f4;
      --bar-fg:rgba(10,10,14,.5);--bar-link:rgba(10,10,14,.55);--toggle-bg:rgba(255,255,255,.15);
      --placeholder:#6a6a76;--label:#b0b0ba}

    body{display:flex;flex-direction:column;min-height:100vh;background:var(--bg);color:var(--fg);transition:background .3s,color .3s}
    .bar{background:var(--bar-bg);height:4px;flex-shrink:0;transition:background .3s}
    .gb-preview-banner{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1c1917;text-align:center;padding:3px 12px;font-size:0.7rem;font-weight:500;line-height:1.3}
    [data-theme="dark"] .gb-preview-banner{background:linear-gradient(135deg,#fbbf24,#f59e0b)!important}
    .gb-preview-banner a{color:#1c1917;font-weight:600}
    .gb-preview-banner a:hover{opacity:.8}

    .middle{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 24px}
    .card{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}

    .product-logo{margin-bottom:16px;display:flex;align-items:center;justify-content:center}
    .product-logo img{width:240px;height:auto}
    .product-logo a{display:flex}

    .card h1{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
    .card > p{font-size:.85rem;color:var(--muted);margin-bottom:24px}

    .form-row{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-label{font-size:.75rem;font-weight:600;color:var(--label);text-transform:uppercase;letter-spacing:.04em}
    .form-input{width:100%;padding:12px 14px;font-size:.9rem;font-family:inherit;
      border:1.5px solid var(--input-border);border-radius:7px;background:var(--input-bg);
      color:var(--fg);transition:border-color .15s,box-shadow .15s;outline:none}
    .form-input:focus{border-color:#0077b6;box-shadow:0 0 0 3px rgba(0,119,182,.15)}
    .form-input::placeholder{color:var(--placeholder)}

    .btn{width:100%;padding:10px 14px;font-size:.85rem;font-weight:700;font-family:inherit;
      border:none;border-radius:7px;cursor:pointer;transition:opacity .15s,transform .1s;
      background:#0a0a0e;color:#fff;margin-top:4px}
    [data-theme="dark"] .btn{background:#0a0a0e;color:#fff}
    .btn:active{transform:scale(.98)}
    .btn:disabled{opacity:.5;cursor:not-allowed}

    .error-box{width:100%;display:none;background:rgba(217,48,62,.08);
      border:1px solid rgba(217,48,62,.25);border-radius:7px;
      padding:8px 12px;font-size:.78rem;color:#b91c1c;margin-bottom:10px}

    .alt{width:100%;text-align:center;font-size:.78rem;color:var(--muted);margin-top:14px}
    .alt a{color:var(--fg);font-weight:600;text-decoration:none}
    .alt a:hover{text-decoration:underline}

    .bottom-links{display:flex;align-items:center;justify-content:space-between;padding:6px 24px}
    .bottom-links a{font-size:.65rem;color:var(--bar-link);text-decoration:none;letter-spacing:.02em}
    .bottom-links a:hover{color:var(--fg)}
    .bottom-links nav{display:flex;gap:12px}
    .bottombar{height:4px;flex-shrink:0}

    .theme-btn{position:fixed;top:8px;right:12px;z-index:100;width:30px;height:30px;
      border-radius:99px;border:none;cursor:pointer;font-size:.9rem;display:flex;
      align-items:center;justify-content:center;background:var(--toggle-bg);
      color:#fff;transition:background .2s,transform .2s}
    .theme-btn:hover{transform:scale(1.1)}
    .theme-btn:active{transform:scale(.95)}
  </style>
</head>
<body>

<div class="gb-preview-banner">⚡ <strong>General Bots 6</strong> is currently in <strong>Preview</strong> — features are evolving rapidly. <a href="/terms">Review terms</a> before production use.</div>

<div class="bar"></div>
<button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">☀️</button>

<main class="middle">
  <div class="card">
    <div class="product-logo"><a href="https://generalbots.org" target="_blank"><img src="/images/logo.svg" alt="General Bots"></a></div>
    <h1>Welcome back</h1>
    <p>Sign in to your management account</p>

    <div id="login-error" class="error-box"></div>

    <form id="login-form" onsubmit="onLoginSubmit(event)" style="width:100%">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input id="login-email" class="form-input" type="email" placeholder="you@company.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input id="login-password" class="form-input" type="password" placeholder="Password" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn" id="login-btn">Sign In</button>
    </form>

    <div class="alt">Don't have an account? <a href="/signup">Create a free account</a></div>
  </div>
</main>

<div class="bottom-links">
  <a href="https://generalbots.org">generalbots.org</a>
  <nav>
    <a href="https://docs.pragmatismo.com.br">Docs</a>
    <a href="https://github.com/GeneralBots/BotServer">GitHub</a>
  </nav>
</div>
<div class="bottombar"></div>

<script>
window.CLOUD_CONFIG = {
  baseUrl: window.location.origin.replace(/:(\d+)$/, function(_, p) { return p === '5000' ? ':4000' : ':' + p }),
  contactUrl: 'https://pragmatismo.com.br/contact',
  docsUrl: 'https://docs.generalbots.org',
  salesEmail: 'sales@pragmatismo.com.br',
};
</script>
<script src="/js/cloud-auth.js"></script>
<script>
(function(){var k='gb-login-theme',r=document.documentElement,b=document.getElementById('theme-btn');
function apply(t){if(t==='dark'){r.setAttribute('data-theme','dark');b.textContent='🌙'}else{r.removeAttribute('data-theme');b.textContent='☀️'}
localStorage.setItem(k,t)}
var s=localStorage.getItem(k);if(s)apply(s);
window.toggleTheme=function(){var n=r.getAttribute('data-theme')==='dark'?'light':'dark';apply(n)};})();

(async function(){if(location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')return;
if(sessionStorage.getItem('gb-signed-out')==='true')return;
var e=localStorage.getItem('management_email'),t=localStorage.getItem('management_token');
if(t){try{var r=await fetch('/api/cloud/auth/login',{method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({email:e||'admin@localhost',password:'dev'})});
if(r.ok)window.location.href='/cloud/dashboard'}catch(_){}}else if(e){document.getElementById('login-email').value=e}})();
function onLoginSubmit(e){sessionStorage.removeItem('gb-signed-out');handleLogin(e)}
</script>
</body>
</html>
