<!DOCTYPE html>
<html lang="en" data-i18n-document-title="cloud-domains-document-title">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domains — General Bots Cloud</title>
  <script src="/cloud/js/cloud-shell.js"></script>
  <script src="/cloud/js/i18n-lite.js"></script>
  <script src="/cloud/js/i18n-switcher.js"></script>
  <style>
    .domains-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-top: 1.5rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: .8rem; font-weight: 600; color: var(--text-muted); margin-bottom: .4rem; }
    .form-group input, .form-group select {
      width: 100%; padding: .55rem .75rem; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg3); color: var(--text); font-size: .85rem;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
    .domains-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    .domains-table th, .domains-table td { padding: .75rem; border-bottom: 1px solid var(--border); text-align: left; font-size: .85rem; }
    .domains-table th { font-weight: 700; color: var(--muted); }
    .domain-badge { font-family: monospace; background: var(--accent-dim); color: var(--accent2); padding: .2rem .5rem; border-radius: 4px; font-weight: 600; font-size: .8rem; }
    .btn-sm { padding: .35rem .65rem; font-size: .75rem; border-radius: 4px; border: none; cursor: pointer; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-edit { background: var(--accent); color: #fff; margin-right: .4rem; }
    .btn-edit:hover { opacity: .8; }
    .actions-cell { display: flex; gap: .4rem; }
  </style>
</head>
<body class="mgmt-layout">

  <main class="mgmt-main">
    <div class="mgmt-topbar">
      <span class="mgmt-page-title" data-i18n="cloud-domains-title">Domain Manager</span>
      <div class="mgmt-topbar-actions"></div>
    </div>

    <div style="padding:2rem">
      <div class="domains-grid">

        <!-- Create Domain Mapping -->
        <div class="card">
          <h2 style="font-size:1.1rem;margin-bottom:1rem" data-i18n="cloud-domains-create-title">Map Domain to Bot</h2>
          <form id="create-domain-form" onsubmit="handleCreateDomain(event)" style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:1rem;align-items:end">
            <div class="form-group">
              <label for="domain" data-i18n="cloud-domains-domain">Domain</label>
              <input type="text" id="domain" name="domain" placeholder="chat.example.com" required>
            </div>
            <div class="form-group">
              <label for="bot_id" data-i18n="cloud-domains-bot">Bot</label>
              <select id="bot_id" name="bot_id" required>
                <option value="" data-i18n="cloud-bindings-loading-bots">Loading bots...</option>
              </select>
            </div>
            <div class="form-group" style="display:none">
              <label for="org_id" data-i18n="cloud-domains-org-id">Org ID (optional)</label>
              <input type="text" id="org_id" name="org_id" placeholder="UUID of organization" data-i18n-placeholder="cloud-domains-org-id-placeholder">
            </div>
            <div class="form-group" style="display:none">
              <label for="branch_id" data-i18n="cloud-domains-branch-id">Branch ID (optional)</label>
              <input type="text" id="branch_id" name="branch_id" placeholder="UUID of branch" data-i18n-placeholder="cloud-domains-branch-id-placeholder">
            </div>
            <div class="form-group">
              <button type="submit" class="btn btn-primary" style="width:100%" data-i18n="cloud-domains-create">Create Mapping</button>
            </div>
          </form>
          <div id="create-message" style="margin-top:1rem;font-size:.85rem"></div>
        </div>

        <!-- Domain List -->
        <div class="card">
          <h2 style="font-size:1.1rem;margin-bottom:1rem" data-i18n="cloud-domains-list-title">Domain Mappings</h2>
          <div style="overflow-x:auto">
            <table class="domains-table">
              <thead>
                <tr>
                  <th data-i18n="cloud-domains-domain">Domain</th>
                  <th data-i18n="cloud-domains-col-bot-id">Bot ID</th>
                  <th data-i18n="cloud-domains-col-org-id">Org ID</th>
                  <th data-i18n="cloud-domains-col-branch-id">Branch ID</th>
                  <th data-i18n="cloud-domains-col-created">Created</th>
                  <th data-i18n="cloud-domains-col-actions">Actions</th>
                </tr>
              </thead>
              <tbody id="domains-table-body">
                <tr>
                  <td colspan="6" style="text-align:center;color:var(--muted)" data-i18n="cloud-domains-loading">Loading domains...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </main>

<script src="/cloud/js/gb-shared.js"></script>
<script src="/cloud/js/cloud.js"></script>
<script>
(async function() {
  const token = await requireAuth();

  // Load the user's bots for the mapping dropdown (pick by name, not UUID)
  async function loadBots() {
    const select = document.getElementById('bot_id');
    try {
      const res = await fetch('/api/cloud/bots', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('failed');
      const data = await res.json();
      const bots = data.bots || [];
      if (!bots.length) {
        select.innerHTML = '<option value="">' + gbT('cloud-no-bots-available', 'No bots available') + '</option>';
        return;
      }
      select.innerHTML = bots.map(b =>
        `<option value="${b.id}">${escapeHtml(b.name)}</option>`
      ).join('');
    } catch (e) {
      select.innerHTML = '<option value="">' + gbT('cloud-error-load-bots', 'Failed to load bots') + '</option>';
    }
  }

  async function loadDomains() {
    try {
      const res = await fetch('/api/cloud/domains', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        const data = await res.json();
        const tbody = document.getElementById('domains-table-body');
        if (!data.domains || data.domains.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted)">' + gbT('cloud-domains-empty', 'No domain mappings configured.') + '</td></tr>';
          return;
        }
        tbody.innerHTML = data.domains.map(d => {
          const created = new Date(d.created_at).toLocaleString();
          const botIdShort = d.bot_id ? d.bot_id.substring(0, 8) + '...' : '-';
          const orgIdShort = d.org_id ? d.org_id.substring(0, 8) + '...' : '-';
          const branchIdShort = d.branch_id ? d.branch_id.substring(0, 8) + '...' : '-';
          return `<tr>
            <td><span class="domain-badge">${escapeHtml(d.domain)}</span></td>
            <td style="font-size:.75rem;font-family:monospace" title="${d.bot_id}">${botIdShort}</td>
            <td style="font-size:.75rem;color:var(--muted)" title="${d.org_id || ''}">${orgIdShort}</td>
            <td style="font-size:.75rem;color:var(--muted)" title="${d.branch_id || ''}">${branchIdShort}</td>
            <td style="font-size:.75rem;color:var(--muted)">${created}</td>
            <td><div class="actions-cell">
              <button class="btn-sm btn-danger" onclick="deleteDomain('${d.id}')">${gbT('cloud-delete', 'Delete')}</button>
            </div></td>
          </tr>`;
        }).join('');
      } else {
        showToast(gbT('cloud-domains-load-error', 'Failed to load domain mappings.'), 'error');
      }
    } catch (e) {
      console.error(e);
      showToast(gbT('cloud-domains-connection-error', 'Connection error loading domains.'), 'error');
    }
  }

  window.handleCreateDomain = async function(e) {
    e.preventDefault();
    const domain = document.getElementById('domain').value.trim().toLowerCase();
    const bot_id = document.getElementById('bot_id').value.trim();
    const org_id = document.getElementById('org_id').value.trim() || null;
    const branch_id = document.getElementById('branch_id').value.trim() || null;

    if (!bot_id) {
      const msg = document.getElementById('create-message');
      msg.style.color = '#ef4444';
      msg.textContent = gbT('cloud-domains-select-bot', 'Select a bot to map the domain to.');
      return;
    }

    const msg = document.getElementById('create-message');
    msg.style.color = 'var(--muted)';
    msg.textContent = gbT('cloud-domains-creating', 'Creating domain mapping...');

    try {
      const res = await fetch('/api/cloud/domains', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({
          domain: domain,
          bot_id: bot_id,
          org_id: org_id,
          branch_id: branch_id,
        })
      });
      const data = await res.json();
      if (res.ok) {
        msg.style.color = '#34d399';
        msg.innerHTML = gbT('cloud-domains-created', 'Domain mapping created:') + ` <span class="domain-badge">${domain}</span>`;
        showToast(gbT('cloud-domains-mapped', 'Domain mapped!'), 'success');
        document.getElementById('create-domain-form').reset();
        await loadDomains();
      } else {
        msg.style.color = '#ef4444';
        msg.textContent = gbT('cloud-error-prefix', 'Error:') + ' ' + (data.error || data.message || gbT('cloud-error-create-failed', 'Failed to create.'));
      }
    } catch (err) {
      msg.style.color = '#ef4444';
      msg.textContent = gbT('cloud-error-processing', 'Error processing creation.');
    }
  };

  window.deleteDomain = async function(id) {
    if (!confirm(gbT('cloud-domains-delete-confirm', 'Delete this domain mapping?'))) return;
    try {
      const res = await fetch(`/api/cloud/domains/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        showToast(gbT('cloud-domains-deleted', 'Domain mapping deleted.'), 'success');
        await loadDomains();
      } else {
        showToast(gbT('cloud-error-delete-failed', 'Failed to delete.'), 'error');
      }
    } catch (err) {
      showToast(gbT('cloud-error-connection', 'Connection error.'), 'error');
    }
  };

  await loadBots();
  await loadDomains();
})();
</script>
</body>
</html>
