<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Management</title>
  <link rel="stylesheet" href="css/cloud.css">
</head>
<body class="mgmt-layout">
  <div class="mgmt-shell">
    <nav class="saas-nav">
      <div class="saas-nav-brand">Management</div>
    </nav>
    <div class="mgmt-body saas-auth">
      <div class="saas-auth-card" style="max-width:520px">
        <h1>Complete Your Order</h1>
        <div id="order-summary" class="saas-order-summary"></div>
        <hr>
        <form id="checkout-form" onsubmit="return doCheckout(event)">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="org-name">Organization Name</label>
            <input type="text" id="org-name" placeholder="e.g. My Agency">
          </div>
          <button type="submit" class="btn-primary btn-block">Proceed to Payment →</button>
        </form>
        <p class="saas-auth-alt" style="margin-top:1rem">
          Already have an account? <a href="/cloud/login">Sign in</a>
        </p>
      </div>
    </div>
  </div>
  <script src="js/management-checkout.js"></script>
</body>
</html>
