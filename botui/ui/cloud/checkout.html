<!DOCTYPE html>
<html lang="en" data-i18n-document-title="cloud-checkout-document-title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — General Bots Cloud</title>
   <link rel="stylesheet" href="/cloud/css/cloud-layout.css">
  <link rel="stylesheet" href="/cloud/css/cloud-components.css">
  <link rel="stylesheet" href="/cloud/css/cloud-forms-utilities.css">
  <script src="/cloud/js/i18n-lite.js"></script>
  <script src="/cloud/js/i18n-switcher.js"></script>
</head>
<body>
<div class="mgmt-auth">
  <div class="mgmt-auth-left">
    <a href="/cloud" class="mgmt-logo-mark" style="margin-bottom:2rem;text-decoration:none">
      <div class="mgmt-logo-icon">
        <img src="/cloud/images/logo-square.svg" alt="General Bots" width="20" height="20" style="filter:brightness(0) invert(1)">
      </div>
      <div>
        <div class="mgmt-logo-text" style="color:#fff">General Bots</div>
        <span class="mgmt-logo-sub">Cloud</span>
      </div>
    </a>
    <div style="margin:2rem 0;display:flex;align-items:center;justify-content:center">
      <img src="/cloud/images/logo.svg" alt="General Bots" style="width:120px;height:auto;opacity:.6">
    </div>
    <span class="split-pitch-tag" data-i18n="cloud-checkout-tag">Simple pricing · No surprises</span>
    <h2 class="split-pitch-title" style="margin-top:1.25rem;font-size:1.6rem" data-i18n-html="cloud-checkout-pitch-title">Complete your <span>order</span></h2>
    <p class="split-pitch-body" style="margin-top:.75rem" data-i18n="cloud-checkout-pitch-body">
      Your infrastructure and AI services are provisioned automatically after payment.
    </p>
  </div>
  <div class="mgmt-auth-right">
    <div class="mgmt-auth-card" style="max-width:520px">
      <h2 data-i18n="cloud-checkout-title">Checkout</h2>
      <div id="order-summary" class="saas-order-summary"></div>
      <hr>
      <form id="checkout-form" onsubmit="return doCheckout(event)">
        <button type="submit" class="btn-primary btn-block" data-i18n="cloud-checkout-proceed">Proceed to Payment →</button>
      </form>
      <p class="auth-alt" style="margin-top:1rem">
        <span data-i18n="cloud-checkout-have-account">Already have an account?</span> <a href="/login" data-i18n="cloud-checkout-signin">Sign in</a>
      </p>
    </div>
  </div>
</div>
  <script src="/cloud/js/gb-shared.js"></script>
  <script src="/cloud/js/cloud.js"></script>
  <script src="/cloud/js/cloud-checkout.js"></script>
</body>
</html>
