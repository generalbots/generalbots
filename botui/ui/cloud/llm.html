<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Models — General Bots Cloud</title>
  <link rel="stylesheet" href="/cloud/css/cloud-layout.css">
  <link rel="stylesheet" href="/cloud/css/cloud-components.css">
  <link rel="stylesheet" href="/cloud/css/cloud-forms-utilities.css">
  <style>
    .provider-section { margin-bottom: 2.5rem; }
    .provider-header {
      display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      cursor: pointer; transition: all .2s; user-select: none;
    }
    .provider-header:hover { border-color: var(--border-hover); }
    .provider-header.open { border-radius: var(--radius) var(--radius) 0 0; border-bottom-color: transparent; }
    .provider-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; color: #fff; flex-shrink: 0; }
    .provider-info { flex: 1; }
    .provider-name { font-size: 1rem; font-weight: 700; color: var(--text); }
    .provider-desc { font-size: .78rem; color: var(--muted); margin-top: .15rem; }
    .provider-badge { font-size: .65rem; padding: .15rem .55rem; border-radius: 99px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .provider-badge.included { background: var(--accent-dim); color: var(--accent2); }
    .provider-arrow { transition: transform .2s; color: var(--muted); }
    .provider-header.open .provider-arrow { transform: rotate(180deg); }

    .models-grid { display: none; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .75rem; padding: 1rem; background: var(--bg3); border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); }
    .provider-header.open + .models-grid { display: grid; }
    .model-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 1rem; transition: all .2s;
    }
    .model-card:hover { border-color: var(--border-hover); }
    .model-name { font-size: .9rem; font-weight: 700; color: var(--text); }
    .model-meta { display: flex; flex-wrap: wrap; gap: .35rem; margin: .5rem 0; }
    .model-meta-tag { font-size: .65rem; background: var(--bg3); color: var(--muted); padding: .12rem .4rem; border-radius: 4px; border: 1px solid var(--border); }
    .model-desc { font-size: .75rem; color: var(--muted); line-height: 1.45; }
    .model-pricing { font-size: .72rem; margin-top: .5rem; padding-top: .5rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .model-pricing .free { color: var(--accent2); font-weight: 600; }
    .model-pricing .paid { color: #fbbf24; font-weight: 600; }

    .llm-page-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
    .llm-page-header h1 { font-size: 1.4rem; font-weight: 800; color: var(--text); margin: 0; }
    .llm-page-header p { color: var(--muted); font-size: .85rem; margin: 0; }
    .filter-bar { display: flex; gap: .5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .filter-btn { font-size: .78rem; padding: .35rem .85rem; border-radius: 99px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; transition: all .2s; }
    .filter-btn:hover { border-color: var(--border-hover); color: var(--text); }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    @media (prefers-color-scheme: dark) {
      .filter-btn.active { color: #000; }
    }
  </style>
</head>
<body class="mgmt-layout">
<div class="mgmt-shell">


  <main class="mgmt-main">
    <div class="mgmt-topbar">
      <span class="mgmt-page-title">LLM Models</span>
      <div class="mgmt-topbar-actions"></div>
    </div>

    <div style="padding:2rem">
      <div class="llm-page-header">
        <div style="display:none">
          <h1>Model Browser</h1>
        </div>
      </div>

      <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="chinese">Chinese Providers</button>
        <button class="filter-btn" data-filter="buy">Buy Tokens</button>
        <button class="filter-btn" data-filter="included">Included in Plan</button>
      </div>

      <div id="providers-container"></div>
    </div>
  </main>
</div>

<script src="/cloud/js/cloud.js"></script>
<script>
(async function() {
  const token = getToken();

  const PROV_ICONS = {
    glm: { bg: '#2563eb', label: 'GL' },
    qwen: { bg: '#dc2626', label: 'QW' },
    deepseek: { bg: '#0891b2', label: 'DS' },
    minimax: { bg: '#7c3aed', label: 'MX' },
    yi: { bg: '#059669', label: 'YI' },
    openai: { bg: '#000000', label: 'AI' },
    anthropic: { bg: '#d97706', label: 'CL' },
    gb: { bg: 'var(--accent)', label: 'GB' },
    google: { bg: '#4285F4', label: 'G' },
    groq: { bg: '#f97316', label: 'GQ' },
  };

  const FILTER_PROVIDERS = {
    chinese: ['zhipu', 'alibaba', 'deepseek', 'minimax', 'yi'],
    buy: ['zhipu', 'alibaba', 'deepseek', 'minimax', 'yi', 'openai', 'anthropic', 'google', 'groq'],
    included: ['generalbots'],
  };

  const FILTER_NAMES = {
    chinese: 'Chinese Providers',
    buy: 'Buy Tokens',
    included: 'Included in Plan',
  };

  let allProviders = [];
  let activeFilter = 'all';

  async function loadData() {
    try {
      const res = await fetch('/api/cloud/llm-providers');
      const ct = res.headers.get('content-type') || '';
      if (res.ok && ct.includes('json')) {
        const data = await res.json();
        if (data && data.providers) return data.providers;
      }
    } catch (_) {}
    // Fallback: static provider data when API unavailable
    return [
      { id: 'generalbots', name: 'General Bots', description: 'Built-in LLM included in all plans. No API key needed.', icon: 'gb', requires_byok: false, models: [
        { id: 'qwen-3.6-27b', name: 'Qwen 3.6-27B', context: 131072, capabilities: ['chat', 'streaming'], pricing: 'included', description: 'Open model included in all plans.' },
        { id: 'gpt-oss-20b', name: 'GPT-OSS 20B', context: 131072, capabilities: ['chat', 'streaming'], pricing: 'included', description: 'Fast open model for general conversations.' },
      ]},
      { id: 'zhipu', name: 'GLM (Zhipu AI)', description: 'Advanced Chinese-language models with strong reasoning capabilities.', icon: 'glm', requires_byok: false, models: [
        { id: 'glm-5.2', name: 'GLM-5.2', context: 262144, capabilities: ['chat', 'streaming', 'tools', 'vision'], pricing: 'token-package', package_url: '/store?calc=1#calc-llm-grid' },
        { id: 'glm-5.2-air', name: 'GLM-5.2-Air', context: 131072, capabilities: ['chat', 'streaming', 'tools'], pricing: 'token-package', package_url: '/store?calc=1#calc-llm-grid' },
      ]},
      { id: 'deepseek', name: 'DeepSeek', description: 'Cost-effective models with strong math and code performance.', icon: 'deepseek', requires_byok: false, models: [
        { id: 'deepseek-v4-flash', name: 'DeepSeek V4 Flash', context: 131072, capabilities: ['chat', 'streaming', 'tools', 'reasoning'], pricing: 'token-package', package_url: '/store?calc=1#calc-llm-grid' },
        { id: 'deepseek-r1', name: 'DeepSeek-R1', context: 65536, capabilities: ['chat', 'reasoning'], pricing: 'token-package', package_url: '/store?calc=1#calc-llm-grid' },
      ]},
      { id: 'openai', name: 'OpenAI', description: 'Frontier models: GPT-5.5, GPT-5.4 and o-5 reasoning.', icon: 'openai', requires_byok: false, models: [
        { id: 'gpt-5.5', name: 'GPT-5.5', context: 1048576, capabilities: ['chat', 'streaming', 'tools', 'vision', 'reasoning'], pricing: 'token-package', package_url: '/store?calc=1#calc-llm-grid' },
        { id: 'gpt-5.4', name: 'GPT-5.4', context: 262144, capabilities: ['chat', 'streaming', 'tools', 'vision', 'reasoning'], pricing: 'token-package', package_url: '/store?calc=1#calc-llm-grid' },
      ]},
      { id: 'anthropic', name: 'Anthropic', description: 'Safety-focused frontier models with advanced reasoning.', icon: 'anthropic', requires_byok: false, models: [
        { id: 'claude-fable-5', name: 'Claude Fable 5', context: 1000000, capabilities: ['chat', 'streaming', 'tools', 'reasoning'], pricing: 'token-package', package_url: '/store?calc=1#calc-llm-grid' },
        { id: 'claude-sonnet-4-6', name: 'Claude Sonnet 4.6', context: 200000, capabilities: ['chat', 'streaming', 'tools'], pricing: 'token-package', package_url: '/store?calc=1#calc-llm-grid' },
      ]},
      { id: 'google', name: 'Google', description: 'Gemini 3.5 models with strong multimodal capabilities.', icon: 'google', requires_byok: false, models: [
        { id: 'gemini-3.5-flash', name: 'Gemini 3.5 Flash', context: 1000000, capabilities: ['chat', 'streaming', 'vision'], pricing: 'token-package', package_url: '/store?calc=1#calc-llm-grid' },
        { id: 'gemini-3.1-pro', name: 'Gemini 3.1 Pro', context: 2000000, capabilities: ['chat', 'streaming', 'vision'], pricing: 'token-package', package_url: '/store?calc=1#calc-llm-grid' },
      ]},
      { id: 'groq', name: 'Groq', description: 'Fast inference models with industry-leading speed.', icon: 'groq', requires_byok: false, models: [
        { id: 'gpt-oss-120b', name: 'GPT-OSS 120B', context: 131072, capabilities: ['chat', 'streaming', 'tools'], pricing: 'token-package', package_url: '/store?calc=1#calc-llm-grid' },
        { id: 'qwen-3.6-27b', name: 'Qwen 3.6-27B', context: 131072, capabilities: ['chat', 'streaming'], pricing: 'token-package', package_url: '/store?calc=1#calc-llm-grid' },
      ]},
      { id: 'minimax', name: 'MiniMax', description: 'Efficient multilingual models with up to 1M token context.', icon: 'minimax', requires_byok: false, models: [
        { id: 'minimax-text-01', name: 'MiniMax-Text-01', context: 1048576, capabilities: ['chat', 'streaming', 'tools'], pricing: 'token-package', package_url: '/store?calc=1#calc-llm-grid' },
      ]},
    ];
  }

  function renderProvider(prov) {
    const icon = PROV_ICONS[prov.icon] || { bg: '#6b7280', label: '?' };
    const badge = prov.requires_byok
      ? '<span class="provider-badge byok">Requires BYOK</span>'
      : prov.models && prov.models.some(m => m.pricing === 'token-package')
        ? '<a href="/store?calc=1#calc-llm-grid" class="provider-badge" style="background:rgba(255,0,128,.1);color:var(--accent);text-decoration:none">Token packages ↗</a>'
        : '<span class="provider-badge included">Included</span>';

    const modelsHtml = (prov.models || []).map(m => {
      const caps = (m.capabilities || []).map(c => `<span class="model-meta-tag">${c}</span>`).join('');
      const ctx = m.context ? (m.context / 1000).toFixed(0) + 'K' : '\u2014';
      const pricing = m.pricing === 'included' ? '<span class="free">Included</span>'
        : m.pricing === 'token-package'
          ? '<a href="' + (m.package_url || '/store?calc=1#calc-llm-grid') + '" style="color:var(--accent2);font-weight:600;text-decoration:none">Buy tokens ↗</a>'
          : '<span class="paid">Pay-per-token</span>';
      return '<div class="model-card">' +
        '<div class="model-name">' + m.name + '</div>' +
        '<div class="model-meta"><span class="model-meta-tag">' + ctx + ' ctx</span>' + caps + '</div>' +
        '<div class="model-desc">' + (m.description || '') + '</div>' +
        '<div class="model-pricing"><span>' + pricing + '</span><span style="color:var(--muted);font-size:.7rem">' + m.id + '</span></div>' +
        '</div>';
    }).join('');

    return '<div class="provider-section" data-provider-id="' + prov.id + '">' +
      '<div class="provider-header" onclick="this.classList.toggle(\'open\')">' +
      '<div class="provider-icon" style="background:' + icon.bg + '">' + icon.label + '</div>' +
      '<div class="provider-info">' +
      '<div class="provider-name">' + prov.name + '</div>' +
      '<div class="provider-desc">' + (prov.description || '') + '</div>' +
      '</div>' +
      badge +
      '<div class="provider-arrow"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>' +
      '</div>' +
      '<div class="models-grid">' + modelsHtml + '</div>' +
      '</div>';
  }

  function applyFilter(filter) {
    activeFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));

    const container = document.getElementById('providers-container');
    if (filter === 'all') {
      container.innerHTML = allProviders.map(renderProvider).join('');
      return;
    }

    const ids = FILTER_PROVIDERS[filter] || [];
    const filtered = allProviders.filter(p => ids.includes(p.id));
    // Add section headers
    let html = '';
    if (filtered.length) {
      html = filtered.map(renderProvider).join('');
    } else {
      html = '<p style="color:var(--muted)">No providers in this category.</p>';
    }
    container.innerHTML = html;
  }

  document.getElementById('filter-bar').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (btn) applyFilter(btn.dataset.filter);
  });

  allProviders = await loadData();
  applyFilter('all');
})();
</script>
</body>
</html>
