<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Canceled — General Bots Cloud</title>
   <link rel="stylesheet" href="/cloud/css/cloud-layout.css">
  <link rel="stylesheet" href="/cloud/css/cloud-components.css">
  <link rel="stylesheet" href="/cloud/css/cloud-forms-utilities.css">
</head>
<body>
<div class="mgmt-auth">
  <div class="mgmt-auth-left">
    <a href="/cloud" class="mgmt-logo-mark" style="margin-bottom:2rem;text-decoration:none">
      <div class="mgmt-logo-icon">
        <img src="/cloud/images/logo-square.svg" alt="General Bots" width="20" height="20" style="filter:brightness(0) invert(1)">
      </div>
      <div>
        <div class="mgmt-logo-text" style="color:#fff">General Bots</div>
        <span class="mgmt-logo-sub">Cloud</span>
      </div>
    </a>
    <div class="prism-scene" aria-hidden="true">
      <div class="prism-beam-in"></div>
      <div class="prism-triangle"></div>
      <div class="prism-spectrum"></div>
    </div>
    <span class="split-pitch-tag">Payment not completed</span>
    <h2 class="split-pitch-title" style="margin-top:1.25rem;font-size:1.6rem">Your order was <span>canceled</span></h2>
    <p class="split-pitch-body" style="margin-top:.75rem">
      No charges were made. You can try again whenever you're ready.
    </p>
  </div>
  <div class="mgmt-auth-right">
    <div class="mgmt-auth-card">
      <h1>Checkout Canceled</h1>
      <p>Your payment was not completed. You can try again anytime.</p>
      <a href="/cloud/dashboard" class="btn-primary">Back to Dashboard</a>
    </div>
  </div>
</div>
</body>
</html>
