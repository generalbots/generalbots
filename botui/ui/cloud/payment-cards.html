<!DOCTYPE html>
<html lang="en" data-i18n-document-title="cloud-cards-document-title">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment &amp; Cards — General Bots Cloud</title>
  <script src="/cloud/js/cloud-shell.js"></script>
  <script src="/cloud/js/i18n-lite.js"></script>
  <script src="/cloud/js/i18n-switcher.js"></script>
  <style>
    .cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1rem; }
    .card-item { background:var(--surface,#fff); border:1px solid var(--border,#e5e7eb); border-radius:12px; padding:1.25rem; display:flex; flex-direction:column; gap:.75rem; }
    .card-brand { font-size:1.6rem; }
    .card-number { font-family:var(--mono,monospace); font-size:1.05rem; font-weight:600; }
    .card-exp { color:var(--muted,#6b7280); font-size:.9rem; }
    .card-default { display:inline-block; background:#eef2ff; color:#4f46e5; border-radius:999px; padding:.15rem .6rem; font-size:.75rem; font-weight:600; }
    .card-actions { display:flex; gap:.5rem; margin-top:auto; }
    .card-actions .btn { flex:1; }
    .card-actions .btn-danger { background:transparent; border:1px solid #fca5a5; color:#dc2626; }
    .card-actions .btn-danger:hover { background:#fef2f2; }
    .add-card-bar { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.25rem; flex-wrap:wrap; }
    .hint { color:var(--muted,#6b7280); font-size:.85rem; max-width:34rem; }
    .toast { position:fixed; bottom:1.5rem; right:1.5rem; background:#111827; color:#fff; padding:.75rem 1.25rem; border-radius:8px; font-size:.9rem; opacity:0; transition:opacity .25s; pointer-events:none; z-index:50; }
    .toast.show { opacity:1; }
    .toast.error { background:#b91c1c; }
  </style>
</head>
<body class="mgmt-layout">

  <main class="mgmt-main">
    <div class="mgmt-topbar">
      <span class="mgmt-page-title" data-i18n="cloud-cards-title">Payment &amp; Cards</span>
      <div class="mgmt-topbar-actions"></div>
    </div>

    <div style="padding:2rem" id="payment-page">
      <div class="add-card-bar">
        <div>
          <h2 style="margin:0 0 .35rem;font-size:1.1rem" data-i18n="cloud-cards-saved">Saved cards</h2>
          <p class="hint" data-i18n="cloud-cards-hint">Cards are stored securely by our payment provider. Card numbers never reach our servers.</p>
        </div>
        <button id="add-card-btn" class="btn btn-primary" onclick="addCard()">+ <span data-i18n="cloud-cards-add">Add card</span></button>
      </div>
      <div class="cards-grid" id="cards-grid">
        <div class="mgmt-empty" style="grid-column:1/-1"><div class="loading-dots"><span></span><span></span><span></span></div></div>
      </div>
    </div>
  </main>

<div class="toast" id="toast"></div>

<script src="/cloud/js/gb-shared.js"></script>
<script src="/cloud/js/cloud.js"></script>
<script>
(function() {
  const token = requireAuth();
  if (!token) return;
  const grid = document.getElementById('cards-grid');

  async function loadCards() {
    try {
      const res = await fetch('/api/cloud/payment-cards', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) throw new Error('Failed to load cards');
      const data = await res.json();
      renderCards(data.cards || []);
    } catch (e) {
      grid.innerHTML = '<div class="mgmt-empty" style="grid-column:1/-1"><p>' + gbT('cloud-cards-load-error', 'Could not load cards.') + '</p></div>';
    }
  }

  function renderCards(cards) {
    if (!cards.length) {
      grid.innerHTML = `
        <div class="mgmt-empty" style="grid-column:1/-1;text-align:center;padding:3rem 1rem">
          <div style="font-size:3rem;margin-bottom:1rem">💳</div>
          <h2 style="margin:0 0 .5rem;font-size:1.1rem">${gbT('cloud-cards-none', 'No cards saved yet')}</h2>
          <p class="hint" style="margin:0 auto 1.25rem">${gbT('cloud-cards-empty-hint', 'Add a card to pay for services and top-ups without re-entering your details.')}</p>
          <button class="btn btn-primary" onclick="addCard()">${gbT('cloud-cards-add-first', 'Add your first card')}</button>
        </div>`;
      return;
    }
    grid.innerHTML = cards.map(card => `
      <div class="card-item">
        <div class="card-brand">${brandIcon(card.brand)}</div>
        <div class="card-number">${escapeHtml(card.brand || gbT('cloud-cards-card', 'Card')).replace(/^./, c => c.toUpperCase())} ···· ${escapeHtml(card.last4 || '')}</div>
        <div class="card-exp">${gbT('cloud-cards-expires', 'Expires')} ${gbT('cloud-cards-expiry', '{month}/{year}', { month: card.exp_month, year: card.exp_year })}${card.is_default ? ' · <span class="card-default">' + gbT('cloud-cards-default', 'Default') + '</span>' : ''}</div>
        <div class="card-actions">
          ${card.is_default
            ? '<button class="btn btn-sm" disabled>' + gbT('cloud-cards-default-btn', 'Default card') + '</button>'
            : `<button class="btn btn-sm" onclick="setDefault('${encodeURIComponent(card.stripe_pm_id)}')">${gbT('cloud-cards-set-default', 'Set as default')}</button>`}
          <button class="btn btn-sm btn-danger" onclick="deleteCard('${encodeURIComponent(card.stripe_pm_id)}')">${gbT('cloud-cards-remove', 'Remove')}</button>
        </div>
      </div>
    `).join('');
  }

  function brandIcon(brand) {
    const b = (brand || '').toLowerCase();
    if (b.includes('visa')) return '💳';
    if (b.includes('master')) return '💳';
    if (b.includes('amex')) return '💳';
    if (b.includes('discover')) return '💳';
    return '💳';
  }

  window.addCard = async function() {
    try {
      const res = await fetch('/api/cloud/payment-cards/setup', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
      });
      if (!res.ok) throw new Error(gbT('cloud-cards-add-error', 'Could not start card setup.'));
      const data = await res.json();
      if (data.url) window.location.href = data.url;
      else toast(gbT('cloud-cards-no-url', 'No setup URL returned'), true);
    } catch (e) {
      toast(e.message || gbT('cloud-cards-add-error', 'Could not start card setup.'), true);
    }
  };

  window.setDefault = async function(pmId) {
    try {
      const res = await fetch('/api/cloud/payment-cards/' + pmId + '/default', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
      });
      if (!res.ok) throw new Error(gbT('cloud-cards-default-error', 'Could not set the default card.'));
      toast(gbT('cloud-cards-default-updated', 'Default card updated.'));
      loadCards();
    } catch (e) {
      toast(e.message || gbT('cloud-cards-default-error', 'Could not set the default card.'), true);
    }
  };

  window.deleteCard = async function(pmId) {
    if (!confirm(gbT('cloud-cards-remove-confirm', 'Remove this card?'))) return;
    try {
      const res = await fetch('/api/cloud/payment-cards/' + pmId, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token },
      });
      if (!res.ok) throw new Error(gbT('cloud-cards-remove-error', 'Could not remove the card.'));
      toast(gbT('cloud-cards-removed', 'Card removed.'));
      loadCards();
    } catch (e) {
      toast(e.message || gbT('cloud-cards-remove-error', 'Could not remove the card.'), true);
    }
  };

  function toast(msg, isError) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => { el.className = 'toast'; }, 3000);
  }

  /* escapeHtml comes from /cloud/js/gb-shared.js (loaded before this page). */
  /* Translations come from /cloud/js/i18n-lite.js (window.gbT). */

  loadCards();
  window.addEventListener('localeChanged', loadCards);
})();
</script>
</body>
</html>
