<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Management</title>
   <link rel="stylesheet" href="/cloud/css/cloud-layout.css">
   <link rel="stylesheet" href="/cloud/css/cloud-components.css">
   <link rel="stylesheet" href="/cloud/css/cloud-forms-utilities.css">
</head>
<body class="mgmt-layout">
  <div class="mgmt-shell">
    <div class="mgmt-body saas-auth">
      <div class="saas-auth-card">
        <h1>Create Account</h1>
        <p>Start managing your General Bots Cloud organizations</p>
        <form id="signup-form" onsubmit="return doSignup(event)">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8" placeholder="At least 8 characters">
          </div>
          <button type="submit" class="btn-primary btn-block">Create Account</button>
        </form>
        <p class="saas-auth-alt">Already have an account? <a href="/cloud/login">Sign in</a></p>
      </div>
    </div>
  </div>
  <script src="/cloud/js/cloud-auth.js"></script>
</body>
</html>
