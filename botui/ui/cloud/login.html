<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — General Bots Cloud</title>
  <meta name="description" content="Sign in to General Bots Cloud to manage your AI bots, infrastructure, and services.">
  <link rel="stylesheet" href="/cloud/css/cloud-layout.css">
  <link rel="stylesheet" href="/cloud/css/cloud-components.css">
  <link rel="stylesheet" href="/cloud/css/cloud-forms-utilities.css">
</head>
<body>
<div class="theme-toggle" aria-label="Theme switcher" role="radiogroup">
  <button data-theme="system" class="active" title="System theme" aria-label="Use system theme">💻</button>
  <button data-theme="light" title="Light theme" aria-label="Use light theme">☀️</button>
  <button data-theme="dark" title="Dark theme" aria-label="Use dark theme">🌙</button>
</div>

<div class="mgmt-auth">
  <div class="mgmt-auth-left">
    <a href="/cloud" class="mgmt-logo-mark" style="margin-bottom:2rem;text-decoration:none">
      <div class="mgmt-logo-icon">
        <img src="/cloud/images/logo-square.svg" alt="General Bots" width="20" height="20" style="filter:brightness(0) invert(1)">
      </div>
      <div>
        <div class="mgmt-logo-text" style="color:#fff">General Bots</div>
        <span class="mgmt-logo-sub">Cloud</span>
      </div>
    </a>
    <div class="prism-scene" aria-hidden="true">
      <div class="prism-beam-in"></div>
      <div class="prism-triangle"></div>
      <div class="prism-spectrum"></div>
    </div>
    <span class="split-pitch-tag">Welcome back</span>
    <h2 class="split-pitch-title" style="margin-top:1.25rem;font-size:1.6rem">Continue managing your <span>AI team</span></h2>
    <p class="split-pitch-body" style="margin-top:.75rem">
      Access your bots, services, and infrastructure.
    </p>
  </div>
  <div class="mgmt-auth-right">
    <div class="mgmt-auth-card">
      <h2>Welcome back</h2>
      <p>Sign in to your management account</p>

      <div id="login-error" style="display:none;background:rgba(255,59,48,.1);border:1px solid rgba(255,59,48,.25);border-radius:10px;padding:.85rem 1.1rem;font-size:.9rem;color:var(--accent3);margin-bottom:1.25rem"></div>

      <form id="login-form" onsubmit="onCloudLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label">Email address</label>
          <input id="login-email" type="email" class="form-control" placeholder="you@company.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input id="login-password" type="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn" style="margin-top:.75rem">
          Sign In
        </button>
      </form>

      <div class="auth-alt">Don't have an account? <a href="/signup">Create one</a></div>
    </div>
  </div>
</div>

<script src="/cloud/js/cloud-theme.js"></script>
<script src="/cloud/js/cloud-auth.js"></script>
<script>
(async function devAutoLogin() {
  if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  if (sessionStorage.getItem('gb-signed-out') === 'true') return;
  const savedEmail = localStorage.getItem('management_email');
  const token = localStorage.getItem('management_token');
  if (token) {
    try {
      const res = await fetch('/api/cloud/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: savedEmail || 'admin@localhost', password: 'dev' }),
      });
      if (res.ok) window.location.href = '/dashboard';
    } catch (_) {}
  } else {
    document.getElementById('login-email').value = savedEmail || '';
  }
})();
function onCloudLoginSubmit(e) {
  sessionStorage.removeItem('gb-signed-out');
  handleLogin(e);
}
</script>
</body>
</html>
