<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wizard self-test</title>
  <link rel="stylesheet" href="/wizard/wizard.css" />
</head>
<body>
  <!--
    Headless acceptance harness for issues #1586-#1591. It runs the real
    wizard controller against the in-browser bridge (no Tauri, no botserver,
    no network) and asserts the contracts that can be checked without a GUI.
  -->
  <main class="wizard" id="wizardRoot" data-state="loading">
    <aside class="rail" aria-label="Setup steps">
      <div class="rail-brand">
        <svg class="rail-logo" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#84d669"/><text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1a06">GB</text></svg>
        <span>General Bots</span>
      </div>
      <ol class="rail-steps" id="railSteps" role="list"></ol>
      <p class="rail-note" id="railNote">Nothing is installed until you choose Start setup.</p>
    </aside>

    <section class="pane" aria-live="polite">
      <header class="pane-head">
        <p class="step-counter" id="stepCounter">STEP 1 OF 6</p>
        <h1 class="step-heading" id="stepHeading" tabindex="-1">Welcome</h1>
        <p class="note err" id="stepError" role="status" hidden></p>
      </header>
      <div class="pane-body" id="stepBody"><p class="loading">Loading setup…</p></div>
      <footer class="pane-foot">
        <button type="button" class="btn btn-text" id="skipBtn">Skip setup</button>
        <div class="foot-progress" aria-hidden="true"><div class="foot-progress-fill" id="progressFill"></div></div>
        <span class="foot-label" id="footLabel">Step 1 of 6</span>
        <button type="button" class="btn btn-secondary" id="backBtn">Back</button>
        <button type="button" class="btn btn-primary" id="nextBtn">Next</button>
      </footer>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Confirm</h2>
      <p id="modalText"></p>
      <label class="modal-field" id="modalField" hidden>
        <span id="modalFieldLabel">Type the folder name to confirm</span>
        <input type="text" id="modalInput" autocomplete="off" />
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="modalCancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="modalConfirm">Confirm</button>
      </div>
    </div>
  </div>

  <div class="status-live" id="statusLive" role="status" aria-live="polite"></div>

  <pre id="results" style="position:fixed;left:0;right:0;bottom:0;max-height:45vh;overflow:auto;margin:0;padding:12px;background:#08090c;border-top:1px solid #2c313c;font-size:12px;z-index:99">running…</pre>

  <script>try { localStorage.removeItem("gb_wizard_draft_v1"); } catch (e) {}</script>
  <script src="/wizard/wizard-state.js"></script>
  <script src="/wizard/wizard-bridge.js"></script>
  <script src="/wizard/wizard-steps.js"></script>
  <script src="/wizard/wizard.js"></script>
  <script src="/wizard/selftest.js"></script>
</body>
</html>
