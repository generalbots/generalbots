<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="dark"/>
<title>General Bots</title>
<style>
@font-face{font-family:'Fira Sans';font-weight:500;font-style:normal;font-display:swap;
  src:url("suite/identity/fonts/fira-sans-latin-500-normal.woff2") format("woff2")}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0e;
  font-family:'Fira Sans','Segoe UI',system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;
  border-radius:20px;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;z-index:0;
  background:url("splash/splash-bg.jpg") center/cover no-repeat}
/* Gradient overlays only where text sits — top-left corner and bottom strip */
.grad-top{position:absolute;top:0;left:0;right:50%;height:120px;z-index:1;pointer-events:none;
  background:linear-gradient(160deg,rgb(0 0 0/.52) 0%,rgb(0 0 0/.28) 50%,transparent 100%)}
.grad-bottom{position:absolute;bottom:0;left:0;right:0;height:140px;z-index:1;pointer-events:none;
  background:linear-gradient(to top,rgb(0 0 0/.62) 0%,rgb(0 0 0/.36) 55%,transparent 100%)}
/* Legal footnotes — top-left */
.legal{position:absolute;top:16px;left:20px;z-index:10;
  font-size:9.5px;line-height:1.55;color:rgb(255 255 255/.45);letter-spacing:.01em}
/* Bottom overlay: split left/right */
.bottom{position:absolute;bottom:0;left:0;right:0;z-index:10;
  padding:0 24px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.bottom-left{display:flex;flex-direction:column;gap:2px;max-width:60%}
.wordmark{font-family:'Fira Sans',sans-serif;font-weight:500;font-size:20px;
  color:rgb(255 255 255/.72);letter-spacing:-.02em;line-height:1.3}
.version{font-size:11px;color:rgb(255 255 255/.38);min-height:1em}
.slogan{font-size:11px;font-style:italic;color:rgb(255 255 255/.42);line-height:1.4}
.bottom-right{font-size:10px;color:rgb(255 255 255/.35);text-align:right;white-space:nowrap;
  padding-bottom:26px}
/* Progress bar strip */
.progress-strip{position:absolute;bottom:0;left:0;right:0;z-index:20;
  padding:0 24px 10px;display:flex;align-items:center;gap:8px}
.spinner{width:14px;height:14px;border:2px solid rgb(255 255 255/.15);
  border-top-color:rgb(255 255 255/.55);border-radius:50%;flex-shrink:0;
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{font-size:11px;color:rgb(255 255 255/.42);flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.bar-wrap{position:absolute;bottom:0;left:0;right:0;height:3px;
  background:rgb(255 255 255/.08);z-index:21}
.bar{height:100%;width:0%;background:rgb(255 255 255/.38);border-radius:0 2px 2px 0;
  transition:width 600ms cubic-bezier(.22,1,.36,1)}
@media(prefers-reduced-motion:reduce){
  .spinner{animation:none;border-top-color:rgb(255 255 255/.35)}
  .bar{transition:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="grad-top" aria-hidden="true"></div>
<div class="grad-bottom" aria-hidden="true"></div>

<div class="legal" id="legalText"></div>

<div class="bottom">
  <div class="bottom-left">
    <div class="wordmark">General Bots</div>
    <div class="version" id="splashVersion"></div>
    <div class="slogan" id="sloganText"></div>
  </div>
  <div class="bottom-right">www.pragmatismo.com.br</div>
</div>

<div class="progress-strip">
  <div class="spinner" id="splashSpinner" aria-hidden="true"></div>
  <div class="status" id="splashStatus" role="status" aria-live="polite" aria-atomic="true"></div>
</div>
<div class="bar-wrap" role="progressbar" id="splashProgress"
     aria-label="Startup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="bar" id="splashBar"></div>
</div>

<script>
(function(){
"use strict";
if("serviceWorker"in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(reg){reg.unregister()})}).catch(function(){})}
document.addEventListener("contextmenu",function(e){e.preventDefault()});

var pt=navigator.language&&navigator.language.toLowerCase().startsWith("pt");

/* Legal footnotes */
var legalEl=document.getElementById("legalText");
if(legalEl){
  if(pt){
    legalEl.innerHTML="Software de código aberto · Licença MIT<br>"
      +"© General Bots · Pragmatismo<br>"
      +"Inclui componentes de terceiros sob suas próprias licenças.<br>"
      +"Fornecido no estado em que se encontra, sem garantias.";
  }else{
    legalEl.innerHTML="Open source software · MIT License<br>"
      +"© General Bots · Pragmatismo<br>"
      +"Includes third-party components under their own licenses.<br>"
      +"Provided as is, without warranties.";
  }
}

/* Slogan */
var sloganEl=document.getElementById("sloganText");
if(sloganEl) sloganEl.textContent="Errar é humano. Assinado, General Bots";

/* Status labels */
var labels=pt
  ?["Iniciando serviços...","Abrindo cofre de segurança...","Conectando banco de dados...",
    "Montando armazenamento...","Carregando assistente...","Preparando área de trabalho..."]
  :["Starting services...","Opening security vault...","Connecting database...",
    "Mounting storage...","Loading assistant...","Preparing workspace..."];
var readyLabel=pt?"Pronto.":"Ready.";

/* Progress state */
var barEl=document.getElementById("splashBar");
var progressEl=document.getElementById("splashProgress");
var statusEl=document.getElementById("splashStatus");
var spinnerEl=document.getElementById("splashSpinner");
var currentValue=0;   /* the displayed value */
var pushedValue=0;    /* highest value pushed externally */
var fakeValue=0;      /* the fake curve value */
var done=false;
var labelIdx=0;

function setBar(value,text){
  var next=Math.max(currentValue,Math.min(100,Math.round(value)));
  currentValue=next;
  if(barEl)barEl.style.width=next+"%";
  if(progressEl){progressEl.setAttribute("aria-valuenow",String(next));
    progressEl.setAttribute("aria-valuetext",next+"%")}
  if(text&&statusEl)statusEl.textContent=text;
  if(next>=100){
    done=true;
    if(spinnerEl)spinnerEl.style.display="none";
  }
}

/* Public API: take max of fake and pushed */
window.gbSplashProgress=function(value,text){
  pushedValue=Math.max(pushedValue,value);
  var effective=Math.max(fakeValue,pushedValue);
  setBar(effective,text||undefined);
};

/* Version API */
window.gbSplashVersion=function(text){
  var el=document.getElementById("splashVersion");
  if(el)el.textContent=text||"";
};

/* Fake progress curve */
var startTime=Date.now();
var isPreview=false;
try{isPreview=new URLSearchParams(location.search).get("preview")==="1"}catch(e){}

function fakeProgress(){
  if(done)return;
  var elapsed=(Date.now()-startTime)/1000;
  /* Fast to ~60% in first 6s, then slow asymptote toward 92% */
  var f;
  if(elapsed<6){
    f=elapsed/6*60; /* linear 0->60 in 6s */
  }else{
    /* Logarithmic slowdown: 60 + 32*(1 - e^(-(t-6)/20)) */
    f=60+32*(1-Math.exp(-(elapsed-6)/20));
  }
  fakeValue=Math.round(f);
  var effective=Math.max(fakeValue,pushedValue);
  /* Pick a label */
  var li=Math.min(Math.floor(elapsed/2.5),labels.length-1);
  var label=effective>=100?readyLabel:labels[li];
  setBar(effective,label);
}

/* Preview mode: loop through, then reset */
if(isPreview){
  setBar(1,labels[0]);
  var previewTimer=setInterval(function(){
    if(done){
      /* Reset after a pause */
      setTimeout(function(){
        currentValue=0;fakeValue=0;pushedValue=0;done=false;startTime=Date.now();
        if(spinnerEl)spinnerEl.style.display="";
        setBar(0,labels[0]);
      },2000);
      return;
    }
    fakeProgress();
  },400);
}else{
  setBar(1,labels[0]);
  var fakeTimer=setInterval(function(){
    if(done){clearInterval(fakeTimer);return}
    fakeProgress();
  },400);
}
})();
</script>
</body>
</html>
