<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>General Bots</title>
  <style>
    :root {
      --gb-fg: #1a1f2b;
      --gb-muted: #5b6475;
      --gb-accent: #2563eb;
      --gb-track: rgba(37, 99, 235, 0.16);
      --gb-glow: rgba(37, 99, 235, 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --gb-fg: #e8edf7;
        --gb-muted: #9aa7bf;
        --gb-accent: #4da3ff;
        --gb-track: rgba(77, 163, 255, 0.18);
        --gb-glow: rgba(77, 163, 255, 0.22);
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--gb-fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      user-select: none;
      -webkit-user-select: none;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 10px 28px var(--gb-glow));
    }
    .logo {
      width: min(220px, 52vmin);
      height: min(220px, 52vmin);
      object-fit: contain;
      opacity: 0;
      transform: scale(0.985);
      animation: gb-splash-in 420ms ease-out forwards;
    }
    @keyframes gb-splash-in {
      from { opacity: 0; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }
    .status {
      min-height: 1.25em;
      max-width: min(340px, 86vw);
      font-size: 13px;
      line-height: 1.25;
      color: var(--gb-muted);
      text-align: center;
      letter-spacing: 0.01em;
    }
    .progress {
      width: min(320px, 78vw);
      height: 6px;
      background: var(--gb-track);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--gb-accent);
      border-radius: 999px;
      transition: width 280ms ease;
    }
    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; opacity: 1; transform: none; }
      .progress-bar { transition: none; }
    }
  </style>
</head>
<body>
  <div class="logo-wrap" aria-hidden="true">
    <img class="logo" src="logo.svg" alt="" />
  </div>
  <div class="status" id="splashStatus" role="status" aria-live="polite" aria-atomic="true">Starting General Bots…</div>
  <div class="progress" role="progressbar" id="splashProgress" aria-label="Startup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="progress-bar" id="splashBar"></div>
  </div>
  <script>
    (function () {
      "use strict";
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      var statusEl = document.getElementById("splashStatus");
      var barEl = document.getElementById("splashBar");
      var progressEl = document.getElementById("splashProgress");
      var progress = 0;
      var stages = { health: false, api: false };

      function setProgress(value, text) {
        var next = Math.max(progress, Math.min(100, Math.round(value)));
        progress = next;
        if (barEl) barEl.style.width = next + "%";
        if (progressEl) progressEl.setAttribute("aria-valuenow", String(next));
        if (text && statusEl) statusEl.textContent = text;
      }

      // Allow native/Tauri side to push real milestones: window.gbSplashProgress(75, "Loading bot…")
      window.gbSplashProgress = setProgress;

      function poll() {
        // Real signals only (no fake timer): probe actual local endpoints.
        if (!stages.health) {
          fetch("http://127.0.0.1:8080/health", { cache: "no-store" })
            .then(function (r) {
              if (r.ok) {
                stages.health = true;
                setProgress(40, "Server is starting…");
              } else {
                setProgress(Math.max(progress, 10), "Starting services…");
              }
            })
            .catch(function () {
              setProgress(Math.max(progress, 5), "Starting services…");
            });
        } else if (!stages.api) {
          fetch("http://127.0.0.1:8080/api/product", { cache: "no-store", credentials: "omit" })
            .then(function (r) {
              if (r.ok) {
                stages.api = true;
                setProgress(85, "Loading interface…");
              } else {
                setProgress(55, "Services are starting…");
              }
            })
            .catch(function () {
              setProgress(50, "Services are starting…");
            });
        } else {
          // API is up; UI readiness is confirmed when Tauri closes splash on gb-boot-ready.
          setProgress(92, "Preparing workspace…");
        }
      }

      setProgress(2, "Starting General Bots…");
      poll();
      setInterval(poll, 900);
    })();
  </script>
</body>
</html>
