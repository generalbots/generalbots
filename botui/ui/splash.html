<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="dark"/>
<title>General Bots</title>
<link rel="stylesheet" href="suite/identity/lockup.css"/>
<style>
/* Splash is a deliberate dark identity exception (DESIGN-SYSTEM.md §3).
   One static picture behind the window, a top strip and a legal footer with
   hairline strokes, and the brand and progress over the picture's lower part.
   Text uses Fira Sans; section labels use Geist Mono. */
@import url("suite/css/identity-tokens.css");
@font-face{font-family:'Fira Sans';font-weight:400;font-style:normal;font-display:block;
  src:url("suite/identity/fonts/fira-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:'Fira Sans';font-weight:500;font-style:normal;font-display:block;
  src:url("suite/identity/fonts/fira-sans-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:'Geist Mono';font-style:normal;font-weight:100 900;font-display:block;
  src:url("suite/identity/fonts/geist-mono-latin-wght-normal.woff2") format("woff2")}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* The window is transparent and frameless: only the rounded card paints. */
html,body{width:100%;height:100%;overflow:hidden;background:transparent;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
/* Preview in a browser: the splash at the window's real size (776x443),
   centred on whole pixels so the text stays crisp. */
html.preview{display:block;background:#3a3a40}
html.preview body{width:776px;height:443px;
  margin:max(0px,round(down,(100vh - 443px) / 2,1px)) 0 0 max(0px,round(down,(100vw - 776px) / 2,1px))}

.card{position:relative;width:100%;height:100%;
  background:#0a0a0a;border-radius:10px;overflow:hidden;color:#ededed;
  font-family:var(--id-font-heading,'Fira Sans','Segoe UI',system-ui,sans-serif)}
.mono{font-family:'Geist Mono',ui-monospace,Consolas,monospace;font-weight:600}
.label{flex:none;white-space:nowrap;font-size:10.5px;letter-spacing:.06em;color:#8a8a8a}
.grow{flex:1;min-width:0}

/* The picture: full bleed, its centre 24px below the window's centre. It is
   48px taller than the window so its top edge stays at the window's top and
   the rainbow reaches the top corner. */
.bg{position:absolute;inset:0;z-index:0;overflow:hidden;background:#090909}
.bg img{position:absolute;top:0;left:50%;height:calc(100% + 48px);width:auto;
  transform:translateX(-50%);display:block}

/* Top-left corner: licence label, legal text and credit, in a column
   narrow enough to stay clear of the gear. */
.corner{position:absolute;z-index:1;top:17px;left:17px;display:flex;flex-direction:column;
  align-items:flex-start;gap:6px}
.legal{width:262px;font-size:10px;line-height:1.45;color:#8a8a8a;text-wrap:pretty}

/* Bottom row over a soft dark gradient: brand at the left (lockup line,
   tagline), status in a 200px right column (step line; bar, counter,
   percentage). Bottom margin equals the 17px side margin. */
.info{position:absolute;z-index:1;left:0;right:0;bottom:0;
  display:grid;grid-template-columns:minmax(0,1fr) 200px;column-gap:24px;
  padding:28px 17px 17px;
  background:linear-gradient(to bottom,rgb(10 10 10/0) 0%,rgb(10 10 10/.55) 38%,rgb(10 10 10/.84) 100%)}
.rows{display:grid;grid-template-rows:24px 16px;row-gap:8px;align-items:center;min-width:0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .id-lockup{--lockup-h:20px}
.divider{width:1px;height:16px;flex:none;background:rgb(255 255 255/.3)}
.version{color:#cfcfcf}
.slogan{font-size:13px;line-height:16px;font-weight:500;color:#ededed;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0}

.status-area{position:relative;min-width:0}
.bar-row{display:flex;align-items:center;gap:10px;min-width:0}
.bar-row .track{flex:1;min-width:0}
.progress .current{align-self:end;margin-bottom:-9px}
.current{flex:1;min-width:0;font-size:12.5px;line-height:16px;color:#dcdcdc;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.count{flex:none;font-size:11px;color:#a1a1a1}
.pct{flex:none;min-width:30px;text-align:right;font-size:11px;color:#ededed}
.track{height:4px;background:rgb(255 255 255/.16);border-radius:2px;overflow:hidden}
.fill{width:0%;height:100%;background:#ffffff;border-radius:2px;transition:width .12s linear}

/* Failure state: replaces the step line and bar, widened leftward to 304px;
   anchored to the bar's row and free to grow upward into the gradient. */
.fail{display:none;position:absolute;right:0;bottom:0;width:304px;flex-direction:column;gap:6px}
body.failed .fail{display:flex}
body.failed .progress{visibility:hidden}
.fail-msg{font-size:12.5px;line-height:15px;color:#ededed;text-wrap:pretty;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.fail-row{display:flex;align-items:center;gap:10px;min-width:0}
.fail-log{flex:1;display:flex;gap:6px;font-size:10px;line-height:12px;color:#a1a1a1;min-width:0}
.fail-log-label{flex:none;color:#7a7a7a}
.fail-path{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  user-select:text;-webkit-user-select:text}
.fail-actions{flex:none;display:flex;gap:8px}

.btn{height:26px;padding:0 12px;border:1px solid rgb(255 255 255/.3);border-radius:4px;background:rgb(10 10 10/.5);
  color:#ededed;font-family:inherit;font-size:12px;cursor:pointer}
.btn.primary{background:#ededed;border-color:#ededed;color:#0a0a0a}
.btn:focus-visible{outline:1px solid #ededed;outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}

@media(prefers-reduced-motion:reduce){
  .fill{transition:none}
}
</style>
</head>
<body>
<div class="card">
  <div class="bg" aria-hidden="true">
    <img id="bgImage" src="suite/identity/splash/splash-gear-v3.jpg" alt=""/>
  </div>
  <div class="corner">
    <span class="label mono" id="license"></span>
    <span class="legal" id="legalText"></span>
  </div>

   <div class="info">
    <div class="rows">
      <div class="brand">
        <span class="id-lockup id-lockup--on-dark" role="img" aria-label="General Bots Lite">
          <span class="id-lockup-mark" aria-hidden="true"></span>
          <span class="id-lockup-tag" aria-hidden="true">LITE</span>
        </span>
        <span class="divider" aria-hidden="true"></span>
        <span class="label mono version" id="splashVersion"></span>
      </div>
      <span class="slogan" id="sloganText"></span>
    </div>
    <div class="status-area">
      <div class="progress rows">
        <span class="current" id="splashStatus" role="status" aria-live="polite"
              aria-atomic="true"></span>
        <div class="bar-row">
          <div class="track" role="progressbar" id="splashProgress" aria-label="Startup progress"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="fill" id="splashBar"></div>
          </div>
          <span class="count mono" id="stepCount"></span>
          <span class="pct mono" id="splashPct"></span>
        </div>
      </div>
      <div class="fail">
        <span class="fail-msg" id="failMsg" role="alert"></span>
        <div class="fail-row">
          <span class="fail-log mono">
            <span class="fail-log-label" id="failLogLabel"></span>
            <span class="fail-path" id="failLog"></span>
          </span>
          <div class="fail-actions">
            <button type="button" class="btn primary" id="retryBtn"></button>
            <button type="button" class="btn" id="closeBtn"></button>
          </div>
        </div>
      </div>
    </div>
   </div>
</div>

<script>
(function(){
"use strict";
/* Signal the Rust shell that the page has painted its first frame: the shell
   polls the URL fragment and counts the minimum display time from here. */
requestAnimationFrame(function(){
  requestAnimationFrame(function(){
    try{history.replaceState(null,"","#splash-painted")}catch(e){}
  });
});
if("serviceWorker"in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(reg){reg.unregister()})}).catch(function(){})}
document.addEventListener("contextmenu",function(e){e.preventDefault()});

/* Language: query parameter overrides navigator, for preview. */
var params;
try{params=new URLSearchParams(location.search)}catch(e){params=null}
var langParam=params&&params.get("lang");
var pt=langParam?langParam.toLowerCase().startsWith("pt")
  :!!(navigator.language&&navigator.language.toLowerCase().startsWith("pt"));

var T=pt?{
  lang:"pt-BR",
  license:"C\u00d3DIGO ABERTO \xb7 LICEN\u00c7A MIT",
  legal:"Copyright General Bots \xb7 Pragmatismo. Inclui componentes de terceiros sob suas pr\u00f3prias licen\u00e7as. "
    +"Fornecido no estado em que se encontra, sem garantias. "
    +"Mantis Design System \xb7 Copyright Sentient LTDA. Feito no Brasil com carinho desmedido.",
  slogan:"Errar \u00e9 humano. Assinado, General Bots.",
  steps:["Iniciando servi\u00e7os","Abrindo cofre de seguran\u00e7a",
    "Conectando banco de dados","Montando armazenamento",
    "Carregando assistente","Preparando \u00e1rea de trabalho"],
  ready:"Pronto.",
  of:" de ",
  progress:"Progresso da inicializa\u00e7\u00e3o",
  failExited:function(c){return "O servidor do assistente foi encerrado durante a inicializa\u00e7\u00e3o"+(c==null?"":" (c\u00f3digo "+c+")")+"."},
  failDeadline:function(s){return "O servidor do assistente n\u00e3o respondeu em "+s+" segundos."},
  failPort:function(p,n){return "A porta "+p+" j\u00e1 est\u00e1 em uso por outro programa"+(n?" ("+n+")":"")+"; feche-o e tente de novo."},
  failStart:"N\u00e3o foi poss\u00edvel iniciar o servidor do assistente.",
  failLog:"REGISTRO",retry:"Tentar de novo",close:"Fechar"
}:{
  lang:"en",
  license:"OPEN SOURCE \xb7 MIT LICENSE",
  legal:"Copyright General Bots \xb7 Pragmatismo. Includes third-party components under their own licenses. "
    +"Provided as is, without warranties. "
    +"Mantis Design System \xb7 Copyright Sentient LTDA. Made in Brazil with boundless care.",
  slogan:"To err is human. Signed, General Bots.",
  steps:["Starting services","Opening the security vault",
    "Connecting the database","Mounting storage",
    "Loading the assistant","Preparing the workspace"],
  ready:"Ready.",
  of:" of ",
  progress:"Startup progress",
  failExited:function(c){return "The assistant\u2019s server stopped while starting"+(c==null?"":" (exit code "+c+")")+"."},
  failDeadline:function(s){return "The assistant\u2019s server did not answer within "+s+" seconds."},
  failPort:function(p,n){return "Port "+p+" is already in use by another program"+(n?" ("+n+")":"")+"; close it and try again."},
  failStart:"The assistant\u2019s server could not be started.",
  failLog:"LOG",retry:"Try again",close:"Close"
};

var N=T.steps.length;
/* Timed fallback, used until the shell reports a real step. */
var STEP_SECONDS=2.5;
/* Inside the running step the bar creeps from i/N toward (i+1)/N and stops
   short of the boundary; CREEP_TAU sets how fast it gets there. */
var CREEP_SPAN=0.96, CREEP_TAU=1.5;

function $(id){return document.getElementById(id)}
document.documentElement.lang=T.lang;

$("license").textContent=T.license;
$("legalText").textContent=T.legal;
$("sloganText").textContent=T.slogan;
/* Version: "V" + semver; V1.0.0 until the shell reports the real one. */
var VERSION_PLACEHOLDER="1.0.0";
$("splashVersion").textContent="V"+VERSION_PLACEHOLDER;
$("splashProgress").setAttribute("aria-label",T.progress);
$("failLogLabel").textContent=T.failLog;
$("retryBtn").textContent=T.retry;
$("closeBtn").textContent=T.close;

/* Shell labels for progress keys */
var shellLabels={
  "splash-starting-services":T.steps[0]+"\u2026",
  "splash-loading-interface":T.steps[4]+"\u2026",
  "splash-opening-workspace":T.steps[5]+"\u2026",
  "splash-ready":T.ready
};

/* State */
var bootAt=performance.now(), active=0, stepAt=bootAt, realSteps=false;
var ready=false, readyAt=0, floor=0, pct=0, failed=null;

function reset(){
  bootAt=performance.now();active=0;stepAt=bootAt;realSteps=false;
  ready=false;readyAt=0;floor=0;pct=0;
}

var previewMode=params&&params.get("preview");
var isPreview=previewMode==="1";
var isPreviewFail=previewMode==="fail";
if(isPreview||isPreviewFail)document.documentElement.classList.add("preview");

function ceiling(){return (active+CREEP_SPAN)/N*100}

function tick(){
  if(failed)return;
  var now=performance.now();
  if(!ready&&!realSteps){
    var next=Math.min(N-1,Math.floor((now-bootAt)/1000/STEP_SECONDS));
    if(next>active){active=next;stepAt=now}
  }
  if(isPreview){
    if(!ready&&!realSteps&&active===N-1&&now-stepAt>STEP_SECONDS*1000){
      ready=true;readyAt=now;
    }
    if(ready&&now-readyAt>2400)reset();
  }
  if(ready){pct=100}else{
    var creep=(active+CREEP_SPAN*(1-Math.exp(-(now-stepAt)/1000/CREEP_TAU)))/N*100;
    pct=Math.max(pct,creep,Math.min(floor,ceiling()));
  }
  render();
}

var shown={};
function set(key,value,apply){if(shown[key]!==value){shown[key]=value;apply(value)}}
function render(){
  var label=ready?T.ready:T.steps[active]+"\u2026";
  set("status",label,function(v){$("splashStatus").textContent=v});
  set("count",(ready?N:active+1)+T.of+N,function(v){$("stepCount").textContent=v});
  set("bar",pct.toFixed(1)+"%",function(v){$("splashBar").style.width=v});
  set("pct",Math.min(100,Math.floor(pct)),function(v){
    $("splashPct").textContent=v+"%";
    $("splashProgress").setAttribute("aria-valuenow",String(v));
    $("splashProgress").setAttribute("aria-valuetext",v+"%");
  });
}

/* Shell API ----------------------------------------------------------- */

/* gbSplashStep(i): step i has just started; earlier steps are done. */
window.gbSplashStep=function(index){
  var i=Math.floor(Number(index));
  if(ready||failed||!isFinite(i))return;
  realSteps=true;
  var clamped=Math.max(0,Math.min(N-1,i));
  if(clamped>active){active=clamped;stepAt=performance.now()}
  tick();
};

/* gbSplashProgress(value,text,key): ready keys at 100 finish; others floor. */
var READY_KEYS={"splash-ready":1,"splash-opening-workspace":1};
window.gbSplashProgress=function(value,text,key){
  var v=Number(value);
  if(failed||!isFinite(v))return;
  if(v>=100&&READY_KEYS[key]){ready=true;readyAt=performance.now()}
  else floor=Math.max(floor,Math.min(100,v));
  if(key&&shellLabels[key])$("splashStatus").textContent=shellLabels[key];
  else if(text)$("splashStatus").textContent=text;
  tick();
};

/* gbSplashVersion("Versão 7.0.37" | "Version 7.0.37") */
window.gbSplashVersion=function(text){
  var m=/\d+(?:\.\d+)+[^\s]*/.exec(String(text||""));
  if(m)$("splashVersion").textContent="V"+m[0];
};

/* gbSplashFail({kind,code,seconds,port,program,log}): boot failed. */
function failText(f){
  if(f.kind==="exited")return T.failExited(f.code);
  if(f.kind==="deadline")return T.failDeadline(f.seconds);
  if(f.kind==="port")return T.failPort(f.port,f.program);
  return T.failStart;
}
function buttons(enabled){$("retryBtn").disabled=!enabled;$("closeBtn").disabled=!enabled}
window.gbSplashFail=function(info){
  failed=info||{};
  document.body.classList.add("failed");
  $("failMsg").textContent=failText(failed);
  $("failMsg").title=failText(failed);
  $("failLog").textContent=String(failed.log||"");
  $("failLog").title=String(failed.log||"");
  buttons(true);
  render();
  $("retryBtn").focus();
};

/* gbSplashRestart(): back to progress state for another boot. */
window.gbSplashRestart=function(){
  failed=null;
  document.body.classList.remove("failed");
  try{history.replaceState(null,"","#splash-painted")}catch(e){}
  reset();tick();
};

/* Failure choice: stamped into the URL fragment for the shell to poll. */
function act(action){
  buttons(false);
  try{history.replaceState(null,"","#splash-action="+action)}catch(e){}
}
$("retryBtn").addEventListener("click",function(){act("retry")});
$("closeBtn").addEventListener("click",function(){act("close")});

/* Preview: ?preview=fail triggers the failure state (brief delay so the
   progress state renders first; short enough for headless screenshots). */
if(isPreviewFail){
  setTimeout(function(){
    window.gbSplashFail({kind:"deadline",seconds:180,
      log:"C:\\Users\\demo\\AppData\\Local\\generalbots\\stack\\logs\\botserver-sidecar.log"});
  },800);
}

/* Tick loop */
tick();
setInterval(tick,60);
})();
</script>
</body>
</html>
