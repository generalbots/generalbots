<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>General Bots</title>
  <style>
    /* Placeholder splash in the edition's identity: a paper card with the
       wordmark, a status line and a thin progress bar. No image, no network. */
    @font-face {
      font-family: "Palanquin Dark";
      font-weight: 500;
      font-display: swap;
      src: url("suite/identity/fonts/palanquin-dark-latin-500-normal.woff2") format("woff2");
    }
    :root {
      --paper: #fff8f2;
      --ink: #2c2c2c;
      --muted: #5f6673;
      --line: rgb(229 231 235 / .8);
      --track: rgb(243 244 246 / .9);
      --bar: #5c5c5c;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--ink);
      font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .card {
      width: min(340px, 84vw);
      padding: 28px 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / .08), 0 4px 6px -4px rgb(0 0 0 / .06);
    }
    .wordmark {
      margin: 0;
      font-family: "Palanquin Dark", "Segoe UI", system-ui, sans-serif;
      font-weight: 500;
      font-size: 26px;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #5c5c5c;
    }
    .status {
      min-height: 1.3em;
      font-size: 13px;
      line-height: 1.3;
      color: var(--muted);
    }
    .progress {
      width: 100%;
      height: 4px;
      background: var(--track);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--bar);
      border-radius: 999px;
      transition: width 280ms ease;
    }
    @media (prefers-reduced-motion: reduce) {
      .progress-bar { transition: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="wordmark" aria-hidden="true">General Bots.</p>
    <div class="status" id="splashStatus" role="status" aria-live="polite" aria-atomic="true">Starting services…</div>
    <div class="progress" role="progressbar" id="splashProgress" aria-label="Startup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-bar" id="splashBar"></div>
    </div>
  </div>
  <script>
    // A service worker left by an earlier version answered this page with the
    // cached desktop; make sure none stays registered for the application.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) { registration.unregister(); });
      }).catch(function () { /* nothing to remove */ });
    }
  </script>
  <script>
    (function () {
      "use strict";
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      var statusEl = document.getElementById("splashStatus");
      var barEl = document.getElementById("splashBar");
      var progressEl = document.getElementById("splashProgress");
      var progress = 0;
      var stages = { health: false, api: false };
      var timer = null;

      function setProgress(value, text) {
        var next = Math.max(progress, Math.min(100, Math.round(value)));
        progress = next;
        if (barEl) barEl.style.width = next + "%";
        if (progressEl) {
          progressEl.setAttribute("aria-valuenow", String(next));
          progressEl.setAttribute("aria-valuetext", next + "%");
        }
        if (text && statusEl) statusEl.textContent = text;
        if (next >= 100 && timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      // Allow native/Tauri side to push real milestones: window.gbSplashProgress(75, "Loading bot…")
      window.gbSplashProgress = setProgress;

      function poll() {
        // Real signals only (no fake timer): probe actual local endpoints.
        if (!stages.health) {
          fetch("http://127.0.0.1:8080/health", { cache: "no-store" })
            .then(function (r) {
              if (r.ok) {
                stages.health = true;
                setProgress(40, "Server is starting…");
              } else {
                setProgress(Math.max(progress, 10), "Starting services…");
              }
            })
            .catch(function () {
              setProgress(Math.max(progress, 5), "Starting services…");
            });
          return;
        }
        if (!stages.api) {
          fetch("http://127.0.0.1:8080/api/product", { cache: "no-store", credentials: "omit" })
            .then(function (r) {
              if (r.ok) {
                stages.api = true;
                setProgress(85, "Loading interface…");
              } else {
                setProgress(55, "Services are starting…");
              }
            })
            .catch(function () {
              setProgress(50, "Services are starting…");
            });
          return;
        }
        // API is up; UI readiness is confirmed when Tauri closes splash on gb-boot-ready.
        if (progress < 95) setProgress(92, "Preparing workspace…");
      }

      setProgress(2, "Starting services…");
      poll();
      timer = setInterval(poll, 900);
    })();
  </script>
</body>
</html>
