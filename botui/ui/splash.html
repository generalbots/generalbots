<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>General Bots</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: #00ff66;
      font-family: "Courier New", "Lucida Console", monospace;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .logo {
      width: 256px;
      height: 256px;
      image-rendering: auto;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .title {
      margin-top: 18px;
      font-size: 22px;
      letter-spacing: 6px;
      text-transform: uppercase;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #00aa44;
      letter-spacing: 2px;
    }
    .progress {
      margin-top: 18px;
      width: 280px;
      height: 6px;
      background: rgba(0, 255, 102, 0.15);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #00ff66;
      transition: width 0.3s ease;
    }
    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <img class="logo" src="logo.svg" alt="General Bots" />
  <div class="title">General Bots</div>
  <div class="status" id="splashStatus" role="status" aria-live="polite">Starting General Bots</div>
  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="progress-bar" id="splashBar"></div>
  </div>
  <script>
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  </script>
</body>
</html>
