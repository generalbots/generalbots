<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>General Bots</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #00ff66;
      font-family: "Courier New", "Lucida Console", monospace;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .logo {
      width: 168px;
      height: 168px;
      image-rendering: pixelated;
      animation: pulse 1.1s steps(2, end) infinite;
    }
    .title {
      margin-top: 18px;
      font-size: 22px;
      letter-spacing: 6px;
      text-transform: uppercase;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #00aa44;
      letter-spacing: 2px;
    }
    .dots::after {
      content: "";
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.75; }
    }
    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75%, 100% { content: "..."; }
    }
  </style>
</head>
<body>
  <img class="logo" src="logo.svg" alt="General Bots" />
  <div class="title">General Bots</div>
  <div class="status">Loading<span class="dots"></span></div>
</body>
</html>
