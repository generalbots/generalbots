<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>General Bots</title>
  <style>
    /* #1830 — serious splash: static frames only. The boot indicator is the
       page itself appearing, so the splash stays calm and does not animate. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #00ff66;
      font-family: "Courier New", "Lucida Console", monospace;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .logo {
      width: 168px;
      height: 168px;
      image-rendering: pixelated;
    }
    .title {
      margin-top: 18px;
      font-size: 22px;
      letter-spacing: 6px;
      text-transform: uppercase;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #00aa44;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <img class="logo" src="logo.svg" alt="General Bots" />
  <div class="title">General Bots</div>
  <div class="status">Starting General Bots</div>
</body>
</html>
