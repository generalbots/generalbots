<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Entrar — General Bots</title>
        <link rel="stylesheet" href="/suite/css/palette-tokens.css" />
<link rel="stylesheet" href="/suite/identity/fonts.css" />
        <link rel="stylesheet" href="/suite/identity/tokens.css" />
<script src="/suite/js/tauri-api.js?v=1"></script>
        <script src="/suite/identity/theme.js"></script>
        <script src="/suite/identity/textsize.js"></script>
        <link rel="stylesheet" href="/suite/assistant/titlebar.css" />
        <link rel="stylesheet" href="/suite/login-page.css" />
    </head>
    <body data-pending>
        <script src="/suite/identity/accent.js"></script>
        <script src="/suite/assistant/titlebar.js"></script>
        <main class="gb-login-main">
            <div class="gb-login-card" role="main">
                <div class="gb-login-wordmark" id="loginWordmark">
                    General Bots<span class="gb-login-dot">.</span>
                </div>
                <p class="gb-login-subtitle" id="loginSubtitle"></p>
                <form id="login-form" autocomplete="on" novalidate>
                    <div class="gb-login-field">
                        <label for="login-email" id="labelEmail"></label>
                        <input id="login-email" name="email" type="email"
                               autocomplete="username" required
                               data-i18n-placeholder="login-placeholder-email" />
                    </div>
                    <div class="gb-login-field">
                        <label for="login-password" id="labelPassword"></label>
                        <div class="gb-login-pw-wrap">
                            <input id="login-password" name="password"
                                   type="password" autocomplete="current-password"
                                   required />
                            <button type="button" class="gb-login-pw-toggle"
                                    id="pwToggle" aria-label="Show password"
                                    tabindex="0">
                                <svg id="pwIconShow" class="gb-login-pw-icon" width="18" height="18"
                                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2" stroke-linecap="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg id="pwIconHide" class="gb-login-pw-icon" width="18" height="18"
                                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2" stroke-linecap="round" style="display:none">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button id="login-btn" type="submit" class="gb-login-submit">
                        <span id="loginBtnText"></span>
                    </button>
                    <div class="gb-login-error" id="login-error" role="alert"
                         aria-live="polite"></div>
                </form>
            </div>
        </main>
        <script src="/suite/login-page.js"></script>
        <script>
            /* Editions on the assistant shell show the edition lockup, in the card and in the title bar. */
            (function () {
                function reveal() { document.body.removeAttribute("data-pending"); }
                fetch((window.__GB_SERVER_ORIGIN__ || "") + "/api/product", { credentials: "same-origin" })
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .then(function (p) {
                        if (p && p.shell === "assistant") {
                            var lockup = '<span class="id-lockup" role="img" aria-label="General Bots Lite"><span class="id-lockup-mark" aria-hidden="true"></span>' +
                                '<span class="id-lockup-tag" aria-hidden="true">LITE</span></span>';
                            document.querySelectorAll("#loginWordmark, .gb-titlebar-wordmark").forEach(function (el) { el.innerHTML = lockup; });
                        }
                        reveal();
                    }, reveal);
            })();

            /* Signal the Tauri splash to close. */
            if (window.__TAURI_INTERNALS__ || window.GBTAURI) {
                try {
                    history.replaceState(null, "", location.pathname + location.search + "#gb-boot-ready");
                } catch (e) { /* history unavailable */ }
            }
        </script>
    </body>
</html>
