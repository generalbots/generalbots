<link rel="stylesheet" href="/suite/css/palette-tokens.css" />
<link rel="stylesheet" href="/suite/calculator/calculator.css?v=1" />

<div class="gb-calc" id="gb-calc-root">
    <div class="gb-calc-main">
        <div class="gb-calc-toolbar">
            <div class="gb-calc-tabs" role="tablist" data-i18n-aria-label="calculator-aria-mode">
                <button type="button" class="gb-calc-tab active" role="tab" id="gb-tab-standard" aria-controls="gb-panel-standard" aria-selected="true" tabindex="0" data-tab="standard" data-i18n="products-pricelist-type-standard">Standard</button>
                <button type="button" class="gb-calc-tab" role="tab" id="gb-tab-scientific" aria-controls="gb-panel-scientific" aria-selected="false" tabindex="-1" data-tab="scientific" data-i18n="calculator-mode-scientific">Scientific</button>
                <button type="button" class="gb-calc-tab" role="tab" id="gb-tab-convert" aria-controls="gb-panel-convert" aria-selected="false" tabindex="-1" data-tab="convert" data-i18n="crm-convert">Convert</button>
            </div>
            <div class="gb-calc-tools">
                <button type="button" class="gb-calc-tool" id="gb-calc-angle" data-i18n-title="calculator-title-angle-unit">DEG</button>
                <button type="button" class="gb-calc-tool" id="gb-calc-memory-indicator" data-i18n-title="calculator-title-memory">M</button>
                <button type="button" class="gb-calc-tool" id="gb-calc-copy" data-i18n-title="action-copy" data-i18n="action-copy">Copy</button>
                <button type="button" class="gb-calc-tool" id="gb-calc-history-btn" data-i18n-title="attendant-history" data-i18n="attendant-history">History</button>
            </div>
        </div>

        <div class="gb-calc-screen">
            <input id="gb-calc-expr" class="gb-calc-expr" type="text" autocomplete="off"
                   spellcheck="false" data-i18n-aria-label="calculator-aria-expression" data-i18n-placeholder="calculator-placeholder-expression" />
            <div id="gb-calc-preview" class="gb-calc-preview">&nbsp;</div>
        </div>

        <div id="gb-calc-sci" class="gb-calc-pad gb-calc-sci" role="tabpanel" aria-labelledby="gb-tab-scientific" hidden></div>

        <div id="gb-calc-pad" class="gb-calc-pad gb-calc-standard" role="tabpanel" aria-labelledby="gb-tab-standard"></div>

        <div id="gb-calc-converter" class="gb-calc-converter" role="tabpanel" aria-labelledby="gb-tab-convert" hidden>
            <select id="gb-calc-conv-cat" class="gb-calc-select" data-i18n-aria-label="calculator-aria-category"></select>
            <div class="gb-calc-conv-row">
                <input id="gb-calc-conv-amt" class="gb-calc-input" type="text" value="1" aria-label="Amount" data-i18n-aria-label="calculator-aria-amount" />
                <select id="gb-calc-conv-from" class="gb-calc-select" aria-label="From unit" data-i18n-aria-label="calculator-aria-from-unit"></select>
            </div>
            <button type="button" class="gb-calc-key gb-calc-swap" id="gb-calc-conv-swap" title="Swap units" data-i18n-title="calculator-swap-units" aria-label="Swap units" data-i18n-aria-label="calculator-swap-units">⇅</button>
            <div class="gb-calc-conv-row">
                <div id="gb-calc-conv-out" class="gb-calc-input gb-calc-conv-result">—</div>
                <select id="gb-calc-conv-to" class="gb-calc-select" aria-label="To unit" data-i18n-aria-label="calculator-aria-to-unit"></select>
            </div>
        </div>
    </div>

    <aside id="gb-calc-history" class="gb-calc-history" hidden>
        <div class="gb-calc-history-head">
            <span data-i18n="attendant-history">History</span>
            <button type="button" class="gb-calc-tool" id="gb-calc-history-clear" data-i18n="action-clear">Clear</button>
        </div>
        <ul id="gb-calc-history-list" class="gb-calc-history-list"></ul>
    </aside>
</div>

<script src="/suite/js/calculator-engine.js?v=1"></script>
<script src="/suite/calculator/modules/01_state.js?v=1"></script>
<script src="/suite/calculator/modules/02_render.js?v=1"></script>
<script src="/suite/calculator/modules/03_events.js?v=2"></script>
<script src="/suite/calculator/modules/99_init.js?v=1"></script>
