<link rel="stylesheet" href="sheet/css/00_base.css" />
<link rel="stylesheet" href="sheet/css/01_toolbar.css" />
<link rel="stylesheet" href="sheet/css/02_grid.css" />
<link rel="stylesheet" href="sheet/css/03_sheet_status_chat.css" />
<link rel="stylesheet" href="sheet/css/04_context_menus.css" />
<link rel="stylesheet" href="sheet/css/05_modal_find_replace.css" />
<link rel="stylesheet" href="sheet/css/06_modal_validation_print.css" />
<link rel="stylesheet" href="sheet/css/07_charts_responsive.css" />
<link rel="stylesheet" href="css/collab.css" />

<div class="sheet-app" id="sheet-app" data-touch-target="self">
    <div class="sheet-toolbar">
        <div class="toolbar-left">
            <input type="text" class="sheet-name-input" id="sheetName" value="Untitled Spreadsheet" spellcheck="false" hx-post="/api/sheet/save" hx-trigger="blur changed" hx-vals='{"id":"current","action":"rename"}' hx-swap="none" />
        </div>
        <div class="toolbar-center">
            <div class="toolbar-group">
                <button class="btn-icon" id="undoBtn" title="Undo" hx-get="/api/sheet/load" hx-vals='{"id":"current","action":"undo"}' hx-swap="none">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
                </button>
                <button class="btn-icon" id="redoBtn" title="Redo" hx-get="/api/sheet/load" hx-vals='{"id":"current","action":"redo"}' hx-swap="none">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path></svg>
                </button>
            </div>
            <span class="toolbar-divider"></span>
            <div class="toolbar-group">
                <button class="btn-icon" id="printPreviewBtn" hx-get="/suite/sheet/modals/print-preview" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Print Preview">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                </button>
                <button class="btn-icon" id="findReplaceBtn" hx-get="/suite/sheet/modals/find-replace" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Find & Replace">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
            <span class="toolbar-divider"></span>
            <div class="toolbar-group format-group">
                <button class="btn-icon" id="boldBtn" title="Bold" hx-post="/api/sheet/format" hx-vals='{"id":"current","action":"bold"}' hx-swap="none"><strong>B</strong></button>
                <button class="btn-icon" id="italicBtn" title="Italic" hx-post="/api/sheet/format" hx-vals='{"id":"current","action":"italic"}' hx-swap="none"><em>I</em></button>
                <button class="btn-icon" id="underlineBtn" title="Underline" hx-post="/api/sheet/format" hx-vals='{"id":"current","action":"underline"}' hx-swap="none"><u>U</u></button>
                <button class="btn-icon" id="strikeBtn" title="Strikethrough" hx-post="/api/sheet/format" hx-vals='{"id":"current","action":"strikethrough"}' hx-swap="none"><s>S</s></button>
            </div>
            <span class="toolbar-divider"></span>
            <div class="toolbar-group">
                <button class="btn-icon" id="mergeCellsBtn" hx-post="/api/sheet/merge" hx-vals='{"id":"current"}' hx-swap="none" title="Merge Cells">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
                </button>
                <button class="btn-icon" id="conditionalFormatBtn" hx-get="/suite/sheet/modals/conditional-format" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Conditional Formatting">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" fill="#4CAF50"></rect><rect x="14" y="3" width="7" height="7" fill="#FFC107"></rect><rect x="3" y="14" width="7" height="7" fill="#F44336"></rect><rect x="14" y="14" width="7" height="7" fill="#2196F3"></rect></svg>
                </button>
                <button class="btn-icon" id="dataValidationBtn" hx-get="/suite/sheet/modals/data-validation" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Data Validation">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                </button>
            </div>
            <span class="toolbar-divider"></span>
            <div class="toolbar-group">
                <button class="btn-icon" id="insertChartBtn" hx-get="/suite/sheet/modals/chart" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Insert Chart">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="12" width="4" height="9"></rect><rect x="10" y="6" width="4" height="15"></rect><rect x="17" y="3" width="4" height="18"></rect></svg>
                </button>
                <button class="btn-icon" id="insertImageBtn" hx-get="/suite/sheet/modals/insert-image" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Insert Image">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                </button>
            </div>
            <span class="toolbar-divider"></span>
            <div class="toolbar-group">
                <button class="btn-icon" id="customFormatBtn" hx-get="/suite/sheet/modals/custom-format" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Custom Number Format">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><text x="2" y="16" font-size="10" fill="currentColor">#,##0.00</text></svg>
                </button>
            </div>
        </div>
        <div class="toolbar-right">
            <div class="collaborators" id="collaborators" data-max-avatars="6"></div>
            <span class="gb-connection-status offline" id="gb-conn-status" style="display:none;"><span class="dot"></span><span class="label">offline</span></span>
            <span id="gb-auth-button"></span>
            <button class="btn-primary" id="shareBtn" hx-get="/suite/sheet/modals/share" hx-vals='{"id":"current","name":"Planilha"}' hx-target="#modal-container" hx-swap="innerHTML">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                <span>Share</span>
            </button>
        </div>
    </div>

    <div class="sheet-main">
        <aside class="sheet-sidebar" id="sheet-sidebar" style="width:240px;background:#0f172a;border-right:1px solid #334155;display:flex;flex-direction:column;">
            <div class="sidebar-tabs" style="display:flex;border-bottom:1px solid #334155;">
                <button class="sidebar-tab active" data-sidebar-tab="files" style="flex:1;padding:8px;background:#1e293b;color:#f8fafc;border:none;cursor:pointer;font-size:12px;">📁 Arquivos</button>
                <button class="sidebar-tab" data-sidebar-tab="panels" style="flex:1;padding:8px;background:#0f172a;color:#94a3b8;border:none;cursor:pointer;font-size:12px;">📊 Painéis</button>
            </div>
            <div class="sidebar-content" id="sidebar-files" data-sidebar-content="files" hx-get="/api/sheet/list" hx-trigger="load" hx-ext="json-enc" hx-target="this" hx-swap="innerHTML"></div>
            <div class="sidebar-content" id="sidebar-panels" data-sidebar-content="panels" style="display:none;flex-direction:column;padding:8px;gap:6px;">
                <button class="sidebar-panel-btn" hx-get="/suite/sheet/fragments/named-ranges" hx-target="#sheet-content" hx-swap="innerHTML" style="padding:8px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;cursor:pointer;text-align:left;font-size:12px;">📐 Ranges Nomeados</button>
                <button class="sidebar-panel-btn" hx-get="/suite/sheet/fragments/charts" hx-target="#sheet-content" hx-swap="innerHTML" style="padding:8px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;cursor:pointer;text-align:left;font-size:12px;">📊 Gráficos</button>
                <button class="sidebar-panel-btn" hx-get="/suite/sheet/fragments/validations" hx-target="#sheet-content" hx-swap="innerHTML" style="padding:8px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;cursor:pointer;text-align:left;font-size:12px;">✓ Validações</button>
                <button class="sidebar-panel-btn" hx-get="/suite/sheet/fragments/conditional-formats" hx-target="#sheet-content" hx-swap="innerHTML" style="padding:8px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;cursor:pointer;text-align:left;font-size:12px;">🎨 Formatação Condicional</button>
                <button class="sidebar-panel-btn" hx-get="/suite/sheet/fragments/external-links" hx-target="#sheet-content" hx-swap="innerHTML" style="padding:8px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;cursor:pointer;text-align:left;font-size:12px;">🔗 Links Externos</button>
                <button class="sidebar-panel-btn" hx-get="/suite/sheet/fragments/comments" hx-target="#sheet-content" hx-swap="innerHTML" style="padding:8px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;cursor:pointer;text-align:left;font-size:12px;">💬 Comentários</button>
                <button class="sidebar-panel-btn" hx-get="/suite/sheet/fragments/protection" hx-target="#sheet-content" hx-swap="innerHTML" style="padding:8px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;cursor:pointer;text-align:left;font-size:12px;">🔒 Proteção</button>
                <button class="sidebar-panel-btn" hx-get="/suite/sheet/fragments/array-formulas" hx-target="#sheet-content" hx-swap="innerHTML" style="padding:8px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;cursor:pointer;text-align:left;font-size:12px;">🔢 Fórmulas de Matriz</button>
                <button class="sidebar-panel-btn" hx-get="/suite/sheet/fragments/advanced-ranges" hx-target="#sheet-content" hx-swap="innerHTML" style="padding:8px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;cursor:pointer;text-align:left;font-size:12px;">⚙ Ações Avançadas</button>
            </div>
        </aside>

        <div class="sheet-content" id="sheet-content" hx-get="/suite/sheet/fragments/tabs" hx-vals='{"id":"new"}' hx-trigger="load" hx-swap="innerHTML" style="flex:1;display:flex;flex-direction:column;background:#0f172a;">
        </div>
    </div>

    <div class="modal-host" id="modal-container"></div>
</div>

<script>
if (typeof htmx === 'undefined') {
    var s = document.createElement('script');
    s.src = 'js/vendor/htmx.min.js';
    document.body.appendChild(s);
}
</script>
<script src="js/vendor/htmx-json-enc.js"></script>
<script src="js/collab.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/modules-sheet-advanced/01_core.js"></script>
<script src="js/modules-sheet-advanced/02_conditional.js"></script>
<script src="js/modules-sheet-advanced/03_charts.js"></script>
<script src="sheet/sheet.js"></script>
