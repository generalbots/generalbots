<script>
/* Load sidebar dynamically from JSON API and render as HTML */
function newSheet() {
    fetch('/api/sheet/new').then(function(r){ return r.json(); }).then(function(s){
        window.__LOADED_SHEET = s;
        window.__SHEET_INITIAL_ID = s.id;
        var host = document.getElementById('sheet-content');
        if (!host) return;
        host.innerHTML = '';
        if (window.SheetVirtualGrid) {
            var VG = window.SheetVirtualGrid;
            VG.cells = new Map();
            VG.pool = [];
            VG.usedCount = 0;
            VG.requestSeq = 0;
            VG.lastRenderedRange = null;
            VG.selectedRow = 0;
            VG.selectedCol = 0;
            VG.editingCell = null;
            VG.selectionOverlay = null;
            VG.headerColPool = [];
            VG.init(host);
        }
    });
}
function loadSidebar() {
    var el = document.getElementById('sidebar-files');
    if (!el) return;
    fetch('/api/sheet/list').then(function(r){ return r.json(); }).then(function(items){
        if (!items || items.length === 0) {
            el.innerHTML = '<div style="padding:24px;text-align:center;color:#94a3b8;font-style:italic;">Nenhuma planilha. Crie uma nova para começar.</div>';
            return;
        }
        var html = '<div class="ss-sidebar" id="sheet-list-sidebar"><div class="ss-sidebar-header" style="display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #334155;"><h3 style="margin:0;color:#f8fafc;font-size:14px;">Minhas Planilhas</h3><button class="btn-icon" onclick="newSheet()" style="background:#10b981;color:white;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;">+ Nova</button></div><div class="ss-sidebar-body" style="padding:8px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 200px);overflow-y:auto;">';
        for (var i = 0; i < items.length; i++) {
            var m = items[i];
            html += '<div class="ss-metadata-card" onclick="loadSheet(\'' + m.id + '\')" style="padding:12px;border:1px solid #334155;border-radius:6px;background:#1e293b;cursor:pointer;"><div style="font-weight:600;color:#f8fafc;">' + escHtml(m.name) + '</div><div style="font-size:12px;color:#94a3b8;margin-top:4px;">' + (m.worksheet_count || 0) + ' planilha(s)</div></div>';
        }
        html += '</div></div>';
        el.innerHTML = html;
    }).catch(function(){
        el.innerHTML = '<div style="padding:24px;text-align:center;color:#94a3b8;font-style:italic;">Erro ao carregar planilhas.</div>';
    });
}
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function loadSheet(id) {
    window.__SHEET_INITIAL_ID = id;
    var host = document.getElementById('sheet-content');
    if (host) host.innerHTML = '<div style="padding:20px;color:#94a3b8;text-align:center;">Loading...</div>';
    // Load the worksheet tabs HTML from server, then init VirtualGrid
    fetch('/api/sheet/load?id=' + encodeURIComponent(id)).then(function(r){ return r.json(); }).then(function(sheet){
        window.__LOADED_SHEET = sheet;
        if (!host) return;
        host.innerHTML = '';
        // Re-initialize VirtualGrid with fresh state
        if (window.SheetVirtualGrid) {
            // Reset VirtualGrid state completely
            var VG = window.SheetVirtualGrid;
            VG.cells = new Map();
            VG.pool = [];
            VG.usedCount = 0;
            VG.requestSeq = 0;
            VG.lastRenderedRange = null;
            VG.selectedRow = 0;
            VG.selectedCol = 0;
            VG.editingCell = null;
            VG.selectionOverlay = null;
            VG.headerColPool = [];
            VG.init(host);
        }
    }).catch(function(){
        if (host) host.innerHTML = '<div style="padding:20px;color:#f87171;text-align:center;">Error loading sheet.</div>';
    });
}
if (typeof htmx === 'undefined') {
    var s = document.createElement('script');
    s.src = 'js/vendor/htmx.min.js';
    document.body.appendChild(s);
}
</script>

<script>
/* Boot: MUST run before sheet.js — load xlsx from Drive URL params */
(function(){
  setTimeout(loadSidebar, 100);
  var params = new URLSearchParams(window.location.search);
  var bucket = params.get('bucket');
  var path = params.get('path');

  if (!bucket || !path) {
    // If Drive already pre-loaded the sheet (via WindowManager injection),
    // respect its data — do not override __SHEET_INITIAL_ID.
    if (!window.__LOADED_SHEET) {
      window.__SHEET_INITIAL_ID = "current";
    }
    window.__SHEET_BOOT = Promise.resolve();
    return;
  }

  window.__SHEET_INITIAL_ID = "loading";
  var fileName = path.split('/').pop() || 'Spreadsheet';
  var nameInput = document.querySelector('.sheet-name-input');
  if (nameInput) nameInput.value = fileName;

  window.__SHEET_BOOT = fetch('/api/sheet/load-from-drive', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ bucket: bucket, path: path })
  }).then(function(r){ return r.json(); }).then(function(sheet){
    window.__LOADED_SHEET = sheet;
    window.__SHEET_INITIAL_ID = sheet.id;
    if (nameInput) nameInput.value = sheet.name || fileName;
  }).catch(function(err){
    console.error('Sheet load error:', err);
    window.__SHEET_INITIAL_ID = "current";
  });
})();
</script>
