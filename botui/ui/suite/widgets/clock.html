<div class="gb-system-widget" data-gb-widget="clock">
  <div class="gb-widget-clock-time">--:--</div>
  <div class="gb-widget-clock-date"></div>
</div>

<script>
(function () {
  "use strict";

  var POLL_MS = 1000;
  var SELECTOR = '[data-gb-widget="clock"]';

  // #1950 — resolve every clock host, not just the one nearest the script.
  // The partial is loaded three ways: statically in a widget body, injected by
  // the widget renderer, and HTMX-swapped into an app window. In the last two
  // `document.currentScript` is unavailable and there may be several clocks, so
  // the old single-host lookup left every clock showing `--:--`.
  function hosts() {
    return Array.prototype.slice.call(document.querySelectorAll(SELECTOR));
  }

  function render(host) {
    var timeEl = host.querySelector(".gb-widget-clock-time");
    var dateEl = host.querySelector(".gb-widget-clock-date");
    if (!timeEl || !dateEl) return;
    var now = new Date();
    timeEl.textContent = now.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit",
    });
    dateEl.textContent = now.toLocaleDateString([], {
      weekday: "short",
      day: "numeric",
      month: "short",
    });
  }

  function stop(host) {
    if (host.__gbClockTimer) {
      clearInterval(host.__gbClockTimer);
      host.__gbClockTimer = null;
    }
  }

  function start(host) {
    stop(host);
    render(host);
    host.__gbClockTimer = setInterval(function () {
      render(host);
    }, POLL_MS);
  }

  function boot() {
    if (document.hidden) return;
    hosts().forEach(start);
  }

  function stopAll() {
    hosts().forEach(stop);
  }

  boot();

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  }

  // Pause when the tab is hidden; resume on visible (and re-scan, since a
  // hidden pane may have mounted new clocks meanwhile).
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopAll();
    else boot();
  });

  // The desktop renders widget bodies and app windows after this script runs.
  if (document.body) {
    document.body.addEventListener("htmx:afterSwap", boot);
  }
  window.addEventListener("gb-widgets-changed", boot);

  // Stop the timer when the host widget is removed.
  document.addEventListener(
    "gb-widget-remove",
    function (event) {
      var host = event.target && event.target.querySelector
        ? event.target.querySelector(SELECTOR)
        : null;
      if (host) stop(host);
    },
    true
  );
})();
</script>
