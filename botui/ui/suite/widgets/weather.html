<div class="gb-system-widget" data-gb-widget="weather">
  <div class="gb-wweather">
    <div class="gb-wweather-city">São Paulo</div>
    <div class="gb-wweather-temp">--°C</div>
    <div class="gb-wweather-desc">--</div>
    <button type="button" class="gb-widget-btn gb-wweather-refresh" title="Refresh">↻</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var root = document.currentScript
    ? document.currentScript.closest(".gb-widget")
    : null;
  // #1341 — the desktop widget used to share `gb-weather-cache` with the
  // Weather app while writing a different schema, so each overwrote the other
  // and the user's chosen city was replaced by this widget's hardcoded default.
  // Keep a private cache and follow the app's persisted city instead.
  var CACHE_KEY = "gb-widget-weather-cache";
  var CITY_KEY = "gb-weather-city";
  var DEFAULT_CITY = "São Paulo";
  var DEFAULT_LAT = -23.55;
  var DEFAULT_LON = -46.63;

  function savedCity() {
    try { return localStorage.getItem(CITY_KEY) || ""; } catch (e) { return ""; }
  }

  function host() {
    return root || document.querySelector(".gb-widget");
  }

  function label(code) {
    if (code === 0) return "Sunny";
    if (code === 1 || code === 2) return "Partly cloudy";
    if (code === 3) return "Cloudy";
    if (code >= 51 && code <= 67) return "Rain";
    if (code >= 71 && code <= 77) return "Snow";
    if (code >= 95) return "Storm";
    return "Mild";
  }

  function render(box, data) {
    var city = box.querySelector(".gb-wweather-city");
    var temp = box.querySelector(".gb-wweather-temp");
    var desc = box.querySelector(".gb-wweather-desc");
    if (city) city.textContent = data.city || DEFAULT_CITY;
    if (temp) temp.textContent = data.temp || "--°C";
    if (desc) desc.textContent = data.desc || "--";
  }

  function fetchFor(box, lat, lon, cityLabel) {
    fetch("https://api.open-meteo.com/v1/forecast?latitude=" + lat +
      "&longitude=" + lon + "&current=temperature_2m,weather_code&timezone=auto")
      .then(function (r) { return r.json(); })
      .then(function (wx) {
        if (!wx || !wx.current) return;
        var data = {
          city: cityLabel || DEFAULT_CITY,
          temp: Math.round(wx.current.temperature_2m) + "°C",
          desc: label(wx.current.weather_code),
        };
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
        render(box, data);
      })
      .catch(function () {});
  }

  // Render the cached forecast instantly, then refresh from the free Open-Meteo
  // API (no key). The city follows the one the user picked in the Weather app:
  // it is geocoded so the coordinates match the choice, falling back to the
  // built-in default when nothing is saved or geocoding fails.
  function refresh(box) {
    try {
      var cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      if (cached) render(box, cached);
    } catch (e) {}
    var city = savedCity();
    if (!city) {
      fetchFor(box, DEFAULT_LAT, DEFAULT_LON, DEFAULT_CITY);
      return;
    }
    fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(city) + "&count=1&language=en&format=json")
      .then(function (r) { return r.json(); })
      .then(function (geo) {
        var hit = geo && geo.results && geo.results[0];
        if (!hit) { fetchFor(box, DEFAULT_LAT, DEFAULT_LON, city); return; }
        fetchFor(box, hit.latitude, hit.longitude, city);
      })
      .catch(function () { fetchFor(box, DEFAULT_LAT, DEFAULT_LON, city); });
  }

  function boot() {
    var box = host();
    if (!box) return;
    var refreshBtn = box.querySelector(".gb-wweather-refresh");
    if (refreshBtn) refreshBtn.addEventListener("click", function () { refresh(box); });
    refresh(box);
  }

  if (document.readyState === "complete" || document.readyState === "interactive") {
    boot();
  } else {
    document.addEventListener("DOMContentLoaded", boot);
  }

  if (root) {
    root.addEventListener("gb-widget-remove", function () {
      document.removeEventListener("DOMContentLoaded", boot);
    }, { once: true });
  }
})();
</script>
