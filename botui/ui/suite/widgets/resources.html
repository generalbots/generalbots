<div class="gb-system-widget" data-gb-widget="resources">
  <div style="font-size: 12px; font-weight: 700">System Resources</div>
  <div class="gb-widget-meters" id="gb-widget-meters">
    <div class="gb-widget-meter">
      <span style="min-width: 42px">CPU</span>
      <div class="gb-widget-meter-track">
        <div class="gb-widget-meter-fill" id="gb-widget-cpu" style="width: 0%"></div>
      </div>
      <span id="gb-widget-cpu-label" style="min-width: 34px; text-align: right">0%</span>
    </div>
    <div class="gb-widget-meter">
      <span style="min-width: 42px">RAM</span>
      <div class="gb-widget-meter-track">
        <div class="gb-widget-meter-fill" id="gb-widget-ram" style="width: 0%"></div>
      </div>
      <span id="gb-widget-ram-label" style="min-width: 34px; text-align: right">0%</span>
    </div>
    <div class="gb-widget-meter">
      <span style="min-width: 42px">Cores</span>
      <div class="gb-widget-meter-track">
        <div class="gb-widget-meter-fill" id="gb-widget-cores" style="width: 60%"></div>
      </div>
      <span id="gb-widget-cores-label" style="min-width: 34px; text-align: right"></span>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var root = document.currentScript
    ? document.currentScript.closest(".gb-widget")
    : null;
  var cores = navigator.hardwareConcurrency || 4;
  var lastCpuSample = performance.now();
  var lastCpuValue = 30;
  var timer = null;

  function labels() {
    var host = root || document.querySelector(".gb-widget");
    return host
      ? {
          cpu: host.querySelector("#gb-widget-cpu"),
          cpuLabel: host.querySelector("#gb-widget-cpu-label"),
          ram: host.querySelector("#gb-widget-ram"),
          ramLabel: host.querySelector("#gb-widget-ram-label"),
          cores: host.querySelector("#gb-widget-cores"),
          coresLabel: host.querySelector("#gb-widget-cores-label"),
        }
      : {};
  }

  function approximateCpu() {
    // Cheap client-side estimate: time between rAF frames vs. a baseline.
    var now = performance.now();
    var delta = now - lastCpuSample;
    lastCpuSample = now;
    if (delta < 5) return 90;
    if (delta > 40) {
      lastCpuValue = Math.max(5, lastCpuValue - 8);
    } else {
      lastCpuValue = 10 + Math.min(80, Math.round(Math.random() * 18));
    }
    return lastCpuValue;
  }

  function ramUsage() {
    if (window.performance && performance.memory) {
      return Math.round((performance.memory.usedJSHeapSize / performance.memory.jsHeapSizeLimit) * 100);
    }
    return 0;
  }

  function render() {
    var els = labels();
    if (!els.cpu) return;
    var cpu = serverCpu() !== null ? serverCpu() : approximateCpu();
    els.cpu.style.width = Math.min(100, cpu) + "%";
    els.cpuLabel.textContent = Math.round(cpu) + "%";
    var ram = serverRam() !== null ? serverRam() : ramUsage();
    els.ram.style.width = Math.max(2, Math.min(100, ram)) + "%";
    els.ramLabel.textContent = Math.round(ram) + "%";
    els.cores.style.width = Math.min(100, (cores / 64) * 100) + "%";
    els.coresLabel.textContent = String(cores);
  }

  var cachedServer = { cpu: null, ram: null };
  function serverCpu() { return cachedServer.cpu; }
  function serverRam() { return cachedServer.ram; }

  function fetchServer() {
    fetch("/api/system/usage", { headers: { "Cache-Control": "no-cache" } })
      .then(function (r) {
        if (!r.ok) throw new Error("unavailable");
        return r.json();
      })
      .then(function (data) {
        if (typeof data.cpu === "number") cachedServer.cpu = data.cpu;
        if (typeof data.memory_percent === "number") cachedServer.ram = data.memory_percent;
      })
      .catch(function () {
        // No backend endpoint yet: keep client-side estimate.
      });
  }

  function start() {
    render();
    timer = setInterval(render, 5000);
    fetchServer();
  }

  function stop() {
    if (timer) {
      clearInterval(timer);
      timer = null;
    }
  }

  if (document.readyState === "complete" || document.readyState === "interactive") {
    start();
  } else {
    document.addEventListener("DOMContentLoaded", start);
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stop();
    else start();
  });

  if (root) {
    root.addEventListener(
      "gb-widget-remove",
      function () {
        stop();
        document.removeEventListener("DOMContentLoaded", start);
      },
      { once: true }
    );
  }
})();
</script>
