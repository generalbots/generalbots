<link rel="stylesheet" href="/suite/css/collab.css" />
<link rel="stylesheet" href="/suite/plan/plan.css" />

<div class="gb-app plan-app" id="plan-app" data-touch-target="self" data-gb-app="plan">
    <div class="plan-toolbar">
        <div class="plan-toolbar-left">
            <input type="text" class="plan-title-input" id="planTitle" value="Meu Plano de Projeto" spellcheck="false" />
            <span class="plan-save-status" id="saveStatus" style="color:#94a3b8;font-size:12px;margin-left:8px;">Tudo salvo</span>
        </div>
        <div class="plan-toolbar-center">
            <div class="plan-view-tabs">
                <button class="plan-view-tab active" data-view="kanban">📋 Kanban</button>
                <button class="plan-view-tab" data-view="gantt">📅 Gantt</button>
                <button class="plan-view-tab" data-view="list">📊 Lista</button>
            </div>
            <span class="plan-toolbar-divider"></span>
            <button class="plan-btn plan-btn-primary" id="newTaskBtn">+ Nova Tarefa</button>
            <button class="plan-btn plan-btn-secondary" id="aiAssistBtn">🤖 IA Assist</button>
            <button class="plan-btn plan-btn-secondary" id="exportBtn">⬇ Exportar</button>
            <button class="plan-btn plan-btn-secondary" id="importBtn">⬆ Importar</button>
        </div>
        <div class="plan-toolbar-right">
            <div class="collaborators" id="collaborators" data-max-avatars="6"></div>
            <span class="gb-connection-status offline" id="gb-conn-status" style="display:none;"><span class="dot"></span><span class="label">offline</span></span>
            <span id="gb-auth-button"></span>
            <button class="plan-btn plan-btn-secondary" id="commentsBtn" onclick="openPlanComments()" title="Comments">💬 Comentários</button>
        </div>
    </div>

    <div class="plan-content" id="plan-content">
    </div>

    <div class="modal-host" id="modal-container"></div>
</div>

<div class="gb-state gb-state-loading"><span class="gb-state-msg">Loading…</span></div>
<div class="gb-state gb-state-error"><span class="gb-state-msg">Service unavailable</span></div>
<script>
if (typeof htmx === 'undefined') {
    var s = document.createElement('script');
    s.src = 'js/vendor/htmx.min.js';
    document.body.appendChild(s);
}
</script>
<script src="/suite/js/vendor/htmx-json-enc.js"></script>
<script src="/suite/js/collab.js"></script>
<script src="/suite/js/collab-comments.js"></script>
<script src="/suite/js/auth-guard.js"></script>
<script src="/suite/plan/plan.js"></script>
<script>
/* Plan collab comments — open threaded comments for the active board/plan. */
function getPlanId() {
    return (window.PlanStore && window.PlanStore.data && window.PlanStore.data.id) || "default";
}

function openPlanComments() {
    if (!window.GBCollabComments) return;
    var title = (document.getElementById("planTitle") && document.getElementById("planTitle").value) || "Project Plan";
    window.GBCollabComments.open({
        resourceType: "plan",
        resourceId: String(getPlanId()),
        includeChildren: true,
        title: "Comments on " + title,
    });
}

function openPlanTaskComments(taskId, taskTitle) {
    if (!window.GBCollabComments) return;
    window.GBCollabComments.open({
        resourceType: "plan:task",
        resourceId: String(taskId),
        title: "Comments on " + (taskTitle || "Task"),
    });
}
</script>
