<!-- Account form — create and edit share one partial (#1441 B).
     PUT /api/crm/accounts/{id} did not exist before this tranche; the suite
     could create, read and delete accounts but never edit one. -->
<form class="crm-form" id="crm-record-form" data-entity="account">
    <div class="crm-form-header">
        <h2 class="crm-form-title" data-form-title>New Account</h2>
        <button type="button" class="crm-form-close" onclick="closeCrmModal()" title="Close">×</button>
    </div>
    <input type="hidden" name="id" id="crm-record-id" value="">

    <div class="crm-form-group">
        <label class="crm-form-label">Name *</label>
        <input type="text" name="name" id="crm-name" class="crm-form-input" required>
    </div>

    <div class="crm-form-row">
        <div class="crm-form-group">
            <label class="crm-form-label">Industry</label>
            <input type="text" name="industry" id="crm-industry" class="crm-form-input">
        </div>
        <div class="crm-form-group">
            <label class="crm-form-label">Website</label>
            <input type="url" name="website" id="crm-website" class="crm-form-input" placeholder="https://">
        </div>
    </div>

    <div class="crm-form-row">
        <div class="crm-form-group">
            <label class="crm-form-label">Phone</label>
            <input type="tel" name="phone" id="crm-phone" class="crm-form-input">
        </div>
        <div class="crm-form-group">
            <label class="crm-form-label">Email</label>
            <input type="email" name="email" id="crm-email" class="crm-form-input">
        </div>
    </div>

    <div class="crm-form-row">
        <div class="crm-form-group">
            <label class="crm-form-label">Employees</label>
            <input type="number" name="employees_count" id="crm-employees" class="crm-form-input" min="0" step="1">
        </div>
        <div class="crm-form-group">
            <label class="crm-form-label">Annual Revenue</label>
            <input type="number" name="annual_revenue" id="crm-revenue" class="crm-form-input" min="0" step="0.01">
        </div>
    </div>

    <div class="crm-form-row">
        <div class="crm-form-group">
            <label class="crm-form-label">City</label>
            <input type="text" name="city" id="crm-city" class="crm-form-input">
        </div>
        <div class="crm-form-group">
            <label class="crm-form-label">Country</label>
            <input type="text" name="country" id="crm-country" class="crm-form-input">
        </div>
    </div>

    <div class="crm-form-group">
        <label class="crm-form-label">Description</label>
        <textarea name="description" id="crm-description" class="crm-form-textarea" rows="3"></textarea>
    </div>

    <div class="crm-form-actions">
        <button type="button" class="crm-form-btn secondary" onclick="closeCrmModal()">Cancel</button>
        <button type="submit" class="crm-form-btn primary">Create Account</button>
    </div>
</form>
