<!-- CRM overlays — shared modal and the campaign create form template.
     Loaded into crm.html through HTMX (hx-trigger="load") so the app shell
     stays under the 450-line limit. Both nodes are only read from event
     handlers, so loading them with the app is safe. -->

<!-- Modal for forms -->
<div id="crm-modal" class="crm-modal">
    <div class="crm-modal-backdrop" onclick="closeCrmModal()"></div>
    <div class="crm-modal-content" id="crm-modal-content"></div>
</div>

<!-- #1453 — campaign create form, loaded into the shared modal on demand -->
<template id="campaign-form-template">
    <form id="campaignForm" class="crm-form">
        <div class="crm-form-group">
            <label class="crm-form-label" data-i18n="label-name">Name</label>
            <input type="text" name="name" class="crm-form-input" required>
        </div>
        <div class="crm-form-group">
            <label class="crm-form-label" data-i18n="crm-field-channel">Channel</label>
            <select name="channel" class="crm-form-select">
                <option value="email" data-i18n="attendant-channel-email">Email</option>
                <option value="whatsapp">WhatsApp</option>
            </select>
        </div>
        <div class="crm-form-group">
            <label class="crm-form-label" data-i18n="crm-field-budget">Budget</label>
            <input type="number" name="budget" class="crm-form-input" min="0" step="0.01">
        </div>
        <div class="crm-form-group">
            <label class="crm-form-label" data-i18n="crm-field-scheduled-at">Scheduled at</label>
            <input type="datetime-local" name="scheduled_at" class="crm-form-input">
        </div>
        <div class="crm-form-actions">
            <button type="button" class="crm-form-btn secondary" onclick="closeCrmModal()" data-i18n="action-cancel">Cancel</button>
            <button type="submit" class="crm-form-btn primary" data-i18n="action-create">Create</button>
        </div>
    </form>
</template>
