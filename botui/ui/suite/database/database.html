<link rel="stylesheet" href="/suite/css/database.css">

<div class="gb-app db-root" data-gb-app="database">
    <div class="db-layout">
        <!-- Schema Browser (Left Panel) -->
        <aside class="db-sidebar" id="db-sidebar">
            <div class="db-sidebar-header">
                <h3 data-i18n="auto-schema-browser">Schema Browser</h3>
                <button class="db-btn-icon" onclick="DBApp.refreshSchema()" title="Refresh">&#8635;</button>
            </div>
            <div class="db-sidebar-search">
                <input type="text" id="db-table-search" placeholder="Search tables..." aria-label="Search tables" oninput="DBApp.filterTables(this.value)">
            </div>
            <div class="db-table-list" id="db-table-list" role="status" aria-live="polite" aria-busy="true">
                <div class="db-loading" data-i18n="auto-loading-schema">Loading schema...</div>
            </div>
            <div class="db-sidebar-footer">
                <button class="db-btn db-btn-primary db-new-table" onclick="DBApp.showNewTableModal()" data-i18n="auto-new-table">+ New Table</button>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="db-main">
            <!-- Toolbar -->
            <div class="db-toolbar" id="db-toolbar">
                <div class="db-toolbar-left" role="status" aria-live="polite" aria-atomic="true">
                    <span class="db-table-name" id="db-current-table" data-i18n="auto-select-a-table">Select a table</span>
                    <span class="db-row-count" id="db-row-count"></span>
                </div>
                <div class="db-toolbar-right">
                    <button class="db-btn" data-tool="sql" title="SQL Query">SQL</button>
                    <button class="db-btn" data-tool="export" title="Export CSV" data-i18n="action-export">Export</button>
                    <button class="db-btn" data-tool="import" title="Import CSV" data-i18n="action-import">Import</button>
                    <button class="db-btn db-btn-primary" data-tool="add" title="Add Row">+ Row</button>
                    <select id="db-page-size" class="db-select">
                        <option value="25">25 rows</option>
                        <option value="50" selected>50 rows</option>
                        <option value="100">100 rows</option>
                        <option value="200">200 rows</option>
                    </select>
                </div>
            </div>

            <!-- View Tabs (Grid / Fields) -->
            <div class="db-view-tabs" id="db-view-tabs" style="display:none">
                <div class="db-view-tab active" data-view="grid"><span class="db-view-icon">&#9638;</span> Grid</div>
                <div class="db-view-tab" data-view="fields"><span class="db-view-icon">&#9675;</span> Fields</div>
            </div>

            <!-- Column Filters -->
            <div class="db-filters" id="db-filters" style="display:none"></div>

            <!-- Data Grid -->
            <div class="db-grid-container" id="db-grid-container" tabindex="0" role="region" aria-label="Data grid" aria-live="polite">
                <div class="db-empty-state">
                    <div class="db-empty-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                        </svg>
                    </div>
                    <p>Select a table from the sidebar to view its data</p>
                </div>
            </div>

            <!-- Selection Bar -->
            <div class="db-selection-bar" id="db-selection-bar" hidden>
                <span class="db-sel-count" role="status" aria-live="polite" aria-atomic="true">0 selected</span>
                <div class="db-selection-actions">
                    <button class="db-btn db-btn-danger-outline" data-sel="delete" data-i18n="action-delete">Delete</button>
                    <button class="db-btn" data-sel="clear" data-i18n="action-clear">Clear</button>
                </div>
            </div>

            <!-- Pagination -->
            <div class="db-pagination" id="db-pagination" style="display:none">
                <button class="db-btn" id="db-prev-page" disabled data-i18n="auto-previous">&#8592; Previous</button>
                <span class="db-page-info" id="db-page-info" role="status" aria-live="polite" aria-atomic="true" data-i18n="auto-page-1-of-1">Page 1 of 1</span>
                <button class="db-btn" id="db-next-page" disabled data-i18n="auto-next">Next &#8594;</button>
            </div>

            <!-- SQL Console (hidden by default) -->
            <div class="db-sql-console" id="db-sql-console" style="display:none">
                <div class="db-sql-header">
                    <h3 data-i18n="auto-sql-console">SQL Console</h3>
                    <button class="db-btn-icon" onclick="DBApp.hideQueryBuilder()" aria-label="Close SQL console">&times;</button>
                </div>
                <textarea id="db-sql-input" class="db-sql-textarea" placeholder="SELECT * FROM table_name WHERE condition..." rows="4" aria-label="SQL query"></textarea>
                <div class="db-sql-actions">
                    <button class="db-btn db-btn-primary" onclick="DBApp.executeQuery()" data-i18n="auto-execute-ctrl-enter">Execute (Ctrl+Enter)</button>
                    <button class="db-btn" onclick="DBApp.explainQuery()" data-i18n="auto-explain">EXPLAIN</button>
                </div>
                <div class="db-sql-result" id="db-sql-result" role="status" aria-live="polite" aria-atomic="false"></div>
            </div>
        </div>
    </div>
</div>

<!-- New Table Modal -->
<div id="db-new-table-modal" class="db-modal" style="display:none">
    <div class="db-modal-overlay" onclick="DBApp.hideNewTableModal()"></div>
    <div class="db-modal-content" style="max-width:700px">
        <div class="db-modal-header">
            <h2 data-i18n="auto-create-new-table">Create New Table</h2>
            <button class="db-btn-icon" onclick="DBApp.hideNewTableModal()">&times;</button>
        </div>
        <div style="padding:16px">
            <div class="db-form-group">
                <label for="new-table-name" data-i18n="auto-table-name">Table Name</label>
                <!-- #1944 — data-gb-field lets the __ui_plan__ executor fill this
                     input by field name instead of guessing a selector. -->
                <input type="text" id="new-table-name" name="table_name" data-gb-field="Table Name" placeholder="my_table" class="db-input" pattern="[a-z_][a-z0-9_]*">
            </div>
            <div class="db-form-group">
                <label data-i18n="auto-columns">Columns</label>
                <div id="new-table-columns">
                    <div class="db-column-row">
                        <input type="text" placeholder="id" class="db-input" value="id" disabled>
                        <select class="db-select"><option>UUID</option></select>
                        <label class="db-checkbox"><input type="checkbox" checked disabled> PK</label>
                        <label class="db-checkbox"><input type="checkbox" checked disabled><span data-i18n="auto-not-null"> NOT NULL</span></label>
                    </div>
                    <div class="db-column-row">
                        <input type="text" placeholder="column_name" data-gb-field="Column Name" class="db-input">
                        <select class="db-select" data-gb-field="Column Type">
                            <option data-i18n="auto-varchar-255">VARCHAR(255)</option><option data-i18n="auto-text-2">TEXT</option><option data-i18n="auto-integer">INTEGER</option>
                            <option data-i18n="auto-bigint">BIGINT</option><option data-i18n="auto-decimal">DECIMAL</option><option data-i18n="auto-boolean">BOOLEAN</option>
                            <option data-i18n="auto-date">DATE</option><option data-i18n="auto-timestamptz">TIMESTAMPTZ</option><option data-i18n="auto-jsonb">JSONB</option>
                        </select>
                        <label class="db-checkbox"><input type="checkbox"> PK</label>
                        <label class="db-checkbox"><input type="checkbox" checked><span data-i18n="auto-not-null"> NOT NULL</span></label>
                        <button class="db-btn-icon" onclick="this.closest('.db-column-row').remove()">&#10005;</button>
                    </div>
                </div>
                <button class="db-btn" onclick="DBApp.addColumnRow()" style="margin-top:8px" data-i18n="auto-add-column">+ Add Column</button>
            </div>
            <div class="db-form-actions">
                <button class="db-btn db-cancel-btn" data-i18n="action-cancel">Cancel</button>
                <button class="db-btn db-btn-primary db-create-btn" data-i18n="auto-create-table">Create Table</button>
            </div>
        </div>
    </div>
</div>

<!-- Row Editor Modal -->
<div id="db-cell-edit-modal" class="db-modal" style="display:none">
    <div class="db-modal-overlay" onclick="DBApp.hideCellEdit()"></div>
    <div class="db-modal-content" style="max-width:560px">
        <div class="db-modal-header">
            <h2 id="db-row-edit-title" data-i18n="auto-edit-row">Edit Row</h2>
            <button class="db-btn-icon" onclick="DBApp.hideCellEdit()">&times;</button>
        </div>
        <div style="padding:16px">
            <div id="db-row-edit-body"></div>
            <div class="db-form-actions">
                <button class="db-btn db-cancel-btn" onclick="DBApp.hideCellEdit()" data-i18n="action-cancel">Cancel</button>
                <button class="db-btn db-btn-primary db-save-btn" data-i18n="action-save">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Import CSV Modal -->
<div id="db-import-modal" class="db-modal" style="display:none">
    <div class="db-modal-overlay" onclick="DBApp.hideImportModal()"></div>
    <div class="db-modal-content" style="max-width:500px">
        <div class="db-modal-header">
            <h2 data-i18n="auto-import-csv">Import CSV</h2>
            <button class="db-btn-icon" onclick="DBApp.hideImportModal()">&times;</button>
        </div>
        <div style="padding:16px">
            <div class="db-form-group">
                <label data-i18n="auto-select-csv-file">Select CSV file</label>
                <input type="file" id="db-import-file" accept=".csv" class="db-input">
            </div>
            <div class="db-form-actions">
                <button class="db-btn db-import-cancel" data-i18n="action-cancel">Cancel</button>
                <button class="db-btn db-btn-primary db-import-run" data-i18n="action-import">Import</button>
            </div>
        </div>
    </div>
</div>

<div class="gb-state gb-state-loading" role="status" aria-live="polite"><span class="gb-state-msg" data-i18n="crm-loading">Loading…</span></div>
<div class="gb-state gb-state-error" role="alert" aria-live="assertive"><span class="gb-state-msg" data-i18n="auto-service-unavailable">Service unavailable</span></div>
<script>
// Sequential module loader — ensures scripts execute in order
(function() {
    var modules = [
        '/suite/database/modules/01_state.js',
        '/suite/database/modules/02_render.js',
        '/suite/database/modules/03_actions.js',
        '/suite/database/modules/04_actions.js',
        '/suite/database/modules/99_init.js'
    ];
    var ts = Date.now();
    function loadNext() {
        if (modules.length === 0) return;
        var src = modules.shift() + '?_=' + ts;
        var s = document.createElement('script');
        s.src = src;
        s.onload = loadNext;
        s.onerror = loadNext;
        document.body.appendChild(s);
    }
    loadNext();
})();
</script>
