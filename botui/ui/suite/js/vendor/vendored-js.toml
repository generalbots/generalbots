# Pinned integrity manifest for vendored JavaScript assets (#2742).
#
# These bundles are copied into this directory and served locally by botui;
# they never came through a registry integrity check at install time. This
# file is their provenance record and tamper seal. `scripts/check_component_checksums.py
# --js-manifest <this file>` re-hashes every checked-in asset below and refuses
# any *.min.js in this tree that is not listed — so a modified bundle or a
# newly dropped one can no longer ship unnoticed.
#
# `url` is upstream provenance ONLY. It is written into no HTML/JS and no asset
# is fetched at runtime: every file is loaded from this local directory.
#
# Format: one [assets.<key>] table per file.
#   path    = path relative to this vendor directory
#   version = version read from the bundle's own banner
#   url     = HTTPS upstream release/source page (provenance, not a CDN link)
#   sha256  = SHA-256 of the checked-in file bytes

