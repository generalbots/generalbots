<link rel="stylesheet" href="/suite/css/palette-tokens.css" />
<link rel="stylesheet" href="/suite/calendar/calendar-layout.css?v=2" />
<link rel="stylesheet" href="/suite/calendar/calendar-views.css?v=1" />
<link rel="stylesheet" href="/suite/calendar/calendar-ical-responsive.css?v=1" />

<!-- Calendar - Event Management -->
<div class="gb-app calendar-container" id="calendar-app" data-gb-app="calendar">
    <!-- Sidebar -->
    <aside class="calendar-sidebar" id="calendar-sidebar">
        <div class="sidebar-header">
            <h2 data-i18n="nav-calendar">Calendar</h2>
            <button class="btn-icon" id="toggle-cal-sidebar" title="Collapse sidebar" aria-label="Collapse sidebar" data-i18n-title="calendar-collapse-sidebar" data-i18n-aria-label="calendar-collapse-sidebar">
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                >
                    <polyline points="11 17 6 12 11 7"></polyline>
                </svg>
            </button>
        </div>

        <!-- Quick Actions -->
        <div class="sidebar-actions">
            <button
                type="button"
                class="btn-primary-full"
                id="new-event-btn"
            >
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span data-i18n="calendar-new-event">New Event</span>
            </button>
        </div>

        <!-- Mini Calendar -->
        <div class="mini-calendar" id="mini-calendar">
            <div class="mini-calendar-header">
                <button class="btn-icon-sm" id="prev-month" title="Previous month" aria-label="Previous month" data-i18n-title="calendar-prev-month" data-i18n-aria-label="calendar-prev-month">
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        aria-hidden="true"
                    >
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <span class="mini-calendar-title" id="mini-cal-title"
                     data-i18n="calendar-mini-month-placeholder">January 2025</span
                >
                <button class="btn-icon-sm" id="next-month" title="Next month" aria-label="Next month" data-i18n-title="calendar-next-month" data-i18n-aria-label="calendar-next-month">
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        aria-hidden="true"
                    >
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>
            <div class="mini-calendar-grid">
                <div class="mini-calendar-weekdays">
                    <span data-i18n="day-sun">Su</span
                    ><span data-i18n="day-mon">Mo</span
                    ><span data-i18n="day-tue">Tu</span
                    ><span data-i18n="day-wed">We</span
                    ><span data-i18n="day-thu">Th</span
                    ><span data-i18n="day-fri">Fr</span
                    ><span data-i18n="day-sat">Sa</span>
                </div>
                <div class="mini-calendar-days" id="mini-cal-days">
                    <!-- Days generated by JS -->
                </div>
            </div>
        </div>

        <!-- Calendars List -->
        <div class="sidebar-section">
            <div class="section-header">
                <h3 data-i18n="calendar-my-calendars">My Calendars</h3>
                <button
                    class="btn-icon-sm"
                    title="Add calendar"
                    aria-label="Add calendar"
                    data-i18n-title="calendar-add-calendar"
                    data-i18n-aria-label="calendar-add-calendar"
                    hx-get="/api/ui/calendar/calendars/new"
                    hx-target="#calendar-modal-content"
                >
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
            <div
                class="calendars-list"
                id="calendars-list"
                aria-live="polite"
                hx-get="/api/ui/calendar/calendars"
                hx-trigger="load once"
                hx-swap="innerHTML"
                data-gb-states="list"
                data-gb-empty-icon="📅"
                data-gb-empty-title="calendar-state-empty-calendars-title"
                data-gb-empty-title-fallback="No calendars yet"
                data-gb-empty-desc="calendar-state-empty-calendars-desc"
                data-gb-empty-desc-fallback="A calendar holds your events. Create one to start scheduling."
            >
                <!-- Calendars loaded here -->
            </div>
        </div>

        <!-- Upcoming Events -->
        <div class="sidebar-section">
            <h3 data-i18n="calendar-upcoming">Upcoming</h3>
            <div
                class="upcoming-events"
                id="upcoming-events"
                hx-get="/api/ui/calendar/upcoming"
                hx-trigger="load once"
                hx-swap="innerHTML"
                data-gb-states="list"
                data-gb-empty-icon="🗓️"
                data-gb-empty-title="calendar-state-empty-upcoming-title"
                data-gb-empty-title-fallback="Nothing scheduled"
                data-gb-empty-desc="calendar-state-empty-upcoming-desc"
                data-gb-empty-desc-fallback="Your next appointments show up here so the day never surprises you."
                data-gb-empty-action="calendar-state-empty-upcoming-action"
                data-gb-empty-action-fallback="Schedule an event"
                data-gb-empty-action-target="new-event-btn"
            >
                <!-- Upcoming events loaded here -->
            </div>
        </div>

        <!-- iCal Import/Export -->
        <div class="sidebar-section">
            <div class="section-header">
                <h3 data-i18n="calendar-import-export">Import / Export</h3>
            </div>
            <div class="ical-actions">
                <a
                    href="/api/calendar/export.ics"
                    class="btn-secondary ical-btn"
                    download="calendar.ics"
                >
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
                        ></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Export iCal
                </a>
                <button
                    class="btn-secondary ical-btn"
                    onclick="document.getElementById('ical-import-modal').classList.remove('hidden')"
                >
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
                        ></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    Import iCal
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Calendar -->
<div id="calendarTplSlot11"></div>

    <!-- Event Modal -->
<div id="calendarTplSlot1"></div>

    <!-- Event Details Popup -->
    <div class="event-popup hidden" id="event-popup" role="status" aria-live="polite" aria-atomic="true">
        <div class="event-popup-header">
            <div class="event-popup-color" id="popup-color"></div>
            <h4 id="popup-title" data-i18n="calendar-popup-event-title">Event Title</h4>
            <div class="event-popup-actions">
                <button
                    class="btn-icon-sm"
                    id="edit-event"
                    title="Edit"
                    aria-label="Edit"
                    data-i18n-title="action-edit"
                    data-i18n-aria-label="action-edit"
                >
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"
                        ></path>
                        <path
                            d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"
                        ></path>
                    </svg>
                </button>
                <button
                    class="btn-icon-sm"
                    id="delete-event"
                    title="Delete"
                    aria-label="Delete"
                    data-i18n-title="action-delete"
                    data-i18n-aria-label="action-delete"
                >
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path
                            d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"
                        ></path>
                    </svg>
                </button>
                <button class="btn-icon-sm close-popup" data-i18n-title="action-close" data-i18n-aria-label="action-close">
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        aria-hidden="true"
                    >
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
        <div class="event-popup-body">
            <div class="popup-detail">
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span id="popup-time">10:00 AM - 11:00 AM</span>
            </div>
            <div class="popup-detail" id="popup-location-row">
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <path
                        d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"
                    ></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span id="popup-location" data-i18n="calendar-popup-location-placeholder">Conference Room A</span>
            </div>
            <div class="popup-detail" id="popup-description-row">
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <line x1="17" y1="10" x2="3" y2="10"></line>
                    <line x1="21" y1="6" x2="3" y2="6"></line>
                    <line x1="21" y1="14" x2="3" y2="14"></line>
                    <line x1="17" y1="18" x2="3" y2="18"></line>
                </svg>
                <span id="popup-description" data-i18n="calendar-popup-event-description">Event description</span>
            </div>
            <div class="popup-detail">
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <rect
                        x="3"
                        y="4"
                        width="18"
                        height="18"
                        rx="2"
                        ry="2"
                    ></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span id="popup-calendar" data-i18n="calendar-personal">Personal</span>
            </div>
        </div>
    </div>
</div>

<!-- iCal Import Modal -->
<div class="modal hidden" id="ical-import-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 data-i18n="calendar-import-ical-title">Import iCal File</h3>
            <button
                type="button"
                class="btn-icon close-modal"
                data-i18n-title="action-close"
                data-i18n-aria-label="action-close"
                onclick="document.getElementById('ical-import-modal').classList.add('hidden')"
            >
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                >
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="modal-body">
            <form
                hx-post="/api/calendar/import"
                hx-encoding="multipart/form-data"
                hx-target="#import-result"
                hx-swap="innerHTML"
                hx-on::after-request="if(event.detail.successful) { setTimeout(() => { document.getElementById('ical-import-modal').classList.add('hidden'); location.reload(); }, 1500); }"
            >
                <div class="form-group">
                    <label data-i18n="calendar-select-ics-file">Select .ics file</label>
                    <input
                        type="file"
                        name="file"
                        accept=".ics,.ical,text/calendar"
                        required
                        style="
                            padding: 12px;
                            border: 2px dashed var(--border);
                            border-radius: 8px;
                            width: 100%;
                            box-sizing: border-box;
                        "
                    />
                </div>
                <div class="form-group">
                    <label data-i18n="calendar-import-to-calendar-label">Import to calendar</label>
                    <select
                        name="calendar_id"
                        hx-get="/api/ui/calendar/calendars"
                        hx-trigger="intersect once"
                        hx-swap="innerHTML"
                    >
                        <option value="" data-i18n="calendar-default-calendar">Default Calendar</option>
                    </select>
                </div>
                <div id="import-result" style="margin-top: 12px" role="status" aria-live="polite"></div>
                <div class="form-actions">
                    <button
                        type="button"
                        class="btn-secondary"
                        onclick="document.getElementById('ical-import-modal').classList.add('hidden')"
                     data-i18n="action-cancel">
                        Cancel
                    </button>
                    <button type="submit" class="btn-primary" data-i18n="action-import">Import</button>
                </div>
            </form>
        </div>
    </div>
</div>


<div class="gb-state gb-state-loading" role="status" aria-live="polite"><span class="gb-state-msg" data-i18n="calendar-loading">Loading calendar…</span></div>
<div class="gb-state gb-state-error" role="alert" aria-live="assertive"><span class="gb-state-msg" data-i18n="calendar-unavailable">Calendar unavailable</span></div>
