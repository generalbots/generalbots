<link rel="stylesheet" href="/suite/video/video.css?v=2">
<div class="gb-app" data-gb-app="video">
<div class="gb-state gb-state-loading"><span class="gb-state-msg" data-i18n="auto-loading-cameras">Loading cameras…</span></div>
<div class="gb-state gb-state-error"><span class="gb-state-msg" data-i18n="auto-camera-service-unavailable">Camera service unavailable</span></div>
  <header class="header">
    <h1 data-i18n="auto-monitoramento-por-ia">Monitoramento por IA</h1>
    <div class="header-actions">
      <button class="btn btn-primary" id="btnAddCamera">+ Adicionar Câmera</button>
    </div>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="label">Detecções Hoje</span>
      <span class="value accent" id="statDetections">0</span>
    </div>
    <div class="stat-card">
      <span class="label" data-i18n="monitoring-uptime">Uptime</span>
      <span class="value success" id="statUptime">0%</span>
    </div>
    <div class="stat-card">
      <span class="label" data-i18n="auto-armazenamento-usado">Armazenamento Usado</span>
      <span class="value warning" id="statStorage">0 GB</span>
    </div>
    <div class="stat-card">
      <span class="label">Câmeras Ativas</span>
      <span class="value accent" id="statCamerasActive">0</span>
    </div>
  </div>

  <div class="main-layout">
    <div class="cameras-section">
      <div class="section-header">
        <h2>Câmeras</h2>
        <button class="btn btn-sm" id="btnRefreshCameras">Atualizar</button>
      </div>
      <div class="cameras-grid" id="camerasGrid">
        <div class="loading">Carregando câmeras...</div>
      </div>
    </div>

    <div class="sidebar">
      <div class="panel">
        <div class="panel-header">
          <h3>Alertas Recentes</h3>
          <button class="btn btn-sm" id="btnRefreshAlerts">Atualizar</button>
        </div>
        <div class="alerts-list" id="alertsList">
          <div class="loading">Carregando alertas...</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h3>Análíticas</h3>
        </div>
        <div class="analytics-list" id="analyticsList">
          <div class="loading">Carregando...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="addCameraModal" role="dialog" aria-modal="true" aria-labelledby="addCameraModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h3 id="addCameraModalTitle" data-i18n="auto-add-camera">Add Camera</h3>
        <button class="modal-close" data-close="addCameraModal" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="cameraName" data-i18n="label-name">Name</label>
          <input type="text" id="cameraName" required placeholder="e.g. Main Entrance">
        </div>
        <div class="form-group">
          <label for="cameraRtsp" data-i18n="auto-url-rtsp">RTSP URL</label>
          <input type="text" id="cameraRtsp" required placeholder="rtsp://user:pass@ip:port/stream">
        </div>
        <div class="form-group">
          <label for="cameraLocation" data-i18n="label-location">Location</label>
          <input type="text" id="cameraLocation" placeholder="e.g. Building A - Ground Floor">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close="addCameraModal" data-i18n="action-cancel">Cancel</button>
        <button class="btn btn-primary" id="btnSaveCamera" data-i18n="action-save">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

</div>
  <script src="/suite/video/video.js?v=2"></script>
