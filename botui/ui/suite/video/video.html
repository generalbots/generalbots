<link rel="stylesheet" href="/suite/css/palette-tokens.css" />
<link rel="stylesheet" href="/suite/video/video.css?v=2">
<div class="gb-app" data-gb-app="video">
<div class="gb-state gb-state-loading"><span class="gb-state-msg" data-i18n="video-loading-cameras">Loading cameras…</span></div>
<div class="gb-state gb-state-error"><span class="gb-state-msg" data-i18n="video-camera-service-unavailable">Camera service unavailable</span></div>
  <header class="header">
    <h1 data-i18n="video-monitoring-title">AI Monitoring</h1>
    <div class="header-actions">
      <button class="btn btn-primary" id="btnAddCamera" data-i18n="video-add-camera">+ Add camera</button>
    </div>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="label" data-i18n="video-detections-today">Detections today</span>
      <span class="value accent" id="statDetections">0</span>
    </div>
    <div class="stat-card">
      <span class="label" data-i18n="monitoring-uptime">Uptime</span>
      <span class="value success" id="statUptime">0%</span>
    </div>
    <div class="stat-card">
      <span class="label" data-i18n="video-storage-used">Storage used</span>
      <span class="value warning" id="statStorage">0 GB</span>
    </div>
    <div class="stat-card">
      <span class="label" data-i18n="video-cameras-online">Cameras online</span>
      <span class="value accent" id="statCamerasActive">0</span>
    </div>
  </div>

  <div class="main-layout">
    <div class="cameras-section">
      <div class="section-header">
        <h2 data-i18n="video-cameras">Cameras</h2>
        <button class="btn btn-sm" id="btnRefreshCameras" data-i18n="action-refresh">Refresh</button>
      </div>
      <div class="cameras-grid" id="camerasGrid">
        <div class="loading" data-i18n="video-loading-cameras">Loading cameras…</div>
      </div>
    </div>

    <div class="sidebar">
      <div class="panel">
        <div class="panel-header">
          <h3 data-i18n="video-recent-alerts">Recent alerts</h3>
          <button class="btn btn-sm" id="btnRefreshAlerts" data-i18n="action-refresh">Refresh</button>
        </div>
        <div class="alerts-list" id="alertsList">
          <div class="loading" data-i18n="video-loading-alerts">Loading alerts…</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h3 data-i18n="video-analytics">Analytics</h3>
        </div>
        <div class="analytics-list" id="analyticsList">
          <div class="loading" data-i18n="label-loading">Loading…</div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="addCameraModal" role="dialog" aria-modal="true" aria-labelledby="addCameraModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h3 id="addCameraModalTitle" data-i18n="video-add-camera-dialog">Add Camera</h3>
        <button class="modal-close" data-close="addCameraModal" data-i18n-aria-label="action-close" data-i18n-title="action-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="cameraName" data-i18n="label-name">Name</label>
          <input type="text" id="cameraName" required data-i18n-placeholder="video-placeholder-camera-name">
        </div>
        <div class="form-group">
          <label for="cameraRtsp" data-i18n="video-rtsp-url">RTSP URL</label>
          <input type="text" id="cameraRtsp" required data-i18n-placeholder="video-placeholder-rtsp-url">
        </div>
        <div class="form-group">
          <label for="cameraLocation" data-i18n="label-location">Location</label>
          <input type="text" id="cameraLocation" data-i18n-placeholder="video-placeholder-location">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close="addCameraModal" data-i18n="action-cancel">Cancel</button>
        <button class="btn btn-primary" id="btnSaveCamera" data-i18n="action-save">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

</div>
  <script src="/suite/video/video.js?v=2"></script>
