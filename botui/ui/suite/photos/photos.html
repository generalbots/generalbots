<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Photos</title>
    <link rel="stylesheet" href="/suite/photos/photos.css" />
</head>
<body>
    <div class="gb-photos" id="gb-photos">
        <div class="photos-toolbar">
            <h2 data-i18n="auto-photos">Photos</h2>
            <button class="photos-refresh" id="photosRefresh"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg> Refresh</button>
            <span class="photos-count" id="photosCount"></span>
        </div>
        <div class="photos-grid" id="photosGrid">
            <div class="photos-empty" data-i18n="auto-loading-your-images-from-drive">Loading your images from Drive…</div>
        </div>
        <div class="photos-lightbox" id="photosLightbox" style="display:none">
            <button class="photos-lb-close" id="photosLbClose"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
            <img id="photosLbImg" alt="Preview" />
        </div>
    </div>
    <script src="/suite/photos/photos.js"></script>
</body>
</html>
