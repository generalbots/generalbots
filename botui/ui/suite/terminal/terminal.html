<link rel="stylesheet" href="/suite/css/vendor/xterm.css">
<link rel="stylesheet" href="/suite/css/terminal.css">

<div class="gb-app term-root" data-gb-app="terminal">
    <div class="term-toolbar">
        <div class="term-tabs" id="term-tabs">
            <div class="term-tab active" data-tab="0">
                <span class="term-tab-label">Terminal 1</span>
                <span class="term-tab-close" onclick="GBTerminal.closeTab(0)">&times;</span>
            </div>
            <button class="term-tab-add" id="btn-add-tab" title="New tab">+</button>
        </div>
        <div class="term-actions">
            <label class="term-vm-picker" title="Exec into a project VM (Incus container) or the host shell">
                <span class="term-vm-label">VM:</span>
                <select id="termVmSelect">
                    <option value="">Default (host shell)</option>
                    <option value="__loading__" disabled>Loading VMs…</option>
                </select>
            </label>
            <button class="term-action-btn" onclick="GBTerminal.clearCurrent()" title="Clear">Clear</button>
            <button class="term-action-btn" onclick="GBTerminal.find()" title="Find (Ctrl+Shift+F)">Find</button>
        </div>
    </div>
    <div class="term-body" id="term-body">
        <div class="term-pane active" data-pane="0"></div>
    </div>
    <div class="term-statusbar">
        <span id="term-status-text">Connecting...</span>
        <span class="term-status-sep">|</span>
        <span id="term-dimensions">80x24</span>
        <span class="term-status-sep">|</span>
        <span id="term-ws-status">WS: --</span>
    </div>
</div>

<div class="gb-state gb-state-loading"><span class="gb-state-msg">Loading…</span></div>
<div class="gb-state gb-state-error"><span class="gb-state-msg">Service unavailable</span></div>
<script src="/suite/js/vendor/xterm/xterm.js"></script>
<script src="/suite/js/vendor/xterm/addon-fit.js"></script>
<script src="/suite/js/vendor/xterm/addon-web-links.js"></script>
<script src="/suite/terminal/terminal.js?v=5"></script>
