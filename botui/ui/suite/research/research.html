<link rel="stylesheet" href="/suite/research/research.p1.css?v=1" />
<link rel="stylesheet" href="/suite/research/research.p2.css?v=1" />
<link rel="stylesheet" href="/suite/research/research.p3.css?v=1" />
<link rel="stylesheet" href="/suite/research/research-inline.p1.css?v=1" />
<link rel="stylesheet" href="/suite/research/research-inline.p2.css?v=1" />
<link rel="stylesheet" href="/suite/research/research-inline.p3.css?v=1" />

<!-- Research - AI-Powered Search & Discovery -->
<div class="research-container gb-app" id="research-app" data-gb-app="research">
    <!-- Sidebar - Sources & Collections -->
<div id="researchSidebarSlot"></div>

    <!-- Main Content -->
    <main class="research-main">
        <!-- Search Header -->
        <div class="search-header">
            <form
                class="search-form"
                id="research-form"
                hx-post="/api/ui/research/search"
                hx-target="#main-results"
                hx-indicator="#search-indicator"
            >
                <div class="search-input-wrapper">
                    <svg
                        class="search-icon"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <textarea
                        name="query"
                        id="search-input"
                        placeholder="Ask anything..."
                        rows="1"
                        autofocus
                    ></textarea>
                    <input
                        type="hidden"
                        name="focus"
                        id="focus-mode"
                        value="all"
                    />
                    <input
                        type="hidden"
                        name="pro"
                        id="pro-mode"
                        value="false"
                    />
                </div>

                <div class="search-options">
                    <label class="option-toggle">
                        <input type="checkbox" id="pro-search-toggle" />
                        <span class="toggle-label">
                            <svg
                                width="14"
                                height="14"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <polygon
                                    points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"
                                ></polygon>
                            </svg>
                            Pro Search
                        </span>
                    </label>
                    <label class="option-toggle">
                        <input type="checkbox" id="include-images-toggle" />
                        <span class="toggle-label">
                            <svg
                                width="14"
                                height="14"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <rect
                                    x="3"
                                    y="3"
                                    width="18"
                                    height="18"
                                    rx="2"
                                    ry="2"
                                ></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            Images
                        </span>
                    </label>
                    <button type="submit" class="search-btn">
                        <span>Search</span>
                        <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>
            </form>

            <!-- Search Indicator -->
            <div class="search-indicator htmx-indicator" id="search-indicator">
                <div class="indicator-dots">
                    <span></span><span></span><span></span>
                </div>
                <span class="indicator-text">Searching sources...</span>
            </div>
        </div>

        <!-- Suggestions (shown when no search) -->
        <div class="suggestions-panel" id="suggestions-panel">
            <h3>Try asking about</h3>
            <div class="suggestion-cards">
                <button
                    class="suggestion-card"
                    data-query="What are the latest developments in AI?"
                >
                    <span class="suggestion-icon">🤖</span>
                    <span class="suggestion-text">Latest AI developments</span>
                </button>
                <button
                    class="suggestion-card"
                    data-query="Explain quantum computing in simple terms"
                >
                    <span class="suggestion-icon">⚛️</span>
                    <span class="suggestion-text"
                        >Quantum computing explained</span
                    >
                </button>
                <button
                    class="suggestion-card"
                    data-query="Best practices for software architecture"
                >
                    <span class="suggestion-icon">🏗️</span>
                    <span class="suggestion-text">Software architecture</span>
                </button>
                <button
                    class="suggestion-card"
                    data-query="How to improve productivity with AI tools"
                >
                    <span class="suggestion-icon">📈</span>
                    <span class="suggestion-text">AI productivity tools</span>
                </button>
            </div>

            <!-- Trending Topics -->
            <div class="trending-section">
                <h3>Trending</h3>
                <div
                    class="trending-tags"
                    id="trending-tags"
                    hx-get="/api/ui/research/trending"
                    hx-trigger="load"
                    hx-swap="innerHTML"
                >
                    <!-- Trending tags loaded here -->
                </div>
            </div>
        </div>

        <!-- Results Area -->
        <div class="results-container" id="main-results">
            <!-- Results loaded here via HTMX -->
        </div>
    </main>

    <!-- Sources Panel (Right) -->
    <aside class="sources-panel hidden" id="sources-panel">
        <div class="sources-header">
            <h3>Sources</h3>
            <div class="sources-actions">
                <button
                    class="btn-icon-sm"
                    title="Export Citations"
                    hx-get="/api/ui/research/export/citations"
                    hx-swap="none"
                >
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"
                        ></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
                <button class="btn-icon-sm" id="close-sources">
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
        <div class="sources-list" id="sources-list">
            <!-- Sources loaded here -->
        </div>
    </aside>
</div>

<!-- Result Template (for HTMX responses) -->
<template id="result-template">
    <div class="result-card">
        <div class="result-answer">
            <div class="answer-content" id="answer-content">
                <!-- AI-generated answer with citations -->
            </div>
            <div class="answer-actions">
                <button class="action-btn" title="Copy">
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <rect
                            x="9"
                            y="9"
                            width="13"
                            height="13"
                            rx="2"
                            ry="2"
                        ></rect>
                        <path
                            d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"
                        ></path>
                    </svg>
                </button>
                <button class="action-btn" title="Save to Collection">
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"
                        ></path>
                    </svg>
                </button>
                <button class="action-btn" title="Share">
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                </button>
                <button class="action-btn" title="Export to Paper">
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"
                        ></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Related Questions -->
        <div class="related-questions">
            <h4>Related</h4>
            <div class="related-list" id="related-questions">
                <!-- Related questions loaded here -->
            </div>
        </div>

        <!-- Sources Preview -->
        <div class="sources-preview">
            <div class="sources-preview-header">
                <h4>Sources</h4>
                <button class="btn-text" id="view-all-sources">View all</button>
            </div>
            <div class="sources-preview-list" id="sources-preview">
                <!-- Top sources shown here -->
            </div>
        </div>
    </div>
</template>



<div class="gb-state gb-state-loading"><span class="gb-state-msg">Loading Research…</span></div>
<div class="gb-state gb-state-error"><span class="gb-state-msg">Research service unavailable</span></div>
<script src="/suite/research/research-templates.js?v=1"></script>
<script src="/suite/research/research-inline.js?v=1"></script>
