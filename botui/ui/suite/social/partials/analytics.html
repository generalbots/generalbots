<!-- Analytics tab for the Social app -->
<div class="social-analytics">
  <h3 data-i18n="auto-post-engagement-analytics">Post Engagement Analytics</h3>
  <p class="hint" data-i18n="auto-last-30-days-per-platform-breakdown">Last 30 days · per platform breakdown</p>
  <div class="kpi-grid" id="analytics-kpis">
    <div class="kpi"><span class="kpi-label">Total posts</span><span class="kpi-value" data-counter="total">—</span></div>
    <div class="kpi"><span class="kpi-label" data-i18n="auto-reach">Reach</span><span class="kpi-value" data-counter="reach">—</span></div>
    <div class="kpi"><span class="kpi-label" data-i18n="auto-engagement-rate">Engagement rate</span><span class="kpi-value" data-counter="engagement">—</span></div>
    <div class="kpi"><span class="kpi-label" data-i18n="auto-new-followers">New followers</span><span class="kpi-value" data-counter="followers">—</span></div>
  </div>
  <table class="data-table" id="analytics-per-platform">
    <thead>
      <tr>
        <th data-i18n="auto-platform">Platform</th>
        <th data-i18n="auto-posts">Posts</th>
        <th data-i18n="auto-reach">Reach</th>
        <th data-i18n="auto-likes">Likes</th>
        <th data-i18n="sheet-comments">Comments</th>
        <th data-i18n="auto-shares">Shares</th>
      </tr>
    </thead>
    <tbody>
      <tr><td data-i18n="attendant-channel-instagram">Instagram</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>
      <tr><td>WhatsApp</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>
      <tr><td>Telegram</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>
      <tr><td data-i18n="attendant-channel-teams">Teams</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>
    </tbody>
  </table>
  <script>
    document.querySelectorAll('#analytics-kpis [data-counter]').forEach((el) => {
      el.textContent = el.dataset.counter === 'engagement' ? '0.0%' : '0';
    });
  </script>
</div>
