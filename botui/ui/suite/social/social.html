<link rel="stylesheet" href="/suite/social/social.p1.css?v=1" />
<link rel="stylesheet" href="/suite/social/social.p2.css?v=1" />

<div class="gb-state gb-state-loading"><span class="gb-state-msg">Loading…</span></div>
<div class="gb-state gb-state-error"><span class="gb-state-msg">Service unavailable</span></div>
<script>
// Auto-load the feed once the app (with its main script) is injected into a
// window. Kept in its own small script tag at the top so it survives HTML
// re-parsing that can truncate the larger inline script below.
(function () {
  "use strict";
  var tries = 0;
  var timer = setInterval(function () {
    tries++;
    if (typeof window.showFeed === "function" && document.getElementById("social-content")) {
      clearInterval(timer);
      window.showFeed();
      return;
    }
    if (tries > 50) clearInterval(timer);
  }, 150);
})();
</script>

<div class="gb-app social-app" data-gb-app="social">
    <div class="social-header">
        <div class="social-tabs">
            <button
                class="social-tab active"
                data-tab="feed"
                onclick="showFeed()"
            >
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                <span data-i18n="social-feed">Feed</span>
            </button>
            <button
                class="social-tab"
                data-tab="communities"
                onclick="showCommunities()"
            >
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
                <span data-i18n="social-communities">Communities</span>
            </button>
            <button
                class="social-tab"
                data-tab="analytics"
                onclick="showAnalytics()"
            >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="20" x2="18" y2="10"/>
                    <line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
                <span data-i18n="social-analytics">Analytics</span>
            </button>
            <button
                class="social-tab"
                data-tab="announcements"
                onclick="showAnnouncements()"
            >
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <path
                        d="M22 17H2a3 3 0 0 0 3-3V9a7 7 0 0 1 14 0v5a3 3 0 0 0 3 3zm-8.27 4a2 2 0 0 1-3.46 0"
                    />
                </svg>
                <span data-i18n="social-announcements">Announcements</span>
            </button>
        </div>
        <div class="social-actions">
            <button class="btn-new-post" onclick="showNewPostModal()">
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                <span data-i18n="social-new-post">New Post</span>
            </button>
        </div>
    </div>

    <div class="social-layout">
        <aside class="social-sidebar">
            <div class="sidebar-section">
                <h3>My Communities</h3>
                <div id="my-communities">
                    <p class="empty-state">No communities yet</p>
                </div>
            </div>
            <div class="sidebar-section">
                <h3>Trending</h3>
                <div id="trending-topics">
                    <p class="empty-state">No trending topics</p>
                </div>
            </div>
            <div class="sidebar-section">
                <h3>Suggested Communities</h3>
                <div id="suggested-communities">
                    <p class="empty-state">No suggestions</p>
                </div>
            </div>
        </aside>

        <main class="social-main">
            <div class="post-composer">
                <div class="composer-avatar">
                    <div class="avatar-placeholder"></div>
                </div>
                <div class="composer-input" onclick="showNewPostModal()">
                    <span data-i18n="social-whats-on-mind">What's on your mind?</span>
                </div>
                <div class="composer-actions">
                    <button class="composer-btn" title="Add image" onclick="event.stopPropagation();showNewPostModal()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
                        </svg>
                    </button>
                    <button class="composer-btn" title="Schedule post" onclick="event.stopPropagation();showNewPostModal()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </button>
                    <button class="composer-btn" title="Analytics" onclick="event.stopPropagation();showAnalytics()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div id="social-content">
                <div class="empty-feed">
                    <p>No posts yet. Be the first to share something!</p>
                </div>
            </div>
        </main>

        <aside class="social-right-sidebar">
            <div class="sidebar-section">
                <h3>Recent Activity</h3>
                <div id="recent-activity">
                    <p class="empty-state">No recent activity</p>
                </div>
            </div>
            <div class="sidebar-section">
                <h3>People to Follow</h3>
                <div id="people-suggestions">
                    <p class="empty-state">No suggestions</p>
                </div>
            </div>
        </aside>
    </div>
</div>

<div class="modal" id="newPostModal">
    <div class="modal-backdrop" onclick="closeNewPostModal()"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h3 data-i18n="social-create-post">Create Post</h3>
            <button class="btn-close" onclick="closeNewPostModal()">
                &times;
            </button>
        </div>
        <form
            id="newPostForm"
            hx-post="/api/social/posts"
            hx-swap="none"
            hx-on::after-request="handlePostCreated(event)"
        >
            <div class="modal-body">
                <div class="post-author-row">
                    <div class="avatar-placeholder"></div>
                    <div class="author-info">
                        <span class="author-name" id="currentUserName"
                            >User</span
                        >
                        <select name="visibility" class="visibility-select">
                            <option
                                value="organization"
                                data-i18n="social-org-only"
                            >
                                Organization
                            </option>
                            <option
                                value="community"
                                data-i18n="social-community-only"
                            >
                                Community Only
                            </option>
                            <option value="public" data-i18n="social-public">
                                Public
                            </option>
                        </select>
                    </div>
                </div>
                <textarea
                    name="content"
                    class="post-textarea"
                    placeholder="What's on your mind?"
                    rows="5"
                    required
                ></textarea>
                <div class="post-attachments" id="postAttachments"></div>
                <div class="post-options">
                    <select name="community_id" class="community-select">
                        <option value="" data-i18n="social-no-community">
                            No Community
                        </option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <div class="post-tools">
                    <button type="button" class="tool-btn" title="Add image" onclick="addPostImage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
                        </svg>
                    </button>
                    <button type="button" class="tool-btn" title="Add poll" onclick="togglePollCreator()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
                        </svg>
                    </button>
                    <button type="button" class="tool-btn" title="Schedule" onclick="schedulePost()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </button>
                </div>
                <div style="display:flex;gap:8px;align-items:center">
                    <input type="datetime-local" name="scheduled_at" class="schedule-input" title="Schedule for later" style="padding:6px 8px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);font-size:12px">
                    <button type="submit" class="btn-post">Post</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script src="/suite/social/social.js"></script>
