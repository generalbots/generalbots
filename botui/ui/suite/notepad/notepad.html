<link rel="stylesheet" href="/suite/notepad/notepad.p1.css?v=1" />
<div class="gb-notepad" id="gb-notepad-root">
    <div class="gb-notepad-bar">
        <span class="gb-notepad-title">Notepad</span>
        <select id="gb-notepad-files" class="gb-notepad-select" aria-label="Note"></select>
        <button type="button" class="gb-notepad-btn" id="gb-notepad-new">New</button>
        <button type="button" class="gb-notepad-btn warn" id="gb-notepad-del">Delete</button>
    </div>
    <textarea id="gb-notepad-text" class="gb-notepad-text" spellcheck="false" placeholder="Plain notes, saved locally…"></textarea>
    <div class="gb-notepad-foot"><span id="gb-notepad-status">Saved</span></div>
</div>
<script src="/suite/notepad/notepad.js?v=1"></script>
