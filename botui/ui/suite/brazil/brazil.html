<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brazilian Tax Compliance · GB</title>
  <link rel="stylesheet" href="/suite/css/palette-tokens.css" />
<link rel="stylesheet" href="/suite/base-layout.css" />
  <link rel="stylesheet" href="/suite/brazil/brazil.css" />
  <script src="/suite/js/vendor/htmx.min.js"></script>
  <script src="/suite/js/vendor/htmx-json-enc.js"></script>
</head>
<body>
  <header class="gb-suite-header">
    <h1>Compliance Fiscal Brasileiro</h1>
  </header>

  <nav class="gb-tabs" id="tax-tabs" role="tablist" aria-label="Brazil tax sections">
    <button class="gb-tab active" role="tab" aria-selected="true" aria-controls="gb-brazil-content" data-tab-trigger="dashboard" hx-get="/suite/brazil/fragments/dashboard" hx-target="#gb-brazil-content" hx-swap="innerHTML">Visão Geral</button>
    <button class="gb-tab" role="tab" aria-selected="false" aria-controls="gb-brazil-content" data-tab-trigger="nfe" hx-get="/suite/brazil/fragments/nfe" hx-target="#gb-brazil-content" hx-swap="innerHTML">NFe</button>
    <button class="gb-tab" role="tab" aria-selected="false" aria-controls="gb-brazil-content" data-tab-trigger="nfse" hx-get="/suite/brazil/fragments/nfse" hx-target="#gb-brazil-content" hx-swap="innerHTML">NFSe</button>
    <button class="gb-tab" role="tab" aria-selected="false" aria-controls="gb-brazil-content" data-tab-trigger="cte" hx-get="/suite/brazil/fragments/cte" hx-target="#gb-brazil-content" hx-swap="innerHTML" data-i18n="brazil-tab-cte-mdfe">CTe / MDFe</button>
    <button class="gb-tab" role="tab" aria-selected="false" aria-controls="gb-brazil-content" data-tab-trigger="sped" hx-get="/suite/brazil/fragments/sped" hx-target="#gb-brazil-content" hx-swap="innerHTML" data-i18n="brazil-tab-efd-sped">EFD / SPED</button>
    <button class="gb-tab" role="tab" aria-selected="false" aria-controls="gb-brazil-content" data-tab-trigger="history" hx-get="/suite/brazil/fragments/history" hx-target="#gb-brazil-content" hx-swap="innerHTML">Histórico</button>
    <button class="gb-tab" role="tab" aria-selected="false" aria-controls="gb-validators" data-tab-trigger="validators" data-panel="validators" data-i18n="brazil-tab-validators">Validadores</button>
    <button class="gb-tab" role="tab" aria-selected="false" aria-controls="gb-brazil-content" data-tab-trigger="settings" hx-get="/suite/brazil/fragments/dashboard" hx-target="#gb-brazil-content" hx-swap="innerHTML">Configurações</button>
  </nav>

  <div class="gb-status-bar" id="gb-brazil-status" aria-live="polite">
    <span class="gb-status-item"><span class="gb-status-dot"></span><span data-i18n="brazil-sefaz-unknown">SEFAZ status: unknown (not fetched)</span></span>
    <span class="gb-status-item" data-i18n="brazil-certificate-unknown">Certificate: unknown (not verified)</span>
    <span class="gb-status-item" id="gb-brazil-status-ts" data-i18n="brazil-last-checked-never">Last checked: never</span>
  </div>

  <main id="gb-brazil-content" role="tabpanel" aria-labelledby="tax-tabs" hx-get="/suite/brazil/fragments/dashboard" hx-trigger="load delay:0" hx-swap="innerHTML">
    <p class="gb-loading" role="status" aria-live="polite" data-i18n="brazil-loading-overview">Carregando visão geral…</p>
  </main>

  <aside class="gb-validators" id="gb-validators" role="tabpanel" aria-labelledby="tax-tabs" hidden>
    <h3>Validador rápido</h3>
    <form hx-post="/api/brazil/forms/validate" hx-swap="outerHTML" hx-target="#gb-validate-result">
      <label>Tipo
        <select name="kind">
          <option value="cnpj">CNPJ</option>
          <option value="cpf">CPF</option>
          <option value="cep">CEP</option>
          <option value="nfe-key">Chave NFe</option>
        </select>
      </label>
      <label>Valor <input name="value" required></label>
      <button type="submit" class="gb-btn gb-btn-primary" data-i18n="brazil-validate">Validar</button>
    </form>
    <div id="gb-validate-result"></div>
  </aside>

  <script src="/suite/brazil/brazil.js"></script>
</body>
</html>
