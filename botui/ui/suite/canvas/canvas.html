<!-- =============================================================================
     CANVAS APP - Collaborative Whiteboard & Drawing
     Respects Theme Manager - No hardcoded theme
     ============================================================================= -->
<link rel="stylesheet" href="/suite/canvas/canvas-toolbar.css?v=3" />
<link rel="stylesheet" href="/suite/canvas/canvas-layers.css?v=3" />
<!-- The .canvas-app class makes this root the flex-row layout container.
     Partials 02/03/05/06 are swapped in as direct children: toolbar (left),
     main (center), properties (right). Modals are position:fixed and take no
     flex space. #canvas-app-root.canvas-app { flex-direction: row } in
     canvas-layers.css overrides the .gb-app column direction. -->
<div class="gb-app canvas-app canvas-root" id="canvas-app-root" data-gb-app="canvas">
    <div hx-get="/suite/canvas/partials/02_toolbar.html?v=3" hx-trigger="load" hx-swap="outerHTML"></div>
    <div hx-get="/suite/canvas/partials/03_header.html?v=3" hx-trigger="load" hx-swap="outerHTML"></div>
    <div hx-get="/suite/canvas/partials/05_properties_panel.html?v=3" hx-trigger="load" hx-swap="outerHTML"></div>
    <div hx-get="/suite/canvas/partials/06_export_modal.html?v=3" hx-trigger="load" hx-swap="outerHTML"></div>
</div>

<div class="gb-state gb-state-loading"><span class="gb-state-msg" data-i18n="auto-loading-canvas">Loading canvas…</span></div>
<div class="gb-state gb-state-error"><span class="gb-state-msg" data-i18n="auto-canvas-unavailable">Canvas unavailable</span></div>
<script src="/suite/canvas/modules/01_canvas_state_events.js"></script>
<script src="/suite/canvas/modules/02_canvas_render.js"></script>
<script src="/suite/canvas/modules/03_canvas_tools.js"></script>
<!-- #2144 — shared drawing exporter: the export path serialises the background
     layer (a DOM layer, not canvas pixels) and rasterises SVG without a
     library. -->
<script src="/suite/js/artifact-download.js?v=1"></script>
<script src="/suite/canvas/modules/04_canvas_export_api.js"></script>

<!-- =============================================================================
     PROJECT.DRAW BRIDGE (#1398)
     When the Canvas App is opened from Vibe (toolbar Canvas button), it deep-links
     with `window.__gbAppParams__.project` = the vibe project UUID. This bridge loads
     the LLM-generated architecture file `project.draw` from the project workspace
     root and persists future edits back to it, so the canvas always reflects the
     project architecture.
     ============================================================================= -->
<script src="/suite/canvas/modules/05_project_draw.js"></script>

<!-- =============================================================================
     DRIVE .DRAW BRIDGE
     When the Canvas App is opened from the Drive app (double-click a .draw
     file), the drive shell sets window.__CANVAS_FILE_BUCKET /
     window.__CANVAS_FILE_PATH (or the URL carries ?bucket=&path=). This bridge
     loads the .draw document from MinIO Drive, persists edits back to it, and
     supports creating new .draw files. Standalone canvases (no drive context)
     save by downloading a local .draw file.
     ============================================================================= -->
<script src="/suite/canvas/modules/06_drive_draw.js"></script>

<!-- =============================================================================
     SELF-HEALING
     The desktop window manager injects this HTML into an app window; the
     partials are fetched via htmx and the stylesheets via <link>. If the
     server hiccups (503) mid-load, the window can be left half-built with no
     retry. Detect missing pieces and re-request them until the canvas is
     fully mounted.
     ============================================================================= -->
<script src="/suite/canvas/modules/07_self_healing.js"></script>

<!-- =============================================================================
     LIVE CHAT DRAWINGS (#2006)
     Chat dispatches `gb:canvas-set-background` when a streamed SVG is sent to
     the canvas; this module places it in the background layer.
     ============================================================================= -->
<script src="/suite/canvas/modules/08_live_canvas.js?v=2"></script>
