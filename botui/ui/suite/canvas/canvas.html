<!-- =============================================================================
     CANVAS APP - Collaborative Whiteboard & Drawing
     Respects Theme Manager - No hardcoded theme
     ============================================================================= -->
<link rel="stylesheet" href="/suite/canvas/canvas.css" />
<div class="canvas-root" id="canvas-app-root">
    <div hx-get="./partials/01_app_open.html" hx-trigger="load" hx-swap="outerHTML"></div>
    <div hx-get="./partials/02_toolbar.html" hx-trigger="load" hx-swap="outerHTML"></div>
    <div hx-get="./partials/03_header.html" hx-trigger="load" hx-swap="outerHTML"></div>
    <div hx-get="./partials/04_canvas_container.html" hx-trigger="load" hx-swap="outerHTML"></div>
    <div hx-get="./partials/05_properties_panel.html" hx-trigger="load" hx-swap="outerHTML"></div>
    <div hx-get="./partials/06_export_modal.html" hx-trigger="load" hx-swap="outerHTML"></div>
</div>

<script>
    let currentTool = "select";
    let isDrawing = false;
    let startX, startY;
    let elements = [];
    let selectedElement = null;
    let history = [];
    let historyIndex = -1;
    let zoom = 1;
    let panX = 0,
        panY = 0;
    let strokeColor = "#000000";
    let fillColor = "#ffffff";
    let strokeWidth = 2;
    let canvas, ctx;
    let gridType = "dots";
    let snapToGrid = false;

    document.addEventListener("DOMContentLoaded", function () {
        canvas = document.getElementById("main-canvas");
        ctx = canvas.getContext("2d");
        resizeCanvas();
        drawGrid();

        window.addEventListener("resize", resizeCanvas);

        canvas.addEventListener("mousedown", handleMouseDown);
        canvas.addEventListener("mousemove", handleMouseMove);
        canvas.addEventListener("mouseup", handleMouseUp);
        canvas.addEventListener("wheel", handleWheel);
        canvas.addEventListener("contextmenu", handleContextMenu);

        document.addEventListener("keydown", handleKeyDown);
    });

    function resizeCanvas() {
        const container = document.getElementById("canvas-container");
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        redraw();
    }

    function selectTool(tool) {
        currentTool = tool;
        document.querySelectorAll(".tool-btn").forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.tool === tool);
        });

        const container = document.getElementById("canvas-container");
        switch (tool) {
            case "select":
                container.style.cursor = "default";
                break;
            case "pan":
                container.style.cursor = "grab";
                break;
            case "text":
                container.style.cursor = "text";
                break;
            default:
                container.style.cursor = "crosshair";
        }
    }

    function handleMouseDown(e) {
        const rect = canvas.getBoundingClientRect();
        startX = (e.clientX - rect.left - panX) / zoom;
        startY = (e.clientY - rect.top - panY) / zoom;
        isDrawing = true;

        if (currentTool === "select") {
            selectedElement = findElementAt(startX, startY);
            if (selectedElement) {
                showElementProperties(selectedElement);
            } else {
                hideElementProperties();
            }
        } else if (currentTool === "pan") {
            document.getElementById("canvas-container").style.cursor =
                "grabbing";
        }
    }

    function handleMouseMove(e) {
        if (!isDrawing) return;

        const rect = canvas.getBoundingClientRect();
        const currentX = (e.clientX - rect.left - panX) / zoom;
        const currentY = (e.clientY - rect.top - panY) / zoom;

        if (currentTool === "pan") {
            panX += e.movementX;
            panY += e.movementY;
            redraw();
        }
    }

    function handleMouseUp(e) {
        if (!isDrawing) return;
        isDrawing = false;

        const rect = canvas.getBoundingClientRect();
        const endX = (e.clientX - rect.left - panX) / zoom;
        const endY = (e.clientY - rect.top - panY) / zoom;

        if (currentTool === "pan") {
            document.getElementById("canvas-container").style.cursor = "grab";
            return;
        }

        if (currentTool !== "select" && currentTool !== "pan") {
            const element = {
                id: Date.now(),
                type: currentTool,
                x: Math.min(startX, endX),
                y: Math.min(startY, endY),
                width: Math.abs(endX - startX),
                height: Math.abs(endY - startY),
                stroke: strokeColor,
                fill: fillColor,
                strokeWidth: strokeWidth,
            };
            elements.push(element);
            saveHistory();
            redraw();
        }
    }

    function handleWheel(e) {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        zoom *= delta;
        zoom = Math.max(0.1, Math.min(5, zoom));
        document.getElementById("zoom-level").textContent =
            Math.round(zoom * 100) + "%";
        redraw();
    }

    function handleContextMenu(e) {
        e.preventDefault();
    }

    function handleKeyDown(e) {
        if (e.key === "Delete" && selectedElement) {
            elements = elements.filter((el) => el !== selectedElement);
            selectedElement = null;
            hideElementProperties();
            saveHistory();
            redraw();
        }
        if (e.ctrlKey && e.key === "z") {
            undo();
        }
        if (e.ctrlKey && e.key === "y") {
            redo();
        }
    }

    function drawGrid() {
        if (!ctx) return;
        ctx.save();
        ctx.strokeStyle = "var(--border-color, #e0e0e0)";
        ctx.lineWidth = 0.5;
        const gridSize = 20;

        for (let x = 0; x < canvas.width; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += gridSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }
        ctx.restore();
    }

    function redraw() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();

        ctx.save();
        ctx.translate(panX, panY);
        ctx.scale(zoom, zoom);

        elements.forEach((el) => drawElement(el));

        if (selectedElement) {
            drawSelection(selectedElement);
        }
        ctx.restore();
    }

    function drawElement(el) {
        ctx.strokeStyle = el.stroke;
        ctx.fillStyle = el.fill;
        ctx.lineWidth = el.strokeWidth;

        switch (el.type) {
            case "rectangle":
                ctx.strokeRect(el.x, el.y, el.width, el.height);
                if (el.fill !== "transparent") {
                    ctx.fillRect(el.x, el.y, el.width, el.height);
                }
                break;
            case "ellipse":
                ctx.beginPath();
                ctx.ellipse(
                    el.x + el.width / 2,
                    el.y + el.height / 2,
                    el.width / 2,
                    el.height / 2,
                    0,
                    0,
                    Math.PI * 2,
                );
                ctx.stroke();
                if (el.fill !== "transparent") ctx.fill();
                break;
            case "line":
                ctx.beginPath();
                ctx.moveTo(el.x, el.y);
                ctx.lineTo(el.x + el.width, el.y + el.height);
                ctx.stroke();
                break;
        }
    }

    function drawSelection(el) {
        ctx.strokeStyle = "#007bff";
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(el.x - 5, el.y - 5, el.width + 10, el.height + 10);
        ctx.setLineDash([]);
    }

    function findElementAt(x, y) {
        for (let i = elements.length - 1; i >= 0; i--) {
            const el = elements[i];
            if (
                x >= el.x &&
                x <= el.x + el.width &&
                y >= el.y &&
                y <= el.y + el.height
            ) {
                return el;
            }
        }
        return null;
    }

    function showElementProperties(el) {
        const panel = document.getElementById("properties-panel");
        if (panel) panel.style.display = "block";
    }

    function hideElementProperties() {
        const panel = document.getElementById("properties-panel");
        if (panel) panel.style.display = "none";
    }

    function saveHistory() {
        history = history.slice(0, historyIndex + 1);
        history.push(JSON.stringify(elements));
        historyIndex = history.length - 1;
    }

    function undo() {
        if (historyIndex > 0) {
            historyIndex--;
            elements = JSON.parse(history[historyIndex]);
            redraw();
        }
    }

    function redo() {
        if (historyIndex < history.length - 1) {
            historyIndex++;
            elements = JSON.parse(history[historyIndex]);
            redraw();
        }
    }

    function setStrokeColor(color) {
        strokeColor = color;
        if (selectedElement) {
            selectedElement.stroke = color;
            redraw();
        }
    }

    function setFillColor(color) {
        fillColor = color;
        if (selectedElement) {
            selectedElement.fill = color;
            redraw();
        }
    }

    function setStrokeWidth(width) {
        strokeWidth = parseInt(width);
        if (selectedElement) {
            selectedElement.strokeWidth = strokeWidth;
            redraw();
        }
    }

    function zoomIn() {
        zoom = Math.min(5, zoom * 1.2);
        document.getElementById("zoom-level").textContent =
            Math.round(zoom * 100) + "%";
        redraw();
    }

    function zoomOut() {
        zoom = Math.max(0.1, zoom / 1.2);
        document.getElementById("zoom-level").textContent =
            Math.round(zoom * 100) + "%";
        redraw();
    }

    function resetZoom() {
        zoom = 1;
        panX = 0;
        panY = 0;
        document.getElementById("zoom-level").textContent = "100%";
        redraw();
    }

    function clearCanvas() {
        if (confirm("Clear all elements?")) {
            elements = [];
            selectedElement = null;
            saveHistory();
            redraw();
        }
    }

    function exportCanvas() {
        const link = document.createElement("a");
        link.download = "canvas.png";
        link.href = canvas.toDataURL();
        link.click();
    }

    function saveCanvas() {
        console.log("Canvas saved");
    }

    function toggleCollaborate() {
        console.log("Collaboration toggled");
    }
</script>
