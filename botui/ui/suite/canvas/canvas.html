<!-- =============================================================================
     CANVAS APP - Collaborative Whiteboard & Drawing
     Respects Theme Manager - No hardcoded theme
     ============================================================================= -->
<link rel="stylesheet" href="/suite/canvas/canvas.p1.css?v=3" />
<link rel="stylesheet" href="/suite/canvas/canvas.p2.css?v=3" />
<!-- The .canvas-app class makes this root the flex-row layout container.
     Partials 02/03/05/06 are swapped in as direct children: toolbar (left),
     main (center), properties (right). Modals are position:fixed and take no
     flex space. #canvas-app-root.canvas-app { flex-direction: row } in
     canvas.p2.css overrides the .gb-app column direction. -->
<div class="gb-app canvas-app canvas-root" id="canvas-app-root" data-gb-app="canvas">
    <div hx-get="/suite/canvas/partials/02_toolbar.html?v=3" hx-trigger="load" hx-swap="outerHTML"></div>
    <div hx-get="/suite/canvas/partials/03_header.html?v=3" hx-trigger="load" hx-swap="outerHTML"></div>
    <div hx-get="/suite/canvas/partials/05_properties_panel.html?v=3" hx-trigger="load" hx-swap="outerHTML"></div>
    <div hx-get="/suite/canvas/partials/06_export_modal.html?v=3" hx-trigger="load" hx-swap="outerHTML"></div>
</div>

<div class="gb-state gb-state-loading"><span class="gb-state-msg">Loading canvas…</span></div>
<div class="gb-state gb-state-error"><span class="gb-state-msg">Canvas unavailable</span></div>
<script>
(function () {
    "use strict";
    let currentTool = "select";
    let isDrawing = false;
    let startX = 0,
        startY = 0;
    let points = [];
    let elements = [];
    let selectedElement = null;
    let clipboard = null;
    let history = [];
    let historyIndex = -1;
    let zoom = 1;
    let panX = 0,
        panY = 0;
    let strokeColor = "#000000";
    let fillColor = "#ffffff";
    let strokeWidth = 2;
    let fontSize = 18;
    let canvas = null,
        ctx = null;
    let gridType = "dots";
    let snapToGrid = false;
    let canvasBg = "#ffffff";

    // The app body (including the <canvas> element) arrives through HTMX
    // partial swaps that can finish AFTER DOMContentLoaded, and the desktop
    // window manager can re-inject this script on every open. Boot when the
    // canvas is actually mounted and bail when the app window is gone.
    function boot() {
        if (!document.getElementById("canvas-app-root")) return;
        canvas = document.getElementById("main-canvas");
        if (!canvas) {
            setTimeout(boot, 120);
            return;
        }
        ctx = canvas.getContext("2d");
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);
        canvas.addEventListener("mousedown", handleMouseDown);
        canvas.addEventListener("mousemove", handleMouseMove);
        canvas.addEventListener("mouseup", handleMouseUp);
        canvas.addEventListener("wheel", handleWheel);
        canvas.addEventListener("contextmenu", function (e) {
            e.preventDefault();
        });
        document.addEventListener("keydown", handleKeyDown);
    }
    boot();

    function setZoomLabel() {
        const label = document.getElementById("zoom-level");
        if (label) label.textContent = Math.round(zoom * 100) + "%";
    }

    function resizeCanvas() {
        if (!canvas) return;
        const container = document.getElementById("canvas-container");
        if (!container) return;
        canvas.width = container.clientWidth || 800;
        canvas.height = container.clientHeight || 600;
        redraw();
    }

    function selectTool(tool) {
        currentTool = tool;
        document.querySelectorAll(".tool-btn").forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.tool === tool);
        });
        const container = document.getElementById("canvas-container");
        if (container) {
            if (tool === "select") container.style.cursor = "default";
            else if (tool === "pan") container.style.cursor = "grab";
            else if (tool === "text") container.style.cursor = "text";
            else container.style.cursor = "crosshair";
        }
    }

    function canvasPoint(e) {
        const rect = canvas.getBoundingClientRect();
        let x = (e.clientX - rect.left - panX) / zoom;
        let y = (e.clientY - rect.top - panY) / zoom;
        if (snapToGrid) {
            x = Math.round(x / 20) * 20;
            y = Math.round(y / 20) * 20;
        }
        return { x, y };
    }

    function handleMouseDown(e) {
        if (e.button !== 0) return;
        const p = canvasPoint(e);
        startX = p.x;
        startY = p.y;
        points = [{ x: startX, y: startY }];
        isDrawing = true;
        if (currentTool === "select") {
            selectedElement = findElementAt(startX, startY);
            showElementProperties(selectedElement);
        } else if (currentTool === "pan") {
            document.getElementById("canvas-container").style.cursor =
                "grabbing";
        }
    }

    function handleMouseMove(e) {
        if (!isDrawing || !canvas) return;
        const p = canvasPoint(e);
        if (currentTool === "pan") {
            panX += e.movementX;
            panY += e.movementY;
            redraw();
        } else if (currentTool === "pencil" || currentTool === "brush" || currentTool === "eraser") {
            points.push(p);
            redraw();
        } else if (currentTool === "select" && selectedElement) {
            selectedElement.x = p.x - (startX - selectedElement.x);
            selectedElement.y = p.y - (startY - selectedElement.y);
            redraw();
        }
    }

    function handleMouseUp(e) {
        if (!isDrawing) return;
        isDrawing = false;
        const p = canvasPoint(e);
        const endX = p.x;
        const endY = p.y;

        if (currentTool === "pan") {
            document.getElementById("canvas-container").style.cursor = "grab";
            return;
        }
        if (currentTool === "select") return;

        const base = {
            id: Date.now(),
            stroke: strokeColor,
            fill: fillColor,
            strokeWidth: strokeWidth,
            rotation: 0,
            opacity: 1,
        };
        let element = null;

        if (currentTool === "pencil" || currentTool === "brush" || currentTool === "eraser") {
            points.push({ x: endX, y: endY });
            element = Object.assign({}, base, {
                type: currentTool,
                points: points.slice(),
                x: startX,
                y: startY,
                width: 0,
                height: 0,
            });
        } else if (currentTool === "text") {
            const text = window.prompt("Text content:", "");
            if (text === null || text === "") return;
            element = Object.assign({}, base, {
                type: "text",
                text: text,
                fontSize: fontSize,
                x: startX,
                y: startY,
                width: text.length * fontSize * 0.6,
                height: fontSize * 1.4,
            });
        } else if (currentTool === "image") {
            pickImage(function (img) {
                if (!img) return;
                const w = img.width || 160;
                const h = img.height || 120;
                elements.push(
                    Object.assign({}, base, {
                        type: "image",
                        img: img,
                        x: startX,
                        y: startY,
                        width: w,
                        height: h,
                    })
                );
                saveHistory();
                redraw();
            });
            return;
        } else {
            element = Object.assign({}, base, {
                type: currentTool,
                x: Math.min(startX, endX),
                y: Math.min(startY, endY),
                width: Math.abs(endX - startX),
                height: Math.abs(endY - startY),
            });
        }

        if (element) {
            elements.push(element);
            saveHistory();
            redraw();
        }
    }

    function pickImage(done) {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.onchange = function () {
            const file = input.files && input.files[0];
            if (!file) {
                done(null);
                return;
            }
            const reader = new FileReader();
            reader.onload = function () {
                const img = new Image();
                img.onload = function () {
                    done(img);
                };
                img.onerror = function () {
                    done(null);
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        };
        input.click();
    }

    function handleWheel(e) {
        if (!canvas) return;
        e.preventDefault();
        zoom = Math.max(0.1, Math.min(5, zoom * (e.deltaY > 0 ? 0.9 : 1.1)));
        setZoomLabel();
        redraw();
    }

    function handleKeyDown(e) {
        if (e.key === "Delete" && selectedElement) {
            deleteSelected();
        }
        if (e.ctrlKey && e.key === "z") undo();
        if (e.ctrlKey && e.key === "y") redo();
        if (e.ctrlKey && e.key === "c" && selectedElement) copySelected();
        if (e.ctrlKey && e.key === "v") pasteClipboard();
        if (e.ctrlKey && e.key === "d" && selectedElement) duplicateSelected();
        if (e.ctrlKey && e.key.toLowerCase() === "s") {
            e.preventDefault();
            if (typeof window.saveCanvas === "function") window.saveCanvas();
        }
        if (e.ctrlKey && e.key.toLowerCase() === "n") {
            e.preventDefault();
            if (typeof window.newCanvas === "function") window.newCanvas();
        }
    }

    function drawGrid() {
        if (!ctx) return;
        ctx.save();
        ctx.strokeStyle = "var(--border-color, #d1d5db)";
        ctx.lineWidth = 0.5;
        const gridSize = 20;
        if (gridType === "dots") {
            ctx.fillStyle = "var(--border-color, #d1d5db)";
            for (let x = 0; x < canvas.width; x += gridSize) {
                for (let y = 0; y < canvas.height; y += gridSize) {
                    ctx.fillRect(x, y, 1, 1);
                }
            }
        } else if (gridType === "lines" || gridType === "squares") {
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        ctx.restore();
    }

    function redraw() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = canvasBg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawGrid();
        ctx.save();
        ctx.translate(panX, panY);
        ctx.scale(zoom, zoom);
        elements.forEach(function (el) {
            drawElement(el);
        });
        if (currentTool === "pencil" || currentTool === "brush" || currentTool === "eraser") {
            drawInProgress();
        }
        if (selectedElement) drawSelection(selectedElement);
        ctx.restore();
    }

    function drawInProgress() {
        if (!ctx || points.length < 2) return;
        ctx.save();
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = currentTool === "eraser" ? strokeWidth * 4 : strokeWidth;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        if (currentTool === "eraser") ctx.globalCompositeOperation = "destination-out";
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();
        ctx.restore();
    }

    function drawElement(el) {
        ctx.save();
        ctx.globalAlpha = el.opacity == null ? 1 : el.opacity;
        ctx.translate(el.x + el.width / 2, el.y + el.height / 2);
        ctx.rotate(((el.rotation || 0) * Math.PI) / 180);
        ctx.translate(-(el.x + el.width / 2), -(el.y + el.height / 2));
        ctx.strokeStyle = el.stroke;
        ctx.fillStyle = el.fill;
        ctx.lineWidth = el.strokeWidth || 2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        switch (el.type) {
            case "rectangle":
                ctx.strokeRect(el.x, el.y, el.width, el.height);
                if (el.fill && el.fill !== "transparent") {
                    ctx.fillRect(el.x, el.y, el.width, el.height);
                }
                break;
            case "ellipse":
                ctx.beginPath();
                ctx.ellipse(
                    el.x + el.width / 2,
                    el.y + el.height / 2,
                    el.width / 2,
                    el.height / 2,
                    0,
                    0,
                    Math.PI * 2
                );
                ctx.stroke();
                if (el.fill && el.fill !== "transparent") ctx.fill();
                break;
            case "line":
            case "arrow":
            case "connector":
                ctx.beginPath();
                ctx.moveTo(el.x, el.y);
                if (el.type === "connector") {
                    ctx.bezierCurveTo(
                        el.x + el.width / 2,
                        el.y,
                        el.x + el.width / 2,
                        el.y + el.height,
                        el.x + el.width,
                        el.y + el.height
                    );
                } else {
                    ctx.lineTo(el.x + el.width, el.y + el.height);
                }
                ctx.stroke();
                if (el.type === "arrow") {
                    const angle = Math.atan2(el.height, el.width);
                    const head = Math.max(8, el.strokeWidth * 3);
                    ctx.beginPath();
                    ctx.moveTo(el.x + el.width, el.y + el.height);
                    ctx.lineTo(
                        el.x + el.width - head * Math.cos(angle - Math.PI / 6),
                        el.y + el.height - head * Math.sin(angle - Math.PI / 6)
                    );
                    ctx.moveTo(el.x + el.width, el.y + el.height);
                    ctx.lineTo(
                        el.x + el.width - head * Math.cos(angle + Math.PI / 6),
                        el.y + el.height - head * Math.sin(angle + Math.PI / 6)
                    );
                    ctx.stroke();
                }
                break;
            case "pencil":
            case "brush":
            case "eraser":
                if (!el.points || el.points.length < 2) break;
                if (el.type === "eraser") ctx.globalCompositeOperation = "destination-out";
                ctx.beginPath();
                ctx.moveTo(el.points[0].x, el.points[0].y);
                for (let i = 1; i < el.points.length; i++) {
                    ctx.lineTo(el.points[i].x, el.points[i].y);
                }
                ctx.stroke();
                break;
            case "text":
                ctx.fillStyle = el.stroke;
                ctx.font = (el.fontSize || 18) + "px Inter, sans-serif";
                ctx.fillText(el.text || "", el.x, el.y + (el.fontSize || 18));
                break;
            case "sticky":
                ctx.fillStyle = "#fff9c4";
                ctx.fillRect(el.x, el.y, el.width, el.height);
                ctx.strokeRect(el.x, el.y, el.width, el.height);
                ctx.fillStyle = "#5b5700";
                ctx.font = "14px Inter, sans-serif";
                ctx.fillText(el.text || "", el.x + 6, el.y + 20);
                break;
            case "frame":
                ctx.setLineDash([6, 4]);
                ctx.strokeRect(el.x, el.y, el.width, el.height);
                ctx.setLineDash([]);
                ctx.fillStyle = el.stroke;
                ctx.font = "12px Inter, sans-serif";
                ctx.fillText(el.text || "Frame", el.x + 4, el.y - 4);
                break;
            case "image":
                if (el.img && el.img.complete) {
                    ctx.drawImage(el.img, el.x, el.y, el.width, el.height);
                } else {
                    ctx.strokeRect(el.x, el.y, el.width, el.height);
                }
                break;
        }
        ctx.restore();
    }

    function drawSelection(el) {
        ctx.strokeStyle = "#007bff";
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(el.x - 5, el.y - 5, el.width + 10, el.height + 10);
        ctx.setLineDash([]);
    }

    function findElementAt(x, y) {
        for (let i = elements.length - 1; i >= 0; i--) {
            const el = elements[i];
            if (
                x >= el.x - 5 &&
                x <= el.x + el.width + 5 &&
                y >= el.y - 5 &&
                y <= el.y + el.height + 5
            ) {
                return el;
            }
        }
        return null;
    }

    function showElementProperties(el) {
        const panel = document.getElementById("element-properties");
        if (!panel) return;
        panel.classList.toggle("hidden", !el);
        if (!el) return;
        const set = function (id, val) {
            const input = document.getElementById(id);
            if (input) input.value = val;
        };
        set("prop-x", Math.round(el.x));
        set("prop-y", Math.round(el.y));
        set("prop-width", Math.round(el.width));
        set("prop-height", Math.round(el.height));
        set("prop-rotation", el.rotation || 0);
        set("prop-opacity", Math.round((el.opacity == null ? 1 : el.opacity) * 100));
        set("prop-stroke", el.stroke || "#000000");
        set("prop-fill", el.fill || "#ffffff");
    }

    function hideElementProperties() {
        const panel = document.getElementById("element-properties");
        if (panel) panel.classList.add("hidden");
    }

    function saveHistory() {
        history = history.slice(0, historyIndex + 1);
        history.push(JSON.stringify(elements));
        historyIndex = history.length - 1;
    }

    function undo() {
        if (historyIndex > 0) {
            historyIndex--;
            elements = JSON.parse(history[historyIndex]);
            selectedElement = null;
            redraw();
        }
    }

    function redo() {
        if (historyIndex < history.length - 1) {
            historyIndex++;
            elements = JSON.parse(history[historyIndex]);
            redraw();
        }
    }

    function setStrokeColor(color) {
        strokeColor = color;
        if (selectedElement) {
            selectedElement.stroke = color;
            saveHistory();
            redraw();
        }
    }

    function setFillColor(color) {
        fillColor = color;
        if (selectedElement) {
            selectedElement.fill = color;
            saveHistory();
            redraw();
        }
    }

    function setStrokeWidth(width) {
        strokeWidth = parseInt(width) || 2;
        if (selectedElement) {
            selectedElement.strokeWidth = strokeWidth;
            saveHistory();
            redraw();
        }
    }

    function zoomIn() {
        zoom = Math.min(5, zoom * 1.2);
        setZoomLabel();
        redraw();
    }

    function zoomOut() {
        zoom = Math.max(0.1, zoom / 1.2);
        setZoomLabel();
        redraw();
    }

    function resetZoom() {
        zoom = 1;
        panX = 0;
        panY = 0;
        setZoomLabel();
        redraw();
    }

    function fitToScreen() {
        resetZoom();
    }

    function clearCanvas() {
        if (elements.length && window.confirm("Clear all elements?")) {
            elements = [];
            selectedElement = null;
            saveHistory();
            redraw();
        }
    }

    function copySelected() {
        if (!selectedElement) return;
        clipboard = JSON.parse(JSON.stringify(selectedElement));
    }

    function duplicateSelected() {
        if (!selectedElement) return;
        const copy = JSON.parse(JSON.stringify(selectedElement));
        copy.id = Date.now();
        copy.x += 20;
        copy.y += 20;
        elements.push(copy);
        selectedElement = copy;
        saveHistory();
        redraw();
    }

    function pasteClipboard() {
        if (!clipboard) return;
        const copy = JSON.parse(JSON.stringify(clipboard));
        copy.id = Date.now();
        copy.x += 20;
        copy.y += 20;
        elements.push(copy);
        selectedElement = copy;
        saveHistory();
        redraw();
    }

    function deleteSelected() {
        if (!selectedElement) return;
        elements = elements.filter(function (el) {
            return el !== selectedElement;
        });
        selectedElement = null;
        hideElementProperties();
        saveHistory();
        redraw();
    }

    function addLayer() {
        const list = document.getElementById("layers-list");
        if (!list) return;
        const item = document.createElement("div");
        item.className = "layer-item";
        item.innerHTML =
            '<span class="layer-visibility">👁️</span><span class="layer-name">Layer ' +
            (list.children.length + 1) +
            "</span><span class=\"layer-lock\">🔓</span>";
        list.appendChild(item);
    }

    function bringToFront() {
        if (!selectedElement) return;
        elements = elements.filter(function (el) {
            return el !== selectedElement;
        });
        elements.push(selectedElement);
        saveHistory();
        redraw();
    }

    function sendToBack() {
        if (!selectedElement) return;
        elements = elements.filter(function (el) {
            return el !== selectedElement;
        });
        elements.unshift(selectedElement);
        saveHistory();
        redraw();
    }

    function togglePropertiesPanel() {
        const panel = document.getElementById("properties-panel");
        if (panel) panel.classList.toggle("collapsed");
    }

    function toggleSnapToGrid(enabled) {
        snapToGrid = !!enabled;
        const checkbox = document.getElementById("snap-grid");
        if (checkbox) checkbox.checked = snapToGrid;
    }

    function setGridType(type) {
        gridType = type || "none";
        redraw();
    }

    function setCanvasBackground(color) {
        canvasBg = color || "#ffffff";
        const picker = document.getElementById("canvas-bg");
        if (picker) picker.value = canvasBg;
        redraw();
    }

    function updateElementProperty(prop, value) {
        if (!selectedElement) return;
        const el = selectedElement;
        if (prop === "strokeColor") el.stroke = value;
        else if (prop === "fillColor") el.fill = value;
        else if (prop === "opacity") el.opacity = parseInt(value) / 100;
        else if (prop === "rotation") el.rotation = parseInt(value) || 0;
        else if (prop === "width" || prop === "height" || prop === "x" || prop === "y") {
            el[prop] = parseInt(value) || 0;
        }
        saveHistory();
        redraw();
    }

    function renameCanvas(name) {
        const input = document.getElementById("canvas-name");
        if (input && name) input.value = name;
        const status = document.getElementById("save-status");
        if (status) status.textContent = "Saved";
    }

    function exportCanvas() {
        const modal = document.getElementById("export-modal");
        if (modal) modal.classList.remove("hidden");
    }

    function closeExportModal() {
        const modal = document.getElementById("export-modal");
        if (modal) modal.classList.add("hidden");
    }

    function doExport() {
        const format = (document.getElementById("export-format") || {}).value || "png";
        const scale = parseInt((document.getElementById("export-scale") || {}).value || "2");
        const bg = (document.getElementById("export-bg") || {}).checked;
        const name = (document.getElementById("canvas-name") || {}).value || "canvas";

        if (format === "png") {
            const out = document.createElement("canvas");
            out.width = canvas.width * scale;
            out.height = canvas.height * scale;
            const outCtx = out.getContext("2d");
            if (bg) {
                outCtx.fillStyle = canvasBg;
                outCtx.fillRect(0, 0, out.width, out.height);
            }
            outCtx.save();
            outCtx.scale(scale, scale);
            outCtx.drawImage(canvas, 0, 0);
            outCtx.restore();
            const link = document.createElement("a");
            link.download = name + ".png";
            link.href = out.toDataURL("image/png");
            link.click();
        } else if (format === "json") {
            const blob = new Blob([JSON.stringify({ elements: elements, zoom: zoom, panX: panX, panY: panY })], {
                type: "application/json",
            });
            const link = document.createElement("a");
            link.download = name + ".json";
            link.href = URL.createObjectURL(blob);
            link.click();
        } else {
            window.alert(
                format.toUpperCase() + " export requires a vectorizer; use PNG or JSON."
            );
        }
        closeExportModal();
    }

    function saveCanvas() {
        const status = document.getElementById("save-status");
        if (status) status.textContent = "Saved ✓";
        doExport();
    }

    function shareCanvas() {
        const url = window.location.href.split("?")[0] + "?tool=canvas";
        try {
            navigator.clipboard
                .writeText(url)
                .then(function () {
                    window.alert("Share link copied to clipboard");
                })
                .catch(function () {
                    window.alert("Share link: " + url);
                });
        } catch (ignore) {
            window.alert("Share link: " + url);
        }
    }

    function toggleCollaborate() {
        window.alert(
            "Real-time collaboration needs a canvas session; open the Vibe or Docs app to collaborate live."
        );
    }

    // Expose the API to the toolbar/properties/export partials, which the
    // desktop window manager injects as plain HTML with inline on* handlers.
    window._canvasApp = {
        selectTool: selectTool,
        setStrokeColor: setStrokeColor,
        setFillColor: setFillColor,
        setStrokeWidth: setStrokeWidth,
        setGridType: setGridType,
        setCanvasBackground: setCanvasBackground,
        setCanvasBackgroundHidden: function () {
            canvasBg = "transparent";
            redraw();
        },
        toggleSnapToGrid: toggleSnapToGrid,
        updateElementProperty: updateElementProperty,
        clearCanvas: clearCanvas,
        undo: undo,
        redo: redo,
        zoomIn: zoomIn,
        zoomOut: zoomOut,
        resetZoom: resetZoom,
        fitToScreen: fitToScreen,
        exportCanvas: exportCanvas,
        closeExportModal: closeExportModal,
        doExport: doExport,
        saveCanvas: saveCanvas,
        shareCanvas: shareCanvas,
        toggleCollaborate: toggleCollaborate,
        togglePropertiesPanel: togglePropertiesPanel,
        copySelected: copySelected,
        pasteClipboard: pasteClipboard,
        duplicateSelected: duplicateSelected,
        deleteSelected: deleteSelected,
        addLayer: addLayer,
        bringToFront: bringToFront,
        sendToBack: sendToBack,
        renameCanvas: renameCanvas,
        getCanvasElements: function () { return elements; },
        setCanvasElements: function (arr) {
            elements = Array.isArray(arr) ? arr : [];
            saveHistory();
            redraw();
        },
        appendCanvasElements: function (arr) {
            if (Array.isArray(arr)) arr.forEach(function (el) { elements.push(el); });
            saveHistory();
            redraw();
        },
        canvasSaveMethods: { saveCanvas: saveCanvas, clearCanvas: clearCanvas, undo: undo, redo: redo },
    };
    Object.assign(window, window._canvasApp);
})();
</script>

<!-- =============================================================================
     PROJECT.DRAW BRIDGE (#1398)
     When the Canvas App is opened from Vibe (toolbar Canvas button), it deep-links
     with `window.__gbAppParams__.project` = the vibe project UUID. This bridge loads
     the LLM-generated architecture file `project.draw` from the project workspace
     root and persists future edits back to it, so the canvas always reflects the
     project architecture.
     ============================================================================= -->
<script>
(function () {
    "use strict";

    function currentProjectId() {
        var p = window.__gbAppParams__ || {};
        var qs = new URLSearchParams(window.location.search);
        return p.project || qs.get("project") || "";
    }

    // JSON POST helper consistent with the rest of the suite.
    function api(url, opts) {
        opts = opts || {};
        var headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
        // Bearer token so the project-files endpoints accept the read/write.
        var token = "";
        if (window.getGBAccessToken) { token = window.getGBAccessToken() || ""; }
        if (!token) token = window.localStorage.getItem("gb-access-token") || "";
        if (!token) token = window.sessionStorage.getItem("gb-access-token") || "";
        if (window.GB_TOKEN) token = window.GB_TOKEN;
        if (token) headers["Authorization"] = "Bearer " + token;
        return fetch(url, {
            method: opts.method || "GET",
            headers: headers,
            body: opts.body || undefined,
        }).then(function (r) { return r.json(); });
    }

    // Map a project.draw design element to the canvas-app element shape.
    function canvasElement(designEl) {
        var el = designEl || {};
        var w = el.w || el.width || 160;
        var h = el.h || el.height || 90;
        var elem = {
            id: el.id || Date.now() + Math.floor(Math.random() * 10000),
            type: el.type || "rectangle",
            x: el.x || 0,
            y: el.y || 0,
            width: w,
            height: h,
            stroke: "#0f172a",
            fill: el.text ? "#e0f2fe" : "transparent",
            strokeWidth: 2,
        };
        if (el.text) { elem.text = el.text; elem.type = "text"; }
        return elem;
    }

    function loadProjectDraw() {
        var pid = currentProjectId();
        if (!pid || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(pid)) return;
        api("/api/vibe/projects/" + encodeURIComponent(pid) +
            "/files/content?path=" + encodeURIComponent("project.draw"))
            .then(function (d) {
                if (!d || !d.content) return;
                var parsed;
                try { parsed = JSON.parse(d.content); } catch (e) { return; }
                // Render the LLM-generated architecture SVG as a non-interactive
                // background so the user sees the diagram and can draw on top of
                // it; the interactive canvas sits transparent above it.
                var bg = document.getElementById("canvas-bg-svg");
                if (parsed.generated && parsed.generated.svg) {
                    if (bg) bg.innerHTML = parsed.generated.svg;
                    var app = window._canvasApp;
                    if (app && typeof app.setCanvasBackgroundHidden === "function") {
                        app.setCanvasBackgroundHidden();
                    }
                }
                var name = document.getElementById("canvas-name");
                if (name) name.value = (parsed.title || "project") + " · project.draw";

                var items = Array.isArray(parsed.elements) ? parsed.elements : [];
                if (!items.length) return;
                // Push saved design elements into the live canvas via the app API.
                var app = window._canvasApp;
                if (app && typeof app.appendCanvasElements === "function") {
                    app.appendCanvasElements(items.map(canvasElement));
                }
            })
            .catch(function () { /* no project.draw yet — blank canvas */ });
    }

    // Persist current elements back to project.draw at the project root.
    function saveProjectDraw() {
        var pid = currentProjectId();
        if (!pid || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(pid)) return;
        var app = window._canvasApp;
        var els = app && typeof app.getCanvasElements === "function" ? app.getCanvasElements() : [];
        var designElements = els.map(function (el) {
            return {
                id: el.id,
                type: el.type === "text" ? "text" : "rectangle",
                x: Math.round(el.x),
                y: Math.round(el.y),
                w: Math.round(el.width),
                h: Math.round(el.height),
                text: el.text || undefined,
            };
        });
        var content = {
            kind: "vibe-design",
            version: 2,
            title: "project",
            elements: designElements,
            connectors: [],
            generated: null,
        };
        api("/api/vibe/projects/" + encodeURIComponent(pid) + "/files", {
            method: "POST",
            body: JSON.stringify({ path: "project.draw", content: JSON.stringify(content, null, 2) }),
        })
            .then(function () {
                var status = document.getElementById("save-status");
                if (status) status.textContent = "Saved · project.draw ✓";
            })
            .catch(function () {
                var status = document.getElementById("save-status");
                if (status) status.textContent = "Saved (local)";
            });
    }

    // Bridge into the native canvas app: after boot + load, sync the drawn
    // elements to project.draw on every save/undo/redo/clear.
    var origSave = window._canvasApp && window._canvasApp.saveCanvas;
    var origClear = window._canvasApp && window._canvasApp.clearCanvas;
    var origUndo = window._canvasApp && window._canvasApp.undo;
    var origRedo = window._canvasApp && window._canvasApp.redo;

    function syncSave() {
        if (origSave) origSave();
        saveProjectDraw();
    }
    function syncClear() {
        if (origClear) origClear();
        saveProjectDraw();
    }
    function syncUndo() {
        if (origUndo) origUndo();
        saveProjectDraw();
    }
    function syncRedo() {
        if (origRedo) origRedo();
        saveProjectDraw();
    }
    if (window._canvasApp) {
        window._canvasApp.saveCanvas = syncSave;
        window._canvasApp.clearCanvas = syncClear;
        window._canvasApp.undo = syncUndo;
        window._canvasApp.redo = syncRedo;
        Object.assign(window, {
            saveCanvas: syncSave,
            clearCanvas: syncClear,
            undo: syncUndo,
            redo: syncRedo,
        });
        window.saveProjectDraw = saveProjectDraw;
    }

    // Boot once the canvas is mounted.
    (function waitBoot() {
        if (document.getElementById("main-canvas")) {
            loadProjectDraw();
        } else {
            setTimeout(waitBoot, 150);
        }
    })();
})();
</script>

<!-- =============================================================================
     DRIVE .DRAW BRIDGE
     When the Canvas App is opened from the Drive app (double-click a .draw
     file), the drive shell sets window.__CANVAS_FILE_BUCKET /
     window.__CANVAS_FILE_PATH (or the URL carries ?bucket=&path=). This bridge
     loads the .draw document from MinIO Drive, persists edits back to it, and
     supports creating new .draw files. Standalone canvases (no drive context)
     save by downloading a local .draw file.
     ============================================================================= -->
<script>
(function () {
    "use strict";

    function currentCanvasFile() {
        var p = window.__CANVAS_FILE_PATH || "";
        var b = window.__CANVAS_FILE_BUCKET || "";
        var s = window.__CANVAS_FILE_SCOPE || "bot";
        if (!p || !b) {
            var qs = new URLSearchParams(window.location.search);
            if (!p) p = qs.get("path") || "";
            if (!b) b = qs.get("bucket") || "";
        }
        var folder = window.__CANVAS_FOLDER;
        if (folder === undefined && p) {
            folder = p.indexOf("/") === -1 ? "" : p.substring(0, p.lastIndexOf("/"));
        }
        return {
            path: p,
            bucket: b,
            scope: s,
            folder: folder || "",
            name: p ? p.split("/").pop() : "",
        };
    }

    function driveFileOpen() {
        var f = currentCanvasFile();
        return !!f.bucket && !!f.path;
    }

    function api(url, opts) {
        opts = opts || {};
        var headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
        var token = "";
        if (window.getGBAccessToken) token = window.getGBAccessToken() || "";
        if (!token) token = window.localStorage.getItem("gb-access-token") || "";
        if (!token) token = window.sessionStorage.getItem("gb-access-token") || "";
        if (window.GB_TOKEN) token = window.GB_TOKEN;
        if (token) headers["Authorization"] = "Bearer " + token;
        return fetch(url, {
            method: opts.method || "GET",
            headers: headers,
            body: opts.body || undefined,
        }).then(function (r) { return r.json(); });
    }

    function setStatus(text) {
        var status = document.getElementById("save-status");
        if (status) status.textContent = text;
    }

    // Normalize any element shape (full canvas element, or legacy
    // vibe-design {type,x,y,w,h,text}) into a drawable canvas element.
    function toCanvasElement(el) {
        if (!el) return null;
        var copy = Object.assign({}, el);
        delete copy.img; // HTMLImageElement is not JSON-serializable
        if (copy.width !== undefined || copy.type === "text" || copy.points) {
            if (copy.type === "text") copy.fontSize = copy.fontSize || 18;
            if (!copy.stroke) copy.stroke = "#000000";
            if (!copy.strokeWidth) copy.strokeWidth = 2;
            if (copy.id === undefined) copy.id = Date.now() + Math.floor(Math.random() * 10000);
            return copy;
        }
        // Legacy design element
        var w = el.w || el.width || 160;
        var h = el.h || el.height || 90;
        var elem = {
            id: el.id || Date.now() + Math.floor(Math.random() * 10000),
            type: el.type || "rectangle",
            x: el.x || 0,
            y: el.y || 0,
            width: w,
            height: h,
            stroke: "#0f172a",
            fill: el.text ? "#e0f2fe" : "transparent",
            strokeWidth: 2,
        };
        if (el.text) { elem.text = el.text; elem.type = "text"; }
        return elem;
    }

    function serializeElements(els) {
        var keys = ["id", "type", "x", "y", "width", "height", "stroke", "fill", "strokeWidth", "rotation", "opacity", "fontSize", "text", "points"];
        return (els || []).map(function (el) {
            var copy = {};
            keys.forEach(function (k) {
                if (el[k] !== undefined) copy[k] = el[k];
            });
            return copy;
        });
    }

    function canvasTitle() {
        var el = document.getElementById("canvas-name");
        var t = ((el && el.value) || "Untitled Canvas").trim();
        return t.replace(/\.draw$/i, "");
    }

    function loadDriveDraw() {
        var f = currentCanvasFile();
        if (!f.bucket || !f.path) return;
        api("/api/files/download", {
            method: "POST",
            body: JSON.stringify({ bucket: f.bucket, path: f.path, scope: f.scope }),
        })
            .then(function (d) {
                if (!d || !d.content) return;
                var text;
                try { text = atob(d.content); } catch (e) { return; }
                var parsed;
                try { parsed = JSON.parse(text); } catch (e) { return; }
                var items = Array.isArray(parsed.elements) ? parsed.elements : [];
                var app = window._canvasApp;
                if (app && typeof app.setCanvasElements === "function") {
                    app.setCanvasElements(items.map(toCanvasElement).filter(Boolean));
                }
                // LLM-generated architecture background (vibe-style .draw)
                if (parsed.generated && parsed.generated.svg) {
                    var bg = document.getElementById("canvas-bg-svg");
                    if (bg) bg.innerHTML = parsed.generated.svg;
                    if (app && typeof app.setCanvasBackgroundHidden === "function") {
                        app.setCanvasBackgroundHidden();
                    }
                }
                var nameEl = document.getElementById("canvas-name");
                if (nameEl) nameEl.value = parsed.title || f.name.replace(/\.draw$/i, "");
                setStatus("Loaded · " + f.name);
            })
            .catch(function () { /* file missing — blank canvas */ });
    }

    // Write the current elements back to a .draw file on the drive (or
    // download a local .draw when there is no drive context).
    function saveDriveDraw() {
        var f = currentCanvasFile();
        var app = window._canvasApp;
        var els = app && typeof app.getCanvasElements === "function" ? app.getCanvasElements() : [];
        var content = JSON.stringify({
            kind: "canvas-draw",
            version: 2,
            title: canvasTitle(),
            elements: serializeElements(els),
            connectors: [],
            generated: null,
        }, null, 2);

        var name = canvasTitle();
        if (!f.bucket) {
            // Standalone canvas: download a local .draw file.
            var blob = new Blob([content], { type: "application/json" });
            var link = document.createElement("a");
            link.download = name + ".draw";
            link.href = URL.createObjectURL(blob);
            link.click();
            setTimeout(function () { URL.revokeObjectURL(link.href); }, 4000);
            setStatus("Saved (download)");
            return;
        }

        var path = f.path;
        if (!path) {
            // New file: derive a fresh .draw path inside the launch folder.
            var safeName = name.replace(/[\/\\?%*:|"<>]/g, "-").replace(/\.draw$/i, "") + ".draw";
            path = f.folder ? f.folder + "/" + safeName : safeName;
            window.__CANVAS_FILE_PATH = path;
        }

        api("/api/files/write", {
            method: "POST",
            body: JSON.stringify({
                bucket: f.bucket,
                path: path,
                content: btoa(content),
                scope: f.scope,
            }),
        })
            .then(function () {
                setStatus("Saved · " + path.split("/").pop() + " ✓");
            })
            .catch(function () {
                setStatus("Save failed");
            });
    }

    // Reset the board to a blank canvas; the next Save creates a new .draw
    // file (same folder when launched from Drive, local download otherwise).
    function newCanvas() {
        var app = window._canvasApp;
        if (app && typeof app.setCanvasElements === "function") app.setCanvasElements([]);
        var nameEl = document.getElementById("canvas-name");
        if (nameEl) nameEl.value = "Untitled Canvas";
        window.__CANVAS_FILE_PATH = "";
        setStatus("New canvas — press Save");
    }

    // Drive-aware save dispatch: Drive file → write .draw to Drive; Vibe
    // project → project.draw; otherwise → download a local .draw.
    var prevClear = window._canvasApp && window._canvasApp.clearCanvas;
    var prevUndo = window._canvasApp && window._canvasApp.undo;
    var prevRedo = window._canvasApp && window._canvasApp.redo;

    function driveSync(fn) {
        return function () {
            var r = fn ? fn.apply(this, arguments) : undefined;
            if (driveFileOpen()) saveDriveDraw();
            return r;
        };
    }

    function hasVibeProject() {
        var p = (window.__gbAppParams__ || {}).project;
        if (!p) {
            try { p = new URLSearchParams(window.location.search).get("project"); } catch (e) { p = null; }
        }
        return !!p;
    }

    function saveCanvasDispatch() {
        if (driveFileOpen()) { saveDriveDraw(); return; }
        if (hasVibeProject() && window.saveProjectDraw) { window.saveProjectDraw(); return; }
        saveDriveDraw(); // standalone — downloads .draw
    }

    if (window._canvasApp) {
        window._canvasApp.saveCanvas = saveCanvasDispatch;
        window._canvasApp.clearCanvas = driveSync(prevClear);
        window._canvasApp.undo = driveSync(prevUndo);
        window._canvasApp.redo = driveSync(prevRedo);
        window._canvasApp.newCanvas = newCanvas;
    }
    window.saveCanvas = saveCanvasDispatch;
    window.newCanvas = newCanvas;

    // Boot once the canvas is mounted.
    (function waitBoot() {
        if (document.getElementById("main-canvas")) {
            loadDriveDraw();
        } else {
            setTimeout(waitBoot, 150);
        }
    })();
})();
</script>

<!-- =============================================================================
     SELF-HEALING
     The desktop window manager injects this HTML into an app window; the
     partials are fetched via htmx and the stylesheets via <link>. If the
     server hiccups (503) mid-load, the window can be left half-built with no
     retry. Detect missing pieces and re-request them until the canvas is
     fully mounted.
     ============================================================================= -->
<script>
(function () {
    "use strict";

    var MAX_FAST_ATTEMPTS = 6; // ~9s of eager retrying every 1.5s
    var attempts = 0;
    var slow = false;

    // Capture the expected stylesheet URLs while the <link>s are still in the
    // DOM so a missing/broken link can be recreated with the same version.
    var EXPECTED_CSS = Array.from(document.querySelectorAll('link[href*="/suite/canvas/canvas.p"]'))
        .map(function (l) { return l.href; });

    function canvasRootGone() {
        return !document.getElementById("canvas-app-root");
    }

    function canvasFullyMounted() {
        return !!document.getElementById("main-canvas")
            && !!document.querySelector(".canvas-toolbar")
            && !!document.querySelector(".canvas-main")
            && !!document.querySelector(".properties-panel")
            && !!document.getElementById("export-modal");
    }

    function cssLoaded() {
        var links = Array.from(document.querySelectorAll('link[href*="canvas.p"]'));
        return links.length > 0 && links.every(function (l) { return l.sheet; });
    }

    // A placeholder that never got swapped (htmx failure) is still an empty
    // [hx-get] element under the root. Re-processing it re-fires its
    // hx-trigger="load" and re-issues the request (htmx.trigger does NOT).
    function reloadMissingPartials() {
        if (canvasFullyMounted()) return;
        Array.from(document.querySelectorAll("#canvas-app-root > [hx-get]")).forEach(function (el) {
            if (window.htmx) htmx.process(el);
        });
    }

    // Broken stylesheets are replaced; links that are missing entirely
    // (removed or never injected) are recreated from the captured URLs.
    function reloadMissingCss() {
        if (cssLoaded()) return;
        Array.from(document.querySelectorAll('link[href*="canvas.p"]')).forEach(function (link) {
            if (link.sheet) return;
            var fresh = document.createElement("link");
            fresh.rel = "stylesheet";
            fresh.href = link.href;
            if (link.parentNode) link.parentNode.replaceChild(fresh, link);
        });
        EXPECTED_CSS.forEach(function (href) {
            var exists = Array.from(document.querySelectorAll('link[href*="canvas.p"]'))
                .some(function (l) { return l.href === href; });
            if (!exists) {
                var fresh = document.createElement("link");
                fresh.rel = "stylesheet";
                fresh.href = href;
                document.body.appendChild(fresh);
            }
        });
    }

    // Keeps watching while the app window is open: broken → retry eagerly
    // (1.5s), then settle into a slow watch (5s) so a window opened during a
    // server blip still repairs itself once the server returns. Healthy →
    // stay on the slow watch so late breakage is also caught. Stops when the
    // window is closed. All actions are no-ops when everything is present.
    function heal() {
        if (canvasRootGone()) return;
        if (canvasFullyMounted() && cssLoaded()) {
            setTimeout(heal, 5000);
            return;
        }
        attempts++;
        if (!slow && attempts >= MAX_FAST_ATTEMPTS) slow = true;
        reloadMissingPartials();
        reloadMissingCss();
        setTimeout(heal, slow ? 5000 : 1500);
    }

    setTimeout(heal, 1000);
})();
</script>
