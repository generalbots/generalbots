<!-- Properties Panel -->
    <aside class="properties-panel collapsed" id="properties-panel">
        <button class="panel-toggle" onclick="togglePropertiesPanel()">
            <span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
        </button>
        <div class="panel-content">
            <h3>Properties</h3>

            <div id="element-properties" class="properties-group hidden">
                <div class="property-row">
                    <label>Position</label>
                    <div class="input-group">
                        <input
                            type="number"
                            id="prop-x"
                            placeholder="X"
                            onchange="updateElementProperty('x', this.value)"
                        />
                        <input
                            type="number"
                            id="prop-y"
                            placeholder="Y"
                            onchange="updateElementProperty('y', this.value)"
                        />
                    </div>
                </div>
                <div class="property-row">
                    <label>Size</label>
                    <div class="input-group">
                        <input
                            type="number"
                            id="prop-width"
                            placeholder="W"
                            onchange="updateElementProperty('width', this.value)"
                        />
                        <input
                            type="number"
                            id="prop-height"
                            placeholder="H"
                            onchange="updateElementProperty('height', this.value)"
                        />
                    </div>
                </div>
                <div class="property-row">
                    <label>Rotation</label>
                    <input
                        type="number"
                        id="prop-rotation"
                        placeholder="0°"
                        onchange="updateElementProperty('rotation', this.value)"
                    />
                </div>
                <div class="property-row">
                    <label>Opacity</label>
                    <input
                        type="range"
                        id="prop-opacity"
                        min="0"
                        max="100"
                        value="100"
                        onchange="updateElementProperty('opacity', this.value)"
                    />
                </div>
                <div class="property-row">
                    <label>Stroke</label>
                    <input
                        type="color"
                        id="prop-stroke"
                        onchange="updateElementProperty('strokeColor', this.value)"
                    />
                </div>
                <div class="property-row">
                    <label>Fill</label>
                    <input
                        type="color"
                        id="prop-fill"
                        onchange="updateElementProperty('fillColor', this.value)"
                    />
                </div>
            </div>

            <div id="canvas-properties" class="properties-group">
                <h4>Canvas</h4>
                <div class="property-row">
                    <label>Background</label>
                    <input
                        type="color"
                        id="canvas-bg"
                        value="#ffffff"
                        onchange="setCanvasBackground(this.value)"
                    />
                </div>
                <div class="property-row">
                    <label>Grid</label>
                    <select id="grid-type" onchange="setGridType(this.value)">
                        <option value="none">None</option>
                        <option value="dots" selected>Dots</option>
                        <option value="lines">Lines</option>
                        <option value="squares">Squares</option>
                    </select>
                </div>
                <div class="property-row">
                    <label>Snap to Grid</label>
                    <input
                        type="checkbox"
                        id="snap-grid"
                        onchange="toggleSnapToGrid(this.checked)"
                    />
                </div>
            </div>

            <div class="properties-group">
                <h4>Layers</h4>
                <div id="layers-list" class="layers-list">
                    <div class="layer-item active">
                        <span class="layer-visibility"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg></span>
                        <span class="layer-name">Layer 1</span>
                        <span class="layer-lock"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.6-1.7"/></svg></span>
                    </div>
                </div>
                <button class="btn-sm" onclick="addLayer()">+ Add Layer</button>
            </div>
        </div>
    </aside>

    <!-- Collaborators Panel -->
    <div class="collaborators-panel" id="collaborators-panel">
        <div class="collaborators-list" id="collaborators-list">
            <!-- Collaborator avatars will be added here -->
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu hidden">
        <button onclick="duplicateSelected()">Duplicate</button>
        <button onclick="copySelected()">Copy</button>
        <button onclick="pasteClipboard()">Paste</button>
        <div class="menu-divider"></div>
        <button onclick="bringToFront()">Bring to Front</button>
        <button onclick="sendToBack()">Send to Back</button>
        <div class="menu-divider"></div>
        <button onclick="deleteSelected()">Delete</button>
    </div>
