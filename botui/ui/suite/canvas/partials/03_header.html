<!-- Main Canvas Area -->
    <main class="canvas-main">
        <!-- Top Bar -->
        <header class="canvas-header">
            <div class="header-left">
                <input
                    type="text"
                    id="canvas-name"
                    value="Untitled Canvas"
                    class="canvas-name-input"
                    onblur="renameCanvas(this.value)"
                />
                <span class="save-status" id="save-status">Saved</span>
            </div>
            <div class="header-center">
                <div class="zoom-controls">
                    <button
                        class="zoom-btn"
                        onclick="zoomOut()"
                        title="Zoom Out"
                    >
                        −
                    </button>
                    <span id="zoom-level">100%</span>
                    <button class="zoom-btn" onclick="zoomIn()" title="Zoom In">
                        +
                    </button>
                    <button
                        class="zoom-btn"
                        onclick="resetZoom()"
                        title="Reset Zoom"
                    >
                        ⟲
                    </button>
                    <button
                        class="zoom-btn"
                        onclick="fitToScreen()"
                        title="Fit to Screen"
                    >
                        ⤢
                    </button>
                </div>
            </div>
            <div class="header-right">
                <button
                    class="btn-icon"
                    onclick="newCanvas()"
                    title="New Canvas"
                >
                    <span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><polyline points="14 3 14 8 19 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg></span>
                </button>
                <button
                    class="btn-icon"
                    onclick="undo()"
                    title="Undo (Ctrl+Z)"
                    data-i18n-title="canvas-undo"
                >
                    <span>↶</span>
                </button>
                <button
                    class="btn-icon"
                    onclick="redo()"
                    title="Redo (Ctrl+Y)"
                    data-i18n-title="canvas-redo"
                >
                    <span>↷</span>
                </button>
                <div class="separator"></div>
                <button
                    class="btn-icon"
                    onclick="clearCanvas()"
                    title="Clear Canvas"
                    data-i18n-title="canvas-clear"
                >
                    <span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></span>
                </button>
                <button
                    class="btn-primary"
                    onclick="saveCanvas()"
                    title="Save (.draw)"
                >
                    <span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></span> Save
                </button>
                <button
                    class="btn-secondary"
                    onclick="exportCanvas()"
                    data-i18n="canvas-export"
                >
                    <span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span> Export
                </button>
                <button
                    class="btn-secondary"
                    onclick="shareCanvas()"
                    data-i18n="canvas-collaborate"
                >
                    <span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="3.5"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Share
                </button>
            </div>
        </header>

        <!-- Canvas Container -->
        <div class="canvas-container" id="canvas-container">
            <div id="canvas-bg-svg" class="canvas-bg-svg"></div>
            <canvas id="main-canvas"></canvas>
            <div id="selection-box" class="selection-box hidden"></div>
            <div id="cursor-indicators" class="cursor-indicators"></div>
        </div>

        <!-- Mini Map -->
        <div class="mini-map" id="mini-map">
            <canvas id="mini-map-canvas"></canvas>
            <div class="viewport-indicator" id="viewport-indicator"></div>
        </div>
    </main>
