<!-- Toolbar -->
    <aside class="canvas-toolbar">
        <div class="toolbar-section">
            <button
                class="tool-btn active"
                data-tool="select"
                onclick="selectTool('select')"
                title="Select (V)"
            >
                <span>↖</span>
            </button>
            <button
                class="tool-btn"
                data-tool="pan"
                onclick="selectTool('pan')"
                title="Pan (H)"
            >
                <span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l10-10"/><path d="M14 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/><path d="M19 11l.7 1.4 1.4.7-1.4.7-.7 1.4-.7-1.4-1.4-.7 1.4-.7z"/></svg></span>
            </button>
        </div>

        <div class="toolbar-section">
            <button
                class="tool-btn"
                data-tool="pencil"
                onclick="selectTool('pencil')"
                title="Pencil (P)"
            >
                <span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
            </button>
            <button
                class="tool-btn"
                data-tool="brush"
                onclick="selectTool('brush')"
                title="Brush (B)"
            >
                <span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 14.5l-4 4a2.1 2.1 0 0 0 3 3l4-4"/><path d="M14 10l6.5-6.5a2.1 2.1 0 0 0-3-3L11 7"/></svg></span>
            </button>
            <button
                class="tool-btn"
                data-tool="eraser"
                onclick="selectTool('eraser')"
                title="Eraser (E)"
            >
                <span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21h10"/><path d="M4.5 16.5l7-7a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8l-4.5 4.5H8z"/></svg></span>
            </button>
        </div>

        <div class="toolbar-section">
            <button
                class="tool-btn"
                data-tool="rectangle"
                onclick="selectTool('rectangle')"
                title="Rectangle (R)"
            >
                <span>▢</span>
            </button>
            <button
                class="tool-btn"
                data-tool="ellipse"
                onclick="selectTool('ellipse')"
                title="Ellipse (O)"
            >
                <span>◯</span>
            </button>
            <button
                class="tool-btn"
                data-tool="line"
                onclick="selectTool('line')"
                title="Line (L)"
            >
                <span>╱</span>
            </button>
            <button
                class="tool-btn"
                data-tool="arrow"
                onclick="selectTool('arrow')"
                title="Arrow (A)"
            >
                <span>→</span>
            </button>
        </div>

        <div class="toolbar-section">
            <button
                class="tool-btn"
                data-tool="text"
                onclick="selectTool('text')"
                title="Text (T)"
            >
                <span>T</span>
            </button>
            <button
                class="tool-btn"
                data-tool="sticky"
                onclick="selectTool('sticky')"
                title="Sticky Note (S)"
            >
                <span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg></span>
            </button>
            <button
                class="tool-btn"
                data-tool="image"
                onclick="selectTool('image')"
                title="Image (I)"
            >
                <span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3.5" width="18" height="17" rx="2.5"/><circle cx="8.5" cy="9" r="1.6"/><polyline points="21 16 16 11 5 20.5"/></svg></span>
            </button>
        </div>

        <div class="toolbar-section">
            <button
                class="tool-btn"
                data-tool="connector"
                onclick="selectTool('connector')"
                title="Connector (C)"
            >
                <span>⤳</span>
            </button>
            <button
                class="tool-btn"
                data-tool="frame"
                onclick="selectTool('frame')"
                title="Frame (F)"
            >
                <span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></span>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-section colors">
            <input
                type="color"
                id="stroke-color"
                value="#000000"
                title="Stroke Color"
                onchange="setStrokeColor(this.value)"
            />
            <input
                type="color"
                id="fill-color"
                value="#ffffff"
                title="Fill Color"
                onchange="setFillColor(this.value)"
            />
        </div>

        <div class="toolbar-section">
            <select
                id="stroke-width"
                onchange="setStrokeWidth(this.value)"
                title="Stroke Width"
            >
                <option value="1">1px</option>
                <option value="2" selected>2px</option>
                <option value="4">4px</option>
                <option value="6">6px</option>
                <option value="8">8px</option>
            </select>
        </div>
    </aside>
