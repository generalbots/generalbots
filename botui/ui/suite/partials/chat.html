<div class="chat-layout gb-app" id="chat-app" data-gb-app="chat" style="opacity: 1; visibility: visible;">
    <div class="chat-content-wrapper" id="chatContentWrapper">
        <div class="connection-status connecting" id="connectionStatus" style="display: none">
            <span class="connection-status-dot"></span>
            <span class="connection-text" data-i18n="chat-connecting">Connecting...</span>
        </div>

        <main id="messages">
            <div class="gb-state gb-state-loading"><span class="gb-state-msg" data-i18n="chat-connecting">Connecting…</span></div>
            <div class="gb-state gb-state-error"><span class="gb-state-msg" data-i18n="chat-connection-failed">Connection failed</span></div>
        </main>

        <footer>
            <div class="chat-footer-content">
                <div class="suggestions-container" id="suggestions"></div>
                <div class="switchers-container" id="switchers" style="display:none">
                    <div class="switchers-label" data-i18n="chat-format">Format:</div>
                    <div class="switchers-chips" id="switcherChips"></div>
                </div>
            </div>
            <div class="mention-dropdown" id="mentionDropdown">
                <div class="mention-header">
                    <span class="mention-title" data-i18n="chat-mention-title">Reference Entity</span>
                </div>
                <div class="mention-results" id="mentionResults"></div>
            </div>
            <form class="input-container" id="chatForm">
                <select id="modelPicker" class="gb-model-picker" data-i18n-title="chat-model-title">
                    <option value="auto" selected data-i18n="chat-model-auto">Auto</option>
                    <option value="fast" data-i18n="chat-model-fast">Fast · cheapest, quick</option>
                    <option value="balanced" data-i18n="chat-model-balanced">Balanced · middle ground</option>
                    <option value="quality" data-i18n="chat-model-quality">Quality · best, slower</option>
                </select>
                <textarea name="content" id="messageInput" rows="1"
                placeholder="Message... (type @ to mention, Shift+Enter for a new line)"
                data-i18n-placeholder="chat-placeholder" autofocus autocomplete="off"></textarea>
                <label class="file-btn" id="fileBtn" data-i18n-title="chat-attach" title="Attach file">
                    <input type="file" id="messageFile" style="display:none" />
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                    </svg>
                </label>
                <span id="fileChip" style="display:none" data-i18n-title="chat-attached" title="Attached file"></span>
                <button type="button" id="cameraBtn" class="chat-tool-toggle camera-toggle"
                    aria-label="Take a photo" data-i18n-aria-label="chat-camera-title"
                    title="Take a photo" data-i18n-title="chat-camera-title">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                    <span class="sr-only" data-i18n="chat-camera-title">Take a photo</span>
                </button>
                <input type="file" id="cameraFileInput" accept="image/*" capture="environment" style="display:none" />
                <button type="button" id="webSearchBtn" class="chat-tool-toggle web-search-toggle"
                    aria-pressed="false" aria-label="Web search: off — answers use no live sources. Click to turn on." data-i18n-aria-label="chat-web-off"
                    title="Web search: off — answers use no live sources. Click to turn on.">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M3 12h18"></path>
                        <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"></path>
                    </svg>
                    <span class="web-search-label" data-i18n="chat-web-off-short">Web off</span>
                </button>
                <button type="button" id="voiceBtn" class="chat-tool-toggle voice-toggle"
                    aria-pressed="false" aria-label="Voice input — click to speak" data-i18n-aria-label="chat-voice-input"
                    title="Voice input — click to speak" data-i18n-title="chat-voice-input">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                        <path d="M5 10v1a7 7 0 0 0 14 0v-1"></path>
                        <line x1="12" y1="19" x2="12" y2="22"></line>
                    </svg>
                    <span class="sr-only" data-i18n="chat-voice-input">Voice input</span>
                </button>
                <button type="button" id="voiceDuplexBtn" class="chat-tool-toggle voice-duplex-toggle"
                    aria-pressed="false" aria-label="Continuous voice (full duplex)" data-i18n-aria-label="chat-voice-duplex-off"
                    title="Continuous voice (full duplex) — speak and listen hands-free" data-i18n-title="chat-voice-duplex-off">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M4 12a8 8 0 0 1 16 0"></path>
                        <path d="M4 12v3a2 2 0 0 0 2 2h1v-5H6a2 2 0 0 0-2 2z"></path>
                        <path d="M20 12v3a2 2 0 0 1-2 2h-1v-5h1a2 2 0 0 1 2 2z"></path>
                        <path d="M7 19a5 5 0 0 0 10 0"></path>
                    </svg>
                    <span class="sr-only" data-i18n="chat-voice-duplex">Full duplex</span>
                </button>
                <button type="submit" id="sendBtn" title="Send" data-i18n-title="chat-send">&#8593;</button>
            </form>
        </footer>
        <button class="scroll-to-bottom" id="scrollToBottom" data-i18n-title="chat-scroll-bottom" title="Scroll to bottom" aria-label="Scroll to bottom">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </button>
    </div>
</div>

<div class="entity-card-tooltip" id="entityCardTooltip">
    <div class="entity-card-header">
        <span class="entity-card-type"></span>
        <span class="entity-card-status"></span>
    </div>
    <div class="entity-card-title"></div>
    <div class="entity-card-details"></div>
    <div class="entity-card-actions">
        <button class="entity-card-btn" data-action="view" data-i18n="action-view">View</button>
    </div>
</div>
