<div class="versions-panel">
  <div class="versions-header">
    <h2>System Versions</h2>
    <p>Component versions and update availability</p>
  </div>
  <div class="versions-table-container" id="versionsTableContainer">
    <div class="versions-loading">
      <div class="versions-spinner"></div>
      <span>Loading version information...</span>
    </div>
  </div>
</div>

<style>
.versions-panel {
  padding: 24px;
  max-width: 800px;
}

.versions-header {
  margin-bottom: 24px;
}

.versions-header h2 {
  font-size: 22px;
  font-weight: 700;
  margin: 0 0 8px;
  color: var(--text, #e5e5e5);
}

.versions-header p {
  margin: 0;
  color: var(--text-secondary, #888);
  font-size: 14px;
}

.versions-table-container {
  background: var(--surface, #1a1a24);
  border: 1px solid var(--border, #2a2a2a);
  border-radius: 12px;
  overflow: hidden;
}

.versions-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 48px;
  color: var(--text-secondary, #888);
  font-size: 14px;
}

.versions-spinner {
  width: 20px;
  height: 20px;
  border: 2px solid var(--border, #2a2a2a);
  border-top-color: var(--primary, #84d669);
  border-radius: 50%;
  animation: versionsSpin 0.8s linear infinite;
}

@keyframes versionsSpin {
  to { transform: rotate(360deg); }
}

.versions-table {
  width: 100%;
  border-collapse: collapse;
}

.versions-table th {
  text-align: left;
  padding: 14px 16px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-secondary, #888);
  background: var(--surface-hover, rgba(255, 255, 255, 0.03));
  border-bottom: 1px solid var(--border, #2a2a2a);
}

.versions-table td {
  padding: 14px 16px;
  font-size: 14px;
  color: var(--text, #e5e5e5);
  border-bottom: 1px solid var(--border, #2a2a2a);
}

.versions-table tr:last-child td {
  border-bottom: none;
}

.versions-table tr:hover td {
  background: var(--surface-hover, rgba(255, 255, 255, 0.03));
}

.version-component {
  display: flex;
  align-items: center;
  gap: 10px;
}

.version-component-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  background: var(--surface-hover, rgba(255, 255, 255, 0.05));
  flex-shrink: 0;
}

.version-component-name {
  font-weight: 500;
}

.version-number {
  font-family: "Fira Code", monospace;
  color: var(--text-secondary, #aaa);
}

.version-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 6px;
}

.version-status.up-to-date {
  background: rgba(34, 197, 94, 0.15);
  color: #22c55e;
}

.version-status.update-available {
  background: rgba(245, 158, 11, 0.15);
  color: #f59e0b;
}

.version-status.unknown {
  background: rgba(107, 114, 128, 0.15);
  color: #6b7280;
}

.version-check-btn {
  padding: 6px 12px;
  border: 1px solid var(--border, #2a2a2a);
  background: var(--surface-hover, rgba(255, 255, 255, 0.05));
  color: var(--text, #e5e5e5);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.version-check-btn:hover {
  border-color: var(--primary, #84d669);
  background: rgba(132, 214, 105, 0.1);
}

.version-check-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
</style>

<script src="/suite/js/versions.js"></script>
