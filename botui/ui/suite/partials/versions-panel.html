<div class="gb-app versions-panel" data-gb-app="versions">
  <div class="versions-header">
    <h2 data-i18n="system-versions-title">System Versions</h2>
    <p data-i18n="system-versions-desc">Component versions and update availability</p>
  </div>
  <div class="versions-table-container" id="versionsTableContainer">
    <div class="versions-loading">
      <div class="versions-spinner"></div>
      <span data-i18n="system-versions-loading">Loading version information...</span>
    </div>
  </div>
</div>

<style>
.versions-panel {
  padding: 24px;
  max-width: 800px;
}

.versions-header {
  margin-bottom: 24px;
}

.versions-header h2 {
  font-size: 22px;
  font-weight: 700;
  margin: 0 0 8px;
  color: var(--text, var(--id-gray-200));
}

.versions-header p {
  margin: 0;
  color: var(--text-secondary, var(--id-muted));
  font-size: 14px;
}

.versions-table-container {
  background: var(--surface, #1a1a24);
  border: 1px solid var(--border, var(--id-ink));
  border-radius: 12px;
  overflow: hidden;
}

.versions-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 48px;
  color: var(--text-secondary, var(--id-muted));
  font-size: 14px;
}

.versions-spinner {
  width: 20px;
  height: 20px;
  border: 2px solid var(--border, var(--id-ink));
  border-top-color: var(--primary, #84d669);
  border-radius: 50%;
  animation: versionsSpin 0.8s linear infinite;
}

@keyframes versionsSpin {
  to { transform: rotate(360deg); }
}

.versions-table {
  width: 100%;
  border-collapse: collapse;
}

.versions-table th {
  text-align: left;
  padding: 14px 16px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-secondary, var(--id-muted));
  background: var(--surface-hover, color-mix(in srgb, var(--id-surface-solid) 3%, transparent));
  border-bottom: 1px solid var(--border, var(--id-ink));
}

.versions-table td {
  padding: 14px 16px;
  font-size: 14px;
  color: var(--text, var(--id-gray-200));
  border-bottom: 1px solid var(--border, var(--id-ink));
}

.versions-table tr:last-child td {
  border-bottom: none;
}

.versions-table tr:hover td {
  background: var(--surface-hover, color-mix(in srgb, var(--id-surface-solid) 3%, transparent));
}

.version-component {
  display: flex;
  align-items: center;
  gap: 10px;
}

.version-component-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  background: var(--surface-hover, color-mix(in srgb, var(--id-surface-solid) 5%, transparent));
  flex-shrink: 0;
}

.version-component-name {
  font-weight: 500;
}

.version-number {
  font-family: "Fira Code", monospace;
  color: var(--text-secondary, var(--id-gray-400));
}

.version-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 6px;
}

.version-status.up-to-date {
  background: color-mix(in srgb, var(--id-success) 15%, transparent);
  color: var(--id-success);
}

.version-status.update-available {
  background: color-mix(in srgb, var(--id-accent) 15%, transparent);
  color: var(--id-warn);
}

.version-status.unknown {
  background: color-mix(in srgb, var(--id-muted) 15%, transparent);
  color: var(--id-gray-500);
}

.version-check-btn {
  padding: 6px 12px;
  border: 1px solid var(--border, var(--id-ink));
  background: var(--surface-hover, color-mix(in srgb, var(--id-surface-solid) 5%, transparent));
  color: var(--text, var(--id-gray-200));
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.version-check-btn:hover {
  border-color: var(--primary, #84d669);
  background: rgba(132, 214, 105, 0.1);
}

.version-check-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
</style>

<div class="gb-state gb-state-loading"><span class="gb-state-msg" data-i18n="crm-loading">Loading…</span></div>
<div class="gb-state gb-state-error"><span class="gb-state-msg" data-i18n="app-service-unavailable">Service unavailable</span></div>
<script src="/suite/js/versions.js"></script>
