<!-- Vibe Knowledge Graph Panel (Issue #522) -->
<link rel="stylesheet" href="/suite/vibe/vibe.css" />

<div class="vibe-graph-panel" style="display: flex; flex-direction: column; height: 100%; padding: 16px; background: var(--surface);">
    <div class="vibe-graph-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="margin: 0; font-size: 15px; color: var(--text); font-weight: 700;">Knowledge Graph</h3>
        <div style="display: flex; gap: 8px;">
            <select id="graphUseCase" style="padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; background: var(--surface);">
                <option value="software_development">Software Dev</option>
                <option value="customer_support">Customer Support</option>
                <option value="financial_analysis">Financial</option>
            </select>
            <button class="btn-sm" onclick="VibeGraph.loadGraph(document.getElementById('graphUseCase').value)" style="padding: 4px 12px; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; font-size: 12px;">
                Load
            </button>
        </div>
    </div>

    <div class="vibe-graph-canvas-container" style="flex: 1; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #1a1a2e; position: relative;">
        <canvas id="vibeGraphCanvas" style="width: 100%; height: 100%;"></canvas>
        <div id="graphEmptyState" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #666; font-size: 14px; text-align: center;">
            Load a graph to visualize<br/>
            <span style="font-size: 11px; color: #888;">Select a use case and click Load</span>
        </div>
    </div>

    <div class="vibe-graph-legend" style="display: flex; gap: 16px; margin-top: 8px; font-size: 11px; color: var(--text-muted);">
        <span><span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #84d669; margin-right: 4px;"></span> Use Case</span>
        <span><span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #4a9eff; margin-right: 4px;"></span> Node</span>
        <span><span style="display: inline-block; width: 20px; height: 2px; background: rgba(132, 214, 105, 0.4); margin-right: 4px;"></span> Edge</span>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    VibeGraph.init('vibeGraphCanvas');
    const loadBtn = document.querySelector('.vibe-graph-panel .btn-sm');
    // Hide empty state when graph loads
    const emptyState = document.getElementById('graphEmptyState');
    if (emptyState) {
        const origLoad = VibeGraph.loadGraph;
        VibeGraph.loadGraph = function(uc) {
            emptyState.style.display = 'none';
            return origLoad.call(this, uc);
        };
    }
});
</script>
