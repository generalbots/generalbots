<div id="previewModal" class="preview-modal-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:color-mix(in srgb, var(--id-ink) 50%, transparent);z-index:var(--z-system);justify-content:center;align-items:center;">
  <div class="preview-modal" style="background:#FFFBE6;border:2px solid #F5C518;border-radius:12px;padding:24px;max-width:640px;width:90%;margin:20px auto;box-shadow:0 8px 32px color-mix(in srgb, var(--id-ink) 15%, transparent);font-family:system-ui,sans-serif;max-height:80vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #F5C518;padding-bottom:8px;margin-bottom:16px;">
      <h2 id="previewTitle" style="color:#B8860B;margin:0;font-size:1.5em;" data-i18n="sources-template-preview">Preview</h2>
      <div style="display:flex;gap:4px;">
        <button onclick="toggleProjector()" title="Toggle projector mode" style="background:none;border:1px solid #E8D5A0;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:16px;">&#x26A1;</button>
        <button onclick="closePreviewModal()" data-i18n-title="action-close" data-i18n-aria-label="action-close" style="background:none;border:none;font-size:24px;cursor:pointer;color:var(--id-muted);line-height:1;">&times;</button>
      </div>
    </div>
    <div id="previewBody" style="margin:16px 0;">
      <p style="color:var(--id-text);font-style:italic;" data-i18n="preview-loading-parameters">Loading parameters...</p>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid #E8D5A0;">
      <button onclick="confirmPreview()" style="background:#F5C518;color:var(--id-ink);border:none;padding:10px 24px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;" data-i18n="action-confirm">Confirm</button>
      <button onclick="closePreviewModal()" style="background:var(--id-gray-100);color:var(--id-ink);border:1px solid var(--id-gray-200);padding:10px 24px;border-radius:6px;cursor:pointer;font-size:14px;" data-i18n="action-cancel">Cancel</button>
    </div>
  </div>
</div>

  margin: 0;
  border-radius: 0;
}

  margin-bottom: 12px;
