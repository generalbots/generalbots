<div class="vibe-container gb-app" id="vibeWindow" data-gb-app="vibe">
<div class="gb-state gb-state-loading"><span class="gb-state-msg">Loading Vibe…</span></div>
<div class="gb-state gb-state-error"><span class="gb-state-msg">Vibe service unavailable</span></div>
<!-- Ribbon status sink: the run status text is mirrored into the window
     status bar (vibe-shell/toolbar/). The legacy PLAN/BUILD/REVIEW/
     DEPLOY/MONITOR ribbon was removed — the VB-style toolbar is the only
     command surface. -->
<span id="vibeRibbonStatus" class="vibe-ribbon-status" style="display:none"></span>

<!-- Main Content: Canvas + Sidebar -->
<!-- Run dock host is a sibling of the canvas (NOT inside it) so its
     bottom/right anchors to the vibe window, not the scrollable canvas. -->
<div id="vibeRunDockHost"></div>

<!-- #1190 animated execution overlay: shown while a run is executing. -->
<div id="vibeExecOverlay" class="vibe-exec-overlay hidden" style="display:none">
<div class="vibe-exec-ring"></div>
<span class="vibe-exec-label">AGENT EXECUTING…</span>
</div>

<!-- Chat lives in the Chat app only (toolbar Chat button pre-fills @appname).
     The runner surfaces run status in the ribbon, the Run Dock and the
     runner log — no in-runner chat overlay anymore. -->

<!-- Vibe Professional Dialogs (#806 rewrite) — one mask, real API content per dialog -->
<div class="vibe-dialog-mask" id="vibeDialogMask">
    <div class="vibe-dialog">
        <div class="vibe-dialog-head">
            <div class="vibe-dialog-title" id="vibeDialogTitle"><span class="dot"></span>Dialog</div>
            <div class="vibe-dialog-actions">
                <button type="button" class="vibe-btn" onclick="window.VibeDialogs && window.VibeDialogs.close()">Close ✕</button>
            </div>
        </div>
        <div class="vibe-dialog-body" id="vibeDialogBody"></div>
    </div>
</div>

<div id="vibeNewProjectModal" style="display: none; position: absolute; inset: 0; z-index: 90;"></div>

<div id="vibeMembersModal" style="display: none; position: absolute; inset: 0; z-index: 95; align-items: center; justify-content: center;">
  <div style="width: 520px; max-height: 80vh; overflow-y: auto; background: var(--bg, #1a1a2e); border: 1px solid var(--border, #333); border-radius: 8px; padding: 20px;">
    <!-- No in-panel title/close: the WindowManager chrome already carries
         the "Project Members" title and the ✕ button. -->
    <div id="vibeMembersRole" style="margin-bottom: 12px; font-size: 13px; color: var(--text-muted, #999);"></div>
    <div id="vibeMeterUsage" style="margin-bottom: 12px; font-size: 13px; color: var(--text-muted, #999);"></div>
    <div id="vibeMembersList" style="margin-bottom: 16px;"></div>
    <div style="border-top: 1px solid var(--border, #333); padding-top: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
      <div style="position: relative; flex: 1; min-width: 200px;">
        <input id="vibeMemberTarget" placeholder="Search user by name or email…" autocomplete="off" style="width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border, #333); border-radius: 6px; background: var(--bg, #14142a); color: var(--text, #999); font-size: 13px;" />
        <div id="vibeMemberSuggest" style="display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 10; max-height: 180px; overflow-y: auto; background: var(--bg, #1a1a2e); border: 1px solid var(--border, #333); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);"></div>
      </div>
      <select id="vibeMemberRole" style="padding: 8px 10px; border: 1px solid var(--border, #333); border-radius: 6px; background: var(--bg, #14142a); color: var(--text, #eee); font-size: 13px;">
        <option value="viewer">viewer</option>
        <option value="developer">developer</option>
        <option value="admin">admin</option>
      </select>
      <select id="vibeMemberKind" style="padding: 8px 10px; border: 1px solid var(--border, #333); border-radius: 6px; background: var(--bg, #14142a); color: var(--text, #eee); font-size: 13px;">
        <option value="user">user</option>
        <option value="group">group</option>
      </select>
      <button onclick="window.VibeMembers && window.VibeMembers.add()" style="padding: 8px 14px; border: none; border-radius: 6px; background: var(--accent, #4a6cf7); color: white; font-size: 13px; font-weight: 600; cursor: pointer;">Add</button>
    </div>
    <div style="margin-top: 12px; border-top: 1px solid var(--border, #333); padding-top: 12px; display: flex; gap: 8px; align-items: center;">
      <div style="position: relative; flex: 1;">
        <input id="vibeTransferTarget" placeholder="Search new owner by name or email…" autocomplete="off" style="width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border, #333); border-radius: 6px; background: var(--bg, #14142a); color: var(--text, #eee); font-size: 13px;" />
        <div id="vibeTransferSuggest" style="display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 10; max-height: 180px; overflow-y: auto; background: var(--bg, #1a1a2e); border: 1px solid var(--border, #333); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);"></div>
      </div>
      <button onclick="window.VibeMembers && window.VibeMembers.transfer()" style="padding: 8px 14px; border: 1px solid #f77; background: transparent; color: #f88; border-radius: 6px; font-size: 13px; cursor: pointer;">Transfer Ownership</button>
    </div>
  </div>
</div>

<!-- Vibe Graph Panel + Capabilities -->
<div id="vibeGraphPanel" style="display: none; position: absolute; left: 5%; top: 6%; width: 90%; height: 90%; z-index: 80; border: 1px solid var(--border, #d8dee9); border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 12px 40px rgba(15,23,42,0.18); flex-direction: column;">
  <!-- Slim toolbar (no title/✕ — the tool window chrome carries them). -->
  <div style="display: flex; align-items: center; justify-content: flex-end; padding: 6px 14px; border-bottom: 1px solid var(--border, #333); font-size: 11px; color: var(--text-muted, #888);">
    <span style="margin-right: auto"><span id="vibeGraphUseCaseLabel">software_development</span></span>
    <button onclick="VibeGraph && VibeGraph.togglePanel(true)" style="background: transparent; border: 1px solid var(--border, #333); color: var(--text, #eee); border-radius: 4px; padding: 1px 8px; cursor: pointer;">⟳</button>
  </div>
  <div style="padding: 8px 14px; border-bottom: 1px solid var(--border, #d8dee9); color: var(--text-muted, #64748b); font-size: 11px; line-height: 1.45;">
    Shows the selected use case, its execution runs, and the tools each run triggered. Double-click a run to inspect it.
    <span style="float:right; white-space:nowrap"><b style="color:#2563eb">■</b> use case &nbsp; <b style="color:#7c3aed">■</b> run &nbsp; <b style="color:#d97706">■</b> tool</span>
  </div>
  <div style="flex: 1; min-height: 0; position: relative;">
    <canvas id="vibeGraphCanvas" style="width: 100%; height: 100%; display: block;"></canvas>
  </div>
  <div id="vibeCapabilities" style="max-height: 72px; overflow-y: auto; border-top: 1px solid var(--border, #333); padding: 8px 12px; font-size: 11px; color: var(--text-muted, #aaa);"></div>
</div>

<!-- Vibe Metrics Panel (real run telemetry, not the knowledge graph) -->
<div id="vibeMetricsPanel" style="display: none; position: absolute; right: 24px; bottom: 24px; width: 480px; height: 400px; z-index: 80; border: 1px solid var(--border, #333); border-radius: 10px; overflow: hidden; background: var(--surface, #14142a); box-shadow: 0 12px 40px rgba(0,0,0,0.45); flex-direction: column;">
  <!-- Slim toolbar (no title/✕ — the tool window chrome carries them). -->
  <div style="display: flex; align-items: center; justify-content: flex-end; padding: 6px 14px; border-bottom: 1px solid var(--border, #333); font-size: 11px; color: var(--text-muted, #888);">
    <span style="margin-right: auto">run telemetry</span>
    <button onclick="VibeMetrics && VibeMetrics.refresh()" title="Refresh" style="background: transparent; border: 1px solid var(--border, #333); color: var(--text, #eee); border-radius: 4px; padding: 1px 8px; cursor: pointer;">⟳</button>
  </div>
  <div id="vibeMetricsBody" style="flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; font-size: 12px; color: var(--text, #eee);"></div>
</div>
