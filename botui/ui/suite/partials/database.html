<link rel="stylesheet" href="/suite/css/database.css" />

<div class="botcoder-database-container">
    <div class="botcoder-db-sidebar">
        <div class="botcoder-db-header">
            <h3>🗄️ Database Schema</h3>
            <button class="botcoder-btn-icon" onclick="DB.refreshSchema()" title="Refresh Schema">↻</button>
        </div>

        <div id="dbTableList" class="botcoder-table-list">
            <div class="botcoder-loading">Loading tables...</div>
        </div>

        <div class="botcoder-query-builder">
            <h4>Query Builder</h4>
            <textarea id="dbSqlEditor" placeholder="SELECT * FROM table..."></textarea>
            <button class="botcoder-btn botcoder-btn-primary" onclick="DB.executeSql()">Run Query</button>
            <span id="dbQueryDuration" class="db-query-duration"></span>
            <div id="dbSqlResults" class="db-sql-results"></div>
        </div>
    </div>

    <div class="botcoder-db-main">
        <div class="botcoder-grid-toolbar">
            <span id="dbTableName" class="db-table-name">Results</span>
            <button class="botcoder-btn" onclick="DB.exportCsv()">Export CSV</button>
        </div>

        <div id="dbDataGrid" class="botcoder-data-grid">
            <!-- Grid data here -->
            <div class="botcoder-empty">Select a table to view data</div>
        </div>

        <div class="db-pagination">
            <span id="dbRowCount" class="db-pagination-info"></span>
            <button id="dbPrevBtn" class="botcoder-btn" onclick="DB.prevPage()">◀ Prev</button>
            <span id="dbPageInfo" class="db-pagination-info">Page 1 of 1</span>
            <button id="dbNextBtn" class="botcoder-btn" onclick="DB.nextPage()">Next ▶</button>
        </div>
    </div>
</div>

<script src="/suite/js/database.js"></script>
