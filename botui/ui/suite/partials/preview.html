<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/suite/css/preview-window.css?v=2" />
</head>
<body>
<div class="gb-preview" id="gbPreview">
    <div class="gb-preview-bar">
        <span class="gb-preview-name" id="gbPreviewName" data-i18n="sources-template-preview">Preview</span>
        <span class="gb-preview-status" id="gbPreviewStatus"></span>
        <span class="gb-preview-actions">
            <button type="button" class="gb-preview-btn" id="gbPreviewShare" data-i18n="action-share">Share</button>
            <button type="button" class="gb-preview-btn" id="gbPreviewSave" data-i18n="auto-save-to-drive">Save to Drive</button>
            <button type="button" class="gb-preview-btn" id="gbPreviewDownload" data-i18n="action-download">Download</button>
            <button type="button" class="gb-preview-btn" id="gbPreviewOpen" data-i18n="tickets-open">Open</button>
        </span>
    </div>
    <div class="gb-preview-body" id="gbPreviewBody">
        <div class="gb-preview-empty" data-i18n="auto-no-file-selected-open-a-file-from-chat">No file selected. Open a file from chat.</div>
    </div>
</div>
<script src="/suite/js/preview-window/01_render.js?v=7"></script>
<script src="/suite/js/preview-window/99_open.js?v=8"></script>
<script src="/suite/js/preview-window/98_delta.js?v=2"></script>
</body>
</html>
