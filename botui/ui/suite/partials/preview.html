<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/suite/css/preview-window.css?v=2" />
</head>
<body>
<div class="gb-preview" id="gbPreview">
    <div class="gb-preview-bar">
        <span class="gb-preview-name" id="gbPreviewName">Preview</span>
        <span class="gb-preview-status" id="gbPreviewStatus"></span>
        <span class="gb-preview-actions">
            <button type="button" class="gb-preview-btn" id="gbPreviewShare">Share</button>
            <button type="button" class="gb-preview-btn" id="gbPreviewSave">Save to Drive</button>
            <button type="button" class="gb-preview-btn" id="gbPreviewDownload">Download</button>
            <button type="button" class="gb-preview-btn" id="gbPreviewOpen">Open</button>
        </span>
    </div>
    <div class="gb-preview-body" id="gbPreviewBody">
        <div class="gb-preview-empty">No file selected. Open a file from chat.</div>
    </div>
</div>
<script src="/suite/js/preview-window.js?v=7"></script>
</body>
</html>
