<!-- Status Bar -->
        <div class="paper-status-bar">
            <div class="status-left">
                <span
                    class="status-item"
                    id="word-count"
                    data-tooltip="Document word count"
                    data-i18n="paper-word-count"
                    data-i18n-args='{"count": 0}'
                    >0 words</span
                >
                <span
                    class="status-item"
                    id="char-count"
                    data-tooltip="Document character count"
                    data-i18n="paper-char-count"
                    data-i18n-args='{"count": 0}'
                    >0 characters</span
                >
            </div>
            <div class="status-center">
                <span
                    class="status-item save-status"
                    id="save-status"
                    data-state="saved"
                    data-tooltip="Document save status"
                    data-i18n="paper-saved"
                    >Saved</span
                >
            </div>
            <div class="status-right">
                <span
                    class="status-item"
                    id="last-edited"
                    data-tooltip="Last document edit time"
                    data-i18n="paper-last-edited-now"
                    >Last edited: Just now</span
                >
            </div>
        </div>
    </main>
