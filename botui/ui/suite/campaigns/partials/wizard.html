<!-- Multi-step Campaign Wizard for Unified Campaign System (#531) -->
<div class="campaign-wizard" id="campaign-wizard">
  <header class="wizard-header">
    <h3 data-i18n="campaign-new">New Campaign</h3>
    <ol class="wizard-steps">
      <li class="active" data-step="1"><span class="step-num">1</span><span class="step-name" data-i18n="auto-channel">Channel</span></li>
      <li data-step="2"><span class="step-num">2</span><span class="step-name" data-i18n="auto-audience">Audience</span></li>
      <li data-step="3"><span class="step-num">3</span><span class="step-name" data-i18n="dashboards-content">Content</span></li>
      <li data-step="4"><span class="step-num">4</span><span class="step-name" data-i18n="auto-schedule">Schedule</span></li>
      <li data-step="5"><span class="step-num">5</span><span class="step-name" data-i18n="auto-review">Review</span></li>
    </ol>
  </header>

  <section class="wizard-step active" data-step="1">
    <h4 data-i18n="auto-choose-channels">Choose channels</h4>
    <p class="hint" data-i18n="auto-multi-channel-dispatch-sends-in-parallel-per-channel">Multi-channel dispatch sends in parallel per channel.</p>
    <div class="channel-grid">
      <label class="channel-card"><input type="checkbox" name="channel" value="email" checked /><span data-i18n="attendant-channel-email">Email</span></label>
      <label class="channel-card"><input type="checkbox" name="channel" value="whatsapp" /><span>WhatsApp</span></label>
      <label class="channel-card"><input type="checkbox" name="channel" value="instagram" /><span data-i18n="attendant-channel-instagram">Instagram</span></label>
      <label class="channel-card"><input type="checkbox" name="channel" value="telegram" /><span>Telegram</span></label>
      <label class="channel-card"><input type="checkbox" name="channel" value="sms" /><span>SMS</span></label>
      <label class="channel-card"><input type="checkbox" name="channel" value="push" /><span data-i18n="auto-push">Push</span></label>
    </div>
    <div class="form-row">
      <label for="wiz-campaign-name" data-i18n="auto-campaign-name">Campaign name</label>
      <input type="text" id="wiz-campaign-name" placeholder="Spring sale 2026" required />
    </div>
  </section>

  <section class="wizard-step" data-step="2">
    <h4 data-i18n="auto-audience">Audience</h4>
    <div class="form-row">
      <label for="wiz-audience-source" data-i18n="attendant-source">Source</label>
      <select id="wiz-audience-source">
        <option value="list" data-i18n="auto-saved-list">Saved list</option>
        <option value="segment" data-i18n="auto-dynamic-segment">Dynamic segment</option>
        <option value="tag" data-i18n="auto-tag-filter">Tag filter</option>
      </select>
    </div>
    <div class="form-row">
      <label for="wiz-audience-list" data-i18n="auto-list-segment">List / segment</label>
      <select id="wiz-audience-list">
        <option value="all" data-i18n="auto-all-contacts">All contacts</option>
        <option value="vip" data-i18n="auto-vip-customers">VIP customers</option>
        <option value="leads" data-i18n="auto-recent-leads">Recent leads</option>
      </select>
    </div>
    <div class="form-row">
      <label for="wiz-audience-size" data-i18n="auto-estimated-reach">Estimated reach</label>
      <output id="wiz-audience-size" data-i18n="auto-contacts">— contacts</output>
    </div>
  </section>

  <section class="wizard-step" data-step="3">
    <h4 data-i18n="dashboards-content">Content</h4>
    <ul class="ai-options">
      <li><label><input type="radio" name="ai-gen" value="copy" checked /><span data-i18n="auto-generate-copy-with-ai"> Generate copy with AI</span></label></li>
      <li><label><input type="radio" name="ai-gen" value="image" /><span data-i18n="auto-ai-image-instagram"> AI image (Instagram)</span></label></li>
      <li><label><input type="radio" name="ai-gen" value="video" /><span data-i18n="auto-ai-video-script"> AI video script</span></label></li>
      <li><label><input type="radio" name="ai-gen" value="none" /><span data-i18n="auto-manual-template"> Manual / template</span></label></li>
    </ul>
    <div class="form-row">
      <label for="wiz-content-prompt" data-i18n="auto-ai-prompt">AI prompt</label>
      <textarea id="wiz-content-prompt" rows="3" placeholder="Describe the campaign goal, tone and key offer…"></textarea>
    </div>
    <div class="form-row">
      <label for="wiz-template" data-i18n="auto-template">Template</label>
      <select id="wiz-template">
        <option value="blank" data-i18n="dashboards-blank">Blank</option>
        <option value="promo" data-i18n="auto-promo">Promo</option>
        <option value="newsletter" data-i18n="auto-newsletter">Newsletter</option>
        <option value="event" data-i18n="auto-event-invite">Event invite</option>
      </select>
    </div>
  </section>

  <section class="wizard-step" data-step="4">
    <h4 data-i18n="auto-schedule">Schedule</h4>
    <div class="form-row">
      <label for="wiz-schedule-mode" data-i18n="auto-mode">Mode</label>
      <select id="wiz-schedule-mode">
        <option value="now" data-i18n="auto-send-now">Send now</option>
        <option value="scheduled" data-i18n="auto-at-specific-time">At specific time</option>
        <option value="drip" data-i18n="auto-drip-sequence">Drip sequence</option>
      </select>
    </div>
    <div class="form-row">
      <label for="wiz-schedule-when" data-i18n="auto-when">When</label>
      <input type="datetime-local" id="wiz-schedule-when" />
    </div>
    <div class="form-row">
      <label for="wiz-schedule-tz" data-i18n="settings-timezone">Timezone</label>
      <select id="wiz-schedule-tz">
        <option value="UTC">UTC</option>
        <option value="America/Sao_Paulo" data-i18n="auto-america-sao-paulo">America/Sao_Paulo</option>
        <option value="America/New_York" data-i18n="auto-america-new-york">America/New_York</option>
        <option value="Europe/Lisbon" data-i18n="auto-europe-lisbon">Europe/Lisbon</option>
      </select>
    </div>
  </section>

  <section class="wizard-step" data-step="5">
    <h4 data-i18n="auto-review">Review</h4>
    <dl class="review-summary" id="wiz-review-summary">
      <dt data-i18n="auto-channels">Channels</dt><dd data-review="channels">—</dd>
      <dt data-i18n="label-name">Name</dt><dd data-review="name">—</dd>
      <dt data-i18n="auto-audience">Audience</dt><dd data-review="audience">—</dd>
      <dt data-i18n="dashboards-content">Content</dt><dd data-review="content">—</dd>
      <dt data-i18n="auto-schedule">Schedule</dt><dd data-review="schedule">—</dd>
    </dl>
  </section>

  <footer class="wizard-actions">
    <button type="button" class="btn-secondary" id="wiz-prev" disabled data-i18n="pagination-previous">Previous</button>
    <button type="button" class="btn-primary" id="wiz-next" data-i18n="action-next">Next</button>
    <button type="button" class="btn-primary hidden" id="wiz-launch" data-i18n="auto-launch-campaign">Launch campaign</button>
  </footer>
</div>
