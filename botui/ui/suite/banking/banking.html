<link rel="stylesheet" href="/suite/banking/banking.css">
<div class="banking-container">
    <header class="banking-header">
        <div class="banking-header-left">
            <h1>Banking Reconciliation</h1>
            <nav class="banking-tabs">
                <button class="banking-tab active" data-view="transactions">Transactions</button>
                <button class="banking-tab" data-view="platforms">Platforms</button>
                <button class="banking-tab" data-view="reconcile">Reconciliation</button>
                <button class="banking-tab" data-view="reports">Reports</button>
            </nav>
        </div>
        <div class="banking-header-right">
            <div class="banking-search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <input type="text" id="bankingSearch" placeholder="Search transactions...">
            </div>
            <button class="btn-primary" onclick="BankingApp.refresh()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                Refresh
            </button>
        </div>
    </header>

    <div id="transactions-view" class="banking-view active">
        <div class="banking-summary" id="tx-summary"></div>
        <div class="banking-table-wrap">
            <table class="banking-table">
                <thead>
                    <tr>
                        <th>Date</th><th>Description</th><th>Amount</th><th>Platform</th><th>Status</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tx-body">
                    <tr><td colspan="6" class="loading-row"><div class="spinner"></div> Loading transactions...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="platforms-view" class="banking-view">
        <div class="platforms-grid" id="platforms-grid">
            <div class="loading-row"><div class="spinner"></div> Loading platforms...</div>
        </div>
    </div>

    <div id="reconcile-view" class="banking-view">
        <div class="reconcile-actions" style="padding:16px 24px;border-bottom:1px solid var(--border,#2a2a2a)">
            <button class="btn-accent" onclick="BankingApp.autoMatch()">Auto-Match</button>
            <button class="btn-secondary" onclick="BankingApp.manualMatch()">Manual Match</button>
        </div>
        <div class="reconcile-container">
            <div class="reconcile-panel">
                <div class="reconcile-panel-header"><h3>Bank Statements</h3><span class="badge unmatched" id="bank-unmatched-count">0 unmatched</span></div>
                <div class="reconcile-list" id="bank-list"><div class="loading-row"><div class="spinner"></div></div></div>
            </div>
            <div class="reconcile-panel">
                <div class="reconcile-panel-header"><h3>Platform Orders</h3><span class="badge pending" id="plat-unmatched-count">0 unmatched</span></div>
                <div class="reconcile-list" id="plat-list"><div class="loading-row"><div class="spinner"></div></div></div>
            </div>
        </div>
    </div>

    <div id="reports-view" class="banking-view">
        <div class="reports-grid" id="reports-grid">
            <div class="loading-row"><div class="spinner"></div> Loading reports...</div>
        </div>
    </div>
</div>

<script src="/suite/banking/banking.js"></script>
