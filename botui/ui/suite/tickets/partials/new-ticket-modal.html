<div id="tickets-modal" class="tickets-modal">
    <div class="tickets-modal-backdrop" onclick="closeTicketsModal()"></div>
    <div class="tickets-modal-content" id="tickets-modal-content">
        <form class="ticket-form" hx-post="/api/tickets" hx-target="#tickets-list-body" hx-on::after-request="closeTicketsModal()">
            <div class="ticket-form-header">
                <h2 class="ticket-form-title" data-i18n="tickets-new-case">New Support Case</h2>
                <button type="button" class="form-close" onclick="closeTicketsModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="ai-suggestion-banner">
                <div class="ai-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/>
                    </svg>
                </div>
                <div class="ai-suggestion-text">
                    <strong data-i18n="tickets-ai-assist">AI Assistant</strong>
                    <span data-i18n="tickets-ai-will-help">will analyze your issue and suggest solutions</span>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" data-i18n="tickets-subject">Subject</label>
                <input type="text" name="subject" class="form-input" required placeholder="Brief description of the issue" data-i18n-placeholder="tickets-subject-placeholder"/>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" data-i18n="tickets-account">Account</label>
                    <select name="account_id" class="form-select" hx-get="/api/crm/accounts/search" hx-trigger="load">
                        <option value="" data-i18n="tickets-select-account">Select account...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" data-i18n="tickets-contact">Contact</label>
                    <select name="contact_id" class="form-select">
                        <option value="" data-i18n="tickets-select-contact">Select contact...</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" data-i18n="tickets-priority">Priority</label>
                    <select name="priority" class="form-select" required>
                        <option value="low" data-i18n="tickets-priority-low">Low</option>
                        <option value="medium" selected data-i18n="tickets-priority-medium">Medium</option>
                        <option value="high" data-i18n="tickets-priority-high">High</option>
                        <option value="urgent" data-i18n="tickets-priority-urgent">Urgent</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" data-i18n="tickets-category">Category</label>
                    <select name="category" class="form-select" required>
                        <option value="technical" data-i18n="tickets-category-technical">Technical</option>
                        <option value="billing" data-i18n="tickets-category-billing">Billing</option>
                        <option value="general" data-i18n="tickets-category-general">General</option>
                        <option value="feature" data-i18n="tickets-category-feature">Feature Request</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" data-i18n="tickets-description">Description</label>
                <textarea name="description" class="form-textarea" required rows="5" placeholder="Describe the issue in detail..." data-i18n-placeholder="tickets-description-placeholder" hx-post="/api/ui/tickets/ai-suggest" hx-trigger="blur delay:500ms" hx-target="#ai-suggestions"></textarea>
            </div>
            <div id="ai-suggestions" class="ai-suggestions"></div>
            <div class="form-actions">
                <button type="button" class="form-btn secondary" onclick="closeTicketsModal()" data-i18n="common-cancel">Cancel</button>
                <button type="submit" class="form-btn primary" data-i18n="tickets-create-case">Create Case</button>
            </div>
        </form>
    </div>
</div>
