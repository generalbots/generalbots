<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Shared document</title>
    <link rel="stylesheet" href="/suite/docs/shared.css" />
</head>
<body class="docs-shared-body">
    <!-- #2253 — a share link is opened by a reader with no session. This page
         is deliberately standalone: no desktop shell, no toolbar, no editor. -->
    <header class="docs-shared-bar">
        <span class="docs-shared-title" id="sharedTitle">Shared document</span>
        <span class="docs-shared-badge" id="sharedBadge" hidden>Read-only</span>
    </header>

    <main class="docs-shared-main">
        <p class="docs-shared-state" id="sharedState" role="status">Loading shared document…</p>
        <div class="docs-shared-pages" id="sharedPages" hidden>
            <article class="docs-shared-doc" id="sharedDoc" contenteditable="false" spellcheck="false"></article>
        </div>
    </main>

    <footer class="docs-shared-footer" id="sharedFooter">
        <span id="sharedNotice">This document was shared as a read-only link.</span>
    </footer>

    <script src="/suite/docs/shared-viewer.js"></script>
</body>
</html>
