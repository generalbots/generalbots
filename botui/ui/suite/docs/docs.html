<link rel="stylesheet" href="/suite/css/suite.css" />

<div class="docs-app" id="docs-app" data-touch-target="self">
    <div class="docs-toolbar">
        <div class="toolbar-left">
            <input type="text" class="docs-title-input" id="docTitle" value="Untitled Document" spellcheck="false" hx-post="/api/docs/save" hx-trigger="blur changed" hx-vals='{"id":"current","action":"rename"}' hx-swap="none" />
            <span class="save-status" id="saveStatus" style="color:#94a3b8;font-size:12px;margin-left:8px;">All changes saved</span>
        </div>
        <div class="toolbar-center">
            <div class="toolbar-group">
                <button class="btn-icon" id="undoBtn" hx-get="/api/docs/load" hx-vals='{"id":"current","action":"undo"}' hx-swap="none" title="Undo">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
                </button>
                <button class="btn-icon" id="redoBtn" hx-get="/api/docs/load" hx-vals='{"id":"current","action":"redo"}' hx-swap="none" title="Redo">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path></svg>
                </button>
            </div>
            <span class="toolbar-divider"></span>
            <div class="toolbar-group">
                <button class="btn-icon" id="tocBtn" hx-get="/suite/docs/fragments/toc" hx-vals='{"id":"current"}' hx-target="#docs-content" hx-swap="innerHTML" title="Table of Contents">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                </button>
                <button class="btn-icon" id="commentsBtn" onclick="openDocComments()" title="Comments">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                </button>
                <button class="btn-icon" id="trackChangesBtn" hx-get="/suite/docs/fragments/track-changes" hx-vals='{"id":"current"}' hx-target="#docs-content" hx-swap="innerHTML" title="Track Changes">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                </button>
            </div>
            <span class="toolbar-divider"></span>
            <div class="toolbar-group">
                <button class="btn-icon" id="pageBreakBtn" title="Insert Page Break" onclick="window.DocsEditor && window.DocsEditor.insertPageBreak()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="9"></line><line x1="15" y1="3" x2="15" y2="9"></line><line x1="9" y1="15" x2="9" y2="21"></line><line x1="15" y1="15" x2="15" y2="21"></line><line x1="3" y1="9" x2="9" y2="9"></line><line x1="15" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="9" y2="15"></line><line x1="15" y1="15" x2="21" y2="15"></line></svg>
                </button>
                <button class="btn-icon" id="headerFooterBtn" title="Header &amp; Footer" onclick="window.DocsEditor && window.DocsEditor.openHeaderFooterModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="17" x2="21" y2="17"></line></svg>
                </button>
                <button class="btn-icon" id="footnoteBtn" hx-get="/suite/docs/modals/footnote" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Insert Footnote">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h12"></path></svg>
                </button>
                <button class="btn-icon" id="endnoteBtn" hx-get="/suite/docs/modals/endnote" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Insert Endnote">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h12M3 18h18"></path></svg>
                </button>
            </div>
            <span class="toolbar-divider"></span>
            <div class="toolbar-group">
                <button class="btn-icon" id="findReplaceBtn" hx-get="/suite/docs/modals/find-replace" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Find & Replace">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
                <button class="btn-icon" id="printBtn" hx-get="/suite/docs/forms/print" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Print">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                </button>
                <button class="btn-icon" id="compareBtn" hx-get="/suite/docs/modals/compare" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Compare Documents">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg>
                </button>
            </div>
            <span class="toolbar-divider"></span>
            <div class="toolbar-group">
                <button class="btn-icon" id="templateBtn" hx-get="/suite/docs/modals/template" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="From Template">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                </button>
                <button class="btn-icon" id="aiBtn" hx-get="/suite/docs/modals/ai" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="AI Assistant">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                </button>
            </div>
        </div>
        <div class="toolbar-right">
            <div class="collaborators" id="collaborators" data-max-avatars="6"></div>
            <span class="gb-connection-status offline" id="gb-conn-status" style="display:none;"><span class="dot"></span><span class="label">offline</span></span>
            <span id="gb-auth-button"></span>
            <button class="btn-primary" id="shareBtn" hx-get="/suite/docs/modals/share" hx-vals='{"id":"current","name":"Documento"}' hx-target="#modal-container" hx-swap="innerHTML">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                <span>Share</span>
            </button>
        </div>
    </div>

    <div class="docs-main">
        <aside class="docs-sidebar" id="docs-sidebar" style="width:240px;background:#0f172a;border-right:1px solid #334155;display:flex;flex-direction:column;">
            <div class="sidebar-tabs" style="display:flex;border-bottom:1px solid #334155;">
                <button class="sidebar-tab active" data-sidebar-tab="files" style="flex:1;padding:8px;background:#1e293b;color:#f8fafc;border:none;cursor:pointer;font-size:12px;">📁 Arquivos</button>
                <button class="sidebar-tab" data-sidebar-tab="panels" style="flex:1;padding:8px;background:#0f172a;color:#94a3b8;border:none;cursor:pointer;font-size:12px;">📄 Painéis</button>
            </div>
            <div class="sidebar-content" id="sidebar-files" data-sidebar-content="files" hx-get="/api/docs/list" hx-trigger="load" hx-target="this" hx-swap="innerHTML" style="flex:1;overflow-y:auto;"></div>
            <div class="sidebar-content" id="sidebar-panels" data-sidebar-content="panels" style="display:none;flex-direction:column;padding:8px;gap:6px;">
                <button class="sidebar-panel-btn" hx-get="/suite/docs/fragments/outline" hx-vals='{"id":"current"}' hx-target="#docs-content" hx-swap="innerHTML" style="padding:8px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;cursor:pointer;text-align:left;font-size:12px;">📑 Outline</button>
                <button class="sidebar-panel-btn" hx-get="/suite/docs/fragments/styles" hx-vals='{"id":"current"}' hx-target="#docs-content" hx-swap="innerHTML" style="padding:8px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;cursor:pointer;text-align:left;font-size:12px;">🎨 Estilos</button>
                <button class="sidebar-panel-btn" hx-get="/suite/docs/fragments/footnotes" hx-vals='{"id":"current"}' hx-target="#docs-content" hx-swap="innerHTML" style="padding:8px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;cursor:pointer;text-align:left;font-size:12px;">¹ Notas de Rodapé</button>
                <button class="sidebar-panel-btn" hx-get="/suite/docs/fragments/endnotes" hx-vals='{"id":"current"}' hx-target="#docs-content" hx-swap="innerHTML" style="padding:8px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;cursor:pointer;text-align:left;font-size:12px;">ⁿ Notas Finais</button>
                <button class="sidebar-panel-btn" hx-get="/suite/docs/fragments/toc" hx-vals='{"id":"current"}' hx-target="#docs-content" hx-swap="innerHTML" style="padding:8px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;cursor:pointer;text-align:left;font-size:12px;">🗂 Sumário</button>
                <button class="sidebar-panel-btn" hx-get="/suite/docs/fragments/ai" hx-vals='{"id":"current"}' hx-target="#docs-content" hx-swap="innerHTML" style="padding:8px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;cursor:pointer;text-align:left;font-size:12px;">🤖 Painel IA</button>
            </div>
        </aside>

        <div class="docs-content" id="docs-content" hx-get="/suite/docs/fragments/document-view" hx-vals='{"id":"new"}' hx-trigger="load" hx-swap="innerHTML" style="flex:1;display:flex;flex-direction:column;background:#0f172a;overflow-y:auto;">
        </div>
    </div>

    <div class="docs-status-bar" style="display:flex;justify-content:space-between;padding:6px 16px;background:#0f172a;border-top:1px solid #334155;color:#94a3b8;font-size:11px;">
        <span id="pageCount" style="color:#94a3b8;">1 page</span>
        <span id="doc-stats">Document</span>
    </div>

    <div class="modal-host" id="modal-container"></div>
</div>

<script>
/* Docs collab comments — open threaded comments for the active document. */
function openDocComments() {
    if (!window.GBCollabComments) return;
    var article = document.querySelector("article[contenteditable]");
    var docId = (article && article.dataset && article.dataset.docId) || "current";
    var title = (document.getElementById("docTitle") && document.getElementById("docTitle").value) || "Document";
    window.GBCollabComments.open({
        resourceType: "docs",
        resourceId: String(docId),
        title: "Comments on " + title,
        includeChildren: true,
    });
}
function bindDocsBadge() {
    if (!window.GBCollabComments || !window.GBCollabComments.bindBadge) return;
    var btn = document.getElementById("commentsBtn");
    var article = document.querySelector("article[contenteditable]");
    if (!btn || !article) return;
    var docId = (article.dataset && article.dataset.docId) || "current";
    window.GBCollabComments.bindBadge(btn, {
        resourceType: "docs",
        resourceId: String(docId),
        includeChildren: true,
    });
}
document.addEventListener("htmx:afterSwap", function (e) {
    if (e.target.id === "docs-content") setTimeout(bindDocsBadge, 0);
});
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { setTimeout(bindDocsBadge, 50); });
else setTimeout(bindDocsBadge, 50);
</script>
