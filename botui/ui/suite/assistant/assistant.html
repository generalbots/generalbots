<script>
/* Boot: capture token from URL before anything else renders. */
(function () {
    "use strict";
    try {
        var p = new URLSearchParams(window.location.search);
        var t = p.get("token");
        if (t && t.split(".").length !== 3) {
            localStorage.setItem("gb-access-token", t);
            var u = new URL(window.location.href);
            u.searchParams.delete("token");
            u.searchParams.delete("email");
            u.searchParams.delete("name");
            window.history.replaceState({}, "", u.pathname + u.search + u.hash);
        }
    } catch (e) { /* storage unavailable */ }

    /* Tauri / sidecar origin: when served by the Tauri asset protocol,
       all API and WS calls must target the sidecar HTTP server.
       Preserve any value set before this script (e.g. by the test harness). */
    if (typeof window.__GB_SERVER_ORIGIN__ === "undefined" || window.__GB_SERVER_ORIGIN__ === null) {
        var isAsset =
            window.location.protocol === "tauri:" ||
            window.location.protocol === "asset:" ||
            window.location.hostname === "tauri.localhost";
        window.__GB_SERVER_ORIGIN__ = isAsset ? "http://127.0.0.1:8080" : "";
    }
})();
</script>

                            <rect x="6" y="6" width="12" height="12" rx="2"/>
                        </svg>

            </div>
        </div>
    </div>

    <!-- Settings view -->
    <div id="gbSettingsView" class="gb-settings-view" style="display:none;">
