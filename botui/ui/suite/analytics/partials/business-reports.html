<div class="business-reports-container">
    <div class="reports-tabs">
        <button
            class="report-tab active"
            data-tab="crm"
            onclick="switchReportTab('crm')"
        >
            <span class="tab-icon">👤</span>
            <span data-i18n="crm-title">CRM</span>
        </button>
        <button
            class="report-tab"
            data-tab="billing"
            onclick="switchReportTab('billing')"
        >
            <span class="tab-icon">💰</span>
            <span data-i18n="billing-title">Billing</span>
        </button>
        <button
            class="report-tab"
            data-tab="support"
            onclick="switchReportTab('support')"
        >
            <span class="tab-icon">🎫</span>
            <span data-i18n="tickets-title">Support</span>
        </button>
    </div>

    <div class="report-panels">
        <div hx-get="/suite/analytics/partials/reports-crm.html" hx-trigger="load" hx-swap="outerHTML"></div>
        <div hx-get="/suite/analytics/partials/reports-billing.html" hx-trigger="load" hx-swap="outerHTML"></div>
        <div hx-get="/suite/analytics/partials/reports-support.html" hx-trigger="load" hx-swap="outerHTML"></div>
    </div>
</div>

<link rel="stylesheet" href="/suite/analytics/partials/business-reports-layout.css" />
<link rel="stylesheet" href="/suite/analytics/partials/business-reports-cards.css" />
<link rel="stylesheet" href="/suite/analytics/partials/business-reports-metrics.css" />
<link rel="stylesheet" href="/suite/analytics/partials/business-reports-responsive.css" />

<script src="/suite/analytics/partials/business-reports-tabs.js"></script>
