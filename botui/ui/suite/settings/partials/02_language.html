<div class="gb-state gb-state-error"><span class="gb-state-msg">Service unavailable</span></div>
<script>
                (function () {
                    function initLanguageSelector() {
                        var savedLocale = localStorage.getItem('gb-locale') || 'en';
                        var buttons = document.querySelectorAll('.language-option[data-locale]');

                        buttons.forEach(function (btn) {
                            var locale = btn.dataset.locale;
                            var checkmark = btn.querySelector('.lang-check');

                            if (locale === savedLocale && checkmark) {
                                btn.style.borderColor = '#3b82f6';
                                btn.style.background = 'rgba(59, 130, 246, 0.1)';
                                checkmark.style.opacity = '1';
                            }

                            btn.addEventListener('mouseover', function () {
                                if (!btn.disabled) {
                                    btn.style.borderColor = '#3b82f6';
                                }
                            });

                            btn.addEventListener('mouseout', function () {
                                if (!btn.disabled && locale !== localStorage.getItem('gb-locale')) {
                                    btn.style.borderColor = '#334155';
                                    btn.style.background = '#0f172a';
                                }
                            });
                        });
                    }

                    function hasUnsavedSettingsChanges() {
                        try {
                            if (window.__gbSettingsDirty) return true;
                            if (typeof window.gbHasUnsavedChanges === 'function' && window.gbHasUnsavedChanges()) {
                                return true;
                            }
                            if (document.querySelector('[data-dirty="true"], .is-dirty, .settings-dirty, .unsaved')) {
                                return true;
                            }
                        } catch (e) {}
                        return false;
                    }

                    function confirmLanguageReload(locale) {
                        if (!hasUnsavedSettingsChanges()) return true;
                        var name = locale === 'pt-BR' ? 'Português (Brasil)' : locale || 'the selected language';
                        return (window.GBModal||{confirm:confirm}).confirm(
                            'Changing the language to ' + name +
                            ' will reload the app. Unsaved changes may be lost. Continue?'
                        );
                    }

                    // #1304 — the <select> calls changeLanguage(value) but only
                    // selectLanguage(locale, element) existed, so choosing a
                    // language threw a ReferenceError and nothing happened.
                    window.changeLanguage = function (locale) {
                        if (!confirmLanguageReload(locale)) return;
                        var element = null;
                        document.querySelectorAll('.language-option[data-locale]').forEach(function (btn) {
                            if (btn.dataset.locale === locale) element = btn;
                        });
                        window.selectLanguage(locale, element);
                    };

                    window.selectLanguage = function (locale, element) {
                        if (!confirmLanguageReload(locale)) return;
                        var buttons = document.querySelectorAll('.language-option[data-locale]');
                        buttons.forEach(function (btn) {
                            btn.style.borderColor = '#334155';
                            btn.style.background = '#0f172a';
                            var check = btn.querySelector('.lang-check');
                            if (check) check.style.opacity = '0';
                        });

                        if (element) {
                            element.style.borderColor = '#3b82f6';
                            element.style.background = 'rgba(59, 130, 246, 0.1)';
                            var check = element.querySelector('.lang-check');
                            if (check) check.style.opacity = '1';
                        }

                        localStorage.setItem('gb-locale', locale);
                        document.documentElement.lang = locale;

                        if (window.showToast) {
                            showToast('Language changed to ' + (locale === 'pt-BR' ? 'Português' : 'English') + '. Reloading...');
                        }

                        setTimeout(function () {
                            location.reload();
                        }, 1000);
                    };

                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', initLanguageSelector);
                    } else {
                        initLanguageSelector();
                    }
                })();
            </script>
