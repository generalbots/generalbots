<div class="gb-state gb-state-error"><span class="gb-state-msg" data-i18n="auto-service-unavailable">Service unavailable</span></div>
<script>
                (function () {
                    function initLanguageSelector() {
                        var savedLocale = localStorage.getItem('gb-locale') || 'en';
                        var buttons = document.querySelectorAll('.language-option[data-locale]');

                        buttons.forEach(function (btn) {
                            var locale = btn.dataset.locale;
                            var checkmark = btn.querySelector('.lang-check');

                            if (locale === savedLocale && checkmark) {
                                btn.style.borderColor = '#3b82f6';
                                btn.style.background = 'rgba(59, 130, 246, 0.1)';
                                checkmark.style.opacity = '1';
                            }

                            btn.addEventListener('mouseover', function () {
                                if (!btn.disabled) {
                                    btn.style.borderColor = '#3b82f6';
                                }
                            });

                            btn.addEventListener('mouseout', function () {
                                if (!btn.disabled && locale !== localStorage.getItem('gb-locale')) {
                                    btn.style.borderColor = '#334155';
                                    btn.style.background = '#0f172a';
                                }
                            });
                        });
                    }

                    function markLanguage(locale) {
                        var buttons = document.querySelectorAll('.language-option[data-locale]');
                        buttons.forEach(function (btn) {
                            btn.style.borderColor = '#334155';
                            btn.style.background = '#0f172a';
                            var check = btn.querySelector('.lang-check');
                            if (check) check.style.opacity = '0';
                        });
                        var active = document.querySelector('.language-option[data-locale="' + locale + '"]');
                        if (active) {
                            active.style.borderColor = '#3b82f6';
                            active.style.background = 'rgba(59, 130, 246, 0.1)';
                            var activeCheck = active.querySelector('.lang-check');
                            if (activeCheck) activeCheck.style.opacity = '1';
                        }
                    }

                    function languageChangedLabel() {
                        if (window.i18n && typeof window.i18n.tOr === 'function') {
                            return window.i18n.tOr('settings-language-changed', 'Language changed');
                        }
                        return 'Language changed';
                    }

                    // #1853 — switch language in place. i18n.setLocale()
                    // retranslates every [data-i18n*] node and dispatches
                    // localeChanged so launchers and window chrome re-render;
                    // a full page reload is only the no-i18n fallback.
                    function applyLocale(locale) {
                        localStorage.setItem('gb-locale', locale);
                        document.documentElement.lang = locale;
                        markLanguage(locale);
                        if (window.i18n && typeof window.i18n.setLocale === 'function') {
                            return window.i18n.setLocale(locale);
                        }
                        location.reload();
                        return Promise.resolve();
                    }

                    // #1304 — the <select> calls changeLanguage(value) but only
                    // selectLanguage(locale, element) existed, so choosing a
                    // language threw a ReferenceError and nothing happened.
                    window.changeLanguage = function (locale) {
                        return window.selectLanguage(locale, null);
                    };

                    window.selectLanguage = function (locale, element) {
                        if (element) markLanguage(locale);
                        applyLocale(locale).then(function () {
                            if (window.showToast) showToast(languageChangedLabel());
                        });
                    };

                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', initLanguageSelector);
                    } else {
                        initLanguageSelector();
                    }
                })();
            </script>

                        </select>
                    </div>
                    <div class="form-group">

                    </div>
                    <div class="form-group">

                            <option value="America/Los_Angeles" data-i18n="auto-los-angeles-gmt-8">Los Angeles (GMT-8)</option>
                            <option value="Europe/London" data-i18n="auto-london-gmt-0">London (GMT+0)</option>
                            <option value="Europe/Paris" data-i18n="auto-paris-gmt-1">Paris (GMT+1)</option>
                            <option value="Asia/Tokyo" data-i18n="auto-tokyo-gmt-9">Tokyo (GMT+9)</option>
                            <option value="UTC">UTC</option>
                        </select>
                    </div>
                    <div class="form-group">
