<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Saas</title>
  <link rel="stylesheet" href="../css/core.css">
  <link rel="stylesheet" href="../css/suite.css">
  <link rel="stylesheet" href="css/saas.css">
</head>
<body class="suite-layout">
  <div class="suite-shell">
    <div class="suite-body saas-auth">
      <div class="saas-auth-card">
        <h1>Create Account</h1>
        <p>Start managing your General Bots organizations</p>
        <form id="signup-form" onsubmit="return doSignup(event)">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8" placeholder="At least 8 characters">
          </div>
          <button type="submit" class="btn-primary btn-block">Create Account</button>
        </form>
        <p class="saas-auth-alt">Already have an account? <a href="/saas/login">Sign in</a></p>
      </div>
    </div>
  </div>
  <script src="js/saas-auth.js"></script>
</body>
</html>
