<div class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="shapeModalTitle" tabindex="-1" id="shapeModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="shapeModalTitle">Insert Shape</h3>
            <button class="btn-close" id="closeShapeModal">×</button>
        </div>
        <div class="modal-body">
            <div class="shape-grid">
                <button
                    class="shape-btn"
                    data-shape="rectangle"
                    title="Rectangle"
                >
                    <svg
                        width="32"
                        height="32"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                    </svg>
                </button>
                <button
                    class="shape-btn"
                    data-shape="rounded"
                    title="Rounded Rectangle"
                >
                    <svg
                        width="32"
                        height="32"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <rect x="3" y="3" width="18" height="18" rx="6"></rect>
                    </svg>
                </button>
                <button class="shape-btn" data-shape="ellipse" title="Ellipse">
                    <svg
                        width="32"
                        height="32"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <ellipse cx="12" cy="12" rx="10" ry="8"></ellipse>
                    </svg>
                </button>
                <button class="shape-btn" data-shape="circle" title="Circle">
                    <svg
                        width="32"
                        height="32"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                </button>
                <button
                    class="shape-btn"
                    data-shape="triangle"
                    title="Triangle"
                >
                    <svg
                        width="32"
                        height="32"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <polygon points="12 2 22 22 2 22"></polygon>
                    </svg>
                </button>
                <button class="shape-btn" data-shape="arrow" title="Arrow">
                    <svg
                        width="32"
                        height="32"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
                <button class="shape-btn" data-shape="star" title="Star">
                    <svg
                        width="32"
                        height="32"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <polygon
                            points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                        ></polygon>
                    </svg>
                </button>
                <button class="shape-btn" data-shape="line" title="Line">
                    <svg
                        width="32"
                        height="32"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <line x1="4" y1="20" x2="20" y2="4"></line>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>
