<div class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="backgroundModalTitle" tabindex="-1" id="backgroundModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="backgroundModalTitle">Slide Background</h3>
            <button class="btn-close" id="closeBackgroundModal">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Background Color</label>
                <input type="color" id="bgColor" value="#ffffff" />
            </div>
            <div class="form-group">
                <label>Or use an image URL</label>
                <input
                    type="url"
                    id="bgImageUrl"
                    placeholder="https://example.com/background.jpg"
                />
            </div>
            <div class="modal-actions">
                <button
                    class="btn-secondary"
                    id="cancelBackgroundBtn"
                >
                    Cancel
                </button>
                <button class="btn-primary" id="applyBgBtn">Apply</button>
            </div>
        </div>
    </div>
</div>
