<div class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="notesModalTitle" tabindex="-1" id="notesModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="notesModalTitle">Speaker Notes</h3>
            <button class="btn-close" id="closeNotesModal">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <textarea
                    id="speakerNotes"
                    rows="8"
                    placeholder="Add your speaker notes here..."
                ></textarea>
            </div>
            <div class="modal-actions">
                <button
                    class="btn-secondary"
                    id="cancelNotesBtn"
                >
                    Cancel
                </button>
                <button class="btn-primary" id="saveNotesBtn">
                    Save Notes
                </button>
            </div>
        </div>
    </div>
</div>
