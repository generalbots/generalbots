<link rel="stylesheet" href="/suite/css/suite.css" />
<link rel="stylesheet" href="/suite/css/collab.css" />

<div class="slides-app" id="slides-app" data-touch-target="self">
    <div class="slides-toolbar">
        <div class="toolbar-left">
            <input type="text" class="slides-title-input" id="presTitle" value="Untitled Presentation" spellcheck="false" hx-post="/api/slides/save" hx-trigger="blur changed" hx-vals='{"id":"current","action":"rename"}' hx-swap="none" />
            <span class="slides-save-status" id="saveStatus" style="color:#94a3b8;font-size:12px;margin-left:8px;">All changes saved</span>
        </div>
        <div class="toolbar-center">
            <div class="toolbar-group">
                <button class="btn-icon" id="newSlideBtn" hx-get="/suite/slides/modals/new-slide" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="New Slide">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"></rect><line x1="12" y1="6" x2="12" y2="18"></line><line x1="6" y1="12" x2="18" y2="12"></line></svg>
                </button>
                <button class="btn-icon" id="insertTextBtn" hx-get="/suite/slides/forms/add-text" hx-vals='{"id":"current","slide":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Add Text">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
                </button>
                <button class="btn-icon" id="insertImageBtn" hx-get="/suite/slides/forms/add-image" hx-vals='{"id":"current","slide":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Add Image">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                </button>
                <button class="btn-icon" id="insertShapeBtn" hx-get="/suite/slides/forms/add-shape" hx-vals='{"id":"current","slide":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Add Shape">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon></svg>
                </button>
                <div class="quick-shapes" style="display:inline-flex;gap:2px;margin-left:2px;">
                    <button class="btn-icon quick-shape" data-shape="rectangle" title="Insert Rectangle" style="padding:4px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="#3b82f6" stroke="none"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                    </button>
                    <button class="btn-icon quick-shape" data-shape="circle" title="Insert Circle" style="padding:4px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="#3b82f6" stroke="none"><circle cx="12" cy="12" r="9"/></svg>
                    </button>
                    <button class="btn-icon quick-shape" data-shape="triangle" title="Insert Triangle" style="padding:4px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="#3b82f6" stroke="none"><polygon points="12 2 22 22 2 22 12 2"/></svg>
                    </button>
                </div>
                <button class="btn-icon" id="insertChartBtn" hx-get="/suite/slides/forms/add-chart" hx-vals='{"id":"current","slide":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Add Chart">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="12" width="4" height="9"></rect><rect x="10" y="6" width="4" height="15"></rect><rect x="17" y="3" width="4" height="18"></rect></svg>
                </button>
                <button class="btn-icon" id="insertTableBtn" hx-get="/suite/slides/forms/add-table" hx-vals='{"id":"current","slide":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Add Table">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
                </button>
            </div>
            <span class="toolbar-divider"></span>
            <div class="toolbar-group">
                <button class="btn-icon" id="notesBtn" hx-get="/suite/slides/forms/notes" hx-vals='{"id":"current","slide":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Notes">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                </button>
                <button class="btn-icon" id="backgroundBtn" hx-get="/suite/slides/forms/background" hx-vals='{"id":"current","slide":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Background">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
                </button>
                <button class="btn-icon" id="transitionBtn" hx-get="/suite/slides/forms/transition" hx-vals='{"id":"current","slide":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Transition">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 17 18 12 13 7"></polyline><polyline points="6 17 11 12 6 7"></polyline></svg>
                </button>
                <button class="btn-icon" id="animationBtn" hx-get="/suite/slides/forms/animation" hx-vals='{"id":"current","slide":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Animation">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </button>
            </div>
            <div class="toolbar-group" id="rotation-group" style="display:none;">
                <label style="color:#94a3b8;font-size:11px;margin-right:4px;">Rotate</label>
                <input type="number" id="rotationInput" value="0" min="-180" max="180" step="15" style="width:50px;padding:2px 4px;background:#1e293b;border:1px solid #334155;border-radius:4px;color:#f8fafc;font-size:12px;text-align:center;" title="Rotation degrees">
                <span style="color:#94a3b8;font-size:11px;">°</span>
                <button class="btn-icon" id="resetRotationBtn" title="Reset rotation" style="margin-left:2px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
                </button>
            </div>
            <span class="toolbar-divider"></span>
            <div class="toolbar-group">
                <button class="btn-icon" id="themeBtn" hx-get="/suite/slides/fragments/themes" hx-vals='{"id":"current"}' hx-target="#slides-content" hx-swap="innerHTML" title="Theme">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="4"></circle><line x1="21.17" y1="8" x2="12" y2="8"></line><line x1="3.95" y1="6.06" x2="8.54" y2="14"></line><line x1="10.88" y1="21.94" x2="15.46" y2="14"></line></svg>
                </button>
                <button class="btn-icon" id="masterBtn" hx-get="/suite/slides/forms/master" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Master Slide">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                </button>
                <button class="btn-icon" id="exportBtn" hx-get="/suite/slides/forms/export" hx-vals='{"id":"current"}' hx-target="#modal-container" hx-swap="innerHTML" title="Export">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </button>
            </div>
            <span class="toolbar-divider"></span>
            <div class="toolbar-group">
                <button class="btn-icon" id="presenterBtn" hx-get="/suite/slides/fragments/presenter" hx-vals='{"id":"current"}' hx-target="#slides-content" hx-swap="innerHTML" title="Presenter View">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h20M2 21h20M5 3v18M19 3v18"></path><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg>
                </button>
            </div>
        </div>
        <div class="toolbar-right">
            <div class="collaborators" id="collaborators" data-max-avatars="6"></div>
            <span class="gb-connection-status offline" id="gb-conn-status" style="display:none;"><span class="dot"></span><span class="label">offline</span></span>
            <span id="gb-auth-button"></span>
            <button class="btn-icon" id="commentsBtn" onclick="openSlidesComments()" title="Comments">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </button>
            <button class="btn-primary" id="shareBtn" hx-get="/suite/slides/modals/share" hx-vals='{"id":"current","name":"Apresentação"}' hx-target="#modal-container" hx-swap="innerHTML">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                <span>Share</span>
            </button>
        </div>
    </div>

    <div class="slides-main">
        <aside class="slides-sidebar" id="slides-sidebar" style="width:200px;background:#0f172a;border-right:1px solid #334155;display:flex;flex-direction:column;overflow:hidden;">
            <div class="sidebar-tabs" style="display:flex;border-bottom:1px solid #334155;">
                <button class="sidebar-tab active" data-sidebar-tab="thumbs" style="flex:1;padding:8px;background:#1e293b;color:#f8fafc;border:none;cursor:pointer;font-size:12px;">🎞 Slides</button>
                <button class="sidebar-tab" data-sidebar-tab="files" style="flex:1;padding:8px;background:#0f172a;color:#94a3b8;border:none;cursor:pointer;font-size:12px;">📁</button>
            </div>
            <div class="sidebar-content" id="sidebar-thumbs" data-sidebar-content="thumbs" hx-get="/suite/slides/fragments/slide-thumbnails" hx-vals='{"id":"new"}' hx-trigger="load" hx-target="this" hx-swap="innerHTML" style="flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;"></div>
            <div class="sidebar-content" id="sidebar-files" data-sidebar-content="files" hx-get="/api/slides/list" hx-trigger="load" hx-target="this" hx-swap="innerHTML" style="display:none;flex:1;overflow-y:auto;padding:8px;"></div>
        </aside>

        <div class="slides-content" id="slides-content" hx-get="/suite/slides/fragments/presentation-view" hx-vals='{"id":"new"}' hx-trigger="load" hx-swap="innerHTML" style="flex:1;display:flex;flex-direction:column;background:#0f172a;overflow:hidden;">
        </div>
    </div>

    <div class="modal-host" id="modal-container"></div>
</div>

<script>
if (typeof htmx === 'undefined') {
    var s = document.createElement('script');
    s.src = '/suite/js/vendor/htmx.min.js';
    document.body.appendChild(s);
}
</script>

<script>
/* Slides collab comments — open threaded comments for the active deck. */
function openSlidesComments() {
    if (!window.GBCollabComments) return;
    var title = (document.getElementById("presTitle") && document.getElementById("presTitle").value) || "Presentation";
    window.GBCollabComments.open({
        resourceType: "slides",
        resourceId: (window.getSlidesPresentationId && window.getSlidesPresentationId()) || "current",
        title: "Comments on " + title,
        includeChildren: true,
    });
}
function bindSlidesBadge() {
    if (!window.GBCollabComments || !window.GBCollabComments.bindBadge) return;
    var btn = document.getElementById("commentsBtn");
    if (!btn) return;
    window.GBCollabComments.bindBadge(btn, {
        resourceType: "slides",
        resourceId: (window.getSlidesPresentationId && window.getSlidesPresentationId()) || "current",
        includeChildren: true,
    });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bindSlidesBadge);
else bindSlidesBadge();
</script>
