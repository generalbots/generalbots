<link rel="stylesheet" href="governance/governance.css" />

<div class="governance-container" id="governance-app">
  <header class="governance-header">
    <h2>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Agent Governance
    </h2>
    <div class="header-actions">
      <span class="last-updated"
        hx-get="/api/monitoring/timestamp"
        hx-trigger="load, every 5s"
        hx-swap="innerHTML">--</span>
    </div>
  </header>

  <div class="governance-metrics-grid"
    hx-get="/api/governance/metrics"
    hx-trigger="load, every 10s"
    hx-swap="innerHTML">
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading governance data...</p>
    </div>
  </div>

  <div class="governance-sections">
    <div class="section security-section">
      <div class="section-header">
        <h3>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Security Incidents
        </h3>
      </div>
      <div class="incidents-list"
        hx-get="/api/governance/incidents"
        hx-trigger="load, every 15s"
        hx-swap="innerHTML">
        <div class="empty-state">No recent security incidents</div>
      </div>
    </div>

    <div class="section sessions-section">
      <div class="section-header">
        <h3>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="8" rx="2"/>
            <rect x="2" y="14" width="20" height="8" rx="2"/>
          </svg>
          Session Kill Switch
        </h3>
      </div>
      <div class="kill-switch-form">
        <input type="text" id="session-id-input" placeholder="Enter session ID to terminate..." class="session-input"/>
        <input type="text" id="kill-reason-input" placeholder="Reason (optional)" class="reason-input"/>
        <button class="btn-danger" onclick="killSession()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
          Terminate Session
        </button>
        <div id="kill-result" class="kill-result"></div>
      </div>
    </div>
  </div>
</div>

<script src="governance/governance.js"></script>
