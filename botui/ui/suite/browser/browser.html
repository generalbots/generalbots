<link rel="stylesheet" href="/suite/css/browser.css?v=2">
<link rel="stylesheet" href="/suite/css/browser-vm.css?v=1">

<div class="gb-app browser-root" data-gb-app="browser">
    <div class="browser-toolbar">
        <div class="browser-nav-group">
            <button class="browser-nav-btn" id="btn-back" title="Back" disabled>&#8592;</button>
            <button class="browser-nav-btn" id="btn-forward" title="Forward" disabled>&#8594;</button>
            <button class="browser-nav-btn" id="btn-refresh" title="Refresh">&#8635;</button>
            <button class="browser-nav-btn" id="btn-home" title="Home">&#8962;</button>
        </div>
        <div class="browser-url-bar">
            <span class="browser-protocol-icon" id="protocol-icon">&#128274;</span>
            <input type="text" id="browser-url" class="browser-url-input" placeholder="Enter URL or search..." autocomplete="off" spellcheck="false">
            <button class="browser-go-btn" id="btn-go">Go</button>
        </div>
        <div class="browser-toolbar-right">
            <button class="browser-nav-btn" id="btn-screenshot" title="Screenshot">&#128247;</button>
            <button class="browser-nav-btn" id="btn-bookmark" title="Bookmark">&#9734;</button>
            <button class="browser-nav-btn" id="btn-agentic" title="Agentic panel (memory, cited answers, browser driver)">&#129302;</button>
        </div>
    </div>

    <div class="browser-vm-tabs" id="browser-vm-tabs" style="display:none">
        <span class="browser-vm-tabs-label" data-i18n="auto-vm-tabs">VM tabs</span>
        <div class="browser-vm-tabs-list" id="browser-vm-tabs-list"></div>
        <span class="browser-vm-tabs-hint" id="browser-vm-tabs-hint" data-i18n="auto-shared-across-conversations">Shared across conversations</span>
    </div>

    <div class="browser-agentic-panel" id="browser-agentic-panel" style="display:none">
        <div class="browser-agentic-tabs">
            <button class="browser-agentic-tab active" data-tab="chips" data-i18n="monitoring-memory">Memory</button>
            <button class="browser-agentic-tab" data-tab="driver" data-i18n="auto-driver">Driver</button>
        </div>
        <div class="browser-agentic-body" id="browser-agentic-body"></div>
    </div>

    <div class="browser-tabs-bar" id="browser-tabs-bar">
        <div class="browser-tab active" data-idx="0">
            <span class="browser-tab-title" data-i18n="auto-new-tab">New Tab</span>
            <span class="browser-tab-close" onclick="GBBrowser.closeTab(0)">&times;</span>
        </div>
        <button class="browser-tab-add" onclick="GBBrowser.addTab()">+</button>
    </div>

    <div class="browser-viewport" id="browser-viewport">
        <div class="browser-page active" data-page="0">
            <div class="browser-start-page">
                <div class="browser-start-logo">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                </div>
                <h2 class="browser-start-title">GB Browser</h2>
                <div class="browser-search-box">
                    <input type="text" id="browser-search" placeholder="Search the web or enter a URL..." class="browser-search-input">
                    <button class="browser-search-btn" onclick="GBBrowser.navigateSearch()">Search</button>
                </div>
                <div class="browser-quick-links">
                    <div class="browser-quick-link" onclick="GBBrowser.go('https://generalbots.com')">
                        <div class="browser-quick-icon">GB</div>
                        <span>General Bots</span>
                    </div>
                    <div class="browser-quick-link" onclick="GBBrowser.go('https://github.com')">
                        <div class="browser-quick-icon">GH</div>
                        <span>GitHub</span>
                    </div>
                    <div class="browser-quick-link" onclick="GBBrowser.go('https://docs.rs')">
                        <div class="browser-quick-icon">DR</div>
                        <span>docs.rs</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="browser-statusbar">
        <span id="browser-status-text" data-i18n="status-ready">Ready</span>
        <span class="browser-status-sep">|</span>
        <span id="browser-loading-indicator" style="display:none">
            <span class="browser-spinner"></span> Loading...
        </span>
        <span id="browser-page-info"></span>
        <span style="flex:1"></span>
        <span id="browser-security-info"></span>
    </div>
</div>

<div class="gb-state gb-state-loading"><span class="gb-state-msg" data-i18n="crm-loading">Loading…</span></div>
<div class="gb-state gb-state-error"><span class="gb-state-msg" data-i18n="auto-service-unavailable">Service unavailable</span></div>
<script src="/suite/browser/browser-inline.js"></script>
<script src="/suite/browser/vm-tabs.js?v=1"></script>
<script src="/suite/browser/browser-agentic.js?v=1"></script>
