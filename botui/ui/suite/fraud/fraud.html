<link rel="stylesheet" href="/suite/css/palette-tokens.css" />
<link rel="stylesheet" href="/suite/fraud/fraud.css?v=2">
  <div class="gb-app" data-gb-app="fraud">
<header class="header">
    <h1 data-i18n="fraud-engine-title">Motor Anti-Fraude</h1>
    <div class="header-actions">
      <button class="btn btn-primary" id="btnAddRule" data-i18n="fraud-add-rule">+ New Rule</button>
    </div>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="label" data-i18n="fraud-blocked-today">Blocked Today</span>
      <span class="value danger" id="statBlocked">0</span>
    </div>
    <div class="stat-card">
      <span class="label" data-i18n="fraud-review-queue">Review Queue</span>
      <span class="value warning" id="statReview">0</span>
    </div>
    <div class="stat-card">
      <span class="label" data-i18n="fraud-false-positive-rate">False Positive Rate</span>
      <span class="value accent" id="statFalsePositive">0%</span>
    </div>
    <div class="stat-card">
      <span class="label" data-i18n="fraud-transactions-analyzed">Transactions Analyzed</span>
      <span class="value success" id="statAnalyzed">0</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="transactions" data-i18n="fraud-tab-transactions">Transactions</button>
    <button class="tab" data-tab="rules" data-i18n="fraud-tab-rules">Regras</button>
    <button class="tab" data-tab="blocklist" data-i18n="fraud-tab-block">Bloqueio</button>
    <button class="tab" data-tab="reports" data-i18n="fraud-tab-reports">Reports</button>
  </div>

  <div class="content">
    <div class="tab-panel active" id="panel-transactions">
      <div class="table-container">
        <div class="table-header">
          <h3 data-i18n="fraud-transactions-heading">Transactions</h3>
          <div class="table-actions">
            <select id="filterStatus" style="padding:6px 10px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:var(--radius);color:var(--text-primary);font-size:13px;">
              <option value="" data-i18n="fraud-filter-all-statuses">All statuses</option>
              <option value="approved" data-i18n="fraud-status-approved">Approved</option>
              <option value="review" data-i18n="fraud-action-review">Review</option>
              <option value="blocked" data-i18n="fraud-status-blocked">Blocked</option>
            </select>
          </div>
        </div>
        <div id="transactionsTableContainer">
          <div class="loading" role="status" aria-live="polite" data-i18n="status-loading">Loading...</div>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="panel-rules">
      <div class="table-container">
        <div class="table-header">
          <h3 data-i18n="fraud-rules-heading">Detection Rules</h3>
          <button class="btn btn-primary btn-sm" id="btnAddRule2" data-i18n="action-add">+ Add</button>
        </div>
        <div id="rulesTableContainer">
          <div class="loading" role="status" aria-live="polite" data-i18n="status-loading">Loading...</div>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="panel-blocklist">
      <div class="table-container">
        <div class="table-header">
          <h3 data-i18n="fraud-blocklist-heading">Blocklist</h3>
          <button class="btn btn-primary btn-sm" id="btnAddBlocklist" data-i18n="action-add">+ Add</button>
        </div>
        <div id="blocklistTableContainer">
          <div class="loading" role="status" aria-live="polite" data-i18n="status-loading">Loading...</div>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="panel-reports">
      <div class="table-container">
        <div class="table-header">
          <h3 data-i18n="fraud-reports-heading">Reports</h3>
          <button class="btn btn-primary btn-sm" id="btnGerarRelatorio" data-i18n="fraud-generate-report">Generate Report</button>
        </div>
        <div id="reportsContainer">
          <div class="loading" role="status" aria-live="polite" data-i18n="status-loading">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="ruleModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="ruleModalTitle" data-i18n="fraud-new-rule">New Rule</h3>
        <button class="modal-close" data-close="ruleModal" data-i18n-aria-label="action-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label data-i18n="fraud-rule-name-label">Rule Name</label>
          <input type="text" id="ruleName" placeholder="e.g., High suspicious amount" data-i18n-placeholder="fraud-rule-name-placeholder">
        </div>
        <div class="form-group">
          <label data-i18n="fraud-condition-label">Condition</label>
          <input type="text" id="ruleCondition" placeholder="e.g., amount > 10000 AND country != 'BR'" data-i18n-placeholder="fraud-condition-placeholder">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label data-i18n="fraud-action-label">Action</label>
            <select id="ruleAction">
              <option value="flag" data-i18n="fraud-action-flag">Flag</option>
              <option value="block" data-i18n="fraud-action-block">Block</option>
              <option value="review" data-i18n="fraud-action-review">Review</option>
            </select>
          </div>
          <div class="form-group">
            <label data-i18n="fraud-priority-label">Priority</label>
            <select id="rulePriority">
              <option value="low" data-i18n="fraud-priority-low">Low</option>
              <option value="medium" data-i18n="fraud-priority-medium">Medium</option>
              <option value="high" data-i18n="fraud-priority-high">High</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close="ruleModal" data-i18n="action-cancel">Cancel</button>
        <button class="btn btn-primary" id="btnSaveRule" data-i18n="action-save">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="blocklistModal">
    <div class="modal">
      <div class="modal-header">
        <h3 data-i18n="fraud-blocklist-add-title">Add to Blocklist</h3>
        <button class="modal-close" data-close="blocklistModal" data-i18n-aria-label="action-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label data-i18n="fraud-type-label">Type</label>
          <select id="blocklistType">
            <option value="email" data-i18n="attendant-channel-email">Email</option>
            <option value="phone" data-i18n="fraud-blocklist-type-phone">Phone</option>
            <option value="ip">IP</option>
          </select>
        </div>
        <div class="form-group">
          <label data-i18n="fraud-value-label">Value</label>
          <input type="text" id="blocklistValue" placeholder="e.g., user@email.com" data-i18n-placeholder="fraud-blocklist-value-placeholder">
        </div>
        <div class="form-group">
          <label data-i18n="fraud-col-reason">Reason</label>
          <input type="text" id="blocklistReason" placeholder="e.g., Confirmed fraud" data-i18n-placeholder="fraud-blocklist-reason-placeholder">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close="blocklistModal" data-i18n="action-cancel">Cancel</button>
        <button class="btn btn-primary" id="btnSaveBlocklist" data-i18n="fraud-add-to-blocklist">Add</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/suite/fraud/fraud.js?v=2"></script>
</div>
