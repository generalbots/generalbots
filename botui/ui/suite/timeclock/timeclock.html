<link rel="stylesheet" href="/suite/css/palette-tokens.css" />
<link rel="stylesheet" href="/suite/timeclock/timeclock.css">
<div class="gb-state gb-state-loading"><span class="gb-state-msg" data-i18n="crm-loading">Loading…</span></div>
<div class="gb-state gb-state-error"><span class="gb-state-msg" data-i18n="timeclock-service-unavailable">Service unavailable</span></div>
<script src="/suite/js/vendor/htmx.min.js"></script>
<script src="/suite/js/vendor/htmx-json-enc.js"></script>

<div class="gb-app tc-container" data-gb-app="timeclock">
    <header class="tc-header">
        <h1 data-i18n="timeclock-title">Electronic Time Clock</h1>
        <div class="tc-header-actions">
            <button class="tc-btn" id="tc-ot-open" data-i18n="timeclock-overtime-request">Request Overtime</button>
            <button class="tc-btn" hx-get="/suite/timeclock/fragments/dashboard" hx-target="#tc-content" hx-swap="innerHTML" data-i18n="timeclock-refresh">Refresh</button>
        </div>
    </header>

    <div class="tc-live-clock">
        <div class="tc-clock-time" id="tc-clock">--:--:--</div>
        <div class="tc-clock-date" id="tc-date">—</div>
        <div class="tc-clock-zone" id="tc-zone" aria-live="polite" data-i18n-aria-label="timeclock-timezone"></div>
    </div>

    <nav class="tc-tabs" role="tablist" aria-label="Time clock sections">
        <button type="button" class="tc-tab active" role="tab" id="tc-tab-dashboard" aria-selected="true" aria-controls="tc-content" tabindex="0" data-tab-trigger="dashboard" hx-get="/suite/timeclock/fragments/dashboard" hx-target="#tc-content" hx-swap="innerHTML" data-i18n="goals-dashboard">Dashboard</button>
        <button type="button" class="tc-tab" role="tab" id="tc-tab-records" aria-selected="false" aria-controls="tc-content" tabindex="-1" data-tab-trigger="records" hx-get="/suite/timeclock/fragments/records" hx-target="#tc-content" hx-swap="innerHTML" data-i18n="timeclock-tab-records">Records</button>
        <button type="button" class="tc-tab" role="tab" id="tc-tab-overtime" aria-selected="false" aria-controls="tc-content" tabindex="-1" data-tab-trigger="overtime" hx-get="/suite/timeclock/fragments/overtime" hx-target="#tc-content" hx-swap="innerHTML" data-i18n="timeclock-tab-overtime">Overtime</button>
        <button type="button" class="tc-tab" role="tab" id="tc-tab-justifications" aria-selected="false" aria-controls="tc-content" tabindex="-1" data-tab-trigger="justifications" hx-get="/suite/timeclock/fragments/justifications" hx-target="#tc-content" hx-swap="innerHTML" data-i18n="timeclock-tab-justifications">Justifications</button>
        <button type="button" class="tc-tab" role="tab" id="tc-tab-schedule" aria-selected="false" aria-controls="tc-content" tabindex="-1" data-tab-trigger="schedule" hx-get="/suite/timeclock/fragments/schedule" hx-target="#tc-content" hx-swap="innerHTML" data-i18n="timeclock-tab-schedule">Schedule</button>
        <button type="button" class="tc-tab" role="tab" id="tc-tab-holidays" aria-selected="false" aria-controls="tc-content" tabindex="-1" data-tab-trigger="holidays" hx-get="/suite/timeclock/fragments/holidays" hx-target="#tc-content" hx-swap="innerHTML" data-i18n="timeclock-tab-holidays">Holidays</button>
        <button type="button" class="tc-tab" role="tab" id="tc-tab-team" aria-selected="false" aria-controls="tc-content" tabindex="-1" data-tab-trigger="team" hx-get="/suite/timeclock/fragments/team" hx-target="#tc-content" hx-swap="innerHTML" data-i18n="timeclock-team">Team</button>
        <button type="button" class="tc-tab" role="tab" id="tc-tab-audit" aria-selected="false" aria-controls="tc-content" tabindex="-1" data-tab-trigger="audit" hx-get="/suite/timeclock/fragments/audit" hx-target="#tc-content" hx-swap="innerHTML" data-i18n="timeclock-tab-audit">Audit</button>
        <button type="button" class="tc-tab" role="tab" id="tc-tab-reports" aria-selected="false" aria-controls="tc-content" tabindex="-1" data-tab-trigger="reports" hx-get="/suite/timeclock/fragments/reports" hx-target="#tc-content" hx-swap="innerHTML" data-i18n="timeclock-reports">Reports</button>
    </nav>

    <div class="tc-content" id="tc-content" role="tabpanel" aria-live="polite" aria-labelledby="tc-tab-dashboard" hx-get="/suite/timeclock/fragments/dashboard" hx-trigger="load delay:0" hx-swap="innerHTML"
         data-gb-states="list"
         data-gb-empty-icon="⏱️"
         data-gb-empty-title="timeclock-state-empty-title"
         data-gb-empty-title-fallback="No entries yet"
         data-gb-empty-desc="timeclock-state-empty-desc"
         data-gb-empty-desc-fallback="Clock in and this dashboard shows your day, overtime and approvals.">
        <p class="tc-loading" data-i18n="timeclock-loading-panel">Loading dashboard…</p>
    </div>
</div>

<div id="tc-ot-modal" class="tc-modal" hidden role="dialog" aria-modal="true" aria-labelledby="tc-ot-title">
    <div class="tc-modal-content">
        <h3 id="tc-ot-title" data-i18n="timeclock-overtime-request">Request Overtime</h3>
        <form id="tc-ot-form">
            <label><span data-i18n="timeclock-date">Date</span><input type="date" name="date" required></label>
            <label><span data-i18n="timeclock-hours">Hours</span><input type="number" name="hours" step="0.25" min="0.25" max="12" required></label>
            <label><span data-i18n="timeclock-reason">Reason</span> <textarea name="reason" rows="2" required></textarea></label>
            <label><span data-i18n="timeclock-employee">Employee</span> <input type="text" name="employee_id" data-i18n-placeholder="timeclock-employee-placeholder" required></label>
            <div class="tc-modal-actions">
                <button type="button" class="tc-btn" id="tc-ot-cancel" data-i18n="action-cancel">Cancel</button>
                <button type="submit" class="tc-btn tc-btn-primary" data-i18n="action-submit">Submit</button>
            </div>
        </form>
    </div>
</div>

<p class="tc-status" id="tc-status" role="status" aria-live="polite"></p>

<script src="/suite/timeclock/timeclock.js"></script>
