<!-- Skills Library Card (Issue #481) -->

<!-- Add Account Modal -->

                            </div>

<script>
function showAddAccountModal() {
    document.getElementById('add-account-modal').style.display = 'flex';
}

function hideAddAccountModal() {
    document.getElementById('add-account-modal').style.display = 'none';
    document.getElementById('provider-selection').style.display = 'block';
    document.getElementById('imap-config-form').style.display = 'none';
}

function connectAccount(provider) {
    if (provider === 'google') {
        hideAddAccountModal();
        window.location.href = '/api/oauth/google/authorize';
    } else if (provider === 'microsoft') {
        hideAddAccountModal();
        window.location.href = '/api/oauth/microsoft/authorize';
    } else if (provider === 'imap') {
        document.getElementById('provider-selection').style.display = 'none';
        document.getElementById('imap-config-form').style.display = 'block';
    }
}

function showImapConfigBack() {
    document.getElementById('provider-selection').style.display = 'block';
    document.getElementById('imap-config-form').style.display = 'none';
}

function removeAccount(accountId) {
    if (confirm('Remove this account as a source?')) {
        htmx.ajax('DELETE', '/api/ui/sources/accounts/' + accountId + '/remove', {
            target: '#accounts-list',
            swap: 'innerHTML'
        });
    }
}

            '<div class="skill-card-icon">' + s.icon + '</div>' +
            '<div class="skill-card-body">' +
                '<div class="skill-card-name">' + s.name + '</div>' +
                '<div class="skill-card-description">' + s.description + '</div>' +
            '</div>' +
            '<div class="skill-card-action">' +
                '<button class="btn-install" onclick="installSkill(\'' + s.id + '\', \'' + s.name.replace(/'/g, "\\'") + '\')">Install</button>' +
            '</div>' +
        '</div>';
    }).join('');
    var count = document.getElementById('skills-count');
    if (count) count.textContent = FEATURED_SKILLS.length + ' skills';
}

function getBotId() {
    if (typeof ChatState !== 'undefined' && ChatState.currentBotId) {
        return ChatState.currentBotId;
    }
    if (document.body && document.body.dataset.botId) {
        return document.body.dataset.botId;
    }
    return 'default';
}

async function installSkill(skillId, skillName) {
    var btn = document.querySelector('[data-skill-id="' + skillId + '"] .btn-install');
    if (btn) {
        btn.disabled = true;
        btn.textContent = 'Installing...';
    }

    try {
        var response = await fetch('/api/skills/install', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: skillId, bot_id: getBotId() })
        });

        if (!response.ok) {
            var errText = await response.text();
            throw new Error(errText || 'HTTP ' + response.status);
        }

        showToast('"' + skillName + '" installed successfully!', 'success');
    } catch (err) {
        console.error('Skill install failed:', err);
        showToast('Failed to install "' + skillName + '": ' + err.message, 'error');
    } finally {
        if (btn) {
            btn.disabled = false;
            btn.textContent = 'Install';
        }
    }
}

function openSkillsLibrary() {
    var modal = document.getElementById('skills-library-modal');
    if (modal) {
        renderSkillsGrid();
        modal.style.display = 'flex';
        var input = document.getElementById('skills-search-input');
        if (input) {
            input.value = '';
            setTimeout(function() { input.focus(); }, 100);
        }
        filterSkills();
    }
}

function hideSkillsLibrary() {
    var modal = document.getElementById('skills-library-modal');
    if (modal) modal.style.display = 'none';
}

function filterSkills() {
    var input = document.getElementById('skills-search-input');
    if (!input) return;
    var q = input.value.toLowerCase();
    document.querySelectorAll('.skill-card').forEach(function(card) {
        var name = (card.dataset.name || '').toLowerCase();
        var desc = (card.dataset.description || '').toLowerCase();
        card.style.display = (!q || name.indexOf(q) !== -1 || desc.indexOf(q) !== -1) ? '' : 'none';
    });
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        var modal = document.getElementById('skills-library-modal');
        if (modal && modal.style.display === 'flex') {
            hideSkillsLibrary();
        }
    }
});

function showToast(message, type) {
    if (type === undefined) type = 'success';
    var toast = document.createElement('div');
    toast.className = 'toast toast-' + type;
    toast.textContent = message;
    if (type === 'error') toast.style.background = '#dc3545';
    toast.style.cssText = 'position: fixed; bottom: 24px; right: 24px; padding: 0.75rem 1.25rem; border-radius: 0.5rem; color: white; font-size: 0.875rem; z-index: 9999; opacity: 0; transition: opacity 0.3s; ' + (type === 'error' ? 'background: #dc3545;' : 'background: var(--primary, #22c55e); color: var(--primary-text, #000);');
    document.body.appendChild(toast);
    requestAnimationFrame(function() { toast.style.opacity = '1'; });
    setTimeout(function() {
        toast.style.opacity = '0';
        setTimeout(function() { toast.remove(); }, 300);
    }, 3500);
}

// expose for inline onclick
window.openSkillsLibrary = openSkillsLibrary;
window.hideSkillsLibrary = hideSkillsLibrary;
window.filterSkills = filterSkills;
window.installSkill = installSkill;
</script>
