<!-- =============================================================================
     WORKSPACE APP - Notion-style Pages & Blocks
     Respects Theme Manager - No hardcoded theme
     ============================================================================= -->

<div class="gb-app workspace-app" data-gb-app="workspace">
    <!-- Sidebar -->
    <aside class="workspace-sidebar">
        <div class="sidebar-header">
            <h2 data-i18n="workspace-title">Workspace</h2>
            <button
                class="btn-icon"
                id="new-page-btn"
                title="New Page"
                hx-post="/api/ui/workspaces/current/pages"
                hx-vals='{"title": "Untitled"}'
                hx-target="#page-tree"
                hx-swap="beforeend"
            >
                <span>+</span>
            </button>
        </div>

        <div class="sidebar-search">
            <input
                type="search"
                placeholder="Search pages..."
                data-i18n-placeholder="workspace-search-pages"
                hx-get="/api/ui/workspaces/current/search"
                hx-trigger="keyup changed delay:300ms"
                hx-target="#search-results"
                hx-swap="innerHTML"
                name="q"
            />
            <div id="search-results" class="search-results"></div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section">
                <h3 data-i18n="workspace-recent">Recent</h3>
                <div
                    id="recent-pages"
                    hx-get="/api/ui/workspaces/current/pages?filter=recent"
                    hx-trigger="load"
                    hx-swap="innerHTML"
                >
                    <div class="loading-placeholder" data-i18n="label-loading">Loading...</div>
                </div>
            </div>

            <div class="nav-section">
                <h3 data-i18n="workspace-favorites">Favorites</h3>
                <div
                    id="favorite-pages"
                    hx-get="/api/ui/workspaces/current/pages?filter=favorites"
                    hx-trigger="load"
                    hx-swap="innerHTML"
                >
                    <div class="loading-placeholder" data-i18n="label-loading">Loading...</div>
                </div>
            </div>

            <div class="nav-section">
                <h3 data-i18n="workspace-pages">Pages</h3>
                <div
                    id="page-tree"
                    hx-get="/api/ui/workspaces/current/pages"
                    hx-trigger="load, pageCreated from:body, pageDeleted from:body"
                    hx-swap="innerHTML"
                >
                    <div class="loading-placeholder" data-i18n="label-loading">Loading...</div>
                </div>
            </div>
        </nav>

        <div class="sidebar-footer">
            <button
                class="sidebar-btn"
                hx-get="/api/ui/workspaces/current/templates"
                hx-target="#workspace-modal"
                hx-swap="innerHTML"
            >
                <span class="btn-icon">📄</span><span data-i18n="workspace-templates">
                Templates
            </span></button>
            <button
                class="sidebar-btn"
                hx-get="/api/ui/workspaces/current/trash"
                hx-target="#workspace-modal"
                hx-swap="innerHTML"
            >
                <span class="btn-icon">🗑️</span><span data-i18n="workspace-trash">
                Trash
            </span></button>
            <button
                class="sidebar-btn"
                hx-get="/api/ui/workspaces/current/settings"
                hx-target="#workspace-modal"
                hx-swap="innerHTML"
            >
                <span class="btn-icon">⚙️</span><span data-i18n="workspace-settings">
                Settings
            </span></button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="workspace-main">
        <div id="page-content" class="page-content">
            <!-- Page Header -->
            <header class="page-header">
                <div class="page-icon" id="page-icon">📄</div>
                <input
                    type="text"
                    class="page-title"
                    id="page-title"
                    value="Untitled"
                    placeholder="Untitled"
                    hx-put="/api/pages/current"
                    hx-trigger="blur changed"
                    hx-vals='js:{title: document.getElementById("page-title").value}'
                />
                <div class="page-meta">
                    <span class="meta-item" data-i18n="auto-last-edited-just-now">Last edited: just now</span>
                </div>
            </header>

            <!-- Page Body - Block Editor -->
            <div class="page-body">
                <div
                    id="blocks-container"
                    class="blocks-container"
                    hx-get="/api/ui/pages/current/blocks"
                    hx-trigger="load"
                    hx-swap="innerHTML"
                >
                    <!-- Empty state -->
                    <div class="empty-page">
                        <p data-i18n-html="auto-press">Press <kbd>/</kbd> for commands or start typing...</p>
                    </div>
                </div>

                <!-- Slash Command Menu -->
                <div id="slash-menu" class="slash-menu hidden">
                    <div class="slash-menu-header">
                        <span data-i18n="paper-commands">Commands</span>
                    </div>
                    <div
                        class="slash-menu-items"
                        hx-get="/api/ui/workspaces/commands"
                        hx-trigger="load"
                        hx-swap="innerHTML"
                    >
                        <!-- Commands loaded dynamically -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State (no page selected) -->
        <div id="empty-state" class="empty-state hidden">
            <div class="empty-state-icon">📝</div>
            <h2 data-i18n="auto-select-a-page-or-create-a-new-one">Select a page or create a new one</h2>
            <p data-i18n="auto-your-workspace-pages-will-appear-in-the-sidebar">Your workspace pages will appear in the sidebar</p>
            <button
                class="btn-primary"
                hx-post="/api/ui/workspaces/current/pages"
                hx-vals='{"title": "Untitled"}'
                hx-target="#page-tree"
                hx-swap="beforeend"
            >
                <span>+</span> New Page
            </button>
        </div>
    </main>

    <!-- Members Panel (collapsible) -->
    <aside class="members-panel collapsed" id="members-panel">
        <button class="panel-toggle" onclick="toggleMembersPanel()">
            <span>👥</span>
        </button>
        <div class="panel-content">
            <h3 data-i18n="workspace-members">Members</h3>
            <div
                id="members-list"
                hx-get="/api/ui/workspaces/current/members"
                hx-trigger="load"
                hx-swap="innerHTML"
            >
                <div class="loading-placeholder" data-i18n="label-loading">Loading...</div>
            </div>
            <button
                class="btn-secondary btn-sm"
                hx-get="/api/ui/workspaces/current/invite"
                hx-target="#workspace-modal"
                hx-swap="innerHTML"
             data-i18n="auto-invite-members">
                Invite Members
            </button>
        </div>
    </aside>

    <!-- Modal Container -->
    <div id="workspace-modal" class="modal-container"></div>
</div>

<link rel="stylesheet" href="/suite/workspace/workspace-inline.css">

<div class="gb-state gb-state-loading"><span class="gb-state-msg" data-i18n="crm-loading">Loading…</span></div>
<div class="gb-state gb-state-error"><span class="gb-state-msg" data-i18n="auto-service-unavailable">Service unavailable</span></div>
<script src="/suite/workspace/workspace-inline.js"></script>
