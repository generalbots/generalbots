<link rel="stylesheet" href="/suite/automations/automations-board.css?v=1" />
<link rel="stylesheet" href="/suite/automations/automations-run-steps.css?v=1" />

<div class="gb-app auto-app" id="automations-app" data-gb-app="automations">
  <header class="auto-header">
    <div class="auto-title-group">
      <h2 class="auto-title" data-i18n="auto-automations">Automations</h2>
      <span class="auto-subtitle" id="auto-count" aria-live="polite"></span>
    </div>
    <div class="auto-header-actions">
      <span class="auto-poll-dot" id="auto-poll-dot" title="Live updates active"></span>
      <button type="button" id="auto-refresh" class="auto-btn ghost" aria-label="Refresh schedules and runs" data-i18n="action-refresh">Refresh</button>
      <button type="button" id="auto-new" class="auto-btn primary" data-i18n="auto-new-schedule">New Schedule</button>
    </div>
  </header>

  <div class="auto-state" id="auto-state" role="status"></div>

  <div class="auto-board" id="auto-board"></div>

  <section class="auto-section" aria-label="Conversation jobs">
    <div class="auto-section-head">
      <h3 class="auto-section-title" data-i18n="auto-conversation-jobs">Conversation jobs</h3>
      <span class="auto-section-subtitle" data-i18n="auto-cron-systemd-jobs-created-from-conversations">Cron/systemd jobs created from conversations</span>
    </div>
    <div class="auto-conversation-jobs" id="auto-conversation-jobs"></div>
  </section>

  <div class="auto-modal" id="auto-modal" role="dialog" aria-modal="true" aria-labelledby="auto-modal-title">
    <div class="auto-backdrop" data-auto-close="1"></div>
    <div class="auto-modal-box">
      <h3 class="auto-modal-title" id="auto-modal-title" data-i18n="auto-new-schedule">New Schedule</h3>
      <form id="auto-form" novalidate>
        <div class="auto-field">
          <label for="auto-f-title" data-i18n="label-title">Title</label>
          <input type="text" id="auto-f-title" name="title" required maxlength="200"
                 placeholder="Nightly inventory digest" autocomplete="off" />
        </div>
        <div class="auto-field">
          <label for="auto-f-goal" data-i18n="auto-goal">Goal</label>
          <textarea id="auto-f-goal" name="goal" rows="4" required
                    placeholder="Describe the objective the agent must achieve on each run."></textarea>
        </div>
        <div class="auto-field">
          <label for="auto-f-cron" data-i18n="auto-cron-expression-5-fields-min-hour-day-month-weekday">Cron expression (5 fields: min hour day month weekday)</label>
          <input type="text" id="auto-f-cron" name="cron_expr" required maxlength="64"
                 placeholder="*/15 * * * *" autocomplete="off" spellcheck="false" />
          <p class="auto-cron-preview" id="auto-cron-preview" aria-live="polite"></p>
        </div>
        <div class="auto-field-row">
          <div class="auto-field">
            <label for="auto-f-tz" data-i18n="settings-timezone">Timezone</label>
            <select id="auto-f-tz" name="timezone"></select>
          </div>
          <div class="auto-field">
            <label for="auto-f-runtime" data-i18n="auto-max-runtime-seconds">Max runtime (seconds)</label>
            <input type="number" id="auto-f-runtime" name="max_runtime_secs" min="60" max="86400" step="60" value="900" />
          </div>
        </div>
        <fieldset class="auto-field">
          <legend data-i18n="crm-col-delivery">Delivery</legend>
          <div class="auto-chip-row" role="group" aria-label="Delivery channels">
            <label class="auto-chip-toggle"><input type="checkbox" id="auto-f-email" checked /><span data-i18n="attendant-channel-email">Email</span></label>
            <label class="auto-chip-toggle"><input type="checkbox" id="auto-f-sms" /><span>SMS</span></label>
          </div>
        </fieldset>
      </form>
      <div class="auto-modal-actions">
        <button type="button" class="auto-btn danger hidden" id="auto-delete" data-i18n="action-delete">Delete</button>
        <span class="auto-spacer"></span>
        <button type="button" class="auto-btn ghost" data-auto-close="1" data-i18n="action-cancel">Cancel</button>
        <button type="submit" form="auto-form" class="auto-btn primary" id="auto-save" data-i18n="auto-save-schedule">Save Schedule</button>
      </div>
    </div>
  </div>
</div>

<script src="/suite/automations/automations-state.js?v=1"></script>
<script src="/suite/automations/automations-render.js?v=1"></script>
