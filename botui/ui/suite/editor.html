<!-- Editor - General Bots (Code & Text Editor) -->
<!-- The stylesheet MUST be declared with rel="stylesheet" — without it the
     browser never fetches the file and the editor renders unstyled/unusable
     (same bug class as the canvas app fix). -->
<link rel="stylesheet" href="/suite/editor.css?v=3" />


    <div class="gb-app editor-container" data-gb-app="editor">
            <!-- No internal header: the WindowManager window chrome already
                 carries the title bar and the ✕ close button. The filename
                 and dirty indicator still exist for save/status JS logic,
                 kept hidden off-screen. -->
            <span id="editor-filename" style="display:none" data-i18n="paper-untitled">Untitled</span>
            <span class="dirty-indicator" id="dirty-indicator" style="display: none;" title="Unsaved changes"></span>

            <!-- Toolbar -->
            <div class="editor-toolbar">
                <div class="toolbar-group">
                    <button
                        class="btn btn-primary btn-small"
                        onclick="saveEditorFile()">
                        <span class="spinner" id="save-spinner" style="display:none;"></span>
                        💾 Save
                    </button>
                    <button
                        class="btn btn-small"
                        hx-get="/api/editor/save-as"
                        hx-target="#save-dialog"
                        hx-swap="innerHTML" data-i18n="auto-save-as">
                        Save As
                    </button>
                </div>

                <div class="toolbar-group">
                    <button
                        class="btn btn-small"
                        hx-post="/api/editor/undo"
                        hx-target="#editor-content"
                        hx-swap="innerHTML" data-i18n="auto-undo">
                        ↩️ Undo
                    </button>
                    <button
                        class="btn btn-small"
                        hx-post="/api/editor/redo"
                        hx-target="#editor-content"
                        hx-swap="innerHTML" data-i18n="auto-redo">
                        ↪️ Redo
                    </button>
                </div>

                <div class="toolbar-group" id="text-tools">
                    <button
                        class="btn btn-small"
                        hx-post="/api/editor/format"
                        hx-include="#text-editor"
                        hx-target="#text-editor"
                        hx-swap="innerHTML">
                        { } Format
                    </button>
                    <button
                        class="btn btn-small btn-magic"
                        onclick="showMagicPanel()"
                        title="AI Improvements (Ctrl+M)" data-i18n="auto-magic">
                        ✨ Magic
                    </button>
                </div>

                <div class="toolbar-group" id="csv-tools" style="display: none;">
                    <button
                        class="btn btn-small"
                        onclick="csvAddRow()">
                        ➕ Row
                    </button>
                    <button
                        class="btn btn-small"
                        onclick="csvAddColumn()" data-i18n="auto-column">
                        ➕ Column
                    </button>
                </div>
            </div>

            <!-- Magic AI Panel -->
            <div class="magic-panel" id="magic-panel">
                <div class="magic-header">
                    <h3 data-i18n="auto-ai-improvements">✨ AI Improvements</h3>
                    <button class="magic-close" onclick="hideMagicPanel()">×</button>
                </div>
                <div class="magic-content" id="magic-content">
                    <div class="magic-loading" data-i18n="auto-analyzing-code">Analyzing code...</div>
                </div>
            </div>

            <!-- Editor body: workspace explorer + editing column -->
            <div class="editor-body">
                <!-- File tree rooted at the project's dev-VM workspace. Populated
                     by editor-inline-panels.js when opened with a project context; the
                     tree lists the SAME files the LLM edits via chat, so the user
                     can review/edit them before commit (Source Control) or deploy. -->
                <div class="editor-sidebar" id="editor-sidebar" style="display: none;">
                    <div class="editor-sidebar-head">
                        <span id="editor-tree-root" data-i18n="auto-files">FILES</span>
                        <button id="editor-tree-refresh" title="Refresh workspace files">↻</button>
                    </div>
                    <div class="editor-tree" id="editor-tree">
                        <div class="editor-tree-empty" data-i18n="auto-no-project-selected">No project selected.</div>
                    </div>
                </div>

                <div class="editor-main-col">
            <!-- Editor Content - loaded via HTMX based on file type -->
            <div class="editor-content" id="editor-content">
                <!-- Text Editor (default) -->
                <div class="editor-wrapper" id="text-editor-wrapper" style="position: relative;">
                    <textarea
                        class="text-editor"
                        id="text-editor"
                        name="content"></textarea>
                    <div id="monaco-editor" style="width: 100%; height: 100%;"></div>
                </div>

                <!-- CSV Editor — populated dynamically by switchToCsvMode() -->
                <div class="csv-editor" id="csv-editor" style="display: none;"></div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-left">
                    <span id="file-type" data-i18n="auto-plain-text">📄 Plain Text</span>
                    <span>UTF-8</span>
                    <span
                        id="autosave-indicator"
                        class="htmx-indicator"
                        style="font-size: 11px;" data-i18n="label-saving">
                        Saving...
                    </span>
                </div>
                <div class="status-right">
                    <span id="cursor-position" data-i18n="auto-ln-1-col-1">Ln 1, Col 1</span>
                </div>
            </div>
                </div>
            </div>
        </div>

        <!-- Save Dialog (loaded via HTMX) -->
        <div id="save-dialog"></div>

        <!-- Notification -->
        <div class="notification" id="notification"></div>

        <div class="gb-state gb-state-loading"><span class="gb-state-msg" data-i18n="auto-loading-editor">Loading editor…</span></div>
<div class="gb-state gb-state-error"><span class="gb-state-msg" data-i18n="auto-editor-unavailable">Editor unavailable</span></div>
<script src="/suite/editor/modules/01_editor_magic.js?v=3"></script>
<script src="/suite/editor/modules/02_editor_save_csv.js?v=3"></script>
<script src="/suite/editor/modules/03_editor_boot_vibe.js?v=3"></script>
<script src="/suite/editor-inline-monaco.js?v=2"></script>
