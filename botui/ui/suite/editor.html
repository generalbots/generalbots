<!-- Editor - General Bots (Code & Text Editor) -->


    <div class="gb-app editor-container" data-gb-app="editor">
            <!-- Header -->
            <div class="editor-header">
                <div class="editor-title">
                    <span class="editor-title-icon">📝</span>
                    <div>
                        <span class="editor-title-text" id="editor-filename">Untitled</span>
                        <div class="editor-path" id="editor-filepath"></div>
                    </div>
                    <span class="dirty-indicator" id="dirty-indicator" style="display: none;" title="Unsaved changes"></span>
                </div>
                <div>
                    <button class="btn btn-small" onclick="closeEditorWindow()">✕ Close</button>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="editor-toolbar">
                <div class="toolbar-group">
                    <button
                        class="btn btn-primary btn-small"
                        onclick="saveEditorFile()">
                        <span class="spinner" id="save-spinner" style="display:none;"></span>
                        💾 Save
                    </button>
                    <button
                        class="btn btn-small"
                        hx-get="/api/editor/save-as"
                        hx-target="#save-dialog"
                        hx-swap="innerHTML">
                        Save As
                    </button>
                </div>

                <div class="toolbar-group">
                    <button
                        class="btn btn-small"
                        hx-post="/api/editor/undo"
                        hx-target="#editor-content"
                        hx-swap="innerHTML">
                        ↩️ Undo
                    </button>
                    <button
                        class="btn btn-small"
                        hx-post="/api/editor/redo"
                        hx-target="#editor-content"
                        hx-swap="innerHTML">
                        ↪️ Redo
                    </button>
                </div>

                <div class="toolbar-group" id="text-tools">
                    <button
                        class="btn btn-small"
                        hx-post="/api/editor/format"
                        hx-include="#text-editor"
                        hx-target="#text-editor"
                        hx-swap="innerHTML">
                        { } Format
                    </button>
                    <button
                        class="btn btn-small btn-magic"
                        onclick="showMagicPanel()"
                        title="AI Improvements (Ctrl+M)">
                        ✨ Magic
                    </button>
                </div>

                <div class="toolbar-group" id="csv-tools" style="display: none;">
                    <button
                        class="btn btn-small"
                        onclick="csvAddRow()">
                        ➕ Row
                    </button>
                    <button
                        class="btn btn-small"
                        onclick="csvAddColumn()">
                        ➕ Column
                    </button>
                </div>
            </div>

            <!-- Magic AI Panel -->
            <div class="magic-panel" id="magic-panel">
                <div class="magic-header">
                    <h3>✨ AI Improvements</h3>
                    <button class="magic-close" onclick="hideMagicPanel()">×</button>
                </div>
                <div class="magic-content" id="magic-content">
                    <div class="magic-loading">Analyzing code...</div>
                </div>
            </div>

            <!-- Editor Content - loaded via HTMX based on file type -->
            <div class="editor-content" id="editor-content">
                <!-- Text Editor (default) -->
                <div class="editor-wrapper" id="text-editor-wrapper" style="position: relative;">
                    <textarea
                        class="text-editor"
                        id="text-editor"
                        name="content"></textarea>
                    <div id="monaco-editor" style="width: 100%; height: 100%;"></div>
                </div>

                <!-- CSV Editor — populated dynamically by switchToCsvMode() -->
                <div class="csv-editor" id="csv-editor" style="display: none;"></div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-left">
                    <span id="file-type">📄 Plain Text</span>
                    <span>UTF-8</span>
                    <span
                        id="autosave-indicator"
                        class="htmx-indicator"
                        style="font-size: 11px;">
                        Saving...
                    </span>
                </div>
                <div class="status-right">
                    <span id="cursor-position">Ln 1, Col 1</span>
                </div>
            </div>
        </div>

        <!-- Save Dialog (loaded via HTMX) -->
        <div id="save-dialog"></div>

        <!-- Notification -->
        <div class="notification" id="notification"></div>

        <div class="gb-state gb-state-loading"><span class="gb-state-msg">Loading editor…</span></div>
<div class="gb-state gb-state-error"><span class="gb-state-msg">Editor unavailable</span></div>
<script src="/suite/editor-inline.p1.js?v=1"></script>
<script src="/suite/editor-inline.p2.js?v=1"></script>
