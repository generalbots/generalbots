<link rel="stylesheet" href="/ui/suite/css/common.css">
<link rel="stylesheet" href="/ui/suite/desktop/desktop.css">
<script src="/suite/js/vendor/htmx.min.js"></script>
    <div class="vdi-container">
        <header class="vdi-header">
            <div class="vdi-header-left">
                <h1>Desktop VDI</h1>
            </div>
            <div class="vdi-header-right">
                <span class="session-badge" id="session-count" style="display:none">0</span>
                <button class="btn btn-primary" id="btn-new-connection">+ New Connection</button>
            </div>
        </header>

        <div class="vdi-body" id="vdi-body">
            <section class="vdi-connections" id="connections-section">
                <div class="quick-connect">
                    <input type="text" id="quick-host" placeholder="host:port (e.g., 10.0.0.1:5900)" class="input-field">
                    <button class="btn btn-primary" id="btn-quick-connect">Connect</button>
                </div>

                <div class="connections-grid" id="connections-grid">
                    <div class="connection-card empty-state">
                        <p>No saved connections. Create one or use Quick Connect above.</p>
                    </div>
                </div>
            </section>

            <section class="vdi-session" id="session-section" style="display:none">
                <div class="session-toolbar">
                    <button class="toolbar-btn" id="btn-fullscreen" title="Fullscreen">&#x26F6;</button>
                    <button class="toolbar-btn" id="btn-clipboard" title="Clipboard Sync">&#x1F4CB;</button>
                    <button class="toolbar-btn" id="btn-ctrl-alt-del" title="Ctrl+Alt+Del">CAD</button>
                    <select id="resolution-select" class="toolbar-select">
                        <option value="auto">Auto</option>
                        <option value="1024x768">1024x768</option>
                        <option value="1280x720">1280x720</option>
                        <option value="1920x1080">1920x1080</option>
                    </select>
                    <select id="scaling-select" class="toolbar-select">
                        <option value="scale">Fit to Window</option>
                        <option value="none">Actual Size</option>
                        <option value="stretch">Stretch</option>
                    </select>
                    <button class="btn btn-danger btn-sm" id="btn-disconnect">Disconnect</button>
                </div>
                <div class="vnc-canvas-wrapper" id="vnc-wrapper">
                    <canvas id="vnc-canvas"></canvas>
                    <div class="connection-overlay" id="connection-overlay">
                        <div class="spinner"></div>
                        <span id="connection-status-text">Connecting...</span>
                    </div>
                </div>
                <div class="session-statusbar">
                    <span id="status-fps">FPS: --</span>
                    <span id="status-latency">Latency: --</span>
                    <span id="status-protocol">Protocol: --</span>
                    <span id="status-encoding">Encoding: --</span>
                </div>
            </section>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay" style="display:none">
        <div class="modal" id="new-connection-modal">
            <div class="modal-header">
                <h2>New Connection</h2>
                <button class="modal-close" id="btn-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="conn-name">Connection Name</label>
                    <input type="text" id="conn-name" class="input-field" maxlength="255">
                </div>
                <div class="form-group">
                    <label for="conn-host">Hostname or IP</label>
                    <input type="text" id="conn-host" class="input-field" placeholder="10.0.0.1">
                </div>
                <div class="form-group">
                    <label for="conn-port">Port</label>
                    <input type="number" id="conn-port" class="input-field" value="5900" min="1" max="65535">
                </div>
                <div class="form-group">
                    <label for="conn-protocol">Protocol</label>
                    <select id="conn-protocol" class="input-field">
                        <option value="vnc">VNC</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="conn-auth-type">Authentication</label>
                    <select id="conn-auth-type" class="input-field">
                        <option value="none">None</option>
                        <option value="password" selected>Password</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btn-modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="btn-modal-save">Save & Connect</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="auth-modal-overlay" style="display:none">
        <div class="modal modal-sm" id="auth-modal">
            <div class="modal-header">
                <h2>VNC Authentication</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="auth-password">Password</label>
                    <input type="password" id="auth-password" class="input-field">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="btn-auth-submit">Connect</button>
            </div>
        </div>
    </div>

    <script src="/suite/desktop/desktop.js"></script>
    <script src="desktop/vdi-connection.js"></script>
