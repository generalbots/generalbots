<!-- Content Projector/Player Component -->
<!-- Displays video, images, PDFs, presentations, code, and more -->

<div id="projector-overlay" class="projector-overlay hidden" onclick="closeProjectorOnOverlay(event)">
    <div class="projector-container" onclick="event.stopPropagation()">
        <!-- Header -->
        <div class="projector-header">
            <div class="projector-title-section">
                <span class="projector-icon" id="projector-icon">🎬</span>
                <span class="projector-title" id="projector-title" data-i18n="projector-title">Content Viewer</span>
            </div>
            <div class="projector-actions">
                <button class="projector-btn" onclick="toggleFullscreen()" title="Fullscreen" data-i18n-title="player-fullscreen" aria-label="Fullscreen" data-i18n-aria-label="player-fullscreen">
                    <span id="fullscreen-icon">⛶</span>
                </button>
                <button class="projector-btn" onclick="downloadContent()" title="Download" data-i18n-title="action-download" aria-label="Download" data-i18n-aria-label="action-download">
                    ⬇️
                </button>
                <button class="projector-btn" onclick="shareContent()" title="Share" data-i18n-title="action-share" aria-label="Share" data-i18n-aria-label="action-share">
                    🔗
                </button>
                <button class="projector-btn close-btn" onclick="closeProjector()" data-i18n-title="action-close" data-i18n-aria-label="action-close">
                    ✕
                </button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="projector-content" id="projector-content">
            <!-- Dynamic content loaded here -->
            <div class="projector-loading" id="projector-loading">
                <div class="loading-spinner"></div>
                <span data-i18n="projector-loading-content">Loading content...</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="projector-controls" id="projector-controls">
            <!-- Video/Audio Controls -->
            <div class="media-controls hidden" id="media-controls">
                <button class="control-btn" onclick="mediaSeekBack()" title="Back 10s" data-i18n-title="player-seek-back-10" aria-label="Back 10s" data-i18n-aria-label="player-seek-back-10">
                    ⏪
                </button>
                <button class="control-btn play-btn" onclick="togglePlayPause()" id="play-pause-btn" title="Play/Pause" data-i18n-title="player-play-pause" aria-label="Play/Pause" data-i18n-aria-label="player-play-pause">
                    ▶️
                </button>
                <button class="control-btn" onclick="mediaSeekForward()" title="Forward 10s" data-i18n-title="player-seek-forward-10" aria-label="Forward 10s" data-i18n-aria-label="player-seek-forward-10">
                    ⏩
                </button>
                <div class="progress-container">
                    <input type="range" class="progress-bar" id="progress-bar" min="0" max="100" value="0"
                        oninput="seekTo(this.value)">
                    <span class="time-display" id="time-display">0:00 / 0:00</span>
                </div>
                <button class="control-btn" onclick="toggleMute()" id="mute-btn" title="Mute" data-i18n-title="meet-mute" aria-label="Mute" data-i18n-aria-label="meet-mute">
                    🔊
                </button>
                <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="100"
                    oninput="setVolume(this.value)">
                <button class="control-btn" onclick="toggleLoop()" id="loop-btn" title="Loop" data-i18n-title="player-loop" aria-label="Loop" data-i18n-aria-label="player-loop">
                    🔁
                </button>
                <select class="speed-select" id="speed-select" onchange="setPlaybackSpeed(this.value)">
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                </select>
            </div>

            <!-- Presentation/PDF Controls -->
            <div class="slide-controls hidden" id="slide-controls">
                <button class="control-btn" onclick="prevSlide()" title="Previous" data-i18n-title="action-previous" aria-label="Previous" data-i18n-aria-label="action-previous">
                    ◀️
                </button>
                <span class="slide-info" id="slide-info" data-i18n="projector-slide-info">Slide 1 of 1</span>
                <button class="control-btn" onclick="nextSlide()" title="Next" data-i18n-title="action-next" aria-label="Next" data-i18n-aria-label="action-next">
                    ▶️
                </button>
                <div class="slide-nav">
                    <input type="number" id="slide-input" min="1" value="1" onchange="goToSlide(this.value)">
                </div>
                <button class="control-btn" onclick="zoomIn()" title="Zoom In" data-i18n-title="viewer-zoom-in" aria-label="Zoom In" data-i18n-aria-label="viewer-zoom-in">
                    🔍+
                </button>
                <button class="control-btn" onclick="zoomOut()" title="Zoom Out" data-i18n-title="viewer-zoom-out" aria-label="Zoom Out" data-i18n-aria-label="viewer-zoom-out">
                    🔍-
                </button>
                <span class="zoom-level" id="zoom-level">100%</span>
            </div>

            <!-- Image Controls -->
            <div class="image-controls hidden" id="image-controls">
                <button class="control-btn" onclick="prevImage()" id="prev-image-btn" title="Previous" data-i18n-title="action-previous" aria-label="Previous" data-i18n-aria-label="action-previous">
                    ◀️
                </button>
                <span class="image-info" id="image-info">1 of 1</span>
                <button class="control-btn" onclick="nextImage()" id="next-image-btn" title="Next" data-i18n-title="action-next" aria-label="Next" data-i18n-aria-label="action-next">
                    ▶️
                </button>
                <button class="control-btn" onclick="zoomIn()" title="Zoom In" data-i18n-title="viewer-zoom-in" aria-label="Zoom In" data-i18n-aria-label="viewer-zoom-in">
                    🔍+
                </button>
                <button class="control-btn" onclick="zoomOut()" title="Zoom Out" data-i18n-title="viewer-zoom-out" aria-label="Zoom Out" data-i18n-aria-label="viewer-zoom-out">
                    🔍-
                </button>
                <button class="control-btn" onclick="rotateImage()" title="Rotate" data-i18n-title="chat-projector-rotate" aria-label="Rotate" data-i18n-aria-label="chat-projector-rotate">
                    🔄
                </button>
                <button class="control-btn" onclick="fitToScreen()" title="Fit to Screen" data-i18n-title="project-fit-to-screen" aria-label="Fit to Screen" data-i18n-aria-label="project-fit-to-screen">
                    📐
                </button>
            </div>

            <!-- Code Controls -->
            <div class="code-controls hidden" id="code-controls">
                <span class="code-info" id="code-info" data-i18n="projector-code-info">code.rs</span>
                <button class="control-btn" onclick="toggleLineNumbers()" title="Line Numbers" data-i18n-title="code-line-numbers" aria-label="Line Numbers" data-i18n-aria-label="code-line-numbers">
                    #️⃣
                </button>
                <button class="control-btn" onclick="toggleWordWrap()" title="Word Wrap" data-i18n-title="code-word-wrap" aria-label="Word Wrap" data-i18n-aria-label="code-word-wrap">
                    ↩️
                </button>

                <button class="control-btn" onclick="copyCode()" title="Copy" data-i18n-title="action-copy" aria-label="Copy" data-i18n-aria-label="action-copy">
                    📋
                </button>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="/suite/css/palette-tokens.css" />
<link rel="stylesheet" href="/suite/chat/projector-views.css?v=1" />
<link rel="stylesheet" href="/suite/chat/projector-responsive.css?v=1" />

<script src="/suite/chat/projector-inline-state.js?v=1"></script>
<script src="/suite/chat/projector-inline-controls.js?v=1"></script>
