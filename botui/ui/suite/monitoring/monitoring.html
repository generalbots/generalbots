<link rel="stylesheet" href="/suite/monitoring/monitoring-base.css?v=1" />
<link rel="stylesheet" href="/suite/monitoring/monitoring-responsive.css?v=1" />

<div class="gb-app monitoring-container" id="monitoring-app" data-gb-app="monitoring">
    <header class="monitoring-header">
        <h2>
            <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                class="header-icon"
            >
                <circle
                    cx="12"
                    cy="12"
                    r="10"
                    stroke="currentColor"
                    stroke-width="1.</h2>5"
                    fill="none"
                    opacity="0.3"
                />
                <circle
                    cx="12"
                    cy="12"
                    r="6.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    fill="none"
                    opacity="0.6"
                />
                <circle cx="12" cy="12" r="2" fill="currentColor" />
                <line
                    x1="12"
                    y1="2"
                    x2="12"
                    y2="5"
                    stroke="currentColor"
                    stroke-width="1.5"
                />
                <line
                    x1="12"
                    y1="19"
                    x2="12"
                    y2="22"
                    stroke="currentColor"
                    stroke-width="1.5"
                />
                <line
                    x1="2"
                    y1="12"
                    x2="5"
                    y2="12"
                    stroke="currentColor"
                    stroke-width="1.5"
                />
                <line
                    x1="19"
                    y1="12"
                    x2="22"
                    y2="12"
                    stroke="currentColor"
                    stroke-width="1.5"
                />
            </svg>
            Monitoring Dashboard
        </h2>
        <div class="header-actions">
            <button class="view-toggle" id="view-toggle" title="Toggle View">
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <rect x="3" y="3" width="7" height="7" />
                    <rect x="14" y="3" width="7" height="7" />
                    <rect x="3" y="14" width="7" height="7" />
                    <rect x="14" y="14" width="7" height="7" />
                </svg>
            </button>
            <span
                class="last-updated"
                hx-get="/api/monitoring/timestamp"
                hx-trigger="load, every 5s"
                hx-swap="innerHTML"
                >--</span
            >
        </div>
    </header>

    <!-- Live System Visualization -->
    <div hx-get="/suite/monitoring/partials/01_live_view.html" hx-trigger="load" hx-swap="outerHTML"></div>

    <!-- Grid View (hidden by default) -->
    <div hx-get="/suite/monitoring/partials/02_grid_view.html" hx-trigger="load" hx-swap="outerHTML"></div>

    <!-- Hidden service status updater -->
    <div
        id="service-status-container"
        style="display: none"
        hx-get="/api/monitoring/services/status"
        hx-trigger="load, every 30s"
        hx-swap="innerHTML"
    ></div>

    <link rel="stylesheet" href="/suite/monitoring/monitoring-base.css?v=1" />
<link rel="stylesheet" href="/suite/monitoring/monitoring-responsive.css?v=1" />
    <div class="gb-state gb-state-loading"><span class="gb-state-msg">Loading…</span></div>
<div class="gb-state gb-state-error"><span class="gb-state-msg">Service unavailable</span></div>
<script src="/suite/monitoring/monitoring.js"></script>
</div>
