<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Concierge</title>
    <link rel="stylesheet" href="/suite/concierge/concierge.css" />
</head>
<body>
    <div class="gb-concierge" id="gb-concierge">
        <div class="concierge-hero">
            <div class="concierge-orb">✦</div>
            <h1>Concierge</h1>
            <p>Describe what you want — I'll plan it and open the right apps.</p>
        </div>
        <div class="concierge-input-row">
            <input type="text" id="conciergeGoal" placeholder="e.g. prepare a CRM report, schedule a meeting, check the weather…" autocomplete="off" />
            <button id="conciergeRun">Run</button>
        </div>
        <div class="concierge-steps" id="conciergeSteps"></div>
        <div class="concierge-history" id="conciergeHistory"></div>
    </div>
    <script src="/suite/concierge/concierge.js"></script>
</body>
</html>
