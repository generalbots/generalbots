<!-- Custom Labels Manager Modal -->
<dialog id="labels-modal" class="modal">
    <div class="gb-app modal-content modal-small" data-gb-app="mail">
        <div class="modal-header">
            <h2 data-i18n="auto-manage-labels">Manage Labels</h2>
            <button class="icon-btn" onclick="document.getElementById('labels-modal').close()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="form-group">
            <label data-i18n="auto-label-name">Label Name</label>
            <input type="text" id="new-label-name" placeholder="e.g. Work" style="width:100%; box-sizing:border-box; padding:8px;" required />
        </div>
        <div class="form-group" style="margin-top:1rem;">
            <label data-i18n="auto-color">Color</label>
            <input type="color" id="new-label-color" value="#3b82f6" style="width:100%; height:40px; padding:0; cursor:pointer;" />
        </div>
        <div class="modal-footer" style="margin-top:1.5rem;">
            <button class="btn-secondary" onclick="document.getElementById('labels-modal').close()" data-i18n="action-cancel">Cancel</button>
            <button class="btn-primary" onclick="saveLabel()" data-i18n="action-create">Create</button>
        </div>
    </div>
</dialog>

<!-- Templates Modal -->
<dialog id="templates-modal" class="modal">

    </div>
</dialog>

<!-- Auto-Responder Modal -->
<dialog id="autoresponder-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 data-i18n="auto-automatic-replies">Automatic Replies</h2>
            <button class="icon-btn" onclick="closeAutoResponder()">
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <form
            id="autoresponder-form"
            hx-post="/api/ui/email/auto-responder"
            hx-swap="none"
        >
            <div class="form-group">
                <label class="toggle-label">
                    <input
                        type="checkbox"
                        name="enabled"
                        id="autoresponder-enabled"
                    />
                    <span class="toggle-switch"></span>
                    <span data-i18n="auto-send-automatic-replies">Send automatic replies</span>
                </label>
            </div>
            <div class="form-group">
                <label data-i18n="auto-start-date">Start date</label>
                <input
                    type="datetime-local"
                    name="start_date"
                    id="autoresponder-start"
                />
            </div>
            <div class="form-group">
                <label data-i18n="auto-end-date">End date</label>
                <input
                    type="datetime-local"
                    name="end_date"
                    id="autoresponder-end"
                />
            </div>
            <div class="form-group">
                <label data-i18n="tickets-subject">Subject</label>
                <input
                    type="text"
                    name="subject"
                    value="Out of Office"
                    placeholder="Reply subject"
                />
            </div>
            <div class="form-group">
                <label data-i18n="email-body">Message</label>
                <textarea
                    name="body"
                    rows="6"
                    placeholder="Your automatic reply message..."
                ></textarea>
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="internal_only" />
                    <span data-i18n="auto-send-only-to-people-in-my-organization">Send only to people in my organization</span>
                </label>
            </div>
        </form>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeAutoResponder()" data-i18n="action-cancel">
                Cancel
            </button>
            <button class="btn-primary" onclick="saveAutoResponder()" data-i18n="action-save">
                Save
            </button>
        </div>
    </div>
</dialog>
