            <div class="compose-toolbar">
                <button
                    type="button"
                    class="toolbar-btn"
                    title="Bold"
                    onclick="formatText('bold')"
                >
                    <b>B</b>
                </button>
                <button
                    type="button"
                    class="toolbar-btn"
                    title="Italic"
                    onclick="formatText('italic')"
                >
                    <i>I</i>
                </button>
                <button
                    type="button"
                    class="toolbar-btn"
                    title="Underline"
                    onclick="formatText('underline')"
                >
                    <u>U</u>
                </button>
                <span class="toolbar-divider"></span>
                <button
                    type="button"
                    class="toolbar-btn"
                    title="Bullet list"
                    onclick="formatText('insertUnorderedList')"
                >
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"

                        stroke="currentColor"

                        <line x1="8" y1="6" x2="21" y2="6" />
                        <line x1="8" y1="12" x2="21" y2="12" />

                        <line x1="3" y1="18" x2="3.01" y2="18" />
                    </svg>
                </button>
                <button
                    type="button"
                    class="toolbar-btn"
                    title="Numbered list"
                    onclick="formatText('insertOrderedList')"
                >
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <line x1="10" y1="6" x2="21" y2="6" />
                        <line x1="10" y1="12" x2="21" y2="12" />
                        <line x1="10" y1="18" x2="21" y2="18" />

                </button>
                <span class="toolbar-divider"></span>
                <button
                    type="button"
                    class="toolbar-btn"
                    title="Attach file"
                    onclick="attachFile()"
                >
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
                        />
                    </svg>
                </button>
                <button
                    type="button"
                    class="toolbar-btn"
                    title="Insert link"
                    onclick="insertLink()"
                >
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                        />
                        <path
                            d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                        />
                    </svg>
                </button>
                <button
                    type="button"
                    class="toolbar-btn"
                    title="Insert image"
                    onclick="insertImage()"
                >
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <rect
                            x="3"
                            y="3"
                            width="18"
                            height="18"
                            rx="2"
                            ry="2"
                        />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                </button>
                <span class="toolbar-divider"></span>
                <button
                    type="button"
                    class="toolbar-btn"
                    title="Insert template"
                    onclick="showTemplateSelector()"
                >
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <rect
                            x="3"
                            y="3"
                            width="18"
                            height="18"
                            rx="2"
                            ry="2"
                        />
                        <line x1="3" y1="9" x2="21" y2="9" />
                        <line x1="9" y1="21" x2="9" y2="9" />
                    </svg>
                </button>
                <button
                    type="button"
                    class="toolbar-btn"
                    title="Insert signature"
                    onclick="insertSignature()"
                >
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"
                        />

            </div>
