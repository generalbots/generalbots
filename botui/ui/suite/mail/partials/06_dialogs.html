<!-- Templates Modal -->
<dialog id="templates-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 data-i18n="auto-email-templates">Email Templates</h2>
            <button class="icon-btn" onclick="closeTemplates()">
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div
            class="templates-list"
            id="templates-list"
            hx-get="/api/ui/email/templates"
            hx-trigger="load"
            hx-swap="innerHTML"
        >
            <div class="loading-state"><div class="spinner"></div></div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeTemplates()" data-i18n="action-cancel">
                Cancel
            </button>
            <button class="btn-primary" onclick="createNewTemplate()" data-i18n="auto-new-template-2">
                + New Template
            </button>
        </div>
    </div>
</dialog>

<!-- Auto-Responder Modal -->
<dialog id="autoresponder-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 data-i18n="auto-automatic-replies">Automatic Replies</h2>
            <button class="icon-btn" onclick="closeAutoResponder()">
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <form
            id="autoresponder-form"
            hx-post="/api/ui/email/auto-responder"
            hx-swap="none"
        >
            <div class="form-group">
                <label class="toggle-label">
                    <input
                        type="checkbox"
                        name="enabled"
                        id="autoresponder-enabled"
                    />
                    <span class="toggle-switch"></span>
                    <span data-i18n="auto-send-automatic-replies">Send automatic replies</span>
                </label>
            </div>
            <div class="form-group">
                <label data-i18n="auto-start-date">Start date</label>
                <input
                    type="datetime-local"
                    name="start_date"
                    id="autoresponder-start"
                />
            </div>
            <div class="form-group">
                <label data-i18n="auto-end-date">End date</label>
                <input
                    type="datetime-local"
                    name="end_date"
                    id="autoresponder-end"
                />
            </div>
            <div class="form-group">
                <label data-i18n="tickets-subject">Subject</label>
                <input
                    type="text"
                    name="subject"
                    value="Out of Office"
                    placeholder="Reply subject"
                />
            </div>
            <div class="form-group">
                <label data-i18n="email-body">Message</label>
                <textarea
                    name="body"
                    rows="6"
                    placeholder="Your automatic reply message..."
                ></textarea>
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="internal_only" />
                    <span data-i18n="auto-send-only-to-people-in-my-organization">Send only to people in my organization</span>
                </label>
            </div>
        </form>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeAutoResponder()" data-i18n="action-cancel">
                Cancel
            </button>
            <button class="btn-primary" onclick="saveAutoResponder()" data-i18n="action-save">
                Save
            </button>
        </div>
    </div>
</dialog>

<!-- Add Account Modal -->
<dialog id="add-account-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 data-i18n="auto-add-email-account">Add Email Account</h2>
            <button
                class="icon-btn"
                onclick="document.getElementById('add-account-modal').close()"
            >
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <form
            hx-post="/api/email/accounts/add"
            hx-target="#accounts-list"
            hx-swap="innerHTML"
            hx-on::after-request="if(event.detail.successful) document.getElementById('add-account-modal').close()"
        >
            <div class="form-group">
                <label data-i18n="auto-account-name">Account Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Work, Personal, etc."
                    required
                />
            </div>
            <div class="form-group">
                <label data-i18n="auth-email-address">Email Address</label>
                <input
                    type="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                />
            </div>
            <div class="form-group">
                <label data-i18n="auto-imap-server">IMAP Server</label>
                <input
                    type="text"
                    name="imap_server"
                    placeholder="imap.example.com"
                    required
                />
            </div>
            <div class="form-group">
                <label data-i18n="auto-imap-port">IMAP Port</label>
                <input type="number" name="imap_port" value="993" required />
            </div>
            <div class="form-group">
                <label data-i18n="auto-smtp-server">SMTP Server</label>
                <input
                    type="text"
                    name="smtp_server"
                    placeholder="smtp.example.com"
                    required
                />
            </div>
            <div class="form-group">
                <label data-i18n="auto-smtp-port">SMTP Port</label>
                <input type="number" name="smtp_port" value="587" required />
            </div>
            <div class="form-group">
                <label data-i18n="dashboards-username">Username</label>
                <input
                    type="text"
                    name="username"
                    placeholder="username or email"
                    required
                    autocomplete="username"
                />
            </div>
            <div class="form-group">
                <label data-i18n="dashboards-password">Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                />
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="use_ssl" checked />
                    <span data-i18n="auto-use-ssl-tls">Use SSL/TLS</span>
                </label>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn-secondary"
                    onclick="document.getElementById('add-account-modal').close()"
                 data-i18n="action-cancel">
                    Cancel
                </button>
                <button type="submit" class="btn-primary" data-i18n="auto-add-account">Add Account</button>
            </div>
        </form>
    </div>
</dialog>

<dialog id="schedule-modal" class="modal">
    <div class="modal-content modal-small">
        <div class="modal-header">
            <h2 data-i18n="auto-schedule-send">Schedule Send</h2>
            <button class="icon-btn" onclick="closeScheduleModal()">
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div class="schedule-form">
            <div class="form-group">
                <label data-i18n="label-date">Date</label>
                <input type="date" id="schedule-date" min="" />
            </div>
            <div class="form-group">
                <label data-i18n="label-time">Time</label>
                <input type="time" id="schedule-time" value="09:00" />
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeScheduleModal()" data-i18n="action-cancel">
                Cancel
            </button>
            <button class="btn-primary" onclick="confirmSchedule()" data-i18n="auto-schedule">
                Schedule
            </button>
        </div>
    </div>
</dialog>
