<!-- Vibe Deploy specialist — first-class desktop app (#1189). -->
<link rel="stylesheet" href="/suite/vibe/vibe-workbench.css" />
<link rel="stylesheet" href="/suite/vibe/vibe-deploy.css" />
<link rel="stylesheet" href="/suite/vibe/vibe-dialogs.css" />
<link rel="stylesheet" href="/suite/vibe/vibe-stage-panel.css" />

<div class="gb-app vibe-container" id="vibeWindow" data-gb-app="vibe-deploy" style="height:100%">
  <div id="specHost" style="position:absolute; inset:0; overflow-y:auto; padding:16px; box-sizing:border-box;"></div>
  <div class="gb-state gb-state-loading"><span class="gb-state-msg" data-i18n="vibe-deploy-loading">Loading Deploy…</span></div>
</div>

<script src="/suite/vibe/vibe-state.js?v=5"></script>
<script src="/suite/vibe/vibe-broadcast.js?v=1"></script>
<script src="/suite/vibe/vibe-helpers.js?v=12"></script>
<script src="/suite/vibe/vibe-dialogs.js?v=3"></script>
<script src="/suite/vibe/dialog-deploy/01_ui.js?v=6"></script>
<script src="/suite/vibe/dialog-deploy/02_load.js?v=6"></script>
<script src="/suite/vibe/dialog-deploy/03_actions.js?v=6"></script>
<script src="/suite/vibe/dialog-deploy/04_completion.js?v=6"></script>
<script src="/suite/vibe/dialog-deploy/99_register.js?v=6"></script>
<script>
(function () {
    "use strict";
    function params() {
        var p = window.__gbAppParams__ || {};
        var qs = new URLSearchParams(window.location.search);
        if (!p.project && qs.get("project")) p.project = qs.get("project");
        return p;
    }
    function boot() {
        var p = params();
        if (p.project && typeof currentProjectId !== "undefined") currentProjectId = p.project;
        var host = document.getElementById("specHost");
        if (window.VibeDialogs && host) window.VibeDialogs.openInPage("deploy", "Deploy", host);
    }
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
    } else {
        boot();
    }
})();
</script>
