<!-- Vibe Metrics specialist — first-class desktop app (#1189). -->
<link rel="stylesheet" href="/suite/vibe/vibe.p1.css" />
<link rel="stylesheet" href="/suite/vibe/vibe.p2.css" />

<div class="gb-app vibe-container" id="vibeWindow" data-gb-app="vibe-metrics" style="height:100%">
  <div id="vibeMetricsPanel" style="display:flex; position:absolute; inset:0; z-index:5; flex-direction:column; border:none; border-radius:0; background:var(--surface,#14142a);">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 14px; border-bottom:1px solid var(--border,#333); font-size:12px; font-weight:700; color:var(--text,#eee);">
      <span>📊 VIBE METRICS</span>
      <span>
        <button onclick="VibeMetrics && VibeMetrics.refresh()" title="Refresh" style="background:transparent; border:1px solid var(--border,#333); color:var(--text,#eee); border-radius:4px; padding:1px 8px; cursor:pointer;">⟳</button>
      </span>
    </div>
    <div id="vibeMetricsBody" style="flex:1; min-height:0; overflow-y:auto; padding:12px 14px; font-size:12px; color:var(--text,#eee);"></div>
  </div>
  <div class="gb-state gb-state-loading"><span class="gb-state-msg">Loading metrics…</span></div>
</div>

<script src="/suite/vibe/vibe-state.js?v=5"></script>
<script src="/suite/vibe/vibe-broadcast.js?v=1"></script>
<script src="/suite/vibe/vibe-helpers.js?v=7"></script>
<script src="/suite/vibe/vibe-graph.js?v=6"></script>
<script src="/suite/vibe/vibe-metrics.js?v=3"></script>
<script>
(function () {
    "use strict";
    function params() {
        var p = window.__gbAppParams__ || {};
        var qs = new URLSearchParams(window.location.search);
        if (!p.project && qs.get("project")) p.project = qs.get("project");
        return p;
    }
    function boot() {
        var p = params();
        if (p.project && typeof currentProjectId !== "undefined") currentProjectId = p.project;
        if (window.VibeMetrics) window.VibeMetrics.open();
    }
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
    } else {
        boot();
    }
})();
</script>
