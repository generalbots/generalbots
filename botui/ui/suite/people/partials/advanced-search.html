<!-- Advanced Search partial for People app -->
<div class="people-advanced-search" id="people-advanced-search">
  <h3 data-i18n="search-advanced">Advanced Search</h3>
  <form class="adv-search-form" onsubmit="return false;">
    <div class="form-row">
      <label for="adv-search-name" data-i18n="auto-name-contains">Name contains</label>
      <input type="text" id="adv-search-name" placeholder="e.g. Maria" />
    </div>
    <div class="form-row">
      <label for="adv-search-email" data-i18n="attendant-channel-email">Email</label>
      <input type="email" id="adv-search-email" placeholder="maria@acme.com" />
    </div>
    <div class="form-row">
      <label for="adv-search-company" data-i18n="crm-company">Company</label>
      <input type="text" id="adv-search-company" />
    </div>
    <div class="form-row">
      <label for="adv-search-title" data-i18n="auto-job-title">Job title</label>
      <input type="text" id="adv-search-title" />
    </div>
    <div class="form-row">
      <label for="adv-search-tags" data-i18n="auto-tags-comma-separated">Tags (comma separated)</label>
      <input type="text" id="adv-search-tags" placeholder="vip, partner, lead" />
    </div>
    <div class="form-row">
      <label for="adv-search-source" data-i18n="attendant-source">Source</label>
      <select id="adv-search-source">
        <option value="">Any</option>
        <option value="manual" data-i18n="auto-manual">Manual</option>
        <option value="linkedin" data-i18n="crm-source-linkedin">LinkedIn</option>
        <option value="import" data-i18n="auto-csv-import">CSV import</option>
        <option value="crm" data-i18n="auto-crm-sync">CRM sync</option>
      </select>
    </div>
    <div class="form-actions">
      <button type="reset" class="btn-secondary" data-i18n="action-clear">Clear</button>
      <button type="button" id="adv-search-run" class="btn-primary" data-i18n="action-search">Search</button>
    </div>
  </form>
  <div class="adv-search-actions">
    <button class="btn-secondary" id="adv-search-export-csv" data-i18n="compliance-export-csv">Export CSV</button>
    <button class="btn-secondary" id="adv-search-import-csv" data-i18n="auto-import-csv">Import CSV</button>
    <input type="file" id="adv-search-import-input" accept=".csv" hidden />
  </div>
  <table class="data-table" id="adv-search-results">
    <thead>
      <tr>
        <th data-i18n="label-name">Name</th><th data-i18n="attendant-channel-email">Email</th><th data-i18n="crm-company">Company</th><th data-i18n="label-title">Title</th><th data-i18n="dashboards-tags">Tags</th><th data-i18n="attendant-source">Source</th>
      </tr>
    </thead>
    <tbody>
      <tr><td colspan="6" class="empty" data-i18n="auto-run-a-search-to-see-results">Run a search to see results.</td></tr>
    </tbody>
  </table>
</div>
