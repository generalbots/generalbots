<link rel="stylesheet" href="/suite/snapshot/snapshot.p1.css?v=1" />
<div class="gb-snap" id="gb-snap-root">
    <p class="gb-snap-hint">Capture this screen (browser pick share), then download or copy the image.</p>
    <div class="gb-snap-controls">
        <button type="button" class="gb-snap-btn primary" id="gb-snap-capture">Capture screen</button>
        <button type="button" class="gb-snap-btn" id="gb-snap-copy" disabled>Copy</button>
        <button type="button" class="gb-snap-btn" id="gb-snap-download" disabled>Download PNG</button>
    </div>
    <img id="gb-snap-preview" class="gb-snap-preview" alt="Captured screenshot preview" hidden />
</div>
<script src="/suite/snapshot/snapshot.js?v=1"></script>
