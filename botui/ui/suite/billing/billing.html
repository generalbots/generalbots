<!-- Billing - Invoices, Payments & Quotes -->
<!-- Dynamics nomenclature: Quote → Invoice → Payment -->

<link rel="stylesheet" href="/suite/billing/billing.css" />

<div class="billing-container gb-app" data-gb-app="billing">
    <!-- Header -->
    <header class="billing-header">
        <div class="billing-header-left">
            <h1 data-i18n="billing-title">Billing</h1>
            <nav class="billing-tabs">
                <button
                    class="billing-tab active"
                    data-view="invoices"
                    data-i18n="billing-invoices"
                >
                    Invoices
                </button>
                <button
                    class="billing-tab"
                    data-view="payments"
                    data-i18n="billing-payments"
                >
                    Payments
                </button>
                <button
                    class="billing-tab"
                    data-view="quotes"
                    data-i18n="billing-quotes"
                >
                    Quotes
                </button>
                <button
                    class="billing-tab"
                    data-view="inventory"
                    data-i18n="erp-inventory"
                >
                    Inventory
                </button>
                <button
                    class="billing-tab"
                    data-view="gl"
                    data-i18n="erp-gl"
                >
                    GL
                </button>
                <button
                    class="billing-tab"
                    data-view="procurement"
                    data-i18n="erp-procurement"
                >
                    Procurement
                </button>
            </nav>
        </div>
        <div class="billing-header-right">
            <div class="billing-search">
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.35-4.35" />
                </svg>
                <input
                    type="text"
                    placeholder="Search invoices, quotes..."
                    data-i18n-placeholder="billing-search-placeholder"
                    hx-get="/api/ui/billing/search"
                    hx-trigger="keyup changed delay:300ms"
                    hx-target="#billing-search-results"
                />
            </div>
            <button class="btn-primary" id="billing-new-invoice">
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                <span data-i18n="billing-new-invoice">New Invoice</span>
            </button>
        </div>
    </header>

    <!-- Search Results -->
    <div id="billing-search-results" class="billing-search-results"></div>

    <!-- Summary Cards -->
<div id="billingSummarySlot"></div>

    <!-- Invoices View (Default) -->
<div id="billingInvoicesSlot"></div>

    <!-- Payments View -->
    <div id="billing-payments-view" class="billing-view">
        <div class="billing-list-header">
            <div class="list-filters">
                <select
                    hx-get="/api/ui/billing/payments"
                    hx-trigger="change"
                    hx-target="#payments-table-body"
                    hx-include="this"
                    name="method"
                >
                    <option value="all" data-i18n="billing-method-all">
                        All Methods
                    </option>
                    <option value="bank" data-i18n="billing-method-bank">
                        Bank Transfer
                    </option>
                    <option value="card" data-i18n="billing-method-card">
                        Credit Card
                    </option>
                    <option value="pix" data-i18n="billing-method-pix">
                        PIX
                    </option>
                    <option value="boleto" data-i18n="billing-method-boleto">
                        Boleto
                    </option>
                    <option value="cash" data-i18n="billing-method-cash">
                        Cash
                    </option>
                </select>
            </div>
            <button
                class="btn-primary"
                hx-get="/suite/billing/partials/payment-form.html"
                hx-target="#billing-modal-content"
                hx-on::after-request="openBillingModal()"
            >
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                <span data-i18n="billing-record-payment">Record Payment</span>
            </button>
        </div>
        <table class="billing-table">
            <thead>
                <tr>
                    <th data-i18n="billing-col-payment-id">Payment ID</th>
                    <th data-i18n="billing-col-invoice">Invoice</th>
                    <th data-i18n="billing-col-account">Account</th>
                    <th data-i18n="billing-col-date">Date</th>
                    <th data-i18n="billing-col-amount">Amount</th>
                    <th data-i18n="billing-col-method">Method</th>
                    <th data-i18n="billing-col-actions">Actions</th>
                </tr>
            </thead>
            <tbody
                id="payments-table-body"
                hx-get="/api/ui/billing/payments"
                hx-trigger="load"
            ></tbody>
        </table>
    </div>

    <!-- Quotes View -->
    <div id="billing-quotes-view" class="billing-view">
        <div class="billing-list-header">
            <div class="list-filters">
                <select
                    hx-get="/api/ui/billing/quotes"
                    hx-trigger="change"
                    hx-target="#quotes-table-body"
                    hx-include="this"
                    name="status"
                >
                    <option value="all" data-i18n="billing-quote-all">
                        All Quotes
                    </option>
                    <option value="draft" data-i18n="billing-quote-draft">
                        Draft
                    </option>
                    <option value="sent" data-i18n="billing-quote-sent">
                        Sent
                    </option>
                    <option value="accepted" data-i18n="billing-quote-accepted">
                        Accepted
                    </option>
                    <option value="rejected" data-i18n="billing-quote-rejected">
                        Rejected
                    </option>
                    <option value="expired" data-i18n="billing-quote-expired">
                        Expired
                    </option>
                </select>
            </div>
            <button
                class="btn-primary"
                hx-get="/suite/billing/partials/quote-form.html"
                hx-target="#billing-modal-content"
                hx-on::after-request="openBillingModal()"
            >
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                <span data-i18n="billing-new-quote">New Quote</span>
            </button>
        </div>
        <table class="billing-table">
            <thead>
                <tr>
                    <th data-i18n="billing-col-quote-number">Quote #</th>
                    <th data-i18n="billing-col-account">Account</th>
                    <th data-i18n="billing-col-opportunity">Opportunity</th>
                    <th data-i18n="billing-col-date">Date</th>
                    <th data-i18n="billing-col-valid-until">Valid Until</th>
                    <th data-i18n="billing-col-amount">Amount</th>
                    <th data-i18n="billing-col-status">Status</th>
                    <th data-i18n="billing-col-actions">Actions</th>
                </tr>
            </thead>
            <tbody
                id="quotes-table-body"
                hx-get="/api/ui/billing/quotes"
                hx-trigger="load"
            ></tbody>
        </table>
    </div>

    <!-- Inventory View -->
    <div id="billing-inventory-view" class="billing-view">
        <div class="billing-list-header">
            <div class="list-filters">
                <span class="billing-filter-label" data-i18n="erp-inventory">Inventory</span>
            </div>
        </div>
        <div
            id="inventory-content"
            hx-get="/api/ui/billing/inventory"
            hx-trigger="load"
        >
            <!-- Inventory loaded via HTMX -->
        </div>
    </div>

    <!-- GL View -->
    <div id="billing-gl-view" class="billing-view">
        <div class="billing-list-header">
            <div class="list-filters">
                <button
                    class="billing-tab gl-sub"
                    data-gl="accounts"
                    onclick="loadGlView('accounts', this)"
                >
                    Accounts
                </button>
                <button
                    class="billing-tab gl-sub"
                    data-gl="balance-sheet"
                    onclick="loadGlView('balance-sheet', this)"
                >
                    Balance Sheet
                </button>
                <button
                    class="billing-tab gl-sub"
                    data-gl="income-statement"
                    onclick="loadGlView('income-statement', this)"
                >
                    Income Statement
                </button>
            </div>
        </div>
        <div
            id="gl-content"
            hx-get="/api/ui/billing/gl/accounts"
            hx-trigger="load"
        >
            <!-- GL loaded via HTMX -->
        </div>
    </div>

    <!-- Procurement View -->
    <div id="billing-procurement-view" class="billing-view">
        <div class="billing-list-header">
            <div class="list-filters">
                <span class="billing-filter-label" data-i18n="erp-procurement">Purchase Orders</span>
            </div>
        </div>
        <div
            id="procurement-content"
            hx-get="/api/ui/billing/procurement"
            hx-trigger="load"
        >
            <!-- Procurement loaded via HTMX -->
        </div>
    </div>
</div>

<!-- Modal for forms -->
<div id="billing-modal" class="billing-modal">
    <div class="billing-modal-backdrop" onclick="closeBillingModal()"></div>
<div id="billingModalSlot"></div>
</div>

<script src="/suite/billing/billing-templates.js?v=1"></script>
<script>
    (function () {
        // Tab switching
        document.querySelectorAll(".billing-tab").forEach((tab) => {
            tab.addEventListener("click", function () {
                document
                    .querySelectorAll(".billing-tab")
                    .forEach((t) => t.classList.remove("active"));
                document
                    .querySelectorAll(".billing-view")
                    .forEach((v) => v.classList.remove("active"));
                this.classList.add("active");
                const view = this.dataset.view;
                document
                    .getElementById(`billing-${view}-view`)
                    .classList.add("active");
            });
        });

        // New Invoice button
        document
            .getElementById("billing-new-invoice")
            .addEventListener("click", function () {
                htmx.ajax(
                    "GET",
                    "/suite/billing/partials/invoice-form.html",
                    "#billing-modal-content",
                ).then(() => {
                    openBillingModal();
                });
            });

        // Modal functions
        window.openBillingModal = function () {
            document.getElementById("billing-modal").classList.add("open");
        };

        window.closeBillingModal = function () {
            document.getElementById("billing-modal").classList.remove("open");
        };

        window.loadGlView = function (view, btn) {
            document.querySelectorAll(".gl-sub").forEach(function (t) {
                t.classList.remove("active");
            });
            if (btn) btn.classList.add("active");
            htmx.ajax(
                "GET",
                "/api/ui/billing/gl/" + view,
                "#gl-content"
            );
        };

        // Keyboard shortcut: Escape to close modal
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                closeBillingModal();
            }
        });

        // Initialize i18n if available
        if (window.i18n && window.i18n.translatePage) {
            window.i18n.translatePage();
        }
    })();
</script>
