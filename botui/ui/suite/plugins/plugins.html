<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title data-i18n="plugins-title">Plugin Manager</title>
    <link rel="stylesheet" href="/suite/css/palette-tokens.css" />
<link rel="stylesheet" href="/suite/plugins/plugins.css">
    <script src="/suite/js/vendor/htmx.min.js"></script>
    <script src="/suite/js/i18n.js"></script>
    <script src="/suite/js/i18n-elements.js"></script>
</head>
<body>
    <div class="container" data-gb-app="plugins">
        <div class="header">
            <h1 data-i18n="plugins-title">Plugin Manager</h1>
            <button class="btn btn-primary" id="pluginUploadBtn" type="button" data-i18n="plugins-upload-manifest">
                Upload Manifest
            </button>
            <input type="file" id="fileInput" class="file-input" accept=".json">
        </div>
        <div id="plugins-status" class="plugins-status" role="status" aria-live="polite"></div>
        <div id="plugin-list" hx-get="/api/ui/plugins" hx-trigger="load"
             data-gb-states="cards"
             data-gb-empty-icon="🧩"
             data-gb-empty-title="plugins-state-empty-title"
             data-gb-empty-title-fallback="No plugins installed"
             data-gb-empty-desc="plugins-state-empty-desc"
             data-gb-empty-desc-fallback="A plugin adds tools and channels to this bot. Upload a manifest to install one."
             data-gb-empty-action="plugins-state-empty-action"
             data-gb-empty-action-fallback="Upload a manifest"
             data-gb-empty-action-target="pluginUploadBtn">
            <div class="plugins-loading" data-i18n="plugins-loading">Loading plugins...</div>
        </div>
    </div>
    <script>
        (function () {
            "use strict";
            function setStatus(msg, type) {
                var status = document.getElementById("plugins-status");
                if (!status) return;
                status.textContent = "";
                if (!msg) return;
                var notice = document.createElement("div");
                notice.className = "alert " + (type === "success" ? "alert-success" : "alert-warning");
                notice.textContent = msg;
                status.appendChild(notice);
            }
            function showErr(msg) {
                if (window.GBToasts && typeof window.GBToasts.show === "function") {
                    window.GBToasts.show("Plugins", msg, "error");
                    return;
                }
                setStatus(msg, "warning");
            }
            function ensurePluginListContainer() {
                var list = document.getElementById("plugin-list");
                if (list) return list;
                var container = document.querySelector(".container");
                if (!container) return null;
                list = document.createElement("div");
                list.id = "plugin-list";
                container.appendChild(list);
                return list;
            }
            function uploadManifest(input) {
                var file = input && input.files ? input.files[0] : null;
                if (!file) return;
                setStatus("", "success");
                var formData = new FormData();
                formData.append("manifest", file);
                fetch("/api/ui/plugins/upload", {
                    method: "POST",
                    body: formData
                }).then(function (r) {
                    if (!r.ok) {
                        return r.text().then(function (t) {
                            throw new Error("HTTP " + r.status + (t ? ": " + t.slice(0, 120) : ""));
                        });
                    }
                    return r.text();
                }).then(function (html) {
                    var list = ensurePluginListContainer();
                    if (!list) {
                        showErr(window.gbT ? window.gbT("plugins-upload-failed", "Upload failed") : "Upload failed");
                        return;
                    }
                    if (!html || html.indexOf('id="plugin-list"') === -1) {
                        showErr(window.gbT ? window.gbT("plugins-upload-bad-response", "Upload response invalid") : "Upload response invalid");
                        return;
                    }
                    var tpl = document.createElement("template");
                    tpl.innerHTML = html.trim();
                    var root = tpl.content.querySelector("#plugin-list") || (tpl.content.firstElementChild && tpl.content.firstElementChild.id === "plugin-list" ? tpl.content.firstElementChild : null);
                    if (!root) {
                        showErr(window.gbT ? window.gbT("plugins-upload-bad-response", "Upload response invalid") : "Upload response invalid");
                        return;
                    }
                    list.replaceWith(root);
                    if (window.htmx) htmx.process(document.body);
                }).catch(function (e) {
                    var prefix = window.gbT ? window.gbT("plugins-upload-failed", "Upload failed") : "Upload failed";
                    showErr(prefix + ": " + (e && e.message ? e.message : String(e)));
                }).finally(function () {
                    if (input) input.value = "";
                });
            }
            var btn = document.getElementById("pluginUploadBtn");
            var fi = document.getElementById("fileInput");
            if (btn && fi) {
                btn.addEventListener("click", function () { fi.click(); });
                fi.addEventListener("change", function () { uploadManifest(this); });
            }
        })();
    </script>
</body>
</html>
