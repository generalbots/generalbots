<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Store — General Bots</title>
  <link rel="stylesheet" href="css/management.css">
  <style>
    /* ── STORE-SPECIFIC: MoreMins left product nav ── */
    .store-shell {
      display: flex;
      flex: 1;
      min-height: calc(100vh - 56px);
    }

    /* Left: product category menu */
    .store-left {
      width: 280px;
      flex-shrink: 0;
      background: #0f1326;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
    }

    .store-left-header {
      padding: 1.25rem 1.25rem .75rem;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .store-cat-group { border-bottom: 1px solid var(--border); }

    .store-cat-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: .65rem;
      padding: .85rem 1.25rem;
      background: none;
      border: none;
      color: var(--text);
      font-size: .875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: background .15s;
      border-left: 3px solid transparent;
    }
    .store-cat-btn:hover { background: rgba(255,255,255,.04); }
    .store-cat-btn.active {
      color: var(--accent);
      border-left-color: var(--accent);
      background: rgba(108,99,255,.1);
    }
    .store-cat-icon { font-size: 1.1rem; }
    .store-cat-label { flex: 1; }
    .store-cat-arrow {
      font-size: .7rem;
      color: var(--muted);
      transition: transform .2s;
    }
    .store-cat-btn.open .store-cat-arrow { transform: rotate(90deg); }

    .store-sub-items { display: none; background: rgba(0,0,0,.15); }
    .store-sub-items.open { display: block; }

    .store-sub-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .55rem 1.25rem .55rem 3rem;
      background: none;
      border: none;
      border-left: 3px solid transparent;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: all .12s;
    }
    .store-sub-btn:hover { color: var(--text); background: rgba(255,255,255,.03); }
    .store-sub-btn.active {
      color: var(--accent2);
      border-left-color: var(--accent2);
      background: rgba(0,212,170,.06);
      font-weight: 600;
    }

    /* Right: plans/cards */
    .store-right {
      flex: 1;
      overflow-y: auto;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .store-hero {
      background: linear-gradient(135deg, #0f1326 0%, #1a1f3a 60%, #1a0f30 100%);
      border-bottom: 1px solid var(--border);
      padding: 2rem 2.5rem 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 1.5rem;
    }
    .store-hero-icon { font-size: 3rem; line-height: 1; }
    .store-hero-body { flex: 1; }
    .store-hero-tag {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      background: rgba(108,99,255,.15);
      border: 1px solid rgba(108,99,255,.3);
      color: var(--accent);
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: .2rem .6rem;
      border-radius: 99px;
      margin-bottom: .6rem;
    }
    .store-hero-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -.03em;
      color: var(--text);
      margin-bottom: .4rem;
    }
    .store-hero-desc { font-size: .875rem; color: var(--muted); max-width: 560px; line-height: 1.6; }
    .store-hero-bullets {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      margin-top: .9rem;
    }
    .store-hero-bullet {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .8rem;
      color: var(--muted);
    }
    .store-hero-bullet::before { content: '✓'; color: var(--accent2); font-weight: 700; }

    .store-content { padding: 1.5rem 2rem; flex: 1; }

    .store-plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    /* plan card override for store */
    .plan-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem;
      cursor: pointer;
      transition: all .2s;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: .6rem;
    }
    .plan-card:hover {
      border-color: rgba(108,99,255,.5);
      transform: translateY(-3px);
      box-shadow: 0 16px 40px rgba(108,99,255,.18);
    }
    .plan-card.featured {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(108,99,255,.14) 0%, var(--card) 70%);
    }
    .plan-card.featured::after {
      content: 'POPULAR';
      position: absolute;
      top: .75rem; right: .75rem;
      background: linear-gradient(90deg, var(--accent), #8b7cf8);
      color: #fff;
      font-size: .6rem;
      font-weight: 800;
      letter-spacing: .07em;
      padding: .2rem .55rem;
      border-radius: 99px;
    }
    .plan-tier {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .plan-name { font-size: 1.05rem; font-weight: 700; color: var(--text); }
    .plan-price-row { display: flex; align-items: baseline; gap: .3rem; margin: .25rem 0; }
    .plan-amount { font-size: 2rem; font-weight: 800; letter-spacing: -.04em; color: var(--text); }
    .plan-currency { font-size: 1rem; font-weight: 600; color: var(--text); }
    .plan-period { font-size: .78rem; color: var(--muted); }
    .plan-specs { list-style: none; display: flex; flex-direction: column; gap: .35rem; flex: 1; }
    .plan-specs li { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: .4rem; }
    .plan-specs li::before { content: '—'; color: var(--accent2); font-weight: 700; font-size: .75rem; }
    .plan-cta {
      margin-top: .5rem;
      width: 100%;
      padding: .55rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .plan-cta:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .plan-card.featured .plan-cta { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Number search bar */
    .number-search {
      display: flex;
      gap: .75rem;
      margin-bottom: 1.25rem;
      align-items: center;
    }
    .number-search select, .number-search input {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: .875rem;
      padding: .6rem .9rem;
    }
    .number-search select:focus, .number-search input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .number-search select { min-width: 180px; }
    .number-search input { flex: 1; }
    .number-search button { flex-shrink: 0; }

    /* Domain search */
    .domain-search {
      display: flex;
      gap: .75rem;
      margin-bottom: 1.5rem;
    }
    .domain-search input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: .95rem;
      padding: .7rem 1rem;
    }
    .domain-search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,99,255,.2); }

    .domain-tld-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: .75rem;
    }
    .domain-tld-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      transition: all .15s;
    }
    .domain-tld-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .domain-tld-ext { font-size: 1.3rem; font-weight: 800; color: var(--text); }
    .domain-tld-price { font-size: .8rem; color: var(--muted); margin-top: .25rem; }
    .domain-tld-price strong { color: var(--accent2); font-size: .95rem; }

    /* Available numbers table */
    .numbers-table { width: 100%; border-collapse: collapse; }
    .numbers-table th {
      text-align: left;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      padding: .6rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .numbers-table td {
      padding: .75rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,.04);
      font-size: .875rem;
      color: var(--text);
    }
    .numbers-table tr:hover td { background: rgba(255,255,255,.03); }
  </style>
</head>

<script>
// ── Auth helpers (inline, no external dep needed beyond management.js) ──
function requireAuth() {
  const t = localStorage.getItem('management_token');
  if (!t) window.location.href = '/management/login';
  return t;
}
function doLogout() {
  localStorage.removeItem('management_token');
  localStorage.removeItem('management_email');
  window.location.href = '/management';
}
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

    right.innerHTML = `
      ${heroHtml(data)}
      <div class="store-content">
        <div class="number-search">
          <select id="ns-country">
            <option value="US">🇺🇸 United States (+1)</option>
            <option value="GB">🇬🇧 United Kingdom (+44)</option>

            <option value="FR">🇫🇷 France (+33)</option>
            <option value="CA">🇨🇦 Canada (+1)</option>
            <option value="AU">🇦🇺 Australia (+61)</option>
            <option value="MX">🇲🇽 Mexico (+52)</option>
            <option value="ES">🇪🇸 Spain (+34)</option>
            <option value="IT">🇮🇹 Italy (+39)</option>
          </select>

            <option value="all">SMS + Voice</option>
            <option value="sms">SMS only</option>
            <option value="voice">Voice only</option>

        <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:auto" id="number-results">
          <table class="numbers-table">
            <thead><tr><th>Number</th><th>Country</th><th>Capabilities</th><th>Monthly</th><th></th></tr></thead>

  if (data.type === 'domain-search') {
    right.innerHTML = `
      ${heroHtml(data)}

        <div class="domain-search">

          </div>`).join('')}

  if (data.type === 'domain-tlds') {
    right.innerHTML = `
      ${heroHtml(data)}
      <div class="store-content">
        <div class="domain-tld-grid">${TLD_PRICES.map(t=>`
          <div class="domain-tld-card" onclick="orderDomain('${t.ext}')">
            <div class="domain-tld-ext">${t.ext}</div>

function heroHtml(data) {
  return `
    <div class="store-hero">
      <div class="store-hero-icon">${data.icon}</div>

        <div class="store-hero-tag">${data.tag}</div>

        <div class="store-hero-desc">${data.desc}</div>
        <div class="store-hero-bullets">${(data.bullets||[]).map(b=>`<span class="store-hero-bullet">${b}</span>`).join('')}</div>
      </div>
    </div>`;
}

// ── Navigation logic ──
function toggleGroup(btn, subsId) {
  const subs = document.getElementById(subsId);
  const isOpen = subs.classList.contains('open');
  // close all
  document.querySelectorAll('.store-sub-items').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.store-cat-btn').forEach(el => el.classList.remove('open'));
  if (!isOpen) {
    subs.classList.add('open');
    btn.classList.add('open');
  }
  // navigate to first sub or cat default
  const firstSub = subs.querySelector('.store-sub-btn');
  if (firstSub && !isOpen) firstSub.click();
}

function selectProduct(btn, key) {
  document.querySelectorAll('.store-sub-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.store-cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // mark parent as active
  const group = btn.closest('.store-cat-group');
  if (group) group.querySelector('.store-cat-btn').classList.add('active');
  currentProduct = key;
  renderRight(key);
}

// ── Order modal ──
function openOrder(plan) {
  selectedPlan = plan;
  document.getElementById('modal-title').textContent = `Order: ${plan.name}`;
  document.getElementById('modal-body').innerHTML = `
    <div style="background:var(--bg3);border-radius:8px;padding:1rem;margin-bottom:1rem;border:1px solid var(--border)">
      <div style="font-size:1.3rem;font-weight:800;color:var(--text)">${plan.currency}${plan.amount}<small style="font-size:.75rem;font-weight:400;color:var(--muted)"> / ${plan.period}</small></div>
      <ul style="list-style:none;margin-top:.5rem">${plan.specs.map(s=>`<li style="font-size:.82rem;color:var(--muted);padding:.1rem 0">• ${esc(s)}</li>`).join('')}</ul>
    </div>
    <div class="form-group">
      <label class="form-label">Name this service (optional)</label>
      <input id="order-name" class="form-control" type="text" placeholder="e.g. WhatsApp Bot Server">
    </div>`;
  document.getElementById('purchase-modal').classList.add('open');
}

async function confirmOrder() {
  if (!selectedPlan) return;
  const btn = document.getElementById('modal-confirm-btn');
  btn.textContent = 'Processing…';
  btn.disabled = true;
  // Simulate provisioning
  await new Promise(r => setTimeout(r, 1200));
  btn.textContent = 'Confirm & Purchase';
  btn.disabled = false;
  hideModal();
  showToast(`✅ ${selectedPlan.name} provisioned! Check My Services.`);
}

function hideModal() { document.getElementById('purchase-modal').classList.remove('open'); }

// ── Domain helpers ──
let domainTimer;
function domainSearchDebounce() { clearTimeout(domainTimer); domainTimer = setTimeout(searchDomain, 600); }

function searchDomain() {
  const q = document.getElementById('domain-input')?.value?.trim();
  if (!q) return;
  const res = document.getElementById('domain-result');
  if (!res) return;
  // Simulate availability check
  const available = Math.random() > 0.3;
  const domain = q.includes('.') ? q : q + '.com';
  res.innerHTML = `
    <div style="background:var(--card);border:1px solid ${available?'rgba(0,212,170,.3)':'rgba(255,107,107,.3)'};border-radius:var(--radius);padding:1rem;margin-bottom:1rem;display:flex;align-items:center;gap:1rem">
      <span style="font-size:1.5rem">${available?'✅':'❌'}</span>
      <div style="flex:1">
        <div style="font-size:1rem;font-weight:700;color:var(--text)">${esc(domain)}</div>
        <div style="font-size:.82rem;color:var(--muted)">${available?'Available — register now!':'Not available. Try another extension.'}</div>
      </div>
      ${available?`<button class="btn btn-primary btn-sm" onclick="orderDomainName('${esc(domain)}')">Register $21.99/yr</button>`:''}
    </div>`;
}

function orderDomain(ext) {
  selectedPlan = { name: `Domain ${ext}`, amount: TLD_PRICES.find(t=>t.ext===ext)?.price?.replace('$','') || '21.99', currency:'$', period:'yr', specs:[`${ext} domain`,'Free WHOIS privacy','Managed DNS'] };
  document.getElementById('modal-title').textContent = `Register ${ext} Domain`;
  document.getElementById('modal-body').innerHTML = `
    <div class="form-group"><label class="form-label">Domain Name</label><input id="order-domain" class="form-control" type="text" placeholder="${ext.replace('.','')}.com"></div>
    <p style="font-size:.82rem;color:var(--muted)">Includes free WHOIS privacy, managed DNS and auto-renew.</p>`;
  document.getElementById('purchase-modal').classList.add('open');
}

function orderDomainName(domain) {
  selectedPlan = { name: domain, amount:'21.99', currency:'$', period:'yr', specs:['Free WHOIS privacy','Managed DNS'] };
  document.getElementById('modal-title').textContent = `Register ${domain}`;
  document.getElementById('modal-body').innerHTML = `<p style="color:var(--muted)">Register <strong style="color:var(--text)">${esc(domain)}</strong> for $21.99/yr including free WHOIS privacy.</p>`;
  document.getElementById('purchase-modal').classList.add('open');
}

function orderNumber(number) {
  selectedPlan = { name:'Virtual Number', amount:'5.99', currency:'$', period:'mo', specs:[number,'SMS + Voice','WhatsApp-ready'] };
  document.getElementById('modal-title').textContent = `Order Number ${number}`;
  document.getElementById('modal-body').innerHTML = `<p style="color:var(--muted)">Purchase <strong style="color:var(--text)">${esc(number)}</strong> for $5.99/mo with SMS + Voice capabilities.</p>`;
  document.getElementById('purchase-modal').classList.add('open');
}

// ── Toast ──
function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  Object.assign(t.style, { position:'fixed', bottom:'1.5rem', right:'1.5rem', background:'var(--card)', border:'1px solid var(--accent2)', borderRadius:'10px', padding:'.75rem 1.25rem', color:'var(--text)', fontSize:'.875rem', fontWeight:'600', zIndex:1000, boxShadow:'0 8px 24px rgba(0,0,0,.4)', animation:'modalIn .2s ease' });
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  const email = localStorage.getItem('management_email') || '';
  const emailEl = document.getElementById('sidebar-email');
  const avatarEl = document.getElementById('sidebar-avatar');
  if (emailEl) emailEl.textContent = email;
  if (avatarEl && email) avatarEl.textContent = email[0].toUpperCase();

  // Check URL param
  const cat = new URLSearchParams(location.search).get('cat') || 'vps-small';
  // Find and click corresponding sub button
  const subBtn = document.querySelector(`.store-sub-btn[onclick*="${cat}"]`);
  if (subBtn) {
    const group = subBtn.closest('.store-cat-group');
    const catBtn = group?.querySelector('.store-cat-btn');
    const subsId = catBtn?.getAttribute('onclick')?.match(/'([^']+)'\)/)?.[1];
    if (subsId) {
      document.querySelectorAll('.store-sub-items').forEach(el => el.classList.remove('open'));
      document.querySelectorAll('.store-cat-btn').forEach(el => el.classList.remove('open', 'active'));
      document.getElementById(subsId)?.classList.add('open');
      catBtn?.classList.add('open', 'active');
      subBtn.click();
    }
  } else {
    renderRight('vps-small');
  }
});
</script>
