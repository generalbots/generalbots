<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Management</title>
  <link rel="stylesheet" href="css/management.css">
</head>
<body class="mgmt-layout">
  <div class="mgmt-shell">
    <nav class="saas-nav">
      <div class="saas-nav-brand">Management</div>
      <div class="saas-nav-links">
        <a href="/management/dashboard" class="nav-link">Dashboard</a>
        <a href="/management/plans" class="nav-link">Plans</a>
        <a href="/management/store" class="nav-link">Store</a>
        <a href="/management/services" class="nav-link">Services</a>
        <a href="/management/invoices" class="nav-link">Invoices</a>
        <a href="/management/profile" class="nav-link active">Profile</a>
      </div>
      <div class="saas-nav-user">
        <span id="user-email"></span>
        <button onclick="doLogout()" class="btn-text">Sign Out</button>
      </div>
    </nav>
    <div class="mgmt-body">
      <div class="saas-header">
        <h1>Profile</h1>
      </div>
      <div class="profile-section">
        <div class="saas-auth-card" style="max-width:600px;margin:0">
          <form id="profile-form">
            <div class="form-group">
              <label for="profile-name">Name</label>
              <input type="text" id="profile-name" required placeholder="Your name">
            </div>
            <div class="form-group">
              <label for="profile-email">Email</label>
              <input type="email" id="profile-email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
              <label for="profile-company">Company</label>
              <input type="text" id="profile-company" placeholder="Your company">
            </div>
            <button type="submit" class="btn-primary btn-block">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="js/management-profile.js"></script>
</body>
</html>
