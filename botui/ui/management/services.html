<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Services — General Bots Management</title>
  <link rel="stylesheet" href="css/management.css">
</head>
<body class="mgmt-layout">
<div class="mgmt-shell">

  <nav class="mgmt-sidebar">
    <div class="mgmt-logo"><a href="/management" class="mgmt-logo-mark"><div class="mgmt-logo-icon">🤖</div><div><div class="mgmt-logo-text">General Bots</div><span class="mgmt-logo-sub">Management</span></div></a></div>
    <nav class="mgmt-nav">
      <div class="mgmt-nav-section">Overview</div>
      <a href="/management/dashboard" class="mgmt-nav-link"><span class="mgmt-nav-icon">📊</span> Dashboard</a>
      <div class="mgmt-nav-section">Add-ons</div>
      <a href="/management/store" class="mgmt-nav-link"><span class="mgmt-nav-icon">🏪</span> App Store</a>
      <a href="/management/plans" class="mgmt-nav-link"><span class="mgmt-nav-icon">🚀</span> Plans &amp; Pricing</a>
      <a href="/management/offers" class="mgmt-nav-link"><span class="mgmt-nav-icon">🏷️</span> Special Offers</a>
      <div class="mgmt-nav-section">Infrastructure</div>
      <a href="/management/store?cat=compute" class="mgmt-nav-link"><span class="mgmt-nav-icon">🖥️</span> Computers / VPS</a>
      <a href="/management/store?cat=storage" class="mgmt-nav-link"><span class="mgmt-nav-icon">💾</span> Storage</a>
      <a href="/management/store?cat=domains" class="mgmt-nav-link"><span class="mgmt-nav-icon">🌐</span> Domains</a>
      <a href="/management/store?cat=comms" class="mgmt-nav-link"><span class="mgmt-nav-icon">📞</span> SMS &amp; Numbers</a>
      <div class="mgmt-nav-section">Account</div>
      <a href="/management/services" class="mgmt-nav-link active"><span class="mgmt-nav-icon">📦</span> My Services</a>
      <a href="/management/invoices" class="mgmt-nav-link"><span class="mgmt-nav-icon">📄</span> Invoices</a>
      <a href="/management/payment-cards" class="mgmt-nav-link"><span class="mgmt-nav-icon">💳</span> Payment Cards</a>
      <a href="/management/profile" class="mgmt-nav-link"><span class="mgmt-nav-icon">👤</span> My Profile</a>
    </nav>
    <div class="mgmt-sidebar-footer"><div class="mgmt-user-chip"><div class="mgmt-avatar" id="sidebar-avatar">?</div><span class="mgmt-user-email" id="sidebar-email">…</span><button class="mgmt-logout" onclick="doLogout()" title="Sign out">⎋</button></div></div>
  </nav>

  <main class="mgmt-main">
    <div class="mgmt-topbar">
      <span class="mgmt-page-title">My Services</span>
      <div class="mgmt-topbar-actions">
        <a href="/management/store" class="btn btn-primary btn-sm">+ Add Service</a>
      </div>
    </div>

    <div style="padding:2rem">
      <!-- Filter tabs -->
      <div class="cat-pills" id="filter-pills">
        <button class="cat-pill active" onclick="filterServices(this,'all')">All</button>
        <button class="cat-pill" onclick="filterServices(this,'compute')">🖥️ VPS / GPU</button>
        <button class="cat-pill" onclick="filterServices(this,'storage')">💾 Storage</button>
        <button class="cat-pill" onclick="filterServices(this,'number')">📞 Numbers</button>
        <button class="cat-pill" onclick="filterServices(this,'domain')">🌐 Domains</button>
      </div>

      <div class="services-list" id="services-list">
        <div class="mgmt-empty"><div class="loading-dots"><span></span><span></span><span></span></div></div>
      </div>
    </div>
  </main>
</div>
<script src="js/management-services.js"></script>
</body>
</html>
