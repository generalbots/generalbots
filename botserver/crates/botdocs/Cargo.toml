[package]
name = "botdocs"
version.workspace = true
edition = "2021"
description = "General Bots document processing, collaboration, and conversion"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botlib = { workspace = true, features = ["database"] }
botuifragments = { workspace = true }
axum = { workspace = true, features = ["ws", "multipart", "macros"] }
base64 = { workspace = true }
botsecurity-core = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
diesel = { workspace = true, features = ["postgres", "r2d2"] }
docx-rs = { workspace = true }
calamine = { workspace = true }
futures-util = { workspace = true, features = ["sink"] }
log = { workspace = true }
once_cell = { workspace = true }
ooxmlsdk = { workspace = true, features = ["parts"] }
pdf-extract = { workspace = true }
quick-xml = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
r2d2 = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
uuid = { workspace = true, features = ["serde", "v4"] }
zip = { workspace = true }

[dev-dependencies]
hmac = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
