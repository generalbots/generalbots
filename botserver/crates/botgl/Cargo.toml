[package]
name = "botgl"
version = "6.5.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
diesel = { version = "2", features = ["postgres", "r2d2", "uuid", "serde_json", "chrono", "numeric"] }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
rust_decimal = { workspace = true, features = ["serde-with-str", "db-diesel2-postgres"] }
