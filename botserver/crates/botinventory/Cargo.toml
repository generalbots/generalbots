[package]
name = "botinventory"
version = "6.5.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
diesel = { version = "2", features = ["postgres", "uuid", "serde_json", "chrono", "numeric"] }
axum = { version = "0.7", features = ["macros"] }
log = "0.4"
rust_decimal = { version = "1.36", default-features = false, features = ["serde-with-str"] }
