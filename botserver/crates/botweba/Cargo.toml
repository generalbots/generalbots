[package]
name = "botweba"
version.workspace = true
edition = "2021"
description = "General Bots web application builder"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
axum = { workspace = true, features = ["macros"] }
botcontacts = { workspace = true }
botcore = { workspace = true }
botsecurity-auth = { workspace = true }
botsecurity-core = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "chrono", "serde_json", "uuid"] }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[lints]
workspace = true
