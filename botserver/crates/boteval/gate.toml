# The Vibe benchmark CI gate lives in ONE file only:
#
#     botserver/crates/boteval/ci/gate.toml
#
# Both consumers read that copy:
#   - .github/workflows/boteval.yml  (--gate botserver/crates/boteval/ci/gate.toml)
#   - botserver/crates/boteval/src/ci_gate.rs (include_str!("../ci/gate.toml"))
#
# Editing THIS file does nothing — it is a stub to prevent re-divergence
# (#1345: the two copies had drifted to different max_cost_per_task and
# required_tags, so a run could pass locally and fail in CI with no hint).
# The intended thresholds and the required tag set are documented in
# ci/gate.toml itself.

# Documented values of the authoritative config (ci/gate.toml):
#   min_pass_rate          = 0.95
#   max_failures           = 0
#   required_tags          = ["software_development", "customer_support", "financial_analysis", "general", "harness"]
#   tag_pass_rates         = 0.90 for every required tag
#   max_cost_per_task      = 0.05   (USD; 0 disables the check)
#   harness_min_tool_calls = 2
