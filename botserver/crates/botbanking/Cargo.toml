[package]
name = "botbanking"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Banking reconciliation and delivery-platform integration."

[dependencies]
botcore = { workspace = true }
botlib = { path = "../../../botlib" }
bottax = { path = "../bottax" }
chrono = { workspace = true, features = ["serde"] }
rust_decimal = { workspace = true, features = ["serde-with-str", "db-diesel2-postgres"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
axum = { workspace = true, features = ["macros"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "serde_json", "chrono", "uuid", "numeric"] }

[lints]
workspace = true
