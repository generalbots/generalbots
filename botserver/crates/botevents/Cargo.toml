[package]
name = "botevents"
version.workspace = true
edition = "2021"
description = "General Bots run event contract: envelope, sequencer, validation and redaction"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
chrono = { workspace = true, features = ["serde", "clock"] }
regex = { workspace = true }
