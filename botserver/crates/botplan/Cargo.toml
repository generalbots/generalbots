[package]
name = "botplan"
version.workspace = true
edition = "2021"
description = "General Bots project planner (Gantt + Kanban) with real-time collaboration"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
axum = { workspace = true }
botlib = { workspace = true, features = ["database", "i18n"] }
botllm = { workspace = true }
botsecurity-core = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "chrono", "serde_json", "uuid"] }
futures-util = { workspace = true }
log = { workspace = true }
rand = { workspace = true, features = ["thread_rng"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
