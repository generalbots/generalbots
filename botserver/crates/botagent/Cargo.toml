[package]
name = "botagent"
version.workspace = true
edition = "2021"
publish = false
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botschema = { workspace = true, features = ["agents"] }
base64 = { workspace = true }
regex = { workspace = true }
jsonwebtoken = { workspace = true }
axum = { workspace = true }
botcore = { workspace = true }
botlib = { workspace = true, features = ["database"] }
botsecurity-core = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "chrono", "serde_json", "uuid"] }
diesel_migrations = { workspace = true }
r2d2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "serde"] }

# Reads the WSL registration keys (no process, does not boot the VM).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[lints]
workspace = true
