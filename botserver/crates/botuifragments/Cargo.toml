[package]
name = "botuifragments"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "HTMX UI fragment routes for bot apps."

[dependencies]
axum = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "serde_json", "chrono", "uuid", "numeric"] }
rust_decimal = { workspace = true, features = ["serde-with-str", "db-diesel2-postgres"] }
botcore = { workspace = true }
bottax = { workspace = true }
botminutes = { workspace = true }
bottimeclock = { workspace = true }

[lints]
workspace = true
