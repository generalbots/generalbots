[package]
name = "botcorepkg"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[features]
default = []

[dependencies]
botlib = { workspace = true }
botcoresecrets = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
chrono = { workspace = true }
diesel = { workspace = true, features = ["postgres", "r2d2", "chrono", "serde_json", "uuid"] }
r2d2 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
dotenvy = { workspace = true }
zip = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }

# Desktop stack hardening: DPAPI for secret files and the owner of a listening
# port (same windows-sys version already in the lock file).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
