[package]
name = "botcanvas"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botschema = { workspace = true, features = ["canvas"] }
botlib = { workspace = true, features = ["database"] }
axum = { workspace = true, features = ["ws", "multipart", "macros"] }
botsecurity-core = { workspace = true }
chrono = { workspace = true, features = ["clock", "std", "serde"] }
diesel = { workspace = true, features = ["postgres", "uuid", "chrono", "serde_json", "r2d2", "numeric", "32-column-tables"] }
r2d2 = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
log = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "serde"] }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
futures-util = { workspace = true }
once_cell = { workspace = true }

[lints]
workspace = true
