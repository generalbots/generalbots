[package]
name = "botconnectors"
version = "0.1.0"
edition = "2021"
description = "Enterprise knowledge connectors - permissioned indexing, redaction and search backend over external chat, mail and drive sources."
license = "AGPL-3.0"
authors = ["Pragmatismo.com.br", "General Bots Community"]
repository = "https://github.com/GeneralBots/BotServer"

[dependencies]
axum = { workspace = true }
botcore = { workspace = true }
botcoresecrets = { path = "../botcoresecrets" }
chrono = { workspace = true, features = ["serde", "clock"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "uuid", "chrono", "serde_json"] }
r2d2 = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]

[lints]
workspace = true
