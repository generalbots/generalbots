# Rust error-handling ratchet baseline (issue #2543).
# Shrink-only ceiling generated by scripts/check_rust_error_ratchet.py.
# [rules] counts are textual proxies in non-test Rust, NOT clippy diagnostics.
# [files] is a truncated top-50 hotspot snapshot; only [rules] totals are gated.
# Fix production sites, then run `python3 scripts/check_rust_error_ratchet.py --update`.
# Never raise a number by hand: the guard refuses growth.

issue = 2543
scope = [
    "botserver/src",
    "botserver/crates",
]

[rules]
unwrap = 0
expect = 0
panic = 0
unwrap_or_default = 2305
discarded_result = 1353

# Blocking clippy baseline (issue #2543). Unlike [rules] above, these are real
# `cargo clippy --message-format=json` diagnostics, not textual proxies. They
# are counted only in non-test production files under `botserver/src` and
# `botserver/crates` by scripts/check_clippy_baseline.py. The text ratchet has
# driven all three to zero in scope, so any occurrence is a regression.
# Shrink-only: lower a number after fixing sites; never raise one by hand.
[clippy]
unwrap_used = 0
expect_used = 0
panic = 0

[rule_notes]
unwrap = "calls to .unwrap(...)"
expect = "calls to .expect(...)"
panic = "panic! macro invocations"
unwrap_or_default = ".unwrap_or_default(...) calls (Result and Option)"
discarded_result = ".ok(); statements and let _ = ...; bindings"

