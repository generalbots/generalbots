# Portable CPU build. get_llama_cpp_url() falls back to this component when the
# host has no Vulkan (no /usr/share/vulkan, no VULKAN_SDK); without it the local
# model was silently unavailable on plain servers and CI runners.
# NOTE: the v0.9.0 release publishes no binary assets; b7345 is the newest
# release that still ships the platform archives used here.
[components.llm]
name = "Llama.cpp Server (Linux x64 CPU)"
