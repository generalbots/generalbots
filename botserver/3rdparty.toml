# Third-Party Dependencies Configuration
# ======================================
# This file lists all external downloads required by botserver.
#
# Caching Behavior:
# - On first run, files are downloaded from the URLs below
# - Downloaded files are cached in ./botserver-installers/
# - On subsequent runs, cached files are used instead of downloading
# - To force re-download, delete the cached file
#
# Offline Installation:
# - Pre-download all files to ./botserver-installers/
# - The installer will use cached files automatically
# - You can safely delete ./botserver-stack/ without losing downloads

[cache_settings]
# Directory where downloaded files are cached (relative to botserver root)
cache_dir = "botserver-installers"

# Bundled legacy installer copies (#A3 offline-first-boot audit). Each digest
# is the upstream-published checksum; Qdrant 1.12.0 publishes none, so its hash
# was computed from the official release asset (byte-identical to the cache).
[components]
alm_10_0_1_cached = { name = "Forgejo 10.0.1 (bundled cache copy)", url = "https://codeberg.org/forgejo/forgejo/releases/download/v10.0.1/forgejo-10.0.1-linux-amd64", filename = "forgejo-10.0.1-linux-amd64", sha256 = "0256a95f6592f1d55149a5a0a7d2a5ca6b583d9ca1031e9c66f93562e0fcae06" }
alm_ci_6_0_0_cached = { name = "Forgejo runner 6.0.0 (bundled cache copy)", url = "https://code.forgejo.org/forgejo/runner/releases/download/v6.0.0/forgejo-runner-6.0.0-linux-amd64", filename = "forgejo-runner-6.0.0-linux-amd64", sha256 = "59124ed0a086a4d48a582dfb6919dfb93f5a6aea59a0ec63b8d326099f83f67d" }
tables_17_2_0_cached = { name = "PostgreSQL 17.2.0 (bundled cache copy)", url = "https://github.com/theseus-rs/postgresql-binaries/releases/download/17.2.0/postgresql-17.2.0-x86_64-unknown-linux-gnu.tar.gz", filename = "postgresql-17.2.0-x86_64-unknown-linux-gnu.tar.gz", sha256 = "c5a214f3ffc71018877a11c0e105177e524ecd33fc77db65a92eba02c2acfbd8" }
vector_db_1_12_0_cached = { name = "Qdrant 1.12.0 gnu (bundled cache copy)", url = "https://github.com/qdrant/qdrant/releases/download/v1.12.0/qdrant-x86_64-unknown-linux-gnu.tar.gz", filename = "qdrant-x86_64-unknown-linux-gnu.tar.gz", sha256 = "1417ca7f2c1933c1275e97cbf57ed9a1224b99d500be2a9ed6ef939f5eef8835" }
cache_8_1_5_cached = { name = "Valkey 8.1.5 (bundled cache copy)", url = "https://download.valkey.io/releases/valkey-8.1.5-jammy-x86_64.tar.gz", filename = "valkey-8.1.5-jammy-x86_64.tar.gz", sha256 = "9f5b1fc5c4599e71dc03de5bc4fe1c619d6881d0230f9877b3d470c36a635789" }
vault_1_18_2_cached = { name = "Vault 1.18.2 (bundled cache copy)", url = "https://releases.hashicorp.com/vault/1.18.2/vault_1.18.2_linux_amd64.zip", filename = "vault_1.18.2_linux_amd64.zip", sha256 = "a448c8b6839d76ec54fa320d3a558ff0e5ef0c3d27ea78c88ace333461d7264b" }

# Components
# ==========
# Each component has:
# - url: Download URL
# - filename: Local filename in cache
# - sha256: Optional checksum for verification (empty = skip verification)
[components.drive]
name = "MinIO Object Storage"
# #2612 — CVE-2025-62506 is fixed in RELEASE.2025-10-15T17-29-55Z, but that
# upstream release publishes **no binary assets** (the GitHub release contains
# only source archives and dl.min.io answers 410 Gone). The last published
# binary is vulnerable, so every download URL here is intentionally empty:
# no install path can fetch it. Fresh installs use the binary built from the
# pinned source by scripts/build-minio-fixed.sh and shipped in the offline
# installer cache (the cache copy is authoritative).
url = ""
url_win = ""
url_arm64 = ""
filename = "minio"
filename_win = "minio.exe"
filename_arm64 = "minio"
# Provenance of the fixed binary. Upstream publishes no binary checksum, so
# integrity is anchored to the immutable GitHub source archive that the build
# script downloads and verifies before compiling. `source_sha256` was obtained
# by fetching that exact archive twice on 2026-11-23; both copies were byte
# identical and hashed to the value below. The script then writes the digest
# of the resulting binary to `minio.sha256` beside the cached binary.
source_tag = "RELEASE.2025-10-15T17-29-55Z"
source_commit = "9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a"
source_url = "https://github.com/minio/minio/archive/refs/tags/RELEASE.2025-10-15T17-29-55Z.tar.gz"
source_sha256 = "be6d0bd3696c3a13a35f02d3a0280b64319c67918b4501c5c3d87f96d000085c"
build_script = "scripts/build-minio-fixed.sh"
cve_fixed = "CVE-2025-62506"
# No binary digest can be pinned offline: it depends on the Go toolchain used
# at build time. The gate verifies the source pin above and the sidecar the
# build script writes; a hardcoded binary hash here would be fabricated.
sha256 = ""
sha256_arm64 = ""
sha256_win = ""


