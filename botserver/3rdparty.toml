# These are alternative builds for different platforms/GPU support.
# The Windows builds are pinned to b12483: b7345 cannot open the model
# families published after it (Qwen3.5 fails with "unknown model
# architecture"). Linux and macOS stay on b7345 until they are verified.

[components.llm_linux_vulkan]
name = "Llama.cpp Server (Linux Vulkan)"
