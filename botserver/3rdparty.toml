# Third-Party Dependencies Configuration
# ======================================
# This file lists all external downloads required by botserver.
#
# Caching Behavior:
# - On first run, files are downloaded from the URLs below
# - Downloaded files are cached in ./botserver-installers/
# - On subsequent runs, cached files are used instead of downloading
# - To force re-download, delete the cached file
#
# Offline Installation:
# - Pre-download all files to ./botserver-installers/
# - The installer will use cached files automatically
# - You can safely delete ./botserver-stack/ without losing downloads

[cache_settings]
# Directory where downloaded files are cached (relative to botserver root)
cache_dir = "botserver-installers"

# Components
# ==========
# Each component has:
# - url: Download URL
# - filename: Local filename in cache
# - sha256: Optional checksum for verification (empty = skip verification)
[components.drive]
name = "MinIO Object Storage"
# dl.min.io was shut down (HTTP 410 Gone, 2025-10); the archived release
# assets on GitHub remain the only official source of the binary.
# NOTE: RELEASE.2025-10-15 (the CVE-2025-62506 fix) has **no binary assets**
# (GitHub release is empty and dl.min.io returns 410). Production runs the
# binary built from the official source tag with scripts/build-minio-fixed.sh
# (tag RELEASE.2025-10-15T17-29-55Z, commit 9e49d5e7a648); this URL stays on
# the last published binary for fresh installs until upstream ships assets.
url = "https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z"
