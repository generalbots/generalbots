# BotModels: Python inference service shipped as a self-contained pythonbox
# (relocatable CPython + service sources). The archive unpacks into
# bin/botmodels/ and resolves its own virtual environment with
# ./install.sh on first start (torch-sized dependencies are not vendored).
# Optional: the first-run wizard only provisions it when
# GB_WIZARD_WITH_BOTMODELS=1; `./install.sh --with jupyter` adds JupyterLab.
#
# `{tag}` is resolved at install time to the newest release that carries the
# file: releases are immutable, so every build publishes its own tag
# (pythonbox-<UTC stamp>-<sha7>) instead of overwriting a stable one.
[components.botmodels]
name = "BotModels Python Service (pythonbox)"
url = "https://github.com/generalbots/generalbots/releases/download/{tag}/botmodels-pythonbox-linux-x86_64.tar.gz"
filename = "botmodels-pythonbox-linux-x86_64.tar.gz"
url_win = "https://github.com/generalbots/generalbots/releases/download/{tag}/botmodels-pythonbox-windows-x86_64.zip"
filename_win = "botmodels-pythonbox-windows-x86_64.zip"
sha256 = ""
# The pythonbox-* releases carry the Linux tarball and the Windows zip. There
# is no aarch64 archive, so the resolver has no url_arm64 to select; on Linux
# arm64 the wizard reports media (vision/STT/TTS) as unavailable instead of
# downloading an archive the host cannot run.

