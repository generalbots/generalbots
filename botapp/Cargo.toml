[package]
name = "botapp"
version.workspace = true
edition = "2021"
description = "General Bots App - Tauri wrapper for desktop/mobile"
license = "MIT"
repository = "https://github.com/generalbots/generalbots"
readme = "README.md"
keywords = ["bot", "ai", "chatbot", "tauri", "desktop"]
categories = ["gui", "network-programming"]

# Tauri links the Rust side as a native library on mobile: Android needs a
# cdylib (libbotapp.so), iOS a staticlib. Keep rlib so desktop integration
# tests and the existing lib target consumers continue to work unchanged.
[lib]
name = "botapp"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Mobile logging is initialised directly with env_logger in `mobile/mod.rs`.
# botlib (which pulls diesel + pq-sys and the host libpq) is deliberately NOT a
# mobile dependency: an x86_64 libpq on the aarch64 Android cross-link makes lld
# reject `--fix-cortex-a53-843419`. It is gated to non-mobile targets below.
env_logger = { workspace = true }

# ─── TAURI 2.12 (Desktop/Mobile) ───
# #2009 — 2.12 + tauri-plugin-http 2.8 move tauri-utils to urlpattern 0.6,
# which drops the whole unimplemented unic-* family (5 advisories).
tauri = { version = "2.12", features = ["tray-icon", "image-ico", "image-png", "unstable"] }
tauri-build = "2.6"
tauri-plugin-dialog = "2.7"
tauri-plugin-notification = "2.8"
tauri-plugin-http = "2.8"
opener = "0.7"
tauri-plugin-geolocation = "2.3"

# Common
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
dirs = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
# #1633 — self-extracting payload (trailer + tar.zst).
tar = { workspace = true }
zstd = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Desktop-only: botvideo's SafeCommand is used by the system tray. It pulls
# diesel + pq-sys, so exclude it from mobile cross-links (Android/iOS have no
# host libpq). The desktop module itself is gated off on `feature = "mobile"`.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
botvideo = { workspace = true }
# Core helpers (SafeCommand, compact logger) are used only by the desktop
# module, which is itself compiled only on non-mobile targets. Keeping botlib
# here excludes diesel/pq-sys/libpq from the Android and iOS cross-links.
botlib = { workspace = true, default-features = false, features = ["http-client", "i18n"] }

# Unix process control
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
thiserror = { workspace = true }

[features]
default = ["desktop"]
desktop = ["desktop-tray"]
desktop-tray = []
desktop-local = []
# Government desktop edition: the desktop build with its own product file.
gbgov = ["desktop-local"]
# #1925: thin client (UI only, remote botserver) and mobile targets.
#
# Both select the dedicated `mobile` module in main.rs: the WebView renders the
# suite from a validated remote origin and no desktop code (sidecar, wizard,
# tray, sync/download/drive commands) is compiled. No new dependency is needed:
# the module reuses `tauri`, `serde_json`, `opener` and `botlib` already present.
# `mobile` also selects the bundled-asset protocol used by packaged builds.
thin-client = ["mobile"]
mobile = ["custom-protocol"]
# Production-style asset embedding. `tauri build` enables it; a debug build
# with it serves the bundled suite/wizard instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0", features = ["v2_40"] }
