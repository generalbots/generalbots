[package]
name = "botapp"
version.workspace = true
edition = "2021"
description = "General Bots App - Tauri wrapper for desktop/mobile"
license = "MIT"
repository = "https://github.com/generalbots/generalbots"
readme = "README.md"
keywords = ["bot", "ai", "chatbot", "tauri", "desktop"]
categories = ["gui", "network-programming"]

[dependencies]
# Core from botlib
botlib = { workspace = true, features = ["http-client"] }
botvideo = { workspace = true }


# ─── TAURI 2.12 (Desktop/Mobile) ───
# #2009 — 2.12 + tauri-plugin-http 2.8 move tauri-utils to urlpattern 0.6,
# which drops the whole unimplemented unic-* family (5 advisories).
tauri = { version = "2.12", features = ["tray-icon", "image-ico", "image-png", "unstable"] }
tauri-build = "2.6"
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-notification = "2.3"
tauri-plugin-http = "2.8"
tauri-plugin-geolocation = "2.3"

# Common
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
dirs = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
# #1633 — self-extracting payload (trailer + tar.zst).
tar = { workspace = true }
zstd = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Unix process control
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
image = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["desktop"]
desktop = ["desktop-tray"]
desktop-tray = []
desktop-local = []
# #1925: thin client (UI only, remote botserver) and mobile targets — stubs
thin-client = []
mobile = []
# Production-style asset embedding. `tauri build` enables it; a debug build
# with it serves the bundled suite/wizard instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0", features = ["v2_40"] }
